# =============================================================================
# Ansible Galaxy Requirements
# =============================================================================
# Install: ansible-galaxy collection install -r requirements.yml
# =============================================================================

collections:
  # AUR package management for Arch Linux hosts
  - name: kewlfft.aur
    version: ">=0.13.0"

  # Docker container and network management
  - name: community.docker
    version: ">=4.0.0"

  # General modules (homebrew, pacman, etc.)
  - name: community.general
    version: ">=10.0.0"

  # POSIX host modules (sysctl, mount helpers, etc.)
  - name: ansible.posix
    version: ">=2.0.0"

  # Windows host management over SSH/PowerShell
  - name: ansible.windows
    version: ">=3.0.0"

  # Windows scheduled task management
  - name: community.windows
    version: ">=3.0.0"
