---
- name: Select reachable Windows hosts for gaming monitoring
  hosts: localhost
  gather_facts: false

  vars:
    windows_reachable_target_group: windows_gaming_monitoring_targets

  tasks:
    - name: Build reachable Windows gaming monitoring host group
      ansible.builtin.import_tasks: ../tasks/windows-reachable-hosts.yml

- name: Manage Windows gaming monitoring and Defender exclusions
  hosts: windows_gaming_monitoring_targets
  gather_facts: false

  tasks:
    - name: Apply Microsoft Defender gaming exclusions
      ansible.windows.win_powershell:
        parameters:
          ExclusionPaths: "{{ windows_gaming_defender_exclusion_paths | default([]) }}"
          ExclusionProcesses: "{{ windows_gaming_defender_exclusion_processes | default([]) }}"
        script: |
          [CmdletBinding(SupportsShouldProcess)]
          param(
              [string[]]$ExclusionPaths,
              [string[]]$ExclusionProcesses
          )

          $Ansible.Changed = $false
          $results = @()
          $preference = Get-MpPreference
          $currentPaths = @($preference.ExclusionPath)
          $currentProcesses = @($preference.ExclusionProcess)

          foreach ($path in $ExclusionPaths) {
              if (-not $path) {
                  continue
              }

              $exists = $currentPaths -contains $path
              if (-not $exists) {
                  $Ansible.Changed = $true
                  if (-not $Ansible.CheckMode) {
                      Add-MpPreference -ExclusionPath $path -ErrorAction Stop
                  }
              }

              $results += [pscustomobject]@{
                  Type = 'Path'
                  Value = $path
                  AlreadyPresent = $exists
                  Changed = -not $exists
              }
          }

          foreach ($process in $ExclusionProcesses) {
              if (-not $process) {
                  continue
              }

              $exists = $currentProcesses -contains $process
              if (-not $exists) {
                  $Ansible.Changed = $true
                  if (-not $Ansible.CheckMode) {
                      Add-MpPreference -ExclusionProcess $process -ErrorAction Stop
                  }
              }

              $results += [pscustomobject]@{
                  Type = 'Process'
                  Value = $process
                  AlreadyPresent = $exists
                  Changed = -not $exists
              }
          }

          $results

    - name: Ensure Windows gaming monitor directories exist
      ansible.windows.win_file:
        path: "{{ item }}"
        state: directory
      loop:
        - "{{ windows_gaming_monitor_script_dir }}"
        - "{{ windows_gaming_monitor_state_dir }}"
        - "{{ windows_gaming_monitor_capture_dir }}"

    - name: Install Windows gaming capture script
      ansible.windows.win_template:
        src: ../templates/windows-gaming-capture.ps1.j2
        dest: "{{ windows_gaming_monitor_script_dir }}\\windows-gaming-capture.ps1"

    - name: Remove legacy Windows gaming monitor script directories
      ansible.windows.win_powershell:
        parameters:
          LegacyScriptDirs: "{{ windows_gaming_monitor_legacy_script_dirs | default([]) }}"
        script: |
          [CmdletBinding(SupportsShouldProcess)]
          param([string[]]$LegacyScriptDirs)

          $Ansible.Changed = $false
          foreach ($path in $LegacyScriptDirs) {
              if (-not $path) {
                  continue
              }
              if ($path -notlike 'C:\Users\jn\Nextcloud\Scripts\*') {
                  throw "Refusing to remove unexpected legacy script path: $path"
              }
              if (Test-Path -LiteralPath $path) {
                  $Ansible.Changed = $true
                  if (-not $Ansible.CheckMode) {
                      Remove-Item -LiteralPath $path -Recurse -Force
                  }
              }
          }
