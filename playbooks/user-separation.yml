# =============================================================================
# User Separation Playbook - Create dedicated ansible and dbc users
# =============================================================================
# Migrates from single 'johnny' user to three-user model:
#   - ansible: Automation user with NOPASSWD sudo (used by Ansible)
#   - johnny:  Human interactive user with password-based sudo
#   - dbc:     OpenClaw agent user with limited read-only sudo
#
# Run order:
#   1. Run this playbook (creates ansible + dbc users)
#   2. Test Ansible connectivity as 'ansible' user
#   3. Update inventory: ansible_user=ansible
#   4. Run Phase 2 to secure johnny's sudo (separate run after verification)
#
# Usage:
#   ansible-playbook playbooks/user-separation.yml --limit ts440  # test on one host
#   ansible-playbook playbooks/user-separation.yml                # all hosts
# =============================================================================

# ============================================================
# Phase 1: Create ansible automation user
# ============================================================
- name: "Phase 1: Create ansible automation user"
  hosts: linux_hosts
  become: true
  gather_facts: true

  vars:
    ansible_pubkey_path: "~/.ssh/ansible_ed25519.pub"
    automation_user: ansible

  tasks:
    - name: Create ansible automation user
      ansible.builtin.user:
        name: "{{ automation_user }}"
        shell: /bin/bash
        system: false
        create_home: true
        comment: "Ansible automation"
      tags: [ansible-user]

    - name: Ensure .ssh directory for ansible user
      ansible.builtin.file:
        path: "/home/{{ automation_user }}/.ssh"
        state: directory
        owner: "{{ automation_user }}"
        group: "{{ automation_user }}"
        mode: "0700"
      tags: [ansible-user]

    - name: Deploy Ansible SSH key to ansible user
      ansible.posix.authorized_key:
        user: "{{ automation_user }}"
        key: "{{ lookup('file', ansible_pubkey_path) }}"
        state: present
      tags: [ansible-user]

    - name: Configure passwordless sudo for ansible user
      ansible.builtin.copy:
        content: |
          # Passwordless sudo for Ansible automation
          {{ automation_user }} ALL=(ALL) NOPASSWD: ALL
        dest: "/etc/sudoers.d/ansible-automation"
        owner: root
        group: root
        mode: "0440"
        validate: "visudo -cf %s"
      tags: [ansible-user]

# ============================================================
# Phase 1b: Create dbc (OpenClaw) user
# ============================================================
# Authentication: Tailscale SSH (no SSH keys needed)
# ACL rule required in Tailscale admin:
#   src: tag:openclaw, dst: tag:vms-lxcs + tag:servers + tag:orchestrators, users: dbc
# ============================================================
- name: "Phase 1b: Create dbc (OpenClaw) user"
  hosts: linux_hosts
  become: true
  gather_facts: true

  vars:
    openclaw_user: dbc

  tasks:
    - name: Create dbc user
      ansible.builtin.user:
        name: "{{ openclaw_user }}"
        shell: /bin/bash
        system: false
        create_home: true
        comment: "OpenClaw agent (Double-C)"
        # Random password unlocks the account so sudo NOPASSWD rules work.
        # Debian sudo refuses NOPASSWD for locked accounts (! in /etc/shadow).
        # Nobody knows this password — dbc authenticates via Tailscale SSH only.
        password: "{{ lookup('pipe', 'openssl rand -base64 32') | password_hash('sha512') }}"
        update_password: on_create
      tags: [dbc-user]

    - name: Add dbc to systemd-journal group
      ansible.builtin.user:
        name: "{{ openclaw_user }}"
        groups: systemd-journal
        append: true
      tags: [dbc-user]

    - name: Configure limited read-only sudo for dbc
      ansible.builtin.copy:
        content: |
          # OpenClaw agent (dbc) - read-only sudo commands only
          # Each command needs two rules: one for no-args, one for with-args
          {{ openclaw_user }} ALL=(ALL) NOPASSWD: /usr/bin/systemctl status
          {{ openclaw_user }} ALL=(ALL) NOPASSWD: /usr/bin/systemctl status *
          {{ openclaw_user }} ALL=(ALL) NOPASSWD: /usr/bin/journalctl
          {{ openclaw_user }} ALL=(ALL) NOPASSWD: /usr/bin/journalctl *
          {{ openclaw_user }} ALL=(ALL) NOPASSWD: /usr/sbin/zpool status
          {{ openclaw_user }} ALL=(ALL) NOPASSWD: /usr/sbin/zpool status *
          {{ openclaw_user }} ALL=(ALL) NOPASSWD: /usr/sbin/zfs list
          {{ openclaw_user }} ALL=(ALL) NOPASSWD: /usr/sbin/zfs list *
          {{ openclaw_user }} ALL=(ALL) NOPASSWD: /usr/bin/findmnt
          {{ openclaw_user }} ALL=(ALL) NOPASSWD: /usr/bin/findmnt *
        dest: "/etc/sudoers.d/dbc-readonly"
        owner: root
        group: root
        mode: "0440"
        validate: "visudo -cf %s"
      tags: [dbc-user]

# ============================================================
# Phase 1c: Ansible dry-run wrapper (ansible-lxc only)
# ============================================================
- name: "Phase 1c: Deploy ansible dry-run wrapper"
  hosts: ansible-lxc
  become: true
  gather_facts: false

  tasks:
    - name: Deploy ansible-dryrun wrapper script
      ansible.builtin.copy:
        content: |
          #!/bin/bash
          # Wrapper for OpenClaw dry-run access — hardcodes --check --diff
          # dbc can run this via sudo as johnny, but cannot run real playbooks
          exec ansible-playbook --check --diff "$@"
        dest: /usr/local/bin/ansible-dryrun
        owner: root
        group: root
        mode: "0755"
      tags: [dbc-ansible]

    - name: Configure dbc sudo for dry-run wrapper only
      ansible.builtin.copy:
        content: |
          # OpenClaw agent (dbc) can only dry-run playbooks as johnny
          dbc ALL=(johnny) NOPASSWD: /usr/local/bin/ansible-dryrun *
        dest: /etc/sudoers.d/dbc-ansible
        owner: root
        group: root
        mode: "0440"
        validate: "visudo -cf %s"
      tags: [dbc-ansible]
