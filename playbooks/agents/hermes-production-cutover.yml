---
# Purpose: Replace OpenClaw production delivery with Hermes transactionally.
# Hosts: hermes_hosts.
# Key vars: hermes_production_cutover_*.
# Templates: templates/hermes/hermes-managed-config.yaml.j2.
# Scripts: scripts/agents/hermes-discord-enroll.py,
#          scripts/agents/openclaw-delivery-cutover-audit.py.
# Validation: ansible-playbook playbooks/agents/hermes-production-cutover.yml
#             --syntax-check.

- name: Cut over OpenClaw production delivery to Hermes
  hosts: hermes_hosts
  become: true
  gather_facts: true

  vars:
    hermes_cutover_run_id: "{{ ansible_date_time.iso8601_basic_short }}"
    hermes_cutover_run_root: >-
      {{ hermes_production_cutover_evidence_root }}/{{ hermes_cutover_run_id }}
    hermes_cutover_enrollment_backup: >-
      {{ hermes_production_cutover_rollback_root
         }}/{{ hermes_cutover_run_id }}-private-enrollment
    hermes_cutover_user_environment:
      XDG_RUNTIME_DIR: >-
        /run/user/{{ hermes_production_cutover_user_uid }}
      DBUS_SESSION_BUS_ADDRESS: >-
        unix:path=/run/user/{{ hermes_production_cutover_user_uid }}/bus
    hermes_cutover_source_paths:
      - /etc/hermes
      - /home/johnny/.config/systemd/user/openclaw-gateway.service
      - "{{ hermes_production_cutover_source_env }}"
      - "{{ hermes_production_cutover_source_config }}"
      - "{{ hermes_production_cutover_source_database }}"
      - /home/johnny/.openclaw/agents/main/sessions/sessions.json
      - /home/johnny/.openclaw/agents/dubble/sessions/sessions.json
      - /home/johnny/.openclaw/agents/rigel/sessions/sessions.json
      - /home/johnny/.openclaw/agents/vega/sessions/sessions.json
      - /home/johnny/.openclaw/agents/antares/sessions/sessions.json
      - /etc/systemd/system/openclaw-isolated-gateway.service
      - /etc/systemd/system/openclaw-isolated-codex.service
      - /etc/systemd/system/openclaw-repo-sync.timer
      - /etc/systemd/system/openclaw-update-check.timer

  tasks:
    - name: Validate Hermes production cutover mode
      ansible.builtin.assert:
        that:
          - hermes_production_cutover_mode in ['disabled', 'cutover']
        fail_msg: >-
          hermes_production_cutover_mode must be disabled or cutover.

    - name: Skip hosts without Hermes production cutover approval
      ansible.builtin.meta: end_host
      when: hermes_production_cutover_mode == 'disabled'

    - name: Require exact Hermes production cutover authorization
      ansible.builtin.assert:
        that:
          - hermes_production_cutover_approved | bool
          - >-
            hermes_production_cutover_confirmation
            == hermes_production_cutover_required_confirmation
          - inventory_hostname == 'jn-t14s-lin'
          - hermes_shadow_profiles | map(attribute='name') | list
            == ['astra', 'dubble', 'rigel']
        fail_msg: >-
          Production cutover requires the host-specific approval and exact
          confirmation string.

    - name: Inspect required cutover source paths
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop: >-
        {{
          [
            hermes_production_cutover_source_env,
            hermes_production_cutover_source_config,
            hermes_production_cutover_source_database,
            hermes_production_cutover_rigel_source,
            hermes_discord_enroll_live,
            hermes_delivery_reconcile_live,
            '/usr/local/libexec/openclaw-delivery-cutover-audit.py'
          ]
          + hermes_production_cutover_source_session_indexes
            | map(attribute='path')
            | list
        }}
      register: hermes_cutover_required_paths
      check_mode: false

    - name: Require regular non-symlinked cutover sources
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
          - not item.stat.islnk
        fail_msg: "Unsafe or missing cutover source: {{ item.item }}"
      loop: "{{ hermes_cutover_required_paths.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Check production OpenClaw user gateway state
      ansible.builtin.command:
        argv:
          - /usr/sbin/runuser
          - --user
          - "{{ hermes_production_cutover_user }}"
          - --
          - /usr/bin/systemctl
          - --user
          - is-active
          - "{{ hermes_production_cutover_user_gateway }}"
      environment: "{{ hermes_cutover_user_environment }}"
      register: hermes_cutover_source_user_active
      changed_when: false
      failed_when: false

    - name: Check production OpenClaw user gateway enablement
      ansible.builtin.command:
        argv:
          - /usr/sbin/runuser
          - --user
          - "{{ hermes_production_cutover_user }}"
          - --
          - /usr/bin/systemctl
          - --user
          - is-enabled
          - "{{ hermes_production_cutover_user_gateway }}"
      environment: "{{ hermes_cutover_user_environment }}"
      register: hermes_cutover_source_user_enabled
      changed_when: false
      failed_when: false

    - name: Check Health receiver state before cutover
      ansible.builtin.command:
        argv:
          - /usr/sbin/runuser
          - --user
          - "{{ hermes_production_cutover_user }}"
          - --
          - /usr/bin/systemctl
          - --user
          - is-active
          - "{{ hermes_production_cutover_health_service }}"
      environment: "{{ hermes_cutover_user_environment }}"
      register: hermes_cutover_health_before
      changed_when: false
      failed_when: false

    - name: Require live source delivery and independent Health receiver
      ansible.builtin.assert:
        that:
          - hermes_cutover_source_user_active.stdout == 'active'
          - hermes_cutover_source_user_enabled.stdout == 'enabled'
          - hermes_cutover_health_before.stdout == 'active'
        fail_msg: >-
          The production source or independent Health receiver does not match
          the reviewed pre-cutover state.

    - name: Check required OpenClaw system units before cutover
      ansible.builtin.command:
        argv:
          - /usr/bin/systemctl
          - is-active
          - "{{ item.name }}"
      loop: "{{ hermes_production_cutover_source_system_units }}"
      loop_control:
        label: "{{ item.name }}"
      register: hermes_cutover_source_system_active
      changed_when: false
      failed_when: false

    - name: Require expected OpenClaw system units to be active
      ansible.builtin.assert:
        that:
          - item.stdout == 'active'
        fail_msg: >-
          {{ item.item.name }} is not active; refusing to infer rollback state.
      loop: "{{ hermes_cutover_source_system_active.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Check Hermes gateways before cutover
      ansible.builtin.command:
        argv:
          - /usr/bin/systemctl
          - is-active
          - "{{ item.unit }}"
      loop: "{{ hermes_shadow_profiles }}"
      loop_control:
        label: "{{ item.name }}"
      register: hermes_cutover_target_active_before
      changed_when: false
      failed_when: false

    - name: Require every Hermes gateway to be stopped before cutover
      ansible.builtin.assert:
        that:
          - item.stdout in ['inactive', 'failed', 'unknown']
        fail_msg: >-
          {{ item.item.unit }} is already active; break-before-make is required.
      loop: "{{ hermes_cutover_target_active_before.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Validate deployed Hermes contracts before source shutdown
      ansible.builtin.command:
        argv: "{{ item }}"
      loop:
        - - "{{ hermes_shadow_audit_live }}"
          - "{{ hermes_shadow_contract_live }}"
        - - "{{ hermes_discord_audit_live }}"
          - "{{ hermes_discord_contract_live }}"
          - --repository-root
          - /usr/local/share/hermes-shadow/repository
        - - "{{ hermes_automation_audit_live }}"
          - "{{ hermes_automation_contract_live }}"
          - --repository-root
          - /usr/local/share/hermes-shadow/repository
      loop_control:
        label: "{{ item.0 }}"
      changed_when: false
      check_mode: false

    - name: Inspect rollback candidate paths
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop: "{{ hermes_cutover_source_paths }}"
      register: hermes_cutover_backup_candidates
      check_mode: false

    - name: Reject symlinked rollback candidates
      ansible.builtin.assert:
        that:
          - not (item.stat.islnk | default(false))
        fail_msg: "Refusing symlinked rollback source: {{ item.item }}"
      loop: "{{ hermes_cutover_backup_candidates.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.stat.exists | default(false)

    - name: Initialize Hermes cutover rollback command
      ansible.builtin.set_fact:
        hermes_cutover_backup_argv:
          - /usr/local/sbin/live-rollback-backup
          - --domain
          - hermes-migration
          - --host
          - jn-t14s-lin
          - --name
          - pre-production-cutover

    - name: Add existing cutover sources to rollback command
      ansible.builtin.set_fact:
        hermes_cutover_backup_argv: >-
          {{ hermes_cutover_backup_argv + ['--path', item.item] }}
      loop: "{{ hermes_cutover_backup_candidates.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.stat.exists | default(false)

    - name: Preserve current Hermes managed files for automatic rescue
      ansible.builtin.slurp:
        src: "/etc/hermes/{{ item.0.name }}/{{ item.1 }}"
      loop: >-
        {{
          hermes_shadow_profiles
          | product(['config.yaml', '.env', 'managed-policy.sha256'])
          | list
        }}
      loop_control:
        label: "{{ item.0.name }}/{{ item.1 }}"
      register: hermes_cutover_prior_managed_files
      no_log: true

    - name: Inspect prior private Discord enrollment
      ansible.builtin.stat:
        path: "{{ hermes_production_cutover_enrollment }}"
        follow: false
      register: hermes_cutover_prior_enrollment_stat

    - name: Preserve prior private Discord enrollment for automatic rescue
      ansible.builtin.slurp:
        src: "{{ hermes_production_cutover_enrollment }}"
      register: hermes_cutover_prior_enrollment
      when: hermes_cutover_prior_enrollment_stat.stat.exists
      no_log: true

    - name: Verify live rollback storage before production cutover
      ansible.builtin.command:
        argv:
          - /usr/bin/mountpoint
          - -q
          - /srv/live-rollbacks
      changed_when: false

    - name: Create root-private cutover evidence directory
      ansible.builtin.file:
        path: "{{ hermes_cutover_run_root }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Back up production source and target state before cutover
      ansible.builtin.command:
        argv: "{{ hermes_cutover_backup_argv }}"
      register: hermes_cutover_backup
      changed_when: true

    - name: Execute break-before-make Hermes production cutover
      block:
        - name: Stop and disable production OpenClaw user gateway
          ansible.builtin.command:
            argv:
              - /usr/sbin/runuser
              - --user
              - "{{ hermes_production_cutover_user }}"
              - --
              - /usr/bin/systemctl
              - --user
              - disable
              - --now
              - "{{ hermes_production_cutover_user_gateway }}"
          environment: "{{ hermes_cutover_user_environment }}"
          changed_when: true

        - name: Stop and disable OpenClaw system consumers and timers
          ansible.builtin.systemd_service:
            name: "{{ item.name }}"
            state: stopped
            enabled: false
          loop: "{{ hermes_production_cutover_source_system_units }}"
          loop_control:
            label: "{{ item.name }}"

        - name: Read listeners after OpenClaw shutdown
          ansible.builtin.command:
            argv:
              - /usr/bin/ss
              - -H
              - -ltn
          register: hermes_cutover_listeners_after_source_stop
          changed_when: false

        - name: Prove every OpenClaw gateway listener is absent
          ansible.builtin.assert:
            that:
              - >-
                hermes_cutover_listeners_after_source_stop.stdout
                is not search(':' ~ item ~ '(?:\\s|$)')
            fail_msg: "OpenClaw listener {{ item }} remained after shutdown."
          loop: "{{ hermes_production_cutover_source_ports }}"

        - name: Inspect OpenClaw delivery consumer processes after shutdown
          ansible.builtin.command:
            argv:
              - /usr/bin/pgrep
              - --full
              - --list-full
              - >-
                openclaw (gateway|agent)|openclaw-isolated|openclaw-codex
          register: hermes_cutover_openclaw_processes
          changed_when: false
          failed_when: hermes_cutover_openclaw_processes.rc not in [0, 1]

        - name: Prove OpenClaw delivery consumers are absent
          ansible.builtin.assert:
            that:
              - hermes_cutover_openclaw_processes.rc == 1
              - hermes_cutover_openclaw_processes.stdout | length == 0
            fail_msg: >-
              An OpenClaw delivery consumer remained after the source stop.

        - name: Build exact delivery-recovery reconciliation command
          ansible.builtin.set_fact:
            hermes_cutover_reconcile_argv:
              - "{{ hermes_delivery_reconcile_live }}"
              - --mode
              - apply
              - --session-index
              - "{{ hermes_production_cutover_recovery_session_index }}"
              - --backup
              - >-
                {{ hermes_cutover_run_root
                   }}/source-session-index-before-reconcile.json
              - --output
              - >-
                {{ hermes_cutover_run_root
                   }}/source-delivery-reconciliation.json
          when: hermes_production_cutover_recovery_fingerprints | length > 0

        - name: Add reviewed recovery fingerprints to reconciliation command
          ansible.builtin.set_fact:
            hermes_cutover_reconcile_argv: >-
              {{
                hermes_cutover_reconcile_argv
                + ['--expected-fingerprint', item]
              }}
          loop: "{{ hermes_production_cutover_recovery_fingerprints }}"
          loop_control:
            label: "{{ item[:12] }}..."
          when: hermes_production_cutover_recovery_fingerprints | length > 0

        - name: Reconcile only explicitly reviewed delivery-recovery records
          ansible.builtin.command:
            argv: "{{ hermes_cutover_reconcile_argv }}"
          register: hermes_cutover_reconciliation
          changed_when: true
          when: hermes_production_cutover_recovery_fingerprints | length > 0

        - name: Build stopped-source delivery audit command
          ansible.builtin.set_fact:
            hermes_cutover_delivery_audit_argv:
              - /usr/local/libexec/openclaw-delivery-cutover-audit.py
              - --database
              - "{{ hermes_production_cutover_source_database }}"
              - --output
              - "{{ hermes_cutover_run_root }}/source-delivery-audit.json"
              - --require-clean

        - name: Add OpenClaw session indexes to delivery audit command
          ansible.builtin.set_fact:
            hermes_cutover_delivery_audit_argv: >-
              {{
                hermes_cutover_delivery_audit_argv
                + ['--session-index', item.name ~ '=' ~ item.path]
              }}
          loop: "{{ hermes_production_cutover_source_session_indexes }}"
          loop_control:
            label: "{{ item.name }}"

        - name: Prove stopped OpenClaw has no replay-capable delivery state
          ansible.builtin.command:
            argv: "{{ hermes_cutover_delivery_audit_argv }}"
          register: hermes_cutover_delivery_audit
          changed_when: false

        - name: Enroll existing Discord identities only after source stop proof
          ansible.builtin.command:
            argv:
              - "{{ hermes_discord_enroll_live }}"
              - --mode
              - enroll
              - --source-env
              - "{{ hermes_production_cutover_source_env }}"
              - --source-config
              - "{{ hermes_production_cutover_source_config }}"
              - --target-root
              - /etc/hermes
              - --enrollment
              - "{{ hermes_production_cutover_enrollment }}"
              - --backup-dir
              - "{{ hermes_cutover_enrollment_backup }}"
          register: hermes_cutover_enrollment_result
          changed_when: true
          no_log: true

        - name: Read private Hermes Discord enrollment
          ansible.builtin.slurp:
            src: "{{ hermes_production_cutover_enrollment }}"
          register: hermes_cutover_enrollment_file
          no_log: true

        - name: Decode private Hermes Discord enrollment
          ansible.builtin.set_fact:
            hermes_cutover_enrollment: >-
              {{
                hermes_cutover_enrollment_file.content
                | b64decode
                | from_json
              }}
          no_log: true

        - name: Require two consumers and three logical profiles
          ansible.builtin.assert:
            that:
              - hermes_cutover_enrollment.schemaVersion == 1
              - hermes_cutover_enrollment.consumerCount == 2
              - >-
                hermes_cutover_enrollment.logicalProfiles
                == ['astra', 'dubble', 'rigel']
              - >-
                hermes_cutover_enrollment.profiles.rigel.discordConsumer
                == 'astra'
          no_log: true

        - name: Initialize production Hermes profiles
          ansible.builtin.set_fact:
            hermes_cutover_profiles: []
          no_log: true

        - name: Merge private route enrollment into managed profiles
          ansible.builtin.set_fact:
            hermes_cutover_profiles: >-
              {{
                hermes_cutover_profiles
                + [
                    item
                    | combine(
                        {
                          'discord_allowed_users': route.allowedUsers
                            | default(item.discord_allowed_users),
                          'discord_allowed_channels': route.allowedChannels
                            | default(item.discord_allowed_channels),
                          'discord_free_response_channels':
                            route.freeResponseChannels
                            | default(item.discord_free_response_channels),
                          'discord_ignored_channels': route.ignoredChannels
                            | default(item.discord_ignored_channels),
                          'discord_channel_prompts': route.channelPrompts
                            | default(item.discord_channel_prompts),
                          'discord_channel_skill_bindings':
                            route.channelSkillBindings
                            | default(item.discord_channel_skill_bindings),
                          'discord_admin_users': route.adminUsers
                            | default(item.discord_admin_users)
                        },
                        recursive=True
                      )
                  ]
              }}
          vars:
            route: >-
              {{ hermes_cutover_enrollment.profiles[item.name] | default({}) }}
          loop: "{{ hermes_shadow_profiles }}"
          loop_control:
            label: "{{ item.name }}"
          no_log: true

        - name: Render production Hermes managed policy
          ansible.builtin.template:
            src: >-
              {{ playbook_dir
                 }}/../../templates/hermes/hermes-managed-config.yaml.j2
            dest: "/etc/hermes/{{ hermes_profile.name }}/config.yaml"
            owner: root
            group: "{{ hermes_profile.group }}"
            mode: "0440"
            backup: true
          loop: "{{ hermes_cutover_profiles }}"
          loop_control:
            loop_var: hermes_profile
            label: "{{ hermes_profile.name }}"
          no_log: true

        - name: Validate production Hermes config as each service identity
          ansible.builtin.command:
            argv:
              - /usr/sbin/runuser
              - --user
              - "{{ item.user }}"
              - --
              - /usr/bin/env
              - "HOME={{ item.account_home }}"
              - "HERMES_HOME={{ item.home }}"
              - "HERMES_MANAGED_DIR=/etc/hermes/{{ item.name }}"
              - HERMES_DOCKER_BINARY=/usr/bin/podman
              - "{{ hermes_shadow_runtime_binary }}"
              - config
              - check
          loop: "{{ hermes_cutover_profiles }}"
          loop_control:
            label: "{{ item.name }}"
          changed_when: false
          no_log: true

        - name: Hash production Hermes policy and environment
          ansible.builtin.command:
            argv:
              - /usr/bin/sha256sum
              - "/etc/hermes/{{ item.name }}/config.yaml"
              - "/etc/hermes/{{ item.name }}/.env"
          loop: "{{ hermes_cutover_profiles }}"
          loop_control:
            label: "{{ item.name }}"
          register: hermes_cutover_managed_hashes
          changed_when: false
          no_log: true

        - name: Deploy production Hermes policy checksum manifests
          ansible.builtin.copy:
            content: "{{ item.stdout }}\n"
            dest: >-
              /etc/hermes/{{ item.item.name }}/managed-policy.sha256
            owner: root
            group: "{{ item.item.group }}"
            mode: "0440"
          loop: "{{ hermes_cutover_managed_hashes.results }}"
          loop_control:
            label: "{{ item.item.name }}"
          no_log: true

        - name: Create neutral Rigel channel-state boundary
          ansible.builtin.file:
            path: "{{ hermes_production_cutover_rigel_root }}"
            state: directory
            owner: root
            group: hermes-astra
            mode: "0750"

        - name: Copy normalized academic state into Astra's Rigel boundary
          ansible.builtin.copy:
            src: "{{ hermes_production_cutover_rigel_source }}"
            dest: >-
              {{ hermes_production_cutover_rigel_root }}/academic-state.json
            remote_src: true
            owner: root
            group: hermes-astra
            mode: "0440"

        - name: Deploy Rigel deterministic scheduler under Astra
          ansible.builtin.copy:
            src: >-
              {{ playbook_dir }}/../../{{ hermes_rigel_schedule_source }}
            dest: >-
              {{
                '/var/lib/hermes/astra/.hermes/profiles/astra/scripts/'
                ~ 'hermes-rigel-schedule.py'
              }}
            owner: root
            group: hermes-astra
            mode: "0550"
            backup: true

        - name: Prove Rigel's current idle tick is exactly silent
          ansible.builtin.command:
            argv:
              - /usr/sbin/runuser
              - --user
              - hermes-astra
              - --
              - /usr/bin/env
              - HOME=/var/lib/hermes/astra
              - HERMES_HOME=/var/lib/hermes/astra/.hermes/profiles/astra
              - /usr/bin/python3
              - /var/lib/hermes/astra/.hermes/profiles/astra/scripts/hermes-rigel-schedule.py
          register: hermes_cutover_rigel_idle
          changed_when: false

        - name: Require zero-output Rigel idle behavior
          ansible.builtin.assert:
            that:
              - hermes_cutover_rigel_idle.stdout | length == 0
              - hermes_cutover_rigel_idle.stderr | length == 0
            fail_msg: >-
              Rigel emitted output during the current inactive-semester tick.

        - name: Inspect current Astra native cron store
          ansible.builtin.stat:
            path: /var/lib/hermes/astra/.hermes/profiles/astra/cron/jobs.json
            follow: false
          register: hermes_cutover_cron_store

        - name: Read current Astra native cron store
          ansible.builtin.slurp:
            src: /var/lib/hermes/astra/.hermes/profiles/astra/cron/jobs.json
          register: hermes_cutover_cron_store_content
          when: hermes_cutover_cron_store.stat.exists

        - name: Decode current Astra native cron jobs
          ansible.builtin.set_fact:
            hermes_cutover_cron_jobs: >-
              {{
                (
                  hermes_cutover_cron_store_content.content
                  | b64decode
                  | from_json
                ).jobs
                if hermes_cutover_cron_store.stat.exists
                else []
              }}
          no_log: true

        - name: Select existing Rigel native cron jobs
          ansible.builtin.set_fact:
            hermes_cutover_existing_rigel_jobs: >-
              {{
                hermes_cutover_cron_jobs
                | selectattr(
                    'name',
                    'equalto',
                    hermes_production_cutover_rigel_job_name
                  )
                | list
              }}
          no_log: true

        - name: Reject duplicate Rigel native cron jobs
          ansible.builtin.assert:
            that:
              - hermes_cutover_existing_rigel_jobs | length <= 1
            fail_msg: >-
              Multiple Rigel native cron jobs exist; refusing to guess which
              one owns delivery.
          no_log: true

        - name: Create native Rigel scheduler delivery
          ansible.builtin.command:
            argv:
              - /usr/sbin/runuser
              - --user
              - hermes-astra
              - --
              - /usr/bin/env
              - HOME=/var/lib/hermes/astra
              - HERMES_HOME=/var/lib/hermes/astra/.hermes/profiles/astra
              - HERMES_MANAGED_DIR=/etc/hermes/astra
              - "{{ hermes_shadow_runtime_binary }}"
              - cron
              - create
              - every 30m
              - --name
              - "{{ hermes_production_cutover_rigel_job_name }}"
              - --deliver
              - >-
                discord:{{
                  hermes_cutover_enrollment.profiles.rigel
                  .schedulerDeliveryChannel
                }}
              - --script
              - hermes-rigel-schedule.py
              - --no-agent
          when: hermes_cutover_existing_rigel_jobs | length == 0
          register: hermes_cutover_rigel_job_create
          changed_when: true
          no_log: true

        - name: Read resulting Astra native cron store
          ansible.builtin.slurp:
            src: /var/lib/hermes/astra/.hermes/profiles/astra/cron/jobs.json
          register: hermes_cutover_resulting_cron_store
          no_log: true

        - name: Select resulting Rigel native cron job
          ansible.builtin.set_fact:
            hermes_cutover_resulting_rigel_jobs: >-
              {{
                (
                  hermes_cutover_resulting_cron_store.content
                  | b64decode
                  | from_json
                ).jobs
                | selectattr(
                    'name',
                    'equalto',
                    hermes_production_cutover_rigel_job_name
                  )
                | list
              }}
          no_log: true

        - name: Require exact native Rigel scheduler transaction
          ansible.builtin.assert:
            that:
              - hermes_cutover_resulting_rigel_jobs | length == 1
              - hermes_cutover_resulting_rigel_jobs.0.no_agent | bool
              - >-
                hermes_cutover_resulting_rigel_jobs.0.script
                == 'hermes-rigel-schedule.py'
              - >-
                hermes_cutover_resulting_rigel_jobs.0.deliver
                == 'discord:'
                   ~ hermes_cutover_enrollment.profiles.rigel
                     .schedulerDeliveryChannel
              - hermes_cutover_resulting_rigel_jobs.0.enabled | bool
              - >-
                hermes_cutover_resulting_rigel_jobs.0.schedule_display
                == 'every 30m'
            fail_msg: >-
              The native Rigel job does not match the reviewed silent
              script-only delivery contract.
          no_log: true

        - name: Remove every Hermes gateway readiness marker before promotion
          ansible.builtin.file:
            path: >-
              /etc/hermes/{{ item.name }}/{{ hermes_gateway_readiness_marker }}
            state: absent
          loop: "{{ hermes_shadow_profiles }}"
          loop_control:
            label: "{{ item.name }}"

        - name: Create readiness markers for the two Discord consumers
          ansible.builtin.file:
            path: >-
              /etc/hermes/{{ item }}/{{ hermes_gateway_readiness_marker }}
            state: touch
            owner: root
            group: root
            mode: "0600"
          loop:
            - astra
            - dubble

        - name: Keep preserved Rigel gateway stopped and disabled
          ansible.builtin.systemd_service:
            name: hermes-gateway-rigel.service
            state: stopped
            enabled: false

        - name: Start and enable Astra Discord consumer
          ansible.builtin.systemd_service:
            name: hermes-gateway-astra.service
            state: started
            enabled: true

        - name: Start and enable Dubble Discord consumer
          ansible.builtin.systemd_service:
            name: hermes-gateway-dubble.service
            state: started
            enabled: true

        - name: Enable Hermes and Tirith native automatic updates
          ansible.builtin.systemd_service:
            name: "{{ item }}"
            state: started
            enabled: true
          loop:
            - "{{ hermes_native_update_timer }}"
            - "{{ hermes_tirith_update_timer }}"

        - name: Check promoted Hermes consumer state
          ansible.builtin.command:
            argv:
              - /usr/bin/systemctl
              - is-active
              - "{{ item }}"
          loop:
            - hermes-gateway-astra.service
            - hermes-gateway-dubble.service
            - "{{ hermes_native_update_timer }}"
            - "{{ hermes_tirith_update_timer }}"
          register: hermes_cutover_promoted_units
          changed_when: false

        - name: Require two live consumers and both native update timers
          ansible.builtin.assert:
            that:
              - item.stdout == 'active'
          loop: "{{ hermes_cutover_promoted_units.results }}"
          loop_control:
            label: "{{ item.item }}"

        - name: Verify preserved Rigel gateway remains inactive
          ansible.builtin.command:
            argv:
              - /usr/bin/systemctl
              - is-active
              - hermes-gateway-rigel.service
          register: hermes_cutover_rigel_gateway_state
          changed_when: false
          failed_when: false

        - name: Require no third Discord consumer
          ansible.builtin.assert:
            that:
              - >-
                hermes_cutover_rigel_gateway_state.stdout
                in ['inactive', 'failed']
            fail_msg: >-
              The preserved Rigel gateway unexpectedly became a third
              Discord consumer.

        - name: Verify Health receiver stayed active through cutover
          ansible.builtin.command:
            argv:
              - /usr/sbin/runuser
              - --user
              - "{{ hermes_production_cutover_user }}"
              - --
              - /usr/bin/systemctl
              - --user
              - is-active
              - "{{ hermes_production_cutover_health_service }}"
          environment: "{{ hermes_cutover_user_environment }}"
          register: hermes_cutover_health_after
          changed_when: false

        - name: Read final TCP listeners
          ansible.builtin.command:
            argv:
              - /usr/bin/ss
              - -H
              - -ltn
          register: hermes_cutover_final_listeners
          changed_when: false

        - name: Require Health listener and continued OpenClaw absence
          ansible.builtin.assert:
            that:
              - hermes_cutover_health_after.stdout == 'active'
              - >-
                hermes_cutover_final_listeners.stdout
                is search(
                  ':' ~ hermes_production_cutover_health_port ~ '(?:\\s|$)'
                )
              - >-
                hermes_cutover_final_listeners.stdout
                is not search(':' ~ item ~ '(?:\\s|$)')
          loop: "{{ hermes_production_cutover_source_ports }}"

        - name: Send one concise proactive cutover proof to Astra logs
          ansible.builtin.command:
            argv:
              - /usr/sbin/runuser
              - --user
              - hermes-astra
              - --
              - /usr/bin/env
              - HOME=/var/lib/hermes/astra
              - HERMES_HOME=/var/lib/hermes/astra/.hermes/profiles/astra
              - HERMES_MANAGED_DIR=/etc/hermes/astra
              - "{{ hermes_shadow_runtime_binary }}"
              - send
              - --quiet
              - --to
              - >-
                discord:{{
                  hermes_cutover_enrollment.profiles.astra.logChannel
                }}
              - "{{ hermes_production_cutover_completion_message }}"
          changed_when: true
          no_log: true

        - name: Record content-free production cutover success
          ansible.builtin.copy:
            content: |
              {
                "schemaVersion": 1,
                "status": "ok",
                "source": "openclaw-stopped-preserved",
                "discordConsumers": 2,
                "logicalProfiles": 3,
                "rigelGateway": "stopped",
                "rigelScheduler": "native-no-agent",
                "healthReceiver": "active",
                "nativeUpdates": "automatic"
              }
            dest: "{{ hermes_cutover_run_root }}/result.json"
            owner: root
            group: root
            mode: "0600"

      rescue:
        - name: Stop Hermes gateways after failed promotion
          ansible.builtin.systemd_service:
            name: "{{ item.unit }}"
            state: stopped
            enabled: false
          loop: "{{ hermes_shadow_profiles }}"
          loop_control:
            label: "{{ item.name }}"
          failed_when: false

        - name: Stop Hermes native update timers after failed promotion
          ansible.builtin.systemd_service:
            name: "{{ item }}"
            state: stopped
            enabled: false
          loop:
            - "{{ hermes_native_update_timer }}"
            - "{{ hermes_tirith_update_timer }}"
          failed_when: false

        - name: Remove Hermes gateway readiness after failed promotion
          ansible.builtin.file:
            path: >-
              /etc/hermes/{{ item.name }}/{{ hermes_gateway_readiness_marker }}
            state: absent
          loop: "{{ hermes_shadow_profiles }}"
          loop_control:
            label: "{{ item.name }}"

        - name: Restore pre-cutover Hermes managed files
          ansible.builtin.copy:
            content: "{{ item.content | b64decode }}"
            dest: "{{ item.source }}"
            owner: root
            group: "{{ item.item.0.group }}"
            mode: "0440"
          loop: "{{ hermes_cutover_prior_managed_files.results }}"
          loop_control:
            label: "{{ item.item.0.name }}/{{ item.item.1 }}"
          no_log: true

        - name: Restore prior private Discord enrollment
          ansible.builtin.copy:
            content: "{{ hermes_cutover_prior_enrollment.content | b64decode }}"
            dest: "{{ hermes_production_cutover_enrollment }}"
            owner: root
            group: root
            mode: "0400"
          when: hermes_cutover_prior_enrollment_stat.stat.exists
          no_log: true

        - name: Remove newly created private Discord enrollment
          ansible.builtin.file:
            path: "{{ hermes_production_cutover_enrollment }}"
            state: absent
          when: not hermes_cutover_prior_enrollment_stat.stat.exists

        - name: Restore formerly enabled OpenClaw system units
          ansible.builtin.systemd_service:
            name: "{{ item.name }}"
            state: started
            enabled: true
          loop: >-
            {{
              hermes_production_cutover_source_system_units
              | selectattr('restore', 'equalto', 'started-enabled')
              | list
            }}
          loop_control:
            label: "{{ item.name }}"

        - name: Restore formerly boot-disabled OpenClaw canaries
          ansible.builtin.systemd_service:
            name: "{{ item.name }}"
            state: started
            enabled: false
          loop: >-
            {{
              hermes_production_cutover_source_system_units
              | selectattr('restore', 'equalto', 'started-disabled')
              | list
            }}
          loop_control:
            label: "{{ item.name }}"

        - name: Restore production OpenClaw user gateway
          ansible.builtin.command:
            argv:
              - /usr/sbin/runuser
              - --user
              - "{{ hermes_production_cutover_user }}"
              - --
              - /usr/bin/systemctl
              - --user
              - enable
              - --now
              - "{{ hermes_production_cutover_user_gateway }}"
          environment: "{{ hermes_cutover_user_environment }}"
          changed_when: true

        - name: Verify source and Health recovered after failed promotion
          ansible.builtin.command:
            argv:
              - /usr/sbin/runuser
              - --user
              - "{{ hermes_production_cutover_user }}"
              - --
              - /usr/bin/systemctl
              - --user
              - is-active
              - "{{ item }}"
          environment: "{{ hermes_cutover_user_environment }}"
          loop:
            - "{{ hermes_production_cutover_user_gateway }}"
            - "{{ hermes_production_cutover_health_service }}"
          register: hermes_cutover_rescue_user_units
          changed_when: false

        - name: Require source and Health recovery
          ansible.builtin.assert:
            that:
              - item.stdout == 'active'
          loop: "{{ hermes_cutover_rescue_user_units.results }}"
          loop_control:
            label: "{{ item.item }}"

        - name: Stop after automatic OpenClaw rollback
          ansible.builtin.fail:
            msg: >-
              Hermes promotion failed and OpenClaw delivery was restored.
              Inspect the root-private cutover evidence and Ansible failure.
