# Purpose: Configure Codex memory sync to NAS.
# Hosts: nas_server, orchestrator.
# Key vars: codex_*, claude_memory_sync_*, openclaw_*.
# Templates: templates/openclaw.
# Scripts: none by default.
# Validation: ansible-playbook playbooks/agents/codex-memory-sync.yml --syntax-check.

# =============================================================================
# Codex Memory Sync - Sync Codex CLI memory files to NAS for Nextcloud
# =============================================================================
# Codex CLI's project memory lives on the Ansible controller outside the git repo.
# This timer rsyncs it to ts440 so it appears in Nextcloud External Storage
# (Configs/codex-memory/) and syncs to the Mac via Nextcloud desktop app.
#
# Usage: ansible-playbook playbooks/agents/codex-memory-sync.yml
# =============================================================================

- name: Ensure codex-memory directory exists on NAS
  hosts: nas_server
  become: true

  tasks:
    - name: Create codex-memory directory
      ansible.builtin.file:
        path: /srv/nas-zfs/configs/codex-memory
        state: directory
        owner: johnny
        group: johnny
        mode: "0775"

- name: Configure Codex memory sync timer
  hosts: orchestrator
  become: true

  vars:
    codex_memory_sync_source: /home/johnny/.codex/memories/
    codex_memory_sync_dest: johnny@100.71.188.16:/srv/nas-zfs/configs/codex-memory/
    codex_memory_sync_key: /home/johnny/.ssh/ansible_ed25519
    codex_memory_sync_interval: "*-*-* *:2/10"  # every 10 min, offset by 2 min
    codex_memory_sync_user: johnny

  tasks:
    - name: Create codex-memory-sync service
      ansible.builtin.copy:
        dest: /etc/systemd/system/codex-memory-sync.service
        mode: "0644"
        content: |
          [Unit]
          Description=Sync Codex CLI memory to NAS for Nextcloud access
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=oneshot
          User={{ codex_memory_sync_user }}
          ExecStart=/usr/bin/rsync -a --chmod=D775,F664 -e "ssh -i {{ codex_memory_sync_key }} -o StrictHostKeyChecking=no" {{ codex_memory_sync_source }} {{ codex_memory_sync_dest }}
      notify: Reload systemd

    - name: Create codex-memory-sync timer
      ansible.builtin.copy:
        dest: /etc/systemd/system/codex-memory-sync.timer
        mode: "0644"
        content: |
          [Unit]
          Description=Sync Codex memory to NAS every 10 minutes

          [Timer]
          OnCalendar={{ codex_memory_sync_interval }}
          Persistent=true

          [Install]
          WantedBy=timers.target
      notify: Reload systemd

    - name: Reload systemd before enabling new timer
      ansible.builtin.meta: flush_handlers
      when: not ansible_check_mode

    - name: Enable and start codex-memory-sync timer
      ansible.builtin.systemd:
        name: codex-memory-sync.timer
        enabled: true
        state: started
      when: not ansible_check_mode

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true
