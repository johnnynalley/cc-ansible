---
# yamllint disable rule:line-length
# Purpose: Stage reviewed compact Hermes profile memory without starting a gateway.
# Hosts: hermes_hosts.
# Key vars: hermes_profile_memory_*.
# Scripts: scripts/agents/hermes-memory-seed-validate.py.
# Validation: ansible-playbook playbooks/agents/hermes-profile-memory.yml --syntax-check.

- name: Stage curated Hermes profile memory
  hosts: hermes_hosts
  become: true
  gather_facts: false

  vars:
    hermes_profile_memory_contract_path: >-
      {{ playbook_dir }}/../../{{ hermes_profile_memory_contract_source }}
    hermes_profile_memory_contract: >-
      {{ lookup('ansible.builtin.file', hermes_profile_memory_contract_path) | from_json }}
    hermes_profile_memory_gateway_units:
      - hermes-gateway-astra.service
      - hermes-gateway-dubble.service
      - hermes-gateway-rigel.service
    hermes_profile_memory_state_units:
      - hermes-gateway-astra.service
      - hermes-gateway-dubble.service
      - hermes-gateway-rigel.service
      - openclaw-isolated-codex.service
      - openclaw-isolated-gateway.service
    hermes_profile_memory_user_state_units:
      - openclaw-gateway.service
      - health-receiver.service

  tasks:
    - name: Validate Hermes profile-memory mode
      ansible.builtin.assert:
        that:
          - hermes_profile_memory_mode in ['disabled', 'stage']
        fail_msg: >-
          hermes_profile_memory_mode must be disabled or stage. This playbook
          has no Gateway activation, scheduler, messaging, or model mode.

    - name: Skip Hermes profile memory when disabled
      ansible.builtin.meta: end_host
      when: hermes_profile_memory_mode == 'disabled'

    - name: Require explicit curated Hermes profile-memory approval
      ansible.builtin.assert:
        that:
          - hermes_profile_memory_approved | bool
          - inventory_hostname == 'jn-t14s-lin'
          - hermes_profile_memory_contract.schemaVersion == 1
          - hermes_profile_memory_contract.mode == 'curated-seed'
          - hermes_profile_memory_contract.source.vaultEncrypted | bool
          - not hermes_profile_memory_contract.source.rawLegacyMemoryCopied
          - not hermes_profile_memory_contract.source.rawSessionsCopied
          - not hermes_profile_memory_contract.source.rawTranscriptsCopied
          - hermes_profile_memory_contract.validation.nativeThreatScannerRequired | bool
          - hermes_profile_memory_contract.validation.cleanRoundTripRequired | bool
          - not hermes_profile_memory_contract.validation.symlinkAllowed
          - not hermes_profile_memory_contract.validation.executableAllowed
          - hermes_profile_memory_contract.execution.backupRequired | bool
          - hermes_profile_memory_contract.execution.transactionRollbackRequired | bool
          - not hermes_profile_memory_contract.execution.gatewayActivationAllowed
          - not hermes_profile_memory_contract.execution.schedulerActivationAllowed
          - not hermes_profile_memory_contract.execution.messagingActivationAllowed
          - not hermes_profile_memory_contract.execution.providerCredentialRequired
          - not hermes_profile_memory_contract.execution.modelInvocationAllowed
          - not hermes_profile_memory_contract.execution.automaticMemoryApprovalAllowed
          - not hermes_profile_memory_contract.execution.sourceMutationAllowed
        fail_msg: >-
          The requested profile-memory transaction differs from the reviewed
          encrypted, curated, backed-up, no-activation contract.

    - name: Build curated Hermes memory seed inventory
      ansible.builtin.set_fact:
        hermes_profile_memory_seeds: >-
          {{ (hermes_profile_memory_seeds | default([])) + [
            item.1 | combine({
              'profile': item.0.key,
              'user': item.0.value.user,
              'group': item.0.value.group,
              'home': item.0.value.home
            })
          ] }}
      loop: >-
        {{ hermes_profile_memory_contract.profiles
           | dict2items
           | subelements('value.seeds', skip_missing=True) }}
      no_log: true

    - name: Require exact curated Hermes profile and seed inventory
      ansible.builtin.assert:
        that:
          - hermes_profile_memory_contract.profiles.keys() | list | sort == ['astra', 'dubble', 'rigel']
          - hermes_profile_memory_contract.profiles.dubble.mustRemainEmpty | bool
          - hermes_profile_memory_seeds | length == 4
          - hermes_profile_memory_seeds | map(attribute='name') | list | sort == ['MEMORY.md', 'MEMORY.md', 'USER.md', 'USER.md']
          - hermes_profile_memory_seeds | map(attribute='profile') | list | unique | sort == ['astra', 'rigel']
        fail_msg: >-
          The curated profile-memory inventory is incomplete or unexpectedly
          seeds Dubble.

    - name: Inspect service states before Hermes profile-memory staging
      ansible.builtin.command:
        argv:
          - /usr/bin/systemctl
          - show
          - --property=LoadState
          - --property=ActiveState
          - --property=UnitFileState
          - "{{ item }}"
      loop: "{{ hermes_profile_memory_state_units }}"
      register: hermes_profile_memory_services_before
      check_mode: false
      changed_when: false
      failed_when: false

    - name: Require every Hermes gateway stopped before profile-memory staging
      ansible.builtin.assert:
        that:
          - "'ActiveState=inactive' in item.stdout"
          - "'UnitFileState=disabled' in item.stdout"
        fail_msg: >-
          A Hermes Gateway is active or boot-enabled. Profile memory may be
          staged only while all Hermes profiles are stopped and disabled.
      loop: "{{ hermes_profile_memory_services_before.results[0:3] }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Inspect production user-service states before profile-memory staging
      ansible.builtin.command:
        argv:
          - /usr/sbin/runuser
          - --user
          - johnny
          - --
          - /usr/bin/env
          - XDG_RUNTIME_DIR=/run/user/1000
          - DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1000/bus
          - /usr/bin/systemctl
          - --user
          - show
          - --property=LoadState
          - --property=ActiveState
          - --property=UnitFileState
          - "{{ item }}"
      loop: "{{ hermes_profile_memory_user_state_units }}"
      register: hermes_profile_memory_user_services_before
      check_mode: false
      changed_when: false

    - name: Require production user services to exist before memory staging
      ansible.builtin.assert:
        that:
          - "'LoadState=loaded' in item.stdout"
        fail_msg: >-
          The production OpenClaw or Health user service is missing. The
          memory transaction will not proceed without complete parity evidence.
      loop: "{{ hermes_profile_memory_user_services_before.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Report Hermes profile-memory check-mode boundary
      ansible.builtin.debug:
        msg: >-
          Check mode validated the contract, inventory, and stopped Gateways.
          It did not decrypt a seed, create a backup, or change target memory.
      when: ansible_check_mode

    - name: Stop Hermes profile-memory staging before mutation in check mode
      ansible.builtin.meta: end_host
      when: ansible_check_mode

    - name: Inspect Dubble memory before curated staging
      ansible.builtin.find:
        paths: /var/lib/hermes/dubble/memories
        file_type: any
        hidden: true
        recurse: true
      register: hermes_profile_memory_dubble_before

    - name: Require Dubble memory to remain empty
      ansible.builtin.assert:
        that:
          - hermes_profile_memory_dubble_before.matched == 0
        fail_msg: >-
          Dubble has existing memory. This curated transaction intentionally
          seeds no Dubble state and will not overwrite or reinterpret it.

    - name: Read host timestamp for Hermes profile-memory transaction
      ansible.builtin.command:
        argv:
          - /usr/bin/date
          - -u
          - +%Y%m%dT%H%M%SZ
      register: hermes_profile_memory_timestamp
      changed_when: false

    - name: Set Hermes profile-memory transaction paths
      ansible.builtin.set_fact:
        hermes_profile_memory_stage_root: >-
          /run/hermes-profile-memory-{{ hermes_profile_memory_timestamp.stdout }}
        hermes_profile_memory_backup_dir: >-
          {{ hermes_profile_memory_rollback_root }}/{{ hermes_profile_memory_timestamp.stdout }}-pre-profile-memory

    - name: Create Hermes profile-memory staging directory
      ansible.builtin.file:
        path: "{{ hermes_profile_memory_stage_root }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Deploy Hermes native memory-seed validator
      ansible.builtin.copy:
        src: "{{ ansible_config_file | dirname }}/{{ hermes_profile_memory_validator_source }}"
        dest: "{{ hermes_profile_memory_validator_live }}"
        owner: root
        group: root
        mode: "0755"

    - name: Stage and validate curated Hermes profile memory
      block:
        - name: Create decrypted Hermes seed profile directories
          ansible.builtin.file:
            path: "{{ hermes_profile_memory_stage_root }}/{{ item }}"
            state: directory
            owner: root
            group: root
            mode: "0700"
          loop:
            - astra
            - rigel

        - name: Decrypt curated Hermes memory seeds into private staging
          ansible.builtin.copy:
            src: "{{ ansible_config_file | dirname }}/{{ item.source }}"
            dest: "{{ hermes_profile_memory_stage_root }}/{{ item.profile }}/{{ item.name }}"
            owner: root
            group: root
            mode: "0400"
            decrypt: true
          loop: "{{ hermes_profile_memory_seeds }}"
          no_log: true

        - name: Validate decrypted Hermes memory seeds
          ansible.builtin.command:
            argv:
              - /usr/local/lib/hermes-agent/venv/bin/python
              - "{{ hermes_profile_memory_validator_live }}"
              - --path
              - "{{ hermes_profile_memory_stage_root }}/{{ item.profile }}/{{ item.name }}"
              - --name
              - "{{ item.name }}"
              - --max-chars
              - "{{ item.charLimit | string }}"
              - --hermes-source
              - /usr/local/lib/hermes-agent
          loop: "{{ hermes_profile_memory_seeds }}"
          register: hermes_profile_memory_seed_validation
          changed_when: false
          no_log: true

        - name: Create Hermes profile-memory rollback directory
          ansible.builtin.file:
            path: "{{ hermes_profile_memory_backup_dir }}"
            state: directory
            owner: root
            group: root
            mode: "0700"

        - name: Back up current Hermes memory stores
          ansible.builtin.command:
            argv:
              - /usr/bin/tar
              - --create
              - --file
              - "{{ hermes_profile_memory_backup_dir }}/memories.tar"
              - --directory
              - /var/lib/hermes
              - astra/memories
              - dubble/memories
              - rigel/memories
          changed_when: true

        - name: Restrict Hermes profile-memory rollback archive
          ansible.builtin.file:
            path: "{{ hermes_profile_memory_backup_dir }}/memories.tar"
            owner: root
            group: root
            mode: "0600"

        - name: Hash Hermes profile-memory rollback archive
          ansible.builtin.command:
            argv:
              - /usr/bin/sha256sum
              - "{{ hermes_profile_memory_backup_dir }}/memories.tar"
          register: hermes_profile_memory_backup_hash
          changed_when: false

        - name: Record Hermes profile-memory rollback manifest
          ansible.builtin.copy:
            dest: "{{ hermes_profile_memory_backup_dir }}/manifest.json"
            owner: root
            group: root
            mode: "0600"
            content: >-
              {{ {
                'schemaVersion': 1,
                'createdAt': hermes_profile_memory_timestamp.stdout,
                'host': inventory_hostname,
                'artifact': 'memories.tar',
                'artifactSha256': hermes_profile_memory_backup_hash.stdout.split()[0],
                'profiles': ['astra', 'dubble', 'rigel'],
                'seedCount': hermes_profile_memory_seeds | length
              } | to_nice_json }}

        - name: Apply and verify curated Hermes profile-memory transaction
          block:
            - name: Inspect curated Hermes memory target paths
              ansible.builtin.stat:
                path: "{{ item.home }}/memories/{{ item.name }}"
                follow: false
              loop: "{{ hermes_profile_memory_seeds }}"
              register: hermes_profile_memory_targets_before
              no_log: true

            - name: Reject unsafe existing Hermes memory target paths
              ansible.builtin.assert:
                that:
                  - not item.stat.exists or (item.stat.isreg and not item.stat.islnk)
                fail_msg: >-
                  A curated Hermes memory target is not absent or a regular,
                  non-symlink file.
              loop: "{{ hermes_profile_memory_targets_before.results }}"
              no_log: true

            - name: Install curated Hermes memory seeds atomically
              ansible.builtin.copy:
                src: "{{ hermes_profile_memory_stage_root }}/{{ item.profile }}/{{ item.name }}"
                dest: "{{ item.home }}/memories/{{ item.name }}"
                remote_src: true
                owner: "{{ item.user }}"
                group: "{{ item.group }}"
                mode: "0600"
              loop: "{{ hermes_profile_memory_seeds }}"
              no_log: true

            - name: Validate installed Hermes profile memory as its service identity
              ansible.builtin.command:
                argv:
                  - /usr/sbin/runuser
                  - --user
                  - "{{ item.user }}"
                  - --
                  - /usr/local/lib/hermes-agent/venv/bin/python
                  - "{{ hermes_profile_memory_validator_live }}"
                  - --path
                  - "{{ item.home }}/memories/{{ item.name }}"
                  - --name
                  - "{{ item.name }}"
                  - --max-chars
                  - "{{ item.charLimit | string }}"
                  - --hermes-source
                  - /usr/local/lib/hermes-agent
              loop: "{{ hermes_profile_memory_seeds }}"
              changed_when: false
              no_log: true

            - name: Hash staged Hermes memory seeds
              ansible.builtin.stat:
                path: >-
                  {{ hermes_profile_memory_stage_root }}/{{ item.profile }}/{{ item.name }}
                follow: false
                get_checksum: true
                checksum_algorithm: sha256
              loop: "{{ hermes_profile_memory_seeds }}"
              register: hermes_profile_memory_staged_stats
              no_log: true

            - name: Hash installed Hermes memory seeds
              ansible.builtin.stat:
                path: "{{ item.home }}/memories/{{ item.name }}"
                follow: false
                get_checksum: true
                checksum_algorithm: sha256
              loop: "{{ hermes_profile_memory_seeds }}"
              register: hermes_profile_memory_installed_stats
              no_log: true

            - name: Require identical staged and installed Hermes memory
              ansible.builtin.assert:
                that:
                  - hermes_profile_memory_staged_stats.results | map(attribute='stat.checksum') | list == hermes_profile_memory_installed_stats.results | map(attribute='stat.checksum') | list
                fail_msg: >-
                  Installed Hermes profile memory differs from its validated
                  decrypted staging source.
              no_log: true

            - name: Inspect Dubble memory after curated staging
              ansible.builtin.find:
                paths: /var/lib/hermes/dubble/memories
                file_type: any
                hidden: true
                recurse: true
              register: hermes_profile_memory_dubble_after

            - name: Require Dubble memory to remain empty after staging
              ansible.builtin.assert:
                that:
                  - hermes_profile_memory_dubble_after.matched == 0
                fail_msg: >-
                  Dubble memory changed during a transaction that has no
                  Dubble seed.

            - name: Inspect service states after Hermes profile-memory staging
              ansible.builtin.command:
                argv:
                  - /usr/bin/systemctl
                  - show
                  - --property=LoadState
                  - --property=ActiveState
                  - --property=UnitFileState
                  - "{{ item }}"
              loop: "{{ hermes_profile_memory_state_units }}"
              register: hermes_profile_memory_services_after
              check_mode: false
              changed_when: false
              failed_when: false

            - name: Require unchanged services after Hermes profile-memory staging
              ansible.builtin.assert:
                that:
                  - hermes_profile_memory_services_before.results | map(attribute='stdout') | list == hermes_profile_memory_services_after.results | map(attribute='stdout') | list
                fail_msg: >-
                  A Hermes, OpenClaw, or Health service state changed during
                  the profile-memory transaction.

            - name: Inspect production user-service states after memory staging
              ansible.builtin.command:
                argv:
                  - /usr/sbin/runuser
                  - --user
                  - johnny
                  - --
                  - /usr/bin/env
                  - XDG_RUNTIME_DIR=/run/user/1000
                  - DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1000/bus
                  - /usr/bin/systemctl
                  - --user
                  - show
                  - --property=LoadState
                  - --property=ActiveState
                  - --property=UnitFileState
                  - "{{ item }}"
              loop: "{{ hermes_profile_memory_user_state_units }}"
              register: hermes_profile_memory_user_services_after
              check_mode: false
              changed_when: false

            - name: Require unchanged production user services after staging
              ansible.builtin.assert:
                that:
                  - hermes_profile_memory_user_services_before.results | map(attribute='stdout') | list == hermes_profile_memory_user_services_after.results | map(attribute='stdout') | list
                fail_msg: >-
                  The production OpenClaw or Health user service changed during
                  the profile-memory transaction.
          rescue:
            - name: Remove failed Hermes profile memory stores before restore
              ansible.builtin.file:
                path: "/var/lib/hermes/{{ item }}/memories"
                state: absent
              loop:
                - astra
                - dubble
                - rigel

            - name: Restore Hermes memory stores after staging failure
              ansible.builtin.command:
                argv:
                  - /usr/bin/tar
                  - --extract
                  - --file
                  - "{{ hermes_profile_memory_backup_dir }}/memories.tar"
                  - --directory
                  - /var/lib/hermes
              changed_when: true

            - name: Stop after restoring failed Hermes profile-memory transaction
              ansible.builtin.fail:
                msg: >-
                  Curated profile-memory staging failed. All three memory
                  stores were restored from the recorded rollback artifact.
      always:
        - name: Remove decrypted Hermes profile-memory staging
          ansible.builtin.file:
            path: "{{ hermes_profile_memory_stage_root }}"
            state: absent
