# Purpose: Isolate Health Auto Export ingestion in a Hermes-native service.
# Hosts: hermes_hosts.
# Key vars: hermes_health_receiver_*.
# Templates: none.
# Scripts: scripts/agents/health-receiver.py, scripts/agents/health-receiver-check.py,
#          scripts/agents/health-summary.py.
# Validation: ansible-playbook playbooks/agents/hermes-health-receiver.yml --syntax-check.

- name: Configure isolated Hermes Health receiver
  hosts: hermes_hosts
  become: true
  gather_facts: false

  vars:
    hermes_health_receiver_effective_bind: >-
      {{ hermes_health_receiver_production_bind }}
    hermes_health_receiver_effective_port: >-
      {{ hermes_health_receiver_production_port }}
    hermes_health_receiver_effective_sources: >-
      {{ hermes_health_receiver_production_sources }}

  tasks:
    - name: Validate isolated Health receiver mode
      ansible.builtin.assert:
        that:
          - hermes_health_receiver_mode | default('disabled') in ['disabled', 'production']
        fail_msg: >-
          hermes_health_receiver_mode must be disabled or production.

    - name: Check for existing isolated Health receiver unit
      ansible.builtin.stat:
        path: /etc/systemd/system/hermes-health-receiver.service
      register: hermes_health_receiver_unit
      check_mode: false

    - name: Stop isolated Health units when disabled
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: false
        state: stopped
        daemon_reload: true
      loop:
        - hermes-health-summary.timer
        - hermes-health-receiver.service
      when:
        - hermes_health_receiver_mode == 'disabled'
        - hermes_health_receiver_unit.stat.exists
      failed_when: false

    - name: Skip hosts without isolated Health receiver enabled
      ansible.builtin.meta: end_host
      when: hermes_health_receiver_mode == 'disabled'

    - name: Validate isolated Health receiver paths and network policy
      ansible.builtin.assert:
        that:
          - hermes_health_receiver_data_dir is match('^/var/lib/hermes/health(/[A-Za-z0-9._-]+)*$')
          - hermes_health_receiver_config_dir is match('^/etc/hermes/health(/[A-Za-z0-9._-]+)*$')
          - hermes_health_receiver_effective_port | int >= 1024
          - hermes_health_receiver_effective_port | int <= 65535
          - hermes_health_receiver_effective_sources | length > 0
          - hermes_health_receiver_max_body_bytes | int >= 1
          - hermes_health_receiver_max_body_bytes | int <= 67108864
        fail_msg: "Health receiver paths or bounded network settings are invalid."

    - name: Validate literal Health receiver source addresses
      ansible.builtin.assert:
        that:
          - item is match('^[0-9A-Fa-f:.]+$')
        fail_msg: "Health receiver source allowlists accept literal IPs only."
      loop: "{{ hermes_health_receiver_effective_sources }}"

    - name: Install isolated Health receiver runtime dependencies
      ansible.builtin.apt:
        name:
          - python3
          - sqlite3
        state: present
        update_cache: false

    - name: Create aggregate Health report reader group
      ansible.builtin.group:
        name: "{{ hermes_health_report_group }}"
        system: true

    - name: Create isolated Health service group
      ansible.builtin.group:
        name: "{{ hermes_health_receiver_group }}"
        system: true

    - name: Create isolated Health service account
      ansible.builtin.user:
        name: "{{ hermes_health_receiver_user }}"
        group: "{{ hermes_health_receiver_group }}"
        groups: "{{ hermes_health_report_group }}"
        append: false
        shell: /usr/sbin/nologin
        system: true
        create_home: false
        home: "{{ hermes_health_receiver_data_dir }}"
        comment: "Isolated Health Auto Export receiver"
        password: "!"

    - name: Grant Astra aggregate-only Health report access
      ansible.builtin.user:
        name: hermes-astra
        groups: "{{ hermes_health_report_group }}"
        append: true

    - name: Create isolated Health directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - path: /usr/local/libexec/hermes-health
          owner: root
          group: root
          mode: "0755"
        - path: "{{ hermes_health_receiver_config_dir }}"
          owner: root
          group: "{{ hermes_health_receiver_group }}"
          mode: "0750"
        - path: "{{ hermes_health_receiver_data_dir }}"
          owner: "{{ hermes_health_receiver_user }}"
          group: "{{ hermes_health_report_group }}"
          mode: "0710"
        - path: "{{ hermes_health_receiver_report_dir }}"
          owner: "{{ hermes_health_receiver_user }}"
          group: "{{ hermes_health_report_group }}"
          mode: "2750"

    - name: Deploy isolated Health receiver
      ansible.builtin.copy:
        src: "{{ ansible_config_file | dirname }}/scripts/agents/health-receiver.py"
        dest: /usr/local/libexec/hermes-health/health-receiver.py
        owner: root
        group: root
        mode: "0755"
      notify: Restart isolated Health receiver

    - name: Deploy isolated Health receiver validation probe
      ansible.builtin.copy:
        src: "{{ ansible_config_file | dirname }}/scripts/agents/health-receiver-check.py"
        dest: /usr/local/libexec/hermes-health/health-receiver-check.py
        owner: root
        group: root
        mode: "0755"

    - name: Deploy aggregate-only Health summary publisher
      ansible.builtin.copy:
        src: "{{ ansible_config_file | dirname }}/scripts/agents/health-summary.py"
        dest: /usr/local/libexec/hermes-health/health-summary.py
        owner: root
        group: root
        mode: "0755"

    - name: Inspect protected Hermes Health token
      ansible.builtin.stat:
        path: "{{ hermes_health_receiver_config_dir }}/token"
      register: hermes_health_receiver_active_token_stat
      check_mode: false
      no_log: true

    - name: Require protected Hermes Health token
      ansible.builtin.assert:
        that:
          - hermes_health_receiver_active_token_stat.stat.exists
          - hermes_health_receiver_active_token_stat.stat.isreg
          - hermes_health_receiver_active_token_stat.stat.mode == '0640'
          - hermes_health_receiver_active_token_stat.stat.pw_name == 'root'
          - hermes_health_receiver_active_token_stat.stat.gr_name == hermes_health_receiver_group
        fail_msg: >-
          The Hermes-native Health token is absent or has unsafe metadata.
      no_log: true

    - name: Inspect Hermes-native Health database
      ansible.builtin.stat:
        path: "{{ hermes_health_receiver_db }}"
      register: hermes_health_receiver_db_stat
      check_mode: false

    - name: Require restored Hermes-native Health database
      ansible.builtin.assert:
        that:
          - hermes_health_receiver_db_stat.stat.exists
          - hermes_health_receiver_db_stat.stat.isreg
          - hermes_health_receiver_db_stat.stat.size | int > 0
          - hermes_health_receiver_db_stat.stat.pw_name == hermes_health_receiver_user
          - hermes_health_receiver_db_stat.stat.gr_name == hermes_health_receiver_group
          - hermes_health_receiver_db_stat.stat.mode == '0600'
        fail_msg: >-
          The Hermes-native Health database is absent or has unsafe metadata.
          Restore it from backup instead of creating empty application state.

    - name: Verify isolated Health database integrity
      ansible.builtin.command:
        argv:
          - /usr/bin/sqlite3
          - "{{ hermes_health_receiver_db }}"
          - PRAGMA quick_check
      register: hermes_health_receiver_target_integrity
      changed_when: false
      failed_when: >-
        hermes_health_receiver_target_integrity.rc != 0
        or hermes_health_receiver_target_integrity.stdout != 'ok'
      check_mode: false

    - name: Write nonsecret Health receiver configuration
      ansible.builtin.copy:
        dest: "{{ hermes_health_receiver_config_dir }}/receiver.env"
        owner: root
        group: "{{ hermes_health_receiver_group }}"
        mode: "0640"
        content: |
          HEALTH_RECEIVER_PORT={{ hermes_health_receiver_effective_port }}
          HEALTH_RECEIVER_BIND={{ hermes_health_receiver_effective_bind }}
          HEALTH_RECEIVER_ALLOWED_SOURCES={{ hermes_health_receiver_effective_sources | join(',') }}
          HEALTH_RECEIVER_MAX_BODY_BYTES={{ hermes_health_receiver_max_body_bytes }}
          HEALTH_RECEIVER_RATE_LIMIT={{ hermes_health_receiver_rate_limit }}
          HEALTH_RECEIVER_RATE_WINDOW_SECONDS={{ hermes_health_receiver_rate_window_seconds }}
          HEALTH_RECEIVER_MAX_JSON_DEPTH={{ hermes_health_receiver_max_json_depth }}
          HEALTH_RECEIVER_MAX_JSON_NODES={{ hermes_health_receiver_max_json_nodes }}
          HEALTH_RECEIVER_MAX_COLLECTION_ITEMS={{ hermes_health_receiver_max_collection_items }}
          HEALTH_RECEIVER_MAX_STRING_BYTES={{ hermes_health_receiver_max_string_bytes }}
          HEALTH_RECEIVER_TOKEN_FILE={{ hermes_health_receiver_config_dir }}/token
          HEALTH_DB_PATH={{ hermes_health_receiver_db }}
      notify: Restart isolated Health receiver

    - name: Create hardened isolated Health receiver service
      ansible.builtin.copy:
        dest: /etc/systemd/system/hermes-health-receiver.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Isolated Health Auto Export receiver
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User={{ hermes_health_receiver_user }}
          Group={{ hermes_health_receiver_group }}
          SupplementaryGroups={{ hermes_health_report_group }}
          WorkingDirectory={{ hermes_health_receiver_data_dir }}
          EnvironmentFile={{ hermes_health_receiver_config_dir }}/receiver.env
          ExecStart=/usr/bin/python3 /usr/local/libexec/hermes-health/health-receiver.py
          Restart=on-failure
          RestartSec=5s
          TimeoutStopSec=30s
          UMask=0077
          NoNewPrivileges=yes
          CapabilityBoundingSet=
          AmbientCapabilities=
          LockPersonality=yes
          MemoryDenyWriteExecute=yes
          PrivateDevices=yes
          PrivateTmp=yes
          ProtectClock=yes
          ProtectControlGroups=yes
          ProtectHome=yes
          ProtectHostname=yes
          ProtectKernelLogs=yes
          ProtectKernelModules=yes
          ProtectKernelTunables=yes
          ProtectProc=invisible
          ProtectSystem=strict
          ProcSubset=pid
          ReadOnlyPaths={{ hermes_health_receiver_config_dir }}
          ReadWritePaths={{ hermes_health_receiver_data_dir }}
          RemoveIPC=yes
          RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
          RestrictNamespaces=yes
          RestrictRealtime=yes
          RestrictSUIDSGID=yes
          SocketBindAllow=tcp:{{ hermes_health_receiver_effective_port }}
          SocketBindDeny=any
          SystemCallArchitectures=native
          SystemCallErrorNumber=EPERM
          SystemCallFilter=@system-service
          TasksMax=64
          MemoryMax=512M

          [Install]
          WantedBy=multi-user.target
      notify:
        - Reload systemd
        - Restart isolated Health receiver

    - name: Create hardened aggregate Health summary service
      ansible.builtin.copy:
        dest: /etc/systemd/system/hermes-health-summary.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Publish aggregate-only Health reports for Hermes
          After=hermes-health-receiver.service

          [Service]
          Type=oneshot
          User={{ hermes_health_receiver_user }}
          Group={{ hermes_health_receiver_group }}
          SupplementaryGroups={{ hermes_health_report_group }}
          UMask=0027
          ExecStart=/usr/bin/python3 /usr/local/libexec/hermes-health/health-summary.py --db-path {{ hermes_health_receiver_db }} --format json --output {{ hermes_health_receiver_report_dir }}/yesterday.json
          ExecStart=/usr/bin/python3 /usr/local/libexec/hermes-health/health-summary.py --db-path {{ hermes_health_receiver_db }} --format markdown --no-heading --output {{ hermes_health_receiver_report_dir }}/yesterday.md
          NoNewPrivileges=yes
          CapabilityBoundingSet=
          AmbientCapabilities=
          LockPersonality=yes
          MemoryDenyWriteExecute=yes
          PrivateDevices=yes
          PrivateNetwork=yes
          PrivateTmp=yes
          ProtectClock=yes
          ProtectControlGroups=yes
          ProtectHome=yes
          ProtectHostname=yes
          ProtectKernelLogs=yes
          ProtectKernelModules=yes
          ProtectKernelTunables=yes
          ProtectProc=invisible
          ProtectSystem=strict
          ProcSubset=pid
          ReadOnlyPaths={{ hermes_health_receiver_db }}
          ReadWritePaths={{ hermes_health_receiver_report_dir }}
          RemoveIPC=yes
          RestrictAddressFamilies=AF_UNIX
          RestrictNamespaces=yes
          RestrictRealtime=yes
          RestrictSUIDSGID=yes
          SystemCallArchitectures=native
          SystemCallErrorNumber=EPERM
          SystemCallFilter=@system-service
          TasksMax=32
          MemoryMax=256M

    - name: Create aggregate Health summary timer
      ansible.builtin.copy:
        dest: /etc/systemd/system/hermes-health-summary.timer
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Refresh aggregate-only Health reports

          [Timer]
          OnBootSec=3m
          OnUnitActiveSec=15m
          RandomizedDelaySec=30s
          AccuracySec=15s
          Persistent=true

          [Install]
          WantedBy=timers.target
      notify: Reload systemd

    - name: Flush Health receiver handlers before ensuring service state
      ansible.builtin.meta: flush_handlers
      when:
        - hermes_health_receiver_mode == 'production'
        - not ansible_check_mode

    - name: Keep isolated production Health receiver enabled
      ansible.builtin.systemd_service:
        name: hermes-health-receiver.service
        enabled: true
        state: started
        daemon_reload: true
      when:
        - hermes_health_receiver_mode == 'production'
        - not ansible_check_mode

    - name: Verify authenticated production Health receiver
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - /usr/local/libexec/hermes-health/health-receiver-check.py
          - --url
          - "http://{{ hermes_health_receiver_effective_bind }}:{{ hermes_health_receiver_effective_port }}/health"
          - --token-file
          - "{{ hermes_health_receiver_config_dir }}/token"
      register: hermes_health_receiver_production_check
      changed_when: false
      when:
        - hermes_health_receiver_mode == 'production'
        - not ansible_check_mode
      retries: 5
      delay: 2
      until: hermes_health_receiver_production_check.rc == 0

    - name: Enable aggregate Health report timer
      ansible.builtin.systemd_service:
        name: hermes-health-summary.timer
        enabled: "{{ hermes_health_receiver_mode == 'production' }}"
        state: started
        daemon_reload: true
      when: not ansible_check_mode

    - name: Generate initial aggregate Health reports
      ansible.builtin.systemd_service:
        name: hermes-health-summary.service
        state: started
      when: not ansible_check_mode

    - name: Inspect generated aggregate Health reports
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ hermes_health_receiver_report_dir }}/yesterday.json"
        - "{{ hermes_health_receiver_report_dir }}/yesterday.md"
      register: hermes_health_receiver_reports
      when: not ansible_check_mode

    - name: Require protected aggregate Health reports
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
          - item.stat.mode == '0640'
          - item.stat.pw_name == hermes_health_receiver_user
          - item.stat.gr_name == hermes_health_report_group
          - item.stat.size | int > 0
      loop: "{{ hermes_health_receiver_reports.results | default([]) }}"
      when: not ansible_check_mode

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Restart isolated Health receiver
      ansible.builtin.systemd_service:
        name: hermes-health-receiver.service
        state: restarted
        daemon_reload: true
      when:
        - not ansible_check_mode
        - hermes_health_receiver_mode == 'production'
