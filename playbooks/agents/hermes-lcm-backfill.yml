---
# Purpose: Audit or converge bounded, local-only native LCM historical backfill.
# Hosts: hermes_hosts.
# Key vars: hermes_lcm_backfill_*; hermes_lcm_embedding_*.
# Templates: templates/hermes/hermes-lcm-backfill.*.j2.
# Validation: ansible-playbook playbooks/agents/hermes-lcm-backfill.yml
#             --syntax-check.

- name: Converge Astra native LCM background backfill
  hosts: hermes_hosts
  become: true
  gather_facts: false
  serial: 1

  pre_tasks:
    - name: Validate native LCM backfill operating mode
      ansible.builtin.assert:
        that:
          - hermes_lcm_backfill_mode in ['audit', 'apply']
          - hermes_lcm_embedding_provider in ['ollama', 'fastembed']
          - >-
            hermes_lcm_backfill_mode != 'apply'
            or (
              hermes_lcm_backfill_approved | bool
              and hermes_lcm_backfill_confirmation
                  == hermes_lcm_backfill_required_confirmation
            )
        fail_msg: >-
          LCM backfill requires a local embedding provider; mutation also
          requires apply mode, explicit approval, and the exact confirmation
          phrase.

  tasks:
    - name: Select the managed Astra profile for LCM backfill
      ansible.builtin.set_fact:
        hermes_lcm_backfill_profile: >-
          {{ hermes_shadow_profiles
             | selectattr('name', 'equalto', 'astra') | list | first }}

    - name: Inspect native LCM backfill prerequisites
      ansible.builtin.stat:
        path: "{{ item.path }}"
      loop:
        - name: database
          path: "{{ hermes_lcm_target_database }}"
          expected_type: regular
        - name: plugin
          path: "{{ hermes_lcm_plugin_managed_root }}/plugin.yaml"
          expected_type: regular
        - name: runtime selector
          path: "{{ hermes_shadow_runtime_venv }}/bin/python"
          expected_type: runtime_selector
        - name: maintenance utility
          path: "{{ hermes_lcm_native_maintenance_live }}"
          expected_type: regular
      register: hermes_lcm_backfill_prerequisites

    - name: Require safe native LCM backfill prerequisites
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - >-
            (item.item.expected_type == 'regular'
             and (item.stat.isreg | default(false))
             and not (item.stat.islnk | default(false)))
            or
            (item.item.expected_type == 'runtime_selector'
             and (item.stat.islnk | default(false))
             and (item.stat.lnk_source | default(''))
                 is match('^/usr/local/share/uv/python/'))
        fail_msg: >-
          Required LCM backfill {{ item.item.name }} is missing or unsafe.
      loop: "{{ hermes_lcm_backfill_prerequisites.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Build native LCM backfill command environment
      ansible.builtin.set_fact:
        hermes_lcm_backfill_command_prefix: >-
          {{ ['/usr/sbin/runuser', '--user',
              hermes_lcm_backfill_profile.user, '--', '/usr/bin/env',
              'HOME=' + hermes_lcm_backfill_profile.account_home,
              'HERMES_HOME=' + hermes_lcm_backfill_profile.home,
              'LCM_DATABASE_PATH=' + hermes_lcm_target_database,
              'LCM_EMBEDDINGS_ENABLED=true',
              'LCM_EMBEDDING_PROVIDER=' + hermes_lcm_embedding_provider,
              'LCM_EMBEDDING_MODEL=' + hermes_lcm_embedding_model,
              'LCM_OLLAMA_BASE_URL=' + hermes_lcm_ollama_base_url,
              'LCM_EMBEDDING_STORAGE_DTYPE=' +
                hermes_lcm_embedding_storage_dtype,
              'LCM_EMBEDDING_STORE_DIM=' +
                (hermes_lcm_embedding_store_dim | string),
              'LCM_EMBEDDING_BINARY_PRESCREEN=' +
                (hermes_lcm_embedding_binary_prescreen
                 | ternary('true', 'false')),
              'LCM_EMBED_CONTENT_POLICY=' +
                hermes_lcm_embedding_content_policy,
              'LCM_EMBEDDING_BACKFILL_TIMEOUT_S=' +
                (hermes_lcm_embedding_backfill_timeout_s | string),
              'LCM_EMBEDDING_BACKFILL_BUDGET_S=0',
              hermes_shadow_runtime_venv + '/bin/python',
              hermes_lcm_native_maintenance_live] }}

    - name: Preview bounded LCM backfill lanes
      ansible.builtin.command:
        argv: >-
          {{ hermes_lcm_backfill_command_prefix
             + ['backfill', '--corpus', item.corpus, '--limit',
                (hermes_lcm_native_backfill_batch | string)] }}
      loop: "{{ hermes_lcm_backfill_lanes }}"
      loop_control:
        label: "{{ item.corpus }}"
      register: hermes_lcm_backfill_preview
      changed_when: false
      check_mode: false

    - name: Inspect installed LCM backfill unit files
      ansible.builtin.stat:
        path: "/etc/systemd/system/hermes-lcm-{{ item.0.corpus }}-backfill.{{ item.1 }}"
      loop: "{{ hermes_lcm_backfill_lanes | product(['service', 'timer']) | list }}"
      loop_control:
        label: "{{ item.0.corpus }}.{{ item.1 }}"
      register: hermes_lcm_backfill_unit_files

    - name: Inspect native LCM backfill timer enablement
      ansible.builtin.command:
        argv:
          - /usr/bin/systemctl
          - is-enabled
          - "hermes-lcm-{{ item.corpus }}-backfill.timer"
      loop: "{{ hermes_lcm_backfill_lanes }}"
      loop_control:
        label: "{{ item.corpus }}"
      register: hermes_lcm_backfill_enabled_before
      changed_when: false
      failed_when: false

    - name: Inspect native LCM backfill timer activity
      ansible.builtin.command:
        argv:
          - /usr/bin/systemctl
          - is-active
          - "hermes-lcm-{{ item.corpus }}-backfill.timer"
      loop: "{{ hermes_lcm_backfill_lanes }}"
      loop_control:
        label: "{{ item.corpus }}"
      register: hermes_lcm_backfill_active_before
      changed_when: false
      failed_when: false

    - name: Report native LCM backfill audit
      ansible.builtin.debug:
        msg:
          previews: >-
            {{ hermes_lcm_backfill_preview.results
               | map(attribute='stdout') | list }}
          unit_files_present: >-
            {{ hermes_lcm_backfill_unit_files.results
               | map(attribute='stat.exists') | list }}
          enabled: >-
            {{ hermes_lcm_backfill_enabled_before.results
               | map(attribute='stdout') | list }}
          active: >-
            {{ hermes_lcm_backfill_active_before.results
               | map(attribute='stdout') | list }}
          mutation_authorized: "{{ hermes_lcm_backfill_mode == 'apply' }}"

    - name: Stop after read-only native LCM backfill audit
      ansible.builtin.meta: end_host
      when: hermes_lcm_backfill_mode == 'audit'

    - name: Preview native LCM backfill services
      ansible.builtin.template:
        src: >-
          {{ playbook_dir }}/../../templates/hermes/hermes-lcm-backfill.service.j2
        dest: >-
          /etc/systemd/system/hermes-lcm-{{ item.corpus }}-backfill.service
        owner: root
        group: root
        mode: "0644"
      loop: "{{ hermes_lcm_backfill_lanes }}"
      loop_control:
        label: "{{ item.corpus }}"
      vars:
        hermes_lcm_backfill_lane: "{{ item }}"
      check_mode: true
      register: hermes_lcm_backfill_service_preview

    - name: Preview native LCM backfill timers
      ansible.builtin.template:
        src: >-
          {{ playbook_dir }}/../../templates/hermes/hermes-lcm-backfill.timer.j2
        dest: "/etc/systemd/system/hermes-lcm-{{ item.corpus }}-backfill.timer"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ hermes_lcm_backfill_lanes }}"
      loop_control:
        label: "{{ item.corpus }}"
      vars:
        hermes_lcm_backfill_lane: "{{ item }}"
      check_mode: true
      register: hermes_lcm_backfill_timer_preview

    - name: Stop check mode after complete LCM backfill preview
      ansible.builtin.meta: end_host
      when: ansible_check_mode

    - name: Converge native LCM backfill services
      ansible.builtin.template:
        src: >-
          {{ playbook_dir }}/../../templates/hermes/hermes-lcm-backfill.service.j2
        dest: >-
          /etc/systemd/system/hermes-lcm-{{ item.corpus }}-backfill.service
        owner: root
        group: root
        mode: "0644"
        backup: true
      loop: "{{ hermes_lcm_backfill_lanes }}"
      loop_control:
        label: "{{ item.corpus }}"
      vars:
        hermes_lcm_backfill_lane: "{{ item }}"
      register: hermes_lcm_backfill_services

    - name: Converge native LCM backfill timers
      ansible.builtin.template:
        src: >-
          {{ playbook_dir }}/../../templates/hermes/hermes-lcm-backfill.timer.j2
        dest: "/etc/systemd/system/hermes-lcm-{{ item.corpus }}-backfill.timer"
        owner: root
        group: root
        mode: "0644"
        backup: true
      loop: "{{ hermes_lcm_backfill_lanes }}"
      loop_control:
        label: "{{ item.corpus }}"
      vars:
        hermes_lcm_backfill_lane: "{{ item }}"
      register: hermes_lcm_backfill_timers

    - name: Reload systemd after LCM backfill unit changes
      ansible.builtin.systemd_service:
        daemon_reload: true
      when: >-
        (hermes_lcm_backfill_services.results
         | selectattr('changed') | list | length > 0)
        or
        (hermes_lcm_backfill_timers.results
         | selectattr('changed') | list | length > 0)

    - name: Verify native LCM backfill units
      ansible.builtin.command:
        argv:
          - /usr/bin/systemd-analyze
          - verify
          - "/etc/systemd/system/hermes-lcm-{{ item.0.corpus }}-backfill.{{ item.1 }}"
      loop: "{{ hermes_lcm_backfill_lanes | product(['service', 'timer']) | list }}"
      loop_control:
        label: "{{ item.0.corpus }}.{{ item.1 }}"
      changed_when: false

    - name: Enable native LCM backfill timers
      ansible.builtin.systemd_service:
        name: "hermes-lcm-{{ item.corpus }}-backfill.timer"
        enabled: true
        state: started
      loop: "{{ hermes_lcm_backfill_lanes }}"
      loop_control:
        label: "{{ item.corpus }}"

    - name: Require enabled active native LCM backfill timers
      ansible.builtin.command:
        argv:
          - /usr/bin/systemctl
          - show
          - "hermes-lcm-{{ item.corpus }}-backfill.timer"
          - --property=ActiveState
          - --property=UnitFileState
          - --value
      loop: "{{ hermes_lcm_backfill_lanes }}"
      loop_control:
        label: "{{ item.corpus }}"
      register: hermes_lcm_backfill_final
      changed_when: false
      failed_when: >-
        'active' not in hermes_lcm_backfill_final.stdout_lines
        or 'enabled' not in hermes_lcm_backfill_final.stdout_lines
