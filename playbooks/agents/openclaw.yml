# Purpose: Deploy OpenClaw AI agent.
# Hosts: openclaw_hosts.
# Key vars: codex_*, claude_memory_sync_*, openclaw_*.
# Templates: templates/openclaw.
# Scripts: templates/openclaw.
# Validation: ansible-playbook playbooks/agents/openclaw.yml --syntax-check.

# =============================================================================
# OpenClaw Playbook - Deploy OpenClaw AI agent infrastructure
# =============================================================================
# Manages the infrastructure for OpenClaw: npm package, systemd timers,
# git repo clone, and linting tools. The gateway service is managed by
# OpenClaw itself via `openclaw gateway install` (user-level systemd unit).
# Application config files (openclaw.json, .env) are created manually on the
# VM and backed up by restic.
#
# Usage: ansible-playbook playbooks/agents/openclaw.yml
# =============================================================================

- name: Deploy OpenClaw AI agent
  hosts: openclaw_hosts
  become: true
  gather_facts: true

  tasks:
    # --- Disable path: stop services if openclaw is disabled ---
    - name: Stop and disable OpenClaw services (disabled hosts)
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: false
        state: stopped
        daemon_reload: true
      loop:
        - openclaw-repo-sync.timer
        - openclaw-update-check.timer
      when: not (openclaw_enabled | default(false))
      failed_when: false

    - name: Stop OpenClaw user gateway service (disabled hosts)
      ansible.builtin.shell:
        cmd: su - {{ admin_user | default('johnny') }} -c 'openclaw gateway uninstall' || true
      when: not (openclaw_enabled | default(false))
      failed_when: false
      changed_when: false

    - name: Skip hosts without openclaw_enabled
      ansible.builtin.meta: end_host
      when: not (openclaw_enabled | default(false))

    # --- Clean up old system-level service (replaced by user-level) ---
    - name: Remove old system-level openclaw.service
      ansible.builtin.file:
        path: /etc/systemd/system/openclaw.service
        state: absent
      notify: Reload systemd

    # --- Install OpenClaw + ClawHub via johnny's npm prefix ---
    - name: Ensure OpenClaw npm prefix directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
        mode: "0755"
      loop:
        - "{{ openclaw_npm_prefix | default('/home/' ~ admin_user ~ '/.npm-global') }}"
        - "{{ openclaw_npm_prefix | default('/home/' ~ admin_user ~ '/.npm-global') }}/bin"
        - "{{ openclaw_npm_prefix | default('/home/' ~ admin_user ~ '/.npm-global') }}/lib"
        - "{{ openclaw_npm_prefix | default('/home/' ~ admin_user ~ '/.npm-global') }}/lib/node_modules"

    - name: Configure npm global prefix for OpenClaw user
      ansible.builtin.lineinfile:
        path: "/home/{{ admin_user }}/.npmrc"
        regexp: "^prefix="
        line: "prefix={{ openclaw_npm_prefix | default('/home/' ~ admin_user ~ '/.npm-global') }}"
        create: true
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
        mode: "0644"

    - name: Add OpenClaw npm bin to shell PATH
      ansible.builtin.blockinfile:
        path: "{{ item }}"
        create: true
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
        mode: "0644"
        marker: "# {mark} ANSIBLE MANAGED BLOCK - OpenClaw npm prefix"
        block: |
          case ":$PATH:" in
            *":{{ openclaw_npm_prefix | default('/home/' ~ admin_user ~ '/.npm-global') }}/bin:"*) ;;
            *) export PATH="{{ openclaw_npm_prefix | default('/home/' ~ admin_user ~ '/.npm-global') }}/bin:$PATH" ;;
          esac
      loop:
        - "/home/{{ admin_user }}/.profile"
        - "/home/{{ admin_user }}/.bashrc"

    - name: Remove OpenClaw packages from non-OpenClaw npm prefixes
      ansible.builtin.command:
        cmd: "sudo -iu {{ admin_user }} npm --prefix {{ item }} uninstall -g openclaw clawhub"
      loop: "{{ openclaw_cleanup_npm_prefixes | default([]) }}"
      loop_control:
        label: "{{ item }}"
      register: openclaw_cleanup_npm
      changed_when: >-
        'removed' in (openclaw_cleanup_npm.stdout | default(''))
        or 'changed' in (openclaw_cleanup_npm.stdout | default(''))
      when:
        - item != (openclaw_npm_prefix | default('/home/' ~ admin_user ~ '/.npm-global'))
        - not ansible_check_mode

    - name: Install or update OpenClaw globally via npm
      ansible.builtin.command:
        cmd: sudo -iu {{ admin_user }} npm --prefix {{ openclaw_npm_prefix | default('/home/' ~ admin_user ~ '/.npm-global') }} install -g "openclaw@{{ openclaw_package_version | default('latest') }}"
      register: openclaw_npm_install
      changed_when: >-
        'changed' in (openclaw_npm_install.stdout | default(''))
        or 'added' in (openclaw_npm_install.stdout | default(''))
        or 'removed' in (openclaw_npm_install.stdout | default(''))
      when: not ansible_check_mode
      notify: Restart OpenClaw gateway

    - name: Check whether OpenClaw CLI is available
      ansible.builtin.shell:
        cmd: test -x "{{ openclaw_npm_prefix | default('/home/' ~ admin_user ~ '/.npm-global') }}/bin/openclaw"
      register: openclaw_cli_check
      check_mode: false
      failed_when: false
      changed_when: false

    - name: Check OpenClaw update status
      ansible.builtin.command:
        cmd: sudo -iu {{ admin_user }} {{ openclaw_npm_prefix | default('/home/' ~ admin_user ~ '/.npm-global') }}/bin/openclaw update --dry-run --json --timeout 300
      register: openclaw_update_status
      check_mode: false
      changed_when: false
      when:
        - ansible_check_mode
        - openclaw_cli_check.rc == 0

    - name: Install or update ClawHub CLI globally via npm
      ansible.builtin.command:
        cmd: sudo -iu {{ admin_user }} npm --prefix {{ openclaw_npm_prefix | default('/home/' ~ admin_user ~ '/.npm-global') }} install -g clawhub@latest
      register: clawhub_npm_install
      changed_when: >-
        'changed' in (clawhub_npm_install.stdout | default(''))
        or 'added' in (clawhub_npm_install.stdout | default(''))
        or 'removed' in (clawhub_npm_install.stdout | default(''))
      when: not ansible_check_mode

    # --- Install linting tools in a venv ---
    - name: Create OpenClaw venv for linting tools
      ansible.builtin.pip:
        name:
          - ansible-lint
          - yamllint
        virtualenv: /opt/openclaw-venv
        virtualenv_command: python3 -m venv

    - name: Keep OpenClaw lint venv from shadowing controller Ansible CLI
      ansible.builtin.copy:
        dest: "/opt/openclaw-venv/bin/{{ item }}"
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/bin/sh
          exec /usr/bin/{{ item }} "$@"
      loop:
        - ansible
        - ansible-config
        - ansible-console
        - ansible-doc
        - ansible-galaxy
        - ansible-inventory
        - ansible-playbook
        - ansible-pull
        - ansible-test
        - ansible-vault
      tags: [openclaw-path]

    - name: Remove OpenClaw lint venv PATH prepend
      ansible.builtin.lineinfile:
        path: /home/{{ admin_user }}/.profile
        regexp: '^export PATH="/opt/openclaw-venv/bin:\$PATH"$'
        state: absent
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
        create: true
        mode: "0644"
      tags: [openclaw-path]

    - name: Add OpenClaw lint venv to the end of johnny's PATH
      ansible.builtin.blockinfile:
        path: /home/{{ admin_user }}/.profile
        create: true
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
        mode: "0644"
        marker: "# {mark} ANSIBLE MANAGED BLOCK - OpenClaw lint venv"
        block: |
          _openclaw_lint_venv="/opt/openclaw-venv/bin"
          _openclaw_new_path=""
          _openclaw_old_ifs=$IFS
          IFS=:
          for _openclaw_path_entry in $PATH; do
            if [ "$_openclaw_path_entry" != "$_openclaw_lint_venv" ]; then
              if [ -z "$_openclaw_new_path" ]; then
                _openclaw_new_path="$_openclaw_path_entry"
              else
                _openclaw_new_path="$_openclaw_new_path:$_openclaw_path_entry"
              fi
            fi
          done
          IFS=$_openclaw_old_ifs
          export PATH="$_openclaw_new_path:$_openclaw_lint_venv"
          unset _openclaw_lint_venv _openclaw_new_path _openclaw_old_ifs _openclaw_path_entry
      tags: [openclaw-path]

    # --- Create config directory ---
    - name: Create OpenClaw config directory
      ansible.builtin.file:
        path: /home/{{ admin_user }}/.openclaw
        state: directory
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
        mode: "0700"

    # --- Clone cc-ansible repo ---
    - name: Create workspace directory
      ansible.builtin.file:
        path: "{{ openclaw_workspace }}"
        state: directory
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
        mode: "0755"

    - name: Check whether cc-ansible repo is already cloned
      ansible.builtin.stat:
        path: "{{ openclaw_workspace }}/.git"
      register: openclaw_workspace_git

    - name: Clone cc-ansible repo
      ansible.builtin.command:
        cmd: sudo -iu {{ admin_user }} git clone https://github.com/johnnynalley/cc-ansible.git {{ openclaw_workspace }}
        creates: "{{ openclaw_workspace }}/.git"
      when: not openclaw_workspace_git.stat.exists

    - name: Update cc-ansible repo
      ansible.builtin.command:
        cmd: sudo -iu {{ admin_user }} git -C {{ openclaw_workspace }} pull --ff-only
      register: openclaw_git_pull
      changed_when: >-
        openclaw_git_pull.rc == 0
        and 'Already up to date.' not in (openclaw_git_pull.stdout | default(''))
      failed_when: false
      when: openclaw_workspace_git.stat.exists

    - name: Report cc-ansible workspace sync warning
      ansible.builtin.debug:
        msg: >-
          OpenClaw workspace sync did not fast-forward cleanly at {{ openclaw_workspace }}.
          This does not block OpenClaw package maintenance, but repo-sync may need manual
          reconciliation. Error: {{ openclaw_git_pull.stderr | default(openclaw_git_pull.stdout, true) }}
      when:
        - openclaw_workspace_git.stat.exists
        - openclaw_git_pull.rc | default(0) != 0

    # --- Configure git for push access ---
    - name: Configure git user name
      ansible.builtin.command:
        cmd: sudo -iu {{ admin_user }} git config --global user.name "Johnny Nalley"
      changed_when: false

    - name: Configure git user email
      ansible.builtin.command:
        cmd: sudo -iu {{ admin_user }} git config --global user.email johnny@jnalley.me
      changed_when: false

    - name: Configure git credential store
      ansible.builtin.command:
        cmd: sudo -iu {{ admin_user }} git config --global credential.helper store
      changed_when: false

    - name: Repair migrated OpenClaw npm workspace package namespace
      ansible.builtin.shell:
        cmd: |
          sudo -iu {{ admin_user }} node <<'NODE'
          const fs = require('fs');
          const path = '/home/{{ admin_user }}/.openclaw/npm/package.json';
          const prefix = "{{ openclaw_npm_prefix | default('/home/' ~ admin_user ~ '/.npm-global') }}";
          if (!fs.existsSync(path)) {
            console.log('package-missing');
            process.exit(0);
          }

          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.dependencies = pkg.dependencies || {};

          const replacements = {
            '@mariozechner/pi-agent-core': '@earendil-works/pi-agent-core',
            '@mariozechner/pi-ai': '@earendil-works/pi-ai',
            '@mariozechner/pi-coding-agent': '@earendil-works/pi-coding-agent',
          };

          let changed = false;
          for (const [oldName, newName] of Object.entries(replacements)) {
            if (Object.prototype.hasOwnProperty.call(pkg.dependencies, oldName)) {
              delete pkg.dependencies[oldName];
              changed = true;
            }
            const desired = `file:${prefix}/lib/node_modules/openclaw/node_modules/${newName}`;
            if (pkg.dependencies[newName] !== desired) {
              pkg.dependencies[newName] = desired;
              changed = true;
            }
          }

          if (changed) {
            const stamp = new Date().toISOString().replace(/[-:TZ.]/g, '').slice(0, 14);
            fs.copyFileSync(path, `${path}.pre-namespace-repair-${stamp}`);
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
            console.log('changed');
          } else {
            console.log('ok');
          }
          NODE
      register: openclaw_namespace_repair
      changed_when: "'changed' in (openclaw_namespace_repair.stdout | default(''))"
      when: not ansible_check_mode

    # --- Install Mem0 memory plugin ---
    - name: Check whether Mem0 plugin is already installed
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -o pipefail
          sudo -iu {{ admin_user }} {{ openclaw_npm_prefix | default('/home/' ~ admin_user ~ '/.npm-global') }}/bin/openclaw plugins list --json \
            | node -e '
              let data = "";
              process.stdin.on("data", chunk => data += chunk);
              process.stdin.on("end", () => {
                const jsonStart = data.indexOf("{");
                if (jsonStart < 0) {
                  process.exit(2);
                }
                const parsed = JSON.parse(data.slice(jsonStart));
                const plugins = Array.isArray(parsed.plugins) ? parsed.plugins : [];
                const installed = plugins.some((plugin) =>
                  plugin.id === "openclaw-mem0"
                  || plugin.name === "Memory (Mem0)"
                  || String(plugin.source || "").includes("@mem0/openclaw-mem0")
                  || String(plugin.rootDir || "").includes("@mem0/openclaw-mem0")
                );
                process.exit(installed ? 0 : 1);
              });
            '
      register: openclaw_mem0_plugin
      check_mode: false
      changed_when: false
      failed_when: false

    - name: Install Mem0 plugin
      ansible.builtin.command:
        cmd: sudo -iu {{ admin_user }} {{ openclaw_npm_prefix | default('/home/' ~ admin_user ~ '/.npm-global') }}/bin/openclaw plugins install @mem0/openclaw-mem0
      register: mem0_install
      changed_when: "'installed' in (mem0_install.stdout | default('') | lower) or 'updated' in (mem0_install.stdout | default('') | lower)"
      when:
        - openclaw_mem0_plugin.rc != 0
        - not ansible_check_mode

    - name: Update existing Mem0 plugin
      ansible.builtin.command:
        cmd: sudo -iu {{ admin_user }} {{ openclaw_npm_prefix | default('/home/' ~ admin_user ~ '/.npm-global') }}/bin/openclaw plugins update openclaw-mem0
      register: mem0_update
      changed_when: >-
        'updated' in (mem0_update.stdout | default('') | lower)
        or 'installed' in (mem0_update.stdout | default('') | lower)
      when:
        - openclaw_mem0_plugin.rc == 0
        - not ansible_check_mode

    - name: Sync OpenClaw managed plugins after core update
      ansible.builtin.command:
        cmd: sudo -iu {{ admin_user }} {{ openclaw_npm_prefix | default('/home/' ~ admin_user ~ '/.npm-global') }}/bin/openclaw plugins update --all
      register: openclaw_plugins_update
      changed_when: >-
        'updated' in (openclaw_plugins_update.stdout | default('') | lower)
        or 'installed' in (openclaw_plugins_update.stdout | default('') | lower)
      when: openclaw_npm_install.changed | default(false)
      notify: Restart OpenClaw gateway

    # --- Install OpenClaw gateway service (user-level systemd) ---
    - name: Install OpenClaw gateway service
      ansible.builtin.command:
        cmd: sudo -iu {{ admin_user }} {{ openclaw_npm_prefix | default('/home/' ~ admin_user ~ '/.npm-global') }}/bin/openclaw gateway install
      register: gateway_install
      changed_when: "'Installed' in gateway_install.stdout"
      notify: Restart OpenClaw gateway

    - name: Create OpenClaw compile cache directory
      ansible.builtin.file:
        path: /var/tmp/openclaw-compile-cache
        state: directory
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
        mode: "0700"

    - name: Create OpenClaw gateway user service override directory
      ansible.builtin.file:
        path: /home/{{ admin_user }}/.config/systemd/user/openclaw-gateway.service.d
        state: directory
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
        mode: "0755"

    - name: Configure OpenClaw gateway startup optimization environment
      ansible.builtin.copy:
        dest: /home/{{ admin_user }}/.config/systemd/user/openclaw-gateway.service.d/performance.conf
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
        mode: "0644"
        content: |
          [Service]
          Environment=NODE_COMPILE_CACHE=/var/tmp/openclaw-compile-cache
          Environment=OPENCLAW_NO_RESPAWN=1
      notify:
        - Reload OpenClaw user systemd
        - Restart OpenClaw gateway

    # --- Enable linger for headless persistence ---
    - name: Enable lingering for {{ admin_user }}
      ansible.builtin.command:
        cmd: loginctl enable-linger {{ admin_user }}
      changed_when: false

    # --- Deploy repo-sync timer (git pull every 5 min) ---
    - name: Create openclaw-repo-sync.service
      ansible.builtin.copy:
        dest: /etc/systemd/system/openclaw-repo-sync.service
        mode: "0644"
        content: |
          [Unit]
          Description=Pull latest cc-ansible for OpenClaw
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=oneshot
          User={{ admin_user }}
          Environment=GIT_TERMINAL_PROMPT=0
          WorkingDirectory={{ openclaw_workspace }}
          ExecStart=/usr/bin/git pull --ff-only
      notify: Reload systemd

    - name: Create openclaw-repo-sync.timer
      ansible.builtin.copy:
        dest: /etc/systemd/system/openclaw-repo-sync.timer
        mode: "0644"
        content: |
          [Unit]
          Description=Pull cc-ansible every 5 minutes for OpenClaw

          [Timer]
          OnCalendar=*-*-* *:0/5
          RandomizedDelaySec=30
          Persistent=true

          [Install]
          WantedBy=timers.target
      notify: Reload systemd

    # --- Deploy update-check timer (daily at 08:00) ---
    - name: Create openclaw-safe-update script
      ansible.builtin.template:
        src: "{{ ansible_config_file | dirname }}/templates/openclaw/openclaw-safe-update.sh.j2"
        dest: /usr/local/sbin/openclaw-safe-update
        mode: "0755"
        owner: root
        group: root

    - name: Create openclaw-update-check script
      ansible.builtin.template:
        src: "{{ ansible_config_file | dirname }}/templates/openclaw/openclaw-update-check.sh.j2"
        dest: /usr/local/sbin/openclaw-update-check
        mode: "0755"
        owner: root
        group: root

    - name: Create openclaw-update-check.service
      ansible.builtin.copy:
        dest: /etc/systemd/system/openclaw-update-check.service
        mode: "0644"
        content: |
          [Unit]
          Description=Check for OpenClaw updates
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/openclaw-update-check
          StandardOutput=journal
          StandardError=journal
          TimeoutStartSec=60
      notify: Reload systemd

    - name: Create openclaw-update-check.timer
      ansible.builtin.copy:
        dest: /etc/systemd/system/openclaw-update-check.timer
        mode: "0644"
        content: |
          [Unit]
          Description=Daily OpenClaw update check

          [Timer]
          OnCalendar=*-*-* 08:00:00
          RandomizedDelaySec=900
          Persistent=true

          [Install]
          WantedBy=timers.target
      notify: Reload systemd

    # --- Start and enable timers ---
    - name: Enable and start repo-sync timer
      ansible.builtin.systemd:
        name: openclaw-repo-sync.timer
        enabled: true
        state: started
      when: not ansible_check_mode

    - name: Enable and start update-check timer
      ansible.builtin.systemd:
        name: openclaw-update-check.timer
        enabled: true
        state: started
      when: not ansible_check_mode

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Reload OpenClaw user systemd
      ansible.builtin.shell:
        cmd: |
          uid=$(id -u {{ admin_user }})
          XDG_RUNTIME_DIR=/run/user/$uid \
          DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$uid/bus \
            runuser -u {{ admin_user }} -- systemctl --user daemon-reload

    - name: Restart OpenClaw gateway
      ansible.builtin.shell:
        cmd: |
          uid=$(id -u {{ admin_user }})
          XDG_RUNTIME_DIR=/run/user/$uid \
          DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$uid/bus \
            runuser -u {{ admin_user }} -- systemctl --user restart openclaw-gateway.service
