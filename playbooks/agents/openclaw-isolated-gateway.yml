---
# yamllint disable rule:line-length
# Purpose: Stage a parallel, deny-by-default OpenClaw Gateway canary.
# Hosts: openclaw_hosts.
# Key vars: openclaw_isolated_gateway_*.
# Templates: templates/openclaw/openclaw-isolated*.j2.
# Scripts: scripts/agents/openclaw-isolated-secrets.py.
# Validation: ansible-playbook playbooks/agents/openclaw-isolated-gateway.yml --syntax-check.

- name: Configure isolated OpenClaw Gateway canary
  hosts: openclaw_hosts
  become: true
  gather_facts: false

  tasks:
    - name: Validate isolated Gateway mode
      ansible.builtin.assert:
        that:
          - openclaw_isolated_gateway_mode | default('disabled') in ['disabled', 'canary']
        fail_msg: >-
          openclaw_isolated_gateway_mode must be disabled or canary. This
          playbook does not implement a production cutover.

    - name: Inspect isolated Gateway unit
      ansible.builtin.stat:
        path: /etc/systemd/system/openclaw-isolated-gateway.service
      register: openclaw_isolated_gateway_unit
      check_mode: false

    - name: Stop isolated Gateway when disabled
      ansible.builtin.systemd_service:
        name: openclaw-isolated-gateway.service
        enabled: false
        state: stopped
        daemon_reload: true
      when:
        - openclaw_isolated_gateway_mode == 'disabled'
        - openclaw_isolated_gateway_unit.stat.exists

    - name: Skip hosts without isolated Gateway canary approval
      ansible.builtin.meta: end_host
      when: openclaw_isolated_gateway_mode == 'disabled'

    - name: Require explicit approval for isolated Gateway canary
      ansible.builtin.assert:
        that:
          - openclaw_isolated_gateway_canary_approved | default(false) | bool
        fail_msg: >-
          The canary creates a service account, installs a separate OpenClaw
          runtime, and starts a parallel listener. Owner approval is required.

    - name: Validate isolated Gateway paths and policy
      ansible.builtin.assert:
        that:
          - openclaw_isolated_gateway_user == 'openclaw'
          - openclaw_isolated_gateway_group == 'openclaw'
          - openclaw_isolated_gateway_config_dir is match('^/etc/openclaw-isolated$')
          - openclaw_isolated_gateway_config_file == openclaw_isolated_gateway_config_dir + '/openclaw.json'
          - openclaw_isolated_gateway_secret_file == openclaw_isolated_gateway_config_dir + '/secrets.json'
          - openclaw_isolated_gateway_state_dir is match('^/var/lib/openclaw-isolated$')
          - openclaw_isolated_gateway_runtime_dir is match('^/opt/openclaw-isolated$')
          - openclaw_isolated_gateway_workspace_dir is match('^/usr/local/share/openclaw-isolated/workspace$')
          - openclaw_isolated_gateway_credential_source is match('^/home/[A-Za-z0-9._-]+/.+$')
          - openclaw_isolated_gateway_port | int >= 1024
          - openclaw_isolated_gateway_port | int <= 65535
          - openclaw_isolated_gateway_port | int != openclaw_port | int
          - openclaw_isolated_gateway_report_groups | default([]) | length == 0
        fail_msg: >-
          The canary paths, port, or initial group policy are outside the fixed
          isolation contract.

    - name: Inspect legacy credential source
      ansible.builtin.stat:
        path: "{{ openclaw_isolated_gateway_credential_source }}"
      register: openclaw_isolated_gateway_credential_stat
      check_mode: false
      no_log: true

    - name: Require protected legacy credential source
      ansible.builtin.assert:
        that:
          - openclaw_isolated_gateway_credential_stat.stat.exists
          - openclaw_isolated_gateway_credential_stat.stat.isreg
          - not openclaw_isolated_gateway_credential_stat.stat.islnk
          - openclaw_isolated_gateway_credential_stat.stat.mode == '0600'
          - openclaw_isolated_gateway_credential_stat.stat.pw_name == openclaw_isolated_gateway_legacy_user
          - openclaw_isolated_gateway_credential_stat.stat.size | int > 0
          - openclaw_isolated_gateway_credential_stat.stat.size | int <= 1048576
        fail_msg: >-
          The legacy credential source is absent or not a protected regular
          file. Refusing to import from a looser source.
      no_log: true

    - name: Inspect existing isolated Gateway paths
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ openclaw_isolated_gateway_config_dir }}"
        - "{{ openclaw_isolated_gateway_state_dir }}"
        - "{{ openclaw_isolated_gateway_workspace_dir }}"
        - /etc/systemd/system/openclaw-isolated-gateway.service
      register: openclaw_isolated_gateway_existing_paths
      check_mode: false

    - name: Inspect previous isolated Gateway service state
      ansible.builtin.command:
        argv:
          - /usr/bin/systemctl
          - is-active
          - openclaw-isolated-gateway.service
      register: openclaw_isolated_gateway_previous_service
      check_mode: false
      changed_when: false
      failed_when: false

    - name: Inspect pre-existing isolated Gateway account
      ansible.builtin.command:
        argv:
          - /usr/bin/getent
          - passwd
          - "{{ openclaw_isolated_gateway_user }}"
      register: openclaw_isolated_gateway_existing_account
      check_mode: false
      changed_when: false
      failed_when: false

    - name: Reject an unrelated pre-existing OpenClaw account
      ansible.builtin.assert:
        that:
          - >-
            openclaw_isolated_gateway_existing_account.rc != 0
            or (
              openclaw_isolated_gateway_existing_account.stdout.split(':')[5]
              == openclaw_isolated_gateway_state_dir
              and
              openclaw_isolated_gateway_existing_account.stdout.split(':')[6]
              == '/usr/sbin/nologin'
            )
        fail_msg: >-
          A pre-existing openclaw account has an unexpected home or shell.
          Refusing to repurpose an identity owned by another deployment.

    - name: Set isolated Gateway backup timestamp
      ansible.builtin.set_fact:
        openclaw_isolated_gateway_backup_stamp: "{{ lookup('pipe', 'date -u +%Y%m%dT%H%M%SZ') }}"

    - name: Create isolated Gateway backup directory
      ansible.builtin.file:
        path: "{{ openclaw_isolated_gateway_backup_dir }}/{{ openclaw_isolated_gateway_backup_stamp }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Create consistent isolated Gateway rollback artifact
      block:
        - name: Stop existing isolated Gateway before backup
          ansible.builtin.systemd_service:
            name: openclaw-isolated-gateway.service
            state: stopped
          when: openclaw_isolated_gateway_previous_service.rc == 0

        - name: Back up existing isolated Gateway state
          ansible.builtin.command:
            argv:
              - /usr/bin/tar
              - --create
              - --gzip
              - --ignore-failed-read
              - --file
              - "{{ openclaw_isolated_gateway_backup_dir }}/{{ openclaw_isolated_gateway_backup_stamp }}/state.tar.gz"
              - --directory
              - /
              - "{{ openclaw_isolated_gateway_config_dir | regex_replace('^/', '') }}"
              - "{{ openclaw_isolated_gateway_state_dir | regex_replace('^/', '') }}"
              - "{{ openclaw_isolated_gateway_workspace_dir | regex_replace('^/', '') }}"
              - etc/systemd/system/openclaw-isolated-gateway.service
          when: >-
            openclaw_isolated_gateway_existing_paths.results
            | selectattr('stat.exists')
            | list
            | length > 0
          changed_when: true
          no_log: true

        - name: Protect isolated Gateway rollback archive
          ansible.builtin.file:
            path: "{{ openclaw_isolated_gateway_backup_dir }}/{{ openclaw_isolated_gateway_backup_stamp }}/state.tar.gz"
            owner: root
            group: root
            mode: "0600"
          when: >-
            openclaw_isolated_gateway_existing_paths.results
            | selectattr('stat.exists')
            | list
            | length > 0

        - name: Record empty isolated Gateway backup baseline
          ansible.builtin.copy:
            dest: "{{ openclaw_isolated_gateway_backup_dir }}/{{ openclaw_isolated_gateway_backup_stamp }}/EMPTY_BASELINE"
            owner: root
            group: root
            mode: "0600"
            content: "No pre-existing isolated Gateway state was present.\n"
          when: >-
            openclaw_isolated_gateway_existing_paths.results
            | selectattr('stat.exists')
            | list
            | length == 0

      rescue:
        - name: Restart isolated Gateway after backup failure
          ansible.builtin.systemd_service:
            name: openclaw-isolated-gateway.service
            state: started
          when: openclaw_isolated_gateway_previous_service.rc == 0

        - name: Stop after isolated Gateway backup failure
          ansible.builtin.fail:
            msg: >-
              Could not create a consistent isolated Gateway rollback artifact.
              No canary state was changed.

    - name: Stage and validate isolated Gateway canary
      block:
        - name: Create isolated Gateway group
          ansible.builtin.group:
            name: "{{ openclaw_isolated_gateway_group }}"
            system: true

        - name: Create isolated Gateway service account
          ansible.builtin.user:
            name: "{{ openclaw_isolated_gateway_user }}"
            group: "{{ openclaw_isolated_gateway_group }}"
            groups: "{{ openclaw_isolated_gateway_report_groups | default([]) }}"
            append: false
            shell: /usr/sbin/nologin
            system: true
            create_home: false
            home: "{{ openclaw_isolated_gateway_state_dir }}"
            comment: "Isolated OpenClaw Gateway"
            password: "!"

        - name: Create isolated Gateway directories
          ansible.builtin.file:
            path: "{{ item.path }}"
            state: directory
            owner: "{{ item.owner }}"
            group: "{{ item.group }}"
            mode: "{{ item.mode }}"
          loop:
            - path: "{{ openclaw_isolated_gateway_runtime_dir }}"
              owner: root
              group: root
              mode: "0755"
            - path: "{{ openclaw_isolated_gateway_config_dir }}"
              owner: root
              group: "{{ openclaw_isolated_gateway_group }}"
              mode: "0750"
            - path: "{{ openclaw_isolated_gateway_state_dir }}"
              owner: "{{ openclaw_isolated_gateway_user }}"
              group: "{{ openclaw_isolated_gateway_group }}"
              mode: "0700"
            - path: "{{ openclaw_isolated_gateway_state_dir }}/state"
              owner: "{{ openclaw_isolated_gateway_user }}"
              group: "{{ openclaw_isolated_gateway_group }}"
              mode: "0700"
            - path: "{{ openclaw_isolated_gateway_state_dir }}/compile-cache"
              owner: "{{ openclaw_isolated_gateway_user }}"
              group: "{{ openclaw_isolated_gateway_group }}"
              mode: "0700"
            - path: /usr/local/share/openclaw-isolated
              owner: root
              group: root
              mode: "0755"
            - path: "{{ openclaw_isolated_gateway_workspace_dir }}"
              owner: root
              group: root
              mode: "0555"
            - path: /usr/local/libexec/openclaw-isolated
              owner: root
              group: root
              mode: "0755"

        - name: Install isolated Gateway credential bootstrapper
          ansible.builtin.copy:
            src: "{{ ansible_config_file | dirname }}/scripts/agents/openclaw-isolated-secrets.py"
            dest: /usr/local/libexec/openclaw-isolated/openclaw-isolated-secrets.py
            owner: root
            group: root
            mode: "0755"

        - name: Install isolated OpenClaw runtime from stable channel
          ansible.builtin.command:
            argv:
              - /usr/bin/npm
              - --prefix
              - "{{ openclaw_isolated_gateway_runtime_dir }}"
              - install
              - --global
              - openclaw@latest
            creates: "{{ openclaw_isolated_gateway_runtime_dir }}/bin/openclaw"

        - name: Bootstrap isolated Gateway secrets
          ansible.builtin.command:
            argv:
              - /usr/local/libexec/openclaw-isolated/openclaw-isolated-secrets.py
              - --source
              - "{{ openclaw_isolated_gateway_credential_source }}"
              - --source-key
              - "{{ openclaw_isolated_gateway_credential_key }}"
              - --source-owner
              - "{{ openclaw_isolated_gateway_legacy_user }}"
              - --output
              - "{{ openclaw_isolated_gateway_secret_file }}"
              - --output-owner
              - root
              - --output-group
              - "{{ openclaw_isolated_gateway_group }}"
          register: openclaw_isolated_gateway_secret_bootstrap
          changed_when: >-
            (openclaw_isolated_gateway_secret_bootstrap.stdout | from_json).changed
          no_log: true

        - name: Deploy deny-by-default isolated Gateway configuration
          ansible.builtin.template:
            src: "{{ ansible_config_file | dirname }}/templates/openclaw/openclaw-isolated.json.j2"
            dest: "{{ openclaw_isolated_gateway_config_file }}"
            owner: root
            group: "{{ openclaw_isolated_gateway_group }}"
            mode: "0640"

        - name: Validate isolated Gateway configuration
          ansible.builtin.command:
            argv:
              - /usr/sbin/runuser
              - -u
              - "{{ openclaw_isolated_gateway_user }}"
              - --
              - /usr/bin/env
              - "HOME={{ openclaw_isolated_gateway_state_dir }}"
              - "OPENCLAW_HOME={{ openclaw_isolated_gateway_state_dir }}"
              - "OPENCLAW_STATE_DIR={{ openclaw_isolated_gateway_state_dir }}/state"
              - "OPENCLAW_CONFIG_PATH={{ openclaw_isolated_gateway_config_file }}"
              - "OPENCLAW_WORKSPACE_DIR={{ openclaw_isolated_gateway_workspace_dir }}"
              - OPENCLAW_SKIP_CHANNELS=1
              - "{{ openclaw_isolated_gateway_runtime_dir }}/bin/openclaw"
              - config
              - validate
          changed_when: false

        - name: Deploy hardened isolated Gateway system service
          ansible.builtin.template:
            src: "{{ ansible_config_file | dirname }}/templates/openclaw/openclaw-isolated-gateway.service.j2"
            dest: /etc/systemd/system/openclaw-isolated-gateway.service
            owner: root
            group: root
            mode: "0644"

        - name: Keep isolated Gateway canary non-persistent
          ansible.builtin.systemd_service:
            name: openclaw-isolated-gateway.service
            enabled: false
            state: started
            daemon_reload: true
          when: not ansible_check_mode

        - name: Wait for isolated Gateway canary listener
          ansible.builtin.wait_for:
            host: 127.0.0.1
            port: "{{ openclaw_isolated_gateway_port }}"
            state: started
            timeout: 90
          when: not ansible_check_mode

        - name: Inspect isolated Gateway service security properties
          ansible.builtin.command:
            argv:
              - /usr/bin/systemctl
              - show
              - openclaw-isolated-gateway.service
              - --property=User
              - --property=Group
              - --property=SupplementaryGroups
              - --property=NoNewPrivileges
              - --property=ProtectSystem
              - --property=ProtectHome
              - --property=PrivateDevices
              - --property=MainPID
          register: openclaw_isolated_gateway_service_properties
          changed_when: false
          when: not ansible_check_mode

        - name: Require isolated Gateway service boundary
          ansible.builtin.assert:
            that:
              - "'User=' + openclaw_isolated_gateway_user in openclaw_isolated_gateway_service_properties.stdout_lines"
              - "'Group=' + openclaw_isolated_gateway_group in openclaw_isolated_gateway_service_properties.stdout_lines"
              - "'SupplementaryGroups=' in openclaw_isolated_gateway_service_properties.stdout_lines"
              - "'NoNewPrivileges=yes' in openclaw_isolated_gateway_service_properties.stdout_lines"
              - "'ProtectSystem=strict' in openclaw_isolated_gateway_service_properties.stdout_lines"
              - "'ProtectHome=yes' in openclaw_isolated_gateway_service_properties.stdout_lines"
              - "'PrivateDevices=yes' in openclaw_isolated_gateway_service_properties.stdout_lines"
            fail_msg: "The running canary does not match the required systemd boundary."
          when: not ansible_check_mode

        - name: Inspect isolated Gateway account groups
          ansible.builtin.command:
            argv:
              - /usr/bin/id
              - --groups
              - --name
              - "{{ openclaw_isolated_gateway_user }}"
          register: openclaw_isolated_gateway_account_groups
          changed_when: false
          when: not ansible_check_mode

        - name: Reject supplementary isolated Gateway privileges
          ansible.builtin.assert:
            that:
              - openclaw_isolated_gateway_account_groups.stdout.split() | sort == [openclaw_isolated_gateway_group]
            fail_msg: >-
              The isolated Gateway account has an unexpected supplementary
              group. It must not inherit sudo, Docker, journal, or human access.
          when: not ansible_check_mode

        - name: Probe isolated Gateway health without exposing its token
          ansible.builtin.command:
            argv:
              - /usr/sbin/runuser
              - -u
              - "{{ openclaw_isolated_gateway_user }}"
              - --
              - /usr/bin/env
              - "HOME={{ openclaw_isolated_gateway_state_dir }}"
              - "OPENCLAW_HOME={{ openclaw_isolated_gateway_state_dir }}"
              - "OPENCLAW_STATE_DIR={{ openclaw_isolated_gateway_state_dir }}/state"
              - "OPENCLAW_CONFIG_PATH={{ openclaw_isolated_gateway_config_file }}"
              - "OPENCLAW_WORKSPACE_DIR={{ openclaw_isolated_gateway_workspace_dir }}"
              - OPENCLAW_SKIP_CHANNELS=1
              - "{{ openclaw_isolated_gateway_runtime_dir }}/bin/openclaw"
              - gateway
              - health
              - --port
              - "{{ openclaw_isolated_gateway_port | string }}"
              - --json
          register: openclaw_isolated_gateway_health
          changed_when: false
          no_log: true
          when: not ansible_check_mode

        - name: Run isolated Gateway model canary
          ansible.builtin.command:
            argv:
              - /usr/sbin/runuser
              - -u
              - "{{ openclaw_isolated_gateway_user }}"
              - --
              - /usr/bin/env
              - "HOME={{ openclaw_isolated_gateway_state_dir }}"
              - "OPENCLAW_HOME={{ openclaw_isolated_gateway_state_dir }}"
              - "OPENCLAW_STATE_DIR={{ openclaw_isolated_gateway_state_dir }}/state"
              - "OPENCLAW_CONFIG_PATH={{ openclaw_isolated_gateway_config_file }}"
              - "OPENCLAW_WORKSPACE_DIR={{ openclaw_isolated_gateway_workspace_dir }}"
              - OPENCLAW_SKIP_CHANNELS=1
              - "{{ openclaw_isolated_gateway_runtime_dir }}/bin/openclaw"
              - agent
              - --agent
              - canary
              - --session-key
              - agent:canary:isolation-validation
              - --thinking
              - "off"
              - --timeout
              - "180"
              - --message
              - Reply with exactly ISOLATED_CANARY_OK and no other text.
              - --json
          register: openclaw_isolated_gateway_model_probe
          changed_when: false
          no_log: true
          when: not ansible_check_mode

        - name: Require exact isolated Gateway model response marker
          ansible.builtin.assert:
            that:
              - "'ISOLATED_CANARY_OK' in openclaw_isolated_gateway_model_probe.stdout"
            fail_msg: "The isolated Gateway model canary did not return its fixed marker."
          no_log: true
          when: not ansible_check_mode

        - name: Mark isolated Gateway canary validated
          ansible.builtin.copy:
            dest: "{{ openclaw_isolated_gateway_config_dir }}/.canary-validated"
            owner: root
            group: root
            mode: "0600"
            content: |
              validated_at={{ openclaw_isolated_gateway_backup_stamp }}
              port={{ openclaw_isolated_gateway_port }}
              mode=parallel-canary-only
          when: not ansible_check_mode

      rescue:
        - name: Stop failed isolated Gateway canary
          ansible.builtin.systemd_service:
            name: openclaw-isolated-gateway.service
            enabled: false
            state: stopped
            daemon_reload: true
          failed_when: false

        - name: Restore prior isolated Gateway state
          ansible.builtin.command:
            argv:
              - /usr/bin/tar
              - --extract
              - --gzip
              - --file
              - "{{ openclaw_isolated_gateway_backup_dir }}/{{ openclaw_isolated_gateway_backup_stamp }}/state.tar.gz"
              - --directory
              - /
          when: >-
            openclaw_isolated_gateway_existing_paths.results
            | selectattr('stat.exists')
            | list
            | length > 0
          changed_when: true
          no_log: true

        - name: Remove failed first-run isolated Gateway artifacts
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - /etc/systemd/system/openclaw-isolated-gateway.service
            - "{{ openclaw_isolated_gateway_config_dir }}"
            - "{{ openclaw_isolated_gateway_state_dir }}"
            - /usr/local/share/openclaw-isolated
            - /usr/local/libexec/openclaw-isolated
            - "{{ openclaw_isolated_gateway_runtime_dir }}"
          when: >-
            openclaw_isolated_gateway_existing_paths.results
            | selectattr('stat.exists')
            | list
            | length == 0

        - name: Remove failed first-run isolated Gateway account
          ansible.builtin.user:
            name: "{{ openclaw_isolated_gateway_user }}"
            state: absent
            remove: false
          when:
            - >-
              openclaw_isolated_gateway_existing_paths.results
              | selectattr('stat.exists')
              | list
              | length == 0
            - openclaw_isolated_gateway_existing_account.rc != 0

        - name: Remove failed first-run isolated Gateway group
          ansible.builtin.group:
            name: "{{ openclaw_isolated_gateway_group }}"
            state: absent
          when:
            - >-
              openclaw_isolated_gateway_existing_paths.results
              | selectattr('stat.exists')
              | list
              | length == 0
            - openclaw_isolated_gateway_existing_account.rc != 0

        - name: Reload systemd after isolated Gateway rollback
          ansible.builtin.systemd_service:
            daemon_reload: true

        - name: Restart previously active isolated Gateway
          ansible.builtin.systemd_service:
            name: openclaw-isolated-gateway.service
            state: started
          when: openclaw_isolated_gateway_previous_service.rc == 0

        - name: Stop after isolated Gateway rollback
          ansible.builtin.fail:
            msg: >-
              Isolated Gateway canary validation failed. The current production
              Gateway was never touched. Prior canary state was restored when
              present; rollback backup is under
              {{ openclaw_isolated_gateway_backup_dir }}/{{ openclaw_isolated_gateway_backup_stamp }}.
