---
# yamllint disable rule:line-length
# Purpose: Rehearse credential-free OpenClaw Doctor modernization on copied state.
# Hosts: openclaw_hosts.
# Key vars: openclaw_doctor_rehearsal_*.
# Scripts: scripts/agents/openclaw-doctor-rehearsal.py and
# scripts/agents/openclaw-isolated-secrets.py.
# Validation: ansible-playbook playbooks/agents/openclaw-doctor-rehearsal.yml --syntax-check.

- name: Rehearse OpenClaw Doctor state modernization
  hosts: openclaw_hosts
  become: true
  gather_facts: false

  vars:
    openclaw_doctor_rehearsal_tool: >-
      /usr/local/libexec/openclaw-migration/openclaw-doctor-rehearsal.py
    openclaw_doctor_rehearsal_secret_tool: >-
      /usr/local/libexec/openclaw-migration/openclaw-isolated-secrets.py
    openclaw_doctor_rehearsal_retention_tool: >-
      /usr/local/libexec/openclaw-migration/openclaw-rehearsal-retention.py
    openclaw_doctor_rehearsal_free_space_margin: 5368709120

  tasks:
    - name: Validate OpenClaw Doctor rehearsal mode
      ansible.builtin.assert:
        that:
          - openclaw_doctor_rehearsal_mode | default('disabled') in ['disabled', 'doctor']
        fail_msg: >-
          openclaw_doctor_rehearsal_mode must be disabled or doctor.

    - name: Skip OpenClaw Doctor rehearsal when disabled
      ansible.builtin.meta: end_host
      when: openclaw_doctor_rehearsal_mode | default('disabled') == 'disabled'

    - name: Require explicit approval for OpenClaw Doctor rehearsal
      ansible.builtin.assert:
        that:
          - openclaw_doctor_rehearsal_approved | default(false) | bool
        fail_msg: >-
          Doctor rehearsal copies protected production state into an isolated
          generation. Explicit owner approval is required.

    - name: Validate fixed OpenClaw Doctor rehearsal boundary
      ansible.builtin.assert:
        that:
          - openclaw_doctor_rehearsal_user == 'openclaw-migrate'
          - openclaw_doctor_rehearsal_group == 'openclaw-migrate'
          - openclaw_doctor_rehearsal_source_state_dir == '/home/johnny/.openclaw'
          - openclaw_doctor_rehearsal_source_config == '/home/johnny/.openclaw/openclaw.json'
          - openclaw_doctor_rehearsal_session_state == '/var/lib/openclaw-migration-rehearsal/current'
          - openclaw_doctor_rehearsal_session_workspace == '/usr/local/share/openclaw-migration-rehearsal/current'
          - openclaw_doctor_rehearsal_state_root == '/var/lib/openclaw-doctor-rehearsal'
          - openclaw_doctor_rehearsal_workspace_root == '/usr/local/share/openclaw-doctor-rehearsal'
          - openclaw_doctor_rehearsal_config_root == '/etc/openclaw-doctor-rehearsal'
          - openclaw_doctor_rehearsal_backup_dir == '/var/backups/openclaw-doctor-rehearsal'
          - openclaw_doctor_rehearsal_runtime == '/opt/openclaw-isolated/current'
          - openclaw_doctor_rehearsal_retention_tool == '/usr/local/libexec/openclaw-migration/openclaw-rehearsal-retention.py'
          - openclaw_isolated_gateway_plugin_state_root == '/var/lib/openclaw-isolated/state/npm'
          - openclaw_doctor_rehearsal_agents | sort == ['antares', 'dubble', 'main', 'rigel', 'vega']
          - openclaw_doctor_rehearsal_install_records | sort == ['brave', 'codex', 'discord', 'lossless-claw', 'nextcloud-talk', 'openclaw-mem0', 'perplexity', 'self-evolution-gate']
          - openclaw_isolated_gateway_managed_plugins | map(attribute='id') | sort == ['codex', 'discord', 'lossless-claw', 'openclaw-mem0']
          - openclaw_isolated_gateway_retired_global_plugins | sort == ['brave', 'nextcloud-talk', 'perplexity', 'self-evolution-gate']
          - openclaw_doctor_rehearsal_disabled_runtime_plugins | sort == ['openclaw-mem0']
          - openclaw_doctor_rehearsal_disabled_runtime_plugins | difference(openclaw_isolated_gateway_managed_plugins | map(attribute='id') | list) | length == 0
        fail_msg: >-
          The Doctor rehearsal identity, roots, source, agent set, runtime, or
          plugin disposition is outside the reviewed modernization boundary.

    - name: Validate managed plugin provenance policy
      ansible.builtin.assert:
        that:
          - item.trusted_official is boolean
          - item.install_spec is match('^' + (item.package | regex_escape) + '@latest$')
        fail_msg: >-
          Managed plugin {{ item.id | default('unknown') }} lacks an explicit
          official-trust classification or current-channel install policy.
      loop: "{{ openclaw_isolated_gateway_managed_plugins }}"
      loop_control:
        label: "{{ item.id | default('unknown') }}"

    - name: Inspect OpenClaw Doctor rehearsal selectors
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - "{{ openclaw_doctor_rehearsal_session_state }}"
        - "{{ openclaw_doctor_rehearsal_session_workspace }}"
        - "{{ openclaw_doctor_rehearsal_runtime }}"
      register: openclaw_doctor_rehearsal_selector_stats
      check_mode: false

    - name: Require symlinked OpenClaw Doctor rehearsal inputs
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.islnk | default(false)
        fail_msg: >-
          A session rehearsal selector or immutable runtime selector is missing
          or is not a symlink.
      loop: "{{ openclaw_doctor_rehearsal_selector_stats.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Resolve OpenClaw Doctor rehearsal selectors
      ansible.builtin.command:
        argv:
          - /usr/bin/readlink
          - --canonicalize-existing
          - "{{ item }}"
      loop:
        - "{{ openclaw_doctor_rehearsal_session_state }}"
        - "{{ openclaw_doctor_rehearsal_session_workspace }}"
        - "{{ openclaw_doctor_rehearsal_runtime }}"
      register: openclaw_doctor_rehearsal_resolved_selectors
      changed_when: false
      check_mode: false

    - name: Require approved OpenClaw Doctor rehearsal generations
      ansible.builtin.assert:
        that:
          - openclaw_doctor_rehearsal_resolved_selectors.results[0].stdout is match('^/var/lib/openclaw-migration-rehearsal/generations/[0-9]{8}T[0-9]{6}Z/state$')
          - openclaw_doctor_rehearsal_resolved_selectors.results[1].stdout is match('^/usr/local/share/openclaw-migration-rehearsal/generations/[0-9]{8}T[0-9]{6}Z/workspace$')
          - openclaw_doctor_rehearsal_resolved_selectors.results[2].stdout is match('^/opt/openclaw-isolated/releases/[0-9A-Za-z._+-]+-plugins-[0-9a-f]{16}$')
        fail_msg: >-
          A Doctor rehearsal source selector resolves outside its reviewed
          immutable generation root.

    - name: Derive selected immutable OpenClaw runtime paths
      ansible.builtin.set_fact:
        openclaw_doctor_rehearsal_runtime_release: >-
          {{ openclaw_doctor_rehearsal_resolved_selectors.results[2].stdout }}
        openclaw_doctor_rehearsal_runtime_core: >-
          {{ openclaw_doctor_rehearsal_resolved_selectors.results[2].stdout }}/lib/node_modules/openclaw

    - name: Inspect immutable OpenClaw runtime access boundary
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - "{{ openclaw_doctor_rehearsal_runtime_core }}"
        - "{{ openclaw_doctor_rehearsal_runtime_core }}/openclaw.mjs"
      register: openclaw_doctor_rehearsal_runtime_access
      check_mode: false

    - name: Require root-owned service-readable OpenClaw runtime
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - not (item.stat.islnk | default(false))
          - item.stat.pw_name == 'root'
          - item.stat.gr_name == 'root'
          - item.stat.mode == '0755'
        fail_msg: >-
          The immutable OpenClaw runtime drifted from root:root 0755. Stop
          before a rehearsal can hide or compound a release-access failure.
      loop: "{{ openclaw_doctor_rehearsal_runtime_access.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Prove isolated service identity can execute immutable OpenClaw runtime
      ansible.builtin.command:
        argv:
          - /usr/sbin/runuser
          - -u
          - "{{ openclaw_isolated_gateway_user }}"
          - --
          - "{{ openclaw_doctor_rehearsal_runtime }}/bin/openclaw"
          - --version
      changed_when: false
      check_mode: false

    - name: Inspect OpenClaw Doctor rehearsal source files
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - "{{ openclaw_doctor_rehearsal_source_config }}"
        - "{{ openclaw_doctor_rehearsal_source_state_dir }}/state/openclaw.sqlite"
        - "{{ openclaw_doctor_rehearsal_source_state_dir }}/lcm.db"
        - "{{ openclaw_doctor_rehearsal_source_state_dir }}/state/mem0/history.db"
      register: openclaw_doctor_rehearsal_source_files
      check_mode: false

    - name: Require regular non-symlink OpenClaw Doctor source files
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
          - not item.stat.islnk | default(false)
        fail_msg: >-
          A required production config or authoritative SQLite source is
          missing, non-regular, or symlinked.
      loop: "{{ openclaw_doctor_rehearsal_source_files.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Inspect OpenClaw Doctor per-agent databases
      ansible.builtin.stat:
        path: >-
          {{ openclaw_doctor_rehearsal_source_state_dir }}/agents/{{ item }}/agent/openclaw-agent.sqlite
        follow: false
      loop: "{{ openclaw_doctor_rehearsal_agents }}"
      register: openclaw_doctor_rehearsal_agent_databases
      check_mode: false

    - name: Require regular OpenClaw Doctor per-agent databases
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
          - not item.stat.islnk | default(false)
        fail_msg: >-
          An authoritative per-agent database is missing, non-regular, or
          symlinked.
      loop: "{{ openclaw_doctor_rehearsal_agent_databases.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Inspect existing OpenClaw migration account
      ansible.builtin.command:
        argv:
          - /usr/bin/getent
          - passwd
          - "{{ openclaw_doctor_rehearsal_user }}"
      register: openclaw_doctor_rehearsal_existing_account
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Reject an unrelated OpenClaw migration account
      ansible.builtin.assert:
        that:
          - >-
            openclaw_doctor_rehearsal_existing_account.rc != 0
            or (
              openclaw_doctor_rehearsal_existing_account.stdout.split(':')[5]
              == '/var/lib/openclaw-migration-rehearsal'
              and
              openclaw_doctor_rehearsal_existing_account.stdout.split(':')[6]
              == '/usr/sbin/nologin'
            )
        fail_msg: >-
          A pre-existing openclaw-migrate account has an unexpected home or
          shell and will not be repurposed.

    - name: Inspect prior OpenClaw Doctor managed paths
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - "{{ openclaw_doctor_rehearsal_tool }}"
        - "{{ openclaw_doctor_rehearsal_secret_tool }}"
        - "{{ openclaw_doctor_rehearsal_state_root }}/current"
        - "{{ openclaw_doctor_rehearsal_workspace_root }}/current"
        - "{{ openclaw_doctor_rehearsal_config_root }}/current"
        - "{{ openclaw_doctor_rehearsal_retention_tool }}"
      register: openclaw_doctor_rehearsal_existing_paths
      check_mode: false

    - name: Index prior OpenClaw Doctor selectors by role
      ansible.builtin.set_fact:
        openclaw_doctor_rehearsal_prior_state_selector: >-
          {{
            (
              openclaw_doctor_rehearsal_existing_paths.results
              | selectattr('item', 'equalto', openclaw_doctor_rehearsal_state_root + '/current')
              | first
            ).stat
          }}
        openclaw_doctor_rehearsal_prior_workspace_selector: >-
          {{
            (
              openclaw_doctor_rehearsal_existing_paths.results
              | selectattr('item', 'equalto', openclaw_doctor_rehearsal_workspace_root + '/current')
              | first
            ).stat
          }}
        openclaw_doctor_rehearsal_prior_config_selector: >-
          {{
            (
              openclaw_doctor_rehearsal_existing_paths.results
              | selectattr('item', 'equalto', openclaw_doctor_rehearsal_config_root + '/current')
              | first
            ).stat
          }}

    - name: Reject non-symlink OpenClaw Doctor selectors
      ansible.builtin.assert:
        that:
          - >-
            not item.stat.exists
            or item.item == openclaw_doctor_rehearsal_tool
            or item.item == openclaw_doctor_rehearsal_secret_tool
            or item.item == openclaw_doctor_rehearsal_retention_tool
            or item.stat.islnk | default(false)
        fail_msg: >-
          A Doctor rehearsal current selector is not a symlink. Refusing to
          replace an unclassified path.
      loop: "{{ openclaw_doctor_rehearsal_existing_paths.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Capture production OpenClaw config checksum
      ansible.builtin.stat:
        path: "{{ openclaw_doctor_rehearsal_source_config }}"
        checksum_algorithm: sha256
      register: openclaw_doctor_rehearsal_source_config_before
      check_mode: false

    - name: Capture production OpenClaw Gateway state
      ansible.builtin.command:
        argv:
          - /usr/sbin/runuser
          - --user
          - johnny
          - --
          - /usr/bin/env
          - XDG_RUNTIME_DIR=/run/user/1000
          - /usr/bin/systemctl
          - --user
          - is-active
          - openclaw-gateway.service
      register: openclaw_doctor_rehearsal_production_service_before
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Validate frozen native plugin source before rehearsal mutation
      ansible.builtin.include_tasks: ../../tasks/openclaw-doctor-plugin-source.yml

    - name: Report OpenClaw Doctor rehearsal check-mode boundary
      ansible.builtin.debug:
        msg: >-
          Check mode validated the fixed source, immutable input generations,
          service identity, database set, plugin disposition, and frozen native
          plugin source identities. It does not copy or transform protected
          state.
      when: ansible_check_mode

    - name: Stop OpenClaw Doctor rehearsal before mutation in check mode
      ansible.builtin.meta: end_host
      when: ansible_check_mode

    - name: Set OpenClaw Doctor rehearsal timestamp
      ansible.builtin.set_fact:
        openclaw_doctor_rehearsal_stamp: "{{ lookup('pipe', 'date -u +%Y%m%dT%H%M%SZ') }}"

    - name: Derive OpenClaw Doctor rehearsal generation paths
      ansible.builtin.set_fact:
        openclaw_doctor_rehearsal_generation_state: >-
          {{ openclaw_doctor_rehearsal_state_root }}/generations/{{ openclaw_doctor_rehearsal_stamp }}/state
        openclaw_doctor_rehearsal_generation_workspace: >-
          {{ openclaw_doctor_rehearsal_workspace_root }}/generations/{{ openclaw_doctor_rehearsal_stamp }}/workspace
        openclaw_doctor_rehearsal_generation_config_dir: >-
          {{ openclaw_doctor_rehearsal_config_root }}/generations/{{ openclaw_doctor_rehearsal_stamp }}
        openclaw_doctor_rehearsal_generation_config: >-
          {{ openclaw_doctor_rehearsal_config_root }}/generations/{{ openclaw_doctor_rehearsal_stamp }}/openclaw.json
        openclaw_doctor_rehearsal_generation_secret: >-
          {{ openclaw_doctor_rehearsal_config_root }}/generations/{{ openclaw_doctor_rehearsal_stamp }}/secrets.json
        openclaw_doctor_rehearsal_generation_codex_token_bootstrap: >-
          {{ openclaw_doctor_rehearsal_config_root }}/generations/{{ openclaw_doctor_rehearsal_stamp }}/.codex-app-server.token.bootstrap
        openclaw_doctor_rehearsal_plugin_build_cache: >-
          {{ openclaw_doctor_rehearsal_config_root }}/generations/{{ openclaw_doctor_rehearsal_stamp }}/npm-cache
        openclaw_doctor_rehearsal_evidence_dir: >-
          {{ openclaw_doctor_rehearsal_backup_dir }}/{{ openclaw_doctor_rehearsal_stamp }}

    - name: Derive OpenClaw Doctor rehearsal retired plugin arguments
      ansible.builtin.set_fact:
        openclaw_doctor_rehearsal_retired_plugin_arguments: >-
          {{
            (openclaw_doctor_rehearsal_retired_plugin_arguments | default([]))
            + ['--retire-plugin', item]
          }}
      loop: "{{ openclaw_isolated_gateway_retired_global_plugins }}"

    - name: Derive credential-free OpenClaw Doctor isolation arguments
      ansible.builtin.set_fact:
        openclaw_doctor_rehearsal_isolation_arguments: >-
          {{
            (openclaw_doctor_rehearsal_isolation_arguments | default(['--disable-memory-search']))
            + ['--disable-plugin-runtime', item]
          }}
      loop: "{{ openclaw_doctor_rehearsal_disabled_runtime_plugins }}"
      loop_control:
        label: "{{ item }}"

    - name: Derive OpenClaw Doctor rehearsal database and manifest policy
      ansible.builtin.set_fact:
        openclaw_doctor_rehearsal_state_manifest_exclude_arguments: >-
          {{
            [
              '--exclude', 'state/openclaw.sqlite',
              '--exclude', 'state/mem0/history.db',
              '--exclude', 'lcm.db',
              '--exclude', 'npm'
            ]
          }}
        openclaw_doctor_rehearsal_database_specs: >-
          {{
            [
              {
                'name': 'shared-full',
                'path': openclaw_doctor_rehearsal_generation_state + '/state/openclaw.sqlite',
                'exclusions': [],
                'ignoredColumns': [],
                'idempotency': false
              },
              {
                'name': 'shared-stable',
                'path': openclaw_doctor_rehearsal_generation_state + '/state/openclaw.sqlite',
                'exclusions': openclaw_doctor_rehearsal_stable_shared_db_exclusions,
                'ignoredColumns': ['schema_meta.updated_at'],
                'idempotency': true
              },
              {
                'name': 'lossless-claw',
                'path': openclaw_doctor_rehearsal_generation_state + '/lcm.db',
                'exclusions': [],
                'ignoredColumns': [],
                'idempotency': true
              },
              {
                'name': 'mem0-history',
                'path': openclaw_doctor_rehearsal_generation_state + '/state/mem0/history.db',
                'exclusions': [],
                'ignoredColumns': [],
                'idempotency': true
              }
            ]
          }}

    - name: Add per-agent OpenClaw Doctor database policy
      ansible.builtin.set_fact:
        openclaw_doctor_rehearsal_database_specs: >-
          {{
            openclaw_doctor_rehearsal_database_specs
            + [
                {
                  'name': 'agent-' + item,
                  'path': openclaw_doctor_rehearsal_generation_state + '/agents/' + item + '/agent/openclaw-agent.sqlite',
                  'exclusions': [],
                  'ignoredColumns': [],
                  'idempotency': true
                }
              ]
          }}
        openclaw_doctor_rehearsal_state_manifest_exclude_arguments: >-
          {{
            openclaw_doctor_rehearsal_state_manifest_exclude_arguments
            + [
                '--exclude',
                'agents/' + item + '/agent/openclaw-agent.sqlite'
              ]
          }}
      loop: "{{ openclaw_doctor_rehearsal_agents }}"
      loop_control:
        label: "{{ item }}"

    - name: Inspect candidate OpenClaw Doctor rehearsal generation
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - "{{ openclaw_doctor_rehearsal_generation_state }}"
        - "{{ openclaw_doctor_rehearsal_generation_workspace }}"
        - "{{ openclaw_doctor_rehearsal_generation_config_dir }}"
        - "{{ openclaw_doctor_rehearsal_evidence_dir }}"
      register: openclaw_doctor_rehearsal_candidate_paths

    - name: Require fresh OpenClaw Doctor rehearsal paths
      ansible.builtin.assert:
        that:
          - not item.stat.exists
        fail_msg: >-
          A timestamped Doctor generation or evidence directory already exists.
          Refusing to overwrite immutable evidence.
      loop: "{{ openclaw_doctor_rehearsal_candidate_paths.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Create OpenClaw Doctor rehearsal evidence directory
      ansible.builtin.file:
        path: "{{ openclaw_doctor_rehearsal_evidence_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Select prior OpenClaw Doctor managed paths for rollback
      ansible.builtin.set_fact:
        openclaw_doctor_rehearsal_backup_paths: >-
          {{
            openclaw_doctor_rehearsal_existing_paths.results
            | selectattr('stat.exists')
            | map(attribute='item')
            | map('regex_replace', '^/', '')
            | list
          }}

    - name: Back up prior OpenClaw Doctor selectors and helper
      ansible.builtin.command:
        argv: >-
          {{
            [
              '/usr/bin/tar',
              '--create',
              '--gzip',
              '--acls',
              '--xattrs',
              '--numeric-owner',
              '--file', openclaw_doctor_rehearsal_evidence_dir + '/rollback.tar.gz',
              '--directory', '/'
            ]
            + openclaw_doctor_rehearsal_backup_paths
          }}
      when: openclaw_doctor_rehearsal_backup_paths | length > 0
      changed_when: true

    - name: Record empty OpenClaw Doctor rollback baseline
      ansible.builtin.copy:
        dest: "{{ openclaw_doctor_rehearsal_evidence_dir }}/EMPTY_BASELINE"
        owner: root
        group: root
        mode: "0600"
        content: "No prior Doctor selector or helper existed.\n"
      when: openclaw_doctor_rehearsal_backup_paths | length == 0

    - name: Record OpenClaw Doctor modernization disposition
      ansible.builtin.copy:
        dest: "{{ openclaw_doctor_rehearsal_evidence_dir }}/disposition.json"
        owner: root
        group: root
        mode: "0600"
        content: >-
          {{
            {
              'schemaVersion': 1,
              'activeSessions': 'retain-from-verified-relocation',
              'sharedState': 'retain-online-sqlite-backup',
              'agentState': 'retain-online-sqlite-backup-auth-scrubbed',
              'losslessClaw': 'retain-online-sqlite-backup',
              'mem0History': 'retain-online-sqlite-backup',
              'mem0Qdrant': 'retain-external-not-copied',
              'codexProviderHome': 'archive-not-runnable-not-copied',
              'credentials': 'replace-fresh-not-copied',
              'gatewayAuth': 'replace-fresh-file-secretref-not-copied',
              'pluginCode': 'replace-supported-npm-provenance-root-locked',
              'legacyInstallRecords': 'retire-supported-cli',
              'disabledLegacyPlugins': 'retire',
              'channels': 'remove-from-credential-free-rehearsal',
              'memorySearchRuntime': 'retain-disabled-until-credentialed-canary',
              'externalPluginRuntime': 'retain-disabled-until-networked-canary',
              'orphanTranscripts': 'archive-before-cutover',
              'fullLegacyWorkspace': 'not-copied',
              'backupsCachesLogs': 'archive-or-discard-not-copied',
              'productionGateway': 'untouched'
            }
            | to_nice_json
          }}

    - name: Create OpenClaw migration group
      ansible.builtin.group:
        name: "{{ openclaw_doctor_rehearsal_group }}"
        system: true
        state: present

    - name: Create OpenClaw migration account
      ansible.builtin.user:
        name: "{{ openclaw_doctor_rehearsal_user }}"
        group: "{{ openclaw_doctor_rehearsal_group }}"
        groups: []
        append: false
        home: /var/lib/openclaw-migration-rehearsal
        create_home: false
        shell: /usr/sbin/nologin
        system: true
        state: present

    - name: Verify OpenClaw migration account groups
      ansible.builtin.command:
        argv:
          - /usr/bin/id
          - -Gn
          - "{{ openclaw_doctor_rehearsal_user }}"
      register: openclaw_doctor_rehearsal_account_groups
      changed_when: false

    - name: Require one OpenClaw migration group only
      ansible.builtin.assert:
        that:
          - openclaw_doctor_rehearsal_account_groups.stdout.split() == [openclaw_doctor_rehearsal_group]
        fail_msg: >-
          The OpenClaw migration account has unexpected supplementary groups.

    - name: Create OpenClaw Doctor managed roots
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: root
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - path: "{{ openclaw_doctor_rehearsal_state_root }}"
          group: "{{ openclaw_doctor_rehearsal_group }}"
          mode: "0750"
        - path: "{{ openclaw_doctor_rehearsal_state_root }}/generations"
          group: "{{ openclaw_doctor_rehearsal_group }}"
          mode: "0750"
        - path: "{{ openclaw_doctor_rehearsal_workspace_root }}"
          group: "{{ openclaw_doctor_rehearsal_group }}"
          mode: "0750"
        - path: "{{ openclaw_doctor_rehearsal_workspace_root }}/generations"
          group: "{{ openclaw_doctor_rehearsal_group }}"
          mode: "0750"
        - path: "{{ openclaw_doctor_rehearsal_config_root }}"
          group: "{{ openclaw_doctor_rehearsal_group }}"
          mode: "0750"
        - path: "{{ openclaw_doctor_rehearsal_config_root }}/generations"
          group: "{{ openclaw_doctor_rehearsal_group }}"
          mode: "0750"
        - path: /usr/local/libexec/openclaw-migration
          group: root
          mode: "0755"

    - name: Deploy OpenClaw Doctor rehearsal helper
      ansible.builtin.copy:
        src: "{{ ansible_config_file | dirname }}/scripts/agents/openclaw-doctor-rehearsal.py"
        dest: "{{ openclaw_doctor_rehearsal_tool }}"
        owner: root
        group: root
        mode: "0755"

    - name: Capture immutable OpenClaw runtime before rehearsal mutation
      ansible.builtin.command:
        argv:
          - "{{ openclaw_doctor_rehearsal_tool }}"
          - manifest
          - --root
          - "{{ openclaw_doctor_rehearsal_runtime_core }}"
          - --output
          - "{{ openclaw_doctor_rehearsal_evidence_dir }}/runtime-core-before.json"
          - --allow-symlink-target-root
          - "{{ openclaw_doctor_rehearsal_runtime_release }}"
      changed_when: true

    - name: Deploy OpenClaw Doctor rehearsal secret bootstrapper
      ansible.builtin.copy:
        src: "{{ ansible_config_file | dirname }}/scripts/agents/openclaw-isolated-secrets.py"
        dest: "{{ openclaw_doctor_rehearsal_secret_tool }}"
        owner: root
        group: root
        mode: "0755"

    - name: Deploy OpenClaw rehearsal generation retention helper
      ansible.builtin.copy:
        src: "{{ ansible_config_file | dirname }}/scripts/agents/openclaw-rehearsal-retention.py"
        dest: "{{ openclaw_doctor_rehearsal_retention_tool }}"
        owner: root
        group: root
        mode: "0755"

    - name: Plan bounded upstream state rehearsal generation retention
      ansible.builtin.command:
        argv:
          - "{{ openclaw_doctor_rehearsal_retention_tool }}"
          - --family
          - state
          - --mode
          - plan
          - --output
          - "{{ openclaw_doctor_rehearsal_evidence_dir }}/state-retention-plan.json"
      register: openclaw_doctor_rehearsal_state_retention_plan
      changed_when: true

    - name: Require bounded upstream state rehearsal retention plan
      ansible.builtin.assert:
        that:
          - (openclaw_doctor_rehearsal_state_retention_plan.stdout | from_json).status == 'ok'
          - (openclaw_doctor_rehearsal_state_retention_plan.stdout | from_json).family == 'state'
          - >-
            (openclaw_doctor_rehearsal_state_retention_plan.stdout | from_json).selectedStamp
            == openclaw_doctor_rehearsal_resolved_selectors.results[0].stdout.split('/')[-2]
        fail_msg: >-
          The upstream session-generation retention plan does not preserve the
          exact Doctor input selector.

    - name: Apply bounded upstream state rehearsal generation retention
      ansible.builtin.command:
        argv:
          - "{{ openclaw_doctor_rehearsal_retention_tool }}"
          - --family
          - state
          - --mode
          - apply
          - --plan
          - "{{ openclaw_doctor_rehearsal_evidence_dir }}/state-retention-plan.json"
          - --output
          - "{{ openclaw_doctor_rehearsal_evidence_dir }}/state-retention-result.json"
      register: openclaw_doctor_rehearsal_state_retention_result
      changed_when: >-
        (openclaw_doctor_rehearsal_state_retention_result.stdout | from_json).removedGenerationCount
        | int > 0

    - name: Require successful upstream state rehearsal retention
      ansible.builtin.assert:
        that:
          - (openclaw_doctor_rehearsal_state_retention_result.stdout | from_json).status == 'ok'
          - (openclaw_doctor_rehearsal_state_retention_result.stdout | from_json).family == 'state'
          - >-
            (openclaw_doctor_rehearsal_state_retention_result.stdout | from_json).selectedStamp
            == openclaw_doctor_rehearsal_resolved_selectors.results[0].stdout.split('/')[-2]
        fail_msg: >-
          Upstream session-generation retention did not preserve its selected
          and immediate rollback generations.

    - name: Detect an existing OpenClaw Doctor generation selector set
      ansible.builtin.set_fact:
        openclaw_doctor_rehearsal_has_current_generation: >-
          {{
            (
              openclaw_doctor_rehearsal_existing_paths.results
              | selectattr('item', 'equalto', openclaw_doctor_rehearsal_state_root + '/current')
              | map(attribute='stat.exists')
              | first
              | default(false)
            )
            and
            (
              openclaw_doctor_rehearsal_existing_paths.results
              | selectattr('item', 'equalto', openclaw_doctor_rehearsal_workspace_root + '/current')
              | map(attribute='stat.exists')
              | first
              | default(false)
            )
            and
            (
              openclaw_doctor_rehearsal_existing_paths.results
              | selectattr('item', 'equalto', openclaw_doctor_rehearsal_config_root + '/current')
              | map(attribute='stat.exists')
              | first
              | default(false)
            )
          }}

    - name: Reject a partial OpenClaw Doctor generation selector set
      ansible.builtin.assert:
        that:
          - >-
            [
              openclaw_doctor_rehearsal_prior_state_selector.exists,
              openclaw_doctor_rehearsal_prior_workspace_selector.exists,
              openclaw_doctor_rehearsal_prior_config_selector.exists
            ]
            | unique
            | length == 1
        fail_msg: >-
          Doctor state, workspace, and config selectors must either all exist
          or all be absent before generation retention.

    - name: Plan bounded OpenClaw Doctor generation retention
      ansible.builtin.command:
        argv:
          - "{{ openclaw_doctor_rehearsal_retention_tool }}"
          - --family
          - doctor
          - --mode
          - plan
          - --output
          - "{{ openclaw_doctor_rehearsal_evidence_dir }}/doctor-retention-plan.json"
      register: openclaw_doctor_rehearsal_generation_retention_plan
      changed_when: true
      when: openclaw_doctor_rehearsal_has_current_generation | bool

    - name: Require bounded OpenClaw Doctor generation retention plan
      ansible.builtin.assert:
        that:
          - (openclaw_doctor_rehearsal_generation_retention_plan.stdout | from_json).status == 'ok'
          - (openclaw_doctor_rehearsal_generation_retention_plan.stdout | from_json).family == 'doctor'
        fail_msg: >-
          The Doctor-generation retention plan did not preserve the selected
          and immediate rollback generations.
      when: openclaw_doctor_rehearsal_has_current_generation | bool

    - name: Apply bounded OpenClaw Doctor generation retention
      ansible.builtin.command:
        argv:
          - "{{ openclaw_doctor_rehearsal_retention_tool }}"
          - --family
          - doctor
          - --mode
          - apply
          - --plan
          - "{{ openclaw_doctor_rehearsal_evidence_dir }}/doctor-retention-plan.json"
          - --output
          - "{{ openclaw_doctor_rehearsal_evidence_dir }}/doctor-retention-result.json"
      register: openclaw_doctor_rehearsal_generation_retention_result
      changed_when: >-
        (openclaw_doctor_rehearsal_generation_retention_result.stdout | from_json).removedGenerationCount
        | int > 0
      when: openclaw_doctor_rehearsal_has_current_generation | bool

    - name: Require successful OpenClaw Doctor generation retention
      ansible.builtin.assert:
        that:
          - (openclaw_doctor_rehearsal_generation_retention_result.stdout | from_json).status == 'ok'
          - (openclaw_doctor_rehearsal_generation_retention_result.stdout | from_json).family == 'doctor'
        fail_msg: >-
          Doctor-generation retention did not preserve its selected and
          immediate rollback generations.
      when: openclaw_doctor_rehearsal_has_current_generation | bool

    - name: Create OpenClaw Doctor generation directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: "{{ openclaw_doctor_rehearsal_group }}"
        mode: "0750"
      loop:
        - >-
          {{ openclaw_doctor_rehearsal_state_root }}/generations/{{ openclaw_doctor_rehearsal_stamp }}
        - >-
          {{ openclaw_doctor_rehearsal_workspace_root }}/generations/{{ openclaw_doctor_rehearsal_stamp }}

    - name: Create private OpenClaw Doctor generation content directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
      loop:
        - "{{ openclaw_doctor_rehearsal_generation_state }}"
        - "{{ openclaw_doctor_rehearsal_generation_workspace }}"
        - "{{ openclaw_doctor_rehearsal_generation_config_dir }}"

    - name: Link conventional OpenClaw state path to rehearsal generation
      ansible.builtin.file:
        src: "{{ openclaw_doctor_rehearsal_generation_state }}"
        dest: >-
          {{ openclaw_doctor_rehearsal_state_root }}/generations/{{ openclaw_doctor_rehearsal_stamp }}/.openclaw
        state: link
        owner: root
        group: "{{ openclaw_doctor_rehearsal_group }}"
        force: false

    - name: Bootstrap fresh OpenClaw Doctor rehearsal Gateway secret
      ansible.builtin.command:
        argv:
          - "{{ openclaw_doctor_rehearsal_secret_tool }}"
          - --output
          - "{{ openclaw_doctor_rehearsal_generation_secret }}"
          - --output-parent-owner
          - root
          - --output-owner
          - "{{ openclaw_doctor_rehearsal_user }}"
          - --output-group
          - "{{ openclaw_doctor_rehearsal_group }}"
          - --codex-token-output
          - "{{ openclaw_doctor_rehearsal_generation_codex_token_bootstrap }}"
          - --codex-token-owner
          - "{{ openclaw_doctor_rehearsal_user }}"
          - --codex-token-group
          - "{{ openclaw_doctor_rehearsal_group }}"
      register: openclaw_doctor_rehearsal_secret_bootstrap
      changed_when: >-
        (openclaw_doctor_rehearsal_secret_bootstrap.stdout | from_json).changed
      no_log: true

    - name: Inspect OpenClaw Doctor rehearsal Gateway secret boundary
      ansible.builtin.stat:
        path: "{{ openclaw_doctor_rehearsal_generation_secret }}"
      register: openclaw_doctor_rehearsal_secret_stat
      no_log: true

    - name: Require fresh owner-only OpenClaw Doctor Gateway secret
      ansible.builtin.assert:
        that:
          - openclaw_doctor_rehearsal_secret_stat.stat.exists
          - openclaw_doctor_rehearsal_secret_stat.stat.isreg
          - not openclaw_doctor_rehearsal_secret_stat.stat.islnk
          - openclaw_doctor_rehearsal_secret_stat.stat.mode == '0400'
          - openclaw_doctor_rehearsal_secret_stat.stat.pw_name == openclaw_doctor_rehearsal_user
          - openclaw_doctor_rehearsal_secret_stat.stat.gr_name == openclaw_doctor_rehearsal_group
        fail_msg: >-
          The Doctor canary Gateway secret is not a fresh service-owned,
          owner-readable-only regular file.
      no_log: true

    - name: Inspect ephemeral OpenClaw Doctor Codex token copy
      ansible.builtin.stat:
        path: "{{ openclaw_doctor_rehearsal_generation_codex_token_bootstrap }}"
        follow: false
      register: openclaw_doctor_rehearsal_codex_token_bootstrap_stat
      no_log: true

    - name: Require owner-only ephemeral OpenClaw Doctor Codex token copy
      ansible.builtin.assert:
        that:
          - openclaw_doctor_rehearsal_codex_token_bootstrap_stat.stat.exists
          - openclaw_doctor_rehearsal_codex_token_bootstrap_stat.stat.isreg
          - not openclaw_doctor_rehearsal_codex_token_bootstrap_stat.stat.islnk
          - openclaw_doctor_rehearsal_codex_token_bootstrap_stat.stat.mode == '0400'
          - openclaw_doctor_rehearsal_codex_token_bootstrap_stat.stat.pw_name == openclaw_doctor_rehearsal_user
          - openclaw_doctor_rehearsal_codex_token_bootstrap_stat.stat.gr_name == openclaw_doctor_rehearsal_group
        fail_msg: >-
          The Doctor-only Codex transport-token copy is not a fresh,
          migration-owned, owner-readable-only regular file.
      no_log: true

    - name: Remove ephemeral OpenClaw Doctor Codex token copy
      ansible.builtin.file:
        path: "{{ openclaw_doctor_rehearsal_generation_codex_token_bootstrap }}"
        state: absent
      no_log: true

    - name: Confirm ephemeral OpenClaw Doctor Codex token copy is absent
      ansible.builtin.stat:
        path: "{{ openclaw_doctor_rehearsal_generation_codex_token_bootstrap }}"
        follow: false
      register: openclaw_doctor_rehearsal_removed_codex_token_bootstrap_stat
      no_log: true

    - name: Require no standalone Codex token in OpenClaw Doctor generation
      ansible.builtin.assert:
        that:
          - not openclaw_doctor_rehearsal_removed_codex_token_bootstrap_stat.stat.exists
        fail_msg: >-
          The credential-free Doctor generation retained an unnecessary
          standalone Codex transport-token copy.
      no_log: true

    - name: Preserve frozen native managed plugin source evidence
      ansible.builtin.copy:
        dest: "{{ openclaw_doctor_rehearsal_evidence_dir }}/plugin-source-evidence.json"
        owner: root
        group: root
        mode: "0600"
        content: >-
          {{
            {
              'schemaVersion': 1,
              'sourceRoot': openclaw_isolated_gateway_plugin_state_root + '/projects',
              'plugins': openclaw_doctor_rehearsal_plugin_source_evidence
            }
            | to_nice_json
          }}

    - name: Initialize managed plugin transform arguments
      ansible.builtin.set_fact:
        openclaw_doctor_rehearsal_plugin_arguments: []

    - name: Derive managed plugin transform arguments
      ansible.builtin.set_fact:
        openclaw_doctor_rehearsal_plugin_arguments: >-
          {{
            openclaw_doctor_rehearsal_plugin_arguments
            + ['--managed-plugin', item.id]
          }}
      loop: "{{ openclaw_isolated_gateway_managed_plugins }}"
      loop_control:
        label: "{{ item.id }}"

    - name: Derive OpenClaw Doctor source copy set
      ansible.builtin.set_fact:
        openclaw_doctor_rehearsal_source_copy_paths: >-
          {{
            [
              openclaw_doctor_rehearsal_resolved_selectors.results[0].stdout,
              openclaw_doctor_rehearsal_resolved_selectors.results[1].stdout,
              openclaw_doctor_rehearsal_source_state_dir + '/state/openclaw.sqlite',
              openclaw_doctor_rehearsal_source_state_dir + '/lcm.db',
              openclaw_doctor_rehearsal_source_state_dir + '/state/mem0/history.db'
            ]
          }}

    - name: Add per-agent OpenClaw Doctor source paths
      ansible.builtin.set_fact:
        openclaw_doctor_rehearsal_source_copy_paths: >-
          {{
            openclaw_doctor_rehearsal_source_copy_paths
            + [
                openclaw_doctor_rehearsal_source_state_dir
                + '/agents/' + item + '/agent/openclaw-agent.sqlite'
              ]
          }}
      loop: "{{ openclaw_doctor_rehearsal_agents }}"
      loop_control:
        label: "{{ item }}"

    - name: Measure OpenClaw Doctor source copy set
      ansible.builtin.command:
        argv: >-
          {{
            ['/usr/bin/du', '--summarize', '--bytes', '--total']
            + openclaw_doctor_rehearsal_source_copy_paths
          }}
      register: openclaw_doctor_rehearsal_source_size
      changed_when: false

    - name: Inspect OpenClaw Doctor destination filesystems
      ansible.builtin.command:
        argv:
          - /usr/bin/stat
          - --file-system
          - --format=%i:%a:%S
          - "{{ item }}"
      loop:
        - /var/lib
        - /usr/local/share
        - /etc
        - /var/backups
      register: openclaw_doctor_rehearsal_filesystems
      changed_when: false

    - name: Require one capacious OpenClaw Doctor destination filesystem
      ansible.builtin.assert:
        that:
          - openclaw_doctor_rehearsal_filesystems.results[0].stdout.split(':')[0] == openclaw_doctor_rehearsal_filesystems.results[1].stdout.split(':')[0]
          - openclaw_doctor_rehearsal_filesystems.results[0].stdout.split(':')[0] == openclaw_doctor_rehearsal_filesystems.results[2].stdout.split(':')[0]
          - openclaw_doctor_rehearsal_filesystems.results[0].stdout.split(':')[0] == openclaw_doctor_rehearsal_filesystems.results[3].stdout.split(':')[0]
          - >-
            (
              openclaw_doctor_rehearsal_filesystems.results[0].stdout.split(':')[1]
              | int
            )
            *
            (
              openclaw_doctor_rehearsal_filesystems.results[0].stdout.split(':')[2]
              | int
            )
            >
            (
              openclaw_doctor_rehearsal_source_size.stdout_lines[-1].split()[0]
              | int
            )
            + openclaw_doctor_rehearsal_free_space_margin
        fail_msg: >-
          Doctor rehearsal destinations are not on one reviewed filesystem or
          lack conservative free space for copied state and the safety margin.

    - name: Copy verified OpenClaw session generation
      ansible.builtin.command:
        argv:
          - /usr/bin/rsync
          - --archive
          - --hard-links
          - --xattrs
          - --numeric-ids
          - "{{ openclaw_doctor_rehearsal_session_state }}/"
          - "{{ openclaw_doctor_rehearsal_generation_state }}/"
      changed_when: true

    - name: Copy verified OpenClaw workspace generation
      ansible.builtin.command:
        argv:
          - /usr/bin/rsync
          - --archive
          - --hard-links
          - --xattrs
          - --numeric-ids
          - "{{ openclaw_doctor_rehearsal_session_workspace }}/"
          - "{{ openclaw_doctor_rehearsal_generation_workspace }}/"
      changed_when: true

    - name: Create shared OpenClaw Doctor database destinations
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
      loop:
        - "{{ openclaw_doctor_rehearsal_generation_state }}/state"
        - "{{ openclaw_doctor_rehearsal_generation_state }}/state/mem0"

    - name: Create per-agent OpenClaw Doctor database destinations
      ansible.builtin.file:
        path: >-
          {{ openclaw_doctor_rehearsal_generation_state }}/agents/{{ item }}/agent
        state: directory
        owner: root
        group: root
        mode: "0700"
      loop: "{{ openclaw_doctor_rehearsal_agents }}"
      loop_control:
        label: "{{ item }}"

    - name: Back up shared OpenClaw state through SQLite
      ansible.builtin.command:
        argv:
          - "{{ openclaw_doctor_rehearsal_tool }}"
          - sqlite-backup
          - --source
          - "{{ openclaw_doctor_rehearsal_source_state_dir }}/state/openclaw.sqlite"
          - --target
          - "{{ openclaw_doctor_rehearsal_generation_state }}/state/openclaw.sqlite"
          - --output
          - "{{ openclaw_doctor_rehearsal_evidence_dir }}/backup-shared.json"
      changed_when: true

    - name: Back up Lossless Claw state through SQLite
      ansible.builtin.command:
        argv:
          - "{{ openclaw_doctor_rehearsal_tool }}"
          - sqlite-backup
          - --source
          - "{{ openclaw_doctor_rehearsal_source_state_dir }}/lcm.db"
          - --target
          - "{{ openclaw_doctor_rehearsal_generation_state }}/lcm.db"
          - --output
          - "{{ openclaw_doctor_rehearsal_evidence_dir }}/backup-lossless-claw.json"
      changed_when: true

    - name: Back up Mem0 history through SQLite
      ansible.builtin.command:
        argv:
          - "{{ openclaw_doctor_rehearsal_tool }}"
          - sqlite-backup
          - --source
          - "{{ openclaw_doctor_rehearsal_source_state_dir }}/state/mem0/history.db"
          - --target
          - "{{ openclaw_doctor_rehearsal_generation_state }}/state/mem0/history.db"
          - --output
          - "{{ openclaw_doctor_rehearsal_evidence_dir }}/backup-mem0-history.json"
      changed_when: true

    - name: Back up auth-scrubbed OpenClaw per-agent state through SQLite
      ansible.builtin.command:
        argv:
          - "{{ openclaw_doctor_rehearsal_tool }}"
          - sqlite-backup
          - --source
          - "{{ openclaw_doctor_rehearsal_source_state_dir }}/agents/{{ item }}/agent/openclaw-agent.sqlite"
          - --target
          - "{{ openclaw_doctor_rehearsal_generation_state }}/agents/{{ item }}/agent/openclaw-agent.sqlite"
          - --output
          - "{{ openclaw_doctor_rehearsal_evidence_dir }}/backup-agent-{{ item }}.json"
          - --scrub-agent-auth
      loop: "{{ openclaw_doctor_rehearsal_agents }}"
      loop_control:
        label: "{{ item }}"
      changed_when: true

    - name: Transform OpenClaw config for plugin-record retirement
      ansible.builtin.command:
        argv: >-
          {{
            [
              openclaw_doctor_rehearsal_tool,
              'transform-config',
              '--source', openclaw_doctor_rehearsal_source_config,
              '--output', openclaw_doctor_rehearsal_generation_config,
              '--report', openclaw_doctor_rehearsal_evidence_dir + '/config-pre-uninstall.json',
              '--source-state-root', openclaw_doctor_rehearsal_source_state_dir,
              '--source-workspace-root', openclaw_doctor_rehearsal_source_state_dir + '/workspace',
              '--target-state-root', openclaw_doctor_rehearsal_generation_state,
              '--target-workspace-root', openclaw_doctor_rehearsal_generation_workspace,
              '--gateway-port', '19789',
              '--gateway-secret-file', openclaw_doctor_rehearsal_generation_secret,
              '--suspend-managed-plugin-slots'
            ]
            + openclaw_doctor_rehearsal_plugin_arguments
            + openclaw_doctor_rehearsal_retired_plugin_arguments
            + openclaw_doctor_rehearsal_isolation_arguments
          }}
      changed_when: true

    - name: Assign writable OpenClaw Doctor generation to migration identity
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ openclaw_doctor_rehearsal_user }}"
        group: "{{ openclaw_doctor_rehearsal_group }}"
        mode: u=rwX,g=rX,o=
        recurse: true
        follow: false
      loop:
        - "{{ openclaw_doctor_rehearsal_generation_state }}"
        - "{{ openclaw_doctor_rehearsal_generation_workspace }}"
        - "{{ openclaw_doctor_rehearsal_generation_config_dir }}"

    - name: Restore owner-only OpenClaw Doctor Gateway secret permissions
      ansible.builtin.file:
        path: "{{ openclaw_doctor_rehearsal_generation_secret }}"
        state: file
        owner: "{{ openclaw_doctor_rehearsal_user }}"
        group: "{{ openclaw_doctor_rehearsal_group }}"
        mode: "0400"

    - name: Define networkless OpenClaw Doctor transient command
      ansible.builtin.set_fact:
        openclaw_doctor_rehearsal_transient_prefix:
          - /usr/bin/systemd-run
          - --quiet
          - --wait
          - --collect
          - --pipe
          - --service-type=exec
          - --property=RuntimeMaxSec=300s
          - "--property=User={{ openclaw_doctor_rehearsal_user }}"
          - "--property=Group={{ openclaw_doctor_rehearsal_group }}"
          - --property=NoNewPrivileges=yes
          - --property=PrivateDevices=yes
          - --property=PrivateNetwork=yes
          - --property=PrivateTmp=yes
          - --property=ProtectClock=yes
          - --property=ProtectControlGroups=yes
          # The private /home view makes retired absolute install paths resolve
          # as absent. ProtectHome=yes returns EACCES, which makes OpenClaw's
          # supported uninstall transaction abort while checking old markers.
          - --property=ProtectHome=tmpfs
          - --property=ProtectHostname=yes
          - --property=ProtectKernelLogs=yes
          - --property=ProtectKernelModules=yes
          - --property=ProtectKernelTunables=yes
          - --property=ProtectProc=invisible
          - --property=ProtectSystem=strict
          - --property=RestrictAddressFamilies=AF_UNIX
          - --property=RestrictSUIDSGID=yes
          - --property=LockPersonality=yes
          - --property=CapabilityBoundingSet=
          - --property=AmbientCapabilities=
          - --property=UMask=0077
          - "--property=WorkingDirectory={{ openclaw_doctor_rehearsal_generation_workspace }}"
          - "--property=ReadWritePaths={{ openclaw_doctor_rehearsal_generation_state }}"
          - "--property=ReadWritePaths={{ openclaw_doctor_rehearsal_generation_workspace }}"
          - "--property=ReadWritePaths={{ openclaw_doctor_rehearsal_generation_config_dir }}"
          - --property=InaccessiblePaths=/var/run/docker.sock
          - --property=InaccessiblePaths=/opt/cc-ansible
        openclaw_doctor_rehearsal_command_environment:
          - /usr/bin/env
          - -i
          - >-
            HOME={{ openclaw_doctor_rehearsal_state_root }}/generations/{{ openclaw_doctor_rehearsal_stamp }}
          - "PATH=/usr/bin:/bin"
          - "TMPDIR=/tmp"
          - XDG_CONFIG_HOME=/tmp/openclaw-doctor-home/.config
          - XDG_DATA_HOME=/tmp/openclaw-doctor-home/.local/share
          - XDG_CACHE_HOME=/tmp/openclaw-doctor-home/.cache
          - OPENCLAW_HOME=/tmp/openclaw-doctor-home
          - "OPENCLAW_STATE_DIR={{ openclaw_doctor_rehearsal_generation_state }}"
          - "OPENCLAW_CONFIG_PATH={{ openclaw_doctor_rehearsal_generation_config }}"
          - "OPENCLAW_WORKSPACE_DIR={{ openclaw_doctor_rehearsal_generation_workspace }}"
          - OPENCLAW_SKIP_CHANNELS=1
          - OPENCLAW_SERVICE_REPAIR_POLICY=external
          - NPM_CONFIG_OFFLINE=true
          - NPM_CONFIG_FETCH_RETRIES=0
          - NPM_CONFIG_FETCH_TIMEOUT=5000
          - NO_COLOR=1

    - name: Prove migration identity cannot read production OpenClaw state
      ansible.builtin.command:
        argv: >-
          {{
            openclaw_doctor_rehearsal_transient_prefix
            + ['--unit=openclaw-doctor-source-proof-' + openclaw_doctor_rehearsal_stamp]
            + [openclaw_isolated_access_check_path, '!', '-r', openclaw_doctor_rehearsal_source_config]
          }}
      changed_when: false

    - name: Validate slot-suspended copied OpenClaw configuration
      ansible.builtin.command:
        argv: >-
          {{
            openclaw_doctor_rehearsal_transient_prefix
            + ['--unit=openclaw-doctor-config-pre-' + openclaw_doctor_rehearsal_stamp]
            + openclaw_doctor_rehearsal_command_environment
            + [openclaw_doctor_rehearsal_runtime + '/bin/openclaw', 'config', 'validate']
          }}
      changed_when: false

    - name: Inspect copied OpenClaw plugin install records
      ansible.builtin.command:
        argv: >-
          {{
            openclaw_doctor_rehearsal_transient_prefix
            + ['--unit=openclaw-doctor-registry-before-' + openclaw_doctor_rehearsal_stamp]
            + openclaw_doctor_rehearsal_command_environment
            + [openclaw_doctor_rehearsal_runtime + '/bin/openclaw', 'plugins', 'registry', '--json']
          }}
      register: openclaw_doctor_rehearsal_registry_before_raw
      changed_when: false
      no_log: true

    - name: Parse copied OpenClaw plugin install records
      ansible.builtin.set_fact:
        openclaw_doctor_rehearsal_registry_before: >-
          {{ openclaw_doctor_rehearsal_registry_before_raw.stdout | from_json }}
      no_log: true

    - name: Require the classified legacy OpenClaw install-record set
      ansible.builtin.assert:
        that:
          - openclaw_doctor_rehearsal_registry_before.current.installRecords | default({}, true) | dict2items | map(attribute='key') | sort == openclaw_doctor_rehearsal_install_records | sort
          - openclaw_doctor_rehearsal_registry_before.persisted.installRecords | default({}, true) | dict2items | map(attribute='key') | sort == openclaw_doctor_rehearsal_install_records | sort
        fail_msg: >-
          The copied plugin registry contains an unclassified or missing install
          record. Update the modernization disposition before continuing.

    - name: Record classified legacy OpenClaw install records
      ansible.builtin.copy:
        dest: "{{ openclaw_doctor_rehearsal_evidence_dir }}/plugin-records-before.json"
        owner: root
        group: root
        mode: "0600"
        content: >-
          {{
            {
              'schemaVersion': 1,
              'installRecords': openclaw_doctor_rehearsal_install_records | sort
            }
            | to_nice_json
          }}

    - name: Retire copied legacy OpenClaw plugin install records
      ansible.builtin.command:
        argv: >-
          {{
            openclaw_doctor_rehearsal_transient_prefix
            + ['--unit=openclaw-doctor-uninstall-' + item + '-' + openclaw_doctor_rehearsal_stamp]
            + openclaw_doctor_rehearsal_command_environment
            + [
                openclaw_doctor_rehearsal_runtime + '/bin/openclaw',
                'plugins', 'uninstall', item,
                '--keep-files', '--force'
              ]
          }}
      loop: "{{ openclaw_doctor_rehearsal_install_records }}"
      loop_control:
        label: "{{ item }}"
      changed_when: true

    - name: Inspect retired copied OpenClaw plugin registry
      ansible.builtin.command:
        argv: >-
          {{
            openclaw_doctor_rehearsal_transient_prefix
            + ['--unit=openclaw-doctor-registry-retired-' + openclaw_doctor_rehearsal_stamp]
            + openclaw_doctor_rehearsal_command_environment
            + [openclaw_doctor_rehearsal_runtime + '/bin/openclaw', 'plugins', 'registry', '--json']
          }}
      register: openclaw_doctor_rehearsal_registry_retired_raw
      changed_when: false
      no_log: true

    - name: Parse retired copied OpenClaw plugin registry
      ansible.builtin.set_fact:
        openclaw_doctor_rehearsal_registry_retired: >-
          {{ openclaw_doctor_rehearsal_registry_retired_raw.stdout | from_json }}
      no_log: true

    - name: Require complete legacy plugin ownership retirement
      ansible.builtin.assert:
        that:
          - openclaw_doctor_rehearsal_registry_retired.current.installRecords | default({}, true) | length == 0
          - openclaw_doctor_rehearsal_registry_retired.persisted.installRecords | default({}, true) | length == 0
        fail_msg: >-
          A copied legacy plugin ownership record survived the supported
          uninstall transaction.

    - name: Create private managed plugin install cache
      ansible.builtin.file:
        path: "{{ openclaw_doctor_rehearsal_plugin_build_cache }}"
        state: directory
        owner: "{{ openclaw_doctor_rehearsal_user }}"
        group: "{{ openclaw_doctor_rehearsal_group }}"
        mode: "0700"

    - name: Define isolated networked managed plugin install command
      ansible.builtin.set_fact:
        openclaw_doctor_rehearsal_plugin_build_prefix:
          - /usr/bin/systemd-run
          - --quiet
          - --wait
          - --collect
          - --pipe
          - --service-type=exec
          - --property=RuntimeMaxSec=300s
          - "--property=User={{ openclaw_doctor_rehearsal_user }}"
          - "--property=Group={{ openclaw_doctor_rehearsal_group }}"
          - --property=NoNewPrivileges=yes
          - --property=PrivateDevices=yes
          - --property=PrivateTmp=yes
          - --property=ProtectClock=yes
          - --property=ProtectControlGroups=yes
          - --property=ProtectHome=tmpfs
          - --property=ProtectHostname=yes
          - --property=ProtectKernelLogs=yes
          - --property=ProtectKernelModules=yes
          - --property=ProtectKernelTunables=yes
          - --property=ProtectProc=invisible
          - --property=ProtectSystem=strict
          - "--property=RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6"
          - --property=RestrictSUIDSGID=yes
          - --property=LockPersonality=yes
          - --property=CapabilityBoundingSet=
          - --property=AmbientCapabilities=
          - --property=UMask=0077
          - "--property=WorkingDirectory={{ openclaw_doctor_rehearsal_generation_config_dir }}"
          - "--property=ReadWritePaths={{ openclaw_doctor_rehearsal_generation_state }}"
          - "--property=ReadWritePaths={{ openclaw_doctor_rehearsal_generation_config_dir }}"
          - --property=InaccessiblePaths=/var/lib/openclaw-migration-rehearsal
          - --property=InaccessiblePaths=/usr/local/share/openclaw-migration-rehearsal
          - --property=InaccessiblePaths=/var/run/docker.sock
          - --property=InaccessiblePaths=/opt/cc-ansible
        openclaw_doctor_rehearsal_plugin_build_environment:
          - /usr/bin/env
          - -i
          - HOME=/tmp/openclaw-plugin-build-home
          - PATH=/usr/bin:/bin
          - TMPDIR=/tmp
          - OPENCLAW_HOME=/tmp/openclaw-plugin-build-home
          - "OPENCLAW_STATE_DIR={{ openclaw_doctor_rehearsal_generation_state }}"
          - "OPENCLAW_CONFIG_PATH={{ openclaw_doctor_rehearsal_generation_config }}"
          - OPENCLAW_WORKSPACE_DIR=/tmp/openclaw-plugin-build-workspace
          - "NPM_CONFIG_CACHE={{ openclaw_doctor_rehearsal_plugin_build_cache }}"
          - NPM_CONFIG_FETCH_RETRIES=2
          - NPM_CONFIG_FETCH_TIMEOUT=30000
          - NO_COLOR=1

    - name: Install exact managed plugins into copied modern state
      ansible.builtin.command:
        argv: >-
          {{
            openclaw_doctor_rehearsal_plugin_build_prefix
            + [
                '--unit=openclaw-doctor-plugin-install-'
                + item.definition.id
                + '-'
                + openclaw_doctor_rehearsal_stamp
              ]
            + openclaw_doctor_rehearsal_plugin_build_environment
            + [
                openclaw_doctor_rehearsal_runtime + '/bin/openclaw',
                'plugins', 'install',
                'npm:' + item.package.name + '@' + item.package.version,
                '--pin'
              ]
          }}
      loop: "{{ openclaw_doctor_rehearsal_plugin_metadata }}"
      loop_control:
        label: "{{ item.definition.id }}"
      changed_when: true
      no_log: true

    - name: Inspect supported managed plugin install registry
      ansible.builtin.command:
        argv: >-
          {{
            openclaw_doctor_rehearsal_plugin_build_prefix
            + ['--unit=openclaw-doctor-plugin-registry-' + openclaw_doctor_rehearsal_stamp]
            + openclaw_doctor_rehearsal_plugin_build_environment
            + [
                openclaw_doctor_rehearsal_runtime + '/bin/openclaw',
                'plugins', 'registry', '--json'
              ]
          }}
      register: openclaw_doctor_rehearsal_plugin_build_registry_raw
      changed_when: false
      no_log: true

    - name: Decode supported managed plugin install registry
      ansible.builtin.set_fact:
        openclaw_doctor_rehearsal_plugin_build_registry: >-
          {{ openclaw_doctor_rehearsal_plugin_build_registry_raw.stdout | from_json }}
      no_log: true

    - name: Inspect managed plugin manifest trust after supported installation
      ansible.builtin.command:
        argv: >-
          {{
            openclaw_doctor_rehearsal_plugin_build_prefix
            + [
                '--unit=openclaw-doctor-plugin-inspect-'
                + item.definition.id
                + '-'
                + openclaw_doctor_rehearsal_stamp
              ]
            + openclaw_doctor_rehearsal_plugin_build_environment
            + [
                openclaw_doctor_rehearsal_runtime + '/bin/openclaw',
                'plugins', 'inspect', item.definition.id, '--json'
              ]
          }}
      loop: "{{ openclaw_doctor_rehearsal_plugin_metadata }}"
      loop_control:
        label: "{{ item.definition.id }}"
      register: openclaw_doctor_rehearsal_plugin_build_inspections_raw
      changed_when: false
      no_log: true

    - name: Parse managed plugin manifest trust inspections
      ansible.builtin.set_fact:
        openclaw_doctor_rehearsal_plugin_build_inspections: >-
          {{
            (openclaw_doctor_rehearsal_plugin_build_inspections | default([]))
            + [item.stdout | from_json]
          }}
      loop: "{{ openclaw_doctor_rehearsal_plugin_build_inspections_raw.results }}"
      loop_control:
        label: "{{ item.item.definition.id }}"
      no_log: true

    - name: Require exact npm-provenance plugin record set
      ansible.builtin.assert:
        that:
          - openclaw_doctor_rehearsal_plugin_build_registry.current.installRecords | dict2items | map(attribute='key') | sort == openclaw_isolated_gateway_managed_plugins | map(attribute='id') | sort
          - openclaw_doctor_rehearsal_plugin_build_registry.persisted.installRecords | dict2items | map(attribute='key') | sort == openclaw_isolated_gateway_managed_plugins | map(attribute='id') | sort
        fail_msg: >-
          The copied modern state does not contain exactly the classified
          managed npm install records.

    - name: Require supported npm provenance and manifest trust classification
      ansible.builtin.assert:
        that:
          - openclaw_doctor_rehearsal_plugin_build_registry.current.installRecords[item.definition.id].source == 'npm'
          - openclaw_doctor_rehearsal_plugin_build_registry.current.installRecords[item.definition.id].resolvedName == item.package.name
          - openclaw_doctor_rehearsal_plugin_build_registry.current.installRecords[item.definition.id].resolvedVersion == item.package.version
          - openclaw_doctor_rehearsal_plugin_build_registry.current.installRecords[item.definition.id].integrity | length > 0
          - (openclaw_doctor_rehearsal_plugin_build_registry.current.plugins | selectattr('pluginId', 'equalto', item.definition.id) | list | length) == 1
          - (openclaw_doctor_rehearsal_plugin_build_registry.current.plugins | selectattr('pluginId', 'equalto', item.definition.id) | list | first).origin == 'global'
          - (openclaw_doctor_rehearsal_plugin_build_registry.current.plugins | selectattr('pluginId', 'equalto', item.definition.id) | list | first).rootDir is match('^' + (openclaw_doctor_rehearsal_generation_state | regex_escape) + '/npm/')
          - openclaw_doctor_rehearsal_plugin_build_inspections[plugin_index].plugin.id == item.definition.id
          - openclaw_doctor_rehearsal_plugin_build_inspections[plugin_index].plugin.packageName == item.package.name
          - openclaw_doctor_rehearsal_plugin_build_inspections[plugin_index].plugin.origin == 'global'
          - openclaw_doctor_rehearsal_plugin_build_inspections[plugin_index].plugin.rootDir is match('^' + (openclaw_doctor_rehearsal_generation_state | regex_escape) + '/npm/')
          - ((openclaw_doctor_rehearsal_plugin_build_inspections[plugin_index].plugin.trustedOfficialInstall | default(false)) | bool) == (item.definition.trusted_official | bool)
        fail_msg: >-
          Managed plugin {{ item.definition.id }} lacks exact npm provenance,
          integrity, state-local placement, or manifest-proven official trust.
      loop: "{{ openclaw_doctor_rehearsal_plugin_metadata }}"
      loop_control:
        label: "{{ item.definition.id }}"
        index_var: plugin_index

    - name: Preserve supported managed plugin install registry
      ansible.builtin.copy:
        dest: "{{ openclaw_doctor_rehearsal_evidence_dir }}/plugin-install-registry.json"
        owner: root
        group: root
        mode: "0600"
        content: >-
          {{ openclaw_doctor_rehearsal_plugin_build_registry | to_nice_json }}
      no_log: true

    - name: Preserve managed plugin manifest trust inspections
      ansible.builtin.copy:
        dest: "{{ openclaw_doctor_rehearsal_evidence_dir }}/plugin-install-inspections.json"
        owner: root
        group: root
        mode: "0600"
        content: >-
          {{ openclaw_doctor_rehearsal_plugin_build_inspections | to_nice_json }}
      no_log: true

    - name: Derive npm-managed plugin roots
      ansible.builtin.set_fact:
        openclaw_doctor_rehearsal_managed_plugin_root_paths: >-
          {{
            (openclaw_doctor_rehearsal_managed_plugin_root_paths | default([]))
            + [
                (
                  openclaw_doctor_rehearsal_plugin_build_registry.current.plugins
                  | selectattr('pluginId', 'equalto', item.id)
                  | map(attribute='rootDir')
                  | first
                )
              ]
          }}
      loop: "{{ openclaw_isolated_gateway_managed_plugins }}"
      loop_control:
        label: "{{ item.id }}"

    - name: Remove credential-free plugin install cache
      ansible.builtin.file:
        path: "{{ openclaw_doctor_rehearsal_plugin_build_cache }}"
        state: absent

    - name: Restore sanitized retained OpenClaw plugin configuration
      ansible.builtin.command:
        argv: >-
          {{
            [
              openclaw_doctor_rehearsal_tool,
              'transform-config',
              '--source', openclaw_doctor_rehearsal_source_config,
              '--output', openclaw_doctor_rehearsal_generation_config + '.final',
              '--report', openclaw_doctor_rehearsal_evidence_dir + '/config-final.json',
              '--source-state-root', openclaw_doctor_rehearsal_source_state_dir,
              '--source-workspace-root', openclaw_doctor_rehearsal_source_state_dir + '/workspace',
              '--target-state-root', openclaw_doctor_rehearsal_generation_state,
              '--target-workspace-root', openclaw_doctor_rehearsal_generation_workspace,
              '--gateway-port', '19789',
              '--gateway-secret-file', openclaw_doctor_rehearsal_generation_secret
            ]
            + openclaw_doctor_rehearsal_plugin_arguments
            + openclaw_doctor_rehearsal_retired_plugin_arguments
            + openclaw_doctor_rehearsal_isolation_arguments
          }}
      changed_when: true

    - name: Assign final sanitized config to migration identity
      ansible.builtin.file:
        path: "{{ openclaw_doctor_rehearsal_generation_config }}.final"
        state: file
        owner: "{{ openclaw_doctor_rehearsal_user }}"
        group: "{{ openclaw_doctor_rehearsal_group }}"
        mode: "0600"

    - name: Replace temporary uninstall config atomically
      ansible.builtin.command:
        argv:
          - /usr/bin/mv
          - --force
          - --no-target-directory
          - "{{ openclaw_doctor_rehearsal_generation_config }}.final"
          - "{{ openclaw_doctor_rehearsal_generation_config }}"
      changed_when: true

    - name: Validate final modernized OpenClaw configuration
      ansible.builtin.command:
        argv: >-
          {{
            openclaw_doctor_rehearsal_transient_prefix
            + ['--unit=openclaw-doctor-config-final-' + openclaw_doctor_rehearsal_stamp]
            + openclaw_doctor_rehearsal_command_environment
            + [openclaw_doctor_rehearsal_runtime + '/bin/openclaw', 'config', 'validate']
          }}
      changed_when: false

    - name: Allow only immutable plugin roots for generated skill links
      ansible.builtin.set_fact:
        openclaw_doctor_rehearsal_plugin_skill_manifest_arguments: >-
          {{
            (openclaw_doctor_rehearsal_plugin_skill_manifest_arguments | default([]))
            + [
                '--allow-plugin-skill-target-root',
                item
              ]
          }}
      loop: "{{ openclaw_doctor_rehearsal_managed_plugin_root_paths }}"
      loop_control:
        label: "{{ item }}"

    - name: Migrate supported npm records and refresh copied plugin registry
      ansible.builtin.command:
        argv: >-
          {{
            openclaw_doctor_rehearsal_transient_prefix
            + ['--unit=openclaw-doctor-registry-refresh-' + openclaw_doctor_rehearsal_stamp]
            + openclaw_doctor_rehearsal_command_environment
            + [openclaw_doctor_rehearsal_runtime + '/bin/openclaw', 'plugins', 'registry', '--refresh']
          }}
      changed_when: true

    - name: Inspect modernized copied OpenClaw plugin registry
      ansible.builtin.command:
        argv: >-
          {{
            openclaw_doctor_rehearsal_transient_prefix
            + ['--unit=openclaw-doctor-registry-after-' + openclaw_doctor_rehearsal_stamp]
            + openclaw_doctor_rehearsal_command_environment
            + [openclaw_doctor_rehearsal_runtime + '/bin/openclaw', 'plugins', 'registry', '--json']
          }}
      register: openclaw_doctor_rehearsal_registry_after_raw
      changed_when: false
      no_log: true

    - name: Parse modernized copied OpenClaw plugin registry
      ansible.builtin.set_fact:
        openclaw_doctor_rehearsal_registry_after: >-
          {{ openclaw_doctor_rehearsal_registry_after_raw.stdout | from_json }}
      no_log: true

    - name: Inspect modernized managed plugin manifest trust
      ansible.builtin.command:
        argv: >-
          {{
            openclaw_doctor_rehearsal_transient_prefix
            + [
                '--unit=openclaw-doctor-inspect-after-'
                + item.id
                + '-'
                + openclaw_doctor_rehearsal_stamp
              ]
            + openclaw_doctor_rehearsal_command_environment
            + [
                openclaw_doctor_rehearsal_runtime + '/bin/openclaw',
                'plugins', 'inspect', item.id, '--json'
              ]
          }}
      loop: "{{ openclaw_isolated_gateway_managed_plugins }}"
      loop_control:
        label: "{{ item.id }}"
      register: openclaw_doctor_rehearsal_plugin_inspections_after_raw
      changed_when: false
      no_log: true

    - name: Parse modernized managed plugin manifest trust inspections
      ansible.builtin.set_fact:
        openclaw_doctor_rehearsal_plugin_inspections_after: >-
          {{
            (openclaw_doctor_rehearsal_plugin_inspections_after | default([]))
            + [item.stdout | from_json]
          }}
      loop: "{{ openclaw_doctor_rehearsal_plugin_inspections_after_raw.results }}"
      loop_control:
        label: "{{ item.item.id }}"
      no_log: true

    - name: Require only modern managed-plugin ownership records
      ansible.builtin.assert:
        that:
          - (openclaw_doctor_rehearsal_registry_after.current.installRecords | default({}, true) | dict2items | map(attribute='key') | sort) == (openclaw_isolated_gateway_managed_plugins | map(attribute='id') | sort)
          - (openclaw_doctor_rehearsal_registry_after.persisted.installRecords | default({}, true) | dict2items | map(attribute='key') | sort) == (openclaw_isolated_gateway_managed_plugins | map(attribute='id') | sort)
        fail_msg: >-
          A legacy record survived or a root-managed plugin lacks its modern
          npm provenance record.

    - name: Require canonical immutable OpenClaw plugin ownership records
      ansible.builtin.assert:
        that:
          - openclaw_doctor_rehearsal_registry_after.current.installRecords[openclaw_isolated_gateway_managed_plugins[item].id].source == 'npm'
          - openclaw_doctor_rehearsal_registry_after.current.installRecords[openclaw_isolated_gateway_managed_plugins[item].id].installPath == openclaw_doctor_rehearsal_managed_plugin_root_paths[item]
          - openclaw_doctor_rehearsal_registry_after.current.installRecords[openclaw_isolated_gateway_managed_plugins[item].id].resolvedName == openclaw_isolated_gateway_managed_plugins[item].package
          - openclaw_doctor_rehearsal_registry_after.current.installRecords[openclaw_isolated_gateway_managed_plugins[item].id].integrity | length > 0
          - openclaw_doctor_rehearsal_registry_after.persisted.installRecords[openclaw_isolated_gateway_managed_plugins[item].id].source == 'npm'
          - openclaw_doctor_rehearsal_registry_after.persisted.installRecords[openclaw_isolated_gateway_managed_plugins[item].id].installPath == openclaw_doctor_rehearsal_managed_plugin_root_paths[item]
        fail_msg: >-
          A retained plugin lacks supported npm provenance, integrity, or the
          exact read-only managed install path.
      loop: "{{ range(0, openclaw_isolated_gateway_managed_plugins | length) | list }}"
      loop_control:
        label: "{{ openclaw_isolated_gateway_managed_plugins[item].id }}"

    - name: Require exact immutable managed plugins after modernization
      ansible.builtin.assert:
        that:
          - openclaw_doctor_rehearsal_registry_after.current.plugins | selectattr('pluginId', 'equalto', openclaw_isolated_gateway_managed_plugins[item].id) | list | length == 1
          - (openclaw_doctor_rehearsal_registry_after.current.plugins | selectattr('pluginId', 'equalto', openclaw_isolated_gateway_managed_plugins[item].id) | list | first).origin == 'global'
          - ((openclaw_doctor_rehearsal_registry_after.current.plugins | selectattr('pluginId', 'equalto', openclaw_isolated_gateway_managed_plugins[item].id) | list | first).enabled | bool) == (openclaw_isolated_gateway_managed_plugins[item].id not in openclaw_doctor_rehearsal_disabled_runtime_plugins)
          - (openclaw_doctor_rehearsal_registry_after.current.plugins | selectattr('pluginId', 'equalto', openclaw_isolated_gateway_managed_plugins[item].id) | list | first).rootDir == openclaw_doctor_rehearsal_managed_plugin_root_paths[item]
          - openclaw_doctor_rehearsal_plugin_inspections_after[item].plugin.id == openclaw_isolated_gateway_managed_plugins[item].id
          - openclaw_doctor_rehearsal_plugin_inspections_after[item].plugin.packageName == openclaw_isolated_gateway_managed_plugins[item].package
          - openclaw_doctor_rehearsal_plugin_inspections_after[item].plugin.origin == 'global'
          - openclaw_doctor_rehearsal_plugin_inspections_after[item].plugin.rootDir == openclaw_doctor_rehearsal_managed_plugin_root_paths[item]
          - ((openclaw_doctor_rehearsal_plugin_inspections_after[item].plugin.trustedOfficialInstall | default(false)) | bool) == (openclaw_isolated_gateway_managed_plugins[item].trusted_official | bool)
          - (openclaw_doctor_rehearsal_plugin_inspections_after[item].plugin.enabled | bool) == (openclaw_isolated_gateway_managed_plugins[item].id not in openclaw_doctor_rehearsal_disabled_runtime_plugins)
