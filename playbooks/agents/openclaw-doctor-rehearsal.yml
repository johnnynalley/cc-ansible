      register: openclaw_doctor_rehearsal_registry_post_doctor_raw
      changed_when: false
      no_log: true

    - name: Parse managed plugin registry after OpenClaw Doctor
      ansible.builtin.set_fact:
        openclaw_doctor_rehearsal_registry_post_doctor: >-
          {{ openclaw_doctor_rehearsal_registry_post_doctor_raw.stdout | from_json }}
      no_log: true

    - name: Inspect managed plugin manifest trust after OpenClaw Doctor
      ansible.builtin.command:
        argv: >-
          {{
            openclaw_doctor_rehearsal_transient_prefix
            + [
                '--unit=openclaw-doctor-inspect-post-'
                + item.id
                + '-'
                + openclaw_doctor_rehearsal_stamp
              ]
            + openclaw_doctor_rehearsal_command_environment
            + [
                openclaw_doctor_rehearsal_runtime + '/bin/openclaw',
                'plugins', 'inspect', item.id, '--json'
              ]
          }}
      loop: "{{ openclaw_isolated_gateway_managed_plugins }}"
      loop_control:
        label: "{{ item.id }}"
      register: openclaw_doctor_rehearsal_plugin_inspections_post_doctor_raw
      changed_when: false
      no_log: true

    - name: Parse managed plugin manifest trust inspections after Doctor
      ansible.builtin.set_fact:
        openclaw_doctor_rehearsal_plugin_inspections_post_doctor: >-
          {{
            (openclaw_doctor_rehearsal_plugin_inspections_post_doctor | default([]))
            + [item.stdout | from_json]
          }}
      loop: "{{ openclaw_doctor_rehearsal_plugin_inspections_post_doctor_raw.results }}"
      loop_control:
        label: "{{ item.item.id }}"
      no_log: true

    - name: Require clean managed plugin registration after OpenClaw Doctor
      ansible.builtin.assert:
        that:
          - openclaw_doctor_rehearsal_registry_post_doctor_raw.rc == 0
          - "'openKeyedStore is only available for trusted plugins' not in openclaw_doctor_rehearsal_registry_post_doctor_raw.stderr"
          - (openclaw_doctor_rehearsal_registry_post_doctor.current.installRecords | default({}, true) | dict2items | map(attribute='key') | sort) == (openclaw_isolated_gateway_managed_plugins | map(attribute='id') | sort)
          - (openclaw_doctor_rehearsal_registry_post_doctor.persisted.installRecords | default({}, true) | dict2items | map(attribute='key') | sort) == (openclaw_isolated_gateway_managed_plugins | map(attribute='id') | sort)
        fail_msg: >-
          Doctor changed supported plugin provenance or plugin registration
          still emits a trusted-plugin failure.

    - name: Require exact managed plugin provenance after OpenClaw Doctor
      ansible.builtin.assert:
        that:
          - openclaw_doctor_rehearsal_registry_post_doctor.current.installRecords[openclaw_isolated_gateway_managed_plugins[item].id].source == 'npm'
          - openclaw_doctor_rehearsal_registry_post_doctor.current.installRecords[openclaw_isolated_gateway_managed_plugins[item].id].installPath == openclaw_doctor_rehearsal_managed_plugin_root_paths[item]
          - openclaw_doctor_rehearsal_registry_post_doctor.current.installRecords[openclaw_isolated_gateway_managed_plugins[item].id].integrity | length > 0
          - (openclaw_doctor_rehearsal_registry_post_doctor.current.plugins | selectattr('pluginId', 'equalto', openclaw_isolated_gateway_managed_plugins[item].id) | list | length) == 1
          - (openclaw_doctor_rehearsal_registry_post_doctor.current.plugins | selectattr('pluginId', 'equalto', openclaw_isolated_gateway_managed_plugins[item].id) | list | first).rootDir == openclaw_doctor_rehearsal_managed_plugin_root_paths[item]
          - ((openclaw_doctor_rehearsal_registry_post_doctor.current.plugins | selectattr('pluginId', 'equalto', openclaw_isolated_gateway_managed_plugins[item].id) | list | first).enabled | bool) == (openclaw_isolated_gateway_managed_plugins[item].id not in openclaw_doctor_rehearsal_disabled_runtime_plugins)
          - openclaw_doctor_rehearsal_plugin_inspections_post_doctor[item].plugin.id == openclaw_isolated_gateway_managed_plugins[item].id
          - openclaw_doctor_rehearsal_plugin_inspections_post_doctor[item].plugin.packageName == openclaw_isolated_gateway_managed_plugins[item].package
          - openclaw_doctor_rehearsal_plugin_inspections_post_doctor[item].plugin.origin == 'global'
          - openclaw_doctor_rehearsal_plugin_inspections_post_doctor[item].plugin.rootDir == openclaw_doctor_rehearsal_managed_plugin_root_paths[item]
          - ((openclaw_doctor_rehearsal_plugin_inspections_post_doctor[item].plugin.trustedOfficialInstall | default(false)) | bool) == (openclaw_isolated_gateway_managed_plugins[item].trusted_official | bool)
          - (openclaw_doctor_rehearsal_plugin_inspections_post_doctor[item].plugin.enabled | bool) == (openclaw_isolated_gateway_managed_plugins[item].id not in openclaw_doctor_rehearsal_disabled_runtime_plugins)
        fail_msg: >-
          A managed plugin lost its npm ownership, integrity, immutable path,
          manifest trust classification, or credential-free enablement state.
      loop: "{{ range(0, openclaw_isolated_gateway_managed_plugins | length) | list }}"
      loop_control:
        label: "{{ openclaw_isolated_gateway_managed_plugins[item].id }}"

    - name: Record post-Doctor managed plugin validation
      ansible.builtin.copy:
        dest: "{{ openclaw_doctor_rehearsal_evidence_dir }}/plugin-registry-post-doctor.json"
        owner: root
        group: root
        mode: "0600"
        content: >-
          {{
            {
              'schemaVersion': 1,
              'validatedAfterDoctor': true,
              'ownershipRecordSource': 'npm',
              'managedPlugins': (
                openclaw_isolated_gateway_managed_plugins
                | map(attribute='id')
                | sort
              ),
              'runtimeDisabledPlugins': openclaw_doctor_rehearsal_disabled_runtime_plugins | sort
            }
            | to_nice_json
          }}

    - name: Capture OpenClaw Doctor second-pass evidence
      ansible.builtin.include_tasks: ../../tasks/openclaw-doctor-snapshot.yml
      vars:
        openclaw_doctor_snapshot_phase: after-pass2

    - name: Compare second-pass OpenClaw Doctor filesystem effects
      ansible.builtin.command:
        argv:
          - "{{ openclaw_doctor_rehearsal_tool }}"
          - diff
          - --before
          - "{{ openclaw_doctor_rehearsal_evidence_dir }}/after-pass1-{{ item }}.json"
          - --after
          - "{{ openclaw_doctor_rehearsal_evidence_dir }}/after-pass2-{{ item }}.json"
          - --output
          - "{{ openclaw_doctor_rehearsal_evidence_dir }}/pass2-diff-{{ item }}.json"
      loop:
        - state
        - plugins
        - workspace
        - config
      changed_when: false

    - name: Read second-pass OpenClaw Doctor filesystem diffs
      ansible.builtin.slurp:
        src: "{{ openclaw_doctor_rehearsal_evidence_dir }}/pass2-diff-{{ item }}.json"
      loop:
        - state
        - plugins
        - workspace
        - config
      register: openclaw_doctor_rehearsal_pass2_diffs

    - name: Require idempotent OpenClaw Doctor filesystem state
      ansible.builtin.assert:
        that:
          - (item.content | b64decode | from_json).summary.added == 0
          - (item.content | b64decode | from_json).summary.removed == 0
          - (item.content | b64decode | from_json).summary.modified == 0
        fail_msg: >-
          The second Doctor pass changed non-database state. The data-free diff
          remains in root-only rehearsal evidence for classification.
      loop: "{{ openclaw_doctor_rehearsal_pass2_diffs.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Inspect idempotent OpenClaw Doctor database summaries after pass one
      ansible.builtin.stat:
        path: "{{ openclaw_doctor_rehearsal_evidence_dir }}/after-pass1-db-{{ item.name }}.json"
        checksum_algorithm: sha256
      loop: "{{ openclaw_doctor_rehearsal_database_specs | selectattr('idempotency') | list }}"
      loop_control:
        label: "{{ item.name }}"
      register: openclaw_doctor_rehearsal_database_pass1

    - name: Inspect idempotent OpenClaw Doctor database summaries after pass two
      ansible.builtin.stat:
        path: "{{ openclaw_doctor_rehearsal_evidence_dir }}/after-pass2-db-{{ item.name }}.json"
        checksum_algorithm: sha256
      loop: "{{ openclaw_doctor_rehearsal_database_specs | selectattr('idempotency') | list }}"
      loop_control:
        label: "{{ item.name }}"
      register: openclaw_doctor_rehearsal_database_pass2

    - name: Require idempotent OpenClaw Doctor stable database state
      ansible.builtin.assert:
        that:
          - openclaw_doctor_rehearsal_database_pass1.results[item].stat.checksum == openclaw_doctor_rehearsal_database_pass2.results[item].stat.checksum
        fail_msg: >-
          The second Doctor pass changed a stable database table. Data-free
          table summaries remain in root-only rehearsal evidence.
      loop: "{{ range(0, openclaw_doctor_rehearsal_database_pass1.results | length) | list }}"
      loop_control:
        label: "{{ openclaw_doctor_rehearsal_database_pass1.results[item].item.name }}"

    - name: Run networkless OpenClaw Doctor error-level lint
      ansible.builtin.command:
        argv: >-
          {{
            openclaw_doctor_rehearsal_transient_prefix
            + ['--unit=openclaw-doctor-lint-' + openclaw_doctor_rehearsal_stamp]
            + openclaw_doctor_rehearsal_command_environment
            + [
                openclaw_doctor_rehearsal_runtime + '/bin/openclaw',
                'doctor', '--lint', '--all', '--json',
                '--severity-min', 'error'
              ]
          }}
      register: openclaw_doctor_rehearsal_lint
      changed_when: false
      failed_when: false
      no_log: true

    - name: Preserve OpenClaw Doctor lint JSON
      ansible.builtin.copy:
        dest: "{{ openclaw_doctor_rehearsal_evidence_dir }}/doctor-lint.json"
        owner: root
        group: root
        mode: "0600"
        content: "{{ openclaw_doctor_rehearsal_lint.stdout }}\n"
      no_log: true

    - name: Preserve OpenClaw Doctor lint diagnostics
      ansible.builtin.copy:
        dest: "{{ openclaw_doctor_rehearsal_evidence_dir }}/doctor-lint.stderr.txt"
        owner: root
        group: root
        mode: "0600"
        content: "{{ openclaw_doctor_rehearsal_lint.stderr }}\n"
      no_log: true

    - name: Require successful OpenClaw Doctor error-level lint
      ansible.builtin.assert:
        that:
          - openclaw_doctor_rehearsal_lint.rc == 0
          - (openclaw_doctor_rehearsal_lint.stdout | from_json).ok | bool
          - (openclaw_doctor_rehearsal_lint.stdout | from_json).findings | length == 0
        fail_msg: >-
          Doctor error-level lint failed. Root-only JSON and diagnostic text
          remain in the rehearsal evidence directory.

    - name: Freeze validated OpenClaw Doctor generation
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: "{{ openclaw_doctor_rehearsal_group }}"
        mode: u=rwX,g=rX,o=
        recurse: true
        follow: false
      loop:
        - "{{ openclaw_doctor_rehearsal_generation_state }}"
        - "{{ openclaw_doctor_rehearsal_generation_workspace }}"
        - "{{ openclaw_doctor_rehearsal_generation_config_dir }}"

    - name: Capture immutable OpenClaw runtime after rehearsal mutation
      ansible.builtin.command:
        argv:
          - "{{ openclaw_doctor_rehearsal_tool }}"
          - manifest
          - --root
          - "{{ openclaw_doctor_rehearsal_runtime_core }}"
          - --output
          - "{{ openclaw_doctor_rehearsal_evidence_dir }}/runtime-core-after.json"
          - --allow-symlink-target-root
          - "{{ openclaw_doctor_rehearsal_runtime_release }}"
      changed_when: true

    - name: Compare immutable OpenClaw runtime boundary
      ansible.builtin.command:
        argv:
          - "{{ openclaw_doctor_rehearsal_tool }}"
          - diff
          - --before
          - "{{ openclaw_doctor_rehearsal_evidence_dir }}/runtime-core-before.json"
          - --after
          - "{{ openclaw_doctor_rehearsal_evidence_dir }}/runtime-core-after.json"
          - --output
          - "{{ openclaw_doctor_rehearsal_evidence_dir }}/runtime-core-diff.json"
      changed_when: false

    - name: Read immutable OpenClaw runtime boundary comparison
      ansible.builtin.slurp:
        src: "{{ openclaw_doctor_rehearsal_evidence_dir }}/runtime-core-diff.json"
      register: openclaw_doctor_rehearsal_runtime_diff

    - name: Require rehearsal confinement to copied OpenClaw state
      ansible.builtin.assert:
        that:
          - (openclaw_doctor_rehearsal_runtime_diff.content | b64decode | from_json).summary.added == 0
          - (openclaw_doctor_rehearsal_runtime_diff.content | b64decode | from_json).summary.removed == 0
          - (openclaw_doctor_rehearsal_runtime_diff.content | b64decode | from_json).summary.modified == 0
        fail_msg: >-
          The Doctor rehearsal changed immutable runtime content or metadata.
          Refusing selector promotion until the mutation escaped-path is fixed.

    - name: Promote validated OpenClaw Doctor generation selectors
      block:
        - name: Create candidate OpenClaw Doctor selectors
          ansible.builtin.command:
            argv:
              - /usr/bin/ln
              - --symbolic
              - --no-target-directory
              - "{{ item.source }}"
              - "{{ item.target }}"
          loop:
            - source: "{{ openclaw_doctor_rehearsal_generation_state }}"
              target: "{{ openclaw_doctor_rehearsal_state_root }}/.current-{{ openclaw_doctor_rehearsal_stamp }}"
            - source: "{{ openclaw_doctor_rehearsal_generation_workspace }}"
              target: "{{ openclaw_doctor_rehearsal_workspace_root }}/.current-{{ openclaw_doctor_rehearsal_stamp }}"
            - source: "{{ openclaw_doctor_rehearsal_generation_config_dir }}"
              target: "{{ openclaw_doctor_rehearsal_config_root }}/.current-{{ openclaw_doctor_rehearsal_stamp }}"
          loop_control:
            label: "{{ item.target }}"
          changed_when: true

        - name: Atomically promote OpenClaw Doctor selectors
          ansible.builtin.command:
            argv:
              - /usr/bin/mv
              - --force
              - --no-target-directory
              - "{{ item.candidate }}"
              - "{{ item.current }}"
          loop:
            - candidate: "{{ openclaw_doctor_rehearsal_state_root }}/.current-{{ openclaw_doctor_rehearsal_stamp }}"
              current: "{{ openclaw_doctor_rehearsal_state_root }}/current"
            - candidate: "{{ openclaw_doctor_rehearsal_workspace_root }}/.current-{{ openclaw_doctor_rehearsal_stamp }}"
              current: "{{ openclaw_doctor_rehearsal_workspace_root }}/current"
            - candidate: "{{ openclaw_doctor_rehearsal_config_root }}/.current-{{ openclaw_doctor_rehearsal_stamp }}"
              current: "{{ openclaw_doctor_rehearsal_config_root }}/current"
          loop_control:
            label: "{{ item.current }}"
          changed_when: true

        - name: Resolve promoted OpenClaw Doctor selectors
          ansible.builtin.command:
            argv:
              - /usr/bin/readlink
              - --canonicalize-existing
              - "{{ item }}"
          loop:
            - "{{ openclaw_doctor_rehearsal_state_root }}/current"
            - "{{ openclaw_doctor_rehearsal_workspace_root }}/current"
            - "{{ openclaw_doctor_rehearsal_config_root }}/current"
          register: openclaw_doctor_rehearsal_promoted_selectors
          changed_when: false

        - name: Require exact promoted OpenClaw Doctor selectors
          ansible.builtin.assert:
            that:
              - openclaw_doctor_rehearsal_promoted_selectors.results[0].stdout == openclaw_doctor_rehearsal_generation_state
              - openclaw_doctor_rehearsal_promoted_selectors.results[1].stdout == openclaw_doctor_rehearsal_generation_workspace
              - openclaw_doctor_rehearsal_promoted_selectors.results[2].stdout == openclaw_doctor_rehearsal_generation_config_dir
            fail_msg: >-
              A promoted Doctor selector does not resolve to the validated
              immutable generation.
      rescue:
        - name: Remove failed OpenClaw Doctor candidate selectors
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - "{{ openclaw_doctor_rehearsal_state_root }}/.current-{{ openclaw_doctor_rehearsal_stamp }}"
            - "{{ openclaw_doctor_rehearsal_workspace_root }}/.current-{{ openclaw_doctor_rehearsal_stamp }}"
            - "{{ openclaw_doctor_rehearsal_config_root }}/.current-{{ openclaw_doctor_rehearsal_stamp }}"

        - name: Restore prior OpenClaw Doctor selectors
          ansible.builtin.file:
            src: "{{ item.source }}"
            dest: "{{ item.dest }}"
            state: link
            force: true
          loop:
            - source: "{{ openclaw_doctor_rehearsal_prior_state_selector.lnk_source | default('') }}"
              dest: "{{ openclaw_doctor_rehearsal_state_root }}/current"
              existed: "{{ openclaw_doctor_rehearsal_prior_state_selector.exists }}"
            - source: "{{ openclaw_doctor_rehearsal_prior_workspace_selector.lnk_source | default('') }}"
              dest: "{{ openclaw_doctor_rehearsal_workspace_root }}/current"
              existed: "{{ openclaw_doctor_rehearsal_prior_workspace_selector.exists }}"
            - source: "{{ openclaw_doctor_rehearsal_prior_config_selector.lnk_source | default('') }}"
              dest: "{{ openclaw_doctor_rehearsal_config_root }}/current"
              existed: "{{ openclaw_doctor_rehearsal_prior_config_selector.exists }}"
          loop_control:
            label: "{{ item.dest }}"
          when: item.existed | bool

        - name: Stop after OpenClaw Doctor selector rollback
          ansible.builtin.fail:
            msg: >-
              Doctor selector promotion failed. Prior selectors were restored
              and the failed generation remains root-only evidence.

    - name: Recheck production OpenClaw config checksum
      ansible.builtin.stat:
        path: "{{ openclaw_doctor_rehearsal_source_config }}"
        checksum_algorithm: sha256
      register: openclaw_doctor_rehearsal_source_config_after

    - name: Recheck production OpenClaw Gateway state
      ansible.builtin.command:
        argv:
          - /usr/sbin/runuser
          - --user
          - johnny
          - --
          - /usr/bin/env
          - XDG_RUNTIME_DIR=/run/user/1000
          - /usr/bin/systemctl
          - --user
          - is-active
          - openclaw-gateway.service
      register: openclaw_doctor_rehearsal_production_service_after
      changed_when: false
      failed_when: false

    - name: Require untouched production OpenClaw control state
      ansible.builtin.assert:
        that:
          - openclaw_doctor_rehearsal_source_config_after.stat.checksum == openclaw_doctor_rehearsal_source_config_before.stat.checksum
          - openclaw_doctor_rehearsal_production_service_after.rc == openclaw_doctor_rehearsal_production_service_before.rc
          - openclaw_doctor_rehearsal_production_service_after.stdout == openclaw_doctor_rehearsal_production_service_before.stdout
        fail_msg: >-
          Production config or Gateway state changed during the copy-only Doctor
          rehearsal. Stop before using the rehearsal result.

    - name: Record successful OpenClaw Doctor rehearsal promotion
      ansible.builtin.copy:
        dest: "{{ openclaw_doctor_rehearsal_evidence_dir }}/PROMOTED.json"
        owner: root
        group: root
        mode: "0600"
        content: >-
          {{
            {
              'schemaVersion': 1,
              'stamp': openclaw_doctor_rehearsal_stamp,
              'state': openclaw_doctor_rehearsal_generation_state,
              'workspace': openclaw_doctor_rehearsal_generation_workspace,
              'config': openclaw_doctor_rehearsal_generation_config,
              'runtime': openclaw_doctor_rehearsal_resolved_selectors.results[2].stdout,
              'doctorPasses': 2,
              'stableStateIdempotent': true,
              'productionGateway': 'untouched'
            }
            | to_nice_json
          }}

    - name: Plan bounded post-promotion OpenClaw Doctor generation retention
      ansible.builtin.command:
        argv:
          - "{{ openclaw_doctor_rehearsal_retention_tool }}"
          - --family
          - doctor
          - --mode
          - plan
          - --output
          - "{{ openclaw_doctor_rehearsal_evidence_dir }}/doctor-retention-post-plan.json"
      register: openclaw_doctor_rehearsal_post_retention_plan
      changed_when: true

    - name: Require bounded post-promotion OpenClaw Doctor retention plan
      ansible.builtin.assert:
        that:
          - (openclaw_doctor_rehearsal_post_retention_plan.stdout | from_json).status == 'ok'
          - (openclaw_doctor_rehearsal_post_retention_plan.stdout | from_json).family == 'doctor'
          - >-
            (openclaw_doctor_rehearsal_post_retention_plan.stdout | from_json).selectedStamp
            == openclaw_doctor_rehearsal_stamp
        fail_msg: >-
          Post-promotion Doctor retention does not preserve the newly selected
          generation and its immediate rollback target.

    - name: Apply bounded post-promotion OpenClaw Doctor generation retention
      ansible.builtin.command:
        argv:
          - "{{ openclaw_doctor_rehearsal_retention_tool }}"
          - --family
          - doctor
          - --mode
          - apply
          - --plan
          - "{{ openclaw_doctor_rehearsal_evidence_dir }}/doctor-retention-post-plan.json"
          - --output
          - "{{ openclaw_doctor_rehearsal_evidence_dir }}/doctor-retention-post-result.json"
      register: openclaw_doctor_rehearsal_post_retention_result
      changed_when: >-
        (openclaw_doctor_rehearsal_post_retention_result.stdout | from_json).removedGenerationCount
        | int > 0

    - name: Require successful post-promotion OpenClaw Doctor retention
      ansible.builtin.assert:
        that:
          - (openclaw_doctor_rehearsal_post_retention_result.stdout | from_json).status == 'ok'
          - (openclaw_doctor_rehearsal_post_retention_result.stdout | from_json).family == 'doctor'
          - >-
            (openclaw_doctor_rehearsal_post_retention_result.stdout | from_json).selectedStamp
            == openclaw_doctor_rehearsal_stamp
        fail_msg: >-
          Post-promotion Doctor retention failed to leave only the selected
          generation and its immediate rollback target.
