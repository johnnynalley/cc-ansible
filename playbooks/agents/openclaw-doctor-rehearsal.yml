      loop:
        - openKeyedStore is only available for trusted plugins
        - Multiple state directories detected
        - contains plaintext secret-bearing config
        - Error initializing Qdrant
        - Memory search provider is set to
      loop_control:
        label: "{{ item }}"

    - name: Inspect managed plugin registry after OpenClaw Doctor
      ansible.builtin.command:
        argv: >-
          {{
            openclaw_doctor_rehearsal_transient_prefix
            + ['--unit=openclaw-doctor-registry-post-doctor-' + openclaw_doctor_rehearsal_stamp]
