    - name: Run first networkless OpenClaw Doctor migration pass
      ansible.builtin.command:
        argv: >-
          {{
            openclaw_doctor_rehearsal_transient_prefix
            + ['--unit=openclaw-doctor-pass1-' + openclaw_doctor_rehearsal_stamp]
            + openclaw_doctor_rehearsal_command_environment
            + [
                openclaw_doctor_rehearsal_runtime + '/bin/openclaw',
                'doctor', '--non-interactive', '--yes',
                '--no-workspace-suggestions'
              ]
          }}
      register: openclaw_doctor_rehearsal_pass1
      changed_when: true
      failed_when: false
      no_log: true

    - name: Preserve first OpenClaw Doctor output
      ansible.builtin.copy:
        dest: "{{ openclaw_doctor_rehearsal_evidence_dir }}/doctor-pass1.txt"
        owner: root
        group: root
        mode: "0600"
        content: >-
          {{ openclaw_doctor_rehearsal_pass1.stdout }}
          {{ openclaw_doctor_rehearsal_pass1.stderr }}
      no_log: true

    - name: Require successful first OpenClaw Doctor pass
      ansible.builtin.assert:
        that:
          - openclaw_doctor_rehearsal_pass1.rc == 0
        fail_msg: >-
          The first credential-free Doctor pass failed. Root-only output remains
