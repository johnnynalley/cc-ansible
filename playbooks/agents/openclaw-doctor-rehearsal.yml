    - name: Require resolved first-pass OpenClaw Doctor regressions
      ansible.builtin.assert:
        that:
          - >-
            item not in
            (
              openclaw_doctor_rehearsal_pass1.stdout
              + '\n'
              + openclaw_doctor_rehearsal_pass1.stderr
            )
        fail_msg: >-
          The first Doctor pass still contains a regression that this
          modernization is required to eliminate. Root-only output remains in
          the timestamped evidence directory.
      loop:
        - openKeyedStore is only available for trusted plugins
        - Multiple state directories detected
        - contains plaintext secret-bearing config
        - Error initializing Qdrant
        - Memory search provider is set to
      loop_control:
        label: "{{ item }}"

    - name: Capture OpenClaw Doctor first-pass evidence
      ansible.builtin.include_tasks: ../../tasks/openclaw-doctor-snapshot.yml
      vars:
        openclaw_doctor_snapshot_phase: after-pass1

