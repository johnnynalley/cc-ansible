      loop: "{{ range(0, openclaw_isolated_gateway_managed_plugins | length) | list }}"
      loop_control:
        label: "{{ openclaw_isolated_gateway_managed_plugins[item].id }}"

    - name: Record modernized OpenClaw plugin registry summary
      ansible.builtin.copy:
        dest: "{{ openclaw_doctor_rehearsal_evidence_dir }}/plugin-registry-after.json"
