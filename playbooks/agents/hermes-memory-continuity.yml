---
# yamllint disable rule:line-length
# Purpose: Convert OpenClaw LCM and Mem0 state into Astra's native Hermes profile.
# Hosts: hermes_hosts.
# Key vars: hermes_memory_continuity_*, hermes_lcm_*, hermes_mem0_*.
# Templates: templates/hermes/hermes-mem0.json.j2 and native Gateway units.
# Scripts: scripts/agents/hermes-mem0-qdrant-migrate.py.
# Validation: ansible-playbook playbooks/agents/hermes-memory-continuity.yml --syntax-check.

- name: Migrate Astra memory into native Hermes providers
  hosts: hermes_hosts
  become: true
  gather_facts: true

  vars:
    hermes_memory_continuity_id: >-
      {{ ansible_facts['date_time']['iso8601_basic_short'] }}-pre-memory-continuity
    hermes_memory_continuity_backup_dir: >-
      {{ hermes_memory_continuity_rollback_root }}/{{ hermes_memory_continuity_id }}
    hermes_memory_continuity_rollback_mount: /srv/live-rollbacks
    hermes_memory_continuity_rollback_origin: >-
      dataset=nas_zfs/backups/live-rollbacks
    hermes_memory_continuity_local_stage: >-
      /var/lib/hermes/bootstrap/memory-continuity/{{ hermes_memory_continuity_id }}
    hermes_memory_continuity_profile_backup_stage: >-
      /var/lib/hermes/astra/.{{ hermes_memory_continuity_id }}-astra-profile.zip
    hermes_memory_continuity_backup_paths:
      - /etc/hermes/astra/.env
      - /etc/hermes/astra/config.yaml
      - /etc/hermes/astra/managed-policy.sha256
      - /etc/systemd/system/hermes-gateway-astra.service.d/10-managed.conf
      - "/etc/systemd/system/{{ hermes_native_update_service }}"
      - "{{ hermes_star_privacy_validator_live }}"
      - "{{ hermes_docker_inventory_validator_live }}"
      - "{{ hermes_shadow_contract_live }}"
      - "{{ hermes_shadow_audit_live }}"
      - "{{ hermes_discord_contract_live }}"
      - "{{ hermes_discord_audit_live }}"
      - "{{ hermes_automation_contract_live }}"
      - "{{ hermes_automation_audit_live }}"
      - "{{ hermes_profile_data_contract_live }}"
      - "{{ hermes_profile_data_stager_live }}"
      - "{{ hermes_profile_transforms_contract_live }}"
      - "{{ hermes_profile_transformer_live }}"
      - >-
        /usr/local/share/hermes-shadow/repository/{{ hermes_shadow_contract_source }}
      - >-
        /usr/local/share/hermes-shadow/repository/files/hermes/openclaw-state-migration-contract.json
      - >-
        /usr/local/share/hermes-shadow/repository/{{ hermes_discord_contract_source }}
      - >-
        /usr/local/share/hermes-shadow/repository/files/hermes/profile-import-contract.json
      - >-
        /usr/local/share/hermes-shadow/repository/files/openclaw/workspace-migration-policy.json
      - "{{ hermes_mem0_config_live }}"
      - "{{ hermes_mem0_migrator_live }}"
    hermes_memory_continuity_paused_timers: >-
      {{ (hermes_automation_enabled_timers
          + [hermes_native_update_timer, hermes_tirith_update_timer])
         | unique
         | list }}
    hermes_memory_continuity_user_environment:
      XDG_RUNTIME_DIR: /run/user/1000
      DBUS_SESSION_BUS_ADDRESS: unix:path=/run/user/1000/bus

  tasks:
    - name: Validate Astra memory-continuity mode
      ansible.builtin.assert:
        that:
          - hermes_memory_continuity_mode in ['disabled', 'migrate']
        fail_msg: >-
          hermes_memory_continuity_mode must be disabled or migrate.

    - name: Skip hosts without Astra memory-continuity approval
      ansible.builtin.meta: end_host
      when: hermes_memory_continuity_mode == 'disabled'

    - name: Require exact Astra memory-continuity authorization
      ansible.builtin.assert:
        that:
          - hermes_memory_continuity_approved | bool
          - >-
            hermes_memory_continuity_confirmation
            == hermes_memory_continuity_required_confirmation
          - inventory_hostname == 'jn-t14s-lin'
          - hermes_lcm_source_database != hermes_lcm_target_database
          - hermes_mem0_source_collection != hermes_mem0_target_collection
          - hermes_mem0_source_user_ids | length == 3
          - hermes_mem0_user_id == 'johnny'
          - hermes_mem0_agent_id == 'astra'
        fail_msg: >-
          Memory continuity requires the exact host-scoped, source-preserving
          migration approval.

    - name: Discover official Hermes LCM release tags
      ansible.builtin.command:
        argv:
          - /usr/bin/git
          - ls-remote
          - --tags
          - --refs
          - "{{ hermes_lcm_repository }}"
      register: hermes_memory_continuity_lcm_release_tags
      changed_when: false
      check_mode: false

    - name: Select newest production-stable Hermes LCM release
      ansible.builtin.set_fact:
        hermes_memory_continuity_lcm_stable_tags: >-
          {{
            hermes_memory_continuity_lcm_release_tags.stdout
            | regex_findall(
                'refs/tags/(v[0-9]+\.[0-9]+\.[0-9]+)$',
                multiline=true
              )
            | community.general.version_sort
          }}

    - name: Require a supported stable Hermes LCM release policy
      ansible.builtin.assert:
        that:
          - hermes_lcm_release_track == 'stable'
          - hermes_memory_continuity_lcm_stable_tags | length > 0
          - >-
            (hermes_memory_continuity_lcm_stable_tags | last)
            is match('^v[0-9]+\.[0-9]+\.[0-9]+$')
        fail_msg: >-
          Hermes LCM must resolve from an official production-stable semantic
          version tag; branches and prerelease tags are not allowed.

    - name: Record resolved Hermes LCM stable release
      ansible.builtin.set_fact:
        hermes_memory_continuity_lcm_resolved_release: >-
          {{ hermes_memory_continuity_lcm_stable_tags | last }}

    - name: Inspect native memory migration prerequisites
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - "{{ hermes_lcm_source_database }}"
        - "{{ hermes_mem0_source_history_database }}"
        - "{{ hermes_shadow_runtime_root }}/pyproject.toml"
        - "{{ hermes_shadow_runtime_root }}/uv.lock"
        - "{{ hermes_shadow_uv_binary }}"
        - "{{ hermes_mem0_ollama_binary }}"
        - /var/lib/hermes/astra/.hermes/profiles/astra/config.yaml
        - /var/lib/hermes/dubble/.hermes/profiles/dubble/config.yaml
      register: hermes_memory_continuity_prerequisites
      check_mode: false

    - name: Require complete native memory migration prerequisites
      ansible.builtin.assert:
        that:
          - >-
            hermes_memory_continuity_prerequisites.results
            | map(attribute='stat.exists') | min
          - >-
            hermes_memory_continuity_prerequisites.results
            | map(attribute='stat.isreg', default=false) | min
        fail_msg: >-
          Native profile state, a source memory database, SQLite, uv, or the
          locked Hermes runtime is missing.

    - name: Inspect native Gateway lifecycle ownership
      ansible.builtin.command:
        argv:
          - /usr/bin/systemctl
          - show
          - "{{ item.unit }}"
          - --property=FragmentPath
          - --property=ExecStart
          - --property=Type
          - --property=User
      loop: "{{ hermes_production_consumer_profiles }}"
      register: hermes_memory_continuity_native_units
      changed_when: false
      check_mode: false

    - name: Require official native Hermes lifecycle units
      ansible.builtin.assert:
        that:
          - >-
            ('FragmentPath=/etc/systemd/system/' ~ item.item.unit)
            in item.stdout
          - "'Type=notify' in item.stdout"
          - "('User=' ~ item.item.user) in item.stdout"
          - "'hermes_cli.main' in item.stdout"
          - "('--profile ' ~ item.item.name ~ ' gateway run') in item.stdout"
        fail_msg: >-
          {{ item.item }} is not an official native Hermes lifecycle unit.
          Run the native Gateway migration first.
      loop: "{{ hermes_memory_continuity_native_units.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Require OpenClaw system delivery units offline
      ansible.builtin.command:
        argv:
          - /usr/bin/systemctl
          - is-active
          - "{{ item.name }}"
      loop: "{{ hermes_production_cutover_source_system_units }}"
      register: hermes_memory_continuity_openclaw_system
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Require OpenClaw user Gateway offline
      ansible.builtin.command:
        argv:
          - /usr/sbin/runuser
          - --user
          - "{{ hermes_production_cutover_user }}"
          - --
          - /usr/bin/env
          - XDG_RUNTIME_DIR=/run/user/1000
          - DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1000/bus
          - /usr/bin/systemctl
          - --user
          - is-active
          - "{{ hermes_production_cutover_user_gateway }}"
      register: hermes_memory_continuity_openclaw_user
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Reject memory migration while OpenClaw can write source state
      ansible.builtin.assert:
        that:
          - >-
            hermes_memory_continuity_openclaw_system.results
            | selectattr('stdout', 'equalto', 'active') | list | length == 0
          - hermes_memory_continuity_openclaw_user.stdout != 'active'

    - name: Inspect memory-continuity rollback filesystem
      ansible.builtin.command:
        argv:
          - /usr/bin/findmnt
          - --noheadings
          - --types
          - nfs,nfs4
          - --output
          - FSTYPE
          - --target
          - "{{ hermes_memory_continuity_rollback_mount }}"
      register: hermes_memory_continuity_rollback_filesystem
      changed_when: false
      check_mode: false

    - name: Verify memory-continuity rollback origin marker
      ansible.builtin.command:
        argv:
          - /usr/bin/grep
          - -Fx
          - "{{ hermes_memory_continuity_rollback_origin }}"
          - >-
            {{ hermes_memory_continuity_rollback_mount
               }}/.live-rollback-origin
      register: hermes_memory_continuity_rollback_marker
      changed_when: false
      check_mode: false

    - name: Inspect local memory-continuity staging filesystem
      ansible.builtin.command:
        argv:
          - /usr/bin/findmnt
          - --noheadings
          - --output
          - FSTYPE
          - --target
          - /var/lib/hermes/bootstrap
      register: hermes_memory_continuity_staging_filesystem
      changed_when: false
      check_mode: false

    - name: Inspect local memory-continuity staging headroom
      ansible.builtin.command:
        argv:
          - /usr/bin/df
          - --output=avail
          - --block-size=1
          - /var/lib/hermes/bootstrap
      register: hermes_memory_continuity_staging_headroom
      changed_when: false
      check_mode: false

    - name: Require independent local staging and managed NFS rollback storage
      ansible.builtin.assert:
        that:
          - >-
            hermes_memory_continuity_rollback_filesystem.stdout
            | trim in ['nfs', 'nfs4']
          - >-
            hermes_memory_continuity_rollback_marker.stdout
            | trim == hermes_memory_continuity_rollback_origin
          - hermes_memory_continuity_staging_filesystem.stdout | trim == 'ext4'
          - >-
            (hermes_memory_continuity_staging_headroom.stdout_lines[-1] | int)
            >
            (((hermes_memory_continuity_prerequisites.results[0].stat.size
               + hermes_memory_continuity_prerequisites.results[1].stat.size)
              * 2) + 4294967296)
        fail_msg: >-
          Memory continuity requires the managed ZFS-backed NFS rollback mount
          plus enough independent local ext4 space to stage and verify every
          database and archive before publication.

    - name: Inspect local Ollama model inventory
      ansible.builtin.uri:
        url: "{{ hermes_mem0_ollama_url }}/api/tags"
        method: GET
        return_content: true
        status_code: 200
      register: hermes_memory_continuity_ollama_inventory
      changed_when: false
      check_mode: false

    - name: Record pre-conversion local Ollama models
      ansible.builtin.set_fact:
        hermes_memory_continuity_prior_ollama_models: >-
          {{ hermes_memory_continuity_ollama_inventory.json.models
             | default([])
             | map(attribute='model', default='')
             | reject('equalto', '')
             | list }}

    - name: Inspect source, preserved, and target Mem0 collections
      ansible.builtin.uri:
        url: >-
          {{ hermes_mem0_qdrant_url }}/collections/{{ item }}
        method: GET
        return_content: false
        status_code:
          - 200
          - 404
      loop:
        - "{{ hermes_mem0_source_collection }}"
        - "{{ hermes_mem0_preserved_collection }}"
        - "{{ hermes_mem0_target_collection }}"
      register: hermes_memory_continuity_qdrant_collections
      changed_when: false
      check_mode: false

    - name: Require the OpenClaw Mem0 source and preserved v1 collection
      ansible.builtin.assert:
        that:
          - hermes_memory_continuity_qdrant_collections.results[0].status == 200
          - hermes_memory_continuity_qdrant_collections.results[1].status == 200

    - name: Stop after read-only memory-continuity check-mode preflight
      ansible.builtin.meta: end_host
      when: ansible_check_mode

    - name: Prepare verified source backups before memory conversion
      block:
        - name: Create private local memory-continuity staging directory
          ansible.builtin.file:
            path: "{{ hermes_memory_continuity_local_stage }}/files"
            state: directory
            owner: root
            group: root
            mode: "0700"

        - name: Create private memory-continuity rollback directory
          ansible.builtin.file:
            path: "{{ hermes_memory_continuity_backup_dir }}/files"
            state: directory
            owner: root
            group: root
            mode: "0700"

        - name: Inspect rollback-managed memory files
          ansible.builtin.stat:
            path: "{{ item }}"
            follow: false
          loop: "{{ hermes_memory_continuity_backup_paths }}"
          register: hermes_memory_continuity_prior_files
          check_mode: false

        - name: Stage existing rollback-managed memory files locally
          ansible.builtin.copy:
            src: "{{ item.item }}"
            dest: >-
              {{ hermes_memory_continuity_local_stage }}/files/{{ item.item | hash('sha256') }}
            remote_src: true
            owner: root
            group: root
            mode: "0600"
          loop: "{{ hermes_memory_continuity_prior_files.results }}"
          loop_control:
            label: "{{ item.item }}"
          when: item.stat.exists and item.stat.isreg

        - name: Publish rollback-managed memory files from local staging
          ansible.builtin.copy:
            src: >-
              {{ hermes_memory_continuity_local_stage }}/files/{{ item.item | hash('sha256') }}
            dest: >-
              {{ hermes_memory_continuity_backup_dir }}/files/{{ item.item | hash('sha256') }}
            remote_src: true
            owner: root
            group: root
            mode: "0600"
          loop: "{{ hermes_memory_continuity_prior_files.results }}"
          loop_control:
            label: "{{ item.item }}"
          when: item.stat.exists and item.stat.isreg

        - name: Create consistent OpenClaw SQLite backups on local ext4
          ansible.builtin.command:
            argv:
              - "{{ hermes_shadow_runtime_venv }}/bin/python"
              - -c
              - >-
                import sqlite3, sys;
                source = sqlite3.connect('file:' + sys.argv[1] + '?mode=ro', uri=True);
                target = sqlite3.connect(sys.argv[2]);
                source.backup(target);
                target.close(); source.close()
              - "{{ item.source }}"
              - "{{ hermes_memory_continuity_local_stage }}/{{ item.name }}"
          loop:
            - source: "{{ hermes_lcm_source_database }}"
              name: openclaw-lcm.db
            - source: "{{ hermes_mem0_source_history_database }}"
              name: openclaw-mem0-history.db
          loop_control:
            label: "{{ item.name }}"
          changed_when: true

        - name: Verify locally staged OpenClaw SQLite backups
          ansible.builtin.command:
            argv:
              - "{{ hermes_shadow_runtime_venv }}/bin/python"
              - -c
              - >-
                import sqlite3, sys;
                database = sqlite3.connect('file:' + sys.argv[1] + '?mode=ro', uri=True);
                result = database.execute('PRAGMA quick_check').fetchone()[0];
                database.close(); print(result);
                raise SystemExit(0 if result == 'ok' else 1)
              - "{{ hermes_memory_continuity_local_stage }}/{{ item }}"
          loop:
            - openclaw-lcm.db
            - openclaw-mem0-history.db
          loop_control:
            label: "{{ item }}"
          changed_when: false

        - name: Inspect Astra-owned profile backup staging path
          ansible.builtin.stat:
            path: "{{ hermes_memory_continuity_profile_backup_stage }}"
            follow: false
          register: hermes_memory_continuity_profile_backup_prior

        - name: Require unused Astra profile backup staging path
          ansible.builtin.assert:
            that:
              - not hermes_memory_continuity_profile_backup_prior.stat.exists

        - name: Create native backup in Astra-owned storage
          ansible.builtin.command:
            argv:
              - /usr/sbin/runuser
              - --user
              - hermes-astra
              - --
              - /usr/bin/env
              - HOME=/var/lib/hermes/astra
              - HERMES_HOME=/var/lib/hermes/astra/.hermes/profiles/astra
              - "{{ hermes_shadow_runtime_binary }}"
              - backup
              - --output
              - "{{ hermes_memory_continuity_profile_backup_stage }}"
          changed_when: true

        - name: Move Astra profile backup into local ext4 staging
          ansible.builtin.command:
            argv:
              - /usr/bin/mv
              - "{{ hermes_memory_continuity_profile_backup_stage }}"
              - "{{ hermes_memory_continuity_local_stage }}/astra-profile.zip"
          changed_when: true

        - name: Verify locally staged Astra profile backup archive
          ansible.builtin.command:
            argv:
              - "{{ hermes_shadow_runtime_venv }}/bin/python"
              - -c
              - >-
                import sys, zipfile;
                archive = zipfile.ZipFile(sys.argv[1]);
                bad = archive.testzip(); archive.close();
                raise SystemExit(1 if bad else 0)
              - "{{ hermes_memory_continuity_local_stage }}/astra-profile.zip"
          changed_when: false

        - name: Define verified source backup artifacts
          ansible.builtin.set_fact:
            hermes_memory_continuity_source_artifacts:
              - name: openclaw-lcm.db
                local: "{{ hermes_memory_continuity_local_stage }}/openclaw-lcm.db"
                remote: "{{ hermes_memory_continuity_backup_dir }}/openclaw-lcm.db"
              - name: openclaw-mem0-history.db
                local: "{{ hermes_memory_continuity_local_stage }}/openclaw-mem0-history.db"
                remote: "{{ hermes_memory_continuity_backup_dir }}/openclaw-mem0-history.db"
              - name: astra-profile.zip
                local: "{{ hermes_memory_continuity_local_stage }}/astra-profile.zip"
                remote: "{{ hermes_memory_continuity_backup_dir }}/astra-profile.zip"

        - name: Copy completed source artifacts to NFS partial paths
          ansible.builtin.command:
            argv:
              - /usr/bin/cp
              - --sparse=always
              - "{{ item.local }}"
              - "{{ item.remote }}.partial"
          loop: "{{ hermes_memory_continuity_source_artifacts }}"
          loop_control:
            label: "{{ item.name }}"
          changed_when: true

        - name: Flush source artifact copies to rollback storage
          ansible.builtin.command:
            argv:
              - /usr/bin/sync
              - --file-system
              - "{{ item.remote }}.partial"
          loop: "{{ hermes_memory_continuity_source_artifacts }}"
          loop_control:
            label: "{{ item.name }}"
          changed_when: false

        - name: Hash locally staged source artifacts
          ansible.builtin.command:
            argv:
              - /usr/bin/sha256sum
              - "{{ item.local }}"
          loop: "{{ hermes_memory_continuity_source_artifacts }}"
          loop_control:
            label: "{{ item.name }}"
          register: hermes_memory_continuity_source_local_hashes
          changed_when: false

        - name: Hash NFS source artifact copies
          ansible.builtin.command:
            argv:
              - /usr/bin/sha256sum
              - "{{ item.remote }}.partial"
          loop: "{{ hermes_memory_continuity_source_artifacts }}"
          loop_control:
            label: "{{ item.name }}"
          register: hermes_memory_continuity_source_remote_hashes
          changed_when: false

        - name: Require exact source artifact copies before publication
          ansible.builtin.assert:
            that:
              - >-
                hermes_memory_continuity_source_local_hashes.results[item].stdout.split()[0]
                ==
                hermes_memory_continuity_source_remote_hashes.results[item].stdout.split()[0]
          loop: >-
            {{ range(0, hermes_memory_continuity_source_artifacts | length) | list }}
          loop_control:
            label: "{{ hermes_memory_continuity_source_artifacts[item].name }}"

        - name: Publish verified source artifacts atomically
          ansible.builtin.command:
            argv:
              - /usr/bin/mv
              - "{{ item.remote }}.partial"
              - "{{ item.remote }}"
          loop: "{{ hermes_memory_continuity_source_artifacts }}"
          loop_control:
            label: "{{ item.name }}"
          changed_when: true

        - name: Restrict retained source backup artifacts
          ansible.builtin.file:
            path: "{{ item.remote }}"
            owner: root
            group: root
            mode: "0600"
          loop: "{{ hermes_memory_continuity_source_artifacts }}"
          loop_control:
            label: "{{ item.name }}"

      rescue:
        - name: Remove incomplete Astra-owned profile backup staging file
          ansible.builtin.file:
            path: "{{ hermes_memory_continuity_profile_backup_stage }}"
            state: absent

        - name: Remove incomplete NFS source artifact partials
          ansible.builtin.file:
            path: "{{ item.remote }}.partial"
            state: absent
          loop: "{{ hermes_memory_continuity_source_artifacts | default([]) }}"
          loop_control:
            label: "{{ item.name }}"
          failed_when: false

        - name: Remove failed local source-backup staging tree
          ansible.builtin.file:
            path: "{{ hermes_memory_continuity_local_stage }}"
            state: absent

        - name: Stop after source backup preparation failure
          ansible.builtin.fail:
            msg: >-
              Source backup preparation failed before any Gateway or timer
              interruption. The rollback directory was preserved for review
              and local incomplete staging was removed.

    - name: Validate retained Astra provider credentials before interruption
      block:
        - name: Read retained Astra provider credentials privately
          ansible.builtin.slurp:
            src: "{{ hermes_production_cutover_source_env }}"
          register: hermes_memory_continuity_source_environment
          no_log: true

        - name: Require complete retained Astra provider credentials
          ansible.builtin.assert:
            that:
              - hermes_memory_continuity_credentials | length == 1
              - hermes_memory_continuity_credentials[0] | length > 0
          loop:
            - OLLAMA_API_KEY
            - EBAY_APP_ID
            - EBAY_CERT_ID
          vars:
            hermes_memory_continuity_credentials: >-
              {{
                hermes_memory_continuity_source_environment.content
                | b64decode
                | regex_findall('(?m)^' ~ item ~ '=([^\r\n]+)$')
              }}
          no_log: true

      rescue:
        - name: Remove local staging after provider credential failure
          ansible.builtin.file:
            path: "{{ hermes_memory_continuity_local_stage }}"
            state: absent

        - name: Stop before interruption when provider credentials are incomplete
          ansible.builtin.fail:
            msg: >-
              Retained Astra provider credentials are incomplete. Verified
              source backups remain in {{ hermes_memory_continuity_backup_dir }},
              local staging was removed, and no Gateway or timer was interrupted.

    - name: Inspect timer state before memory conversion
      ansible.builtin.command:
        argv:
          - /usr/bin/systemctl
          - is-active
          - "{{ item }}"
      loop: "{{ hermes_memory_continuity_paused_timers }}"
      register: hermes_memory_continuity_timer_state
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Inspect Gateway state before memory conversion
      ansible.builtin.command:
        argv:
          - /usr/bin/systemctl
          - is-active
          - "{{ item.unit }}"
      loop: "{{ hermes_production_consumer_profiles }}"
      loop_control:
        label: "{{ item.name }}"
      register: hermes_memory_continuity_gateway_state
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Initialize fail-closed prior-state publication gate
      ansible.builtin.set_fact:
        hermes_memory_continuity_prior_state_published: false

    - name: Convert Astra memory in one rollback transaction
      block:
        - name: Pause Hermes timers during memory conversion
          ansible.builtin.systemd_service:
            name: "{{ item.item }}"
            state: stopped
          loop: "{{ hermes_memory_continuity_timer_state.results }}"
          loop_control:
            label: "{{ item.item }}"
          when: item.stdout == 'active'

        - name: Prepare service-owned markers for memory conversion stops
          ansible.builtin.include_tasks: ../../tasks/hermes-planned-stop-marker.yml
          vars:
            hermes_planned_stop_profile: "{{ item.item }}"
          loop: "{{ hermes_memory_continuity_gateway_state.results }}"
          loop_control:
            label: "{{ item.item.name }}"
          when: item.stdout == 'active'

        - name: Stop active native Gateways once for shared runtime conversion
          ansible.builtin.command:
            argv:
              - "{{ hermes_shadow_runtime_binary }}"
              - gateway
              - stop
              - --system
          environment:
            HOME: "{{ item.item.account_home }}"
            HERMES_HOME: "{{ item.item.home }}"
            HERMES_MANAGED_DIR: "/etc/hermes/{{ item.item.name }}"
          loop: "{{ hermes_memory_continuity_gateway_state.results }}"
          loop_control:
            label: "{{ item.item.name }}"
          when: item.stdout == 'active'
          changed_when: true

        - name: Inspect prior LCM target database
          ansible.builtin.stat:
            path: "{{ hermes_lcm_target_database }}"
            follow: false
          register: hermes_memory_continuity_prior_lcm

        - name: Inspect prior LCM externalized-output tree
          ansible.builtin.stat:
            path: "{{ hermes_lcm_externalized_output_root }}"
            follow: false
          register: hermes_memory_continuity_prior_lcm_outputs

        - name: Reject orphaned LCM externalized-output state
          ansible.builtin.assert:
            that:
              - >-
                not hermes_memory_continuity_prior_lcm_outputs.stat.exists
                or hermes_memory_continuity_prior_lcm.stat.exists
            fail_msg: >-
              The LCM externalized-output tree exists without its target
              database. Preserve and remove it before retrying migration.

        - name: Inspect prior managed LCM plugin
          ansible.builtin.stat:
            path: "{{ hermes_lcm_plugin_managed_root }}"
            follow: false
          register: hermes_memory_continuity_prior_lcm_plugin

        - name: Back up prior LCM target database on local ext4
          ansible.builtin.command:
            argv:
              - "{{ hermes_shadow_runtime_venv }}/bin/python"
              - -c
              - >-
                import sqlite3, sys;
                source = sqlite3.connect('file:' + sys.argv[1] + '?mode=ro', uri=True);
                target = sqlite3.connect(sys.argv[2]);
                source.backup(target);
                target.close(); source.close()
              - "{{ hermes_lcm_target_database }}"
              - "{{ hermes_memory_continuity_local_stage }}/prior-hermes-lcm.db"
          when: hermes_memory_continuity_prior_lcm.stat.exists
          changed_when: true

        - name: Verify prior LCM target backup on local ext4
          ansible.builtin.command:
            argv:
              - "{{ hermes_shadow_runtime_venv }}/bin/python"
              - -c
              - >-
                import sqlite3, sys;
                database = sqlite3.connect('file:' + sys.argv[1] + '?mode=ro', uri=True);
                result = database.execute('PRAGMA quick_check').fetchone()[0];
                database.close(); print(result);
                raise SystemExit(0 if result == 'ok' else 1)
              - "{{ hermes_memory_continuity_local_stage }}/prior-hermes-lcm.db"
          when: hermes_memory_continuity_prior_lcm.stat.exists
          changed_when: false

        - name: Back up prior LCM trees on local ext4
          ansible.builtin.command:
            argv:
              - /usr/bin/tar
              - --sparse
              - -C
              - "{{ item.source | dirname }}"
              - -cpf
              - "{{ hermes_memory_continuity_local_stage }}/{{ item.name }}"
              - "{{ item.source | basename }}"
          loop:
            - source: "{{ hermes_lcm_externalized_output_root }}"
              name: prior-hermes-lcm-large-outputs.tar
              exists: "{{ hermes_memory_continuity_prior_lcm_outputs.stat.exists }}"
            - source: "{{ hermes_lcm_plugin_managed_root }}"
              name: prior-hermes-lcm-plugin.tar
              exists: "{{ hermes_memory_continuity_prior_lcm_plugin.stat.exists }}"
          loop_control:
            label: "{{ item.name }}"
          when: item.exists | bool
          changed_when: true

        - name: Verify prior LCM tree archives on local ext4
          ansible.builtin.command:
            argv:
              - /usr/bin/tar
              - -tf
              - "{{ hermes_memory_continuity_local_stage }}/{{ item.name }}"
          loop:
            - name: prior-hermes-lcm-large-outputs.tar
              exists: "{{ hermes_memory_continuity_prior_lcm_outputs.stat.exists }}"
            - name: prior-hermes-lcm-plugin.tar
              exists: "{{ hermes_memory_continuity_prior_lcm_plugin.stat.exists }}"
          loop_control:
            label: "{{ item.name }}"
          when: item.exists | bool
          changed_when: false

        - name: Define prior-state backup artifacts
          ansible.builtin.set_fact:
            hermes_memory_continuity_prior_artifacts: >-
              {{
                ([{'name': 'prior-hermes-lcm.db'}]
                 if hermes_memory_continuity_prior_lcm.stat.exists else [])
                + ([{'name': 'prior-hermes-lcm-large-outputs.tar'}]
                   if hermes_memory_continuity_prior_lcm_outputs.stat.exists else [])
                + ([{'name': 'prior-hermes-lcm-plugin.tar'}]
                   if hermes_memory_continuity_prior_lcm_plugin.stat.exists else [])
              }}

        - name: Copy completed prior-state artifacts to NFS partial paths
          ansible.builtin.command:
            argv:
              - /usr/bin/cp
              - --sparse=always
              - "{{ hermes_memory_continuity_local_stage }}/{{ item.name }}"
              - "{{ hermes_memory_continuity_backup_dir }}/{{ item.name }}.partial"
          loop: "{{ hermes_memory_continuity_prior_artifacts }}"
          loop_control:
            label: "{{ item.name }}"
          changed_when: true

        - name: Flush prior-state artifact copies to rollback storage
          ansible.builtin.command:
            argv:
              - /usr/bin/sync
              - --file-system
              - "{{ hermes_memory_continuity_backup_dir }}/{{ item.name }}.partial"
          loop: "{{ hermes_memory_continuity_prior_artifacts }}"
          loop_control:
            label: "{{ item.name }}"
          changed_when: false

        - name: Hash locally staged prior-state artifacts
          ansible.builtin.command:
            argv:
              - /usr/bin/sha256sum
              - "{{ hermes_memory_continuity_local_stage }}/{{ item.name }}"
          loop: "{{ hermes_memory_continuity_prior_artifacts }}"
          loop_control:
            label: "{{ item.name }}"
          register: hermes_memory_continuity_prior_local_hashes
          changed_when: false

        - name: Hash NFS prior-state artifact copies
          ansible.builtin.command:
            argv:
              - /usr/bin/sha256sum
              - "{{ hermes_memory_continuity_backup_dir }}/{{ item.name }}.partial"
          loop: "{{ hermes_memory_continuity_prior_artifacts }}"
          loop_control:
            label: "{{ item.name }}"
          register: hermes_memory_continuity_prior_remote_hashes
          changed_when: false

        - name: Require exact prior-state artifact copies before publication
          ansible.builtin.assert:
            that:
              - >-
                hermes_memory_continuity_prior_local_hashes.results[item].stdout.split()[0]
                ==
                hermes_memory_continuity_prior_remote_hashes.results[item].stdout.split()[0]
          loop: >-
            {{ range(0, hermes_memory_continuity_prior_artifacts | length) | list }}

        - name: Publish verified prior-state artifacts atomically
          ansible.builtin.command:
            argv:
              - /usr/bin/mv
              - "{{ hermes_memory_continuity_backup_dir }}/{{ item.name }}.partial"
              - "{{ hermes_memory_continuity_backup_dir }}/{{ item.name }}"
          loop: "{{ hermes_memory_continuity_prior_artifacts }}"
          loop_control:
            label: "{{ item.name }}"
          changed_when: true

        - name: Restrict retained prior-state backup artifacts
          ansible.builtin.file:
            path: "{{ hermes_memory_continuity_backup_dir }}/{{ item.name }}"
            owner: root
            group: root
            mode: "0600"
          loop: "{{ hermes_memory_continuity_prior_artifacts }}"
          loop_control:
            label: "{{ item.name }}"

        - name: Hash published prior-state artifacts
          ansible.builtin.command:
            argv:
              - /usr/bin/sha256sum
              - "{{ hermes_memory_continuity_backup_dir }}/{{ item.name }}"
          loop: "{{ hermes_memory_continuity_prior_artifacts }}"
          loop_control:
            label: "{{ item.name }}"
          register: hermes_memory_continuity_prior_published_hashes
          changed_when: false

        - name: Require exact published prior-state artifacts
          ansible.builtin.assert:
            that:
              - >-
                hermes_memory_continuity_prior_local_hashes.results[item].stdout.split()[0]
                ==
                hermes_memory_continuity_prior_published_hashes.results[item].stdout.split()[0]
          loop: >-
            {{ range(0, hermes_memory_continuity_prior_artifacts | length) | list }}

        - name: Verify published prior LCM database integrity
          ansible.builtin.command:
            argv:
              - "{{ hermes_shadow_runtime_venv }}/bin/python"
              - -c
              - >-
                import sqlite3, sys;
                database = sqlite3.connect('file:' + sys.argv[1] + '?mode=ro', uri=True);
                result = database.execute('PRAGMA quick_check').fetchone()[0];
                database.close(); print(result);
                raise SystemExit(0 if result == 'ok' else 1)
              - >-
                {{ hermes_memory_continuity_backup_dir }}/prior-hermes-lcm.db
          when: hermes_memory_continuity_prior_lcm.stat.exists
          changed_when: false

        - name: Verify published prior LCM tree archives
          ansible.builtin.command:
            argv:
              - /usr/bin/tar
              - -tf
              - "{{ hermes_memory_continuity_backup_dir }}/{{ item.name }}"
          loop:
            - name: prior-hermes-lcm-large-outputs.tar
              exists: "{{ hermes_memory_continuity_prior_lcm_outputs.stat.exists }}"
            - name: prior-hermes-lcm-plugin.tar
              exists: "{{ hermes_memory_continuity_prior_lcm_plugin.stat.exists }}"
          loop_control:
            label: "{{ item.name }}"
          when: item.exists | bool
          changed_when: false

        - name: Mark prior-state artifacts safe for rollback
          ansible.builtin.set_fact:
            hermes_memory_continuity_prior_state_published: true

        - name: Install or update managed Hermes LCM release track
          ansible.builtin.git:
            repo: "{{ hermes_lcm_repository }}"
            dest: "{{ hermes_lcm_plugin_managed_root }}"
            version: "{{ hermes_memory_continuity_lcm_resolved_release }}"
            update: true
            force: false

        - name: Read deployed Hermes LCM revision
          ansible.builtin.command:
            argv:
              - /usr/bin/git
              - -C
              - "{{ hermes_lcm_plugin_managed_root }}"
              - rev-parse
              - HEAD
          register: hermes_memory_continuity_lcm_revision
          changed_when: false

        - name: Require Hermes LCM plugin and importer entrypoints
          ansible.builtin.stat:
            path: "{{ item }}"
            follow: false
          loop:
            - "{{ hermes_lcm_plugin_managed_root }}/plugin.yaml"
            - >-
              {{ hermes_lcm_plugin_managed_root }}/{{
                hermes_lcm_external_importer_components | join('/') }}
          register: hermes_memory_continuity_lcm_entrypoints
          failed_when: >-
            not hermes_memory_continuity_lcm_entrypoints.stat.exists
            or not hermes_memory_continuity_lcm_entrypoints.stat.isreg

        - name: Synchronize official locked Hermes Mem0 dependency
          ansible.builtin.command:
            argv:
              - "{{ hermes_shadow_uv_binary }}"
              - sync
              - --extra
              - all
              - --extra
              - messaging
              - --extra
              - mem0
              - --extra
              - edge-tts
              - --locked
          args:
            chdir: "{{ hermes_shadow_runtime_root }}"
          environment:
            HOME: /var/lib/hermes/bootstrap
            HERMES_HOME: /var/lib/hermes/bootstrap
            XDG_CONFIG_HOME: "{{ hermes_shadow_uv_config_home }}"
            XDG_CONFIG_DIRS: "{{ hermes_shadow_uv_config_dirs }}"
            UV_CACHE_DIR: "{{ hermes_shadow_uv_cache_dir }}"
            UV_NO_ENV_FILE: "1"
            UV_PROJECT_ENVIRONMENT: "{{ hermes_shadow_runtime_venv }}"
            UV_PYTHON_INSTALL_DIR: /usr/local/share/uv/python
            UV_PYTHON_BIN_DIR: /usr/local/share/uv/bin
          changed_when: true

        - name: Inspect prior Mem0 Ollama client dependency
          ansible.builtin.command:
            argv:
              - "{{ hermes_shadow_runtime_venv }}/bin/python"
              - -c
              - >-
                import importlib.util;
                print('present' if importlib.util.find_spec('ollama') else 'absent')
          register: hermes_memory_continuity_prior_ollama_dependency
          changed_when: false

        - name: Install supported Mem0 Ollama client dependency
          ansible.builtin.command:
            argv:
              - "{{ hermes_shadow_uv_binary }}"
              - pip
              - install
              - --strict
              - --python
              - "{{ hermes_shadow_runtime_venv }}/bin/python"
              - "{{ hermes_mem0_ollama_dependency }}"
          environment:
            HOME: /var/lib/hermes/bootstrap
            XDG_CONFIG_HOME: "{{ hermes_shadow_uv_config_home }}"
            XDG_CONFIG_DIRS: "{{ hermes_shadow_uv_config_dirs }}"
            UV_CACHE_DIR: "{{ hermes_shadow_uv_cache_dir }}"
            UV_NO_ENV_FILE: "1"
          changed_when: true
          when: hermes_memory_continuity_prior_ollama_dependency.stdout == 'absent'

        - name: Validate Mem0 Ollama client dependency before conversion
          ansible.builtin.command:
            argv:
              - "{{ hermes_shadow_runtime_venv }}/bin/python"
              - -c
              - import ollama
          changed_when: false

        - name: Pull missing local Mem0 models
          ansible.builtin.command:
            argv:
              - "{{ hermes_mem0_ollama_binary }}"
              - pull
              - "{{ item }}"
          loop:
            - "{{ hermes_mem0_ollama_llm_model }}"
            - "{{ hermes_mem0_ollama_embedding_model }}"
          loop_control:
            label: "{{ item }}"
          when: item not in hermes_memory_continuity_prior_ollama_models
          changed_when: true

        - name: Validate local Mem0 model availability
          ansible.builtin.command:
            argv:
              - "{{ hermes_mem0_ollama_binary }}"
              - show
              - "{{ item }}"
          loop:
            - "{{ hermes_mem0_ollama_llm_model }}"
            - "{{ hermes_mem0_ollama_embedding_model }}"
          loop_control:
            label: "{{ item }}"
          changed_when: false

        - name: Validate Hermes Python package compatibility before conversion
          ansible.builtin.command:
            argv:
              - "{{ hermes_shadow_uv_binary }}"
              - pip
              - check
              - --python
              - "{{ hermes_shadow_runtime_venv }}/bin/python"
          changed_when: false

        - name: Deploy source-preserving Mem0 Qdrant migrator
          ansible.builtin.copy:
            src: "{{ ansible_config_file | dirname }}/{{ hermes_mem0_migrator_source }}"
            dest: "{{ hermes_mem0_migrator_live }}"
            owner: root
            group: root
            mode: "0755"

        - name: Create Astra runtime plugin mountpoint
          ansible.builtin.file:
            path: >-
              /var/lib/hermes/astra/.hermes/profiles/astra/plugins/hermes-lcm
            state: directory
            owner: hermes-astra
            group: hermes-astra
            mode: "0700"

        - name: Dry-run OpenClaw LCM conversion
          ansible.builtin.command:
            argv:
              - "{{ hermes_shadow_runtime_venv }}/bin/python"
              - >-
                {{ hermes_lcm_plugin_managed_root }}/{{
                  hermes_lcm_external_importer_components | join('/') }}
              - --source-db
              - "{{ hermes_memory_continuity_backup_dir }}/openclaw-lcm.db"
              - --target-db
              - "{{ hermes_lcm_target_database }}"
              - --namespace
              - openclaw-lcm
              - --agent
              - astra
              - --include-summaries
              - --json
          register: hermes_memory_continuity_lcm_dry_run
          changed_when: false

        - name: Require clean and useful LCM dry-run conversion
          ansible.builtin.assert:
            that:
              - >-
                (hermes_memory_continuity_lcm_dry_run.stdout | from_json)
                .invalid_rows == 0
              - >-
                (hermes_memory_continuity_lcm_dry_run.stdout | from_json)
                .warnings | length == 0
              - >-
                (hermes_memory_continuity_lcm_dry_run.stdout | from_json)
                .eligible > 100000
              - >-
                (hermes_memory_continuity_lcm_dry_run.stdout | from_json)
                .summaries_would_import > 4000

        - name: Apply idempotent OpenClaw LCM conversion
          ansible.builtin.command:
            argv:
              - "{{ hermes_shadow_runtime_venv }}/bin/python"
              - >-
                {{ hermes_lcm_plugin_managed_root }}/{{
                  hermes_lcm_external_importer_components | join('/') }}
              - --source-db
              - "{{ hermes_memory_continuity_backup_dir }}/openclaw-lcm.db"
              - --target-db
              - "{{ hermes_lcm_target_database }}"
              - --namespace
              - openclaw-lcm
              - --agent
              - astra
              - --include-summaries
              - --json
              - --apply
          register: hermes_memory_continuity_lcm_apply
          changed_when: >-
            (hermes_memory_continuity_lcm_apply.stdout | from_json).imported > 0
            or
            (hermes_memory_continuity_lcm_apply.stdout | from_json)
            .summaries_imported > 0

        - name: Secure imported Hermes LCM database
          ansible.builtin.file:
            path: "{{ hermes_lcm_target_database }}"
            owner: hermes-astra
            group: hermes-astra
            mode: "0600"

        - name: Secure imported Hermes LCM externalized outputs
          ansible.builtin.file:
            path: "{{ hermes_lcm_externalized_output_root }}"
            state: directory
            owner: hermes-astra
            group: hermes-astra
            mode: "0700"
            recurse: true

        - name: Dry-run Astra-only Mem0 vector conversion
          ansible.builtin.command:
            argv: >-
              {{
                [hermes_mem0_migrator_live,
                 '--qdrant-url', hermes_mem0_qdrant_url,
                 '--source', hermes_mem0_source_collection,
                 '--target', hermes_mem0_target_collection,
                 '--user-id', hermes_mem0_user_id,
                 '--agent-id', hermes_mem0_agent_id,
                 '--reembed',
                 '--ollama-url', hermes_mem0_ollama_url,
                 '--embedding-model', hermes_mem0_ollama_embedding_model,
                 '--embedding-dimensions',
                 hermes_mem0_ollama_embedding_dimensions | string]
                + (hermes_mem0_source_user_ids
                   | map('regex_replace', '^', '--include-user-id=')
                   | list)
              }}
          register: hermes_memory_continuity_mem0_dry_run
          changed_when: false

        - name: Require exact Astra-only Mem0 conversion boundary
          ansible.builtin.assert:
            that:
              - >-
                (hermes_memory_continuity_mem0_dry_run.stdout | from_json).status
                in ['ready', 'already-migrated']
              - >-
                (hermes_memory_continuity_mem0_dry_run.stdout | from_json)
                .sourceCount == 4435
              - >-
                (hermes_memory_continuity_mem0_dry_run.stdout | from_json)
                .selectedCount == 4148
              - >-
                (hermes_memory_continuity_mem0_dry_run.stdout | from_json)
                .excludedCount == 287
              - >-
                (hermes_memory_continuity_mem0_dry_run.stdout | from_json)
                .embeddingModel == hermes_mem0_ollama_embedding_model
              - >-
                (hermes_memory_continuity_mem0_dry_run.stdout | from_json)
                .embeddingDimensions
                == hermes_mem0_ollama_embedding_dimensions

        - name: Apply source-preserving Astra Mem0 vector conversion
          ansible.builtin.command:
            argv: >-
              {{
                [hermes_mem0_migrator_live,
                 '--qdrant-url', hermes_mem0_qdrant_url,
                 '--source', hermes_mem0_source_collection,
                 '--target', hermes_mem0_target_collection,
                 '--user-id', hermes_mem0_user_id,
                 '--agent-id', hermes_mem0_agent_id,
                 '--reembed',
                 '--ollama-url', hermes_mem0_ollama_url,
                 '--embedding-model', hermes_mem0_ollama_embedding_model,
                 '--embedding-dimensions',
                 hermes_mem0_ollama_embedding_dimensions | string,
                 '--apply']
                + (hermes_mem0_source_user_ids
                   | map('regex_replace', '^', '--include-user-id=')
                   | list)
              }}
          register: hermes_memory_continuity_mem0_apply
          changed_when: >-
            (hermes_memory_continuity_mem0_apply.stdout | from_json).status
            == 'migrated'

        - name: Render Astra Mem0 OSS configuration
          ansible.builtin.template:
            src: >-
              {{ playbook_dir }}/../../templates/hermes/{{ hermes_mem0_config_template }}
            dest: "{{ hermes_mem0_config_live }}"
            owner: hermes-astra
            group: hermes-astra
            mode: "0600"
          vars:
            hermes_mem0_render_collection: "{{ hermes_mem0_target_collection }}"

        - name: Enroll Astra provider credentials and compatibility aliases
          ansible.builtin.lineinfile:
            path: /etc/hermes/astra/.env
            regexp: "^{{ item.target }}="
            line: >-
              {{ item.target }}={{
                (
                  hermes_memory_continuity_source_environment.content
                  | b64decode
                  | regex_findall('(?m)^' ~ item.source ~ '=([^\r\n]+)$')
                )[0]
              }}
            owner: root
            group: hermes-astra
            mode: "0440"
          loop:
            - {target: OLLAMA_API_KEY, source: OLLAMA_API_KEY}
            - {target: EBAY_APP_ID, source: EBAY_APP_ID}
            - {target: EBAY_CERT_ID, source: EBAY_CERT_ID}
          no_log: true

        - name: Deploy current memory-dependent Hermes policy graph
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/../../{{ item.source }}"
            dest: "{{ item.destination }}"
            owner: root
            group: root
            mode: "{{ item.mode }}"
          loop: "{{ hermes_memory_continuity_policy_files }}"
          loop_control:
            label: "{{ item.destination }}"

        - name: Validate deployed Hermes target policy
          ansible.builtin.command:
            argv:
              - "{{ hermes_shadow_audit_live }}"
              - "{{ hermes_shadow_contract_live }}"
          changed_when: false

        - name: Validate deployed Hermes Discord policy graph
          ansible.builtin.command:
            argv:
              - "{{ hermes_discord_audit_live }}"
              - "{{ hermes_discord_contract_live }}"
              - --repository-root
              - /usr/local/share/hermes-shadow/repository
          changed_when: false

        - name: Validate deployed Hermes automation policy graph
          ansible.builtin.command:
            argv:
              - "{{ hermes_automation_audit_live }}"
              - "{{ hermes_automation_contract_live }}"
              - --repository-root
              - /usr/local/share/hermes-shadow/repository
          changed_when: false

        - name: Deploy Astra native local-tool and memory policy
          ansible.builtin.template:
            src: >-
              {{ playbook_dir }}/../../templates/hermes/hermes-managed-config.yaml.j2
            dest: /etc/hermes/astra/config.yaml
            owner: root
            group: hermes-astra
            mode: "0440"
          vars:
            hermes_profile: "{{ hermes_shadow_profiles[0] }}"

        - name: Refresh Astra managed-policy checksum
          ansible.builtin.command:
            argv:
              - /usr/bin/sha256sum
              - /etc/hermes/astra/config.yaml
              - /etc/hermes/astra/.env
          register: hermes_memory_continuity_managed_checksum
          changed_when: false
          no_log: true

        - name: Install Astra managed-policy checksum
          ansible.builtin.copy:
            content: "{{ hermes_memory_continuity_managed_checksum.stdout }}\n"
            dest: /etc/hermes/astra/managed-policy.sha256
            owner: root
            group: hermes-astra
            mode: "0440"
          no_log: true

        - name: Deploy memory-aware native Gateway hardening
          ansible.builtin.template:
            src: >-
              {{ playbook_dir }}/../../templates/hermes/hermes-gateway-hardening.conf.j2
            dest: >-
              /etc/systemd/system/hermes-gateway-astra.service.d/10-managed.conf
            owner: root
            group: root
            mode: "0644"
          vars:
            hermes_profile: "{{ hermes_shadow_profiles[0] }}"

        - name: Deploy Mem0-preserving native update unit
          ansible.builtin.template:
            src: >-
              {{ playbook_dir }}/../../templates/hermes/hermes-native-update.service.j2
            dest: "/etc/systemd/system/{{ hermes_native_update_service }}"
            owner: root
            group: root
            mode: "0644"

        - name: Reload memory-aware native units
          ansible.builtin.systemd_service:
            daemon_reload: true

        - name: Start production Gateways after one memory conversion outage
          ansible.builtin.systemd_service:
            name: "{{ item.item.unit }}"
            state: started
          loop: "{{ hermes_memory_continuity_gateway_state.results }}"
          loop_control:
            label: "{{ item.item.name }}"
          when: item.stdout == 'active'

        - name: Require previously active production Gateways active
          ansible.builtin.command:
            argv:
              - /usr/bin/systemctl
              - is-active
              - "{{ item.item.unit }}"
          loop: "{{ hermes_memory_continuity_gateway_state.results }}"
          loop_control:
            label: "{{ item.item.name }}"
          when: item.stdout == 'active'
          changed_when: false

        - name: Verify imported Hermes LCM database integrity
          ansible.builtin.command:
            argv:
              - "{{ hermes_shadow_runtime_venv }}/bin/python"
              - -c
              - >-
                import sqlite3, sys;
                database = sqlite3.connect(
                'file:' + sys.argv[1] + '?mode=ro', uri=True);
                result = database.execute('PRAGMA quick_check').fetchone()[0];
                database.close(); print(result);
                raise SystemExit(0 if result == 'ok' else 1)
              - "{{ hermes_lcm_target_database }}"
          register: hermes_memory_continuity_lcm_integrity
          changed_when: false
          failed_when: hermes_memory_continuity_lcm_integrity.stdout != 'ok'

        - name: Reconcile final Mem0 source and target digests
          ansible.builtin.command:
            argv: >-
              {{
                [hermes_mem0_migrator_live,
                 '--qdrant-url', hermes_mem0_qdrant_url,
                 '--source', hermes_mem0_source_collection,
                 '--target', hermes_mem0_target_collection,
                 '--user-id', hermes_mem0_user_id,
                 '--agent-id', hermes_mem0_agent_id,
                 '--reembed',
                 '--ollama-url', hermes_mem0_ollama_url,
                 '--embedding-model', hermes_mem0_ollama_embedding_model,
                 '--embedding-dimensions',
                 hermes_mem0_ollama_embedding_dimensions | string]
                + (hermes_mem0_source_user_ids
                   | map('regex_replace', '^', '--include-user-id=')
                   | list)
              }}
          register: hermes_memory_continuity_mem0_final
          changed_when: false
          failed_when: >-
            (hermes_memory_continuity_mem0_final.stdout | from_json).status
            != 'already-migrated'

        - name: Validate Astra Mem0 provider recall without exposing results
          ansible.builtin.command:
            argv:
              - /usr/sbin/runuser
              - --user
              - hermes-astra
              - --
              - /usr/bin/env
              - HOME=/var/lib/hermes/astra
              - HERMES_HOME=/var/lib/hermes/astra/.hermes/profiles/astra
              - HERMES_MANAGED_DIR=/etc/hermes/astra
              - "{{ hermes_shadow_runtime_venv }}/bin/python"
              - -c
              - >-
                from plugins.memory.mem0 import Mem0MemoryProvider;
                p=Mem0MemoryProvider(); p.initialize('continuity-check', user_id='johnny', platform='discord');
                assert p.is_available() and p._backend is not None;
                assert p._backend.search('Johnny preferences', filters={'user_id':'johnny'}, top_k=1)
          changed_when: false

        - name: Reconcile preserved Mem0 v1 collection after local re-embedding
          ansible.builtin.command:
            argv: >-
              {{
                [hermes_mem0_migrator_live,
                 '--qdrant-url', hermes_mem0_qdrant_url,
                 '--source', hermes_mem0_source_collection,
                 '--target', hermes_mem0_preserved_collection,
                 '--user-id', hermes_mem0_user_id,
                 '--agent-id', hermes_mem0_agent_id]
                + (hermes_mem0_source_user_ids
                   | map('regex_replace', '^', '--include-user-id=')
                   | list)
              }}
          register: hermes_memory_continuity_mem0_preserved_final
          changed_when: false
          failed_when: >-
            (hermes_memory_continuity_mem0_preserved_final.stdout | from_json)
            .status != 'already-migrated'

        - name: Resume timers that were active before memory conversion
          ansible.builtin.systemd_service:
            name: "{{ item.item }}"
            state: started
            enabled: true
          loop: "{{ hermes_memory_continuity_timer_state.results }}"
          loop_control:
            label: "{{ item.item }}"
          when: item.stdout == 'active'

        - name: Record source-preserving memory conversion evidence
          ansible.builtin.copy:
            content: |
              LCM revision: {{ hermes_memory_continuity_lcm_revision.stdout }}
              LCM source backup: {{ hermes_memory_continuity_backup_dir }}/openclaw-lcm.db
              Mem0 history backup: {{ hermes_memory_continuity_backup_dir }}/openclaw-mem0-history.db
              Mem0 source collection: {{ hermes_mem0_source_collection }}
              Mem0 preserved collection: {{ hermes_mem0_preserved_collection }}
              Mem0 target collection: {{ hermes_mem0_target_collection }}
              Mem0 local LLM: {{ hermes_mem0_ollama_llm_model }}
              Mem0 local embedder: {{ hermes_mem0_ollama_embedding_model }}
              Mem0 embedding dimensions: {{ hermes_mem0_ollama_embedding_dimensions }}
              Mem0 selected: {{ (hermes_memory_continuity_mem0_final.stdout | from_json).selectedCount }}
              Mem0 excluded other-agent points: {{ (hermes_memory_continuity_mem0_final.stdout | from_json).excludedCount }}
            dest: "{{ hermes_memory_continuity_backup_dir }}/RESULT.txt"
            owner: root
            group: root
            mode: "0600"

      rescue:
        - name: Record failed memory-conversion task privately
          ansible.builtin.copy:
            content: |
              task={{ ansible_failed_task.name | default('unknown') }}
              action={{ ansible_failed_task.action | default('unknown') }}
              rc={{ ansible_failed_result.rc | default('') }}
              msg={{ ansible_failed_result.msg | default('') }}
              stderr={{ ansible_failed_result.stderr | default('') }}
              exception={{ ansible_failed_result.exception | default('') }}
            dest: "{{ hermes_memory_continuity_backup_dir }}/FAILED.txt"
            owner: root
            group: root
            mode: "0600"
          no_log: true
          failed_when: false

        - name: Remove incomplete NFS prior-state artifact partials
          ansible.builtin.file:
            path: >-
              {{ hermes_memory_continuity_backup_dir }}/{{ item.name }}.partial
            state: absent
          loop: "{{ hermes_memory_continuity_prior_artifacts | default([]) }}"
          loop_control:
            label: "{{ item.name }}"
          failed_when: false

        - name: Prepare best-effort markers for failed memory conversion stops
          ansible.builtin.include_tasks: ../../tasks/hermes-planned-stop-marker.yml
          vars:
            hermes_planned_stop_profile: "{{ item }}"
            hermes_planned_stop_strict: false
          loop: "{{ hermes_production_consumer_profiles }}"
          loop_control:
            label: "{{ item.name }}"

        - name: Stop failed native production Gateways before memory rollback
          ansible.builtin.command:
            argv:
              - "{{ hermes_shadow_runtime_binary }}"
              - gateway
              - stop
              - --system
          environment:
            HOME: "{{ item.account_home }}"
            HERMES_HOME: "{{ item.home }}"
            HERMES_MANAGED_DIR: "/etc/hermes/{{ item.name }}"
          loop: "{{ hermes_production_consumer_profiles }}"
          loop_control:
            label: "{{ item.name }}"
          changed_when: true
          failed_when: false

        - name: Copy published prior-state artifacts into local rollback staging
          ansible.builtin.command:
            argv:
              - /usr/bin/cp
              - --sparse=always
              - "{{ hermes_memory_continuity_backup_dir }}/{{ item.name }}"
              - >-
                {{ hermes_memory_continuity_local_stage }}/restore-{{ item.name }}
          loop: "{{ hermes_memory_continuity_prior_artifacts | default([]) }}"
          loop_control:
            label: "{{ item.name }}"
          when: hermes_memory_continuity_prior_state_published | bool
          changed_when: true

        - name: Hash published prior-state artifacts for rollback
          ansible.builtin.command:
            argv:
              - /usr/bin/sha256sum
              - "{{ hermes_memory_continuity_backup_dir }}/{{ item.name }}"
          loop: "{{ hermes_memory_continuity_prior_artifacts | default([]) }}"
          loop_control:
            label: "{{ item.name }}"
          register: hermes_memory_continuity_rollback_published_hashes
          when: hermes_memory_continuity_prior_state_published | bool
          changed_when: false

        - name: Hash locally staged rollback artifacts
          ansible.builtin.command:
            argv:
              - /usr/bin/sha256sum
              - >-
                {{ hermes_memory_continuity_local_stage }}/restore-{{ item.name }}
          loop: "{{ hermes_memory_continuity_prior_artifacts | default([]) }}"
          loop_control:
            label: "{{ item.name }}"
          register: hermes_memory_continuity_rollback_local_hashes
          when: hermes_memory_continuity_prior_state_published | bool
          changed_when: false

        - name: Require checksum-verified local rollback artifacts
          ansible.builtin.assert:
            that:
              - >-
                hermes_memory_continuity_rollback_published_hashes.results[item].stdout.split()[0]
                ==
                hermes_memory_continuity_rollback_local_hashes.results[item].stdout.split()[0]
          loop: >-
            {{ range(0, hermes_memory_continuity_prior_artifacts | default([]) | length) | list }}
          when: hermes_memory_continuity_prior_state_published | bool

        - name: Verify local rollback LCM database integrity
          ansible.builtin.command:
            argv:
              - "{{ hermes_shadow_runtime_venv }}/bin/python"
              - -c
              - >-
                import sqlite3, sys;
                database = sqlite3.connect('file:' + sys.argv[1] + '?mode=ro', uri=True);
                result = database.execute('PRAGMA quick_check').fetchone()[0];
                database.close(); print(result);
                raise SystemExit(0 if result == 'ok' else 1)
              - >-
                {{ hermes_memory_continuity_local_stage
                   }}/restore-prior-hermes-lcm.db
          when:
            - hermes_memory_continuity_prior_state_published | bool
            - hermes_memory_continuity_prior_lcm.stat.exists
          changed_when: false

        - name: Verify local rollback LCM tree archives
          ansible.builtin.command:
            argv:
              - /usr/bin/tar
              - -tf
              - >-
                {{ hermes_memory_continuity_local_stage }}/restore-{{ item.name }}
          loop:
            - name: prior-hermes-lcm-large-outputs.tar
              exists: "{{ hermes_memory_continuity_prior_lcm_outputs.stat.exists }}"
            - name: prior-hermes-lcm-plugin.tar
              exists: "{{ hermes_memory_continuity_prior_lcm_plugin.stat.exists }}"
          loop_control:
            label: "{{ item.name }}"
          when:
            - hermes_memory_continuity_prior_state_published | bool
            - item.exists | bool
          changed_when: false

        - name: Remove files introduced by failed memory conversion
          ansible.builtin.file:
            path: "{{ item.item }}"
            state: absent
          loop: "{{ hermes_memory_continuity_prior_files.results }}"
          loop_control:
            label: "{{ item.item }}"
          when: not item.stat.exists

        - name: Restore prior rollback-managed memory files
          ansible.builtin.copy:
            src: >-
              {{ hermes_memory_continuity_backup_dir }}/files/{{ item.item | hash('sha256') }}
            dest: "{{ item.item }}"
            remote_src: true
            owner: "{{ item.stat.pw_name }}"
            group: "{{ item.stat.gr_name }}"
            mode: "{{ item.stat.mode }}"
          loop: "{{ hermes_memory_continuity_prior_files.results }}"
          loop_control:
            label: "{{ item.item }}"
          when: item.stat.exists and item.stat.isreg

        - name: Remove failed Hermes LCM target
          ansible.builtin.file:
            path: "{{ hermes_lcm_target_database }}"
            state: absent
          when:
            - hermes_memory_continuity_prior_lcm is defined
            - >-
              not hermes_memory_continuity_prior_lcm.stat.exists
              or hermes_memory_continuity_prior_state_published | bool

        - name: Remove failed LCM externalized-output tree
          ansible.builtin.file:
            path: "{{ hermes_lcm_externalized_output_root }}"
            state: absent
          when:
            - hermes_memory_continuity_prior_lcm_outputs is defined
            - >-
              not hermes_memory_continuity_prior_lcm_outputs.stat.exists
              or hermes_memory_continuity_prior_state_published | bool

        - name: Restore prior Hermes LCM target
          ansible.builtin.copy:
            src: >-
              {{ hermes_memory_continuity_local_stage
                 }}/restore-prior-hermes-lcm.db
            dest: "{{ hermes_lcm_target_database }}"
            remote_src: true
            owner: hermes-astra
            group: hermes-astra
            mode: "0600"
          when: >-
            hermes_memory_continuity_prior_state_published | bool
            and hermes_memory_continuity_prior_lcm is defined
            and hermes_memory_continuity_prior_lcm.stat.exists

        - name: Restore prior LCM externalized-output tree
          ansible.builtin.unarchive:
            src: >-
              {{ hermes_memory_continuity_local_stage
                 }}/restore-prior-hermes-lcm-large-outputs.tar
            dest: "{{ hermes_lcm_externalized_output_root | dirname }}"
            remote_src: true
            owner: hermes-astra
            group: hermes-astra
          when: >-
            hermes_memory_continuity_prior_state_published | bool
            and hermes_memory_continuity_prior_lcm_outputs is defined
            and hermes_memory_continuity_prior_lcm_outputs.stat.exists

        - name: Remove failed managed Hermes LCM plugin
          ansible.builtin.file:
            path: "{{ hermes_lcm_plugin_managed_root }}"
            state: absent
          when:
            - hermes_memory_continuity_prior_lcm_plugin is defined
            - >-
              not hermes_memory_continuity_prior_lcm_plugin.stat.exists
              or hermes_memory_continuity_prior_state_published | bool

        - name: Restore prior managed Hermes LCM plugin
          ansible.builtin.unarchive:
            src: >-
              {{ hermes_memory_continuity_local_stage
                 }}/restore-prior-hermes-lcm-plugin.tar
            dest: "{{ hermes_lcm_plugin_managed_root | dirname }}"
            remote_src: true
          when: >-
            hermes_memory_continuity_prior_state_published | bool
            and hermes_memory_continuity_prior_lcm_plugin is defined
            and hermes_memory_continuity_prior_lcm_plugin.stat.exists

        - name: Verify restored live LCM database integrity
          ansible.builtin.command:
            argv:
              - "{{ hermes_shadow_runtime_venv }}/bin/python"
              - -c
              - >-
                import sqlite3, sys;
                database = sqlite3.connect('file:' + sys.argv[1] + '?mode=ro', uri=True);
                result = database.execute('PRAGMA quick_check').fetchone()[0];
                database.close(); print(result);
                raise SystemExit(0 if result == 'ok' else 1)
              - "{{ hermes_lcm_target_database }}"
          when:
            - hermes_memory_continuity_prior_state_published | bool
            - hermes_memory_continuity_prior_lcm.stat.exists
          changed_when: false

        - name: Remove newly created Mem0 target after failed conversion
          ansible.builtin.uri:
            url: >-
              {{ hermes_mem0_qdrant_url }}/collections/{{ hermes_mem0_target_collection }}
            method: DELETE
            status_code:
              - 200
              - 404
          when: hermes_memory_continuity_qdrant_collections.results[2].status == 404

        - name: Remove locally added Mem0 models after failed conversion
          ansible.builtin.command:
            argv:
              - "{{ hermes_mem0_ollama_binary }}"
              - rm
              - "{{ item }}"
          loop:
            - "{{ hermes_mem0_ollama_llm_model }}"
            - "{{ hermes_mem0_ollama_embedding_model }}"
          loop_control:
            label: "{{ item }}"
          when: item not in hermes_memory_continuity_prior_ollama_models
          changed_when: true
          failed_when: false

        - name: Remove locally added Mem0 Ollama client after failed conversion
          ansible.builtin.command:
            argv:
              - "{{ hermes_shadow_uv_binary }}"
              - pip
              - uninstall
              - --python
              - "{{ hermes_shadow_runtime_venv }}/bin/python"
              - ollama
          when: >-
            hermes_memory_continuity_prior_ollama_dependency is defined
            and hermes_memory_continuity_prior_ollama_dependency.stdout == 'absent'
          changed_when: true
          failed_when: false

        - name: Fail after restoring pre-conversion memory state
          ansible.builtin.fail:
            msg: >-
              Astra memory conversion failed. {% if
              hermes_memory_continuity_prior_state_published | bool %}Prior
              files and LCM state were restored from checksum-verified local
              copies of {{ hermes_memory_continuity_backup_dir }}.{% else %}The
              failure occurred before prior-state publication, so existing LCM
              targets were left untouched.{% endif %} The OpenClaw SQLite
              sources and Mem0 source collection were not modified.

      always:
        - name: Reload native units after memory transaction
          ansible.builtin.systemd_service:
            daemon_reload: true

        - name: Restore exact prior production Gateway availability
          ansible.builtin.systemd_service:
            name: "{{ item.item.unit }}"
            state: started
          loop: "{{ hermes_memory_continuity_gateway_state.results }}"
          loop_control:
            label: "{{ item.item.name }}"
          when: item.stdout == 'active'

        - name: Restore exact prior timer availability
          ansible.builtin.systemd_service:
            name: "{{ item.item }}"
            state: started
            enabled: true
          loop: "{{ hermes_memory_continuity_timer_state.results }}"
          loop_control:
            label: "{{ item.item }}"
          when: item.stdout == 'active'

        - name: Remove Astra-owned backup staging file after transaction
          ansible.builtin.file:
            path: "{{ hermes_memory_continuity_profile_backup_stage }}"
            state: absent

        - name: Remove local memory-continuity staging after transaction
          ansible.builtin.file:
            path: "{{ hermes_memory_continuity_local_stage }}"
            state: absent
