---
# yamllint disable rule:line-length
# Purpose: Upgrade Astra's native Mem0 runtime and collection to stable v3 hybrid search.
# Hosts: hermes_hosts.
# Key vars: hermes_mem0_native_upgrade_*, hermes_mem0_*.
# Templates: templates/hermes/hermes-mem0.json.j2, Hermes native unit drop-ins.
# Scripts: scripts/agents/hermes-mem0-qdrant-migrate.py.
# Validation: ansible-playbook playbooks/agents/hermes-mem0-native-upgrade.yml --syntax-check.

- name: Upgrade Astra Mem0 to the newest stable native runtime
  hosts: hermes_hosts
  become: true
  gather_facts: true
  serial: 1
  any_errors_fatal: true

  vars:
    hermes_mem0_native_upgrade_id: >-
      {{ ansible_facts['date_time']['iso8601_basic_short'] }}-pre-mem0-native-v3
    hermes_mem0_native_upgrade_local_venv_backup: >-
      {{ hermes_shadow_runtime_venv }}.{{ hermes_mem0_native_upgrade_id }}
    hermes_mem0_native_upgrade_failed_venv: >-
      {{ hermes_shadow_runtime_venv }}.failed-{{ hermes_mem0_native_upgrade_id }}
    hermes_mem0_native_upgrade_backup_candidates:
      - "{{ hermes_shadow_runtime_venv }}"
      - "{{ hermes_mem0_config_live }}"
      - "{{ hermes_mem0_migrator_live }}"
      - /etc/systemd/system/hermes-gateway-astra.service.d/10-managed.conf
      - /etc/systemd/system/hermes-gateway-dubble.service.d/10-managed.conf
      - "/etc/systemd/system/{{ hermes_native_update_service }}"
    hermes_mem0_native_upgrade_package_names:
      - mem0ai
      - fastembed
      - ollama
      - spacy
    hermes_mem0_native_upgrade_paused_timers: >-
      {{ (hermes_automation_enabled_timers
          + [hermes_native_update_timer, hermes_tirith_update_timer])
         | unique
         | list }}

  tasks:
    - name: Validate native Mem0 upgrade mode
      ansible.builtin.assert:
        that:
          - hermes_mem0_native_upgrade_mode in ['disabled', 'audit', 'apply']
        fail_msg: >-
          hermes_mem0_native_upgrade_mode must be disabled, audit, or apply.

    - name: Skip hosts without native Mem0 upgrade approval
      ansible.builtin.meta: end_host
      when: hermes_mem0_native_upgrade_mode == 'disabled'

    - name: Require exact native Mem0 v3 authorization
      ansible.builtin.assert:
        that:
          - hermes_mem0_native_upgrade_approved | bool
          - >-
            hermes_mem0_native_upgrade_confirmation
            == hermes_mem0_native_upgrade_required_confirmation
          - inventory_hostname == 'jn-t14s-lin'
          - >-
            hermes_mem0_native_source_collection
            == hermes_mem0_target_collection
          - >-
            hermes_mem0_native_source_collection
            != hermes_mem0_native_target_collection
          - hermes_mem0_native_target_collection is match('.*_v3$')
          - hermes_mem0_ollama_embedding_dimensions == 1024
        fail_msg: >-
          The native Mem0 v3 upgrade requires exact host-scoped approval and a
          distinct native v2 source and v3 target.
      when: hermes_mem0_native_upgrade_mode == 'apply'

    - name: Resolve newest stable Python memory package releases
      ansible.builtin.uri:
        url: "https://pypi.org/pypi/{{ item }}/json"
        method: GET
        return_content: true
        status_code: 200
      loop: "{{ hermes_mem0_native_upgrade_package_names }}"
      register: hermes_mem0_native_upgrade_pypi
      changed_when: false
      check_mode: false

    - name: Record stable Python memory package releases
      ansible.builtin.set_fact:
        hermes_mem0_native_upgrade_latest_versions: >-
          {{
            dict(
              hermes_mem0_native_upgrade_pypi.results
              | map(attribute='item')
              | zip(
                  hermes_mem0_native_upgrade_pypi.results
                  | map(attribute='json.info.version')
                )
            )
          }}

    - name: Reject prerelease or malformed Python package releases
      ansible.builtin.assert:
        that:
          - >-
            hermes_mem0_native_upgrade_latest_versions[item]
            is match('^[0-9]+\.[0-9]+\.[0-9]+$')
        fail_msg: >-
          PyPI did not return a production-stable semantic version for {{ item }}.
      loop: "{{ hermes_mem0_native_upgrade_package_names }}"

    - name: Inspect native v2 and v3 Qdrant collections
      ansible.builtin.uri:
        url: >-
          {{ hermes_mem0_qdrant_url }}/collections/{{ item }}
        method: GET
        return_content: true
        status_code:
          - 200
          - 404
      loop:
        - "{{ hermes_mem0_native_source_collection }}"
        - "{{ hermes_mem0_native_target_collection }}"
      register: hermes_mem0_native_upgrade_collections
      changed_when: false
      check_mode: false

    - name: Require complete native v2 source and bounded v3 state
      ansible.builtin.assert:
        that:
          - hermes_mem0_native_upgrade_collections.results[0].status == 200
          - >-
            hermes_mem0_native_upgrade_collections.results[0].json.result.points_count
            == 4148
          - >-
            hermes_mem0_native_upgrade_collections.results[1].status
            in [200, 404]
        fail_msg: >-
          The native v2 source is missing or no longer has the reconciled 4,148
          Astra memories.

    - name: Read active stable Hermes base requirements
      ansible.builtin.command:
        argv:
          - "{{ hermes_shadow_runtime_venv }}/bin/python"
          - -c
          - >-
            import importlib.metadata as m,json;
            from packaging.requirements import Requirement;
            rows=[Requirement(raw) for raw in (m.requires('hermes-agent') or [])];
            print(json.dumps([str(row) for row in rows if row.marker is None or row.marker.evaluate()]))
      register: hermes_mem0_native_upgrade_base_requirements_raw
      changed_when: false

    - name: Record active stable Hermes base requirements
      ansible.builtin.set_fact:
        hermes_mem0_native_upgrade_base_requirements: >-
          {{ hermes_mem0_native_upgrade_base_requirements_raw.stdout | from_json }}

    - name: Require a nonempty base compatibility contract
      ansible.builtin.assert:
        that:
          - hermes_mem0_native_upgrade_base_requirements | length > 10
          - >-
            hermes_mem0_native_upgrade_base_requirements
            | select('match', '^openai==') | list | length == 1
          - >-
            hermes_mem0_native_upgrade_base_requirements
            | select('search', 'extra ==') | list | length == 0

    - name: Dry-run newest stable Mem0 dependency resolution
      ansible.builtin.command:
        argv: >-
          {{
            [hermes_shadow_uv_binary,
             'pip', 'install', '--dry-run', '--strict', '--upgrade',
             '--prerelease', 'disallow',
             '--python', hermes_shadow_runtime_venv ~ '/bin/python']
            + hermes_mem0_stable_dependencies
            + hermes_mem0_native_upgrade_base_requirements
          }}
      register: hermes_mem0_native_upgrade_dependency_dry_run
      changed_when: false
      check_mode: false

    - name: Inspect Gateway and timer state before interruption
      ansible.builtin.command:
        argv:
          - /usr/bin/systemctl
          - is-active
          - "{{ item }}"
      loop: >-
        {{
          (hermes_production_consumer_profiles | map(attribute='unit') | list)
          + hermes_mem0_native_upgrade_paused_timers
        }}
      register: hermes_mem0_native_upgrade_unit_state
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Inspect managed memory dependency resolver before mutation
      ansible.builtin.stat:
        path: "{{ hermes_mem0_dependency_updater_live }}"
        follow: false
      register: hermes_mem0_native_upgrade_dependency_updater_prior_stat

    - name: Add existing dependency resolver to rollback candidates
      ansible.builtin.set_fact:
        hermes_mem0_native_upgrade_backup_candidates: >-
          {{
            hermes_mem0_native_upgrade_backup_candidates
            + ([hermes_mem0_dependency_updater_live]
               if hermes_mem0_native_upgrade_dependency_updater_prior_stat.stat.exists
               else [])
          }}

    - name: Inspect rollback candidates
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop: "{{ hermes_mem0_native_upgrade_backup_candidates }}"
      register: hermes_mem0_native_upgrade_backup_stats
      check_mode: false

    - name: Require complete non-symlinked rollback candidates
      ansible.builtin.assert:
        that:
          - item.stat.exists | default(false)
          - not (item.stat.islnk | default(false))
        fail_msg: >-
          Required native Mem0 rollback source is absent or symlinked:
          {{ item.item }}
      loop: "{{ hermes_mem0_native_upgrade_backup_stats.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Verify managed live rollback storage
      ansible.builtin.command:
        argv:
          - /usr/bin/mountpoint
          - -q
          - /srv/live-rollbacks
      changed_when: false
      check_mode: false

    - name: Resolve explicitly supplied native Mem0 rollback artifact
      ansible.builtin.command:
        argv:
          - /usr/bin/realpath
          - --canonicalize-existing
          - --
          - "{{ item }}"
      loop:
        - "{{ hermes_mem0_native_upgrade_rollback_root }}"
        - "{{ hermes_mem0_native_upgrade_existing_backup }}"
      register: hermes_mem0_native_upgrade_existing_backup_paths
      changed_when: false
      when: hermes_mem0_native_upgrade_existing_backup | length > 0

    - name: Require supplied rollback artifact under managed storage
      ansible.builtin.assert:
        that:
          - >-
            hermes_mem0_native_upgrade_existing_backup_paths.results[1].stdout
            is match(
              '^'
              ~ (hermes_mem0_native_upgrade_existing_backup_paths.results[0].stdout
                 | regex_escape)
              ~ '/'
            )
          - >-
            hermes_mem0_native_upgrade_existing_backup_paths.results[1].stdout
            is search('-pre-mem0-native-v3$')
      when: hermes_mem0_native_upgrade_existing_backup | length > 0

    - name: Inspect explicitly supplied native Mem0 rollback contents
      ansible.builtin.stat:
        path: >-
          {{ hermes_mem0_native_upgrade_existing_backup_paths.results[1].stdout
             }}/{{ item }}
        follow: false
      loop: >-
        {{ ['manifest.txt', '.live-rollback-cache']
           + (hermes_mem0_native_upgrade_backup_candidates
              | map('regex_replace', '^/', 'files/')
              | list) }}
      register: hermes_mem0_native_upgrade_existing_backup_stats
      when: hermes_mem0_native_upgrade_existing_backup | length > 0

    - name: Require complete explicitly supplied native Mem0 rollback contents
      ansible.builtin.assert:
        that:
          - item.stat.exists | default(false)
          - not (item.stat.islnk | default(false))
      loop: >-
        {{ hermes_mem0_native_upgrade_existing_backup_stats.results
           | default([]) }}
      loop_control:
        label: "{{ item.item | default('missing') }}"
      when: hermes_mem0_native_upgrade_existing_backup | length > 0

    - name: Read explicitly supplied native Mem0 rollback manifest
      ansible.builtin.slurp:
        src: >-
          {{ hermes_mem0_native_upgrade_existing_backup_paths.results[1].stdout
             }}/manifest.txt
      register: hermes_mem0_native_upgrade_existing_backup_manifest
      when: hermes_mem0_native_upgrade_existing_backup | length > 0

    - name: Require exact native Mem0 sources in supplied rollback manifest
      ansible.builtin.assert:
        that:
          - >-
            'host=jn-t14s-lin'
            in (hermes_mem0_native_upgrade_existing_backup_manifest.content
                | b64decode).splitlines()
          - >-
            'domain=hermes-memory-runtime'
            in (hermes_mem0_native_upgrade_existing_backup_manifest.content
                | b64decode).splitlines()
          - >-
            ('  ' ~ item)
            in (hermes_mem0_native_upgrade_existing_backup_manifest.content
                | b64decode).splitlines()
      loop: "{{ hermes_mem0_native_upgrade_backup_candidates }}"
      loop_control:
        label: "{{ item }}"
      when: hermes_mem0_native_upgrade_existing_backup | length > 0

    - name: End host after read-only native Mem0 audit
      ansible.builtin.meta: end_host
      when: hermes_mem0_native_upgrade_mode == 'audit'

    - name: Initialize native Mem0 rollback command
      ansible.builtin.set_fact:
        hermes_mem0_native_upgrade_backup_argv:
          - /usr/local/sbin/live-rollback-backup
          - --domain
          - hermes-memory-runtime
          - --host
          - jn-t14s-lin
          - --name
          - "{{ hermes_mem0_native_upgrade_id }}"
      when: hermes_mem0_native_upgrade_existing_backup | length == 0

    - name: Add native Mem0 sources to rollback command
      ansible.builtin.set_fact:
        hermes_mem0_native_upgrade_backup_argv: >-
          {{ hermes_mem0_native_upgrade_backup_argv + ['--path', item] }}
      loop: "{{ hermes_mem0_native_upgrade_backup_candidates }}"
      when: hermes_mem0_native_upgrade_existing_backup | length == 0

    - name: Back up exact native Mem0 runtime before mutation
      ansible.builtin.command:
        argv: "{{ hermes_mem0_native_upgrade_backup_argv }}"
      register: hermes_mem0_native_upgrade_backup
      changed_when: true
      when: hermes_mem0_native_upgrade_existing_backup | length == 0

    - name: Record validated native Mem0 rollback artifact
      ansible.builtin.set_fact:
        hermes_mem0_native_upgrade_backup_path: >-
          {{
            hermes_mem0_native_upgrade_existing_backup_paths.results[1].stdout
            if hermes_mem0_native_upgrade_existing_backup | length > 0
            else hermes_mem0_native_upgrade_backup.stdout
          }}

    - name: Preserve current small runtime files for automatic rescue
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop:
        - "{{ hermes_mem0_config_live }}"
        - "{{ hermes_mem0_migrator_live }}"
        - /etc/systemd/system/hermes-gateway-astra.service.d/10-managed.conf
        - /etc/systemd/system/hermes-gateway-dubble.service.d/10-managed.conf
        - "/etc/systemd/system/{{ hermes_native_update_service }}"
      register: hermes_mem0_native_upgrade_prior_files
      no_log: true

    - name: Preserve prior managed memory dependency resolver
      ansible.builtin.slurp:
        src: "{{ hermes_mem0_dependency_updater_live }}"
      register: hermes_mem0_native_upgrade_dependency_updater_prior
      when: hermes_mem0_native_upgrade_dependency_updater_prior_stat.stat.exists
      no_log: true

    - name: Pause active memory-dependent timers
      ansible.builtin.systemd_service:
        name: "{{ item.item }}"
        state: stopped
      loop: "{{ hermes_mem0_native_upgrade_unit_state.results }}"
      loop_control:
        label: "{{ item.item }}"
      when:
        - item.item in hermes_mem0_native_upgrade_paused_timers
        - item.stdout == 'active'

    - name: Upgrade native Mem0 transactionally
      block:
        - name: Stop active shared-runtime Gateways
          ansible.builtin.systemd_service:
            name: "{{ item.item }}"
            state: stopped
          loop: "{{ hermes_mem0_native_upgrade_unit_state.results }}"
          loop_control:
            label: "{{ item.item }}"
          when:
            - >-
              item.item
              in (hermes_production_consumer_profiles | map(attribute='unit') | list)
            - item.stdout == 'active'

        - name: Create exact local virtual-environment rollback copy
          ansible.builtin.command:
            argv:
              - /usr/bin/cp
              - -a
              - --reflink=auto
              - --sparse=always
              - "{{ hermes_shadow_runtime_venv }}"
              - "{{ hermes_mem0_native_upgrade_local_venv_backup }}"
          changed_when: true

        - name: Require local virtual-environment rollback copy
          ansible.builtin.stat:
            path: >-
              {{ hermes_mem0_native_upgrade_local_venv_backup }}/bin/python
            follow: true
          register: hermes_mem0_native_upgrade_local_venv_backup_stat

        - name: Validate local virtual-environment rollback copy
          ansible.builtin.assert:
            that:
              - hermes_mem0_native_upgrade_local_venv_backup_stat.stat.isreg
              - hermes_mem0_native_upgrade_local_venv_backup_stat.stat.executable

        - name: Mark local virtual-environment rollback copy usable
          ansible.builtin.set_fact:
            hermes_mem0_native_upgrade_local_backup_ready: true

        - name: Normalize shared virtual-environment ownership for native updater
          ansible.builtin.file:
            path: "{{ hermes_shadow_runtime_venv }}"
            owner: hermes-astra
            group: "{{ hermes_runtime_readers_group }}"
            recurse: true

        - name: Reassert shared virtual-environment root permissions
          ansible.builtin.file:
            path: "{{ hermes_shadow_runtime_venv }}"
            owner: hermes-astra
            group: "{{ hermes_runtime_readers_group }}"
            mode: "2755"

        - name: Install newest production-stable Mem0 runtime dependencies
          ansible.builtin.command:
            argv: >-
              {{
                ['/usr/sbin/runuser', '--user', 'hermes-astra', '--',
                 '/usr/bin/env', 'HOME=/var/lib/hermes/astra',
                 'UV_CACHE_DIR=/var/lib/hermes/astra/.cache/uv',
                 hermes_shadow_uv_binary,
                 'pip', 'install', '--strict', '--upgrade',
                 '--prerelease', 'disallow',
                 '--python', hermes_shadow_runtime_venv ~ '/bin/python']
                + hermes_mem0_stable_dependencies
                + hermes_mem0_native_upgrade_base_requirements
              }}
          register: hermes_mem0_native_upgrade_dependency_apply
          changed_when: true
          args:
            chdir: /var/lib/hermes/astra

        - name: Inspect installed native memory package versions
          ansible.builtin.command:
            argv:
              - "{{ hermes_shadow_runtime_venv }}/bin/python"
              - -c
              - >-
                import importlib.metadata as m,json;
                print(json.dumps({name:m.version(name) for name in
                ['mem0ai','fastembed','ollama','spacy']},sort_keys=True))
          register: hermes_mem0_native_upgrade_installed_versions
          changed_when: false

        - name: Require exact newest stable package versions
          ansible.builtin.assert:
            that:
              - >-
                (hermes_mem0_native_upgrade_installed_versions.stdout | from_json)[item]
                == hermes_mem0_native_upgrade_latest_versions[item]
          loop: "{{ hermes_mem0_native_upgrade_package_names }}"

        - name: Read official spaCy model compatibility matrix
          ansible.builtin.uri:
            url: >-
              https://raw.githubusercontent.com/explosion/spacy-models/master/compatibility.json
            method: GET
            return_content: true
            status_code: 200
          register: hermes_mem0_native_upgrade_spacy_compatibility
          changed_when: false

        - name: Resolve newest stable compatible English spaCy model
          ansible.builtin.set_fact:
            hermes_mem0_native_upgrade_spacy_model_versions: >-
              {{
                (hermes_mem0_native_upgrade_spacy_compatibility.content
                 | from_json).spacy[
                  (hermes_mem0_native_upgrade_installed_versions.stdout
                   | from_json).spacy.split('.')[0:2] | join('.')
                ][hermes_mem0_spacy_model]
                | community.general.version_sort
              }}

        - name: Require a production-stable compatible spaCy model
          ansible.builtin.assert:
            that:
              - hermes_mem0_native_upgrade_spacy_model_versions | length > 0
              - >-
                (hermes_mem0_native_upgrade_spacy_model_versions | last)
                is match('^[0-9]+\.[0-9]+\.[0-9]+$')

        - name: Install resolved official English spaCy model
          ansible.builtin.command:
            argv:
              - /usr/sbin/runuser
              - --user
              - hermes-astra
              - --
              - /usr/bin/env
              - HOME=/var/lib/hermes/astra
              - UV_CACHE_DIR=/var/lib/hermes/astra/.cache/uv
              - "{{ hermes_shadow_uv_binary }}"
              - pip
              - install
              - --strict
              - --prerelease
              - disallow
              - --python
              - "{{ hermes_shadow_runtime_venv }}/bin/python"
              - >-
                https://github.com/explosion/spacy-models/releases/download/{{ hermes_mem0_spacy_model }}-{{ hermes_mem0_native_upgrade_spacy_model_versions | last }}/{{ hermes_mem0_spacy_model }}-{{ hermes_mem0_native_upgrade_spacy_model_versions | last }}-py3-none-any.whl
          changed_when: true
          args:
            chdir: /var/lib/hermes/astra

        - name: Create Astra FastEmbed cache
          ansible.builtin.file:
            path: "{{ hermes_mem0_fastembed_cache }}"
            state: directory
            owner: hermes-astra
            group: hermes-astra
            mode: "0700"

        - name: Validate stable Mem0 NLP runtime and warm BM25 cache
          ansible.builtin.command:
            argv:
              - /usr/sbin/runuser
              - --user
              - hermes-astra
              - --
              - /usr/bin/env
              - HOME=/var/lib/hermes/astra
              - MEM0_TELEMETRY=false
              - "FASTEMBED_CACHE_PATH={{ hermes_mem0_fastembed_cache }}"
              - "{{ hermes_shadow_runtime_venv }}/bin/python"
              - -c
              - >-
                import spacy; from fastembed import SparseTextEmbedding;
                spacy.load('{{ hermes_mem0_spacy_model }}');
                rows=list(SparseTextEmbedding(model_name='Qdrant/bm25').embed(['Hermes Astra native memory preflight']));
                assert len(rows)==1 and len(rows[0].indices)==len(rows[0].values);
                print('mem0-native-nlp-ok')
          register: hermes_mem0_native_upgrade_nlp_validation
          changed_when: false

        - name: Deploy native hybrid Mem0 migrator
          ansible.builtin.copy:
            src: >-
              {{ ansible_config_file | dirname }}/{{ hermes_mem0_migrator_source }}
            dest: "{{ hermes_mem0_migrator_live }}"
            owner: root
            group: root
            mode: "0755"

        - name: Deploy compatibility-safe memory dependency resolver
          ansible.builtin.copy:
            src: >-
              {{ ansible_config_file | dirname }}/{{ hermes_mem0_dependency_updater_source }}
            dest: "{{ hermes_mem0_dependency_updater_live }}"
            owner: root
            group: root
            mode: "0755"

        - name: Dry-run native v2 to v3 hybrid migration
          ansible.builtin.command:
            argv:
              - /usr/sbin/runuser
              - --user
              - hermes-astra
              - --
              - /usr/bin/env
              - HOME=/var/lib/hermes/astra
              - MEM0_TELEMETRY=false
              - "FASTEMBED_CACHE_PATH={{ hermes_mem0_fastembed_cache }}"
              - "{{ hermes_shadow_runtime_venv }}/bin/python"
              - "{{ hermes_mem0_migrator_live }}"
              - --qdrant-url
              - "{{ hermes_mem0_qdrant_url }}"
              - --source
              - "{{ hermes_mem0_native_source_collection }}"
              - --target
              - "{{ hermes_mem0_native_target_collection }}"
              - --user-id
              - "{{ hermes_mem0_user_id }}"
              - --agent-id
              - "{{ hermes_mem0_agent_id }}"
              - --source-normalized
              - --hybrid
              - --sparse-model
              - Qdrant/bm25
              - --embedding-dimensions
              - "{{ hermes_mem0_ollama_embedding_dimensions | string }}"
          register: hermes_mem0_native_upgrade_dry_run
          changed_when: false

        - name: Require exact native v3 migration boundary
          ansible.builtin.assert:
            that:
              - >-
                (hermes_mem0_native_upgrade_dry_run.stdout | from_json).status
                in ['ready', 'already-migrated']
              - >-
                (hermes_mem0_native_upgrade_dry_run.stdout | from_json).sourceCount
                == 4148
              - >-
                (hermes_mem0_native_upgrade_dry_run.stdout | from_json).selectedCount
                == 4148
              - >-
                (hermes_mem0_native_upgrade_dry_run.stdout | from_json).excludedCount
                == 0
              - (hermes_mem0_native_upgrade_dry_run.stdout | from_json).hybrid
              - >-
                (hermes_mem0_native_upgrade_dry_run.stdout | from_json).sparseModel
                == 'Qdrant/bm25'

        - name: Apply native source-preserving v3 hybrid migration
          ansible.builtin.command:
            argv:
              - /usr/sbin/runuser
              - --user
              - hermes-astra
              - --
              - /usr/bin/env
              - HOME=/var/lib/hermes/astra
              - MEM0_TELEMETRY=false
              - "FASTEMBED_CACHE_PATH={{ hermes_mem0_fastembed_cache }}"
              - "{{ hermes_shadow_runtime_venv }}/bin/python"
              - "{{ hermes_mem0_migrator_live }}"
              - --qdrant-url
              - "{{ hermes_mem0_qdrant_url }}"
              - --source
              - "{{ hermes_mem0_native_source_collection }}"
              - --target
              - "{{ hermes_mem0_native_target_collection }}"
              - --user-id
              - "{{ hermes_mem0_user_id }}"
              - --agent-id
              - "{{ hermes_mem0_agent_id }}"
              - --source-normalized
              - --hybrid
              - --sparse-model
              - Qdrant/bm25
              - --embedding-dimensions
              - "{{ hermes_mem0_ollama_embedding_dimensions | string }}"
              - --apply
          register: hermes_mem0_native_upgrade_apply
          changed_when: >-
            (hermes_mem0_native_upgrade_apply.stdout | from_json).status
            == 'migrated'

        - name: Render Astra native v3 Mem0 configuration
          ansible.builtin.template:
            src: >-
              {{ playbook_dir }}/../../templates/hermes/{{ hermes_mem0_config_template }}
            dest: "{{ hermes_mem0_config_live }}"
            owner: hermes-astra
            group: hermes-astra
            mode: "0600"
          vars:
            hermes_mem0_render_collection: >-
              {{ hermes_mem0_native_target_collection }}

        - name: Deploy current native Gateway hardening drop-ins
          ansible.builtin.template:
            src: >-
              {{ playbook_dir }}/../../templates/hermes/hermes-gateway-hardening.conf.j2
            dest: "/etc/systemd/system/{{ item.unit }}.d/10-managed.conf"
            owner: root
            group: root
            mode: "0644"
          vars:
            hermes_profile: "{{ item }}"
          loop: "{{ hermes_production_consumer_profiles }}"
          loop_control:
            label: "{{ item.name }}"

        - name: Deploy current stable-tracking native updater
          ansible.builtin.template:
            src: >-
              {{ playbook_dir }}/../../templates/hermes/hermes-native-update.service.j2
            dest: "/etc/systemd/system/{{ hermes_native_update_service }}"
            owner: root
            group: root
            mode: "0644"

        - name: Prepare shared virtual environment for both Gateways
          ansible.builtin.file:
            path: "{{ hermes_shadow_runtime_venv }}"
            owner: hermes-astra
            group: "{{ hermes_runtime_readers_group }}"
            mode: "g+rX"
            recurse: true

        - name: Reassert shared virtual-environment root before Gateway restart
          ansible.builtin.file:
            path: "{{ hermes_shadow_runtime_venv }}"
            owner: hermes-astra
            group: "{{ hermes_runtime_readers_group }}"
            mode: "2755"

        - name: Inspect shared-reader access before Gateway restart
          ansible.builtin.command:
            argv:
              - /usr/bin/find
              - "{{ hermes_shadow_runtime_venv }}"
              - -xdev
              - (
              - "!"
              - -group
              - "{{ hermes_runtime_readers_group }}"
              - -o
              - (
              - -type
              - f
              - "!"
              - -perm
              - -g+r
              - )
              - -o
              - (
              - -type
              - d
              - "!"
              - -perm
              - -g+x
              - )
              - )
              - -print
              - -quit
          register: hermes_mem0_native_upgrade_prestart_reader_drift
          changed_when: false

        - name: Require shared-reader access before Gateway restart
          ansible.builtin.assert:
            that:
              - >-
                hermes_mem0_native_upgrade_prestart_reader_drift.stdout
                | length == 0

        - name: Reload native unit definitions
          ansible.builtin.systemd_service:
            daemon_reload: true

        - name: Start previously active shared-runtime Gateways
          ansible.builtin.systemd_service:
            name: "{{ item.item }}"
            state: started
          loop: "{{ hermes_mem0_native_upgrade_unit_state.results }}"
          loop_control:
            label: "{{ item.item }}"
          when:
            - >-
              item.item
              in (hermes_production_consumer_profiles | map(attribute='unit') | list)
            - item.stdout == 'active'

        - name: Restore previously active timers
          ansible.builtin.systemd_service:
            name: "{{ item.item }}"
            state: started
          loop: "{{ hermes_mem0_native_upgrade_unit_state.results }}"
          loop_control:
            label: "{{ item.item }}"
          when:
            - item.item in hermes_mem0_native_upgrade_paused_timers
            - item.stdout == 'active'

        - name: Inspect native v3 collection after activation
          ansible.builtin.uri:
            url: >-
              {{ hermes_mem0_qdrant_url }}/collections/{{ hermes_mem0_native_target_collection }}
            method: GET
            return_content: true
            status_code: 200
          register: hermes_mem0_native_upgrade_final_collection
          changed_when: false

        - name: Require complete v3 schema after activation
          ansible.builtin.assert:
            that:
              - hermes_mem0_native_upgrade_final_collection.json.result.points_count == 4148
              - >-
                hermes_mem0_native_upgrade_final_collection.json.result.config.params.vectors.size
                == hermes_mem0_ollama_embedding_dimensions
              - >-
                hermes_mem0_native_upgrade_final_collection.json.result.config.params.sparse_vectors.bm25.modifier
                | lower == 'idf'
              - >-
                hermes_mem0_native_upgrade_final_collection.json.result.payload_schema.user_id.data_type
                == 'keyword'
              - >-
                hermes_mem0_native_upgrade_final_collection.json.result.payload_schema.agent_id.data_type
                == 'keyword'

        - name: Validate Mem0 dense and BM25 recall through stable OSS runtime
          ansible.builtin.command:
            argv:
              - /usr/sbin/runuser
              - --user
              - hermes-astra
              - --
              - /usr/bin/env
              - HOME=/var/lib/hermes/astra
              - MEM0_TELEMETRY=false
              - "MEM0_DIR=/var/lib/hermes/astra/.hermes/profiles/astra/mem0"
              - "FASTEMBED_CACHE_PATH={{ hermes_mem0_fastembed_cache }}"
              - "{{ hermes_shadow_runtime_venv }}/bin/python"
              - -c
              - >-
                import json,re; from pathlib import Path; from mem0 import Memory;
                config=json.loads(Path('{{ hermes_mem0_config_live }}').read_text());
                memory=Memory.from_config(config['oss']);
                filters={'user_id':'johnny','agent_id':'astra'};
                listed=memory.vector_store.list(filters=filters,top_k=1);
                points=listed[0] if isinstance(listed,tuple) else listed;
                assert points and isinstance(points[0].payload.get('data'),str);
                data=points[0].payload['data'];
                tokens=re.findall(r'[A-Za-z0-9]{5,}',data);
                assert tokens;
                rows=memory.search(data[:500],filters=filters);
                assert rows;
                assert memory.vector_store.keyword_search(max(tokens,key=len),top_k=5,filters=filters);
                print('mem0-native-v3-recall-ok')
          register: hermes_mem0_native_upgrade_recall
          changed_when: false

        - name: Inspect native v3 entity collection after recall
          ansible.builtin.uri:
            url: >-
              {{ hermes_mem0_qdrant_url }}/collections/{{ hermes_mem0_native_target_collection }}_entities
            method: GET
            return_content: true
            status_code: 200
          register: hermes_mem0_native_upgrade_entity_collection
          changed_when: false

        - name: Require complete native v3 entity schema
          ansible.builtin.assert:
            that:
              - >-
                hermes_mem0_native_upgrade_entity_collection.json.result.config.params.vectors.size
                == hermes_mem0_ollama_embedding_dimensions
              - >-
                hermes_mem0_native_upgrade_entity_collection.json.result.config.params.sparse_vectors.bm25.modifier
                | lower == 'idf'
              - >-
                hermes_mem0_native_upgrade_entity_collection.json.result.payload_schema.user_id.data_type
                == 'keyword'
              - >-
                hermes_mem0_native_upgrade_entity_collection.json.result.payload_schema.agent_id.data_type
                == 'keyword'

        - name: Check shared Python environment after native v3 activation
          ansible.builtin.command:
            argv:
              - "{{ hermes_shadow_uv_binary }}"
              - pip
              - check
              - --python
              - "{{ hermes_shadow_runtime_venv }}/bin/python"
          changed_when: false

        - name: Finalize shared virtual-environment ownership after validation
          ansible.builtin.file:
            path: "{{ hermes_shadow_runtime_venv }}"
            owner: hermes-astra
            group: "{{ hermes_runtime_readers_group }}"
            mode: "g+rX"
            recurse: true

        - name: Reassert final shared virtual-environment root permissions
          ansible.builtin.file:
            path: "{{ hermes_shadow_runtime_venv }}"
            owner: hermes-astra
            group: "{{ hermes_runtime_readers_group }}"
            mode: "2755"

        - name: Inspect non-native owners after final runtime validation
          ansible.builtin.command:
            argv:
              - /usr/bin/find
              - "{{ hermes_shadow_runtime_venv }}"
              - -xdev
              - "!"
              - -user
              - hermes-astra
              - -print
              - -quit
          register: hermes_mem0_native_upgrade_non_native_owner
          changed_when: false

        - name: Require native updater ownership after final runtime validation
          ansible.builtin.assert:
            that:
              - hermes_mem0_native_upgrade_non_native_owner.stdout | length == 0

        - name: Remove local virtual-environment rollback copy after validation
          ansible.builtin.file:
            path: "{{ hermes_mem0_native_upgrade_local_venv_backup }}"
            state: absent

      rescue:
        - name: Stop shared-runtime Gateways before native Mem0 rollback
          ansible.builtin.systemd_service:
            name: "{{ item.unit }}"
            state: stopped
          loop: "{{ hermes_production_consumer_profiles }}"
          loop_control:
            label: "{{ item.name }}"
          failed_when: false

        - name: Preserve failed virtual environment for diagnosis
          ansible.builtin.command:
            argv:
              - /usr/bin/mv
              - "{{ hermes_shadow_runtime_venv }}"
              - "{{ hermes_mem0_native_upgrade_failed_venv }}"
          args:
            removes: "{{ hermes_shadow_runtime_venv }}"
            creates: "{{ hermes_mem0_native_upgrade_failed_venv }}"
          when: hermes_mem0_native_upgrade_local_backup_ready | default(false)
          failed_when: false

        - name: Restore exact prior virtual environment
          ansible.builtin.command:
            argv:
              - /usr/bin/mv
              - "{{ hermes_mem0_native_upgrade_local_venv_backup }}"
              - "{{ hermes_shadow_runtime_venv }}"
          args:
            removes: "{{ hermes_mem0_native_upgrade_local_venv_backup }}"
            creates: "{{ hermes_shadow_runtime_venv }}"
          when: hermes_mem0_native_upgrade_local_backup_ready | default(false)

        - name: Restore prior native Mem0 runtime files
          ansible.builtin.copy:
            content: "{{ item.content | b64decode }}"
            dest: "{{ item.item }}"
            owner: root
            group: root
            mode: "0644"
          loop: "{{ hermes_mem0_native_upgrade_prior_files.results }}"
          loop_control:
            label: "{{ item.item }}"
          no_log: true

        - name: Restore private ownership on Mem0 configuration
          ansible.builtin.file:
            path: "{{ hermes_mem0_config_live }}"
            owner: hermes-astra
            group: hermes-astra
            mode: "0600"

        - name: Restore executable mode on Mem0 migrator
          ansible.builtin.file:
            path: "{{ hermes_mem0_migrator_live }}"
            owner: root
            group: root
            mode: "0755"

        - name: Restore prior managed memory dependency resolver
          ansible.builtin.copy:
            content: >-
              {{ hermes_mem0_native_upgrade_dependency_updater_prior.content
                 | b64decode }}
            dest: "{{ hermes_mem0_dependency_updater_live }}"
            owner: root
            group: root
            mode: "0755"
          when: hermes_mem0_native_upgrade_dependency_updater_prior_stat.stat.exists
          no_log: true

        - name: Remove newly introduced dependency resolver after rollback
          ansible.builtin.file:
            path: "{{ hermes_mem0_dependency_updater_live }}"
            state: absent
          when: not hermes_mem0_native_upgrade_dependency_updater_prior_stat.stat.exists

        - name: Remove newly created v3 target after failed activation
          ansible.builtin.uri:
            url: >-
              {{ hermes_mem0_qdrant_url }}/collections/{{ hermes_mem0_native_target_collection }}
            method: DELETE
            status_code:
              - 200
              - 404
          when: hermes_mem0_native_upgrade_collections.results[1].status == 404
          failed_when: false

        - name: Reload restored native units
          ansible.builtin.systemd_service:
            daemon_reload: true

        - name: Restore previously active shared-runtime Gateways
          ansible.builtin.systemd_service:
            name: "{{ item.item }}"
            state: started
          loop: "{{ hermes_mem0_native_upgrade_unit_state.results }}"
          loop_control:
            label: "{{ item.item }}"
          when:
            - >-
              item.item
              in (hermes_production_consumer_profiles | map(attribute='unit') | list)
            - item.stdout == 'active'

        - name: Restore previously active timers after rollback
          ansible.builtin.systemd_service:
            name: "{{ item.item }}"
            state: started
          loop: "{{ hermes_mem0_native_upgrade_unit_state.results }}"
          loop_control:
            label: "{{ item.item }}"
          when:
            - item.item in hermes_mem0_native_upgrade_paused_timers
            - item.stdout == 'active'

        - name: Stop after verified native Mem0 rollback
          ansible.builtin.fail:
            msg: >-
              Native Mem0 v3 activation failed. The exact prior virtual
              environment, configuration, managed units, Gateways, and timers
              were restored. The NFS rollback artifact is retained at
              {{ hermes_mem0_native_upgrade_rollback_root }}.
