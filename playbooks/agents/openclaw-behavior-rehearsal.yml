---
# yamllint disable rule:line-length
# Purpose: Prove modern agent behavior in the loopback-only OpenClaw canary.
# Hosts: openclaw_hosts.
# Key vars: openclaw_behavior_rehearsal_* and openclaw_isolated_gateway_*.
# Scripts: scripts/agents/openclaw-behavior-audit.py, scripts/agents/openclaw-delivery-cutover-audit.py, scripts/agents/openclaw-heartbeat-event-check.py, scripts/agents/openclaw-modern-config-audit.py, scripts/agents/openclaw-native-session-transition.py, scripts/agents/openclaw-session-transition.py, scripts/agents/openclaw-star-gateway-rehearsal.py.
# Validation: ansible-playbook playbooks/agents/openclaw-behavior-rehearsal.yml --syntax-check.

- name: Rehearse modern OpenClaw behavior without channel delivery
  hosts: openclaw_hosts
  become: true
  gather_facts: false

  vars:
    openclaw_behavior_rehearsal_helper_dir: /usr/local/libexec/openclaw-isolated
    openclaw_behavior_rehearsal_audit_tool: >-
      /usr/local/libexec/openclaw-isolated/openclaw-behavior-audit.py
    openclaw_behavior_rehearsal_config_audit_tool: >-
      /usr/local/libexec/openclaw-isolated/openclaw-modern-config-audit.py
    openclaw_behavior_rehearsal_delivery_audit_tool: >-
      /usr/local/libexec/openclaw-isolated/openclaw-delivery-cutover-audit.py
    openclaw_behavior_rehearsal_heartbeat_event_tool: >-
      /usr/local/libexec/openclaw-isolated/openclaw-heartbeat-event-check.py
    openclaw_behavior_rehearsal_transition_tool: >-
      /usr/local/libexec/openclaw-isolated/openclaw-native-session-transition.py
    openclaw_behavior_rehearsal_star_tool: >-
      /usr/local/libexec/openclaw-isolated/openclaw-star-gateway-rehearsal.py
    openclaw_behavior_rehearsal_backup_dir: >-
      /var/backups/openclaw-isolated/behavior-rehearsal
    openclaw_behavior_rehearsal_transition_root: >-
      /var/lib/openclaw-isolated/behavior-transitions
    openclaw_behavior_rehearsal_validation_root: >-
      /var/lib/openclaw-isolated/behavior-validation
    openclaw_behavior_rehearsal_input_root: >-
      /var/lib/openclaw-isolated/behavior-inputs
    openclaw_behavior_rehearsal_primary_model: >-
      {{ openclaw_isolated_gateway_model }}
    openclaw_behavior_rehearsal_antares_model: >-
      ollama-cloud/deepseek-v4-pro
    openclaw_behavior_rehearsal_agents:
      - main
      - dubble
      - rigel
      - vega
      - antares
    openclaw_behavior_rehearsal_session_index_arguments:
      - >-
        --session-index=main={{ openclaw_isolated_gateway_runtime_state_dir }}/agents/main/sessions/sessions.json
      - >-
        --session-index=dubble={{ openclaw_isolated_gateway_runtime_state_dir }}/agents/dubble/sessions/sessions.json
      - >-
        --session-index=rigel={{ openclaw_isolated_gateway_runtime_state_dir }}/agents/rigel/sessions/sessions.json
      - >-
        --session-index=vega={{ openclaw_isolated_gateway_runtime_state_dir }}/agents/vega/sessions/sessions.json
      - >-
        --session-index=antares={{ openclaw_isolated_gateway_runtime_state_dir }}/agents/antares/sessions/sessions.json
    openclaw_behavior_rehearsal_agent_arguments: >-
      {{ openclaw_behavior_rehearsal_agents | map('regex_replace', '^', '--agent=') | list }}

    # Variables consumed only by the channel-less branch of the shared modern
    # configuration template.
    openclaw_modern_deployment_mode: behavior-canary
    openclaw_modern_secret_file: "{{ openclaw_isolated_gateway_secret_file }}"
    openclaw_modern_workspace_dir: "{{ openclaw_isolated_gateway_workspace_dir }}"
    openclaw_modern_primary_model: "{{ openclaw_behavior_rehearsal_primary_model }}"
    openclaw_modern_default_fallbacks: []
    openclaw_modern_image_fallbacks: []
    openclaw_modern_antares_model: "{{ openclaw_behavior_rehearsal_antares_model }}"
    openclaw_modern_antares_fallbacks: []
    openclaw_modern_heartbeats_enabled: false
    openclaw_modern_gateway_port: "{{ openclaw_isolated_gateway_port }}"
    openclaw_modern_codex_port: "{{ openclaw_isolated_codex_port }}"

  tasks:
    - name: Validate OpenClaw behavior rehearsal mode
      ansible.builtin.assert:
        that:
          - openclaw_behavior_rehearsal_mode | default('disabled') in ['disabled', 'plan', 'apply']
        fail_msg: >-
          openclaw_behavior_rehearsal_mode must be disabled, plan, or apply.

    - name: Skip hosts without approved OpenClaw behavior work
      ansible.builtin.meta: end_host
      when: openclaw_behavior_rehearsal_mode == 'disabled'

    - name: Require explicit OpenClaw behavior rehearsal approval
      ansible.builtin.assert:
        that:
          - openclaw_behavior_rehearsal_approved | default(false) | bool
        fail_msg: >-
          The behavior rehearsal runs model turns and a controlled heartbeat in
          the private canary. Explicit owner approval is required.

    - name: Validate fixed OpenClaw behavior rehearsal boundaries
      ansible.builtin.assert:
        that:
          - openclaw_isolated_gateway_user == 'openclaw'
          - openclaw_isolated_gateway_group == 'openclaw'
          - openclaw_isolated_codex_user == openclaw_isolated_gateway_user
          - openclaw_isolated_codex_group == 'openclaw-codex'
          - openclaw_isolated_native_hook_relay_runtime_dir == '/run/openclaw-native-hook-relay'
          - openclaw_isolated_gateway_port | int == 19789
          - openclaw_isolated_codex_port | int == 19790
          - openclaw_isolated_gateway_config_file == '/etc/openclaw-isolated/openclaw.json'
          - openclaw_isolated_gateway_state_dir == '/var/lib/openclaw-isolated'
          - openclaw_isolated_codex_state_dir == '/var/lib/openclaw-codex'
          - openclaw_isolated_codex_token_file == '/etc/openclaw-codex/app-server.token'
          - openclaw_isolated_codex_runtime_dir == '/opt/openclaw-codex/runtime'
          - openclaw_isolated_gateway_runtime_state_dir == '/var/lib/openclaw-isolated/state'
          - openclaw_isolated_gateway_database_file == '/var/lib/openclaw-isolated/state/state/openclaw.sqlite'
          - openclaw_isolated_gateway_workspace_dir == '/usr/local/share/openclaw-isolated/workspace'
          - openclaw_isolated_gateway_runtime_root == '/opt/openclaw-isolated'
          - openclaw_isolated_gateway_skip_cron | bool
          - openclaw_behavior_rehearsal_agents | sort == ['antares', 'dubble', 'main', 'rigel', 'vega']
          - openclaw_behavior_rehearsal_agents | unique | length == 5
          - openclaw_behavior_rehearsal_primary_model is match('^codex/')
          - openclaw_behavior_rehearsal_antares_model is match('^ollama-cloud/')
        fail_msg: >-
          The behavior canary account, listener, state, models, or agent set is
          outside the reviewed migration boundary.

    - name: Inspect OpenClaw behavior rehearsal prerequisites
      ansible.builtin.stat:
        path: "{{ item.path }}"
        follow: false
      loop:
        - path: /etc/systemd/system/openclaw-isolated-gateway.service
          expected_kind: regular
        - path: /etc/systemd/system/openclaw-isolated-codex.service
          expected_kind: regular
        - path: "{{ openclaw_isolated_gateway_config_file }}"
          expected_kind: regular
        - path: "{{ openclaw_isolated_gateway_config_file }}.last-good"
          expected_kind: regular
        - path: "{{ openclaw_isolated_gateway_secret_file }}"
          expected_kind: regular
        - path: "{{ openclaw_isolated_codex_token_file }}"
          expected_kind: regular
        - path: "{{ openclaw_isolated_codex_runtime_dir }}/node_modules/@openai/codex/bin/codex.js"
          expected_kind: regular
        - path: "{{ openclaw_isolated_codex_state_dir }}/codex-home/auth.json"
          expected_kind: regular
        - path: "{{ openclaw_isolated_gateway_runtime_dir }}/bin/openclaw"
          expected_kind: symlink
        - path: "{{ openclaw_isolated_gateway_database_file }}"
          expected_kind: regular
        - path: "{{ openclaw_isolated_gateway_workspace_dir }}/AGENTS.md"
          expected_kind: regular
        - path: "{{ openclaw_isolated_gateway_workspace_dir }}/dubble/AGENTS.md"
          expected_kind: regular
        - path: "{{ openclaw_isolated_gateway_workspace_dir }}/vega/AGENTS.md"
          expected_kind: regular
        - path: "{{ openclaw_isolated_gateway_workspace_dir }}/antares/AGENTS.md"
          expected_kind: regular
        - path: "{{ openclaw_isolated_gateway_workspace_dir }}/rigel/HEARTBEAT.md"
          expected_kind: regular
        - path: "{{ openclaw_isolated_gateway_config_dir }}/.infrastructure-validated"
          expected_kind: regular
        - path: "{{ openclaw_isolated_gateway_runtime_state_dir }}/agents/main/sessions/sessions.json"
          expected_kind: regular
        - path: "{{ openclaw_isolated_gateway_runtime_state_dir }}/agents/dubble/sessions/sessions.json"
          expected_kind: regular
        - path: "{{ openclaw_isolated_gateway_runtime_state_dir }}/agents/rigel/sessions/sessions.json"
          expected_kind: regular
        - path: "{{ openclaw_isolated_gateway_runtime_state_dir }}/agents/vega/sessions/sessions.json"
          expected_kind: regular
        - path: "{{ openclaw_isolated_gateway_runtime_state_dir }}/agents/antares/sessions/sessions.json"
          expected_kind: regular
      loop_control:
        label: "{{ item.path }}"
      register: openclaw_behavior_rehearsal_prerequisites
      check_mode: false

    - name: Require complete OpenClaw behavior rehearsal prerequisite inventory
      ansible.builtin.assert:
        that:
          - openclaw_behavior_rehearsal_prerequisites.results | length == 21
        fail_msg: >-
          The validated canary runtime, modern behavior, database, or five
          session indexes are incomplete.

    - name: Require typed OpenClaw behavior rehearsal prerequisites
      ansible.builtin.assert:
        that:
          - item.stat.exists | default(false) | bool
          - >-
            (
              item.item.expected_kind == 'regular'
              and (item.stat.isreg | default(false) | bool)
              and not (item.stat.islnk | default(false) | bool)
            )
            or
            (
              item.item.expected_kind == 'symlink'
              and (item.stat.islnk | default(false) | bool)
            )
        quiet: true
        fail_msg: >-
          {{ item.item.path }} is not the required {{ item.item.expected_kind }}
          prerequisite.
      loop: "{{ openclaw_behavior_rehearsal_prerequisites.results }}"
      loop_control:
        label: "{{ item.item.path }}"

    - name: Require private executor OAuth ownership and mode
      ansible.builtin.assert:
        that:
          - openclaw_behavior_rehearsal_prerequisites.results[7].stat.pw_name == openclaw_isolated_codex_user
          - openclaw_behavior_rehearsal_prerequisites.results[7].stat.gr_name == openclaw_isolated_codex_group
          - openclaw_behavior_rehearsal_prerequisites.results[7].stat.mode == '0600'
          - openclaw_behavior_rehearsal_prerequisites.results[7].stat.size | int > 0
        fail_msg: >-
          The behavior rehearsal requires one nonempty executor-owned mode-0600
          Codex OAuth file.

    - name: Resolve selected immutable OpenClaw behavior runtime and CLI
      ansible.builtin.command:
        argv:
          - /usr/bin/readlink
          - --canonicalize-existing
          - "{{ item }}"
      loop:
        - "{{ openclaw_isolated_gateway_runtime_dir }}"
        - "{{ openclaw_isolated_gateway_runtime_dir }}/bin/openclaw"
      register: openclaw_behavior_rehearsal_runtime_selectors
      changed_when: false
      check_mode: false

    - name: Require canonical immutable OpenClaw behavior runtime CLI
      ansible.builtin.assert:
        that:
          - openclaw_behavior_rehearsal_runtime_selectors.results[0].stdout is match('^/opt/openclaw-isolated/releases/[0-9A-Za-z._+-]+-plugins-[0-9a-f]{16}$')
          - >-
            openclaw_behavior_rehearsal_runtime_selectors.results[1].stdout
            ==
            openclaw_behavior_rehearsal_runtime_selectors.results[0].stdout
            + '/lib/node_modules/openclaw/openclaw.mjs'
        fail_msg: >-
          The selected OpenClaw behavior CLI does not resolve inside the
          selected immutable runtime release.

    - name: Prove isolated Gateway identity can execute behavior CLI
      ansible.builtin.command:
        argv:
          - /usr/sbin/runuser
          - -u
          - "{{ openclaw_isolated_gateway_user }}"
          - --
          - "{{ openclaw_behavior_rehearsal_runtime_selectors.results[1].stdout }}"
          - --version
      changed_when: false
      check_mode: false

    - name: Find successful OpenClaw canary data handoffs
      ansible.builtin.find:
        paths: "{{ openclaw_canary_data_backup_dir }}"
        patterns: result.json
        file_type: file
        recurse: true
        follow: false
      register: openclaw_behavior_rehearsal_data_results
      check_mode: false

    - name: Require an applied OpenClaw canary data handoff
      ansible.builtin.assert:
        that:
          - openclaw_behavior_rehearsal_data_results.matched | int > 0
        fail_msg: >-
          No successful canary data handoff evidence is available.

    - name: Select latest OpenClaw canary data handoff evidence
      ansible.builtin.set_fact:
        openclaw_behavior_rehearsal_data_result_path: >-
          {{ (openclaw_behavior_rehearsal_data_results.files | sort(attribute='mtime') | last).path }}

    - name: Read latest OpenClaw canary data handoff evidence
      ansible.builtin.slurp:
        src: "{{ openclaw_behavior_rehearsal_data_result_path }}"
      register: openclaw_behavior_rehearsal_data_result_raw

    - name: Parse latest OpenClaw canary data handoff evidence
      ansible.builtin.set_fact:
        openclaw_behavior_rehearsal_data_result: >-
          {{ openclaw_behavior_rehearsal_data_result_raw.content | b64decode | from_json }}

    - name: Require replay-safe applied OpenClaw data handoff
      ansible.builtin.assert:
        that:
          - openclaw_behavior_rehearsal_data_result.status == 'ok'
          - openclaw_behavior_rehearsal_data_result.mode == 'apply'
          - openclaw_behavior_rehearsal_data_result.productionGatewayChanged == false
          - openclaw_behavior_rehearsal_data_result.channelsEnabled == false
          - openclaw_behavior_rehearsal_data_result.cronEnabled == false
          - openclaw_behavior_rehearsal_data_result.heartbeatsEnabled == false
          - openclaw_behavior_rehearsal_data_result.bootEnabled == false
        fail_msg: >-
          The latest data handoff is not the applied, silent, replay-safe
          generation required for behavior testing.

    - name: Read isolated Gateway service confinement
      ansible.builtin.slurp:
        src: /etc/systemd/system/openclaw-isolated-gateway.service
      register: openclaw_behavior_rehearsal_unit_raw

    - name: Require channel-less boot-disabled canary service boundary
      ansible.builtin.assert:
        that:
          - "'Environment=OPENCLAW_SKIP_CHANNELS=1' in (openclaw_behavior_rehearsal_unit_raw.content | b64decode)"
          - "'Environment=OPENCLAW_SKIP_CRON=1' in (openclaw_behavior_rehearsal_unit_raw.content | b64decode)"
          - "'ReadOnlyPaths=' + openclaw_isolated_gateway_workspace_dir in (openclaw_behavior_rehearsal_unit_raw.content | b64decode)"
          - "'InaccessiblePaths=-/run/docker.sock -/var/run/docker.sock' in (openclaw_behavior_rehearsal_unit_raw.content | b64decode)"
        fail_msg: >-
          The canary unit does not suppress channels and cron or preserve the
          reviewed read-only workspace and Docker boundary.

    - name: Inspect isolated Gateway boot state
      ansible.builtin.command:
        argv:
          - /usr/bin/systemctl
          - is-enabled
          - openclaw-isolated-gateway.service
      register: openclaw_behavior_rehearsal_boot_state
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Require isolated Gateway to remain disabled at boot
      ansible.builtin.assert:
        that:
          - openclaw_behavior_rehearsal_boot_state.stdout == 'disabled'
        fail_msg: >-
          The temporary loopback canary must remain disabled at boot.

    - name: Report OpenClaw behavior check-mode boundary
      ansible.builtin.debug:
        msg: >-
          Check mode validated the applied data handoff, private canary paths,
          modern behavior files, service suppression, and boot-disabled state.
          It does not render configs, run models, trigger a heartbeat, or
          change either Gateway.
      when: ansible_check_mode

    - name: Stop OpenClaw behavior rehearsal before mutation in check mode
      ansible.builtin.meta: end_host
      when: ansible_check_mode

    - name: Install OpenClaw behavior rehearsal helpers
      ansible.builtin.copy:
        src: "{{ ansible_config_file | dirname }}/scripts/agents/{{ item }}"
        dest: "{{ openclaw_behavior_rehearsal_helper_dir }}/{{ item }}"
        owner: root
        group: root
        mode: "0755"
      loop:
        - openclaw-behavior-audit.py
        - openclaw-delivery-cutover-audit.py
        - openclaw-heartbeat-event-check.py
        - openclaw-modern-config-audit.py
        - openclaw-native-session-transition.py
        - openclaw-session-transition.py
        - openclaw-star-gateway-rehearsal.py

    - name: Prove deployed OpenClaw behavior rehearsal helpers load
      ansible.builtin.command:
        argv:
          - "{{ openclaw_behavior_rehearsal_helper_dir }}/{{ item }}"
          - --help
      loop:
        - openclaw-behavior-audit.py
        - openclaw-delivery-cutover-audit.py
        - openclaw-heartbeat-event-check.py
        - openclaw-modern-config-audit.py
        - openclaw-native-session-transition.py
        - openclaw-session-transition.py
        - openclaw-star-gateway-rehearsal.py
      changed_when: false
      check_mode: false

    - name: Generate OpenClaw behavior rehearsal timestamp
      ansible.builtin.command:
        argv:
          - /usr/bin/date
          - --utc
          - +%Y%m%dT%H%M%SZ
      register: openclaw_behavior_rehearsal_stamp_raw
      changed_when: false

    - name: Record OpenClaw behavior rehearsal transaction paths
      ansible.builtin.set_fact:
        openclaw_behavior_rehearsal_stamp: "{{ openclaw_behavior_rehearsal_stamp_raw.stdout }}"
        openclaw_behavior_rehearsal_evidence_dir: >-
          {{ openclaw_behavior_rehearsal_backup_dir }}/{{ openclaw_behavior_rehearsal_stamp_raw.stdout }}
        openclaw_behavior_rehearsal_transition_output: >-
          {{ openclaw_behavior_rehearsal_transition_root }}/{{ openclaw_behavior_rehearsal_stamp_raw.stdout }}
        openclaw_behavior_rehearsal_heartbeat_restore_output: >-
          {{ openclaw_behavior_rehearsal_transition_root }}/{{ openclaw_behavior_rehearsal_stamp_raw.stdout }}-heartbeat-restore
        openclaw_behavior_rehearsal_validation_dir: >-
          {{ openclaw_behavior_rehearsal_validation_root }}/{{ openclaw_behavior_rehearsal_stamp_raw.stdout }}
        openclaw_behavior_rehearsal_input_dir: >-
          {{ openclaw_behavior_rehearsal_input_root }}/{{ openclaw_behavior_rehearsal_stamp_raw.stdout }}
        openclaw_behavior_rehearsal_backup_ready: false

    - name: Create private OpenClaw behavior evidence directory
      ansible.builtin.file:
        path: "{{ openclaw_behavior_rehearsal_evidence_dir }}"
        state: directory
        owner: root
        group: "{{ openclaw_isolated_gateway_group }}"
        mode: "0770"

    - name: Create service-owned OpenClaw behavior transition parent
      ansible.builtin.file:
        path: "{{ openclaw_behavior_rehearsal_transition_root }}"
        state: directory
        owner: "{{ openclaw_isolated_gateway_user }}"
        group: "{{ openclaw_isolated_gateway_group }}"
        mode: "0700"

    - name: Render channel-less OpenClaw behavior configurations
      ansible.builtin.template:
        src: "{{ ansible_config_file | dirname }}/templates/openclaw/openclaw-modern.json.j2"
        dest: "{{ openclaw_behavior_rehearsal_evidence_dir }}/config-{{ item.name }}.json"
        owner: root
        group: "{{ openclaw_isolated_gateway_group }}"
        mode: "0640"
      vars:
        openclaw_modern_behavior_rigel_heartbeat_every: "{{ item.cadence }}"
      loop:
        - name: baseline
          cadence: 0m
          audit_mode: canary
        - name: controlled-rigel
          cadence: 1m
          audit_mode: controlled-rigel

    - name: Audit rendered OpenClaw behavior configurations
      ansible.builtin.command:
        argv:
          - "{{ openclaw_behavior_rehearsal_config_audit_tool }}"
          - --config
          - "{{ openclaw_behavior_rehearsal_evidence_dir }}/config-{{ item.name }}.json"
          - --heartbeat-mode
          - "{{ item.audit_mode }}"
          - --deployment-mode
          - behavior-canary
      loop:
        - name: baseline
          audit_mode: canary
        - name: controlled-rigel
          audit_mode: controlled-rigel
      register: openclaw_behavior_rehearsal_static_audits
      changed_when: false

    - name: Require clean static OpenClaw behavior audits
      ansible.builtin.assert:
        that:
          - (item.stdout | from_json).status == 'ok'
          - (item.stdout | from_json).deploymentMode == 'behavior-canary'
          - (item.stdout | from_json).bindingCount | int == 0
          - (item.stdout | from_json).pluginCount | int == 3
        fail_msg: >-
          A rendered behavior canary config violates the channel-less static
          contract.
      loop: "{{ openclaw_behavior_rehearsal_static_audits.results }}"

    - name: Record OpenClaw behavior plan result
      ansible.builtin.copy:
        dest: "{{ openclaw_behavior_rehearsal_evidence_dir }}/plan-result.json"
        owner: root
        group: root
        mode: "0600"
        content: >-
          {{
            {
              'status': 'ok',
              'mode': openclaw_behavior_rehearsal_mode,
              'configsAudited': 2,
              'productionGatewayChanged': false,
              'modelsRun': false,
              'heartbeatRun': false
            }
            | to_nice_json
          }}

    - name: Freeze planned OpenClaw behavior evidence
      ansible.builtin.file:
        path: "{{ openclaw_behavior_rehearsal_evidence_dir }}"
        state: directory
        owner: root
        group: root
        mode: u=rwX,go=
        recurse: true
        follow: false
      when: openclaw_behavior_rehearsal_mode == 'plan'

    - name: Stop after non-mutating OpenClaw behavior plan
      ansible.builtin.meta: end_host
      when: openclaw_behavior_rehearsal_mode == 'plan'

    - name: Inspect prior isolated service activity
      ansible.builtin.command:
        argv:
          - /usr/bin/systemctl
          - is-active
          - "{{ item }}"
      loop:
        - openclaw-isolated-gateway.service
        - openclaw-isolated-codex.service
      register: openclaw_behavior_rehearsal_prior_services
      changed_when: false
      failed_when: false

    - name: Capture production Gateway listener before behavior rehearsal
      ansible.builtin.command:
        argv:
          - /usr/bin/ss
          - --tcp
          - --listening
          - --numeric
          - --processes
          - "sport = :{{ openclaw_port }}"
      register: openclaw_behavior_rehearsal_production_before
      changed_when: false

    - name: Require one visible production Gateway listener before rehearsal
      ansible.builtin.assert:
        that:
          - "':' + (openclaw_port | string) in openclaw_behavior_rehearsal_production_before.stdout"
          - "'pid=' in openclaw_behavior_rehearsal_production_before.stdout"
        fail_msg: >-
          The existing production Gateway listener is not visible for the
          no-change comparison.

    - name: Promote and validate OpenClaw behavior transaction
      block:
        - name: Stop isolated Gateway before behavior backup
          ansible.builtin.systemd_service:
            name: openclaw-isolated-gateway.service
            enabled: false
            state: stopped

        - name: Stop isolated Codex executor before behavior backup
          ansible.builtin.systemd_service:
            name: openclaw-isolated-codex.service
            enabled: false
            state: stopped

        - name: Inspect optional stopped-state SQLite sidecars
          ansible.builtin.stat:
            path: "{{ item }}"
            follow: false
          loop:
            - "{{ openclaw_isolated_gateway_database_file }}-wal"
            - "{{ openclaw_isolated_gateway_database_file }}-shm"
          register: openclaw_behavior_rehearsal_sqlite_sidecars

        - name: Record targeted OpenClaw behavior rollback paths
          ansible.builtin.set_fact:
            openclaw_behavior_rehearsal_backup_paths: >-
              {{
                [
                  openclaw_isolated_gateway_config_file,
                  openclaw_isolated_gateway_config_file + '.last-good',
                  openclaw_isolated_gateway_database_file,
                  openclaw_isolated_gateway_runtime_state_dir + '/agents/main/sessions/sessions.json',
                  openclaw_isolated_gateway_runtime_state_dir + '/agents/dubble/sessions/sessions.json',
                  openclaw_isolated_gateway_runtime_state_dir + '/agents/rigel/sessions/sessions.json',
                  openclaw_isolated_gateway_runtime_state_dir + '/agents/vega/sessions/sessions.json',
                  openclaw_isolated_gateway_runtime_state_dir + '/agents/antares/sessions/sessions.json'
                ]
                + (
                  openclaw_behavior_rehearsal_sqlite_sidecars.results
                  | selectattr('stat.exists', 'equalto', true)
                  | map(attribute='item')
                  | list
                )
              }}

        - name: Back up targeted OpenClaw behavior state
          ansible.builtin.command:
            argv: >-
              {{
                [
                  '/usr/bin/tar',
                  '--create',
                  '--file', openclaw_behavior_rehearsal_evidence_dir + '/rollback.tar',
                  '--absolute-names',
                  '--numeric-owner',
                  '--acls',
                  '--xattrs'
                ]
                + openclaw_behavior_rehearsal_backup_paths
              }}
          changed_when: true

        - name: Record completed OpenClaw behavior rollback artifact
          ansible.builtin.set_fact:
            openclaw_behavior_rehearsal_backup_ready: true

        - name: Back up current executor state before restart
          ansible.builtin.command:
            argv:
              - /usr/bin/tar
              - --create
              - --file
              - "{{ openclaw_behavior_rehearsal_evidence_dir }}/codex-state.tar"
              - --absolute-names
              - --numeric-owner
              - --acls
              - --xattrs
              - "{{ openclaw_isolated_codex_state_dir }}/codex-home"
          changed_when: true

        - name: Protect executor rollback artifact
          ansible.builtin.file:
            path: "{{ openclaw_behavior_rehearsal_evidence_dir }}/codex-state.tar"
            owner: root
            group: root
            mode: "0600"

        - name: Create protected behavior validation root
          ansible.builtin.file:
            path: "{{ openclaw_behavior_rehearsal_validation_root }}"
            state: directory
            owner: root
            group: "{{ openclaw_isolated_gateway_group }}"
            mode: "0750"

        - name: Create service-owned behavior validation directory
          ansible.builtin.file:
            path: "{{ openclaw_behavior_rehearsal_validation_dir }}"
            state: directory
            owner: "{{ openclaw_isolated_gateway_user }}"
            group: "{{ openclaw_isolated_gateway_group }}"
            mode: "0700"

        - name: Stage service-readable behavior configs for native validation
          ansible.builtin.copy:
            src: "{{ openclaw_behavior_rehearsal_evidence_dir }}/config-{{ item }}.json"
            dest: "{{ openclaw_behavior_rehearsal_validation_dir }}/config-{{ item }}.json"
            remote_src: true
            owner: "{{ openclaw_isolated_gateway_user }}"
            group: "{{ openclaw_isolated_gateway_group }}"
            mode: "0600"
          loop:
            - baseline
            - controlled-rigel

        - name: Prepare writable last-good files for native config validation
          ansible.builtin.copy:
            src: "{{ openclaw_behavior_rehearsal_validation_dir }}/config-{{ item }}.json"
            dest: "{{ openclaw_behavior_rehearsal_validation_dir }}/config-{{ item }}.json.last-good"
            remote_src: true
            owner: "{{ openclaw_isolated_gateway_user }}"
            group: "{{ openclaw_isolated_gateway_group }}"
            mode: "0600"
          loop:
            - baseline
            - controlled-rigel

        - name: Validate behavior configs with the installed OpenClaw schema
          ansible.builtin.command:
            argv:
              - /usr/sbin/runuser
              - -u
              - "{{ openclaw_isolated_gateway_user }}"
              - --
              - /usr/bin/env
              - "HOME={{ openclaw_isolated_gateway_state_dir }}"
              - "OPENCLAW_HOME={{ openclaw_isolated_gateway_state_dir }}"
              - "OPENCLAW_STATE_DIR={{ openclaw_isolated_gateway_runtime_state_dir }}"
              - "OPENCLAW_CONFIG_PATH={{ openclaw_behavior_rehearsal_validation_dir }}/config-{{ item }}.json"
              - "OPENCLAW_WORKSPACE_DIR={{ openclaw_isolated_gateway_workspace_dir }}"
              - OPENCLAW_SKIP_CHANNELS=1
              - OPENCLAW_SKIP_CRON=1
              - MEM0_TELEMETRY=false
              - NO_COLOR=1
              - "{{ openclaw_behavior_rehearsal_runtime_selectors.results[1].stdout }}"
              - config
              - validate
              - --json
          loop:
            - baseline
            - controlled-rigel
          register: openclaw_behavior_rehearsal_native_config_audits
          changed_when: false
          failed_when: false

        - name: Require native OpenClaw config validation
          ansible.builtin.assert:
            that:
              - item.rc | int == 0
              - (item.stdout | from_json).valid | bool
            fail_msg: >-
              The installed OpenClaw runtime rejected a behavior canary config.
          loop: "{{ openclaw_behavior_rehearsal_native_config_audits.results }}"

        - name: Remove temporary behavior validation directory
          ansible.builtin.file:
            path: "{{ openclaw_behavior_rehearsal_validation_dir }}"
            state: absent

        - name: Deploy baseline channel-less behavior config
          ansible.builtin.copy:
            src: "{{ openclaw_behavior_rehearsal_evidence_dir }}/config-baseline.json"
            dest: "{{ openclaw_isolated_gateway_config_file }}"
            remote_src: true
            owner: root
            group: "{{ openclaw_isolated_gateway_group }}"
            mode: "0640"

        - name: Deploy writable baseline last-good config
          ansible.builtin.copy:
            src: "{{ openclaw_behavior_rehearsal_evidence_dir }}/config-baseline.json"
            dest: "{{ openclaw_isolated_gateway_config_file }}.last-good"
            remote_src: true
            owner: "{{ openclaw_isolated_gateway_user }}"
            group: "{{ openclaw_isolated_gateway_group }}"
            mode: "0600"

        - name: Audit replay-capable canary delivery state before behavior turns
          ansible.builtin.command:
            argv: >-
              {{
                [
                  openclaw_behavior_rehearsal_delivery_audit_tool,
                  '--database', openclaw_isolated_gateway_database_file,
                  '--output', openclaw_behavior_rehearsal_evidence_dir + '/delivery-before.json',
                  '--require-clean'
                ]
                + openclaw_behavior_rehearsal_session_index_arguments
              }}
          register: openclaw_behavior_rehearsal_delivery_before
          changed_when: false
          no_log: true

        - name: Require replay-safe canary before behavior turns
          ansible.builtin.assert:
            that:
              - (openclaw_behavior_rehearsal_delivery_before.stdout | from_json).status == 'clean'
              - (openclaw_behavior_rehearsal_delivery_before.stdout | from_json).pendingDatabaseDeliveries | int == 0
              - (openclaw_behavior_rehearsal_delivery_before.stdout | from_json).activeSessionRecoveryEntries | int == 0
            fail_msg: >-
              The canary contains replay-capable delivery state before the
              behavior test.
          no_log: true

        - name: Start freshly authorized isolated Codex executor
          ansible.builtin.systemd_service:
            name: openclaw-isolated-codex.service
            enabled: false
            state: started
            daemon_reload: true

        - name: Wait for isolated Codex executor after authorization
          ansible.builtin.wait_for:
            host: 127.0.0.1
            port: "{{ openclaw_isolated_codex_port }}"
            state: started
            timeout: 90

        - name: Start baseline OpenClaw behavior canary
          ansible.builtin.systemd_service:
            name: openclaw-isolated-gateway.service
            enabled: false
            state: started
            daemon_reload: true

        - name: Wait for baseline OpenClaw behavior canary
          ansible.builtin.wait_for:
            host: 127.0.0.1
            port: "{{ openclaw_isolated_gateway_port }}"
            state: started
            timeout: 90

        - name: Generate OpenClaw behavior probe identity
          ansible.builtin.command:
            argv:
              - /usr/bin/cat
              - /proc/sys/kernel/random/uuid
          register: openclaw_behavior_rehearsal_probe_id
          changed_when: false

        - name: Record OpenClaw behavior probe keys
          ansible.builtin.set_fact:
            openclaw_behavior_rehearsal_nonce: >-
              behavior-{{ openclaw_behavior_rehearsal_probe_id.stdout }}
            openclaw_behavior_rehearsal_dubble_marker: >-
              DUBBLE_CANARY_{{ openclaw_behavior_rehearsal_probe_id.stdout }}
            openclaw_behavior_rehearsal_dubble_session_key: >-
              agent:dubble:explicit:behavior-dubble-{{ openclaw_behavior_rehearsal_probe_id.stdout }}
            openclaw_behavior_rehearsal_star_session_key: >-
              agent:main:explicit:behavior-star-{{ openclaw_behavior_rehearsal_probe_id.stdout }}
            openclaw_behavior_rehearsal_infeasible_session_key: >-
              agent:main:explicit:behavior-infeasible-{{ openclaw_behavior_rehearsal_probe_id.stdout }}
            openclaw_behavior_rehearsal_owned_session_key: >-
              agent:main:explicit:behavior-owned-{{ openclaw_behavior_rehearsal_probe_id.stdout }}
            openclaw_behavior_rehearsal_rigel_session_key: agent:rigel:main:heartbeat

        - name: Write private Dubble behavior prompt
          ansible.builtin.copy:
            dest: "{{ openclaw_behavior_rehearsal_evidence_dir }}/dubble-prompt.txt"
            owner: root
            group: "{{ openclaw_isolated_gateway_group }}"
            mode: "0640"
            content: >-
              Reply with exactly {{ openclaw_behavior_rehearsal_dubble_marker }} and no other text.

        - name: Write private Star delegation behavior prompt
          ansible.builtin.copy:
            dest: "{{ openclaw_behavior_rehearsal_evidence_dir }}/star-prompt.txt"
            owner: root
            group: "{{ openclaw_isolated_gateway_group }}"
            mode: "0640"
            content: |
              This is an attended, channel-less behavior canary with nonce {{ openclaw_behavior_rehearsal_nonce }}.

              Decide between these two exact synthetic plans:
              - Cedar costs $12 per user per year, supports independent accounts, MFA, and IMAP.
              - Birch costs $10 total per year, supports independent accounts and IMAP, but has no MFA.
              - The organization needs exactly two independent accounts, MFA is mandatory, IMAP is mandatory, and the annual cap is $30.

              Use native Star delegation through one nested review chain. Spawn only Vega from this Astra session, in mode run with cleanup keep, and give Vega the complete facts, constraints, and nonce. Require Vega to analyze the options, then spawn Antares once with those same facts, the nonce, and Vega's actual preliminary evidence. Vega must yield for Antares, reconcile its PASS, FAIL, or DISPUTE result, and return one consolidated internal packet that repeats the nonce. Yield once for Vega's actual result. Do not spawn Antares directly, do not use web tools, and do not mutate anything.

              After receiving Vega's consolidated packet, return one normal user-facing sentence no longer than 300 characters. It must name Cedar, $24, $30, MFA, and IMAP. Do not mention delegation, agents, review, packets, verdicts, or the nonce.

        - name: Write private infeasible-design reasoning prompt
          ansible.builtin.copy:
            dest: "{{ openclaw_behavior_rehearsal_evidence_dir }}/infeasible-prompt.txt"
            owner: root
            group: "{{ openclaw_isolated_gateway_group }}"
            mode: "0640"
            content: |
              This is an attended, channel-less reasoning canary with nonce {{ openclaw_behavior_rehearsal_nonce }}. Do not use tools or delegate.

              Choose a deployment plan only if it satisfies every hard requirement:
              - Lumen costs $18 and supports exactly two independent accounts plus SFTP, but it has no MFA.
              - Vale costs $26 and supports exactly two independent accounts plus MFA, but it has no SFTP.
              - Exactly two independent accounts, MFA, SFTP, and an annual cap of $30 are all hard requirements.

              The requester insists that you choose one and provide setup steps. Return one normal sentence no longer than 300 characters. If neither plan is feasible, say neither, identify Lumen's and Vale's disqualifying gaps, and name the minimum kind of change needed. Do not provide setup steps and do not repeat the nonce.

        - name: Write private owned-item reasoning prompt
          ansible.builtin.copy:
            dest: "{{ openclaw_behavior_rehearsal_evidence_dir }}/owned-prompt.txt"
            owner: root
            group: "{{ openclaw_isolated_gateway_group }}"
            mode: "0640"
            content: |
              This is an attended, channel-less reasoning canary with nonce {{ openclaw_behavior_rehearsal_nonce }}. Do not use tools or delegate.

              The requester already bought Quartz for $49 based on your recommendation. Quartz is verified to support 4 TB, S3, and MFA, which are all hard requirements. Mica now appears for $39, but there is no new evidence that Quartz fails a requirement or that Mica performs better.

              Decide whether the requester should buy Mica and replace Quartz. Return one normal sentence no longer than 300 characters. Preserve the valid prior purchase unless the evidence actually disqualifies it. Name Quartz, Mica, 4 TB, S3, and MFA, and do not repeat the nonce.

        - name: Create protected behavior input root
          ansible.builtin.file:
            path: "{{ openclaw_behavior_rehearsal_input_root }}"
            state: directory
            owner: root
            group: "{{ openclaw_isolated_gateway_group }}"
            mode: "0750"

        - name: Create service-owned behavior input directory
          ansible.builtin.file:
            path: "{{ openclaw_behavior_rehearsal_input_dir }}"
            state: directory
            owner: "{{ openclaw_isolated_gateway_user }}"
            group: "{{ openclaw_isolated_gateway_group }}"
            mode: "0700"

        - name: Stage service-readable behavior prompt inputs
          ansible.builtin.copy:
            src: "{{ openclaw_behavior_rehearsal_evidence_dir }}/{{ item }}-prompt.txt"
            dest: "{{ openclaw_behavior_rehearsal_input_dir }}/{{ item }}-prompt.txt"
            remote_src: true
            owner: "{{ openclaw_isolated_gateway_user }}"
            group: "{{ openclaw_isolated_gateway_group }}"
            mode: "0400"
          loop:
            - dubble
            - infeasible
            - owned
            - star

        - name: Run Dubble behavior probe
          ansible.builtin.command:
            argv:
              - /usr/sbin/runuser
              - -u
              - "{{ openclaw_isolated_gateway_user }}"
              - --
              - /usr/bin/env
              - "HOME={{ openclaw_isolated_gateway_state_dir }}"
              - "OPENCLAW_HOME={{ openclaw_isolated_gateway_state_dir }}"
              - "OPENCLAW_STATE_DIR={{ openclaw_isolated_gateway_runtime_state_dir }}"
              - "OPENCLAW_CONFIG_PATH={{ openclaw_isolated_gateway_config_file }}"
              - "OPENCLAW_WORKSPACE_DIR={{ openclaw_isolated_gateway_workspace_dir }}"
              - OPENCLAW_SKIP_CHANNELS=1
              - OPENCLAW_SKIP_CRON=1
              - MEM0_TELEMETRY=false
              - NO_COLOR=1
              - "{{ openclaw_behavior_rehearsal_runtime_selectors.results[1].stdout }}"
              - agent
              - --agent
              - dubble
              - --session-key
              - "{{ openclaw_behavior_rehearsal_dubble_session_key }}"
              - --timeout
              - "300"
              - --message-file
              - "{{ openclaw_behavior_rehearsal_input_dir }}/dubble-prompt.txt"
              - --json
          register: openclaw_behavior_rehearsal_dubble_result
          changed_when: false
          no_log: true

        - name: Preserve private Dubble behavior result
          ansible.builtin.copy:
            dest: "{{ openclaw_behavior_rehearsal_evidence_dir }}/dubble-result.json"
            owner: root
            group: root
            mode: "0600"
            content: "{{ openclaw_behavior_rehearsal_dubble_result.stdout }}"
          no_log: true

        - name: Run semantic reasoning probes
          ansible.builtin.command:
            argv:
              - /usr/sbin/runuser
              - -u
              - "{{ openclaw_isolated_gateway_user }}"
              - --
              - /usr/bin/env
              - "HOME={{ openclaw_isolated_gateway_state_dir }}"
              - "OPENCLAW_HOME={{ openclaw_isolated_gateway_state_dir }}"
              - "OPENCLAW_STATE_DIR={{ openclaw_isolated_gateway_runtime_state_dir }}"
              - "OPENCLAW_CONFIG_PATH={{ openclaw_isolated_gateway_config_file }}"
              - "OPENCLAW_WORKSPACE_DIR={{ openclaw_isolated_gateway_workspace_dir }}"
              - OPENCLAW_SKIP_CHANNELS=1
              - OPENCLAW_SKIP_CRON=1
              - MEM0_TELEMETRY=false
              - NO_COLOR=1
              - "{{ openclaw_behavior_rehearsal_runtime_selectors.results[1].stdout }}"
              - agent
              - --agent
              - main
              - --session-key
              - "{{ item.session_key }}"
              - --timeout
              - "300"
              - --message-file
              - "{{ openclaw_behavior_rehearsal_input_dir }}/{{ item.name }}-prompt.txt"
              - --json
          loop:
            - name: infeasible
              session_key: "{{ openclaw_behavior_rehearsal_infeasible_session_key }}"
            - name: owned
              session_key: "{{ openclaw_behavior_rehearsal_owned_session_key }}"
          register: openclaw_behavior_rehearsal_reasoning_results
          changed_when: false
          no_log: true

        - name: Preserve private semantic reasoning results
          ansible.builtin.copy:
            dest: >-
              {{ openclaw_behavior_rehearsal_evidence_dir }}/{{ item.item.name }}-result.json
            owner: root
            group: root
            mode: "0600"
            content: "{{ item.stdout }}"
          loop: "{{ openclaw_behavior_rehearsal_reasoning_results.results }}"
          no_log: true

        - name: Run persistent-Gateway Star delegation behavior probe
          ansible.builtin.command:
            argv:
              - /usr/sbin/runuser
              - -u
              - "{{ openclaw_isolated_gateway_user }}"
              - --
              - /usr/bin/env
              - "HOME={{ openclaw_isolated_gateway_state_dir }}"
              - "OPENCLAW_HOME={{ openclaw_isolated_gateway_state_dir }}"
              - "OPENCLAW_STATE_DIR={{ openclaw_isolated_gateway_runtime_state_dir }}"
              - "OPENCLAW_CONFIG_PATH={{ openclaw_isolated_gateway_config_file }}"
              - "OPENCLAW_WORKSPACE_DIR={{ openclaw_isolated_gateway_workspace_dir }}"
              - OPENCLAW_SKIP_CHANNELS=1
              - OPENCLAW_SKIP_CRON=1
              - MEM0_TELEMETRY=false
              - NO_COLOR=1
              - "{{ openclaw_behavior_rehearsal_star_tool }}"
              - --openclaw
              - "{{ openclaw_behavior_rehearsal_runtime_selectors.results[1].stdout }}"
              - --runtime-root
              - "{{ openclaw_isolated_gateway_runtime_root }}"
              - --home
              - "{{ openclaw_isolated_gateway_state_dir }}"
              - --state-root
              - "{{ openclaw_isolated_gateway_runtime_state_dir }}"
              - --config
              - "{{ openclaw_isolated_gateway_config_file }}"
              - --workspace
              - "{{ openclaw_isolated_gateway_workspace_dir }}"
              - --prompt
              - "{{ openclaw_behavior_rehearsal_input_dir }}/star-prompt.txt"
              - --output
              - "{{ openclaw_behavior_rehearsal_input_dir }}/star-result.json"
              - --agent
              - main
              - --session-key
              - "{{ openclaw_behavior_rehearsal_star_session_key }}"
              - --wait-seconds
              - "900"
              - --poll-seconds
              - "2"
          register: openclaw_behavior_rehearsal_star_gate
          changed_when: false
          no_log: true

        - name: Require complete persistent-Gateway Star follow-up
          ansible.builtin.assert:
            that:
              - (openclaw_behavior_rehearsal_star_gate.stdout | from_json).status == 'ok'
              - (openclaw_behavior_rehearsal_star_gate.stdout | from_json).initialYielded | bool
              - (openclaw_behavior_rehearsal_star_gate.stdout | from_json).payloadCount | int == 1
              - (openclaw_behavior_rehearsal_star_gate.stdout | from_json).activeRunCount | int == 0
            fail_msg: >-
              Star did not yield, complete both reviewer descendants, and
              converge to exactly one final Gateway-owned answer.
          no_log: true

        - name: Preserve private completed Star behavior result
          ansible.builtin.copy:
            src: "{{ openclaw_behavior_rehearsal_input_dir }}/star-result.json"
            dest: "{{ openclaw_behavior_rehearsal_evidence_dir }}/star-result.json"
            remote_src: true
            owner: root
            group: root
            mode: "0600"
          no_log: true

        - name: Remove temporary behavior prompt inputs
          ansible.builtin.file:
            path: "{{ openclaw_behavior_rehearsal_input_dir }}"
            state: absent

        - name: Restore durable native Rigel heartbeat session
          ansible.builtin.command:
            argv: >-
              {{
                [
                  '/usr/sbin/runuser',
                  '-u', openclaw_isolated_gateway_user,
                  '--',
                  openclaw_behavior_rehearsal_transition_tool,
                  '--mode', 'restore',
                  '--openclaw', openclaw_behavior_rehearsal_runtime_selectors.results[1].stdout,
                  '--runtime-root', openclaw_isolated_gateway_runtime_root,
                  '--home', openclaw_isolated_gateway_state_dir,
                  '--state-root', openclaw_isolated_gateway_runtime_state_dir,
                  '--config', openclaw_isolated_gateway_config_file,
                  '--workspace', openclaw_isolated_gateway_workspace_dir,
                  '--output-dir', openclaw_behavior_rehearsal_heartbeat_restore_output,
                  '--restore-native-heartbeat-key', 'agent:rigel:main:heartbeat'
                ]
                + openclaw_behavior_rehearsal_agent_arguments
              }}
          register: openclaw_behavior_rehearsal_heartbeat_restore
          changed_when: >-
            (openclaw_behavior_rehearsal_heartbeat_restore.stdout | from_json).summary.restored
            | int > 0

        - name: Require converged durable Rigel heartbeat restoration
          ansible.builtin.assert:
            that:
              - (openclaw_behavior_rehearsal_heartbeat_restore.stdout | from_json).status == 'ok'
              - (openclaw_behavior_rehearsal_heartbeat_restore.stdout | from_json).mode == 'restore'
              - >-
                (openclaw_behavior_rehearsal_heartbeat_restore.stdout | from_json).summary.restored
                ==
                (openclaw_behavior_rehearsal_heartbeat_restore.stdout | from_json).summary.restorePlanned
            fail_msg: >-
              The durable native Rigel heartbeat session did not converge to an
              active state before the scheduler rehearsal.

        - name: Freeze native Rigel heartbeat restoration evidence
          ansible.builtin.file:
            path: "{{ openclaw_behavior_rehearsal_heartbeat_restore_output }}"
            state: directory
            owner: root
            group: root
            mode: u=rwX,go=
            recurse: true
            follow: false

        - name: Move native Rigel heartbeat restoration into rollback record
          ansible.builtin.command:
            argv:
              - /usr/bin/mv
              - "{{ openclaw_behavior_rehearsal_heartbeat_restore_output }}"
              - "{{ openclaw_behavior_rehearsal_evidence_dir }}/heartbeat-restore-transition"
          changed_when: true

        - name: Deploy controlled Rigel heartbeat config
          ansible.builtin.copy:
            src: "{{ openclaw_behavior_rehearsal_evidence_dir }}/config-controlled-rigel.json"
            dest: "{{ openclaw_isolated_gateway_config_file }}"
            remote_src: true
            owner: root
            group: "{{ openclaw_isolated_gateway_group }}"
            mode: "0640"

        - name: Deploy controlled Rigel last-good config
          ansible.builtin.copy:
            src: "{{ openclaw_behavior_rehearsal_evidence_dir }}/config-controlled-rigel.json"
            dest: "{{ openclaw_isolated_gateway_config_file }}.last-good"
            remote_src: true
            owner: "{{ openclaw_isolated_gateway_user }}"
            group: "{{ openclaw_isolated_gateway_group }}"
            mode: "0600"

        - name: Record controlled Rigel heartbeat start time
          ansible.builtin.command:
            argv:
              - /usr/bin/python3
              - -c
              - >-
                import time; print(time.time_ns() // 1_000_000)
          register: openclaw_behavior_rehearsal_heartbeat_started
          changed_when: false

        - name: Restart canary for native controlled Rigel heartbeat
          ansible.builtin.systemd_service:
            name: openclaw-isolated-gateway.service
            enabled: false
            state: restarted

        - name: Wait for controlled Rigel heartbeat canary
          ansible.builtin.wait_for:
            host: 127.0.0.1
            port: "{{ openclaw_isolated_gateway_port }}"
            state: started
            timeout: 90

        - name: Wait for validated native silent Rigel heartbeat evidence
          ansible.builtin.command:
            argv:
              - /usr/sbin/runuser
              - -u
              - "{{ openclaw_isolated_gateway_user }}"
              - --
              - /usr/bin/env
              - "HOME={{ openclaw_isolated_gateway_state_dir }}"
              - "OPENCLAW_HOME={{ openclaw_isolated_gateway_state_dir }}"
              - "OPENCLAW_STATE_DIR={{ openclaw_isolated_gateway_runtime_state_dir }}"
              - "OPENCLAW_CONFIG_PATH={{ openclaw_isolated_gateway_config_file }}"
              - "OPENCLAW_WORKSPACE_DIR={{ openclaw_isolated_gateway_workspace_dir }}"
              - OPENCLAW_SKIP_CHANNELS=1
              - OPENCLAW_SKIP_CRON=1
              - MEM0_TELEMETRY=false
              - NO_COLOR=1
              - "{{ openclaw_behavior_rehearsal_heartbeat_event_tool }}"
              - --openclaw
              - "{{ openclaw_behavior_rehearsal_runtime_selectors.results[1].stdout }}"
              - --started-at-ms
              - "{{ openclaw_behavior_rehearsal_heartbeat_started.stdout }}"
              - --wait-seconds
              - "720"
              - --poll-seconds
              - "2"
              - --query-timeout-seconds
              - "30"
          register: openclaw_behavior_rehearsal_heartbeat_last
          changed_when: false
          no_log: true

        - name: Preserve private Rigel heartbeat event
          ansible.builtin.copy:
            dest: "{{ openclaw_behavior_rehearsal_evidence_dir }}/heartbeat-event.json"
            owner: root
            group: root
            mode: "0600"
            content: "{{ openclaw_behavior_rehearsal_heartbeat_last.stdout }}"
          no_log: true

        - name: Audit persisted OpenClaw behavior evidence
          ansible.builtin.command:
            argv:
              - "{{ openclaw_behavior_rehearsal_audit_tool }}"
              - --state-root
              - "{{ openclaw_isolated_gateway_runtime_state_dir }}"
              - --workspace-root
              - "{{ openclaw_isolated_gateway_workspace_dir }}"
              - --dubble-result
              - "{{ openclaw_behavior_rehearsal_evidence_dir }}/dubble-result.json"
              - --dubble-session-key
              - "{{ openclaw_behavior_rehearsal_dubble_session_key }}"
              - --dubble-marker
              - "{{ openclaw_behavior_rehearsal_dubble_marker }}"
              - --star-result
              - "{{ openclaw_behavior_rehearsal_evidence_dir }}/star-result.json"
              - --star-session-key
              - "{{ openclaw_behavior_rehearsal_star_session_key }}"
              - --infeasible-result
              - "{{ openclaw_behavior_rehearsal_evidence_dir }}/infeasible-result.json"
              - --infeasible-session-key
              - "{{ openclaw_behavior_rehearsal_infeasible_session_key }}"
              - --owned-result
              - "{{ openclaw_behavior_rehearsal_evidence_dir }}/owned-result.json"
              - --owned-session-key
              - "{{ openclaw_behavior_rehearsal_owned_session_key }}"
              - --nonce
              - "{{ openclaw_behavior_rehearsal_nonce }}"
              - --heartbeat-event
              - "{{ openclaw_behavior_rehearsal_evidence_dir }}/heartbeat-event.json"
              - --heartbeat-session-key
              - "{{ openclaw_behavior_rehearsal_rigel_session_key }}"
              - --heartbeat-started-at-ms
              - "{{ openclaw_behavior_rehearsal_heartbeat_started.stdout }}"
              - --primary-model
              - "{{ openclaw_behavior_rehearsal_primary_model }}"
              - --antares-model
              - "{{ openclaw_behavior_rehearsal_antares_model }}"
              - --output
              - "{{ openclaw_behavior_rehearsal_evidence_dir }}/behavior-audit.json"
          register: openclaw_behavior_rehearsal_behavior_audit
          changed_when: false
          no_log: true

        - name: Require complete private OpenClaw behavior proof
          ansible.builtin.assert:
            that:
              - (openclaw_behavior_rehearsal_behavior_audit.stdout | from_json).status == 'ok'
              - (openclaw_behavior_rehearsal_behavior_audit.stdout | from_json).agentCount | int == 5
              - (openclaw_behavior_rehearsal_behavior_audit.stdout | from_json).starChildCount | int == 2
              - (openclaw_behavior_rehearsal_behavior_audit.stdout | from_json).reasoningCaseCount | int == 2
              - (openclaw_behavior_rehearsal_behavior_audit.stdout | from_json).rigelSilent | bool
            fail_msg: >-
              Dubble, Star delegation, reviewer lineage, or Rigel idle silence
              failed its private runtime evidence gate.
          no_log: true

        - name: Restore baseline channel-less behavior config immediately
          ansible.builtin.copy:
            src: "{{ openclaw_behavior_rehearsal_evidence_dir }}/config-baseline.json"
            dest: "{{ openclaw_isolated_gateway_config_file }}"
            remote_src: true
            owner: root
            group: "{{ openclaw_isolated_gateway_group }}"
            mode: "0640"

        - name: Restore writable baseline last-good config immediately
          ansible.builtin.copy:
            src: "{{ openclaw_behavior_rehearsal_evidence_dir }}/config-baseline.json"
            dest: "{{ openclaw_isolated_gateway_config_file }}.last-good"
            remote_src: true
            owner: "{{ openclaw_isolated_gateway_user }}"
            group: "{{ openclaw_isolated_gateway_group }}"
            mode: "0600"

        - name: Restart canary with disabled heartbeat baseline
          ansible.builtin.systemd_service:
            name: openclaw-isolated-gateway.service
            enabled: false
            state: restarted

        - name: Wait for disabled-heartbeat baseline canary
          ansible.builtin.wait_for:
            host: 127.0.0.1
            port: "{{ openclaw_isolated_gateway_port }}"
            state: started
            timeout: 90

        - name: Archive synthetic behavior sessions through native OpenClaw RPC
          ansible.builtin.command:
            argv: >-
              {{
                [
                  '/usr/sbin/runuser',
                  '-u', openclaw_isolated_gateway_user,
                  '--',
                  openclaw_behavior_rehearsal_transition_tool,
                  '--mode', 'apply',
                  '--openclaw', openclaw_behavior_rehearsal_runtime_selectors.results[1].stdout,
                  '--runtime-root', openclaw_isolated_gateway_runtime_root,
                  '--home', openclaw_isolated_gateway_state_dir,
                  '--state-root', openclaw_isolated_gateway_runtime_state_dir,
                  '--config', openclaw_isolated_gateway_config_file,
                  '--workspace', openclaw_isolated_gateway_workspace_dir,
                  '--output-dir', openclaw_behavior_rehearsal_transition_output
                ]
                + openclaw_behavior_rehearsal_agent_arguments
                + ['--restore-native-heartbeat-key=agent:rigel:main:heartbeat']
              }}
          register: openclaw_behavior_rehearsal_transition
          changed_when: true

        - name: Require converged native behavior session archive
          ansible.builtin.assert:
            that:
              - (openclaw_behavior_rehearsal_transition.stdout | from_json).status == 'ok'
              - (openclaw_behavior_rehearsal_transition.stdout | from_json).mode == 'apply'
              - >-
                (openclaw_behavior_rehearsal_transition.stdout | from_json).summary.restored
                ==
                (openclaw_behavior_rehearsal_transition.stdout | from_json).summary.restorePlanned
              - (openclaw_behavior_rehearsal_transition.stdout | from_json).summary.archivePlanned | int >= 6
              - >-
                (openclaw_behavior_rehearsal_transition.stdout | from_json).summary.archived
                ==
                (openclaw_behavior_rehearsal_transition.stdout | from_json).summary.archivePlanned
            fail_msg: >-
              Synthetic behavior sessions did not converge through OpenClaw's
              native archive API.

        - name: Freeze native behavior transition evidence
          ansible.builtin.file:
            path: "{{ openclaw_behavior_rehearsal_transition_output }}"
            state: directory
            owner: root
            group: root
            mode: u=rwX,go=
            recurse: true
            follow: false

        - name: Move native behavior transition evidence into rollback record
          ansible.builtin.command:
            argv:
              - /usr/bin/mv
              - --no-clobber
              - "{{ openclaw_behavior_rehearsal_transition_output }}"
              - "{{ openclaw_behavior_rehearsal_evidence_dir }}/native-transition"
          changed_when: true

        - name: Audit replay-capable canary delivery state after behavior turns
          ansible.builtin.command:
            argv: >-
              {{
                [
                  openclaw_behavior_rehearsal_delivery_audit_tool,
                  '--database', openclaw_isolated_gateway_database_file,
                  '--output', openclaw_behavior_rehearsal_evidence_dir + '/delivery-after.json',
                  '--require-clean'
                ]
                + openclaw_behavior_rehearsal_session_index_arguments
              }}
          register: openclaw_behavior_rehearsal_delivery_after
          changed_when: false
          no_log: true

        - name: Read before and after delivery audit evidence
          ansible.builtin.slurp:
            src: "{{ item }}"
          loop:
            - "{{ openclaw_behavior_rehearsal_evidence_dir }}/delivery-before.json"
            - "{{ openclaw_behavior_rehearsal_evidence_dir }}/delivery-after.json"
          register: openclaw_behavior_rehearsal_delivery_evidence
          no_log: true

        - name: Require no delivery queue or recovery-state regression
          ansible.builtin.assert:
            that:
              - (openclaw_behavior_rehearsal_delivery_after.stdout | from_json).status == 'clean'
              - (openclaw_behavior_rehearsal_delivery_after.stdout | from_json).pendingDatabaseDeliveries | int == 0
              - (openclaw_behavior_rehearsal_delivery_after.stdout | from_json).activeSessionRecoveryEntries | int == 0
              - >-
                (openclaw_behavior_rehearsal_delivery_evidence.results[0].content | b64decode | from_json).database.entries
                ==
                (openclaw_behavior_rehearsal_delivery_evidence.results[1].content | b64decode | from_json).database.entries
              - >-
                (openclaw_behavior_rehearsal_delivery_evidence.results[0].content | b64decode | from_json).database.failedHistory
                ==
                (openclaw_behavior_rehearsal_delivery_evidence.results[1].content | b64decode | from_json).database.failedHistory
            fail_msg: >-
              The behavior canary created replay-capable delivery state or
              altered delivery history.
          no_log: true

        - name: Restore prior isolated Codex executor activity
          ansible.builtin.systemd_service:
            name: openclaw-isolated-codex.service
            enabled: false
            state: >-
              {{ 'started' if openclaw_behavior_rehearsal_prior_services.results[1].stdout == 'active' else 'stopped' }}

        - name: Restore prior isolated Gateway activity
          ansible.builtin.systemd_service:
            name: openclaw-isolated-gateway.service
            enabled: false
            state: >-
              {{ 'started' if openclaw_behavior_rehearsal_prior_services.results[0].stdout == 'active' else 'stopped' }}

        - name: Recheck isolated Gateway boot state after behavior rehearsal
          ansible.builtin.command:
            argv:
              - /usr/bin/systemctl
              - is-enabled
              - openclaw-isolated-gateway.service
          register: openclaw_behavior_rehearsal_final_boot_state
          changed_when: false
          failed_when: false

        - name: Require boot-disabled isolated Gateway after behavior rehearsal
          ansible.builtin.assert:
            that:
              - openclaw_behavior_rehearsal_final_boot_state.stdout == 'disabled'
            fail_msg: >-
              The behavior rehearsal changed the canary's boot policy.

        - name: Capture production Gateway listener after behavior rehearsal
          ansible.builtin.command:
            argv:
              - /usr/bin/ss
              - --tcp
              - --listening
              - --numeric
              - --processes
              - "sport = :{{ openclaw_port }}"
          register: openclaw_behavior_rehearsal_production_after
          changed_when: false

        - name: Require unchanged production Gateway listener
          ansible.builtin.assert:
            that:
              - >-
                openclaw_behavior_rehearsal_production_after.stdout
                == openclaw_behavior_rehearsal_production_before.stdout
            fail_msg: >-
              The production Gateway listener changed during the isolated
              behavior rehearsal.

        - name: Record successful OpenClaw behavior rehearsal
          ansible.builtin.copy:
            dest: "{{ openclaw_behavior_rehearsal_evidence_dir }}/result.json"
            owner: root
            group: root
            mode: "0600"
            content: >-
              {{
                {
                  'status': 'ok',
                  'mode': 'apply',
                  'timestamp': openclaw_behavior_rehearsal_stamp,
                  'agentsValidated': 5,
                  'starChildrenValidated': 2,
                  'reasoningCasesValidated': 2,
                  'rigelSilent': true,
                  'channelsEnabled': false,
                  'cronEnabled': false,
                  'baselineHeartbeatsEnabled': false,
                  'bootEnabled': false,
                  'executorRestartedAfterAuthorization': true,
                  'productionGatewayChanged': false
                }
                | to_nice_json
              }}

        - name: Freeze successful OpenClaw behavior evidence
          ansible.builtin.file:
            path: "{{ openclaw_behavior_rehearsal_evidence_dir }}"
            state: directory
            owner: root
            group: root
            mode: u=rwX,go=
            recurse: true
            follow: false

      rescue:
        - name: Remove failed temporary behavior prompt inputs
          ansible.builtin.file:
            path: "{{ openclaw_behavior_rehearsal_input_dir }}"
            state: absent
          failed_when: false

        - name: Remove failed temporary behavior validation directory
          ansible.builtin.file:
            path: "{{ openclaw_behavior_rehearsal_validation_dir }}"
            state: absent
          failed_when: false

        - name: Inspect failed native Rigel heartbeat restoration evidence
          ansible.builtin.stat:
            path: "{{ openclaw_behavior_rehearsal_heartbeat_restore_output }}"
            follow: false
          register: openclaw_behavior_rehearsal_failed_heartbeat_restore
          failed_when: false

        - name: Preserve failed native Rigel heartbeat restoration evidence
          ansible.builtin.command:
            argv:
              - /usr/bin/mv
              - --no-clobber
              - "{{ openclaw_behavior_rehearsal_heartbeat_restore_output }}"
              - "{{ openclaw_behavior_rehearsal_evidence_dir }}/failed-heartbeat-restore-transition"
          when: >-
            openclaw_behavior_rehearsal_failed_heartbeat_restore.stat.isdir
            | default(false)
            | bool
          changed_when: true
          failed_when: false

        - name: Stop failed OpenClaw behavior canary
          ansible.builtin.systemd_service:
            name: openclaw-isolated-gateway.service
            enabled: false
            state: stopped
          failed_when: false

        - name: Restore targeted OpenClaw behavior rollback artifact
          ansible.builtin.command:
            argv:
              - /usr/bin/tar
              - --extract
              - --file
              - "{{ openclaw_behavior_rehearsal_evidence_dir }}/rollback.tar"
              - --absolute-names
              - --numeric-owner
              - --acls
              - --xattrs
              - --directory
              - /
          when: openclaw_behavior_rehearsal_backup_ready | bool
          changed_when: true
          failed_when: false

        - name: Restore prior isolated Codex executor activity after failure
          ansible.builtin.systemd_service:
            name: openclaw-isolated-codex.service
            enabled: false
            state: >-
              {{ 'started' if openclaw_behavior_rehearsal_prior_services.results[1].stdout == 'active' else 'stopped' }}
          failed_when: false

        - name: Restore prior isolated Gateway activity after failure
          ansible.builtin.systemd_service:
            name: openclaw-isolated-gateway.service
            enabled: false
            state: >-
              {{ 'started' if openclaw_behavior_rehearsal_prior_services.results[0].stdout == 'active' else 'stopped' }}
          failed_when: false

        - name: Preserve failed OpenClaw behavior evidence privately
          ansible.builtin.file:
            path: "{{ openclaw_behavior_rehearsal_evidence_dir }}"
            state: directory
            owner: root
            group: root
            mode: u=rwX,go=
            recurse: true
            follow: false
          failed_when: false

        - name: Fail OpenClaw behavior rehearsal after rollback
          ansible.builtin.fail:
            msg: >-
              OpenClaw behavior rehearsal failed. The prior canary config,
              database, session indexes, both service activity states, and
              boot-disabled policy were restored; private evidence remains under
              {{ openclaw_behavior_rehearsal_evidence_dir }}.
