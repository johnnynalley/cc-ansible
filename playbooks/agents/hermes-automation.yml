            fail_msg: >-
              The checksum-verified geckodriver archive did not report the
              reviewed stable version.

        - name: Install the verified standalone geckodriver atomically
          ansible.builtin.copy:
            src: >-
              {{ hermes_fortnite_geckodriver_cache_root
                 }}/{{ hermes_fortnite_geckodriver_version }}/geckodriver
            dest: "{{ hermes_fortnite_geckodriver_path }}"
            remote_src: true
            owner: root
            group: root
            mode: "0755"

        - name: Verify the direct Firefox binary used by geckodriver
          ansible.builtin.command:
