        - name: Reset only the stale imported Fortnite calendar sync ledger
          ansible.builtin.file:
            path: >-
              {{ hermes_astra_calendar_live_root
              }}/status/personal/fortnite-tournaments.items
            state: absent
          when: not hermes_automation_fortnite_calendar_ledger_marker.stat.exists

        - name: Sync Astra's native CalDAV cache as its service identity
          ansible.builtin.command:
            argv:
              - /usr/sbin/runuser
              - --user
              - hermes-astra
              - --
              - /usr/bin/env
              - HOME=/var/lib/hermes/astra
              - HERMES_HOME=/var/lib/hermes/astra/.hermes/profiles/astra
              - /usr/bin/timeout
              - 5m
              - /usr/bin/vdirsyncer
              - sync
          register: hermes_automation_astra_calendar_sync
          changed_when: false
          args:
            stdin: ""
            stdin_add_newline: false

        - name: Record successful OpenClaw Fortnite calendar ledger migration
          ansible.builtin.file:
            path: >-
              {{ hermes_astra_calendar_live_root
              }}/status/.openclaw-fortnite-calendar-ledger-migrated
            state: touch
            owner: hermes-astra
            group: hermes-astra
            mode: "0600"
            modification_time: preserve
            access_time: preserve
          when: not hermes_automation_fortnite_calendar_ledger_marker.stat.exists

        - name: Verify Astra can read its current calendar
          ansible.builtin.command:
            argv:
              - /usr/sbin/runuser
              - --user
              - hermes-astra
              - --
              - /usr/bin/env
              - HOME=/var/lib/hermes/astra
              - HERMES_HOME=/var/lib/hermes/astra/.hermes/profiles/astra
              - /usr/bin/khal
              - list
              - today
              - 2d
          register: hermes_automation_astra_calendar_read
          changed_when: false
          no_log: true

        - name: Verify Astra can read one iCloud envelope natively
          ansible.builtin.command:
            argv:
              - /usr/sbin/runuser
              - --user
              - hermes-astra
              - --
              - /usr/bin/env
              - HOME=/var/lib/hermes/astra
              - HERMES_HOME=/var/lib/hermes/astra/.hermes/profiles/astra
              - "{{ hermes_astra_himalaya_live_binary }}"
              - envelope
              - list
              - --account
              - icloud
              - --folder
              - INBOX
              - --page-size
              - "1"
          register: hermes_automation_astra_mail_read
          changed_when: false
          no_log: true

        - name: Deploy root-owned Astra cron scripts
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/../../{{ item.source }}"
            dest: >-
              {{ hermes_native_update_profile_home
                 }}/scripts/{{ item.destination }}
            owner: root
            group: hermes-astra
            mode: "0550"
            backup: true
          loop: "{{ hermes_automation_astra_scripts }}"
          loop_control:
            label: "{{ item.destination }}"

        - name: Deploy root-owned Rigel cron scripts
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/../../{{ item.source }}"
            dest: >-
              /var/lib/hermes/rigel/.hermes/profiles/rigel/scripts/{{
                item.destination
              }}
            owner: root
            group: hermes-rigel
            mode: "0550"
            backup: true
          loop: "{{ hermes_automation_rigel_scripts }}"
          loop_control:
            label: "{{ item.destination }}"
          when: hermes_rigel_dedicated_discord_enabled | bool
          register: hermes_automation_rigel_scripts_deployed

        - name: Create shared credential-free production manifest directory
          ansible.builtin.file:
            path: "{{ hermes_automation_manifest_root }}"
            state: directory
            owner: root
            group: "{{ hermes_runtime_readers_group }}"
            mode: "0750"

        - name: Deploy Astra production cron manifest
          ansible.builtin.template:
            src: >-
              {{ playbook_dir ~ '/../../templates/hermes/'
                 ~ hermes_automation_manifest_source }}
            dest: "{{ hermes_automation_manifest_live }}"
            owner: root
            group: "{{ hermes_runtime_readers_group }}"
            mode: "0440"
            backup: true

        - name: Deploy Dubble production cron manifest
          ansible.builtin.template:
            src: >-
              {{ playbook_dir ~ '/../../templates/hermes/'
                 ~ hermes_dubble_automation_manifest_source }}
            dest: "{{ hermes_dubble_automation_manifest_live }}"
            owner: root
            group: "{{ hermes_runtime_readers_group }}"
            mode: "0440"
            backup: true

        - name: Deploy Rigel production cron manifest
          ansible.builtin.template:
            src: >-
              {{ playbook_dir ~ '/../../templates/hermes/'
                 ~ hermes_rigel_automation_manifest_source }}
            dest: "{{ hermes_rigel_automation_manifest_live }}"
            owner: root
            group: "{{ hermes_runtime_readers_group }}"
            mode: "0440"
            backup: true

        - name: Verify production cron manifests are readable by their profiles
          ansible.builtin.command:
            argv:
              - /usr/sbin/runuser
              - --user
              - "{{ item.user }}"
              - --
              - /usr/bin/head
              - --bytes=0
              - "{{ item.manifest }}"
          loop:
            - user: hermes-astra
              manifest: "{{ hermes_automation_manifest_live }}"
            - user: hermes-astra
              manifest: "{{ hermes_dubble_automation_manifest_live }}"
            - user: hermes-dubble
              manifest: "{{ hermes_automation_manifest_live }}"
            - user: hermes-dubble
              manifest: "{{ hermes_dubble_automation_manifest_live }}"
            - user: hermes-rigel
              manifest: "{{ hermes_rigel_automation_manifest_live }}"
          loop_control:
            label: "{{ item.user }}:{{ item.manifest }}"
          changed_when: false

        - name: Remove superseded private production cron manifests
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - /etc/hermes/astra/production-jobs.json
            - /etc/hermes/dubble/production-jobs.json
            - /etc/hermes/astra/production-automation-reconciliation.json

        - name: Deploy the exhaustive OpenClaw parity contract
          ansible.builtin.copy:
            src: >-
              {{ playbook_dir }}/../../{{
                 hermes_openclaw_parity_contract_source }}
            dest: "{{ hermes_openclaw_parity_contract_live }}"
            owner: root
            group: hermes-runtime-readers
            mode: "0440"
            backup: true

        - name: Deploy the reviewed production schedule reconciliation
          ansible.builtin.copy:
            src: >-
              {{ playbook_dir }}/../../{{
                 hermes_automation_reconciliation_source }}
            dest: "{{ hermes_automation_reconciliation_live }}"
            owner: root
            group: "{{ hermes_runtime_readers_group }}"
            mode: "0440"
            backup: true

        - name: Validate complete OpenClaw parity before interruption
          ansible.builtin.command:
            argv:
              - "{{ hermes_shadow_runtime_venv }}/bin/python"
              - "{{ hermes_openclaw_parity_validator_live }}"
              - --contract
              - "{{ hermes_openclaw_parity_contract_live }}"
              - --skills
              - "{{ hermes_profile_skills_contract_live }}"
              - --automation
              - "{{ hermes_automation_reconciliation_live }}"
              - --astra-manifest
              - "{{ hermes_automation_manifest_live }}"
              - --dubble-manifest
              - "{{ hermes_dubble_automation_manifest_live }}"
              - --rigel-manifest
              - "{{ hermes_rigel_automation_manifest_live }}"
              - --rigel-delivery-mode
              - >-
                {{
                  'dedicated'
                  if hermes_rigel_dedicated_discord_enabled | bool
                  else 'fallback'
                }}
              - --source-jobs
              - "{{ hermes_openclaw_current_cron_state }}"
              - --historical-source-jobs
              - "{{ hermes_openclaw_historical_cron_state }}"
          register: hermes_automation_parity_validation
          changed_when: false

        - name: Deploy bounded automation systemd units
          ansible.builtin.template:
            src: "{{ playbook_dir }}/../../templates/hermes/{{ item.source }}"
            dest: "/etc/systemd/system/{{ item.name }}"
            owner: root
            group: root
            mode: "0644"
            backup: true
          loop: "{{ hermes_automation_template_units }}"
          loop_control:
            label: "{{ item.name }}"

        - name: Deploy compatibility-safe memory dependency resolver
          ansible.builtin.copy:
            src: >-
              {{ ansible_config_file | dirname }}/{{ hermes_mem0_dependency_updater_source }}
            dest: "{{ hermes_mem0_dependency_updater_live }}"
            owner: root
            group: root
            mode: "0755"
            backup: true

        - name: Deploy corrected Hermes native update unit
          ansible.builtin.template:
            src: >-
              {{ playbook_dir
                 }}/../../templates/hermes/hermes-native-update.service.j2
            dest: "/etc/systemd/system/{{ hermes_native_update_service }}"
            owner: root
            group: root
            mode: "0644"
            backup: true

        - name: Deploy exact native Gateway update sudoers bridge
          ansible.builtin.template:
            src: >-
              {{ playbook_dir
                 }}/../../templates/hermes/hermes-native-update.sudoers.j2
            dest: /etc/sudoers.d/hermes-native-update
            owner: root
            group: root
            mode: "0440"
            validate: /usr/sbin/visudo -cf %s
            backup: true

        - name: Create isolated native MCP server managed scopes
          ansible.builtin.file:
            path: "/etc/hermes/{{ item.name }}/mcp-server"
            state: directory
            owner: root
            group: "{{ item.group }}"
            mode: "0750"
          loop: "{{ hermes_shadow_profiles }}"
          loop_control:
            label: "{{ item.name }}"

        - name: Create exclusive managed Hermes skill roots
          ansible.builtin.file:
            path: "{{ item.value.managedRoot }}"
            state: directory
            owner: root
            group: "{{ item.value.group }}"
            mode: "0750"
          loop: >-
            {{
              hermes_automation_profile_skills_contract.profiles
              | dict2items
            }}
          loop_control:
            label: "{{ item.key }}"

        - name: Create managed Hermes profile skill directories
          ansible.builtin.file:
            path: "{{ item.managedRoot }}/{{ item.name }}"
            state: directory
            owner: root
            group: "{{ item.group }}"
            mode: "0750"
          loop: "{{ hermes_automation_profile_skills_inventory }}"
          loop_control:
            label: "{{ item.profile }}/{{ item.name }}"

        - name: Publish reviewed managed Hermes profile skills
          ansible.builtin.copy:
            src: >-
              {{ ansible_config_file | dirname }}/{{ item.source }}
            dest: "{{ item.managedRoot }}/{{ item.name }}/SKILL.md"
            owner: root
            group: "{{ item.group }}"
            mode: "0440"
          loop: "{{ hermes_automation_profile_skills_inventory }}"
          loop_control:
            label: "{{ item.profile }}/{{ item.name }}"
          register: hermes_automation_profile_skill_copies

        - name: Publish managed Hermes profile skill contract
          ansible.builtin.copy:
            src: >-
              {{ ansible_config_file | dirname }}/{{
                hermes_profile_skills_contract_source }}
            dest: "{{ hermes_profile_skills_contract_live }}"
            owner: root
            group: root
            mode: "0444"
            backup: true
          register: hermes_automation_profile_skill_contract_copy

        - name: Publish mutable native bootstrap parity contract
          ansible.builtin.copy:
            src: >-
              {{ ansible_config_file | dirname }}/{{
                hermes_bootstrap_parity_contract_source }}
            dest: "{{ hermes_bootstrap_parity_contract_live }}"
            owner: root
            group: root
            mode: "0444"
            backup: true
          register: hermes_automation_bootstrap_parity_contract_copy

        - name: Resolve the installed stable Hermes config schema
          ansible.builtin.command:
            argv:
              - "{{ hermes_shadow_runtime_venv }}/bin/python"
              - -c
              - >-
                from hermes_cli.config_defaults import DEFAULT_CONFIG;
                print(int(DEFAULT_CONFIG['_config_version']))
          register: hermes_automation_runtime_config_schema
          changed_when: false

        - name: Require a valid installed stable Hermes config schema
          ansible.builtin.assert:
            that:
              - >-
                hermes_automation_runtime_config_schema.stdout
                is match('^[1-9][0-9]*$')
              - >-
                hermes_automation_runtime_config_schema.stdout | int
                >= hermes_shadow_config_version | int
            fail_msg: >-
              Installed Hermes reports an invalid or older config schema than
              the reviewed stable repository baseline.

        - name: Deploy bounded Hermes managed policies
          ansible.builtin.template:
            src: >-
              {{ playbook_dir
                 }}/../../templates/hermes/hermes-managed-config.yaml.j2
            dest: "/etc/hermes/{{ hermes_profile.name }}/config.yaml"
            owner: root
            group: "{{ hermes_profile.group }}"
            mode: "0440"
            backup: true
          loop: "{{ hermes_shadow_profiles }}"
          loop_control:
            loop_var: hermes_profile
            label: "{{ hermes_profile.name }}"
          vars:
            hermes_managed_config_version: >-
              {{ hermes_automation_runtime_config_schema.stdout | int }}
          register: hermes_automation_managed_policies

        - name: Read mutable Hermes profile configs for native skill discovery
          ansible.builtin.slurp:
            src: "{{ item.home }}/config.yaml"
          loop: "{{ hermes_shadow_profiles }}"
          loop_control:
            label: "{{ item.name }}"
          register: hermes_automation_mutable_configs_before_skills
          no_log: true

        - name: Migrate isolated profile configs through native Hermes
          ansible.builtin.command:
            argv:
              - /usr/sbin/runuser
              - --user
              - "{{ item.item.user }}"
              - --
              - /usr/bin/env
              - "HOME={{ item.item.account_home }}"
              - "HERMES_HOME={{ item.item.home }}"
              - PYTHONNOUSERSITE=1
              - "{{ hermes_shadow_runtime_venv }}/bin/python"
              - -c
              - >-
                import json;
                from hermes_cli.config import check_config_version, migrate_config;
                before, latest = check_config_version();
                result = migrate_config(interactive=False, quiet=True)
                if before < latest else {};
                after, observed_latest = check_config_version();
                print(json.dumps({'after': after, 'before': before,
                'latest': observed_latest}, sort_keys=True));
                raise SystemExit(0 if after == observed_latest and before == after
                else 3 if after == observed_latest else 1)
          loop: "{{ hermes_automation_mutable_configs_before_skills.results }}"
          loop_control:
            label: "{{ item.item.name }}"
          register: hermes_automation_profile_config_migrations
          changed_when: hermes_automation_profile_config_migrations.rc == 3
          failed_when: >-
            hermes_automation_profile_config_migrations.rc not in [0, 3]
          check_mode: false
          no_log: true

        - name: Re-read mutable profile configs after native migration
          ansible.builtin.slurp:
            src: "{{ item.home }}/config.yaml"
          loop: "{{ hermes_shadow_profiles }}"
          loop_control:
            label: "{{ item.name }}"
          register: hermes_automation_mutable_configs_after_migration
          no_log: true

        - name: Require safe current mutable Hermes profile configs
          ansible.builtin.assert:
            that:
              - hermes_mutable_config is mapping
              - hermes_mutable_config._config_version is defined
              - >-
                hermes_mutable_config._config_version | int
                == hermes_automation_runtime_config_schema.stdout | int
              - >-
                hermes_mutable_config.skills is not defined
                or hermes_mutable_config.skills is mapping
              - >-
                hermes_mutable_external_dirs is sequence
                and hermes_mutable_external_dirs is not string
            fail_msg: >-
              A mutable Hermes profile config is malformed or on an unexpected
              schema. Refusing to alter user-owned skill discovery settings.
          loop: "{{ hermes_automation_mutable_configs_after_migration.results }}"
          loop_control:
            label: "{{ item.item.name }}"
          vars:
            hermes_mutable_config: >-
              {{ item.content | b64decode | from_yaml }}
            hermes_mutable_external_dirs: >-
              {{
                (hermes_mutable_config.skills | default({})).external_dirs
                | default([])
              }}
          no_log: true

        - name: Remove duplicate managed root from mutable skill discovery
          ansible.builtin.copy:
            content: >-
              {{
                hermes_mutable_config
                | combine({
                    'skills': hermes_mutable_skills
                      | combine({
                          'external_dirs': hermes_mutable_external_dirs
                            | reject('equalto', hermes_managed_skill_root)
                            | list
                        })
                  })
                | to_nice_yaml(indent=2, sort_keys=false)
              }}
            dest: "{{ item.item.home }}/config.yaml"
            owner: "{{ item.item.user }}"
            group: "{{ item.item.group }}"
            mode: "0600"
          loop: "{{ hermes_automation_mutable_configs_after_migration.results }}"
          loop_control:
            label: "{{ item.item.name }}"
          vars:
            hermes_mutable_config: >-
              {{ item.content | b64decode | from_yaml }}
            hermes_mutable_skills: >-
              {{ hermes_mutable_config.skills | default({}) }}
            hermes_mutable_external_dirs: >-
              {{ hermes_mutable_skills.external_dirs | default([]) }}
            hermes_managed_skill_root: >-
              {{ '/etc/hermes/' ~ item.item.name ~ '/skills' }}
          register: hermes_automation_profile_skill_configs
          no_log: true

        - name: Verify every managed skill source before Gateway restart
          ansible.builtin.command:
            argv:
              - /usr/sbin/runuser
              - --user
              - "{{ item.user }}"
              - --
              - /usr/bin/env
              - "HOME={{ item.account_home }}"
              - "HERMES_HOME={{ item.home }}"
              - "{{ hermes_shadow_runtime_venv }}/bin/python"
              - "{{ hermes_profile_skills_validator_live }}"
              - --contract
              - "{{ hermes_profile_skills_contract_live }}"
              - --mode
              - installed
              - --profile
              - "{{ item.name }}"
              - --hermes-source
              - /usr/local/lib/hermes-agent
          loop: "{{ hermes_shadow_profiles }}"
          loop_control:
            label: "{{ item.name }}"
          changed_when: false

        - name: Verify profile-owned native skills before Gateway restart
          ansible.builtin.command:
            argv:
              - /usr/sbin/runuser
              - --user
              - "{{ item.user }}"
              - --
              - /usr/bin/env
              - "HOME={{ item.account_home }}"
              - "HERMES_HOME={{ item.home }}"
              - "{{ hermes_shadow_runtime_venv }}/bin/python"
              - "{{ hermes_profile_skills_validator_live }}"
              - --contract
              - "{{ hermes_profile_skills_contract_live }}"
              - --mode
              - native
              - --profile
              - "{{ item.name }}"
              - --hermes-source
              - /usr/local/lib/hermes-agent
              - --allow-unmounted-shared-readers
          loop: "{{ hermes_shadow_profiles }}"
          loop_control:
            label: "{{ item.name }}"
          changed_when: false

        - name: Hash bounded Hermes policy and environment
          ansible.builtin.command:
            argv:
              - /usr/bin/sha256sum
              - "/etc/hermes/{{ item.name }}/config.yaml"
              - >-
                {{ item.environment_file | default('/etc/hermes/' ~ item.name ~ '/.env') }}
          loop: "{{ hermes_shadow_profiles }}"
          loop_control:
            label: "{{ item.name }}"
          register: hermes_automation_policy_hashes
          changed_when: false
          no_log: true

        - name: Deploy bounded Hermes policy checksum manifests
          ansible.builtin.copy:
            content: "{{ item.stdout }}\n"
            dest: >-
              /etc/hermes/{{ item.item.name }}/managed-policy.sha256
            owner: root
            group: "{{ item.item.group }}"
            mode: "0440"
          loop: "{{ hermes_automation_policy_hashes.results }}"
          loop_control:
            label: "{{ item.item.name }}"
          no_log: true
          register: hermes_automation_policy_manifests

        - name: Create Astra Gateway systemd drop-in directory
          ansible.builtin.file:
            path: >-
              {{ hermes_automation_gateway_dropin | dirname }}
            state: directory
            owner: root
            group: root
            mode: "0755"

        - name: Deploy Astra immutable automation parity gate
          ansible.builtin.template:
            src: >-
              {{ playbook_dir
                 }}/../../templates/hermes/hermes-gateway-astra-automation.conf.j2
            dest: "{{ hermes_automation_gateway_dropin }}"
            owner: root
            group: root
            mode: "0644"
            backup: true
          register: hermes_automation_astra_gateway_dropin

        - name: Create Dubble Gateway systemd drop-in directory
          ansible.builtin.file:
            path: "{{ hermes_dubble_automation_gateway_dropin | dirname }}"
            state: directory
            owner: root
            group: root
            mode: "0755"

        - name: Deploy Dubble immutable automation parity gate
          ansible.builtin.template:
            src: >-
              {{ playbook_dir
                 }}/../../templates/hermes/hermes-gateway-dubble-automation.conf.j2
            dest: "{{ hermes_dubble_automation_gateway_dropin }}"
            owner: root
            group: root
            mode: "0644"
            backup: true
          register: hermes_automation_dubble_gateway_dropin

        - name: Create Rigel Gateway systemd drop-in directory
          ansible.builtin.file:
            path: "{{ hermes_rigel_automation_gateway_dropin | dirname }}"
            state: directory
            owner: root
            group: root
            mode: "0755"

        - name: Deploy Rigel immutable automation parity gate
          ansible.builtin.template:
            src: >-
              {{ playbook_dir
                 }}/../../templates/hermes/hermes-gateway-rigel-automation.conf.j2
            dest: "{{ hermes_rigel_automation_gateway_dropin }}"
            owner: root
            group: root
            mode: "0644"
            backup: true
          register: hermes_automation_rigel_gateway_dropin

        - name: Remove superseded native-migration startup drop-in
          ansible.builtin.file:
            path: >-
              /etc/systemd/system/hermes-gateway-astra.service.d/20-automation.conf
            state: absent

        - name: Inspect superseded collapsed Daily Summary timer
          ansible.builtin.stat:
            path: "/etc/systemd/system/{{ item }}"
            follow: false
          loop: "{{ hermes_automation_retired_timers }}"
          register: hermes_automation_retired_timer_files

        - name: Stop and disable superseded collapsed Daily Summary timer
          ansible.builtin.systemd_service:
            name: "{{ item.item }}"
            state: stopped
            enabled: false
          loop: "{{ hermes_automation_retired_timer_files.results }}"
          loop_control:
            label: "{{ item.item }}"
          when: item.stat.exists

        - name: Remove superseded collapsed Daily Summary timer
          ansible.builtin.file:
            path: "/etc/systemd/system/{{ item }}"
            state: absent
          loop: "{{ hermes_automation_retired_timers }}"

        - name: Reload Hermes automation systemd units
          ansible.builtin.systemd_service:
            daemon_reload: true

        - name: Check Astra cron drift before any interruption
          ansible.builtin.command:
            argv:
              - /usr/sbin/runuser
              - --user
              - hermes-astra
              - --
              - /usr/bin/env
              - HOME=/var/lib/hermes/astra
              - HERMES_HOME=/var/lib/hermes/astra/.hermes/profiles/astra
              - "{{ hermes_shadow_runtime_venv }}/bin/python"
              - "{{ hermes_cron_reconcile_live }}"
              - --manifest
              - "{{ hermes_automation_manifest_live }}"
              - --home
              - /var/lib/hermes/astra/.hermes/profiles/astra
              - --profile
              - astra
              - --audit
          register: hermes_automation_reconcile_precheck
          changed_when: false
          failed_when: hermes_automation_reconcile_precheck.rc not in [0, 3]
          check_mode: false

        - name: Check Dubble cron drift before any interruption
          ansible.builtin.command:
            argv:
              - /usr/sbin/runuser
              - --user
              - hermes-dubble
              - --
              - /usr/bin/env
              - HOME=/var/lib/hermes/dubble
              - HERMES_HOME=/var/lib/hermes/dubble/.hermes/profiles/dubble
              - "{{ hermes_shadow_runtime_venv }}/bin/python"
              - "{{ hermes_cron_reconcile_live }}"
              - --manifest
              - "{{ hermes_dubble_automation_manifest_live }}"
              - --home
              - /var/lib/hermes/dubble/.hermes/profiles/dubble
              - --profile
              - dubble
              - --audit
          register: hermes_automation_dubble_reconcile_precheck
          changed_when: false
          failed_when: >-
            hermes_automation_dubble_reconcile_precheck.rc not in [0, 3]
          check_mode: false

        - name: Check Rigel cron drift before any interruption
          ansible.builtin.command:
            argv:
              - /usr/sbin/runuser
              - --user
              - hermes-rigel
              - --
              - /usr/bin/env
              - HOME=/var/lib/hermes/rigel
              - HERMES_HOME=/var/lib/hermes/rigel/.hermes/profiles/rigel
              - "{{ hermes_shadow_runtime_venv }}/bin/python"
              - "{{ hermes_cron_reconcile_live }}"
              - --manifest
              - "{{ hermes_rigel_automation_manifest_live }}"
              - --home
              - /var/lib/hermes/rigel/.hermes/profiles/rigel
              - --profile
              - rigel
              - --audit
          register: hermes_automation_rigel_reconcile_precheck
          changed_when: false
          failed_when: >-
            hermes_automation_rigel_reconcile_precheck.rc not in [0, 3]
          check_mode: false

        - name: Decide which native schedules require explicit reconciliation
          ansible.builtin.set_fact:
            hermes_automation_astra_schedule_reconcile_required: >-
              {{
                hermes_automation_schedule_mode in ['seed', 'restore']
                and (hermes_automation_reconcile_precheck.stdout | from_json)
                    .changes | length > 0
              }}
            hermes_automation_dubble_schedule_reconcile_required: >-
              {{
                hermes_automation_schedule_mode in ['seed', 'restore']
                and (
                  hermes_automation_dubble_reconcile_precheck.stdout | from_json
                ).changes | length > 0
              }}
            hermes_automation_rigel_schedule_reconcile_required: >-
              {{
                hermes_automation_schedule_mode in ['seed', 'restore']
                and (
                  hermes_automation_rigel_reconcile_precheck.stdout | from_json
                ).changes | length > 0
              }}

        - name: Decide which production consumers need one restart
          ansible.builtin.set_fact:
            hermes_automation_shared_policy_changed: >-
              {{
                (
                  hermes_automation_managed_policies.results
                  | selectattr('hermes_profile.name', 'equalto', 'dubble')
                  | map(attribute='changed')
                  | first
                )
                or
                (
                  hermes_automation_policy_manifests.results
                  | selectattr('item.item.name', 'equalto', 'dubble')
                  | map(attribute='changed')
                  | first
                )
                or hermes_automation_dubble_peer_environment.changed
                or
                (
                  hermes_automation_fallback_provider_environments.results
                  | selectattr('item.profile', 'equalto', 'dubble')
                  | map(attribute='changed')
                  | select('equalto', true)
                  | list
                  | length > 0
                )
                or hermes_automation_dubble_gateway_dropin.changed
                or
                (
                  hermes_automation_profile_config_migrations.results
                  | selectattr('item.item.name', 'equalto', 'dubble')
                  | map(attribute='changed')
                  | first
                )
                or
                (
                  hermes_automation_profile_skill_configs.results
                  | selectattr('item.item.name', 'equalto', 'dubble')
                  | map(attribute='changed')
                  | first
                )
                or
                (
                  hermes_automation_profile_skill_copies.results
                  | selectattr('item.profile', 'equalto', 'dubble')
                  | map(attribute='changed')
                  | select('equalto', true)
                  | list
                  | length > 0
                )
                or hermes_automation_dubble_schedule_reconcile_required | bool
              }}
            hermes_automation_astra_restart_required: >-
              {{
                hermes_automation_astra_schedule_reconcile_required | bool
                or hermes_automation_astra_provider_environment.changed
                or
                (
                  hermes_automation_fallback_provider_environments.results
                  | selectattr('item.profile', 'equalto', 'astra')
                  | map(attribute='changed')
                  | select('equalto', true)
                  | list
                  | length > 0
                )
                or hermes_automation_astra_peer_environment.changed
                or
                (
                  hermes_automation_profile_config_migrations.results
                  | selectattr('item.item.name', 'equalto', 'astra')
                  | map(attribute='changed')
                  | first
                )
                or
                (
                  hermes_automation_managed_policies.results
                  | selectattr('hermes_profile.name', 'equalto', 'astra')
                  | map(attribute='changed')
                  | first
                )
                or
                (
                  hermes_automation_policy_manifests.results
                  | selectattr('item.item.name', 'equalto', 'astra')
                  | map(attribute='changed')
                  | first
                )
                or hermes_automation_astra_gateway_dropin.changed
                or hermes_automation_bootstrap_parity_contract_copy.changed
                or
                (
                  hermes_automation_root_helper_copies.results
                  | selectattr(
                      'item.destination',
                      'equalto',
                      hermes_bootstrap_parity_validator_live
                    )
                  | map(attribute='changed')
                  | first
                )
                or
                (
                  hermes_automation_profile_skill_configs.results
                  | selectattr('item.item.name', 'equalto', 'astra')
                  | map(attribute='changed')
                  | first
                )
                or
                (
                  hermes_automation_profile_skill_copies.results
                  | selectattr('item.profile', 'equalto', 'astra')
                  | map(attribute='changed')
                  | select('equalto', true)
                  | list
                  | length > 0
                )
              }}
            hermes_automation_rigel_restart_required: >-
              {{
                hermes_rigel_dedicated_discord_enabled | bool
                and (
                  (
                    hermes_automation_managed_policies.results
                    | selectattr('hermes_profile.name', 'equalto', 'rigel')
                    | map(attribute='changed')
                    | first
                  )
                  or
                  (
                    hermes_automation_policy_manifests.results
                    | selectattr('item.item.name', 'equalto', 'rigel')
                    | map(attribute='changed')
                    | first
                  )
                  or
                  (
                    hermes_automation_fallback_provider_environments.results
                    | selectattr('item.profile', 'equalto', 'rigel')
                    | map(attribute='changed')
                    | select('equalto', true)
                    | list
                    | length > 0
                  )
                  or hermes_automation_rigel_discord_environment.changed
                  or hermes_automation_rigel_gateway_dropin.changed
                  or hermes_automation_rigel_scripts_deployed.changed
                  or
                  (
                    hermes_automation_profile_config_migrations.results
                    | selectattr('item.item.name', 'equalto', 'rigel')
                    | map(attribute='changed')
                    | first
                  )
                  or
                  (
                    hermes_automation_profile_skill_configs.results
                    | selectattr('item.item.name', 'equalto', 'rigel')
                    | map(attribute='changed')
                    | first
                  )
                  or
                  (
                    hermes_automation_profile_skill_copies.results
                    | selectattr('item.profile', 'equalto', 'rigel')
                    | map(attribute='changed')
                    | select('equalto', true)
                    | list
                    | length > 0
                  )
                  or hermes_automation_rigel_schedule_reconcile_required | bool
                )
              }}

        - name: Prepare Astra planned-stop marker for automation changes
          ansible.builtin.include_tasks:
            file: ../../tasks/hermes-planned-stop-marker.yml
          vars:
            hermes_planned_stop_profile: "{{ hermes_shadow_profiles[0] }}"
          when:
            - hermes_automation_astra_restart_required | bool
            - not hermes_automation_defer_gateway_restart | bool

        - name: Stop Astra natively once when cron or runtime state changed
          ansible.builtin.command:
            argv:
              - "{{ hermes_shadow_runtime_binary }}"
              - gateway
              - stop
              - --system
          environment:
            HOME: "{{ hermes_shadow_profiles[0].account_home }}"
            HERMES_HOME: "{{ hermes_shadow_profiles[0].home }}"
            HERMES_MANAGED_DIR: /etc/hermes/astra
          changed_when: true
          when:
            - hermes_automation_astra_restart_required | bool
            - not hermes_automation_defer_gateway_restart | bool

        - name: Inspect stopped Astra native cron state
          ansible.builtin.stat:
            path: /var/lib/hermes/astra/.hermes/profiles/astra/cron/jobs.json
            follow: false
          register: hermes_automation_astra_stopped_cron
          check_mode: false
          when: hermes_automation_astra_restart_required | bool

        - name: Refresh the native cron backup with Astra stopped
          ansible.builtin.copy:
            src: /var/lib/hermes/astra/.hermes/profiles/astra/cron/jobs.json
            dest: >-
              {{ hermes_automation_backup_root
                 }}/var__lib__hermes__astra__cron__jobs.json
            remote_src: true
            owner: root
            group: root
            mode: "0600"
          when:
            - hermes_automation_astra_restart_required | bool
            - hermes_automation_astra_stopped_cron.stat.exists

        - name: Reconcile Astra jobs through the native Hermes API
          ansible.builtin.command:
            argv:
              - /usr/sbin/runuser
              - --user
              - hermes-astra
              - --
              - /usr/bin/env
              - HOME=/var/lib/hermes/astra
              - HERMES_HOME=/var/lib/hermes/astra/.hermes/profiles/astra
              - "{{ hermes_shadow_runtime_venv }}/bin/python"
              - "{{ hermes_cron_reconcile_live }}"
              - --manifest
              - "{{ hermes_automation_manifest_live }}"
              - --home
              - /var/lib/hermes/astra/.hermes/profiles/astra
              - --profile
              - astra
              - >-
                {{
                  '--seed'
                  if hermes_automation_schedule_mode == 'seed'
                  else '--restore'
                }}
          register: hermes_automation_reconcile
          changed_when: >-
            (hermes_automation_reconcile.stdout | from_json).changes
            | length > 0
          check_mode: false
          when: hermes_automation_astra_schedule_reconcile_required | bool

        - name: Start Astra through the native systemd readiness window
          ansible.builtin.systemd_service:
            name: hermes-gateway-astra.service
            state: started
            enabled: true
          when:
            - hermes_automation_astra_restart_required | bool
            - not hermes_automation_defer_gateway_restart | bool

        - name: Prepare Dubble planned-stop marker for cron or policy changes
          ansible.builtin.include_tasks:
            file: ../../tasks/hermes-planned-stop-marker.yml
          vars:
            hermes_planned_stop_profile: "{{ hermes_shadow_profiles[1] }}"
          when:
            - hermes_automation_shared_policy_changed | bool
            - not hermes_automation_defer_gateway_restart | bool

        - name: Stop Dubble natively once when cron or policy changed
          ansible.builtin.command:
            argv:
              - "{{ hermes_shadow_runtime_binary }}"
              - gateway
              - stop
              - --system
          environment:
            HOME: "{{ hermes_shadow_profiles[1].account_home }}"
            HERMES_HOME: "{{ hermes_shadow_profiles[1].home }}"
            HERMES_MANAGED_DIR: /etc/hermes/dubble
          changed_when: true
          when:
            - hermes_automation_shared_policy_changed | bool
            - not hermes_automation_defer_gateway_restart | bool

        - name: Inspect stopped Dubble native cron state
          ansible.builtin.stat:
            path: /var/lib/hermes/dubble/.hermes/profiles/dubble/cron/jobs.json
            follow: false
          register: hermes_automation_dubble_stopped_cron
          check_mode: false
          when: hermes_automation_shared_policy_changed | bool

        - name: Refresh the native cron backup with Dubble stopped
          ansible.builtin.copy:
            src: /var/lib/hermes/dubble/.hermes/profiles/dubble/cron/jobs.json
            dest: >-
              {{ hermes_automation_backup_root
                 }}/var__lib__hermes__dubble__cron__jobs.json
            remote_src: true
            owner: root
            group: root
            mode: "0600"
          when:
            - hermes_automation_shared_policy_changed | bool
            - hermes_automation_dubble_stopped_cron.stat.exists

        - name: Reconcile Dubble jobs through the native Hermes API
          ansible.builtin.command:
            argv:
              - /usr/sbin/runuser
              - --user
              - hermes-dubble
              - --
              - /usr/bin/env
              - HOME=/var/lib/hermes/dubble
              - HERMES_HOME=/var/lib/hermes/dubble/.hermes/profiles/dubble
              - "{{ hermes_shadow_runtime_venv }}/bin/python"
              - "{{ hermes_cron_reconcile_live }}"
              - --manifest
              - "{{ hermes_dubble_automation_manifest_live }}"
              - --home
              - /var/lib/hermes/dubble/.hermes/profiles/dubble
              - --profile
              - dubble
              - >-
                {{
                  '--seed'
                  if hermes_automation_schedule_mode == 'seed'
                  else '--restore'
                }}
          register: hermes_automation_dubble_reconcile
          changed_when: >-
            (hermes_automation_dubble_reconcile.stdout | from_json).changes
            | length > 0
          check_mode: false
          when: hermes_automation_dubble_schedule_reconcile_required | bool

        - name: Start Dubble through the native systemd readiness window
          ansible.builtin.systemd_service:
            name: hermes-gateway-dubble.service
            state: started
            enabled: true
          when:
            - hermes_automation_shared_policy_changed | bool
            - not hermes_automation_defer_gateway_restart | bool

        - name: Create Rigel readiness marker after third-identity proof
          ansible.builtin.file:
            path: "/etc/hermes/rigel/{{ hermes_gateway_readiness_marker }}"
            state: touch
            owner: root
            group: hermes-rigel
            mode: "0440"
            modification_time: preserve
            access_time: preserve
          when: hermes_rigel_dedicated_discord_enabled | bool

        - name: Prepare Rigel planned-stop marker for cron or policy changes
          ansible.builtin.include_tasks:
            file: ../../tasks/hermes-planned-stop-marker.yml
          vars:
            hermes_planned_stop_profile: "{{ hermes_shadow_profiles[2] }}"
          when:
            - hermes_automation_rigel_restart_required | bool
            - not hermes_automation_defer_gateway_restart | bool
            - >-
              (
                hermes_automation_prior_gateways
                | selectattr(
                    'name',
                    'equalto',
                    'hermes-gateway-rigel.service'
                  )
                | map(attribute='active')
                | first
              ) == 'active'

        - name: Stop Rigel natively once when active runtime state changed
          ansible.builtin.command:
            argv:
              - "{{ hermes_shadow_runtime_binary }}"
              - gateway
              - stop
              - --system
          environment:
            HOME: "{{ hermes_shadow_profiles[2].account_home }}"
            HERMES_HOME: "{{ hermes_shadow_profiles[2].home }}"
            HERMES_MANAGED_DIR: /etc/hermes/rigel
          changed_when: true
          when:
            - hermes_automation_rigel_restart_required | bool
            - not hermes_automation_defer_gateway_restart | bool
            - >-
              (
                hermes_automation_prior_gateways
                | selectattr(
                    'name',
                    'equalto',
                    'hermes-gateway-rigel.service'
                  )
                | map(attribute='active')
                | first
              ) == 'active'

        - name: Inspect stopped Rigel native cron state
          ansible.builtin.stat:
            path: /var/lib/hermes/rigel/.hermes/profiles/rigel/cron/jobs.json
            follow: false
          register: hermes_automation_rigel_stopped_cron
          check_mode: false
          when: hermes_automation_rigel_restart_required | bool

        - name: Refresh the native cron backup with Rigel stopped
          ansible.builtin.copy:
            src: /var/lib/hermes/rigel/.hermes/profiles/rigel/cron/jobs.json
            dest: >-
              {{ hermes_automation_backup_root
                 }}/var__lib__hermes__rigel__cron__jobs.json
            remote_src: true
            owner: root
            group: root
            mode: "0600"
          when:
            - hermes_automation_rigel_restart_required | bool
            - hermes_automation_rigel_stopped_cron.stat.exists

        - name: Reconcile Rigel jobs through the native Hermes API
          ansible.builtin.command:
            argv:
              - /usr/sbin/runuser
              - --user
              - hermes-rigel
              - --
              - /usr/bin/env
              - HOME=/var/lib/hermes/rigel
              - HERMES_HOME=/var/lib/hermes/rigel/.hermes/profiles/rigel
              - "{{ hermes_shadow_runtime_venv }}/bin/python"
              - "{{ hermes_cron_reconcile_live }}"
              - --manifest
              - "{{ hermes_rigel_automation_manifest_live }}"
              - --home
              - /var/lib/hermes/rigel/.hermes/profiles/rigel
              - --profile
              - rigel
              - >-
                {{
                  '--seed'
                  if hermes_automation_schedule_mode == 'seed'
                  else '--restore'
                }}
          register: hermes_automation_rigel_reconcile
          changed_when: >-
            (hermes_automation_rigel_reconcile.stdout | from_json).changes
            | length > 0
          check_mode: false
          when: hermes_automation_rigel_schedule_reconcile_required | bool

        - name: Start Rigel through the native systemd readiness window
          ansible.builtin.systemd_service:
            name: hermes-gateway-rigel.service
            state: started
            enabled: true
          when:
            - hermes_rigel_dedicated_discord_enabled | bool
            - not hermes_automation_defer_gateway_restart | bool

        - name: Ensure all configured production consumers remain active
          ansible.builtin.systemd_service:
            name: "hermes-gateway-{{ item }}.service"
            state: started
            enabled: true
          loop: >-
            {{
              ['astra', 'dubble']
              + (
                  ['rigel']
                  if hermes_rigel_dedicated_discord_enabled | bool
                  else []
                )
            }}
          when: not hermes_automation_defer_gateway_restart | bool

        - name: Resolve production Gateway mount namespaces
          ansible.builtin.command:
            argv:
              - /usr/bin/systemctl
              - show
              - --property=MainPID
              - --value
              - "{{ item.unit }}"
          loop: "{{ hermes_production_consumer_profiles }}"
          loop_control:
            label: "{{ item.name }}"
          register: hermes_automation_gateway_pids
          changed_when: false
          when: not hermes_automation_defer_gateway_restart | bool

        - name: Require live production Gateway processes
          ansible.builtin.assert:
            that:
              - item.stdout is match('^[1-9][0-9]*$')
              - item.stdout | int > 1
            fail_msg: >-
              Hermes Gateway {{ item.item.name }} has no live MainPID after
              native readiness.
          loop: "{{ hermes_automation_gateway_pids.results }}"
          loop_control:
            label: "{{ item.item.name }}"
          when: not hermes_automation_defer_gateway_restart | bool

        - name: Verify profile skills through native runtime discovery
          ansible.builtin.command:
            argv:
              - /usr/bin/nsenter
              - "--mount=/proc/{{ item.stdout }}/ns/mnt"
              - --
              - /usr/sbin/runuser
              - --user
              - "{{ item.item.user }}"
              - --
              - /usr/bin/env
              - "HOME={{ item.item.account_home }}"
              - "HERMES_HOME={{ item.item.home }}"
              - "{{ hermes_shadow_runtime_venv }}/bin/python"
              - "{{ hermes_profile_skills_validator_live }}"
              - --contract
              - "{{ hermes_profile_skills_contract_live }}"
              - --mode
              - native
              - --profile
              - "{{ item.item.name }}"
              - --hermes-source
              - /usr/local/lib/hermes-agent
          loop: "{{ hermes_automation_gateway_pids.results }}"
          loop_control:
            label: "{{ item.item.name }}"
          changed_when: false
          when: not hermes_automation_defer_gateway_restart | bool

        - name: Enable production automation and backup timers
          ansible.builtin.systemd_service:
            name: "{{ item }}"
            state: started
            enabled: true
          loop: "{{ hermes_automation_enabled_timers }}"
          when: not hermes_automation_defer_gateway_restart | bool

        - name: Resume native update timers after convergence
          ansible.builtin.systemd_service:
            name: "{{ item }}"
            state: started
            enabled: true
          loop:
            - "{{ hermes_native_update_timer }}"
            - "{{ hermes_tirith_update_timer }}"
          when: not hermes_automation_defer_gateway_restart | bool

        - name: Audit Astra native schedule declarations after convergence
          ansible.builtin.command:
            argv:
              - /usr/sbin/runuser
              - --user
              - hermes-astra
              - --
              - /usr/bin/env
              - HOME=/var/lib/hermes/astra
              - HERMES_HOME=/var/lib/hermes/astra/.hermes/profiles/astra
              - "{{ hermes_shadow_runtime_venv }}/bin/python"
              - "{{ hermes_cron_reconcile_live }}"
              - --manifest
              - "{{ hermes_automation_manifest_live }}"
              - --home
              - /var/lib/hermes/astra/.hermes/profiles/astra
              - --profile
              - astra
              - --audit
          register: hermes_automation_reconcile_check
          changed_when: false
          failed_when: hermes_automation_reconcile_check.rc not in [0, 3]
          check_mode: false

        - name: Audit Dubble native schedule declarations after convergence
          ansible.builtin.command:
            argv:
              - /usr/sbin/runuser
              - --user
              - hermes-dubble
              - --
              - /usr/bin/env
              - HOME=/var/lib/hermes/dubble
              - HERMES_HOME=/var/lib/hermes/dubble/.hermes/profiles/dubble
              - "{{ hermes_shadow_runtime_venv }}/bin/python"
              - "{{ hermes_cron_reconcile_live }}"
              - --manifest
              - "{{ hermes_dubble_automation_manifest_live }}"
              - --home
              - /var/lib/hermes/dubble/.hermes/profiles/dubble
              - --profile
              - dubble
              - --audit
          register: hermes_automation_dubble_reconcile_check
          changed_when: false
          failed_when: >-
            hermes_automation_dubble_reconcile_check.rc not in [0, 3]
          check_mode: false

        - name: Audit Rigel native schedule declarations after convergence
          ansible.builtin.command:
            argv:
              - /usr/sbin/runuser
              - --user
              - hermes-rigel
              - --
              - /usr/bin/env
              - HOME=/var/lib/hermes/rigel
              - HERMES_HOME=/var/lib/hermes/rigel/.hermes/profiles/rigel
              - "{{ hermes_shadow_runtime_venv }}/bin/python"
              - "{{ hermes_cron_reconcile_live }}"
              - --manifest
              - "{{ hermes_rigel_automation_manifest_live }}"
              - --home
              - /var/lib/hermes/rigel/.hermes/profiles/rigel
              - --profile
              - rigel
              - --audit
          register: hermes_automation_rigel_reconcile_check
          changed_when: false
          failed_when: >-
            hermes_automation_rigel_reconcile_check.rc not in [0, 3]
          check_mode: false

        - name: Report native schedule declaration differences without mutation
          ansible.builtin.debug:
            msg:
              scheduleMode: "{{ hermes_automation_schedule_mode }}"
              astraDifferences: >-
                {{
                  (hermes_automation_reconcile_check.stdout | from_json)
                  .changes | length
                }}
              dubbleDifferences: >-
                {{
                  (hermes_automation_dubble_reconcile_check.stdout | from_json)
                  .changes | length
                }}
              rigelDifferences: >-
                {{
                  (hermes_automation_rigel_reconcile_check.stdout | from_json)
                  .changes | length
                }}

        - name: Require every requested native schedule seed creation
          ansible.builtin.assert:
            that:
              - >-
                (hermes_automation_reconcile_check.stdout | from_json).changes
                | selectattr('action', 'equalto', 'create') | list | length == 0
              - >-
                (
                  hermes_automation_dubble_reconcile_check.stdout
                  | from_json
                ).changes
                | selectattr('action', 'equalto', 'create') | list | length == 0
              - >-
                (
                  hermes_automation_rigel_reconcile_check.stdout
                  | from_json
                ).changes
                | selectattr('action', 'equalto', 'create') | list | length == 0
          when: hermes_automation_schedule_mode == 'seed'

        - name: Require exact native schedule restoration when requested
          ansible.builtin.assert:
            that:
              - >-
                (hermes_automation_reconcile_check.stdout | from_json).changes
                | length == 0
              - >-
                (
                  hermes_automation_dubble_reconcile_check.stdout
                  | from_json
                ).changes | length == 0
              - >-
                (
                  hermes_automation_rigel_reconcile_check.stdout
                  | from_json
                ).changes | length == 0
          when: hermes_automation_schedule_mode == 'restore'

        - name: Require active production Hermes automation units
          ansible.builtin.command:
            argv:
              - /usr/bin/systemctl
              - is-active
              - "{{ item }}"
          loop: >-
            {{ (
                 []
                 if hermes_automation_defer_gateway_restart | bool
                 else ['hermes-gateway-astra.service',
                       'hermes-gateway-dubble.service']
               )
               + (
                   ['hermes-gateway-rigel.service']
                   if (
                     hermes_rigel_dedicated_discord_enabled | bool
                     and not hermes_automation_defer_gateway_restart | bool
                   )
                   else []
                 )
               + [hermes_native_update_timer,
                hermes_tirith_update_timer]
               + hermes_automation_enabled_timers }}
          register: hermes_automation_live_units
          changed_when: false
          check_mode: false
          when: not hermes_automation_defer_gateway_restart | bool

        - name: Require every production automation unit active
          ansible.builtin.assert:
            that:
              - item.stdout == 'active'
          loop: "{{ hermes_automation_live_units.results }}"
          loop_control:
            label: "{{ item.item }}"
          when: not hermes_automation_defer_gateway_restart | bool

        - name: Verify Health receiver remains active
          ansible.builtin.command:
            argv:
              - /usr/sbin/runuser
              - --user
              - "{{ hermes_production_cutover_user }}"
              - --
              - /usr/bin/systemctl
              - --user
              - is-active
              - "{{ hermes_production_cutover_health_service }}"
          environment: "{{ hermes_automation_user_environment }}"
          register: hermes_automation_health_state
          changed_when: false
          check_mode: false

        - name: Require Health receiver continuity
          ansible.builtin.assert:
            that:
              - hermes_automation_health_state.stdout == 'active'

        - name: Mark the automation transaction successful
          ansible.builtin.set_fact:
            hermes_automation_transaction_succeeded: true

      rescue:
        - name: Inspect automation timers available during rescue
          ansible.builtin.command:
            argv:
              - /usr/bin/systemctl
              - show
              - "{{ item }}"
              - --property=LoadState
              - --value
          loop: "{{ hermes_automation_enabled_timers }}"
          register: hermes_automation_rescue_timer_units
          changed_when: false

        - name: Stop available Hermes automation timers before restore
          ansible.builtin.systemd_service:
            name: "{{ item.item }}"
            state: stopped
            enabled: false
          loop: "{{ hermes_automation_rescue_timer_units.results }}"
          loop_control:
            label: "{{ item.item }}"
          when: item.stdout == 'loaded'

        - name: Stop Hermes consumers before restoring prior cron state
          ansible.builtin.systemd_service:
            name: "{{ item }}"
            state: stopped
          loop:
            - hermes-gateway-astra.service
            - hermes-gateway-dubble.service
            - hermes-gateway-rigel.service

        - name: Restore backed-up automation, policy, and Gateway files
          ansible.builtin.copy:
            src: >-
              {{ hermes_automation_backup_root
                 }}/{{ item.item | regex_replace('^/', '')
                                  | regex_replace('/', '__') }}
            dest: "{{ item.item }}"
            remote_src: true
            owner: "{{ item.stat.pw_name }}"
            group: "{{ item.stat.gr_name }}"
            mode: "{{ item.stat.mode }}"
          loop: "{{ hermes_automation_rollback_stats.results }}"
          loop_control:
            label: "{{ item.item }}"
          when: item.stat.exists and item.stat.isreg

        - name: Remove changed automation state directories before restore
          ansible.builtin.file:
            path: "{{ item.item }}"
            state: absent
          loop: "{{ hermes_automation_rollback_stats.results }}"
          loop_control:
            label: "{{ item.item }}"
          when: item.stat.exists and item.stat.isdir

        - name: Restore backed-up automation state directories
          ansible.builtin.command:
            argv:
              - /usr/bin/tar
              - --extract
              - --file
              - >-
                {{ hermes_automation_backup_root
                   }}/{{ item.item | regex_replace('^/', '')
                                    | regex_replace('/', '__') }}.tar
              - --acls
              - --xattrs
              - --numeric-owner
              - --directory
              - "{{ item.item | dirname }}"
          loop: "{{ hermes_automation_rollback_stats.results }}"
          loop_control:
            label: "{{ item.item }}"
          when: item.stat.exists and item.stat.isdir
          changed_when: true

        - name: Remove files introduced by the failed transaction
          ansible.builtin.file:
            path: "{{ item.item }}"
            state: absent
          loop: "{{ hermes_automation_rollback_stats.results }}"
          loop_control:
            label: "{{ item.item }}"
          when: not item.stat.exists

        - name: Reload restored systemd units
          ansible.builtin.systemd_service:
            daemon_reload: true

        - name: Restore pre-transaction Hermes consumer state after failure
          ansible.builtin.systemd_service:
            name: "{{ item.name }}"
            state: "{{ 'started' if item.active == 'active' else 'stopped' }}"
            enabled: "{{ item.enabled == 'enabled' }}"
          loop: "{{ hermes_automation_prior_gateways | default([]) }}"
          loop_control:
            label: "{{ item.name }}"
          when: item.exists

        - name: Clear failed Gateway status after exact state restore
          ansible.builtin.command:
            argv:
              - /usr/bin/systemctl
              - reset-failed
              - "{{ item.name }}"
          loop: "{{ hermes_automation_prior_gateways | default([]) }}"
          loop_control:
            label: "{{ item.name }}"
          changed_when: false
          when: item.exists

        - name: Fail after restoring the pre-automation state
          ansible.builtin.fail:
            msg: >-
              Hermes automation convergence failed. Prior jobs, managed
              policies, and units were restored from
              {{ hermes_automation_backup_root }}. OpenClaw remained offline.

  handlers:
    - name: Restore pre-transaction timer state
      ansible.builtin.systemd_service:
        name: "{{ item.name }}"
        state: "{{ 'started' if item.active == 'active' else 'stopped' }}"
        enabled: "{{ item.enabled == 'enabled' }}"
      loop: "{{ hermes_automation_prior_timers | default([]) }}"
      loop_control:
        label: "{{ item.name }}"
      when:
        - item.exists
        - item.name not in hermes_automation_retired_timers
        - not (hermes_automation_transaction_succeeded | default(false) | bool)
