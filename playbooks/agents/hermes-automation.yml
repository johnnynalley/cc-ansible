              - --
              - /usr/bin/python3
              - "{{ hermes_vdirsyncer_state_migrator_live }}"
              - --collections
              - >-
                {{ hermes_astra_calendar_live_root
                }}/status/personal.collections
              - --old-root
              - /home/johnny/.local/share/vdirsyncer/calendars
              - --new-root
              - >-
                {{ hermes_astra_calendar_live_root }}/calendars
              - --apply
          register: hermes_automation_calendar_state_migration
          changed_when: >-
            (hermes_automation_calendar_state_migration.stdout | from_json)
            .replacements > 0

        - name: Verify imported Astra vdirsyncer collection paths
          ansible.builtin.command:
            argv:
              - /usr/sbin/runuser
              - --user
              - hermes-astra
              - --
              - /usr/bin/python3
              - "{{ hermes_vdirsyncer_state_migrator_live }}"
              - --collections
              - >-
                {{ hermes_astra_calendar_live_root
                }}/status/personal.collections
              - --old-root
              - /home/johnny/.local/share/vdirsyncer/calendars
              - --new-root
