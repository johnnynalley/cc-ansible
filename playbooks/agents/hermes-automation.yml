            group: root
            mode: "0755"

        - name: Create verified geckodriver package cache directories
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            owner: root
            group: root
            mode: "0755"
          loop:
            - "{{ hermes_fortnite_geckodriver_cache_root }}"
            - >-
              {{ hermes_fortnite_geckodriver_cache_root
                 }}/{{ hermes_fortnite_geckodriver_version }}

        - name: Download the reviewed stable geckodriver archive
          ansible.builtin.get_url:
            url: "{{ hermes_fortnite_geckodriver_url }}"
            dest: >-
              {{ hermes_fortnite_geckodriver_cache_root
                 }}/{{ hermes_fortnite_geckodriver_archive_name }}
            checksum: "sha256:{{ hermes_fortnite_geckodriver_sha256 }}"
            owner: root
            group: root
            mode: "0644"

        - name: Extract the reviewed stable geckodriver archive once
          ansible.builtin.unarchive:
            src: >-
              {{ hermes_fortnite_geckodriver_cache_root
                 }}/{{ hermes_fortnite_geckodriver_archive_name }}
            dest: >-
              {{ hermes_fortnite_geckodriver_cache_root
                 }}/{{ hermes_fortnite_geckodriver_version }}
            remote_src: true
            creates: >-
              {{ hermes_fortnite_geckodriver_cache_root
                 }}/{{ hermes_fortnite_geckodriver_version }}/geckodriver

        - name: Verify the extracted stable geckodriver version
          ansible.builtin.command:
            argv:
              - >-
                {{ hermes_fortnite_geckodriver_cache_root
                   }}/{{ hermes_fortnite_geckodriver_version }}/geckodriver
              - --version
          register: hermes_automation_extracted_geckodriver_version
          changed_when: false

        - name: Require the exact reviewed stable geckodriver version
          ansible.builtin.assert:
            that:
              - >-
                hermes_automation_extracted_geckodriver_version.stdout
                is match(
                  '^geckodriver '
                  ~ hermes_fortnite_geckodriver_version
                  ~ '(\\s|$)'
