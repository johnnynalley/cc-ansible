---
# Purpose: Converge production Hermes schedules, collectors, and backups.
# Hosts: hermes_hosts.
# Key vars: hermes_automation_*, hermes_shadow_*, cutover variables.
# Templates: Hermes automation, calendar, feed, and backup units.
# Scripts: scripts/agents/hermes-*.py production automation helpers.
# Validation: syntax-check this playbook before applying it.

- name: Converge Hermes production automation
  hosts: hermes_hosts
  become: true
  gather_facts: true
  force_handlers: true

  vars:
    hermes_automation_rigel_profile: >-
      {{ hermes_shadow_profiles | selectattr('name', 'equalto', 'rigel') | first }}
    hermes_automation_rigel_environment_file: >-
      {{
        hermes_automation_rigel_profile.environment_file
        | default('/etc/hermes/rigel/.env')
      }}
    hermes_automation_backup_id: >-
      {{ ansible_facts['date_time']['iso8601_basic_short'] }}-pre-automation
    hermes_automation_backup_root: >-
      {{ hermes_production_cutover_rollback_root
         }}/{{ hermes_automation_backup_id }}
    hermes_automation_user_environment:
      XDG_RUNTIME_DIR: >-
        /run/user/{{ hermes_production_cutover_user_uid }}
      DBUS_SESSION_BUS_ADDRESS: >-
        unix:path=/run/user/{{ hermes_production_cutover_user_uid }}/bus
    hermes_automation_profile_skills_contract: >-
      {{
        lookup(
          'ansible.builtin.file',
          ansible_config_file | dirname
          ~ '/' ~ hermes_profile_skills_contract_source
        ) | from_json
      }}
    hermes_automation_template_units:
      - name: hermes-retained-automation@.service
        source: hermes-retained-automation@.service.j2
      - name: hermes-daily-updates-collect.timer
        source: hermes-daily-updates-collect.timer.j2
      - name: hermes-daily-media-collect.timer
        source: hermes-daily-media-collect.timer.j2
      - name: hermes-daily-personal-collect.timer
        source: hermes-daily-personal-collect.timer.j2
      - name: hermes-daily-summary-assemble.timer
        source: hermes-daily-summary-assemble.timer.j2
      - name: hermes-fortnite-progress-collect.timer
        source: hermes-fortnite-progress-collect.timer.j2
      - name: hermes-warframe-feed.service
        source: hermes-warframe-feed.service.j2
      - name: hermes-warframe-feed.timer
        source: hermes-warframe-feed.timer.j2
      - name: hermes-fortnite-calendar-fetch.service
        source: hermes-fortnite-calendar-fetch.service.j2
      - name: hermes-fortnite-calendar.service
        source: hermes-fortnite-calendar.service.j2
      - name: hermes-fortnite-calendar.timer
        source: hermes-fortnite-calendar.timer.j2
      - name: hermes-profile-backup@.service
        source: hermes-profile-backup@.service.j2
      - name: hermes-profile-backup@.timer
        source: hermes-profile-backup@.timer.j2
    hermes_automation_rollback_paths: >-
      {{
        [
          '/var/lib/hermes/astra/.hermes/profiles/astra/cron/jobs.json',
          '/var/lib/hermes/dubble/.hermes/profiles/dubble/cron/jobs.json',
          '/var/lib/hermes/rigel/.hermes/profiles/rigel/cron/jobs.json',
          hermes_automation_manifest_live,
          hermes_dubble_automation_manifest_live,
          hermes_rigel_automation_manifest_live,
          '/etc/hermes/astra/production-jobs.json',
          '/etc/hermes/dubble/production-jobs.json',
          '/etc/hermes/astra/production-automation-reconciliation.json',
          hermes_automation_reconciliation_live,
          hermes_openclaw_parity_contract_live,
          hermes_production_cutover_enrollment,
          '/etc/hermes/astra/.env',
          '/etc/hermes/dubble/.env',
          hermes_automation_rigel_environment_file,
          hermes_freshrss_credential_live,
          hermes_astra_freshrss_live_root,
          hermes_astra_calendar_live_root,
          hermes_freshrss_collect_live,
          '/etc/systemd/system/hermes-gateway-astra.service',
          '/etc/systemd/system/' ~ hermes_native_update_service,
          '/etc/sudoers.d/hermes-native-update',
          hermes_cron_reconcile_live,
          hermes_docker_inventory_validator_live,
          hermes_retained_automation_live,
          hermes_retained_media_live,
          hermes_retained_collector_environment_live,
          hermes_vdirsyncer_state_migrator_live,
          hermes_daily_updates_live,
          hermes_warframe_feed_live,
          hermes_fortnite_calendar_compat_live,
          hermes_fortnite_calendar_fetch_live,
          hermes_fortnite_calendar_schedule_live,
          hermes_fortnite_geckodriver_path,
          hermes_astra_vdirsyncer_config_live,
          hermes_astra_khal_config_live,
          hermes_astra_himalaya_config_live,
          hermes_astra_himalaya_live_binary,
          hermes_openclaw_parity_validator_live,
          hermes_profile_skills_validator_live,
          hermes_profile_skills_contract_live,
          hermes_bootstrap_parity_validator_live,
          hermes_bootstrap_parity_contract_live,
          '/etc/hermes/astra/skills',
          '/etc/hermes/dubble/skills',
          '/etc/hermes/rigel/skills'
        ]
        + hermes_shadow_profiles
          | map(attribute='name')
          | map('regex_replace', '^', '/etc/hermes/')
          | map('regex_replace', '$', '/config.yaml')
          | list
        + hermes_shadow_profiles
          | map(attribute='name')
          | map('regex_replace', '^', '/etc/hermes/')
          | map('regex_replace', '$', '/managed-policy.sha256')
          | list
        + hermes_shadow_profiles
          | map(attribute='account_home')
          | map('regex_replace', '$', '/.hermes/.backup.lock')
          | list
        + hermes_shadow_profiles
          | map(attribute='home')
          | map('regex_replace', '$', '/config.yaml')
          | list
        + hermes_automation_system_units
          | map('regex_replace', '^', '/etc/systemd/system/')
          | list
        + hermes_automation_retired_timers
          | map('regex_replace', '^', '/etc/systemd/system/')
          | list
        + hermes_automation_astra_scripts
          | map(attribute='destination')
          | map(
              'regex_replace',
              '^',
              hermes_native_update_profile_home ~ '/scripts/'
            )
          | list
        + hermes_automation_rigel_scripts
          | map(attribute='destination')
          | map(
              'regex_replace',
              '^',
              '/var/lib/hermes/rigel/.hermes/profiles/rigel/scripts/'
            )
          | list
      }}

  tasks:
    - name: Validate Hermes automation mode
      ansible.builtin.assert:
        that:
          - hermes_automation_mode in ['disabled', 'converge']
          - >-
            hermes_automation_schedule_mode
            in ['preserve', 'audit', 'seed', 'restore']
        fail_msg: hermes_automation_mode must be disabled or converge.

    - name: Skip hosts without Hermes automation approval
      ansible.builtin.meta: end_host
      when: hermes_automation_mode == 'disabled'

    - name: Require exact Hermes automation authorization
      ansible.builtin.assert:
        that:
          - hermes_automation_approved | bool
          - >-
            hermes_automation_confirmation
            == hermes_automation_required_confirmation
          - inventory_hostname == 'jn-t14s-lin'
          - hermes_automation_output_root == '/var/lib/hermes-automation'
          - >-
            hermes_automation_native_workspace
            == '/var/lib/hermes-automation/workspace'
          - hermes_shadow_profiles | map(attribute='name') | list
            == ['astra', 'dubble', 'rigel']
          - hermes_automation_defer_gateway_restart in [true, false]
        fail_msg: >-
          Production automation requires host-specific approval and the exact
          confirmation string.

    - name: Require explicit native schedule mutation authorization
      ansible.builtin.assert:
        that:
          - >-
            hermes_automation_schedule_mode == 'seed'
            and hermes_automation_schedule_confirmation
                == hermes_automation_schedule_seed_confirmation
            or hermes_automation_schedule_mode == 'restore'
            and hermes_automation_schedule_confirmation
                == hermes_automation_schedule_restore_confirmation
        fail_msg: >-
          Native schedule seed or exact restore requires its own reviewed
          confirmation string; normal platform convergence preserves schedules.
      when: hermes_automation_schedule_mode in ['seed', 'restore']

    - name: Build managed profile skill inventory for automation convergence
      ansible.builtin.set_fact:
        hermes_automation_profile_skills_inventory: >-
          {{
            (hermes_automation_profile_skills_inventory | default([]))
            + [
                item.1 | combine({
                  'profile': item.0.key,
                  'group': item.0.value.group,
                  'managedRoot': item.0.value.managedRoot
                })
              ]
          }}
      loop: >-
        {{
          hermes_automation_profile_skills_contract.profiles
          | dict2items
          | subelements('value.skills')
        }}
      loop_control:
        label: "{{ item.0.key }}/{{ item.1.name }}"

    - name: Require the complete managed profile skill inventory
      ansible.builtin.assert:
        that:
          - >-
            hermes_automation_profile_skills_contract.profiles.keys()
            | list | sort == ['astra', 'dubble', 'rigel']
          - hermes_automation_profile_skills_inventory | length == 39
          - >-
            hermes_automation_profile_skills_inventory
            | map(attribute='profile') | unique | sort
            == ['astra', 'dubble', 'rigel']
        fail_msg: >-
          Automation refuses to publish an incomplete managed skill contract.

    - name: Check OpenClaw user Gateway before automation convergence
      ansible.builtin.command:
        argv:
          - /usr/sbin/runuser
          - --user
          - "{{ hermes_production_cutover_user }}"
          - --
          - /usr/bin/systemctl
          - --user
          - is-active
          - "{{ hermes_production_cutover_user_gateway }}"
      environment: "{{ hermes_automation_user_environment }}"
      register: hermes_automation_openclaw_state
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Require the OpenClaw scheduler and delivery path offline
      ansible.builtin.assert:
        that:
          - hermes_automation_openclaw_state.stdout != 'active'
        fail_msg: >-
          Refusing to activate Hermes automation while OpenClaw is active.

    - name: Inspect retained automation prerequisites
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - "{{ hermes_astra_himalaya_live_binary }}"
        - "{{ hermes_astra_vdirsyncer_config_live }}"
        - "{{ hermes_astra_khal_config_live }}"
        - "{{ hermes_astra_himalaya_config_live }}"
        - "{{ hermes_freshrss_credential_live }}"
        - "{{ hermes_automation_native_environment_live }}"
      register: hermes_automation_prerequisites
      check_mode: false

    - name: Resolve the managed Hermes Python prerequisite
      ansible.builtin.stat:
        path: "{{ hermes_shadow_runtime_venv }}/bin/python"
        follow: true
      register: hermes_automation_python_prerequisite
      check_mode: false

    - name: Resolve the Fortnite browser prerequisite
      ansible.builtin.stat:
        path: "{{ hermes_fortnite_firefox_binary_path }}"
        follow: true
      register: hermes_automation_firefox_prerequisite
      check_mode: false

    - name: Require complete retained automation prerequisites
      ansible.builtin.assert:
        that:
          - >-
            hermes_automation_prerequisites.results
            | map(attribute='stat.exists')
            | min
          - >-
            hermes_automation_prerequisites.results
            | map(attribute='stat.isreg', default=false)
            | min
          - hermes_automation_python_prerequisite.stat.exists | default(false)
          - hermes_automation_python_prerequisite.stat.isreg | default(false)
          - >-
            hermes_automation_firefox_prerequisite.stat.exists
            | default(false)
          - >-
            hermes_automation_firefox_prerequisite.stat.isreg
            | default(false)
        fail_msg: >-
          A reviewed retained collector, runtime, or private environment is
          missing. No live automation changes were made.

    - name: Load the complete production schedule reconciliation
      ansible.builtin.set_fact:
        hermes_automation_reconciliation: >-
          {{
            lookup(
              'ansible.builtin.file',
              ansible_config_file | dirname
              ~ '/' ~ hermes_automation_reconciliation_source
            ) | from_json
          }}

    - name: Require every current and historical scheduler lane reconciled
      ansible.builtin.assert:
        that:
          - hermes_automation_reconciliation.schemaVersion == 3
          - >-
            hermes_automation_reconciliation.source.totalActiveReconciledLanes
            == 29
          - >-
            hermes_automation_reconciliation.source.totalHistoricalReconciledLanes
            == 7
          - hermes_automation_reconciliation.lanes | length == 29
          - hermes_automation_reconciliation.historicalLanes | length == 7
          - hermes_automation_reconciliation.production.nativeCronJobs == 19
          - >-
            hermes_automation_reconciliation.production
            .astraFallbackNativeCronJobs == 18
          - >-
            hermes_automation_reconciliation.production
            .astraDedicatedNativeCronJobs == 17
          - >-
            hermes_automation_reconciliation.production.dubbleNativeCronJobs
            == 1
          - >-
            hermes_automation_reconciliation.production.rigelNativeCronJobs
            == 1
          - >-
            hermes_automation_reconciliation.production.openclawScheduler
            == 'offline'
          - >-
            hermes_automation_reconciliation.lanes
            ['heartbeat-dubble'].target == 'dubble-thread-followup'
        fail_msg: >-
          The production schedule reconciliation is incomplete or no longer
          matches the approved migration boundary.

    - name: Inspect subscription-backed primary model credentials
      ansible.builtin.command:
        argv:
          - /usr/sbin/runuser
          - --user
          - "{{ item.user }}"
          - --
          - /usr/bin/env
          - "HOME={{ item.account_home }}"
          - "HERMES_HOME={{ item.home }}"
          - "HERMES_MANAGED_DIR=/etc/hermes/{{ item.name }}"
          - "{{ hermes_shadow_runtime_binary }}"
          - auth
          - list
          - "{{ item.model_provider }}"
      loop: >-
        {{ hermes_shadow_profiles
           | selectattr('model_provider', 'equalto', 'openai-codex')
           | list }}
      loop_control:
        label: "{{ item.name }}"
      register: hermes_automation_subscription_auth
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Require native subscription-backed primary model credentials
      ansible.builtin.assert:
        that:
          - item.rc == 0
          - >-
            (item.stdout
             | regex_search(
                 '^openai-codex \\([1-9][0-9]* credentials?\\):'
               )) is not none
        fail_msg: >-
          Hermes profile {{ item.item.name }} selects openai-codex but has no
          native subscription-backed credential. Enroll that isolated profile
          with `hermes auth add openai-codex --type oauth` before production
          automation convergence; do not substitute a metered API key.
      loop: "{{ hermes_automation_subscription_auth.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Stop after read-only Hermes automation check-mode preflight
      ansible.builtin.meta: end_host
      when: ansible_check_mode

    - name: Inspect pre-transaction timer load state
      ansible.builtin.command:
        argv:
          - /usr/bin/systemctl
          - show
          - "{{ item }}"
          - --property=LoadState
          - --value
      loop: >-
        {{ hermes_automation_enabled_timers
           + hermes_automation_retired_timers
           + [hermes_native_update_timer, hermes_tirith_update_timer] }}
      register: hermes_automation_prior_timer_units
      changed_when: false

    - name: Inspect pre-transaction Hermes Gateway load state
      ansible.builtin.command:
        argv:
          - /usr/bin/systemctl
          - show
          - "{{ item }}"
          - --property=LoadState
          - --value
      loop:
        - hermes-gateway-astra.service
        - hermes-gateway-dubble.service
        - hermes-gateway-rigel.service
      register: hermes_automation_prior_gateway_units
      changed_when: false
      check_mode: false

    - name: Inspect pre-transaction Hermes Gateway activity
      ansible.builtin.command:
        argv:
          - /usr/bin/systemctl
          - is-active
          - "{{ item }}"
      loop:
        - hermes-gateway-astra.service
        - hermes-gateway-dubble.service
        - hermes-gateway-rigel.service
      register: hermes_automation_prior_gateway_activity
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Inspect pre-transaction Hermes Gateway enablement
      ansible.builtin.command:
        argv:
          - /usr/bin/systemctl
          - is-enabled
          - "{{ item }}"
      loop:
        - hermes-gateway-astra.service
        - hermes-gateway-dubble.service
        - hermes-gateway-rigel.service
      register: hermes_automation_prior_gateway_enablement
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Record pre-transaction Hermes Gateway state
      ansible.builtin.set_fact:
        hermes_automation_prior_gateways: >-
          {{
            (hermes_automation_prior_gateways | default([]))
            + [{
              'name': item.item,
              'exists': item.stdout == 'loaded',
              'active': hermes_automation_prior_gateway_activity.results[
                gateway_index
              ].stdout,
              'enabled': hermes_automation_prior_gateway_enablement.results[
                gateway_index
              ].stdout
            }]
          }}
      loop: "{{ hermes_automation_prior_gateway_units.results }}"
      loop_control:
        index_var: gateway_index
        label: "{{ item.item }}"

    - name: Require an existing stopped maintenance window before deferred restart
      ansible.builtin.assert:
        that:
          - hermes_automation_prior_gateways | length == 3
          - >-
            hermes_automation_prior_gateways
            | rejectattr('exists', 'equalto', true)
            | list
            | length == 0
          - >-
            hermes_automation_prior_gateways
            | rejectattr('active', 'equalto', 'inactive')
            | list
            | length == 0
        fail_msg: >-
          Deferred Gateway restart is permitted only after the bounded parity
          maintenance transaction has stopped all three native Gateways.
      when: hermes_automation_defer_gateway_restart | bool

    - name: Inspect pre-transaction timer activity
      ansible.builtin.command:
        argv:
          - /usr/bin/systemctl
          - is-active
          - "{{ item }}"
      loop: >-
        {{ hermes_automation_enabled_timers
           + hermes_automation_retired_timers
           + [hermes_native_update_timer, hermes_tirith_update_timer] }}
      register: hermes_automation_prior_timer_activity
      changed_when: false
      failed_when: false

    - name: Inspect pre-transaction timer enablement
      ansible.builtin.command:
        argv:
          - /usr/bin/systemctl
          - is-enabled
          - "{{ item }}"
      loop: >-
        {{ hermes_automation_enabled_timers
           + hermes_automation_retired_timers
           + [hermes_native_update_timer, hermes_tirith_update_timer] }}
      register: hermes_automation_prior_timer_enablement
      changed_when: false
      failed_when: false

    - name: Record pre-transaction timer state
      ansible.builtin.set_fact:
        hermes_automation_prior_timers: >-
          {{
            (hermes_automation_prior_timers | default([]))
            + [{
              'name': item.item,
              'exists': item.stdout == 'loaded',
              'active': hermes_automation_prior_timer_activity.results[
                timer_index
              ].stdout,
              'enabled': hermes_automation_prior_timer_enablement.results[
                timer_index
              ].stdout
            }]
          }}
      loop: "{{ hermes_automation_prior_timer_units.results }}"
      loop_control:
        index_var: timer_index
        label: "{{ item.item }}"

    - name: Exclude existing timers from the automation transaction
      ansible.builtin.systemd_service:
        name: "{{ item.name }}"
        state: stopped
      loop: "{{ hermes_automation_prior_timers }}"
      loop_control:
        label: "{{ item.name }}"
      when:
        - item.exists
        - item.active == 'active'
      notify: Restore pre-transaction timer state

    - name: Recheck native updater workers after timer exclusion
      ansible.builtin.command:
        argv:
          - /usr/bin/systemctl
          - is-active
          - "{{ item }}"
      loop:
        - "{{ hermes_native_update_service }}"
        - "{{ hermes_tirith_update_service }}"
      register: hermes_automation_updater_services
      changed_when: false
      failed_when: false

    - name: Require both native updater workers idle after timer exclusion
      ansible.builtin.assert:
        that:
          - item.stdout != 'active'
        fail_msg: >-
          A native updater is active after its timer was stopped. Wait for it
          to finish before converging schedules or Gateway units.
      loop: "{{ hermes_automation_updater_services.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Require unique rollback paths inside approved roots
      ansible.builtin.assert:
        that:
          - >-
            hermes_automation_rollback_paths | length
            == hermes_automation_rollback_paths | unique | length
          - >-
            hermes_automation_rollback_paths
            | reject('match', '^/(?:etc|usr|var)/')
            | list
            | length == 0
        fail_msg: >-
          The automation transaction produced duplicate or out-of-scope
          rollback paths.

    - name: Create targeted pre-automation rollback directory
      ansible.builtin.file:
        path: "{{ hermes_automation_backup_root }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Inspect rollback source files
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop: "{{ hermes_automation_rollback_paths }}"
      register: hermes_automation_rollback_stats
      check_mode: false

    - name: Back up existing automation, policy, and Gateway files
      ansible.builtin.copy:
        src: "{{ item.item }}"
        dest: >-
          {{ hermes_automation_backup_root
             }}/{{ item.item | regex_replace('^/', '')
                              | regex_replace('/', '__') }}
        remote_src: true
        owner: root
        group: root
        mode: "0600"
      loop: "{{ hermes_automation_rollback_stats.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.stat.exists and item.stat.isreg

    - name: Back up existing automation state directories
      ansible.builtin.command:
        argv:
          - /usr/bin/tar
          - --create
          - --file
          - >-
            {{ hermes_automation_backup_root
               }}/{{ item.item | regex_replace('^/', '')
                                | regex_replace('/', '__') }}.tar
          - --acls
          - --xattrs
          - --numeric-owner
          - --directory
          - "{{ item.item | dirname }}"
          - "{{ item.item | basename }}"
      loop: "{{ hermes_automation_rollback_stats.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.stat.exists and item.stat.isdir
      changed_when: true

    - name: Normalize existing native profile backup locks
      ansible.builtin.file:
        path: "{{ item.account_home }}/.hermes/.backup.lock"
        state: file
        owner: "{{ item.user }}"
        group: "{{ item.group }}"
        mode: "0600"
      loop: "{{ hermes_shadow_profiles }}"
      loop_control:
        label: "{{ item.name }}"
      check_mode: false

    - name: Create private native profile backup staging directories
      ansible.builtin.file:
        path: "{{ item.home }}/backups/{{ hermes_automation_backup_id }}"
        state: directory
        owner: "{{ item.user }}"
        group: "{{ item.group }}"
        mode: "0700"
      loop: "{{ hermes_shadow_profiles }}"
      loop_control:
        label: "{{ item.name }}"
      check_mode: false

    - name: Create native pre-automation Hermes profile backups
      ansible.builtin.command:
        argv:
          - /usr/sbin/runuser
          - --user
          - "{{ item.user }}"
          - --
          - /usr/bin/env
          - "HOME={{ item.account_home }}"
          - "HERMES_HOME={{ item.home }}"
          - "{{ hermes_shadow_runtime_binary }}"
          - backup
          - --output
          - >-
            {{ item.home }}/backups/{{ hermes_automation_backup_id
            }}/profile.zip
      loop: "{{ hermes_shadow_profiles }}"
      loop_control:
        label: "{{ item.name }}"
      changed_when: true
      check_mode: false

    - name: Preserve native profile backups in the rollback directory
      ansible.builtin.copy:
        src: >-
          {{ item.home }}/backups/{{ hermes_automation_backup_id
          }}/profile.zip
        dest: "{{ hermes_automation_backup_root }}/hermes-{{ item.name }}.zip"
        remote_src: true
        owner: root
        group: root
        mode: "0600"
      loop: "{{ hermes_shadow_profiles }}"
      loop_control:
        label: "{{ item.name }}"
      check_mode: false

    - name: Read native Astra provider credentials privately
      ansible.builtin.slurp:
        src: "{{ hermes_automation_native_environment_live }}"
      register: hermes_automation_source_environment
      no_log: true

    - name: Identify missing native Fortnite collector credentials
      ansible.builtin.set_fact:
        hermes_automation_missing_fortnite_credentials: >-
          {{
            ['FORTNITE_API_KEY', 'API_FORTNITE_KEY']
            | reject(
                'in',
                hermes_automation_source_environment.content
                | b64decode
                | regex_findall('(?m)^([A-Z0-9_]+)=')
              )
            | list
          }}
      no_log: true

    - name: Read preserved Fortnite credentials for one-time native migration
      ansible.builtin.slurp:
        src: "{{ hermes_production_cutover_source_env }}"
      register: hermes_automation_fortnite_migration_environment
      when: hermes_automation_missing_fortnite_credentials | length > 0
      no_log: true

    - name: Require complete preserved Fortnite migration credentials
      ansible.builtin.assert:
        that:
          - hermes_automation_fortnite_migration_values | length == 1
          - hermes_automation_fortnite_migration_values[0] | length > 0
          - >-
            hermes_automation_fortnite_migration_values[0]
            is not search('[\r\n]')
        fail_msg: >-
          A missing Fortnite credential cannot be migrated into native Hermes
          storage. No native credential was changed.
      loop: "{{ hermes_automation_missing_fortnite_credentials }}"
      loop_control:
        label: "{{ item }}"
      vars:
        hermes_automation_fortnite_migration_values: >-
          {{
            hermes_automation_fortnite_migration_environment.content
            | b64decode
            | regex_findall('(?m)^' ~ item ~ '=([^\r\n]+)$')
          }}
      when: hermes_automation_missing_fortnite_credentials | length > 0
      no_log: true

    - name: Migrate Fortnite credentials into native Hermes storage once
      ansible.builtin.lineinfile:
        path: "{{ hermes_automation_native_environment_live }}"
        regexp: "^{{ item }}="
        line: >-
          {{ item }}={{
            (
              hermes_automation_fortnite_migration_environment.content
              | b64decode
              | regex_findall('(?m)^' ~ item ~ '=([^\r\n]+)$')
            )[0]
          }}
        owner: root
        group: hermes-astra
        mode: "0440"
      loop: "{{ hermes_automation_missing_fortnite_credentials }}"
      loop_control:
        label: "{{ item }}"
      when: hermes_automation_missing_fortnite_credentials | length > 0
      no_log: true

    - name: Refresh native Astra credentials after one-time migration
      ansible.builtin.slurp:
        src: "{{ hermes_automation_native_environment_live }}"
      register: hermes_automation_source_environment
      no_log: true

    - name: Read the native Sonarr credential privately
      ansible.builtin.slurp:
        src: /opt/media-stack/sonarr/config.xml
      delegate_to: docker-vm
      register: hermes_automation_sonarr_config
      no_log: true

    - name: Read the native Radarr credential privately
      ansible.builtin.slurp:
        src: /opt/media-stack/radarr/config.xml
      delegate_to: docker-vm
      register: hermes_automation_radarr_config
      no_log: true

    - name: Read the retained Tautulli credential privately
      ansible.builtin.slurp:
        src: /opt/media-stack/tautulli/config.ini
      delegate_to: media-vm
      register: hermes_automation_tautulli_config
      no_log: true

    - name: Read the retained Seerr credential privately
      ansible.builtin.slurp:
        src: /opt/seerr/config/settings.json
      delegate_to: docker-vm
      register: hermes_automation_seerr_config
      no_log: true

    - name: Resolve private retained collector credentials
      ansible.builtin.set_fact:
        hermes_automation_sonarr_api_key: >-
          {{
            hermes_automation_sonarr_config.content
            | b64decode
            | regex_findall('(?s)<ApiKey>\s*([^<]+?)\s*</ApiKey>')
            | first
            | default('', true)
            | trim
          }}
        hermes_automation_radarr_api_key: >-
          {{
            hermes_automation_radarr_config.content
            | b64decode
            | regex_findall('(?s)<ApiKey>\s*([^<]+?)\s*</ApiKey>')
            | first
            | default('', true)
            | trim
          }}
        hermes_automation_tautulli_api_key: >-
          {{
            hermes_automation_tautulli_config.content
            | b64decode
            | regex_findall('(?mi)^api_key\s*=\s*([^\r\n]+)$')
            | first
            | default('', true)
            | trim
          }}
        hermes_automation_seerr_api_key: >-
          {{
            (
              (hermes_automation_seerr_config.content | b64decode | from_json)
              .get('main', {})
              .get('apiKey', '')
            )
            or
            (
              (hermes_automation_seerr_config.content | b64decode | from_json)
              .get('apiKey', '')
            )
          }}
      no_log: true

    - name: Require complete retained collector credentials
      ansible.builtin.assert:
        that:
          - hermes_automation_sonarr_api_key | length > 0
          - hermes_automation_radarr_api_key | length > 0
          - hermes_automation_tautulli_api_key | length > 0
          - hermes_automation_seerr_api_key | length > 0
          - hermes_automation_sonarr_api_key is not search('[\r\n]')
          - hermes_automation_radarr_api_key is not search('[\r\n]')
          - hermes_automation_tautulli_api_key is not search('[\r\n]')
          - hermes_automation_seerr_api_key is not search('[\r\n]')
          - hermes_automation_collector_source_values | length == 1
          - hermes_automation_collector_source_values[0] | length > 0
          - hermes_automation_collector_source_values[0] is not search('[\r\n]')
        fail_msg: >-
          A required retained Daily Summary or Fortnite collector credential
          is missing or ambiguous. No managed collector secret was changed.
      loop:
        - FORTNITE_API_KEY
        - API_FORTNITE_KEY
      loop_control:
        label: "{{ item }}"
      vars:
        hermes_automation_collector_source_values: >-
          {{
            hermes_automation_source_environment.content
            | b64decode
            | regex_findall('(?m)^' ~ item ~ '=([^\r\n]+)$')
          }}
      no_log: true

    - name: Read current managed profile environments privately
      ansible.builtin.slurp:
        src: >-
          {{ item.environment_file | default('/etc/hermes/' ~ item.name ~ '/.env') }}
      loop: "{{ hermes_shadow_profiles }}"
      loop_control:
        label: "{{ item.name }}"
      register: hermes_automation_profile_environments
      no_log: true

    - name: Resolve current Discord consumer credentials privately
      ansible.builtin.set_fact:
        hermes_automation_astra_discord_token: >-
          {{
            hermes_automation_profile_environments.results[0].content
            | b64decode
            | regex_findall('(?m)^DISCORD_BOT_TOKEN=([^\r\n]+)$')
            | first
            | default('', true)
          }}
        hermes_automation_dubble_discord_token: >-
          {{
            hermes_automation_profile_environments.results[1].content
            | b64decode
            | regex_findall('(?m)^DISCORD_BOT_TOKEN=([^\r\n]+)$')
            | first
            | default('', true)
          }}
        hermes_automation_existing_rigel_discord_token: >-
          {{
            hermes_automation_profile_environments.results[2].content
            | b64decode
            | regex_findall('(?m)^DISCORD_BOT_TOKEN=([^\r\n]+)$')
            | first
            | default('', true)
          }}
      no_log: true

    - name: Refuse an implicit dedicated Rigel demotion
      ansible.builtin.assert:
        that:
          - >-
            hermes_rigel_dedicated_discord_enabled | bool
            or hermes_automation_existing_rigel_discord_token | length == 0
          - >-
            hermes_rigel_dedicated_discord_enabled | bool
            or (
              hermes_automation_prior_gateways
              | selectattr('name', 'equalto', 'hermes-gateway-rigel.service')
              | map(attribute='active')
              | first
            ) != 'active'
        fail_msg: >-
          Rigel is already a dedicated Discord consumer. Refusing to restore
          the transitional Astra-owned route without a separate rollback.
      no_log: true

    - name: Require a private third Discord credential for Rigel promotion
      ansible.builtin.assert:
        that:
          - hermes_automation_astra_discord_token | length >= 20
          - hermes_automation_dubble_discord_token | length >= 20
          - hermes_rigel_discord_bot_token | length >= 20
          - hermes_rigel_discord_bot_token | length <= 4096
          - hermes_rigel_discord_bot_token is not search('[\r\n]')
        fail_msg: >-
          Dedicated Rigel promotion requires the existing Astra and Dubble
          credentials plus one vault-backed Rigel bot token.
      when: hermes_rigel_dedicated_discord_enabled | bool
      no_log: true

    - name: Resolve Astra Discord application identity
      ansible.builtin.uri:
        url: https://discord.com/api/v10/users/@me
        method: GET
        headers:
          Authorization: "Bot {{ hermes_automation_astra_discord_token }}"
          User-Agent: ARK-Hermes-Rigel-Cutover/1.0
        return_content: true
        status_code: 200
      register: hermes_automation_astra_discord_identity
      when: hermes_rigel_dedicated_discord_enabled | bool
      no_log: true
      check_mode: false

    - name: Resolve Dubble Discord application identity
      ansible.builtin.uri:
        url: https://discord.com/api/v10/users/@me
        method: GET
        headers:
          Authorization: "Bot {{ hermes_automation_dubble_discord_token }}"
          User-Agent: ARK-Hermes-Rigel-Cutover/1.0
        return_content: true
        status_code: 200
      register: hermes_automation_dubble_discord_identity
      when: hermes_rigel_dedicated_discord_enabled | bool
      no_log: true
      check_mode: false

    - name: Resolve dedicated Rigel Discord application identity
      ansible.builtin.uri:
        url: https://discord.com/api/v10/users/@me
        method: GET
        headers:
          Authorization: "Bot {{ hermes_rigel_discord_bot_token }}"
          User-Agent: ARK-Hermes-Rigel-Cutover/1.0
        return_content: true
        status_code: 200
      register: hermes_automation_rigel_discord_identity
      when: hermes_rigel_dedicated_discord_enabled | bool
      no_log: true
      check_mode: false

    - name: Prove dedicated Rigel can access its exact Discord channel
      ansible.builtin.uri:
        url: >-
          https://discord.com/api/v10/channels/{{
            hermes_rigel_discord_channel_id
          }}
        method: GET
        headers:
          Authorization: "Bot {{ hermes_rigel_discord_bot_token }}"
          User-Agent: ARK-Hermes-Rigel-Cutover/1.0
        return_content: true
        status_code: 200
      register: hermes_automation_rigel_discord_channel
      when: hermes_rigel_dedicated_discord_enabled | bool
      no_log: true
      check_mode: false

    - name: Require three distinct Discord identities and the exact Rigel route
      ansible.builtin.assert:
        that:
          - hermes_automation_astra_discord_identity.json.bot | bool
          - hermes_automation_dubble_discord_identity.json.bot | bool
          - hermes_automation_rigel_discord_identity.json.bot | bool
          - >-
            [
              hermes_automation_astra_discord_identity.json.id,
              hermes_automation_dubble_discord_identity.json.id,
              hermes_automation_rigel_discord_identity.json.id
            ] | unique | length == 3
          - >-
            hermes_automation_rigel_discord_channel.json.id | string
            == hermes_rigel_discord_channel_id | string
          - >-
            hermes_automation_rigel_discord_channel.json.guild_id | string
            == hermes_rigel_discord_guild_id | string
        fail_msg: >-
          Rigel's new application is not distinct or cannot access the exact
          approved guild/channel. Astra's fallback remains unchanged.
      when: hermes_rigel_dedicated_discord_enabled | bool
      no_log: true

    - name: Resolve one private native peer credential
      ansible.builtin.set_fact:
        hermes_automation_peer_key: >-
          {{
            (
              hermes_automation_profile_environments.results[0].content
              | b64decode
              | regex_findall('(?m)^API_SERVER_KEY=([^\r\n]+)$')
              | first
              | default('', true)
            )
            or
            (
              hermes_automation_profile_environments.results[1].content
              | b64decode
              | regex_findall('(?m)^HERMES_PEER_ASTRA_KEY=([^\r\n]+)$')
              | first
              | default('', true)
            )
            or lookup(
              'ansible.builtin.password',
              '/dev/null',
              length=64,
              chars=['ascii_letters', 'digits']
            )
          }}
      no_log: true

    - name: Require exactly one retained credential for each Astra provider
      ansible.builtin.assert:
        that:
          - hermes_automation_provider_credentials | length == 1
          - hermes_automation_provider_credentials[0] | length > 0
        fail_msg: >-
          The retained OpenClaw environment does not contain exactly one usable
          value for every required Astra provider. No Hermes credential was
          changed.
      loop:
        - OLLAMA_API_KEY
        - EBAY_APP_ID
        - EBAY_CERT_ID
        - ICLOUD_APP_PASSWORD
        - NEXTCLOUD_CALDAV_APP_PASSWORD
      loop_control:
        label: "{{ item }}"
      vars:
        hermes_automation_provider_credentials: >-
          {{
            hermes_automation_source_environment.content
            | b64decode
            | regex_findall('(?m)^' ~ item ~ '=([^\r\n]+)$')
          }}
      no_log: true

    - name: Remove native profile backup staging directories
      ansible.builtin.file:
        path: "{{ item.home }}/backups/{{ hermes_automation_backup_id }}"
        state: absent
      loop: "{{ hermes_shadow_profiles }}"
      loop_control:
        label: "{{ item.name }}"
      check_mode: false

    - name: Converge Hermes automation transaction
      block:
        - name: Enroll Astra provider credentials and compatibility aliases
          ansible.builtin.lineinfile:
            path: /etc/hermes/astra/.env
            regexp: "^{{ item.target }}="
            line: >-
              {{ item.target }}={{
                (
                  hermes_automation_source_environment.content
                  | b64decode
                  | regex_findall(
                      '(?m)^' ~ item.source ~ '=([^\r\n]+)$'
                    )
                )[0]
              }}
            owner: root
            group: hermes-astra
            mode: "0440"
          loop:
            - target: OLLAMA_API_KEY
              source: OLLAMA_API_KEY
            - target: EBAY_APP_ID
              source: EBAY_APP_ID
            - target: EBAY_CERT_ID
              source: EBAY_CERT_ID
            - target: ICLOUD_APP_PASSWORD
              source: ICLOUD_APP_PASSWORD
            - target: NEXTCLOUD_CALDAV_APP_PASSWORD
              source: NEXTCLOUD_CALDAV_APP_PASSWORD
          loop_control:
            label: "{{ item.target }}"
          register: hermes_automation_astra_provider_environment
          no_log: true

        - name: Enroll subscription fallback credentials for every profile
          ansible.builtin.lineinfile:
            path: >-
              {{
                hermes_automation_rigel_environment_file
                if item.profile == 'rigel'
                else '/etc/hermes/' ~ item.profile ~ '/.env'
              }}
            regexp: "^{{ item.target }}="
            line: >-
              {{ item.target }}={{
                (
                  hermes_automation_source_environment.content
                  | b64decode
                  | regex_findall(
                      '(?m)^' ~ item.source ~ '=([^\r\n]+)$'
                    )
                )[0]
              }}
            owner: root
            group: >-
              {{ 'root' if item.profile == 'rigel' else 'hermes-' ~ item.profile }}
            mode: "{{ '0400' if item.profile == 'rigel' else '0440' }}"
          loop:
            - profile: astra
              target: OLLAMA_API_KEY
              source: OLLAMA_API_KEY
            - profile: dubble
              target: OLLAMA_API_KEY
              source: OLLAMA_API_KEY
            - profile: rigel
              target: OLLAMA_API_KEY
              source: OLLAMA_API_KEY
          loop_control:
            label: "{{ item.profile }}:{{ item.target }}"
          register: hermes_automation_fallback_provider_environments
          no_log: true

        - name: Enroll the complete dedicated Rigel Discord environment
          ansible.builtin.lineinfile:
            path: "{{ hermes_automation_rigel_environment_file }}"
            regexp: "^{{ item.key }}="
            line: "{{ item.key }}={{ item.value }}"
            owner: root
            group: root
            mode: "0400"
          loop:
            - key: DISCORD_BOT_TOKEN
              value: "{{ hermes_rigel_discord_bot_token }}"
            - key: DISCORD_ALLOWED_USERS
              value: "{{ hermes_automation_owner_user_id }}"
            - key: DISCORD_HOME_CHANNEL
              value: "{{ hermes_rigel_discord_channel_id }}"
            - key: DISCORD_HOME_CHANNEL_NAME
              value: Rigel
          loop_control:
            label: "{{ item.key }}"
          register: hermes_automation_rigel_discord_environment
          when: hermes_rigel_dedicated_discord_enabled | bool
          no_log: true

        - name: Record the three-consumer private Discord enrollment
          ansible.builtin.template:
            src: >-
              {{ playbook_dir
                 }}/../../templates/hermes/hermes-private-discord-enrollment.json.j2
            dest: "{{ hermes_production_cutover_enrollment }}"
            owner: root
            group: root
            mode: "0400"
            backup: true
          register: hermes_automation_rigel_private_enrollment
          when: hermes_rigel_dedicated_discord_enabled | bool
          no_log: true

        - name: Remove retired Anthropic provider credentials
          ansible.builtin.lineinfile:
            path: >-
              {{
                hermes_automation_rigel_environment_file
                if item == 'rigel'
                else '/etc/hermes/' ~ item ~ '/.env'
              }}
            regexp: ^ANTHROPIC_API_KEY=
            state: absent
            owner: root
            group: "{{ 'root' if item == 'rigel' else 'hermes-' ~ item }}"
            mode: "{{ '0400' if item == 'rigel' else '0440' }}"
          loop:
            - astra
            - dubble
            - rigel
          register: hermes_automation_retired_provider_environment
          no_log: true

        - name: Remove inactive metered API credentials from Hermes profiles
          ansible.builtin.lineinfile:
            path: >-
              {{
                hermes_automation_rigel_environment_file
                if item.0 == 'rigel'
                else '/etc/hermes/' ~ item.0 ~ '/.env'
              }}
            regexp: "^{{ item.1 }}="
            state: absent
            owner: root
            group: >-
              {{ 'root' if item.0 == 'rigel' else 'hermes-' ~ item.0 }}
            mode: "{{ '0400' if item.0 == 'rigel' else '0440' }}"
          loop: >-
            {{ ['astra', 'dubble', 'rigel']
               | product([
                   'OPENROUTER_API_KEY',
                   'OPENAI_API_KEY',
                   'GEMINI_API_KEY',
                   'GOOGLE_API_KEY'
                 ])
               | list }}
          loop_control:
            label: "{{ item.0 }}:{{ item.1 }}"
          register: hermes_automation_inactive_metered_environment
          no_log: true

        - name: Enroll Astra native API server credential
          ansible.builtin.lineinfile:
            path: /etc/hermes/astra/.env
            regexp: ^API_SERVER_KEY=
            line: "API_SERVER_KEY={{ hermes_automation_peer_key }}"
            owner: root
            group: hermes-astra
            mode: "0440"
          register: hermes_automation_astra_peer_environment
          no_log: true

        - name: Enroll Dubble fixed Astra peer credential
          ansible.builtin.lineinfile:
            path: /etc/hermes/dubble/.env
            regexp: ^HERMES_PEER_ASTRA_KEY=
            line: >-
              HERMES_PEER_ASTRA_KEY={{ hermes_automation_peer_key }}
            owner: root
            group: hermes-dubble
            mode: "0440"
          register: hermes_automation_dubble_peer_environment
          no_log: true

        - name: Create bounded automation readers group
          ansible.builtin.group:
            name: "{{ hermes_automation_readers_group }}"
            system: true
            state: present

        - name: Create root-private collector credential directory
          ansible.builtin.file:
            path: "{{ hermes_retained_collector_environment_live | dirname }}"
            state: directory
            owner: root
            group: root
            mode: "0700"

        - name: Deploy the least-privilege retained collector environment
          ansible.builtin.copy:
            content: |
              TAUTULLI_API_KEY={{ hermes_automation_tautulli_api_key }}
              SONARR_API_KEY={{ hermes_automation_sonarr_api_key }}
              RADARR_API_KEY={{ hermes_automation_radarr_api_key }}
              SEERR_API_KEY={{ hermes_automation_seerr_api_key }}
              FORTNITE_API_KEY={{ (hermes_automation_source_environment.content | b64decode | regex_findall('(?m)^FORTNITE_API_KEY=([^\r\n]+)$'))[0] }}
              API_FORTNITE_KEY={{ (hermes_automation_source_environment.content | b64decode | regex_findall('(?m)^API_FORTNITE_KEY=([^\r\n]+)$'))[0] }}
            dest: "{{ hermes_retained_collector_environment_live }}"
            owner: root
            group: root
            mode: "0400"
            backup: true
          no_log: true

        - name: Create bounded automation output directory
          ansible.builtin.file:
            path: "{{ hermes_automation_output_root }}"
            state: directory
            owner: hermes-astra
            group: "{{ hermes_automation_readers_group }}"
            mode: "2770"

        - name: Create Astra-owned Daily Summary section directory
          ansible.builtin.file:
            path: "{{ hermes_automation_output_root }}/daily-summary-sections"
            state: directory
            owner: hermes-astra
            group: "{{ hermes_automation_readers_group }}"
            mode: "2770"

        - name: Create Hermes-native automation workspace mountpoints
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            owner: hermes-astra
            group: "{{ hermes_automation_readers_group }}"
            mode: "2770"
          loop:
            - "{{ hermes_automation_native_workspace }}"
            - "{{ hermes_automation_native_workspace }}/memory"
            - "{{ hermes_automation_native_workspace }}/memory/daily-summary-sections"
            - "{{ hermes_automation_native_workspace }}/fortnite-progress"
            - "{{ hermes_automation_native_workspace }}/state"

        - name: Create Astra native FreshRSS state directory
          ansible.builtin.file:
            path: "{{ hermes_astra_freshrss_live_root }}"
            state: directory
            owner: hermes-astra
            group: hermes-astra
            mode: "0700"

        - name: Create Astra native calendar and mail config directories
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            owner: hermes-astra
            group: hermes-astra
            mode: "0700"
          loop:
            - /var/lib/hermes/astra/.config/vdirsyncer
            - /var/lib/hermes/astra/.config/khal
            - /var/lib/hermes/astra/.config/himalaya
            - "{{ hermes_astra_calendar_live_root | dirname }}"

        - name: Normalize imported Astra calendar cache ownership
          ansible.builtin.file:
            path: "{{ hermes_astra_calendar_live_root }}"
            state: directory
            owner: hermes-astra
            group: hermes-astra
            mode: u=rwX,go=
            recurse: true

        - name: Deploy Astra native calendar and mail configs
          ansible.builtin.template:
