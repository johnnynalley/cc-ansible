---
# yamllint disable rule:line-length
# Purpose: Stage reviewed Hermes-native profile skills without starting a Gateway.
# Hosts: hermes_hosts.
# Key vars: hermes_profile_skills_*.
# Scripts: scripts/agents/hermes-profile-skills-validate.py.
# Validation: ansible-playbook playbooks/agents/hermes-profile-skills.yml --syntax-check.

- name: Stage reviewed Hermes profile skills
  hosts: hermes_hosts
  become: true
  gather_facts: false

  vars:
    hermes_profile_skills_contract_path: >-
      {{ playbook_dir }}/../../{{ hermes_profile_skills_contract_source }}
    hermes_profile_skills_contract: >-
      {{ lookup('ansible.builtin.file', hermes_profile_skills_contract_path) | from_json }}
    hermes_profile_skills_gateway_units:
      - hermes-gateway-astra.service
      - hermes-gateway-dubble.service
      - hermes-gateway-rigel.service
    hermes_profile_skills_state_units:
      - hermes-gateway-astra.service
      - hermes-gateway-dubble.service
      - hermes-gateway-rigel.service
      - openclaw-isolated-codex.service
      - openclaw-isolated-gateway.service
    hermes_profile_skills_user_state_units:
      - openclaw-gateway.service
      - health-receiver.service

  tasks:
    - name: Validate Hermes profile-skills mode
      ansible.builtin.assert:
        that:
          - hermes_profile_skills_mode in ['disabled', 'stage']
        fail_msg: >-
          hermes_profile_skills_mode must be disabled or stage. This playbook
          has no Gateway activation, scheduler, messaging, or model mode.

    - name: Skip Hermes profile skills when disabled
      ansible.builtin.meta: end_host
      when: hermes_profile_skills_mode == 'disabled'

    - name: Require explicit reviewed Hermes profile-skills approval
      ansible.builtin.assert:
        that:
          - hermes_profile_skills_approved | bool
          - inventory_hostname == 'jn-t14s-lin'
          - hermes_profile_skills_contract.schemaVersion == 1
          - hermes_profile_skills_contract.mode == 'reviewed-native-seed'
          - hermes_profile_skills_contract.source.rootReviewed | bool
          - hermes_profile_skills_contract.source.declarativeMarkdownOnly | bool
          - not hermes_profile_skills_contract.source.rawLegacySkillsCopied
          - not hermes_profile_skills_contract.source.legacyExecutablesCopied
          - not hermes_profile_skills_contract.source.rawSessionsCopied
          - not hermes_profile_skills_contract.source.rawTranscriptsCopied
          - not hermes_profile_skills_contract.source.phraseTriggerTablesAllowed
          - hermes_profile_skills_contract.validation.nativeFrontmatterRequired | bool
          - hermes_profile_skills_contract.validation.nativeThreatScannerRequired | bool
          - hermes_profile_skills_contract.validation.cleanScannerVerdictRequired | bool
          - hermes_profile_skills_contract.validation.exactContentHashRequired | bool
          - not hermes_profile_skills_contract.validation.symlinkAllowed
          - not hermes_profile_skills_contract.validation.supportingFilesAllowed
          - not hermes_profile_skills_contract.validation.executableAllowed
          - not hermes_profile_skills_contract.validation.inlineCommandExpansionAllowed
          - not hermes_profile_skills_contract.validation.blueprintAllowed
          - not hermes_profile_skills_contract.validation.requiredEnvironmentAllowed
          - not hermes_profile_skills_contract.validation.requiredCredentialFilesAllowed
          - hermes_profile_skills_contract.execution.backupRequired | bool
          - hermes_profile_skills_contract.execution.transactionRollbackRequired | bool
          - hermes_profile_skills_contract.execution.managedRootExclusive | bool
          - not hermes_profile_skills_contract.execution.gatewayActivationAllowed
          - not hermes_profile_skills_contract.execution.schedulerActivationAllowed
          - not hermes_profile_skills_contract.execution.messagingActivationAllowed
          - not hermes_profile_skills_contract.execution.providerCredentialRequired
          - not hermes_profile_skills_contract.execution.modelInvocationAllowed
          - not hermes_profile_skills_contract.execution.automaticSkillApprovalAllowed
          - not hermes_profile_skills_contract.execution.legacySourceMutationAllowed
        fail_msg: >-
          The requested profile-skills transaction differs from the reviewed,
          declarative, native-scanned, backed-up, no-activation contract.

    - name: Build reviewed Hermes profile skill inventory
      ansible.builtin.set_fact:
        hermes_profile_skills_inventory: >-
          {{ (hermes_profile_skills_inventory | default([])) + [
            item.1 | combine({
              'profile': item.0.key,
              'user': item.0.value.user,
              'group': item.0.value.group,
              'home': item.0.value.home,
              'managedRoot': item.0.value.managedRoot
            })
          ] }}
      loop: >-
        {{ hermes_profile_skills_contract.profiles
           | dict2items
           | subelements('value.skills') }}

    - name: Require exact reviewed Hermes profile and skill inventory
      ansible.builtin.assert:
        that:
          - hermes_profile_skills_contract.profiles.keys() | list | sort == ['astra', 'dubble', 'rigel']
          - hermes_profile_skills_inventory | length == 7
          - hermes_profile_skills_inventory | map(attribute='profile') | list | unique | sort == ['astra', 'dubble', 'rigel']
          - hermes_profile_skills_inventory | map(attribute='name') | list | sort == ['consequential-recommendation', 'evidence-led-investigation', 'fortnite-tracker', 'guided-operation', 'public-support-triage', 'source-grounded-study', 'source-grounded-study']
          - hermes_profile_skills_inventory | map(attribute='source') | list | unique | length == 7
        fail_msg: >-
          The reviewed profile-skill inventory is incomplete, duplicated, or
          assigned to an unexpected profile.

    - name: Inspect service states before Hermes profile-skills staging
      ansible.builtin.command:
        argv:
          - /usr/bin/systemctl
          - show
          - --property=LoadState
          - --property=ActiveState
          - --property=UnitFileState
          - "{{ item }}"
      loop: "{{ hermes_profile_skills_state_units }}"
      register: hermes_profile_skills_services_before
      check_mode: false
      changed_when: false
      failed_when: false

    - name: Require every Hermes gateway stopped before profile-skills staging
      ansible.builtin.assert:
        that:
          - "'ActiveState=inactive' in item.stdout"
          - >-
            'UnitFileState=enabled' in item.stdout
            or 'UnitFileState=disabled' in item.stdout
        fail_msg: >-
          A Hermes Gateway is active or has an unexpected installation state.
          Profile skills may be staged only while all profiles are stopped.
      loop: "{{ hermes_profile_skills_services_before.results[0:3] }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Inspect production user-service states before profile-skills staging
      ansible.builtin.command:
        argv:
          - /usr/sbin/runuser
          - --user
          - johnny
          - --
          - /usr/bin/env
          - XDG_RUNTIME_DIR=/run/user/1000
          - DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1000/bus
          - /usr/bin/systemctl
          - --user
          - show
          - --property=LoadState
          - --property=ActiveState
          - --property=UnitFileState
          - "{{ item }}"
      loop: "{{ hermes_profile_skills_user_state_units }}"
      register: hermes_profile_skills_user_services_before
      check_mode: false
      changed_when: false

    - name: Require production user services to exist before skill staging
      ansible.builtin.assert:
        that:
          - "'LoadState=loaded' in item.stdout"
        fail_msg: >-
          The production OpenClaw or Health user service is missing. The skill
          transaction will not proceed without complete parity evidence.
      loop: "{{ hermes_profile_skills_user_services_before.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Report Hermes profile-skills check-mode boundary
      ansible.builtin.debug:
        msg: >-
          Check mode validated the contract, inventory, and stopped Gateways.
          It did not stage source, create a backup, or change managed skills.
      when: ansible_check_mode

    - name: Stop Hermes profile-skills staging before mutation in check mode
      ansible.builtin.meta: end_host
      when: ansible_check_mode

    - name: Read host timestamp for Hermes profile-skills transaction
      ansible.builtin.command:
        argv:
          - /usr/bin/date
          - -u
          - +%Y%m%dT%H%M%SZ
      register: hermes_profile_skills_timestamp
      changed_when: false

    - name: Set Hermes profile-skills transaction paths
      ansible.builtin.set_fact:
        hermes_profile_skills_stage_root: >-
          /run/hermes-profile-skills-{{ hermes_profile_skills_timestamp.stdout }}
        hermes_profile_skills_backup_dir: >-
          {{ hermes_profile_skills_rollback_root }}/{{ hermes_profile_skills_timestamp.stdout }}-pre-profile-skills

    - name: Create Hermes profile-skills staging directory
      ansible.builtin.file:
        path: "{{ hermes_profile_skills_stage_root }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
      changed_when: false

    - name: Deploy Hermes native profile-skills validator
      ansible.builtin.copy:
        src: "{{ ansible_config_file | dirname }}/{{ hermes_profile_skills_validator_source }}"
        dest: "{{ hermes_profile_skills_validator_live }}"
        owner: root
        group: root
        mode: "0755"

    - name: Stage and validate reviewed Hermes profile skills
      block:
        - name: Create staged Hermes profile skill directories
          ansible.builtin.file:
            path: "{{ hermes_profile_skills_stage_root }}/{{ item.source | dirname }}"
            state: directory
            owner: root
            group: root
            mode: "0700"
          loop: "{{ hermes_profile_skills_inventory }}"
          changed_when: false

        - name: Stage exact reviewed Hermes profile skill sources
          ansible.builtin.copy:
            src: "{{ ansible_config_file | dirname }}/{{ item.source }}"
            dest: "{{ hermes_profile_skills_stage_root }}/{{ item.source }}"
            owner: root
            group: root
            mode: "0400"
          loop: "{{ hermes_profile_skills_inventory }}"
          changed_when: false

        - name: Stage reviewed Hermes profile-skills contract
          ansible.builtin.copy:
            src: "{{ hermes_profile_skills_contract_path }}"
            dest: "{{ hermes_profile_skills_stage_root }}/contract.json"
            owner: root
            group: root
            mode: "0400"
          changed_when: false

        - name: Validate reviewed source skills with Hermes native parsers
          ansible.builtin.command:
            argv:
              - /usr/local/lib/hermes-agent/venv/bin/python
              - "{{ hermes_profile_skills_validator_live }}"
              - --contract
              - "{{ hermes_profile_skills_stage_root }}/contract.json"
              - --mode
              - source
              - --root
              - "{{ hermes_profile_skills_stage_root }}"
              - --hermes-source
              - /usr/local/lib/hermes-agent
          register: hermes_profile_skills_source_validation
          changed_when: false

        - name: Read effective Hermes Gateway units for native skill bindings
          ansible.builtin.command:
            argv:
              - /usr/bin/systemctl
              - cat
              - "hermes-gateway-{{ item.key }}.service"
          loop: "{{ hermes_profile_skills_contract.profiles | dict2items }}"
          register: hermes_profile_skills_gateway_unit_sources
          changed_when: false

        - name: Require native read-only skill bindings and startup validation
          ansible.builtin.assert:
            that:
              - >-
                ('BindReadOnlyPaths=' ~ item.item.value.managedRoot ~ ':' ~ item.item.value.runtimeRoot)
                in item.stdout
              - >-
                ('--mode runtime --profile ' ~ item.item.key)
                in item.stdout
              - hermes_profile_skills_validator_live in item.stdout
              - hermes_profile_skills_contract_live in item.stdout
            fail_msg: >-
              The deployed Hermes Gateway unit does not mount the reviewed
              root-owned skill source into the native profile skill tree and
              validate it before startup.
          loop: "{{ hermes_profile_skills_gateway_unit_sources.results }}"
          loop_control:
            label: "{{ item.item.key }}"

        - name: Inspect current installed Hermes profile-skills contract
          ansible.builtin.stat:
            path: "{{ hermes_profile_skills_contract_live }}"
            follow: false
            get_checksum: true
            checksum_algorithm: sha256
          register: hermes_profile_skills_current_contract

        - name: Hash staged Hermes profile-skills contract
          ansible.builtin.stat:
            path: "{{ hermes_profile_skills_stage_root }}/contract.json"
            follow: false
            get_checksum: true
            checksum_algorithm: sha256
          register: hermes_profile_skills_staged_contract

        - name: Validate current installed skills against the staged contract
          ansible.builtin.command:
            argv:
              - /usr/local/lib/hermes-agent/venv/bin/python
              - "{{ hermes_profile_skills_validator_live }}"
              - --contract
              - "{{ hermes_profile_skills_stage_root }}/contract.json"
              - --mode
              - installed
              - --hermes-source
              - /usr/local/lib/hermes-agent
          register: hermes_profile_skills_current_validation
          changed_when: false
          failed_when: false

        - name: Determine whether reviewed Hermes profile skills are current
          ansible.builtin.set_fact:
            hermes_profile_skills_current: >-
              {{
                hermes_profile_skills_current_contract.stat.exists
                and hermes_profile_skills_current_contract.stat.isreg
                and not hermes_profile_skills_current_contract.stat.islnk
                and hermes_profile_skills_current_contract.stat.checksum
                    == hermes_profile_skills_staged_contract.stat.checksum
                and hermes_profile_skills_current_validation.rc == 0
              }}

        - name: Validate current skills through native read-only service bindings
          ansible.builtin.command:
            argv:
              - /usr/bin/systemd-run
              - --quiet
              - --wait
              - --pipe
              - --collect
              - "--unit=hermes-profile-skills-{{ item.key }}-{{ hermes_profile_skills_timestamp.stdout | lower }}"
              - "--property=Type=exec"
              - "--property=User={{ item.value.user }}"
              - "--property=Group={{ item.value.group }}"
              - "--property=WorkingDirectory={{ item.value.home }}"
              - "--property=NoNewPrivileges=yes"
              - "--property=ProtectSystem=strict"
              - "--property=ProtectHome=yes"
              - "--property=ReadWritePaths={{ item.value.home }}"
              - "--property=BindReadOnlyPaths={{ item.value.managedRoot }}:{{ item.value.runtimeRoot }}"
              - "--setenv=HOME={{ item.value.home }}"
              - "--setenv=HERMES_HOME={{ item.value.home }}"
              - "--setenv=HERMES_MANAGED_DIR=/etc/hermes/{{ item.key }}"
              - /usr/local/lib/hermes-agent/venv/bin/python
              - "{{ hermes_profile_skills_validator_live }}"
              - --contract
              - "{{ hermes_profile_skills_contract_live }}"
              - --mode
              - runtime
              - --profile
              - "{{ item.key }}"
              - --hermes-source
              - /usr/local/lib/hermes-agent
          loop: "{{ hermes_profile_skills_contract.profiles | dict2items }}"
          loop_control:
            label: "{{ item.key }}"
          changed_when: false
          when: hermes_profile_skills_current | bool

        - name: Remove staging for current Hermes profile skills
          ansible.builtin.file:
            path: "{{ hermes_profile_skills_stage_root }}"
            state: absent
          when: hermes_profile_skills_current | bool
          changed_when: false

        - name: Stop current Hermes profile-skills transaction before mutation
          ansible.builtin.meta: end_host
          when: hermes_profile_skills_current | bool

        - name: Inspect existing managed Hermes profile skill roots
          ansible.builtin.stat:
            path: "{{ item.value.managedRoot }}"
            follow: false
          loop: "{{ hermes_profile_skills_contract.profiles | dict2items }}"
          register: hermes_profile_skills_roots_before

        - name: Reject unsafe existing managed Hermes skill roots
          ansible.builtin.assert:
            that:
              - not item.stat.exists or (item.stat.isdir and not item.stat.islnk)
            fail_msg: >-
              A managed Hermes profile-skill root is not absent or a regular,
              non-symlink directory.
          loop: "{{ hermes_profile_skills_roots_before.results }}"
          loop_control:
            label: "{{ item.item.key }}"

        - name: Inspect existing managed Hermes profile-skills contract
          ansible.builtin.stat:
            path: "{{ hermes_profile_skills_contract_live }}"
            follow: false
          register: hermes_profile_skills_contract_before

        - name: Reject unsafe existing managed Hermes profile-skills contract
          ansible.builtin.assert:
            that:
              - not hermes_profile_skills_contract_before.stat.exists or (hermes_profile_skills_contract_before.stat.isreg and not hermes_profile_skills_contract_before.stat.islnk)
            fail_msg: >-
              The deployed Hermes profile-skills contract is not absent or a
              regular, non-symlink file.

        - name: Create Hermes profile-skills rollback directory
          ansible.builtin.file:
            path: "{{ hermes_profile_skills_backup_dir }}"
            state: directory
            owner: root
            group: root
            mode: "0700"

        - name: Build existing managed Hermes skill backup inventory
          ansible.builtin.set_fact:
            hermes_profile_skills_existing_backup_paths: >-
              {{
                (
                  hermes_profile_skills_roots_before.results
                  | selectattr('stat.exists')
                  | map(attribute='item.key')
                  | map('regex_replace', '$', '/skills')
                  | list
                )
                + (
                  ['profile-skills-contract.json']
                  if hermes_profile_skills_contract_before.stat.exists
                  else []
                )
              }}

        - name: Record existing managed Hermes skill paths for backup
          ansible.builtin.copy:
            dest: "{{ hermes_profile_skills_stage_root }}/backup-paths.txt"
            owner: root
            group: root
            mode: "0600"
            content: |
              {% for path in hermes_profile_skills_existing_backup_paths %}
              {{ path }}
              {% endfor %}
          when: hermes_profile_skills_existing_backup_paths | length > 0

        - name: Back up current managed Hermes profile skills
          ansible.builtin.command:
            argv:
              - /usr/bin/tar
              - --create
              - --file
              - "{{ hermes_profile_skills_backup_dir }}/managed-profile-skills.tar"
              - --directory
              - /etc/hermes
              - --files-from
              - >-
                {{
                  hermes_profile_skills_stage_root ~ '/backup-paths.txt'
                  if hermes_profile_skills_existing_backup_paths | length > 0
                  else '/dev/null'
                }}
          changed_when: true

        - name: Restrict Hermes profile-skills rollback archive
          ansible.builtin.file:
            path: "{{ hermes_profile_skills_backup_dir }}/managed-profile-skills.tar"
            owner: root
            group: root
            mode: "0600"

        - name: Hash Hermes profile-skills rollback archive
          ansible.builtin.command:
            argv:
              - /usr/bin/sha256sum
              - "{{ hermes_profile_skills_backup_dir }}/managed-profile-skills.tar"
          register: hermes_profile_skills_backup_hash
          changed_when: false

        - name: Record Hermes profile-skills rollback manifest
          ansible.builtin.copy:
            dest: "{{ hermes_profile_skills_backup_dir }}/manifest.json"
            owner: root
            group: root
            mode: "0600"
            content: >-
              {{ {
                'schemaVersion': 1,
                'createdAt': hermes_profile_skills_timestamp.stdout,
                'host': inventory_hostname,
                'artifact': 'managed-profile-skills.tar',
                'artifactSha256': hermes_profile_skills_backup_hash.stdout.split()[0],
                'profiles': ['astra', 'dubble', 'rigel'],
                'skillCount': hermes_profile_skills_inventory | length,
                'existingRoots': hermes_profile_skills_roots_before.results | selectattr('stat.exists') | map(attribute='item.key') | list,
                'existingContract': hermes_profile_skills_contract_before.stat.exists
              } | to_nice_json }}

        - name: Apply and verify reviewed Hermes profile-skills transaction
          block:
            - name: Remove prior exclusive managed Hermes skill roots
              ansible.builtin.file:
                path: "{{ item.value.managedRoot }}"
                state: absent
              loop: "{{ hermes_profile_skills_contract.profiles | dict2items }}"
              loop_control:
                label: "{{ item.key }}"

            - name: Create exclusive managed Hermes skill roots
              ansible.builtin.file:
                path: "{{ item.value.managedRoot }}"
                state: directory
                owner: root
                group: "{{ item.value.group }}"
                mode: "0750"
              loop: "{{ hermes_profile_skills_contract.profiles | dict2items }}"
              loop_control:
                label: "{{ item.key }}"

            - name: Create managed Hermes profile skill directories
              ansible.builtin.file:
                path: "{{ item.managedRoot }}/{{ item.name }}"
                state: directory
                owner: root
                group: "{{ item.group }}"
                mode: "0750"
              loop: "{{ hermes_profile_skills_inventory }}"
              loop_control:
                label: "{{ item.profile }}/{{ item.name }}"

            - name: Install reviewed Hermes profile skills atomically
              ansible.builtin.copy:
                src: "{{ hermes_profile_skills_stage_root }}/{{ item.source }}"
                dest: "{{ item.managedRoot }}/{{ item.name }}/SKILL.md"
                remote_src: true
                owner: root
                group: "{{ item.group }}"
                mode: "0440"
              loop: "{{ hermes_profile_skills_inventory }}"
              loop_control:
                label: "{{ item.profile }}/{{ item.name }}"

            - name: Install reviewed Hermes profile-skills contract
              ansible.builtin.copy:
                src: "{{ hermes_profile_skills_stage_root }}/contract.json"
                dest: "{{ hermes_profile_skills_contract_live }}"
                remote_src: true
                owner: root
                group: root
                mode: "0444"

            - name: Validate installed Hermes profile skills as root
              ansible.builtin.command:
                argv:
                  - /usr/local/lib/hermes-agent/venv/bin/python
                  - "{{ hermes_profile_skills_validator_live }}"
                  - --contract
                  - "{{ hermes_profile_skills_contract_live }}"
                  - --mode
                  - installed
                  - --hermes-source
                  - /usr/local/lib/hermes-agent
              changed_when: false

            - name: Validate each managed skill root as its Hermes service identity
              ansible.builtin.command:
                argv:
                  - /usr/sbin/runuser
                  - --user
                  - "{{ item.value.user }}"
                  - --
                  - /usr/local/lib/hermes-agent/venv/bin/python
                  - "{{ hermes_profile_skills_validator_live }}"
                  - --contract
                  - "{{ hermes_profile_skills_contract_live }}"
                  - --mode
                  - installed
                  - --profile
                  - "{{ item.key }}"
                  - --hermes-source
                  - /usr/local/lib/hermes-agent
              loop: "{{ hermes_profile_skills_contract.profiles | dict2items }}"
              loop_control:
                label: "{{ item.key }}"
              changed_when: false

            - name: Validate installed skills through native read-only service bindings
              ansible.builtin.command:
                argv:
                  - /usr/bin/systemd-run
                  - --quiet
                  - --wait
                  - --pipe
                  - --collect
                  - "--unit=hermes-profile-skills-{{ item.key }}-{{ hermes_profile_skills_timestamp.stdout | lower }}"
                  - "--property=Type=exec"
                  - "--property=User={{ item.value.user }}"
                  - "--property=Group={{ item.value.group }}"
                  - "--property=WorkingDirectory={{ item.value.home }}"
                  - "--property=NoNewPrivileges=yes"
                  - "--property=ProtectSystem=strict"
                  - "--property=ProtectHome=yes"
                  - "--property=ReadWritePaths={{ item.value.home }}"
                  - "--property=BindReadOnlyPaths={{ item.value.managedRoot }}:{{ item.value.runtimeRoot }}"
                  - "--setenv=HOME={{ item.value.home }}"
                  - "--setenv=HERMES_HOME={{ item.value.home }}"
                  - "--setenv=HERMES_MANAGED_DIR=/etc/hermes/{{ item.key }}"
                  - /usr/local/lib/hermes-agent/venv/bin/python
                  - "{{ hermes_profile_skills_validator_live }}"
                  - --contract
                  - "{{ hermes_profile_skills_contract_live }}"
                  - --mode
                  - runtime
                  - --profile
                  - "{{ item.key }}"
                  - --hermes-source
                  - /usr/local/lib/hermes-agent
              loop: "{{ hermes_profile_skills_contract.profiles | dict2items }}"
              loop_control:
                label: "{{ item.key }}"
              changed_when: false

            - name: Inspect service states after Hermes profile-skills staging
              ansible.builtin.command:
                argv:
                  - /usr/bin/systemctl
                  - show
                  - --property=LoadState
                  - --property=ActiveState
                  - --property=UnitFileState
                  - "{{ item }}"
              loop: "{{ hermes_profile_skills_state_units }}"
              register: hermes_profile_skills_services_after
              check_mode: false
              changed_when: false
              failed_when: false

            - name: Require unchanged services after Hermes profile-skills staging
              ansible.builtin.assert:
                that:
                  - hermes_profile_skills_services_before.results | map(attribute='stdout') | list == hermes_profile_skills_services_after.results | map(attribute='stdout') | list
                fail_msg: >-
                  A Hermes, OpenClaw, or Health service state changed during
                  the profile-skills transaction.

            - name: Inspect production user-service states after skill staging
              ansible.builtin.command:
                argv:
                  - /usr/sbin/runuser
                  - --user
                  - johnny
                  - --
                  - /usr/bin/env
                  - XDG_RUNTIME_DIR=/run/user/1000
                  - DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1000/bus
                  - /usr/bin/systemctl
                  - --user
                  - show
                  - --property=LoadState
                  - --property=ActiveState
                  - --property=UnitFileState
                  - "{{ item }}"
              loop: "{{ hermes_profile_skills_user_state_units }}"
              register: hermes_profile_skills_user_services_after
              check_mode: false
              changed_when: false

            - name: Require unchanged production user services after skill staging
              ansible.builtin.assert:
                that:
                  - hermes_profile_skills_user_services_before.results | map(attribute='stdout') | list == hermes_profile_skills_user_services_after.results | map(attribute='stdout') | list
                fail_msg: >-
                  The production OpenClaw or Health user service changed during
                  the profile-skills transaction.
          rescue:
            - name: Remove failed managed Hermes profile skill roots
              ansible.builtin.file:
                path: "{{ item.value.managedRoot }}"
                state: absent
              loop: "{{ hermes_profile_skills_contract.profiles | dict2items }}"
              loop_control:
                label: "{{ item.key }}"

            - name: Remove failed managed Hermes profile-skills contract
              ansible.builtin.file:
                path: "{{ hermes_profile_skills_contract_live }}"
                state: absent

            - name: Restore managed Hermes profile skills after staging failure
              ansible.builtin.command:
                argv:
                  - /usr/bin/tar
                  - --extract
                  - --file
                  - "{{ hermes_profile_skills_backup_dir }}/managed-profile-skills.tar"
                  - --directory
                  - /etc/hermes
              changed_when: true

            - name: Stop after restoring failed Hermes profile-skills transaction
              ansible.builtin.fail:
                msg: >-
                  Reviewed profile-skills staging failed. All managed skill
                  roots and the prior contract were restored from rollback.
      always:
        - name: Remove Hermes profile-skills staging
          ansible.builtin.file:
            path: "{{ hermes_profile_skills_stage_root }}"
            state: absent
          changed_when: false
