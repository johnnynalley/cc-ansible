---
# yamllint disable rule:line-length
# Purpose: Normalize reviewed legacy state into isolated inactive Hermes profiles.
# Hosts: hermes_hosts.
# Key vars: hermes_profile_transforms_*.
# Scripts: scripts/agents/hermes-profile-transform.py.
# Validation: ansible-playbook playbooks/agents/hermes-profile-transforms.yml --syntax-check.

- name: Stage reviewed Hermes profile transforms
  hosts: hermes_hosts
  become: true
  gather_facts: false

  vars:
    hermes_profile_transforms_contract_path: >-
      {{ playbook_dir }}/../../{{ hermes_profile_transforms_contract_source }}
    hermes_profile_transforms_contract: >-
      {{ lookup('ansible.builtin.file', hermes_profile_transforms_contract_path) | from_json }}
    hermes_profile_transforms_repository_root: /usr/local/share/hermes-shadow/repository
    hermes_profile_transforms_system_units:
      - hermes-gateway-astra.service
      - hermes-gateway-dubble.service
      - hermes-gateway-rigel.service
      - openclaw-isolated-codex.service
      - openclaw-isolated-gateway.service
    hermes_profile_transforms_user_units:
      - openclaw-gateway.service
      - health-receiver.service

  tasks:
    - name: Validate Hermes profile-transform mode
      ansible.builtin.assert:
        that:
          - hermes_profile_transforms_mode in ['disabled', 'stage']
        fail_msg: >-
          hermes_profile_transforms_mode must be disabled or stage. This
          playbook cannot activate a Gateway, model, scheduler, or route.

    - name: Skip Hermes profile transforms when disabled
      ansible.builtin.meta: end_host
      when: hermes_profile_transforms_mode == 'disabled'

    - name: Require explicit reviewed Hermes profile-transform approval
      ansible.builtin.assert:
        that:
          - hermes_profile_transforms_approved | bool
          - inventory_hostname == 'jn-t14s-lin'
          - hermes_profile_transforms_contract.schemaVersion == 1
          - hermes_profile_transforms_contract.mode == 'inactive-reviewed-profile-transforms'
          - hermes_profile_transforms_contract.transforms | length == 5
          - hermes_profile_transforms_contract.safety.values() | select('equalto', false) | list | length == hermes_profile_transforms_contract.safety | length
          - hermes_profile_transforms_contract.execution.values() | select('equalto', true) | list | length == hermes_profile_transforms_contract.execution | length
        fail_msg: >-
          The requested transform transaction differs from the reviewed
          no-source-mount, no-raw-content, no-credential, no-activation contract.

    - name: Inspect reviewed Hermes profile-transform dependencies
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
        get_checksum: true
        checksum_algorithm: sha256
      loop:
        - "{{ hermes_profile_transformer_live }}"
        - "{{ hermes_profile_transforms_contract_live }}"
        - "{{ hermes_profile_transforms_repository_root }}/files/hermes/profile-import-contract.json"
        - "{{ hermes_profile_transforms_repository_root }}/files/openclaw/workspace-migration-policy.json"
        - "{{ hermes_profile_transforms_contract.sourceRoot }}"
      register: hermes_profile_transforms_dependencies

    - name: Require safe Hermes profile-transform dependencies
      ansible.builtin.assert:
        that:
          - hermes_profile_transforms_dependencies.results[0].stat.isreg
          - not hermes_profile_transforms_dependencies.results[0].stat.islnk
          - hermes_profile_transforms_dependencies.results[1].stat.isreg
          - not hermes_profile_transforms_dependencies.results[1].stat.islnk
          - hermes_profile_transforms_dependencies.results[2].stat.checksum == hermes_profile_transforms_contract.sourcePins.profileImport.sha256
          - hermes_profile_transforms_dependencies.results[3].stat.checksum == hermes_profile_transforms_contract.sourcePins.workspacePolicy.sha256
          - hermes_profile_transforms_dependencies.results[4].stat.isdir
          - not hermes_profile_transforms_dependencies.results[4].stat.islnk
        fail_msg: >-
          A transform executable, pinned contract, or protected source root is
          missing, unsafe, or drifted.

    - name: Inspect system service states before Hermes profile transforms
      ansible.builtin.command:
        argv:
          - /usr/bin/systemctl
          - show
          - --property=LoadState
          - --property=ActiveState
          - --property=UnitFileState
          - "{{ item }}"
      loop: "{{ hermes_profile_transforms_system_units }}"
      register: hermes_profile_transforms_system_before
      check_mode: false
      changed_when: false
      failed_when: false

    - name: Require all Hermes gateways stopped before transforms
      ansible.builtin.assert:
        that:
          - "'LoadState=loaded' in item.stdout"
          - "'ActiveState=inactive' in item.stdout"
          - >-
            'UnitFileState=enabled' in item.stdout
            or 'UnitFileState=disabled' in item.stdout
        fail_msg: >-
          A Hermes Gateway is active, missing, or in an unexpected enablement
          state. Transforms run only while every Hermes profile is stopped.
      loop: "{{ hermes_profile_transforms_system_before.results[0:3] }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Inspect production user-service states before profile transforms
      ansible.builtin.command:
        argv:
          - /usr/sbin/runuser
          - --user
          - johnny
          - --
          - /usr/bin/env
          - XDG_RUNTIME_DIR=/run/user/1000
          - DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1000/bus
          - /usr/bin/systemctl
          - --user
          - show
          - --property=LoadState
          - --property=ActiveState
          - --property=UnitFileState
          - "{{ item }}"
      loop: "{{ hermes_profile_transforms_user_units }}"
      register: hermes_profile_transforms_user_before
      check_mode: false
      changed_when: false

    - name: Require production OpenClaw and Health services to exist
      ansible.builtin.assert:
        that:
          - "'LoadState=loaded' in item.stdout"
        fail_msg: >-
          Production OpenClaw or Health is missing. The inactive transform will
          not proceed without before and after parity evidence.
      loop: "{{ hermes_profile_transforms_user_before.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Read effective Hermes Gateway units for profile-transform bindings
      ansible.builtin.command:
        argv:
          - /usr/bin/systemctl
          - cat
          - --no-pager
          - "hermes-gateway-{{ item.key }}.service"
      loop: "{{ hermes_profile_transforms_contract.profiles | dict2items }}"
      register: hermes_profile_transforms_gateway_sources
      check_mode: false
      changed_when: false

    - name: Require reviewed transform bindings and startup gates
      ansible.builtin.assert:
        that:
          - >-
            ('BindPaths=' ~ item.item.value.writableRoot ~ ':' ~ item.item.value.writableRuntimeRoot)
            in item.stdout
          - >-
            ('BindReadOnlyPaths=' ~ item.item.value.managedRoot ~ ':' ~ item.item.value.managedRuntimeRoot)
            in item.stdout
          - >-
            (('--mode runtime --profile ' ~ item.item.key) in item.stdout
             and hermes_profile_transformer_live in item.stdout
             and hermes_profile_transforms_manifest_live in item.stdout)
            or 'Environment=HERMES_PROJECTION_PREFLIGHTS_PENDING=1' in item.stdout
        fail_msg: >-
          A Hermes Gateway unit lacks its isolated transformed-data bindings,
          or either its full transform startup gates or the explicit
          stopped-native-bootstrap marker.
      loop: "{{ hermes_profile_transforms_gateway_sources.results }}"
      loop_control:
        label: "{{ item.item.key }}"

    - name: Plan reviewed Hermes profile transforms without exposing source values
      ansible.builtin.command:
        argv:
          - "{{ hermes_profile_transformer_live }}"
          - --contract
          - "{{ hermes_profile_transforms_contract_live }}"
          - --repository-root
          - "{{ hermes_profile_transforms_repository_root }}"
          - --source-root
          - "{{ hermes_profile_transforms_contract.sourceRoot }}"
          - --mode
          - plan
      register: hermes_profile_transforms_plan_command
      check_mode: false
      changed_when: false

    - name: Parse reviewed Hermes profile-transform plan
      ansible.builtin.set_fact:
        hermes_profile_transforms_plan: >-
          {{ hermes_profile_transforms_plan_command.stdout | from_json }}

    - name: Require bounded reviewed Hermes profile-transform plan
      ansible.builtin.assert:
        that:
          - hermes_profile_transforms_plan.status == 'ok'
          - hermes_profile_transforms_plan.mode == 'plan'
          - hermes_profile_transforms_plan.summary.inputs == 5
          - hermes_profile_transforms_plan.summary.outputs == 5
          - hermes_profile_transforms_plan.summary.inputBytes <= hermes_profile_transforms_contract.limits.maxInputBytes
          - hermes_profile_transforms_plan.summary.outputBytes <= hermes_profile_transforms_contract.limits.maxOutputBytes
          - hermes_profile_transforms_plan.summary.profiles.astra.writableOutputs == 4
          - hermes_profile_transforms_plan.summary.profiles.dubble.writableOutputs == 1
          - hermes_profile_transforms_plan.summary.profiles.rigel.outputs == 0
        fail_msg: >-
          The canonical transform plan is missing an input/output, exceeds its
          limits, or assigns state to the wrong profile or ownership class.

    - name: Report Hermes profile-transform check-mode boundary
      ansible.builtin.debug:
        msg: >-
          Check mode validated stopped services, exact unit bindings, and the
          value-redacted transform plan. It changed no source or target state.
      when: ansible_check_mode

    - name: Stop Hermes profile transforms before mutation in check mode
      ansible.builtin.meta: end_host
      when: ansible_check_mode

    - name: Read host timestamp for Hermes profile-transform transaction
      ansible.builtin.command:
        argv:
          - /usr/bin/date
          - -u
          - +%Y%m%dT%H%M%S%NZ
      register: hermes_profile_transforms_timestamp
      changed_when: false

    - name: Set Hermes profile-transform transaction paths
      ansible.builtin.set_fact:
        hermes_profile_transforms_stage_root: >-
          /var/lib/hermes/.profile-transforms-stage-{{ hermes_profile_transforms_timestamp.stdout }}
        hermes_profile_transforms_stage_generation: >-
          /var/lib/hermes/.profile-transforms-stage-{{ hermes_profile_transforms_timestamp.stdout }}/generation
        hermes_profile_transforms_stage_manifest: >-
          /var/lib/hermes/.profile-transforms-stage-{{ hermes_profile_transforms_timestamp.stdout }}/manifest.json
        hermes_profile_transforms_backup_dir: >-
          {{ hermes_profile_transforms_rollback_root }}/{{ hermes_profile_transforms_timestamp.stdout }}-pre-profile-transforms

    - name: Inspect active Hermes profile-transform targets before staging
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - "{{ hermes_profile_transforms_root }}"
        - "{{ hermes_profile_transforms_manifest_live }}"
      register: hermes_profile_transforms_targets_before

    - name: Reject unsafe active Hermes profile-transform targets
      ansible.builtin.assert:
        that:
          - hermes_profile_transforms_targets_before.results[0].stat.exists == hermes_profile_transforms_targets_before.results[1].stat.exists
          - >-
            not hermes_profile_transforms_targets_before.results[0].stat.exists
            or (hermes_profile_transforms_targets_before.results[0].stat.isdir
                and not hermes_profile_transforms_targets_before.results[0].stat.islnk)
          - >-
            not hermes_profile_transforms_targets_before.results[1].stat.exists
            or (hermes_profile_transforms_targets_before.results[1].stat.isreg
                and not hermes_profile_transforms_targets_before.results[1].stat.islnk)
        fail_msg: >-
          The active transform root and manifest are incomplete, mismatched, or
          not the expected non-symlink object types.

    - name: Verify existing Hermes profile-transform generation before convergence
      ansible.builtin.command:
        argv:
          - "{{ hermes_profile_transformer_live }}"
          - --contract
          - "{{ hermes_profile_transforms_contract_live }}"
          - --repository-root
          - "{{ hermes_profile_transforms_repository_root }}"
          - --target-root
          - "{{ hermes_profile_transforms_root }}"
          - --manifest
          - "{{ hermes_profile_transforms_manifest_live }}"
          - --mode
          - verify
          - --allow-writable-drift
      register: hermes_profile_transforms_existing_verify
      check_mode: false
      changed_when: false
      failed_when: false
      when: hermes_profile_transforms_targets_before.results[0].stat.exists

    - name: Parse existing Hermes profile-transform verification result
      ansible.builtin.set_fact:
        hermes_profile_transforms_existing_verify_result: >-
          {{ hermes_profile_transforms_existing_verify.stdout | from_json }}
      when: hermes_profile_transforms_targets_before.results[0].stat.exists

    - name: Classify existing Hermes profile-transform generation
      ansible.builtin.assert:
        that:
          - >-
            hermes_profile_transforms_existing_verify.rc == 0
            or (hermes_profile_transforms_existing_verify_result.status == 'error'
                and hermes_profile_transforms_existing_verify_result.error
                    == 'manifest-contract-invalid')
        fail_msg: >-
          Existing Hermes profile transforms failed verification for a reason
          other than an expected managed-contract migration. Refusing
          convergence.
      when: hermes_profile_transforms_targets_before.results[0].stat.exists

    - name: Record existing Hermes profile-transform generation status
      ansible.builtin.set_fact:
        hermes_profile_transforms_existing_generation_status: >-
          {% if not hermes_profile_transforms_targets_before.results[0].stat.exists %}
          absent
          {% elif hermes_profile_transforms_existing_verify.rc == 0 %}
          verified
          {% else %}
          stale-contract
          {% endif %}

    - name: Build and verify complete Hermes profile-transform generation
      block:
        - name: Create root-private Hermes profile-transform staging root
          ansible.builtin.file:
            path: "{{ hermes_profile_transforms_stage_root }}"
            state: directory
            owner: root
            group: root
            mode: "0700"

        - name: Create empty Hermes profile-transform generation root
          ansible.builtin.file:
            path: "{{ hermes_profile_transforms_stage_generation }}"
            state: directory
            owner: root
            group: root
            mode: "0700"

        - name: Stage and verify complete Hermes profile-transform generation
          ansible.builtin.command:
            argv:
              - "{{ hermes_profile_transformer_live }}"
              - --contract
              - "{{ hermes_profile_transforms_contract_live }}"
              - --repository-root
              - "{{ hermes_profile_transforms_repository_root }}"
              - --source-root
              - "{{ hermes_profile_transforms_contract.sourceRoot }}"
              - --target-root
              - "{{ hermes_profile_transforms_stage_generation }}"
              - --manifest
              - "{{ hermes_profile_transforms_stage_manifest }}"
              - --mode
              - stage
          register: hermes_profile_transforms_stage_command
          changed_when: true

        - name: Parse staged Hermes profile-transform result
          ansible.builtin.set_fact:
            hermes_profile_transforms_stage_result: >-
              {{ hermes_profile_transforms_stage_command.stdout | from_json }}

        - name: Require staged Hermes profile-transform parity with the plan
          ansible.builtin.assert:
            that:
              - hermes_profile_transforms_stage_result.status == 'ok'
              - hermes_profile_transforms_stage_result.mode == 'stage'
              - hermes_profile_transforms_stage_result.summary.outputs == hermes_profile_transforms_plan.summary.outputs
              - hermes_profile_transforms_stage_result.summary.outputBytes == hermes_profile_transforms_plan.summary.outputBytes
            fail_msg: >-
              The canonical generation does not match the accepted redacted plan.
      rescue:
        - name: Remove incomplete Hermes profile-transform staging root
          ansible.builtin.file:
            path: "{{ hermes_profile_transforms_stage_root }}"
            state: absent

        - name: Stop after failed Hermes profile-transform generation staging
          ansible.builtin.fail:
            msg: >-
              Hermes profile transformation or generation verification failed.
              The incomplete staging tree was removed and active state was not changed.

    - name: Build and record Hermes profile-transform rollback artifact
      block:
        - name: Create Hermes profile-transform rollback directory
          ansible.builtin.file:
            path: "{{ hermes_profile_transforms_backup_dir }}"
            state: directory
            owner: root
            group: root
            mode: "0700"

        - name: Build Hermes profile-transform backup inventory
          ansible.builtin.set_fact:
            hermes_profile_transforms_existing_backup_paths: >-
              {{
                (['var/lib/hermes/profile-transforms']
                 if hermes_profile_transforms_targets_before.results[0].stat.exists else [])
                + (['etc/hermes/profile-transforms-manifest.json']
                   if hermes_profile_transforms_targets_before.results[1].stat.exists else [])
              }}

        - name: Record existing Hermes profile-transform paths for backup
          ansible.builtin.copy:
            dest: "{{ hermes_profile_transforms_stage_root }}/backup-paths.txt"
            owner: root
            group: root
            mode: "0600"
            content: |
              {% for path in hermes_profile_transforms_existing_backup_paths %}
              {{ path }}
              {% endfor %}
          when: hermes_profile_transforms_existing_backup_paths | length > 0

        - name: Back up current Hermes profile transforms
          ansible.builtin.command:
            argv:
              - /usr/bin/tar
              - --create
              - --file
              - "{{ hermes_profile_transforms_backup_dir }}/profile-transforms.tar"
              - --directory
              - /
              - --files-from
              - >-
                {{
                  hermes_profile_transforms_stage_root ~ '/backup-paths.txt'
                  if hermes_profile_transforms_existing_backup_paths | length > 0
                  else '/dev/null'
                }}
          changed_when: true

        - name: Restrict Hermes profile-transform rollback archive
          ansible.builtin.file:
            path: "{{ hermes_profile_transforms_backup_dir }}/profile-transforms.tar"
            owner: root
            group: root
            mode: "0600"

        - name: Hash Hermes profile-transform rollback archive
          ansible.builtin.command:
            argv:
              - /usr/bin/sha256sum
              - "{{ hermes_profile_transforms_backup_dir }}/profile-transforms.tar"
          register: hermes_profile_transforms_backup_hash
          changed_when: false

        - name: Record Hermes profile-transform rollback manifest
          ansible.builtin.copy:
            dest: "{{ hermes_profile_transforms_backup_dir }}/manifest.json"
            owner: root
            group: root
            mode: "0600"
            content: >-
              {{ {
                'schemaVersion': 1,
                'createdAt': hermes_profile_transforms_timestamp.stdout,
                'host': inventory_hostname,
                'artifact': 'profile-transforms.tar',
                'artifactSha256': hermes_profile_transforms_backup_hash.stdout.split()[0],
                'existingActiveRoot': hermes_profile_transforms_targets_before.results[0].stat.exists,
                'existingManifest': hermes_profile_transforms_targets_before.results[1].stat.exists,
                'existingGenerationStatus': hermes_profile_transforms_existing_generation_status,
                'plannedOutputs': hermes_profile_transforms_plan.summary.outputs,
                'plannedBytes': hermes_profile_transforms_plan.summary.outputBytes
              } | to_nice_json }}
      rescue:
        - name: Remove staged transform generation after rollback creation failure
          ansible.builtin.file:
            path: "{{ hermes_profile_transforms_stage_root }}"
            state: absent

        - name: Stop after failed Hermes profile-transform rollback creation
          ansible.builtin.fail:
            msg: >-
              Hermes profile-transform rollback creation or hashing failed. The
              staged generation was removed, active state was not changed, and
              the partial root-private rollback directory was preserved.

    - name: Install and verify reviewed Hermes profile transforms
      block:
        - name: Remove prior active Hermes profile-transform generation
          ansible.builtin.file:
            path: "{{ hermes_profile_transforms_root }}"
            state: absent

        - name: Promote staged Hermes profile-transform generation atomically
          ansible.builtin.command:
            argv:
              - /usr/bin/mv
              - "{{ hermes_profile_transforms_stage_generation }}"
              - "{{ hermes_profile_transforms_root }}"
          changed_when: true

        - name: Install root-private Hermes profile-transform manifest
          ansible.builtin.copy:
            src: "{{ hermes_profile_transforms_stage_manifest }}"
            dest: "{{ hermes_profile_transforms_manifest_live }}"
            remote_src: true
            owner: root
            group: root
            mode: "0400"

        - name: Verify installed Hermes profile transforms
          ansible.builtin.command:
            argv:
              - "{{ hermes_profile_transformer_live }}"
              - --contract
              - "{{ hermes_profile_transforms_contract_live }}"
              - --repository-root
              - "{{ hermes_profile_transforms_repository_root }}"
              - --target-root
              - "{{ hermes_profile_transforms_root }}"
              - --manifest
              - "{{ hermes_profile_transforms_manifest_live }}"
              - --mode
              - verify
              - --allow-writable-drift
          changed_when: false

        - name: Prove each profile sees only its reviewed transform bind pair
          ansible.builtin.command:
            argv:
              - /usr/bin/systemd-run
              - --quiet
              - --wait
              - --pipe
              - --collect
              - "--unit=hermes-profile-transform-{{ item.key }}-{{ hermes_profile_transforms_timestamp.stdout | lower }}"
              - --property=Type=exec
              - "--property=User=hermes-{{ item.key }}"
              - "--property=Group=hermes-{{ item.key }}"
              - --property=NoNewPrivileges=yes
              - --property=ProtectSystem=strict
              - --property=ProtectHome=yes
              - "--property=ReadWritePaths={{ item.value.writableRoot }}"
              - "--property=BindPaths={{ item.value.writableRoot }}:{{ item.value.writableRuntimeRoot }}"
              - "--property=BindReadOnlyPaths={{ item.value.managedRoot }}:{{ item.value.managedRuntimeRoot }}"
              - "{{ hermes_profile_transformer_live }}"
              - --contract
              - "{{ hermes_profile_transforms_contract_live }}"
              - --repository-root
              - "{{ hermes_profile_transforms_repository_root }}"
              - --mode
              - runtime
              - --profile
              - "{{ item.key }}"
          loop: "{{ hermes_profile_transforms_contract.profiles | dict2items }}"
          loop_control:
            label: "{{ item.key }}"
          changed_when: false

        - name: Inspect system service states after Hermes profile transforms
          ansible.builtin.command:
            argv:
              - /usr/bin/systemctl
              - show
              - --property=LoadState
              - --property=ActiveState
              - --property=UnitFileState
              - "{{ item }}"
          loop: "{{ hermes_profile_transforms_system_units }}"
          register: hermes_profile_transforms_system_after
          check_mode: false
          changed_when: false
          failed_when: false

        - name: Require unchanged system services after profile transforms
          ansible.builtin.assert:
            that:
              - hermes_profile_transforms_system_before.results | map(attribute='stdout') | list == hermes_profile_transforms_system_after.results | map(attribute='stdout') | list
            fail_msg: >-
              A Hermes or OpenClaw system service changed during inactive transforms.

        - name: Inspect production user-service states after profile transforms
          ansible.builtin.command:
            argv:
              - /usr/sbin/runuser
              - --user
              - johnny
              - --
              - /usr/bin/env
              - XDG_RUNTIME_DIR=/run/user/1000
              - DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1000/bus
              - /usr/bin/systemctl
              - --user
              - show
              - --property=LoadState
              - --property=ActiveState
              - --property=UnitFileState
              - "{{ item }}"
          loop: "{{ hermes_profile_transforms_user_units }}"
          register: hermes_profile_transforms_user_after
          check_mode: false
          changed_when: false

        - name: Require unchanged production user services after transforms
          ansible.builtin.assert:
            that:
              - hermes_profile_transforms_user_before.results | map(attribute='stdout') | list == hermes_profile_transforms_user_after.results | map(attribute='stdout') | list
            fail_msg: >-
              Production OpenClaw or Health changed during inactive transforms.
      rescue:
        - name: Remove failed Hermes profile-transform generation
          ansible.builtin.file:
            path: "{{ hermes_profile_transforms_root }}"
            state: absent

        - name: Remove failed Hermes profile-transform manifest
          ansible.builtin.file:
            path: "{{ hermes_profile_transforms_manifest_live }}"
            state: absent

        - name: Restore prior Hermes profile transforms after staging failure
          ansible.builtin.command:
            argv:
              - /usr/bin/tar
              - --extract
              - --file
              - "{{ hermes_profile_transforms_backup_dir }}/profile-transforms.tar"
              - --directory
              - /
          changed_when: true

        - name: Stop after restoring failed Hermes profile-transform transaction
          ansible.builtin.fail:
            msg: >-
              Hermes profile-transform staging failed. The prior generation and
              manifest were restored from the recorded rollback artifact.
      always:
        - name: Remove Hermes profile-transform staging root
          ansible.builtin.file:
            path: "{{ hermes_profile_transforms_stage_root }}"
            state: absent
          changed_when: false
