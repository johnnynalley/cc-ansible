---
# Purpose: Promote Astra's forced-command Docker inventory tool.
# Hosts: hermes_hosts.
# Key vars: hermes_docker_inventory_*, agent_docker_report_*.
# Templates: templates/hermes/hermes-managed-config.yaml.j2.
# Scripts: scripts/agents/hermes-agent-docker-inventory-*.py.
# Validation: ansible-playbook playbooks/agents/hermes-docker-inventory.yml
#             --syntax-check.

- name: Promote Astra read-only Docker inventory
  hosts: hermes_hosts
  become: true
  gather_facts: true

  vars:
    hermes_docker_inventory_backup_id: >-
      {{
        ansible_facts['date_time']['iso8601_basic_short']
        ~ '-pre-docker-inventory'
      }}
    hermes_docker_inventory_backup_root: >-
      {{ hermes_production_cutover_rollback_root
         }}/{{ hermes_docker_inventory_backup_id }}
    hermes_docker_inventory_backup_archive: >-
      {{ hermes_docker_inventory_backup_root }}/runtime-policy.tar
    hermes_docker_inventory_candidate_paths:
      - /etc/hermes/astra/config.yaml
      - /etc/hermes/astra/managed-policy.sha256
      - /var/lib/hermes/astra/.hermes/profiles/astra/config.yaml
      - /etc/systemd/system/hermes-gateway-astra.service
      - "{{ hermes_star_privacy_validator_live }}"
      - "{{ hermes_docker_inventory_validator_live }}"
      - "{{ hermes_docker_inventory_smoke_live }}"
      - "{{ hermes_docker_inventory_known_hosts }}"
      - "{{ hermes_docker_inventory_endpoints }}"
      - "{{ hermes_docker_inventory_plugin_managed_root }}"
      - "{{ hermes_docker_inventory_plugin_runtime_root }}"
      - "{{ hermes_star_privacy_plugin_managed_root }}/__pycache__"
      - "{{ hermes_star_privacy_plugin_runtime_root }}/__pycache__"
    hermes_docker_inventory_user_environment:
      XDG_RUNTIME_DIR: >-
        /run/user/{{ hermes_production_cutover_user_uid }}
      DBUS_SESSION_BUS_ADDRESS: >-
        unix:path=/run/user/{{ hermes_production_cutover_user_uid }}/bus
    hermes_docker_inventory_astra_profile: >-
      {{
        hermes_shadow_profiles
        | selectattr('name', 'equalto', 'astra')
        | first
      }}

  tasks:
    - name: Validate Hermes Docker inventory rollout mode
      ansible.builtin.assert:
        that:
          - >-
            hermes_docker_inventory_mode
            in ['disabled', 'key-bootstrap', 'converge']
        fail_msg: >-
          hermes_docker_inventory_mode must be disabled, key-bootstrap, or
          converge.

    - name: Skip hosts without Hermes Docker inventory approval
      ansible.builtin.meta: end_host
      when: hermes_docker_inventory_mode == 'disabled'

    - name: Require exact Hermes Docker inventory authorization
      ansible.builtin.assert:
        that:
          - hermes_docker_inventory_approved | bool
          - >-
            hermes_docker_inventory_confirmation
            == hermes_docker_inventory_required_confirmation
          - inventory_hostname == 'jn-t14s-lin'
          - hermes_shadow_profiles | map(attribute='name') | list
            == ['astra', 'dubble', 'rigel']
        fail_msg: >-
          Docker inventory promotion requires host-specific approval and the
          exact confirmation string.

    - name: Check OpenClaw system delivery units before promotion
      ansible.builtin.command:
        argv:
          - /usr/bin/systemctl
          - is-active
          - "{{ item.name }}"
      loop: "{{ hermes_production_cutover_source_system_units }}"
      register: hermes_docker_inventory_openclaw_system
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Check OpenClaw user Gateway before promotion
      ansible.builtin.command:
        argv:
          - /usr/sbin/runuser
          - --user
          - "{{ hermes_production_cutover_user }}"
          - --
          - /usr/bin/systemctl
          - --user
          - is-active
          - "{{ hermes_production_cutover_user_gateway }}"
      environment: "{{ hermes_docker_inventory_user_environment }}"
      register: hermes_docker_inventory_openclaw_user
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Require OpenClaw delivery to remain offline
      ansible.builtin.assert:
        that:
          - >-
            hermes_docker_inventory_openclaw_system.results
            | selectattr('stdout', 'equalto', 'active')
            | list
            | length == 0
          - hermes_docker_inventory_openclaw_user.stdout != 'active'

    - name: Inspect dedicated Docker inventory credential paths
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - "{{ hermes_docker_inventory_private_root }}"
        - "{{ hermes_docker_inventory_private_key }}"
        - "{{ hermes_docker_inventory_private_key }}.pub"
        - "{{ hermes_docker_update_private_key }}"
        - "{{ hermes_docker_update_private_key }}.pub"
      register: hermes_docker_inventory_credentials
      no_log: true

    - name: Reject unsafe pre-existing Docker inventory credential paths
      ansible.builtin.assert:
        that:
          - not item.stat.exists or not item.stat.islnk
        fail_msg: >-
          A Docker inventory credential path is a symlink; refusing rollout.
      loop: "{{ hermes_docker_inventory_credentials.results }}"
      no_log: true

    - name: Create root-only Docker inventory credential directory
      ansible.builtin.file:
        path: "{{ hermes_docker_inventory_private_root }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Generate dedicated Docker report reader key
      ansible.builtin.command:
        argv:
          - /usr/bin/ssh-keygen
          - -q
          - -t
          - ed25519
          - -N
          - ""
          - -C
          - hermes-astra-agent-report
          - -f
          - "{{ hermes_docker_inventory_private_key }}"
        creates: "{{ hermes_docker_inventory_private_key }}"
      no_log: true

    - name: Generate dedicated Docker update trigger key
      ansible.builtin.command:
        argv:
          - /usr/bin/ssh-keygen
          - -q
          - -t
          - ed25519
          - -N
          - ""
          - -C
          - hermes-astra-agent-auto-update
          - -f
          - "{{ hermes_docker_update_private_key }}"
        creates: "{{ hermes_docker_update_private_key }}"
      no_log: true

    - name: Inspect generated Docker access keys
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - "{{ hermes_docker_inventory_private_key }}"
        - "{{ hermes_docker_inventory_private_key }}.pub"
        - "{{ hermes_docker_update_private_key }}"
        - "{{ hermes_docker_update_private_key }}.pub"
      register: hermes_docker_inventory_generated_credentials
      no_log: true

    - name: Require isolated Docker access key ownership
      ansible.builtin.assert:
        that:
          - hermes_docker_inventory_generated_credentials.results[0].stat.isreg
          - >-
            hermes_docker_inventory_generated_credentials.results[0].stat.pw_name
            == 'root'
          - >-
            hermes_docker_inventory_generated_credentials.results[0].stat.mode
            == '0600'
          - hermes_docker_inventory_generated_credentials.results[1].stat.isreg
          - >-
            hermes_docker_inventory_generated_credentials.results[1].stat.pw_name
            == 'root'
          - hermes_docker_inventory_generated_credentials.results[2].stat.isreg
          - >-
            hermes_docker_inventory_generated_credentials.results[2].stat.pw_name
            == 'root'
          - >-
            hermes_docker_inventory_generated_credentials.results[2].stat.mode
            == '0600'
          - hermes_docker_inventory_generated_credentials.results[3].stat.isreg
          - >-
            hermes_docker_inventory_generated_credentials.results[3].stat.pw_name
            == 'root'
        fail_msg: A Docker access credential is not root-confined.
      no_log: true

    - name: Finish dedicated key bootstrap without changing Hermes
      ansible.builtin.meta: end_host
      when: hermes_docker_inventory_mode == 'key-bootstrap'

    - name: Collect managed Docker host network facts
      ansible.builtin.setup:
        gather_subset:
          - "!all"
          - network
      delegate_to: "{{ item }}"
      loop: "{{ groups['docker_hosts'] | sort }}"
      register: hermes_docker_inventory_network_facts
      check_mode: false

    - name: Read managed Docker host Ed25519 public keys
      ansible.builtin.slurp:
        src: /etc/ssh/ssh_host_ed25519_key.pub
      delegate_to: "{{ item }}"
      loop: "{{ groups['docker_hosts'] | sort }}"
      register: hermes_docker_inventory_host_public_keys
      no_log: true
      check_mode: false

    - name: Initialize managed Docker endpoint inventory
      ansible.builtin.set_fact:
        hermes_docker_inventory_endpoint_records: []
        hermes_docker_inventory_host_key_records: {}

    - name: Build managed Docker endpoint inventory
      ansible.builtin.set_fact:
        hermes_docker_inventory_endpoint_records: >-
          {{
            hermes_docker_inventory_endpoint_records
            + [{
              'name': item.item,
              'address': item.ansible_facts.ansible_default_ipv4.address,
              'report': true,
              'update': (
                hostvars[item.item].docker_auto_update_enabled
                | default(false) | bool
              )
            }]
          }}
      loop: "{{ hermes_docker_inventory_network_facts.results }}"
      no_log: true

    - name: Build managed Docker host-key inventory
      ansible.builtin.set_fact:
        hermes_docker_inventory_host_key_records: >-
          {{
            hermes_docker_inventory_host_key_records
            | combine({
              item.item: (
                item.content | b64decode | trim
              ).split()[0:2] | join(' ')
            })
          }}
      loop: "{{ hermes_docker_inventory_host_public_keys.results }}"
      no_log: true

    - name: Require complete dynamic Docker host inventory
      ansible.builtin.assert:
        that:
          - >-
            hermes_docker_inventory_endpoint_records
            | map(attribute='name') | sort
            == groups['docker_hosts'] | sort
          - >-
            hermes_docker_inventory_endpoint_records
            | map(attribute='address') | unique | list | length
            == groups['docker_hosts'] | length
          - >-
            hermes_docker_inventory_host_key_records.keys() | sort
            == groups['docker_hosts'] | sort
          - >-
            hermes_docker_inventory_host_key_records.values()
            | select('match', '^ssh-ed25519 [A-Za-z0-9+/]+={0,3}$')
            | list | length == groups['docker_hosts'] | length
          - agent_docker_report_enabled | bool
          - agent_docker_report_rollout_approved | bool
          - agent_docker_update_trigger_rollout_approved | bool
          - >-
            agent_docker_update_trigger_authorized_keys | length == 1
          - >-
            agent_docker_update_trigger_source_cidrs
            == ['192.168.1.31/32']
        fail_msg: >-
          Convergence requires every current docker_hosts member, its live
          default IPv4 address, its Ed25519 host key, and enabled report/update
          boundaries.

    - name: Read generated Docker report reader public key
      ansible.builtin.slurp:
        src: "{{ hermes_docker_inventory_private_key }}.pub"
      register: hermes_docker_inventory_public_key
      no_log: true

    - name: Require reporter enrollment to match the generated key
      ansible.builtin.assert:
        that:
          - >-
            (hermes_docker_inventory_public_key.content | b64decode | trim)
            in agent_docker_report_authorized_keys
          - agent_docker_report_source_cidrs == ['192.168.1.31/32']
        fail_msg: >-
          Reporter enrollment does not match the dedicated Astra key and exact
          T14s source address.
      no_log: true

    - name: Read generated Docker update trigger public key
      ansible.builtin.slurp:
        src: "{{ hermes_docker_update_private_key }}.pub"
      register: hermes_docker_update_public_key
      no_log: true

    - name: Require update enrollment to match the generated key
      ansible.builtin.assert:
        that:
          - >-
            (hermes_docker_update_public_key.content | b64decode | trim)
            in agent_docker_update_trigger_authorized_keys
          - >-
            agent_docker_update_trigger_source_cidrs
            == ['192.168.1.31/32']
        fail_msg: >-
          Update enrollment does not match the dedicated Astra key and exact
          T14s source address.
      no_log: true

    - name: Inspect files covered by the promotion transaction
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop: "{{ hermes_docker_inventory_candidate_paths }}"
      register: hermes_docker_inventory_prior_paths

    - name: Select existing promotion paths for backup
      ansible.builtin.set_fact:
        hermes_docker_inventory_existing_paths: >-
          {{
            hermes_docker_inventory_prior_paths.results
            | selectattr('stat.exists')
            | map(attribute='item')
            | list
          }}

    - name: Verify live rollback storage before Hermes Docker promotion
      ansible.builtin.command:
        argv:
          - /usr/bin/mountpoint
          - -q
          - /srv/live-rollbacks
      changed_when: false
      check_mode: false

    - name: Create targeted Docker inventory rollback directory
      ansible.builtin.file:
        path: "{{ hermes_docker_inventory_backup_root }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Back up current Hermes policy and units
      ansible.builtin.command:
        argv: >-
          {{
            ['/usr/bin/tar', '--acls', '--xattrs', '-C', '/', '-cpf',
             hermes_docker_inventory_backup_archive]
            + (hermes_docker_inventory_existing_paths
               | map('regex_replace', '^/', '') | list)
          }}
      when:
        - not ansible_check_mode
        - hermes_docker_inventory_existing_paths | length > 0
      changed_when: true

    - name: Promote Docker inventory tool transaction
      block:
        - name: Create root-owned Docker inventory plugin directories
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            owner: root
            group: hermes-astra
            mode: "0750"
          loop:
            - "{{ hermes_docker_inventory_plugin_managed_root }}"
            - "{{ hermes_docker_inventory_plugin_runtime_root }}"

        - name: Deploy root-owned Docker inventory plugin copies
          ansible.builtin.copy:
            src: >-
              {{ playbook_dir
                 }}/../../{{ hermes_docker_inventory_plugin_source
                 }}/{{ item.1 }}
            dest: "{{ item.0 }}/{{ item.1 }}"
            owner: root
            group: hermes-astra
            mode: "0440"
          loop: >-
            {{
              [hermes_docker_inventory_plugin_managed_root,
               hermes_docker_inventory_plugin_runtime_root]
              | product(['__init__.py', 'plugin.yaml']) | list
            }}
          register: hermes_docker_inventory_plugin_copies

        - name: Deploy Docker inventory validator and smoke probe
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/../../{{ item.source }}"
            dest: "{{ item.destination }}"
            owner: root
            group: root
            mode: "0555"
          loop:
            - source: "{{ hermes_docker_inventory_validator_source }}"
              destination: "{{ hermes_docker_inventory_validator_live }}"
            - source: "{{ hermes_docker_inventory_smoke_source }}"
              destination: "{{ hermes_docker_inventory_smoke_live }}"

        - name: Deploy updated Star privacy validator
          ansible.builtin.copy:
            src: >-
              {{
                playbook_dir
                ~ '/../../'
                ~ hermes_star_privacy_validator_source
              }}
            dest: "{{ hermes_star_privacy_validator_live }}"
            owner: root
            group: root
            mode: "0555"

        - name: Remove stale managed plugin bytecode caches
          ansible.builtin.file:
            path: "{{ item }}/__pycache__"
            state: absent
          loop:
            - "{{ hermes_star_privacy_plugin_managed_root }}"
            - "{{ hermes_star_privacy_plugin_runtime_root }}"
            - "{{ hermes_docker_inventory_plugin_managed_root }}"
            - "{{ hermes_docker_inventory_plugin_runtime_root }}"

        - name: Pin managed Docker SSH host keys
          ansible.builtin.copy:
            # yamllint disable rule:line-length
            content: |
              {% for endpoint in hermes_docker_inventory_endpoint_records | sort(attribute='name') %}
              {{ endpoint.address }} {{ hermes_docker_inventory_host_key_records[endpoint.name] }}
              {% endfor %}
            # yamllint enable rule:line-length
            dest: "{{ hermes_docker_inventory_known_hosts }}"
            owner: root
            group: hermes-astra
            mode: "0440"

        - name: Publish managed Docker endpoint manifest
          ansible.builtin.copy:
            content: >-
              {{
                {
                  'schemaVersion': 1,
                  'hosts': (
                    hermes_docker_inventory_endpoint_records
                    | sort(attribute='name')
                  )
                } | to_nice_json
              }}
            dest: "{{ hermes_docker_inventory_endpoints }}"
            owner: root
            group: hermes-astra
            mode: "0440"

        - name: Read mutable Hermes configs before schema promotion
          ansible.builtin.slurp:
            src: "{{ item.home }}/config.yaml"
          loop:
            - "{{ hermes_docker_inventory_astra_profile }}"
          register: hermes_docker_inventory_mutable_configs
          no_log: true

        - name: Require current or one-step prior mutable config schema
          ansible.builtin.assert:
            that:
              - >-
                (item.content | b64decode | from_yaml)._config_version | int
                in [
                  hermes_shadow_version_only_migration_from | int,
                  hermes_shadow_config_version | int
                ]
          loop: "{{ hermes_docker_inventory_mutable_configs.results }}"
          no_log: true

        - name: Promote mutable Hermes config schema without changing values
          ansible.builtin.copy:
            content: >-
              {{
                (item.content | b64decode | from_yaml)
                | combine({'_config_version': hermes_shadow_config_version})
                | to_nice_yaml(indent=2, sort_keys=false)
              }}
            dest: "{{ item.item.home }}/config.yaml"
            owner: "{{ item.item.user }}"
            group: "{{ item.item.group }}"
            mode: "0600"
          loop: "{{ hermes_docker_inventory_mutable_configs.results }}"
          when: >-
            (item.content | b64decode | from_yaml)._config_version | int
            == hermes_shadow_version_only_migration_from | int
          no_log: true
          register: hermes_docker_inventory_schema_promotions

        - name: Render promoted per-profile Hermes managed policy
          ansible.builtin.template:
            src: >-
              {{ playbook_dir
                 }}/../../templates/hermes/hermes-managed-config.yaml.j2
            dest: "/etc/hermes/{{ hermes_profile.name }}/config.yaml"
            owner: root
            group: "{{ hermes_profile.group }}"
            mode: "0440"
          loop:
            - "{{ hermes_docker_inventory_astra_profile }}"
          loop_control:
            loop_var: hermes_profile
          register: hermes_docker_inventory_managed_policies

        - name: Validate merged Hermes configs as service identities
          ansible.builtin.command:
            argv:
              - /usr/sbin/runuser
              - --user
              - "{{ item.user }}"
              - --
              - /usr/bin/env
              - "HOME={{ item.account_home }}"
              - "HERMES_HOME={{ item.home }}"
              - "HERMES_MANAGED_DIR=/etc/hermes/{{ item.name }}"
              - HERMES_DOCKER_BINARY=/usr/bin/podman
              - "{{ hermes_shadow_runtime_binary }}"
              - config
              - check
          loop:
            - "{{ hermes_docker_inventory_astra_profile }}"
          changed_when: false
          no_log: true

        - name: Validate promoted Astra native plugins
          ansible.builtin.command:
            argv: "{{ item }}"
          loop:
            - - "{{ hermes_shadow_runtime_venv }}/bin/python"
              - "{{ hermes_star_privacy_validator_live }}"
              - --source-root
              - "{{ hermes_star_privacy_plugin_managed_root }}"
              - --runtime-root
              - "{{ hermes_star_privacy_plugin_runtime_root }}"
              - --config
              - /etc/hermes/astra/config.yaml
            - - "{{ hermes_shadow_runtime_venv }}/bin/python"
              - "{{ hermes_docker_inventory_validator_live }}"
              - --source-root
              - "{{ hermes_docker_inventory_plugin_managed_root }}"
              - --runtime-root
              - "{{ hermes_docker_inventory_plugin_runtime_root }}"
              - --config
              - /etc/hermes/astra/config.yaml
              - --known-hosts
              - "{{ hermes_docker_inventory_known_hosts }}"
              - --endpoints
              - "{{ hermes_docker_inventory_endpoints }}"
          changed_when: false

        - name: Hash promoted Hermes policy and environment
          ansible.builtin.command:
            argv:
              - /usr/bin/sha256sum
              - "/etc/hermes/{{ item.name }}/config.yaml"
              - "/etc/hermes/{{ item.name }}/.env"
          loop:
            - "{{ hermes_docker_inventory_astra_profile }}"
          register: hermes_docker_inventory_policy_hashes
          changed_when: false
          no_log: true

        - name: Deploy promoted Hermes policy checksum manifests
          ansible.builtin.copy:
            content: "{{ item.stdout }}\n"
            dest: "/etc/hermes/{{ item.item.name }}/managed-policy.sha256"
            owner: root
            group: "{{ item.item.group }}"
            mode: "0440"
          loop: "{{ hermes_docker_inventory_policy_hashes.results }}"
          no_log: true

        - name: Determine whether Astra needs one planned restart
          ansible.builtin.set_fact:
            hermes_docker_inventory_restart_required: >-
              {{
                (
                  hermes_docker_inventory_plugin_copies.results
                  | selectattr('changed') | list | length > 0
                )
                or (
                  hermes_docker_inventory_schema_promotions.results
                  | selectattr('changed') | list | length > 0
                )
                or (
                  hermes_docker_inventory_managed_policies.results
                  | selectattr('changed') | list | length > 0
                )
              }}
            hermes_docker_inventory_restart_attempted: false

        - name: Reload promoted Hermes units
          ansible.builtin.systemd_service:
            daemon_reload: true

        - name: Prepare service-owned markers for inventory promotion restarts
          ansible.builtin.include_tasks:
            file: ../../tasks/hermes-planned-stop-marker.yml
          vars:
            hermes_planned_stop_profile: "{{ item }}"
          loop:
            - "{{ hermes_docker_inventory_astra_profile }}"
          loop_control:
            label: "{{ item.name }}"
          when: hermes_docker_inventory_restart_required | bool

        - name: Record planned Astra restart attempt
          ansible.builtin.set_fact:
            hermes_docker_inventory_restart_attempted: true
          when: hermes_docker_inventory_restart_required | bool

        - name: Restart promoted production consumers natively
          ansible.builtin.command:
            argv:
              - "{{ hermes_shadow_runtime_binary }}"
              - gateway
              - restart
              - --system
          environment:
            HOME: "{{ item.account_home }}"
            HERMES_HOME: "{{ item.home }}"
            HERMES_MANAGED_DIR: "/etc/hermes/{{ item.name }}"
          loop:
            - "{{ hermes_docker_inventory_astra_profile }}"
          loop_control:
            label: "{{ item.name }}"
          changed_when: true
          when: hermes_docker_inventory_restart_required | bool

        - name: Exercise Docker inventory as the real Astra identity
          ansible.builtin.command:
            argv:
              - /usr/bin/systemd-run
              - --quiet
              - --wait
              - --pipe
              - --collect
              - --unit=hermes-docker-inventory-smoke
              - --property=User=hermes-astra
              - --property=Group=hermes-astra
              - >-
                --property=LoadCredential=agent-docker-report-key:{{
                hermes_docker_inventory_private_key }}
              - >-
                --property=LoadCredential=agent-docker-update-key:{{
                hermes_docker_update_private_key }}
              - "{{ hermes_shadow_runtime_venv }}/bin/python"
              - "{{ hermes_docker_inventory_smoke_live }}"
              - --plugin
              - "{{ hermes_docker_inventory_plugin_runtime_root }}"
          changed_when: false

        - name: Remove validation bytecode after Docker acceptance
          ansible.builtin.file:
            path: "{{ item }}/__pycache__"
            state: absent
          loop:
            - "{{ hermes_star_privacy_plugin_managed_root }}"
            - "{{ hermes_star_privacy_plugin_runtime_root }}"
            - "{{ hermes_docker_inventory_plugin_managed_root }}"
            - "{{ hermes_docker_inventory_plugin_runtime_root }}"

        - name: Require promoted consumers and Health active
          ansible.builtin.command:
            argv:
              - /usr/bin/systemctl
              - is-active
              - "{{ item }}"
          loop:
            - hermes-gateway-astra.service
            - hermes-gateway-dubble.service
            - hermes-native-update.timer
            - hermes-tirith-native-update.timer
          register: hermes_docker_inventory_active_units
          changed_when: false
          check_mode: false

        - name: Require every promoted production unit active
          ansible.builtin.assert:
            that:
              - item.stdout == 'active'
          loop: "{{ hermes_docker_inventory_active_units.results }}"

      rescue:
        - name: Restore pre-promotion Hermes policy and units
          ansible.builtin.command:
            argv:
              - /usr/bin/tar
              - --acls
              - --xattrs
              - -C
              - /
              - -xpf
              - "{{ hermes_docker_inventory_backup_archive }}"
          when:
            - not ansible_check_mode
            - hermes_docker_inventory_existing_paths | length > 0
          changed_when: true

        - name: Remove newly introduced Docker inventory artifacts
          ansible.builtin.file:
            path: "{{ item.item }}"
            state: absent
          loop: "{{ hermes_docker_inventory_prior_paths.results }}"
          when:
            - not ansible_check_mode
            - not item.stat.exists

        - name: Reload restored Hermes units
          ansible.builtin.systemd_service:
            daemon_reload: true

        - name: Prepare best-effort markers for restored inventory restarts
          ansible.builtin.include_tasks:
            file: ../../tasks/hermes-planned-stop-marker.yml
          vars:
            hermes_planned_stop_profile: "{{ item }}"
            hermes_planned_stop_strict: false
          loop:
            - "{{ hermes_docker_inventory_astra_profile }}"
          loop_control:
            label: "{{ item.name }}"
          when: hermes_docker_inventory_restart_attempted | default(false) | bool

        - name: Restore production consumers natively after promotion failure
          ansible.builtin.command:
            argv:
              - "{{ hermes_shadow_runtime_binary }}"
              - gateway
              - restart
              - --system
          environment:
            HOME: "{{ item.account_home }}"
            HERMES_HOME: "{{ item.home }}"
            HERMES_MANAGED_DIR: "/etc/hermes/{{ item.name }}"
          loop:
            - "{{ hermes_docker_inventory_astra_profile }}"
          loop_control:
            label: "{{ item.name }}"
          changed_when: true
          failed_when: false
          when: hermes_docker_inventory_restart_attempted | default(false) | bool

        - name: Fail after restoring pre-promotion Hermes state
          ansible.builtin.fail:
            msg: >-
              Docker inventory promotion failed. Prior Hermes policy and units
              were restored from {{ hermes_docker_inventory_backup_archive }}.
