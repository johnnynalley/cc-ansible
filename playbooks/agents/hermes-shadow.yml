    - name: Deploy per-profile Hermes managed policy
      ansible.builtin.template:
        src: >-
          {{ playbook_dir
             }}/../../templates/hermes/hermes-managed-config.yaml.j2
        dest: "/etc/hermes/{{ hermes_profile.name }}/config.yaml"
        owner: root
        group: "{{ hermes_profile.group }}"
        mode: "0440"
        backup: true
      loop: "{{ hermes_shadow_profiles }}"
      loop_control:
        loop_var: hermes_profile
        label: "{{ hermes_profile.name }}"

    - name: Seed mutable Hermes profile config once
      ansible.builtin.copy:
        content: "_config_version: {{ hermes_shadow_config_version }}\n"
        dest: "{{ item.home }}/config.yaml"
        owner: "{{ item.user }}"
        group: "{{ item.group }}"
        mode: "0600"
        force: false
      loop: "{{ hermes_shadow_profiles }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Read mutable Hermes profile configs before schema repair
      ansible.builtin.slurp:
        src: "{{ item.home }}/config.yaml"
      loop: "{{ hermes_shadow_profiles }}"
      loop_control:
        label: "{{ item.name }}"
      register: hermes_shadow_mutable_configs_before_repair
      no_log: true

    - name: Stamp only newly seeded empty Hermes profile configs
      ansible.builtin.copy:
        content: "_config_version: {{ hermes_shadow_config_version }}\n"
        dest: "{{ item.item.home }}/config.yaml"
        owner: "{{ item.item.user }}"
        group: "{{ item.item.group }}"
        mode: "0600"
      loop: "{{ hermes_shadow_mutable_configs_before_repair.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: (item.content | b64decode | from_yaml) == {}
      no_log: true

    - name: Read current mutable Hermes profile configs
      ansible.builtin.slurp:
        src: "{{ item.home }}/config.yaml"
      loop: "{{ hermes_shadow_profiles }}"
      loop_control:
        label: "{{ item.name }}"
      register: hermes_shadow_mutable_configs
      no_log: true

    - name: Require current mutable Hermes config schema
      ansible.builtin.assert:
        that:
          - >-
            (item.content | b64decode | from_yaml)._config_version | int
            == hermes_shadow_config_version | int
        fail_msg: >-
          Existing Hermes profile config requires an attended offline schema
          migration before any gateway may start.
      loop: "{{ hermes_shadow_mutable_configs.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      no_log: true

    - name: Seed root-managed Hermes service environment once
      ansible.builtin.copy:
        content: |
          # Provider credentials are enrolled during an attended gate.
        dest: "/etc/hermes/{{ item.name }}/.env"
        owner: root
        group: "{{ item.group }}"
        mode: "0440"
        force: false
      loop: "{{ hermes_shadow_profiles }}"
      loop_control:
        label: "{{ item.name }}"
      no_log: true

    - name: Read Hermes shadow service environments privately
      ansible.builtin.slurp:
        src: "/etc/hermes/{{ item.name }}/.env"
      loop: "{{ hermes_shadow_profiles }}"
      loop_control:
        label: "{{ item.name }}"
      register: hermes_shadow_service_environments
