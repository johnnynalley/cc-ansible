---
# Purpose: Stage the isolated Hermes replacement without production delivery.
# Hosts: hermes_hosts.
# Key vars: hermes_shadow_*.
# Templates: templates/hermes.
# Scripts: scripts/agents/hermes-shadow-target-audit.py.
# Validation: ansible-playbook playbooks/agents/hermes-shadow.yml
#             --syntax-check.

- name: Configure isolated Hermes shadow runtime
  hosts: hermes_hosts
  become: true
  gather_facts: false

  vars:
    hermes_shadow_contract_path: >-
      {{ playbook_dir }}/../../{{ hermes_shadow_contract_source }}
    hermes_shadow_contract: >-
      {{ lookup(
           'ansible.builtin.file',
           hermes_shadow_contract_path
         ) | from_json }}

  tasks:
    - name: Validate Hermes shadow mode
      ansible.builtin.assert:
        that:
          - hermes_shadow_mode in ['disabled', 'bootstrap', 'shadow']
        fail_msg: >-
          hermes_shadow_mode must be disabled, bootstrap, or shadow. This
          playbook does not implement production delivery or cutover.

    - name: Inspect Hermes shadow units
      ansible.builtin.stat:
        path: "/etc/systemd/system/hermes-gateway-{{ item.name }}.service"
      loop: "{{ hermes_shadow_profiles }}"
      loop_control:
        label: "{{ item.name }}"
      register: hermes_shadow_units
      check_mode: false

    - name: Stop Hermes shadow units when disabled
      ansible.builtin.systemd_service:
        name: "hermes-gateway-{{ item.item.name }}.service"
        enabled: false
        state: stopped
      loop: "{{ hermes_shadow_units.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when:
        - hermes_shadow_mode == 'disabled'
        - item.stat.exists

    - name: Skip hosts without Hermes shadow approval
      ansible.builtin.meta: end_host
      when: hermes_shadow_mode == 'disabled'

    - name: Require explicit Hermes shadow approval
      ansible.builtin.assert:
        that:
          - hermes_shadow_change_approved | bool
          - inventory_hostname == hermes_shadow_contract.deployment.targetHost
          - hermes_shadow_contract.deployment.mode == 'shadow'
          - hermes_shadow_contract.deployment.sameHostReplacement | bool
          - not hermes_shadow_contract.deployment.sourceRuntimeConcurrentEnabled
          - hermes_shadow_contract.deployment.sourceFilesRetained | bool
          - >-
            not hermes_shadow_contract.deployment
            .sourceFilesDirectlyReadableByHermes
          - not hermes_shadow_contract.deployment.productionDeliveryEnabled
          - not hermes_shadow_contract.deployment.productionSchedulerEnabled
          - not hermes_shadow_contract.deployment.productionRouteEnabled
          - not hermes_shadow_contract.deployment.sourceCleanupEnabled
          - not hermes_shadow_contract.deployment.sourceArchiveEnabled
          - hermes_shadow_contract.sandbox.binary == '/usr/bin/podman'
          - hermes_shadow_contract.sandbox.rootless | bool
          - not hermes_shadow_contract.sandbox.dockerGroup
          - not hermes_shadow_contract.sandbox.dockerSocket
          - not hermes_shadow_contract.sandbox.localTerminalFallback
          - not hermes_shadow_contract.sandbox.networkEnabled
          - hermes_shadow_contract.sandbox.hostVolumes | length == 0
          - hermes_shadow_contract.sandbox.forwardEnvironment | length == 0
          - hermes_shadow_contract.sandbox.forwardCredentialFiles | length == 0
          - >-
            hermes_shadow_profiles | map(attribute='name') | list
            == ['astra', 'dubble', 'rigel']
        fail_msg: >-
          The requested host, mode, profiles, or security boundary differs from
          the reviewed Hermes shadow contract.

    - name: Validate Hermes profile identity declarations
      ansible.builtin.assert:
        that:
          - item.user == 'hermes-' + item.name
          - item.group == item.user
          - item.home == '/var/lib/hermes/' + item.name
          - item.uid | int >= 62010
          - item.uid | int <= 62012
          - item.subid_start | int >= 200000
          - item.discord_allowed_users | length == 0
          - item.discord_allowed_channels | length == 0
          - item.discord_free_response_channels | length == 0
          - item.discord_admin_users | length == 0
          - not item.discord_slash_commands | bool
          - item.toolsets | length > 0
          - "'terminal' in item.disabled_toolsets"
          - "'file' in item.disabled_toolsets"
          - "'code_execution' in item.disabled_toolsets"
          - "'discord_admin' in item.disabled_toolsets"
        fail_msg: >-
          Hermes profile {{ item.name }} exceeds its reviewed authority.
      loop: "{{ hermes_shadow_profiles }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Read Hermes target logical CPU capacity
      ansible.builtin.command:
        argv:
          - getconf
          - _NPROCESSORS_ONLN
      register: hermes_shadow_host_cpus
      changed_when: false

    - name: Read Hermes target available memory
      ansible.builtin.command:
        argv:
          - awk
          - /MemAvailable/ {print int($2 / 1024)}
          - /proc/meminfo
      register: hermes_shadow_host_available_memory
      changed_when: false

    - name: Read Hermes target free root filesystem space
      ansible.builtin.command:
        argv:
          - df
          - --output=avail
          - -BG
          - /
      register: hermes_shadow_host_free_disk
      changed_when: false

    - name: Require reviewed same-host Hermes capacity
      ansible.builtin.assert:
        that:
          - >-
            hermes_shadow_host_cpus.stdout | int
            >= hermes_shadow_contract.host.minimumLogicalCpus | int
          - >-
            hermes_shadow_host_available_memory.stdout | int
            >= hermes_shadow_contract.host.minimumAvailableMemoryMiB | int
          - >-
            hermes_shadow_host_free_disk.stdout_lines[-1]
            | regex_replace('[^0-9]', '') | int
            >= hermes_shadow_contract.host.minimumFreeDiskGiB | int
        fail_msg: >-
          The same-host Hermes CPU, available-memory, or free-disk preflight no
          longer meets the reviewed contract. Do not install or start Hermes.

    - name: Inspect Hermes runtime
      ansible.builtin.stat:
        path: "{{ hermes_shadow_runtime_binary }}"
      register: hermes_shadow_runtime
      check_mode: false

    - name: Require reviewed Hermes release provenance
      ansible.builtin.assert:
        that:
          - >-
            hermes_shadow_install_ref
            is match('^v[0-9]{4}(\.[0-9]+){2,3}$')
          - >-
            hermes_shadow_expected_commit
            is match('^[0-9a-f]{40}$')
          - >-
            hermes_shadow_expected_tag_object
            is match('^[0-9a-f]{40}$')
        fail_msg: >-
          Every active Hermes run requires a reviewed release tag object and
          that tag's exact expected commit.

    - name: Require reviewed locked artifacts for a new runtime
      ansible.builtin.assert:
        that:
          - hermes_shadow_install_approved | bool
          - >-
            hermes_shadow_uv_archive_sha256
            is match('^[0-9a-f]{64}$')
          - hermes_shadow_uv_version is match('^[0-9]+(\.[0-9]+){2}$')
        fail_msg: >-
          A fresh Hermes install requires explicit approval and the reviewed
          uv release checksum used by the locked dependency transaction.
      when: not hermes_shadow_runtime.stat.exists

    - name: Install Hermes shadow host prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - fuse-overlayfs
          - git
          - podman
          - slirp4netns
          - uidmap
          - xz-utils
        state: present
        update_cache: true

    - name: Create Hermes service groups
      ansible.builtin.group:
        name: "{{ item.group }}"
        gid: "{{ item.uid }}"
        system: true
        state: present
      loop: "{{ hermes_shadow_profiles }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Create Hermes no-login service accounts
      ansible.builtin.user:
        name: "{{ item.user }}"
        uid: "{{ item.uid }}"
        group: "{{ item.group }}"
        home: "{{ item.home }}"
        shell: /usr/sbin/nologin
        create_home: true
        system: true
        password_lock: true
        state: present
      loop: "{{ hermes_shadow_profiles }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Allocate rootless Podman subordinate UIDs
      ansible.builtin.lineinfile:
        path: /etc/subuid
        regexp: "^{{ item.user | regex_escape }}:"
        line: "{{ item.user }}:{{ item.subid_start }}:65536"
        create: true
        owner: root
        group: root
        mode: "0644"
        backup: true
      loop: "{{ hermes_shadow_profiles }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Allocate rootless Podman subordinate GIDs
      ansible.builtin.lineinfile:
        path: /etc/subgid
        regexp: "^{{ item.user | regex_escape }}:"
        line: "{{ item.user }}:{{ item.subid_start }}:65536"
        create: true
        owner: root
        group: root
        mode: "0644"
        backup: true
      loop: "{{ hermes_shadow_profiles }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Create Hermes root-owned deployment directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - /etc/hermes
        - /usr/local/share/hermes-shadow
        - /usr/local/share/hermes-shadow/repository
        - /usr/local/share/hermes-shadow/repository/files
        - /usr/local/share/hermes-shadow/repository/files/hermes
        - /usr/local/share/hermes-shadow/repository/files/hermes/jobs
        - /usr/local/share/hermes-shadow/repository/playbooks
        - /usr/local/share/hermes-shadow/repository/playbooks/agents
        - /usr/local/share/hermes-shadow/repository/scripts
        - /usr/local/share/hermes-shadow/repository/scripts/agents
        - /usr/local/libexec
        - /var/cache/hermes
        - "{{ hermes_shadow_uv_extract_dir }}"
        - "{{ hermes_shadow_uv_cache_dir }}"
        - /var/lib/hermes/bootstrap
        - /var/lib/hermes/bootstrap/bin
        - /usr/local/share/uv

    - name: Create per-profile Hermes managed scopes
      ansible.builtin.file:
        path: "/etc/hermes/{{ item.name }}"
        state: directory
        owner: root
        group: "{{ item.group }}"
        mode: "0750"
      loop: "{{ hermes_shadow_profiles }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Create per-profile Hermes mutable directories
      ansible.builtin.file:
        path: "{{ item.0.home }}/{{ item.1 }}"
        state: directory
        owner: "{{ item.0.user }}"
        group: "{{ item.0.group }}"
        mode: "0700"
      loop: >-
        {{ hermes_shadow_profiles
           | product([
               'memories', 'skills', 'cron', 'sessions', 'logs', 'pending',
               'data', 'state'
             ])
           | list }}
      loop_control:
        label: "{{ item.0.name }}/{{ item.1 }}"

    - name: Create root-owned Hermes script directories
      ansible.builtin.file:
        path: "{{ item.home }}/scripts"
        state: directory
        owner: root
        group: "{{ item.group }}"
        mode: "0750"
      loop: "{{ hermes_shadow_profiles }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Download reviewed uv release archive
      ansible.builtin.get_url:
        url: "{{ hermes_shadow_uv_archive_url }}"
        dest: "{{ hermes_shadow_uv_archive_cache }}"
        checksum: "sha256:{{ hermes_shadow_uv_archive_sha256 }}"
        owner: root
        group: root
        mode: "0644"
      when: not hermes_shadow_runtime.stat.exists

    - name: Extract reviewed uv release archive
      ansible.builtin.unarchive:
        src: "{{ hermes_shadow_uv_archive_cache }}"
        dest: "{{ hermes_shadow_uv_extract_dir }}"
        remote_src: true
        creates: >-
          {{ hermes_shadow_uv_extract_dir
             }}/uv-x86_64-unknown-linux-gnu/uv
      when: not hermes_shadow_runtime.stat.exists

    - name: Install reviewed Hermes-managed uv binary
      ansible.builtin.copy:
        src: >-
          {{ hermes_shadow_uv_extract_dir
             }}/uv-x86_64-unknown-linux-gnu/uv
        dest: "{{ hermes_shadow_uv_binary }}"
        remote_src: true
        owner: root
        group: root
        mode: "0755"
      when: not hermes_shadow_runtime.stat.exists

    - name: Verify reviewed Hermes-managed uv version
      ansible.builtin.command:
        argv:
          - "{{ hermes_shadow_uv_binary }}"
          - --version
      register: hermes_shadow_uv_installed_version
      changed_when: false
      when: not hermes_shadow_runtime.stat.exists

    - name: Require exact Hermes-managed uv version
      ansible.builtin.assert:
        that:
          - >-
            hermes_shadow_uv_installed_version.stdout
            == 'uv ' + hermes_shadow_uv_version
      when: not hermes_shadow_runtime.stat.exists

    - name: Check out exact official Hermes source
      ansible.builtin.git:
        repo: "{{ hermes_shadow_source_repo }}"
        dest: "{{ hermes_shadow_runtime_root }}"
        version: "{{ hermes_shadow_expected_commit }}"
        force: false
        update: true
      when: not hermes_shadow_runtime.stat.exists

    - name: Synchronize only locked Hermes dependencies
      ansible.builtin.command:
        argv:
          - "{{ hermes_shadow_uv_binary }}"
          - sync
          - --extra
          - all
          - --locked
        chdir: "{{ hermes_shadow_runtime_root }}"
        creates: "{{ hermes_shadow_runtime_venv }}/bin/hermes"
      environment:
        HOME: /root
        HERMES_HOME: /var/lib/hermes/bootstrap
        UV_NO_CONFIG: "1"
        UV_CACHE_DIR: "{{ hermes_shadow_uv_cache_dir }}"
        UV_PROJECT_ENVIRONMENT: "{{ hermes_shadow_runtime_venv }}"
        UV_PYTHON_INSTALL_DIR: /usr/local/share/uv/python
        UV_PYTHON_BIN_DIR: /usr/local/share/uv/bin
      when: not hermes_shadow_runtime.stat.exists

    - name: Install Hermes launcher
      ansible.builtin.copy:
        content: |
          #!/usr/bin/env bash
          unset PYTHONPATH
          unset PYTHONHOME
          exec "{{ hermes_shadow_runtime_venv }}/bin/python" \
            "{{ hermes_shadow_runtime_root }}/hermes" "$@"
        dest: "{{ hermes_shadow_runtime_binary }}"
        owner: root
        group: root
        mode: "0755"
      when: not hermes_shadow_runtime.stat.exists

    - name: Record native Hermes Git install method
      ansible.builtin.copy:
        content: "git\n"
        dest: "{{ hermes_shadow_runtime_root }}/.install_method"
        owner: root
        group: root
        mode: "0644"

    - name: Disable bundled skill seeding for Hermes profiles
      ansible.builtin.copy:
        content: "managed\n"
        dest: "{{ item.home }}/.no-bundled-skills"
        owner: root
        group: "{{ item.group }}"
        mode: "0440"
      loop: "{{ hermes_shadow_profiles }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Inspect Hermes source origin
      ansible.builtin.command:
        argv:
          - /usr/bin/git
          - -C
          - "{{ hermes_shadow_runtime_root }}"
          - remote
          - get-url
          - origin
      register: hermes_shadow_installed_origin
      changed_when: false

    - name: Inspect Hermes source commit
      ansible.builtin.command:
        argv:
          - /usr/bin/git
          - -C
          - "{{ hermes_shadow_runtime_root }}"
          - rev-parse
          - HEAD
      register: hermes_shadow_installed_commit
      changed_when: false

    - name: Inspect reviewed Hermes release tag object
      ansible.builtin.command:
        argv:
          - /usr/bin/git
          - -C
          - "{{ hermes_shadow_runtime_root }}"
          - rev-parse
          - "refs/tags/{{ hermes_shadow_install_ref }}"
      register: hermes_shadow_installed_tag_object
      changed_when: false

    - name: Resolve reviewed Hermes release tag
      ansible.builtin.command:
        argv:
          - /usr/bin/git
          - -C
          - "{{ hermes_shadow_runtime_root }}"
          - rev-list
          - -n
          - "1"
          - "{{ hermes_shadow_install_ref }}"
      register: hermes_shadow_installed_tag_commit
      changed_when: false

    - name: Inspect Hermes source modifications
      ansible.builtin.command:
        argv:
          - /usr/bin/git
          - -C
          - "{{ hermes_shadow_runtime_root }}"
          - status
          - --porcelain
          - --untracked-files=all
      register: hermes_shadow_installed_status
      changed_when: false

    - name: Require exact Hermes source
      ansible.builtin.assert:
        that:
          - >-
            hermes_shadow_installed_origin.stdout
            == 'https://github.com/NousResearch/hermes-agent.git'
          - >-
            hermes_shadow_installed_commit.stdout
            == hermes_shadow_expected_commit
          - >-
            hermes_shadow_installed_tag_object.stdout
            == hermes_shadow_expected_tag_object
          - >-
            hermes_shadow_installed_tag_commit.stdout
            == hermes_shadow_expected_commit
          - hermes_shadow_installed_status.stdout | length == 0
        fail_msg: >-
          The installed Hermes source origin, tag, commit, or clean-tree state
          differs from the attended release transaction.

    - name: Verify Hermes runtime layout
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ hermes_shadow_runtime_binary }}"
        - "{{ hermes_shadow_runtime_root }}"
      register: hermes_shadow_runtime_layout
      check_mode: false

    - name: Require complete Hermes runtime layout
      ansible.builtin.assert:
        that:
          - >-
            hermes_shadow_runtime_layout.results
            | map(attribute='stat.exists')
            | min
        fail_msg: "The official Hermes root-mode runtime layout is incomplete."

    - name: Deploy Hermes shadow contract
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../{{ hermes_shadow_contract_source }}"
        dest: "{{ hermes_shadow_contract_live }}"
        owner: root
        group: root
        mode: "0644"
        backup: true

    - name: Deploy Hermes shadow contract audit
      ansible.builtin.copy:
        src: >-
          {{ playbook_dir
             }}/../../scripts/agents/hermes-shadow-target-audit.py
        dest: "{{ hermes_shadow_audit_live }}"
        owner: root
        group: root
        mode: "0755"
        backup: true

    - name: Deploy Hermes Discord cutover contract
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../{{ hermes_discord_contract_source }}"
        dest: "{{ hermes_discord_contract_live }}"
        owner: root
        group: root
        mode: "0644"
        backup: true

    - name: Deploy Hermes Discord contract audit
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../{{ hermes_discord_audit_source }}"
        dest: "{{ hermes_discord_audit_live }}"
        owner: root
        group: root
        mode: "0755"
        backup: true

    - name: Deploy Hermes automation contract
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../{{ hermes_automation_contract_source }}"
        dest: "{{ hermes_automation_contract_live }}"
        owner: root
        group: root
        mode: "0644"
        backup: true

    - name: Deploy Hermes automation contract audit
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../{{ hermes_automation_audit_source }}"
        dest: "{{ hermes_automation_audit_live }}"
        owner: root
        group: root
        mode: "0755"
        backup: true

    - name: Deploy pinned Hermes Discord audit sources
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../{{ item }}"
        dest: "/usr/local/share/hermes-shadow/repository/{{ item }}"
        owner: root
        group: root
        mode: "0644"
        backup: true
      loop:
        - files/hermes/shadow-target.json
        - files/hermes/openclaw-state-migration-contract.json
        - files/hermes/discord-regressions.json
        - scripts/agents/openclaw-delivery-cutover-audit.py

    - name: Deploy pinned Hermes automation audit sources
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../{{ item }}"
        dest: "/usr/local/share/hermes-shadow/repository/{{ item }}"
        owner: root
        group: root
        mode: "0644"
        backup: true
      loop:
        - files/hermes/openclaw-state-migration-contract.json
        - files/hermes/discord-cutover-contract.json
        - files/hermes/jobs/rigel-academic-alerts.json
        - files/hermes/automation-regressions.json
        - playbooks/agents/openclaw-health-receiver.yml
        - scripts/agents/openclaw-control-plane-inventory.py

    - name: Validate deployed Hermes shadow contract
      ansible.builtin.command:
        argv:
          - "{{ hermes_shadow_audit_live }}"
          - "{{ hermes_shadow_contract_live }}"
      changed_when: false

    - name: Validate deployed Hermes Discord cutover contract
      ansible.builtin.command:
        argv:
          - "{{ hermes_discord_audit_live }}"
          - "{{ hermes_discord_contract_live }}"
          - --repository-root
          - /usr/local/share/hermes-shadow/repository
      changed_when: false

    - name: Validate deployed Hermes automation contract
      ansible.builtin.command:
        argv:
          - "{{ hermes_automation_audit_live }}"
          - "{{ hermes_automation_contract_live }}"
          - --repository-root
          - /usr/local/share/hermes-shadow/repository
      changed_when: false

    - name: Deploy per-profile Hermes managed policy
      ansible.builtin.template:
        src: >-
          {{ playbook_dir
             }}/../../templates/hermes/hermes-managed-config.yaml.j2
        dest: "/etc/hermes/{{ hermes_profile.name }}/config.yaml"
        owner: root
        group: "{{ hermes_profile.group }}"
        mode: "0440"
        backup: true
      loop: "{{ hermes_shadow_profiles }}"
      loop_control:
        loop_var: hermes_profile
        label: "{{ hermes_profile.name }}"

    - name: Seed mutable Hermes profile config once
      ansible.builtin.copy:
        content: "{}\n"
        dest: "{{ item.home }}/config.yaml"
        owner: "{{ item.user }}"
        group: "{{ item.group }}"
        mode: "0600"
        force: false
      loop: "{{ hermes_shadow_profiles }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Seed root-managed Hermes service environment once
      ansible.builtin.copy:
        content: |
          # Provider credentials are enrolled during an attended gate.
        dest: "/etc/hermes/{{ item.name }}/.env"
        owner: root
        group: "{{ item.group }}"
        mode: "0440"
        force: false
      loop: "{{ hermes_shadow_profiles }}"
      loop_control:
        label: "{{ item.name }}"
      no_log: true

    - name: Read Hermes shadow service environments privately
      ansible.builtin.slurp:
        src: "/etc/hermes/{{ item.name }}/.env"
      loop: "{{ hermes_shadow_profiles }}"
      loop_control:
        label: "{{ item.name }}"
      register: hermes_shadow_service_environments
      no_log: true

    - name: Reject Discord enrollment in Hermes shadow environments
      ansible.builtin.assert:
        that:
          - >-
            not (
              item.content | b64decode
              is search('(?m)^DISCORD_')
            )
        fail_msg: >-
          Hermes shadow service environments cannot contain Discord settings.
      loop: "{{ hermes_shadow_service_environments.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      no_log: true

    - name: Remove profile-local environment files from Hermes shadow
      ansible.builtin.file:
        path: "{{ item.home }}/.env"
        state: absent
      loop: "{{ hermes_shadow_profiles }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Deploy root-owned Hermes identities
      ansible.builtin.copy:
        src: >-
          {{ playbook_dir
             }}/../../files/hermes/profiles/{{ item.name }}/SOUL.md
        dest: "{{ item.home }}/SOUL.md"
        owner: root
        group: "{{ item.group }}"
        mode: "0440"
        backup: true
      loop: "{{ hermes_shadow_profiles }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Deploy root-owned Hermes operating contracts
      ansible.builtin.copy:
        src: >-
          {{ playbook_dir
             }}/../../files/hermes/profiles/{{ item.name }}/AGENTS.md
        dest: "{{ item.home }}/AGENTS.md"
        owner: root
        group: "{{ item.group }}"
        mode: "0440"
        backup: true
      loop: "{{ hermes_shadow_profiles }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Deploy deterministic Rigel academic schedule
      ansible.builtin.copy:
        src: >-
          {{ playbook_dir }}/../../{{ hermes_rigel_schedule_source }}
        dest: /var/lib/hermes/rigel/scripts/hermes-rigel-schedule.py
        owner: root
        group: hermes-rigel
        mode: "0550"
        backup: true

    - name: Deploy paused Rigel academic job declaration
      ansible.builtin.copy:
        src: >-
          {{ playbook_dir
             }}/../../{{ hermes_rigel_schedule_manifest_source }}
        dest: /etc/hermes/rigel/rigel-academic-alerts.json
        owner: root
        group: root
        mode: "0644"
        backup: true

    - name: Deploy Hermes shadow gateway units
      ansible.builtin.template:
        src: >-
          {{ playbook_dir
             }}/../../templates/hermes/hermes-gateway.service.j2
        dest: >-
          /etc/systemd/system/hermes-gateway-{{ hermes_profile.name }}.service
        owner: root
        group: root
        mode: "0644"
        backup: true
      loop: "{{ hermes_shadow_profiles }}"
      loop_control:
        loop_var: hermes_profile
        label: "{{ hermes_profile.name }}"
      register: hermes_shadow_unit_changes

    - name: Reload systemd for Hermes shadow units
      ansible.builtin.systemd_service:
        daemon_reload: true
      when: hermes_shadow_unit_changes.changed

    - name: Remove Hermes readiness markers during bootstrap
      ansible.builtin.file:
        path: "/etc/hermes/{{ item.name }}/.shadow-ready"
        state: absent
      loop: "{{ hermes_shadow_profiles }}"
      loop_control:
        label: "{{ item.name }}"
      when: hermes_shadow_mode == 'bootstrap'

    - name: Remove legacy profile-writable Hermes readiness markers
      ansible.builtin.file:
        path: "{{ item.home }}/.shadow-ready"
        state: absent
      loop: "{{ hermes_shadow_profiles }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Keep Hermes gateways stopped during bootstrap
      ansible.builtin.systemd_service:
        name: "hermes-gateway-{{ item.name }}.service"
        enabled: false
        state: stopped
      loop: "{{ hermes_shadow_profiles }}"
      loop_control:
        label: "{{ item.name }}"
      when: hermes_shadow_mode == 'bootstrap'

    - name: Require explicit approval to start Hermes shadow gateways
      ansible.builtin.assert:
        that:
          - hermes_shadow_start_approved | bool
        fail_msg: >-
          Starting shadow gateways requires an attended provider/config proof.
      when: hermes_shadow_mode == 'shadow'

    - name: Inspect legacy OpenClaw listeners before Hermes start
      ansible.builtin.command:
        argv:
          - ss
          - -H
          - -ltn
      register: hermes_shadow_legacy_listeners
      changed_when: false
      when: hermes_shadow_mode == 'shadow'

    - name: Reject concurrent OpenClaw and Hermes gateways
      ansible.builtin.assert:
        that:
          - >-
            hermes_shadow_legacy_listeners.stdout
            is not search(':(18789|19789|19790)(?:\\s|$)')
        fail_msg: >-
          Stop the production and isolated OpenClaw gateways before starting
          Hermes. Same-host replacement is break-before-make.
      when: hermes_shadow_mode == 'shadow'

    - name: Create Hermes shadow readiness markers
      ansible.builtin.file:
        path: "/etc/hermes/{{ item.name }}/.shadow-ready"
        state: touch
        owner: root
        group: root
        mode: "0600"
      loop: "{{ hermes_shadow_profiles }}"
      loop_control:
        label: "{{ item.name }}"
      when: hermes_shadow_mode == 'shadow'

    - name: Start boot-disabled Hermes shadow gateways
      ansible.builtin.systemd_service:
        name: "hermes-gateway-{{ item.name }}.service"
        enabled: false
        state: started
      loop: "{{ hermes_shadow_profiles }}"
      loop_control:
        label: "{{ item.name }}"
      when: hermes_shadow_mode == 'shadow'
