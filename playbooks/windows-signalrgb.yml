---
- name: Select reachable Windows hosts for SignalRGB automation
  hosts: localhost
  gather_facts: false

  vars:
    windows_reachable_target_group: windows_signalrgb_targets

  tasks:
    - name: Build reachable Windows SignalRGB host group
      ansible.builtin.import_tasks: ../tasks/windows-reachable-hosts.yml

- name: Manage SignalRGB lock and unlock lighting automation
  hosts: windows_signalrgb_targets
  gather_facts: false

  vars:
    signalrgb_actions:
      - task_name: SignalRGB - Lights On On Logon
        description: SignalRGB - Lights On On Logon
        script_name: signalrgb-logon-on.ps1
        trigger_type: logon
        lighting_enabled: true
        close_after_action: false
      - task_name: SignalRGB - Lights Off On Lock
        description: SignalRGB - Lights Off On Lock
        script_name: signalrgb-lock-off.ps1
        trigger_type: session_state_change
        state_change: session_lock
        lighting_enabled: false
        close_after_action: false
      - task_name: SignalRGB - Lights On On Unlock
        description: SignalRGB - Lights On On Unlock
        script_name: signalrgb-unlock-on.ps1
        trigger_type: session_state_change
        state_change: session_unlock
        lighting_enabled: true
        close_after_action: false

  tasks:
    - name: Ensure SignalRGB script directory exists
      ansible.windows.win_file:
        path: "{{ signalrgb_script_dir }}"
        state: directory

    - name: Deploy SignalRGB lock and unlock scripts
      ansible.windows.win_template:
        src: ../templates/signalrgb-lock-state.ps1.j2
        dest: "{{ signalrgb_script_dir }}\\{{ item.script_name }}"
      loop: "{{ signalrgb_actions }}"

    - name: Disable SignalRGB persistent user startup
      ansible.windows.win_regedit:
        path: HKCU:\Software\Microsoft\Windows\CurrentVersion\Run
        name: SignalRgb
        state: absent
      when: signalrgb_disable_persistent_startup | bool

    - name: Register SignalRGB logon, lock, and unlock tasks
      community.windows.win_scheduled_task:
        name: "{{ item.task_name }}"
        description: "{{ item.description }}"
        actions:
          - path: powershell.exe
            arguments: >-
              -NoProfile -WindowStyle Hidden -ExecutionPolicy Bypass
              -File "{{ signalrgb_script_dir }}\{{ item.script_name }}"
        triggers:
          - type: "{{ item.trigger_type }}"
            user_id: "{{ signalrgb_task_user }}"
            state_change: "{{ item.state_change | default(omit) }}"
        username: "{{ signalrgb_task_user }}"
        logon_type: interactive_token
        hidden: true
        enabled: true
        start_when_available: true
        multiple_instances: 3
        disallow_start_if_on_batteries: false
        stop_if_going_on_batteries: false
        execution_time_limit: PT1M
        compatibility: 4
        state: present
      loop: "{{ signalrgb_actions }}"

    - name: Remove legacy SignalRGB script directories
      ansible.windows.win_powershell:
        parameters:
          LegacyScriptDirs: "{{ signalrgb_legacy_script_dirs | default([]) }}"
        script: |
          [CmdletBinding(SupportsShouldProcess)]
          param([string[]]$LegacyScriptDirs)

          $Ansible.Changed = $false
          foreach ($path in $LegacyScriptDirs) {
              if (-not $path) {
                  continue
              }
              if ($path -notlike 'C:\Users\jn\Nextcloud\Scripts\*') {
                  throw "Refusing to remove unexpected legacy script path: $path"
              }
              if (Test-Path -LiteralPath $path) {
                  $Ansible.Changed = $true
                  if (-not $Ansible.CheckMode) {
                      Remove-Item -LiteralPath $path -Recurse -Force
                  }
              }
          }
