# Purpose: Install a disabled-by-default, approval-gated Docker update broker.
# Hosts: docker_hosts.
# Key vars: openclaw_docker_update_broker_*.
# Templates: templates/docker/openclaw-docker-update-manifest.json.j2.
# Scripts: scripts/docker/openclaw-docker-update-broker.py.
# Validation: ansible-playbook
# playbooks/docker/openclaw-docker-update-broker.yml --syntax-check.

---
- name: Configure OpenClaw Docker update broker
  hosts: docker_hosts
  become: true
  gather_facts: false
  serial: 1

  vars:
    openclaw_docker_update_broker_sudoers_path: >-
      /etc/sudoers.d/openclaw-docker-update-broker
    openclaw_docker_update_broker_binary: >-
      /usr/local/sbin/openclaw-docker-update-broker
    openclaw_docker_update_broker_managed_artifacts:
      - "{{ openclaw_docker_update_broker_binary }}"
      - >-
        {{ openclaw_docker_update_broker_home |
           default('/var/lib/openclaw-docker-update-request')
        }}/.ssh/authorized_keys
      - "{{ openclaw_docker_update_broker_sudoers_path }}"
      - >-
        {{ openclaw_docker_update_broker_config_dir
        }}/manifest.json

  tasks:
    - name: Revoke OpenClaw Docker update SSH access when disabled
      ansible.builtin.file:
        path: >-
          {{ openclaw_docker_update_broker_home |
             default('/var/lib/openclaw-docker-update-request')
          }}/.ssh/authorized_keys
        state: absent
      when: not (openclaw_docker_update_broker_enabled | default(false) | bool)

    - name: Revoke OpenClaw Docker update sudo access when disabled
      ansible.builtin.file:
        path: "{{ openclaw_docker_update_broker_sudoers_path }}"
        state: absent
      when: not (openclaw_docker_update_broker_enabled | default(false) | bool)

    - name: Skip hosts without OpenClaw Docker update broker enabled
      ansible.builtin.meta: end_host
      when: not (openclaw_docker_update_broker_enabled | default(false) | bool)

    - name: Require explicit OpenClaw Docker update rollout approval
      ansible.builtin.assert:
        that:
          - >-
            openclaw_docker_update_broker_rollout_approved |
            default(false) | bool
          - >-
            openclaw_docker_update_broker_authorized_keys |
            default([]) | length > 0
          - >-
            openclaw_docker_update_broker_source_cidrs |
            default([]) | length > 0
          - openclaw_docker_update_broker_targets | default({}) | length > 0
        fail_msg: >-
          Enabling the OpenClaw Docker update broker requires explicit rollout
          approval, a dedicated key, exact source CIDRs, and at least one
          reviewed service target.

    - name: Validate dedicated OpenClaw Docker update keys
      ansible.builtin.assert:
        that:
          - item is match('^ssh-ed25519 [A-Za-z0-9+/=]+( [^\r\n]+)?$')
          - item | length <= 1024
        fail_msg: "Only bounded dedicated Ed25519 public keys are accepted."
      loop: "{{ openclaw_docker_update_broker_authorized_keys }}"
      no_log: true

    - name: Validate OpenClaw Docker update source CIDRs
      ansible.builtin.assert:
        that:
          - item is match('^[0-9A-Fa-f:.]+/[0-9]{1,3}$')
          - item | length <= 64
        fail_msg: "Each update source must be an explicit IPv4 or IPv6 CIDR."
      loop: "{{ openclaw_docker_update_broker_source_cidrs }}"

    - name: Parse OpenClaw Docker update source CIDRs exactly
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -c
          - >-
            import ipaddress, sys;
            value = ipaddress.ip_network(sys.argv[1], strict=True);
            raise SystemExit(0 if str(value) == sys.argv[1] else 2)
          - "{{ item }}"
      changed_when: false
      check_mode: false
      loop: "{{ openclaw_docker_update_broker_source_cidrs }}"
      loop_control:
        label: "{{ item }}"

    - name: Inspect prior OpenClaw Docker update broker artifacts
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop: "{{ openclaw_docker_update_broker_managed_artifacts }}"
      register: openclaw_docker_update_broker_prior_artifacts

    - name: Reject symlinked OpenClaw Docker update broker artifacts
      ansible.builtin.assert:
        that:
          - not (item.stat.islnk | default(false))
        fail_msg: >-
          Refusing to replace a symlinked Docker update artifact at
          {{ item.item }}.
      loop: "{{ openclaw_docker_update_broker_prior_artifacts.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.stat.exists | default(false)

    - name: Select prior OpenClaw Docker update artifacts for backup
      ansible.builtin.set_fact:
        openclaw_docker_update_broker_backup_paths: >-
          {{
            openclaw_docker_update_broker_prior_artifacts.results
            | selectattr('stat.exists', 'defined')
            | selectattr('stat.exists')
            | map(attribute='item')
            | list
          }}

    - name: Initialize OpenClaw Docker update backup command
      ansible.builtin.set_fact:
        openclaw_docker_update_broker_backup_argv:
          - /usr/local/sbin/live-rollback-backup
          - --domain
          - openclaw-docker-access
          - --name
          - docker-update-broker-rollout
      when: openclaw_docker_update_broker_backup_paths | length > 0

    - name: Add prior Docker update paths to backup command
      ansible.builtin.set_fact:
        openclaw_docker_update_broker_backup_argv: >-
          {{
            openclaw_docker_update_broker_backup_argv
            + ['--path', item]
          }}
      loop: "{{ openclaw_docker_update_broker_backup_paths }}"
      when: openclaw_docker_update_broker_backup_paths | length > 0

    - name: Verify live rollback storage before Docker update rollout
      ansible.builtin.command:
        argv:
          - /usr/bin/mountpoint
          - -q
          - /srv/live-rollbacks
      changed_when: false
      when:
        - not ansible_check_mode
        - openclaw_docker_update_broker_backup_paths | length > 0

    - name: Back up prior OpenClaw Docker update broker artifacts
      ansible.builtin.command:
        argv: "{{ openclaw_docker_update_broker_backup_argv }}"
      register: openclaw_docker_update_broker_rollout_backup
      changed_when: true
      when:
        - not ansible_check_mode
        - openclaw_docker_update_broker_backup_paths | length > 0

    - name: Validate OpenClaw Docker update target IDs
      ansible.builtin.assert:
        that:
          - item.key is match('^[a-z0-9][a-z0-9_.-]{0,127}$')
          - item.value.projectDir is match('^/opt/[A-Za-z0-9._/-]+$')
          - item.value.composeFiles | length > 0
          - >-
            item.value.composeFiles |
            difference(item.value.backupFiles) | length == 0
          - item.value.service in item.value.recreateServices
          - item.value.service in item.value.verifyServices
          - item.value.recreateServices == [item.value.service]
          - item.value.verifyServices == [item.value.service]
          - item.value.healthTimeoutSeconds | int >= 10
          - item.value.healthTimeoutSeconds | int <= 1800
          - item.value.updateClass == 'stateless-image'
        fail_msg: >-
          Update targets must use an opaque ID, an /opt project, explicit
          Compose/backup files, exactly one recreated and verified service, a
          bounded health timeout, and the stateless-image update class.
      loop: "{{ openclaw_docker_update_broker_targets | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Create OpenClaw Docker update group
      ansible.builtin.group:
        name: "{{ openclaw_docker_update_broker_group }}"
        system: true

    - name: Create OpenClaw Docker update request account
      ansible.builtin.user:
        name: "{{ openclaw_docker_update_broker_user }}"
        group: "{{ openclaw_docker_update_broker_group }}"
        groups: ""
        append: false
        shell: /bin/sh
        system: true
        create_home: false
        home: "{{ openclaw_docker_update_broker_home }}"
        comment: "Forced-command client for approval-gated Docker updates"
        password_lock: true

    - name: Inspect OpenClaw Docker update request account groups
      ansible.builtin.command:
        argv:
          - /usr/bin/id
          - --groups
          - --name
          - "{{ openclaw_docker_update_broker_user }}"
      register: openclaw_docker_update_broker_account_groups
      changed_when: false

    - name: Require isolated OpenClaw Docker update request account groups
      ansible.builtin.assert:
        that:
          - >-
            openclaw_docker_update_broker_account_groups.stdout.split() ==
            [openclaw_docker_update_broker_group]
        fail_msg: >-
          The update-request account has an unexpected supplementary group.

    - name: Create OpenClaw Docker update directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - path: "{{ openclaw_docker_update_broker_home }}"
          owner: root
          group: root
          mode: "0755"
        - path: "{{ openclaw_docker_update_broker_home }}/.ssh"
          owner: root
          group: root
          mode: "0755"
        - path: "{{ openclaw_docker_update_broker_state_dir }}"
          owner: root
          group: root
          mode: "0700"
        - path: "{{ openclaw_docker_update_broker_config_dir }}"
          owner: root
          group: root
          mode: "0700"
        - path: "{{ openclaw_docker_update_broker_config_dir }}/docker-client"
          owner: root
          group: root
          mode: "0700"

    - name: Deploy OpenClaw Docker update broker
      ansible.builtin.copy:
        src: >-
          {{ ansible_config_file | dirname
          }}/scripts/docker/openclaw-docker-update-broker.py
        dest: "{{ openclaw_docker_update_broker_binary }}"
        owner: root
        group: root
        mode: "0755"

    - name: Render root-owned OpenClaw Docker update manifest
      ansible.builtin.template:
        src: >-
          {{ ansible_config_file | dirname
          }}/templates/docker/openclaw-docker-update-manifest.json.j2
        dest: "{{ openclaw_docker_update_broker_config_dir }}/manifest.json"
        owner: root
        group: root
        mode: "0600"

    - name: Install root-owned forced-command update keys
      ansible.builtin.copy:
        dest: "{{ openclaw_docker_update_broker_home }}/.ssh/authorized_keys"
        owner: root
        group: root
        mode: "0644"
        # yamllint disable rule:line-length
        content: |
          {% for key in openclaw_docker_update_broker_authorized_keys %}
          restrict,command="/usr/bin/sudo -n {{ openclaw_docker_update_broker_binary }} request",from="{{ openclaw_docker_update_broker_source_cidrs | join(',') }}" {{ key }}
          {% endfor %}
        # yamllint enable rule:line-length

    - name: Install exact OpenClaw Docker update sudo rule
      ansible.builtin.copy:
        dest: "{{ openclaw_docker_update_broker_sudoers_path }}"
        owner: root
        group: root
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s
        # yamllint disable rule:line-length
        content: |
          Defaults:{{ openclaw_docker_update_broker_user }} !setenv
          Defaults:{{ openclaw_docker_update_broker_user }} secure_path=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          {{ openclaw_docker_update_broker_user }} ALL=(root) NOPASSWD: {{ openclaw_docker_update_broker_binary }} request
        # yamllint enable rule:line-length

    - name: Validate installed OpenClaw Docker update broker
      ansible.builtin.command:
        argv:
          - "{{ openclaw_docker_update_broker_binary }}"
          - validate
      changed_when: false
