# Purpose: Install a disabled-by-default, approval-gated Docker update broker.
# Hosts: docker_hosts.
# Key vars: agent_docker_update_broker_*.
# Templates: templates/docker/agent-docker-update-manifest.json.j2.
# Scripts: scripts/docker/agent-docker-update-broker.py.
# Validation: ansible-playbook
# playbooks/docker/agent-docker-update-broker.yml --syntax-check.

---
- name: Configure Agent Docker update broker
  hosts: docker_hosts
  become: true
  gather_facts: false
  serial: 1

  vars:
    agent_docker_update_broker_user: agent-update
    agent_docker_update_broker_group: agent-update
    agent_docker_update_broker_home: /var/lib/agent-docker-update-request
    agent_docker_update_broker_state_dir: /var/lib/agent-docker-update
    agent_docker_update_broker_config_dir: /etc/agent-docker-update
    agent_docker_update_broker_sudoers_path: >-
      /etc/sudoers.d/agent-docker-update-broker
    agent_docker_update_broker_binary: >-
      /usr/local/sbin/agent-docker-update-broker
    agent_docker_update_broker_managed_artifacts:
      - "{{ agent_docker_update_broker_binary }}"
      - >-
        {{ agent_docker_update_broker_home }}/.ssh/authorized_keys
      - "{{ agent_docker_update_broker_sudoers_path }}"
      - >-
        {{ agent_docker_update_broker_config_dir
        }}/manifest.json
    agent_docker_update_broker_legacy_artifacts:
      - /usr/local/sbin/openclaw-docker-update-broker
      - /var/lib/openclaw-docker-update-request
      - /etc/sudoers.d/openclaw-docker-update-broker
      - /etc/openclaw-docker-update
    agent_docker_update_broker_legacy_state_dir: >-
      /var/lib/openclaw-docker-update
    agent_docker_update_broker_legacy_archive_dir: >-
      /var/lib/agent-docker-update/legacy-openclaw

  tasks:
    - name: Revoke Agent Docker update SSH access when disabled
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ agent_docker_update_broker_home }}/.ssh/authorized_keys"
        - /var/lib/openclaw-docker-update-request/.ssh/authorized_keys
      when: not (agent_docker_update_broker_enabled | default(false) | bool)

    - name: Revoke Agent Docker update sudo access when disabled
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ agent_docker_update_broker_sudoers_path }}"
        - /etc/sudoers.d/openclaw-docker-update-broker
      when: not (agent_docker_update_broker_enabled | default(false) | bool)

    - name: Skip hosts without Agent Docker update broker enabled
      ansible.builtin.meta: end_host
      when: not (agent_docker_update_broker_enabled | default(false) | bool)

    - name: Require explicit Agent Docker update rollout approval
      ansible.builtin.assert:
        that:
          - >-
            agent_docker_update_broker_rollout_approved |
            default(false) | bool
          - >-
            agent_docker_update_broker_authorized_keys |
            default([]) | length > 0
          - >-
            agent_docker_update_broker_source_cidrs |
            default([]) | length > 0
          - agent_docker_update_broker_targets | default({}) | length > 0
        fail_msg: >-
          Enabling the Agent Docker update broker requires explicit rollout
          approval, a dedicated key, exact source CIDRs, and at least one
          reviewed service target.

    - name: Validate dedicated Agent Docker update keys
      ansible.builtin.assert:
        that:
          - item is match('^ssh-ed25519 [A-Za-z0-9+/=]+( [^\r\n]+)?$')
          - item | length <= 1024
        fail_msg: "Only bounded dedicated Ed25519 public keys are accepted."
      loop: "{{ agent_docker_update_broker_authorized_keys }}"
      no_log: true

    - name: Validate Agent Docker update source CIDRs
      ansible.builtin.assert:
        that:
          - item is match('^[0-9A-Fa-f:.]+/[0-9]{1,3}$')
          - item | length <= 64
        fail_msg: "Each update source must be an explicit IPv4 or IPv6 CIDR."
      loop: "{{ agent_docker_update_broker_source_cidrs }}"

    - name: Parse Agent Docker update source CIDRs exactly
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -c
          - >-
            import ipaddress, sys;
            value = ipaddress.ip_network(sys.argv[1], strict=True);
            raise SystemExit(0 if str(value) == sys.argv[1] else 2)
          - "{{ item }}"
      changed_when: false
      check_mode: false
      loop: "{{ agent_docker_update_broker_source_cidrs }}"
      loop_control:
        label: "{{ item }}"

    - name: Inspect prior Agent Docker update broker artifacts
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop: >-
        {{
          agent_docker_update_broker_managed_artifacts
          + agent_docker_update_broker_legacy_artifacts
        }}
      register: agent_docker_update_broker_prior_artifacts

    - name: Reject symlinked Agent Docker update broker artifacts
      ansible.builtin.assert:
        that:
          - not (item.stat.islnk | default(false))
        fail_msg: >-
          Refusing to replace a symlinked Docker update artifact at
          {{ item.item }}.
      loop: "{{ agent_docker_update_broker_prior_artifacts.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.stat.exists | default(false)

    - name: Inspect legacy Agent Docker update transaction state
      ansible.builtin.stat:
        path: "{{ agent_docker_update_broker_legacy_state_dir }}"
        follow: false
      register: agent_docker_update_broker_legacy_state

    - name: Inspect archived legacy Agent Docker update transaction state
      ansible.builtin.stat:
        path: "{{ agent_docker_update_broker_legacy_archive_dir }}"
        follow: false
      register: agent_docker_update_broker_legacy_archive

    - name: Validate legacy Agent Docker update transaction state
      ansible.builtin.assert:
        that:
          - agent_docker_update_broker_legacy_state.stat.isdir
          - not agent_docker_update_broker_legacy_state.stat.islnk
          - agent_docker_update_broker_legacy_state.stat.pw_name == 'root'
          - agent_docker_update_broker_legacy_state.stat.mode == '0700'
          - not agent_docker_update_broker_legacy_archive.stat.exists
        fail_msg: >-
          Legacy transaction state must be a root-owned 0700 directory and the
          archive destination must not already exist.
      when: agent_docker_update_broker_legacy_state.stat.exists

    - name: Select prior Agent Docker update artifacts for backup
      ansible.builtin.set_fact:
        agent_docker_update_broker_backup_paths: >-
          {{
            agent_docker_update_broker_prior_artifacts.results
            | selectattr('stat.exists', 'defined')
            | selectattr('stat.exists')
            | map(attribute='item')
            | list
          }}

    - name: Initialize Agent Docker update backup command
      ansible.builtin.set_fact:
        agent_docker_update_broker_backup_argv:
          - /usr/local/sbin/live-rollback-backup
          - --domain
          - agent-docker-access
          - --name
          - docker-update-broker-rollout
      when: agent_docker_update_broker_backup_paths | length > 0

    - name: Add prior Docker update paths to backup command
      ansible.builtin.set_fact:
        agent_docker_update_broker_backup_argv: >-
          {{
            agent_docker_update_broker_backup_argv
            + ['--path', item]
          }}
      loop: "{{ agent_docker_update_broker_backup_paths }}"
      when: agent_docker_update_broker_backup_paths | length > 0

    - name: Verify live rollback storage before Docker update rollout
      ansible.builtin.command:
        argv:
          - /usr/bin/mountpoint
          - -q
          - /srv/live-rollbacks
      changed_when: false
      when:
        - not ansible_check_mode
        - agent_docker_update_broker_backup_paths | length > 0

    - name: Back up prior Agent Docker update broker artifacts
      ansible.builtin.command:
        argv: "{{ agent_docker_update_broker_backup_argv }}"
      register: agent_docker_update_broker_rollout_backup
      changed_when: true
      when:
        - not ansible_check_mode
        - agent_docker_update_broker_backup_paths | length > 0

    - name: Validate Agent Docker update target IDs
      ansible.builtin.assert:
        that:
          - item.key is match('^[a-z0-9][a-z0-9_.-]{0,127}$')
          - item.value.projectDir is match('^/opt/[A-Za-z0-9._/-]+$')
          - item.value.composeFiles | length > 0
          - >-
            item.value.composeFiles |
            difference(item.value.backupFiles) | length == 0
          - item.value.service in item.value.recreateServices
          - item.value.service in item.value.verifyServices
          - item.value.recreateServices == [item.value.service]
          - item.value.verifyServices == [item.value.service]
          - item.value.healthTimeoutSeconds | int >= 10
          - item.value.healthTimeoutSeconds | int <= 1800
          - item.value.updateClass == 'stateless-image'
        fail_msg: >-
          Update targets must use an opaque ID, an /opt project, explicit
          Compose/backup files, exactly one recreated and verified service, a
          bounded health timeout, and the stateless-image update class.
      loop: "{{ agent_docker_update_broker_targets | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Create Agent Docker update group
      ansible.builtin.group:
        name: "{{ agent_docker_update_broker_group }}"
        system: true

    - name: Create Agent Docker update request account
      ansible.builtin.user:
        name: "{{ agent_docker_update_broker_user }}"
        group: "{{ agent_docker_update_broker_group }}"
        groups: ""
        append: false
        shell: /bin/sh
        system: true
        create_home: false
        home: "{{ agent_docker_update_broker_home }}"
        comment: "Forced-command client for approval-gated Docker updates"
        password_lock: true

    - name: Inspect Agent Docker update request account groups
      ansible.builtin.command:
        argv:
          - /usr/bin/id
          - --groups
          - --name
          - "{{ agent_docker_update_broker_user }}"
      register: agent_docker_update_broker_account_groups
      changed_when: false

    - name: Require isolated Agent Docker update request account groups
      ansible.builtin.assert:
        that:
          - >-
            agent_docker_update_broker_account_groups.stdout.split() ==
            [agent_docker_update_broker_group]
        fail_msg: >-
          The update-request account has an unexpected supplementary group.

    - name: Create Agent Docker update directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - path: "{{ agent_docker_update_broker_home }}"
          owner: root
          group: root
          mode: "0755"
        - path: "{{ agent_docker_update_broker_home }}/.ssh"
          owner: root
          group: root
          mode: "0755"
        - path: "{{ agent_docker_update_broker_state_dir }}"
          owner: root
          group: root
          mode: "0700"
        - path: "{{ agent_docker_update_broker_config_dir }}"
          owner: root
          group: root
          mode: "0700"
        - path: "{{ agent_docker_update_broker_config_dir }}/docker-client"
          owner: root
          group: root
          mode: "0700"

    - name: Deploy Agent Docker update broker
      ansible.builtin.copy:
        src: >-
          {{ ansible_config_file | dirname
          }}/scripts/docker/agent-docker-update-broker.py
        dest: "{{ agent_docker_update_broker_binary }}"
        owner: root
        group: root
        mode: "0755"

    - name: Render root-owned Agent Docker update manifest
      ansible.builtin.template:
        src: >-
          {{ ansible_config_file | dirname
          }}/templates/docker/agent-docker-update-manifest.json.j2
        dest: "{{ agent_docker_update_broker_config_dir }}/manifest.json"
        owner: root
        group: root
        mode: "0600"

    - name: Validate installed Agent Docker update broker
      ansible.builtin.command:
        argv:
          - "{{ agent_docker_update_broker_binary }}"
          - validate
      changed_when: false

    - name: Revoke legacy Agent Docker update access before migration
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /var/lib/openclaw-docker-update-request/.ssh/authorized_keys
        - /etc/sudoers.d/openclaw-docker-update-broker

    - name: Archive legacy Agent Docker update transaction state
      ansible.builtin.command:
        argv:
          - /usr/bin/mv
          - --
          - "{{ agent_docker_update_broker_legacy_state_dir }}"
          - "{{ agent_docker_update_broker_legacy_archive_dir }}"
      changed_when: true
      when:
        - not ansible_check_mode
        - agent_docker_update_broker_legacy_state.stat.exists

    - name: Install exact Agent Docker update sudo rule
      ansible.builtin.copy:
        dest: "{{ agent_docker_update_broker_sudoers_path }}"
        owner: root
        group: root
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s
        # yamllint disable rule:line-length
        content: |
          Defaults:{{ agent_docker_update_broker_user }} !setenv
          Defaults:{{ agent_docker_update_broker_user }} secure_path=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          {{ agent_docker_update_broker_user }} ALL=(root) NOPASSWD: {{ agent_docker_update_broker_binary }} request
        # yamllint enable rule:line-length

    - name: Install root-owned forced-command update keys
      ansible.builtin.copy:
        dest: "{{ agent_docker_update_broker_home }}/.ssh/authorized_keys"
        owner: root
        group: root
        mode: "0644"
        # yamllint disable rule:line-length
        content: |
          {% for key in agent_docker_update_broker_authorized_keys %}
          restrict,command="/usr/bin/sudo -n {{ agent_docker_update_broker_binary }} request",from="{{ agent_docker_update_broker_source_cidrs | join(',') }}" {{ key }}
          {% endfor %}
        # yamllint enable rule:line-length

    - name: Remove validated legacy Agent Docker update artifacts
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ agent_docker_update_broker_legacy_artifacts }}"

    - name: Remove legacy Agent Docker update account
      ansible.builtin.user:
        name: openclaw-update
        state: absent
        remove: false

    - name: Remove legacy Agent Docker update group
      ansible.builtin.group:
        name: openclaw-update
        state: absent
