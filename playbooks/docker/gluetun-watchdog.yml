# Purpose: Configure Gluetun VPN watchdog.
# Hosts: gluetun_hosts:media-vm.
# Key vars: docker_stacks, docker_auto_update_*, gluetun_*, qbit_*.
# Templates: templates/docker, templates/gluetun.
# Scripts: scripts/docker.
# Validation: ansible-playbook playbooks/docker/gluetun-watchdog.yml --syntax-check.

# =============================================================================
# Gluetun Watchdog Playbook - Gluetun recovery and qBittorrent port sync
# =============================================================================
# Gluetun's internal VPN restart (HEALTH_RESTART_VPN=on) doesn't clean up
# tun0 routes properly, causing self-reinforcing crash loops. This watchdog
# detects the loop and does a full container restart to clear stale state.
#
# Usage: ansible-playbook playbooks/docker/gluetun-watchdog.yml
# =============================================================================

- name: Configure Gluetun VPN watchdog
  hosts: gluetun_hosts:media-vm
  become: true
  gather_facts: false

  tasks:
    # --- Disable paths: stop units when features are disabled ---
    - name: Stop and disable gluetun-watchdog timer (disabled hosts)
      ansible.builtin.systemd:
        name: gluetun-watchdog.timer
        enabled: false
        state: stopped
        daemon_reload: true
      when: not (gluetun_watchdog_enabled | default(false))
      failed_when: false

    - name: Stop and disable qbit-port-sync path (disabled hosts)
      ansible.builtin.systemd:
        name: qbit-port-sync.path
        enabled: false
        state: stopped
        daemon_reload: true
      when: not (qbit_port_sync_enabled | default(false))
      failed_when: false

    - name: Stop qbit-port-sync service (disabled hosts)
      ansible.builtin.systemd:
        name: qbit-port-sync.service
        state: stopped
      when: not (qbit_port_sync_enabled | default(false))
      failed_when: false

    - name: Skip hosts without Gluetun automation enabled
      ansible.builtin.meta: end_host
      when:
        - not (gluetun_watchdog_enabled | default(false))
        - not (qbit_port_sync_enabled | default(false))

    - name: Configure enabled Gluetun watchdog
      when: gluetun_watchdog_enabled | default(false)
      block:
        - name: Create state directory for gluetun-watchdog
          ansible.builtin.file:
            path: /var/lib/gluetun-watchdog
            state: directory
            owner: root
            group: root
            mode: "0755"

        - name: Create gluetun-watchdog script
          ansible.builtin.template:
            src: "{{ ansible_config_file | dirname }}/templates/gluetun/gluetun-watchdog.sh.j2"
            dest: /usr/local/sbin/gluetun-watchdog
            mode: "0755"
            owner: root
            group: root
          notify: Reload systemd

        - name: Create gluetun-watchdog.service
          ansible.builtin.copy:
            dest: /etc/systemd/system/gluetun-watchdog.service
            mode: "0644"
            owner: root
            group: root
            content: |
              [Unit]
              Description=Gluetun VPN Health Watchdog
              After=docker.service

              [Service]
              Type=oneshot
              ExecStart=/usr/local/sbin/gluetun-watchdog
              StandardOutput=journal
              StandardError=journal
              TimeoutStartSec=120
          notify: Reload systemd

        - name: Create gluetun-watchdog.timer
          ansible.builtin.copy:
            dest: /etc/systemd/system/gluetun-watchdog.timer
            mode: "0644"
            owner: root
            group: root
            content: |
              [Unit]
              Description=Run Gluetun VPN watchdog periodically

              [Timer]
              OnBootSec={{ gluetun_watchdog_interval | default(60) }}
              OnUnitActiveSec={{ gluetun_watchdog_interval | default(60) }}
              AccuracySec=10

              [Install]
              WantedBy=timers.target
          notify: Reload systemd

        - name: Enable and start gluetun-watchdog timer
          ansible.builtin.systemd:
            name: gluetun-watchdog.timer
            enabled: true
            state: started
            daemon_reload: true

    - name: Configure enabled qBittorrent port sync
      when: qbit_port_sync_enabled | default(false)
      block:
        - name: Create qBittorrent port sync environment
          ansible.builtin.copy:
            dest: "{{ qbit_port_sync_env_file | default('/etc/qbit-port-sync.env') }}"
            mode: "0600"
            owner: root
            group: root
            content: |
              PORT_FILE={{ qbit_port_sync_port_file | default('/opt/media-stack/gluetun/forwarded_port') | quote }}
              QBIT_API={{ qbit_port_sync_api | default('http://localhost:8085/api/v2') | quote }}
              QBIT_USER={{ qbit_port_sync_user | quote }}
              QBIT_PASS={{ qbit_port_sync_password | quote }}
              COMPOSE_DIR={{ qbit_port_sync_compose_dir | default('/opt/media-stack') | quote }}
              QBIT_SERVICE={{ qbit_port_sync_service_name | default('qbittorrent') | quote }}
              LOCK_FILE={{ qbit_port_sync_lock_file | default('/opt/media-stack/qbittorrent/qBittorrent/lockfile') | quote }}
              MAX_RETRIES={{ qbit_port_sync_max_retries | default(30) | quote }}
              RETRY_DELAY={{ qbit_port_sync_retry_delay | default(5) | quote }}
          no_log: true

        - name: Create qBittorrent port sync script
          ansible.builtin.template:
            src: "{{ ansible_config_file | dirname }}/templates/gluetun/qbit-port-sync.sh.j2"
            dest: /usr/local/bin/qbit-port-sync
            mode: "0755"
            owner: root
            group: root
          notify: Reload systemd

        - name: Create qbit-port-sync.service
          ansible.builtin.copy:
            dest: /etc/systemd/system/qbit-port-sync.service
            mode: "0644"
            owner: root
            group: root
            content: |
              [Unit]
              Description=Sync qBittorrent port with Gluetun forwarded port
              After=docker.service
              Requires=docker.service

              [Service]
              Type=oneshot
              ExecStart=/usr/local/bin/qbit-port-sync
              StandardOutput=journal
              StandardError=journal
              TimeoutStartSec=180
          notify: Reload systemd

        - name: Create qbit-port-sync.path
          ansible.builtin.copy:
            dest: /etc/systemd/system/qbit-port-sync.path
            mode: "0644"
            owner: root
            group: root
            content: |
              [Unit]
              Description=Watch for Gluetun forwarded port changes

              [Path]
              PathModified={{ qbit_port_sync_port_file | default('/opt/media-stack/gluetun/forwarded_port') }}
              Unit=qbit-port-sync.service

              [Install]
              WantedBy=multi-user.target
          notify: Reload systemd

        - name: Run qBittorrent port sync once
          ansible.builtin.command: /usr/local/bin/qbit-port-sync
          register: qbit_port_sync_run
          changed_when: "'Successfully updated qBittorrent' in qbit_port_sync_run.stdout"
          when: not ansible_check_mode

        - name: Enable and start qbit-port-sync path
          ansible.builtin.systemd:
            name: qbit-port-sync.path
            enabled: true
            state: started
            daemon_reload: true

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true
