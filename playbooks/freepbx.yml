# =============================================================================
# FreePBX/Asterisk host guardrails
# =============================================================================

- name: Configure FreePBX/Asterisk guardrails
  hosts: freepbx-vm
  become: true
  gather_facts: true

  handlers:
    - name: Restart asterisk
      ansible.builtin.service:
        name: asterisk
        state: restarted

    - name: Restart systemd-journald
      ansible.builtin.service:
        name: systemd-journald
        state: restarted

  tasks:
    - name: Raise Asterisk soft open-file limit from the SysV startup environment
      ansible.builtin.lineinfile:
        path: /etc/default/asterisk
        regexp: "^ulimit -n "
        line: "ulimit -n {{ freepbx_asterisk_nofile_limit | default(65535) }}"
        insertafter: EOF
        owner: root
        group: root
        mode: "0644"
        create: false
      notify: Restart asterisk
      tags: [freepbx, asterisk, limits]

    - name: Manage Asterisk logrotate config with size guardrails
      ansible.builtin.template:
        src: ../templates/freepbx/freepbx-asterisk-logrotate.j2
        dest: /etc/logrotate.d/asterisk
        owner: root
        group: root
        mode: "0644"
      tags: [freepbx, asterisk, logrotate]

    - name: Ensure journald drop-in directory exists
      ansible.builtin.file:
        path: /etc/systemd/journald.conf.d
        state: directory
        owner: root
        group: root
        mode: "0755"
      tags: [freepbx, journald, logging]

    - name: Cap persistent journald storage on FreePBX
      ansible.builtin.copy:
        content: |
          [Journal]
          SystemMaxUse={{ freepbx_journald_system_max_use | default('300M') }}
          SystemKeepFree={{ freepbx_journald_system_keep_free | default('2G') }}
          SystemMaxFileSize={{ freepbx_journald_system_max_file_size | default('64M') }}
          MaxRetentionSec={{ freepbx_journald_max_retention_sec | default('14day') }}
        dest: /etc/systemd/journald.conf.d/50-cc-ansible-limits.conf
        owner: root
        group: root
        mode: "0644"
      notify: Restart systemd-journald
      tags: [freepbx, journald, logging]
