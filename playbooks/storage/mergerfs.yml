# Purpose: Configure MergerFS media pool.
# Hosts: nas_server, gluetun_hosts:media-vm.
# Key vars: smb_shares, nfs_*, filesystem_mounts, mergerfs_*, zfs_*, virtiofs_*, vm_storage_gate_*.
# Templates: templates/storage, templates/samba, templates/proxmox.
# Scripts: scripts/storage.
# Validation: ansible-playbook playbooks/storage/mergerfs.yml --syntax-check.

# =============================================================================
# MergerFS Playbook - Media Pool Configuration
# =============================================================================
# Usage: ansible-playbook playbooks/storage/mergerfs.yml
#        ansible-playbook playbooks/storage/mergerfs.yml --check --diff
# =============================================================================

- name: Configure MergerFS media pool
  hosts: nas_server
  become: true
  gather_facts: true

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

  tasks:
    - name: Skip hosts without mergerfs configured
      ansible.builtin.meta: end_host
      when: mergerfs_branches is not defined

    - name: Install mergerfs
      ansible.builtin.apt:
        name: mergerfs
        state: present
      when: ansible_facts.os_family == "Debian"

    - name: Check mergerfs mount point
      ansible.builtin.command:
        cmd: findmnt -n {{ mergerfs_mount_path }}
      register: mergerfs_mount_check
      changed_when: false
      failed_when: false
      check_mode: false

    # Do not chmod/chown the live mergerfs root when the pool is mounted.
    - name: Create mount point when not mounted
      ansible.builtin.file:
        path: "{{ mergerfs_mount_path }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      when: mergerfs_mount_check.rc != 0

    - name: Check mergerfs branch directories
      ansible.builtin.stat:
        path: "{{ item }}"
      register: mergerfs_branch_dir_stat
      loop: "{{ mergerfs_branches }}"

    - name: Create missing mergerfs branch directories
      ansible.builtin.file:
        path: "{{ item.item }}"
        state: directory
        owner: johnny
        group: smbusers
        mode: "2775"
      loop: "{{ mergerfs_branch_dir_stat.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: not item.stat.exists

    - name: Ensure managed mergerfs branch subdirectories exist
      ansible.builtin.file:
        path: "{{ item.0 }}/{{ item.1.path }}"
        state: directory
        owner: "{{ item.1.owner | default('johnny') }}"
        group: "{{ item.1.group | default('johnny') }}"
        mode: "{{ item.1.mode | default('0775') }}"
      loop: "{{ mergerfs_branches | product(mergerfs_branch_subdirectories | default([])) | list }}"
      loop_control:
        label: "{{ item.0 }}/{{ item.1.path }}"

    - name: Deploy mergerfs systemd mount unit
      ansible.builtin.template:
        src: "{{ ansible_config_file | dirname }}/templates/storage/mergerfs-media.mount.j2"
        dest: "/etc/systemd/system/{{ mergerfs_mount_path | regex_replace('^/', '') | regex_replace('/', '-') }}.mount"
        owner: root
        group: root
        mode: "0644"
      notify: Reload systemd

    - name: Flush handlers
      ansible.builtin.meta: flush_handlers

    - name: Enable and start mergerfs mount
      ansible.builtin.systemd:
        name: "{{ mergerfs_mount_path | regex_replace('^/', '') | regex_replace('/', '-') }}.mount"
        enabled: true
        state: started

    - name: Deploy mergerfs-balance script
      ansible.builtin.copy:
        src: "{{ ansible_config_file | dirname }}/scripts/storage/mergerfs-balance"
        dest: /usr/local/bin/mergerfs-balance
        owner: root
        group: root
        mode: "0755"

    - name: Deploy mergerfs-balance config (default excludes)
      ansible.builtin.template:
        src: "{{ ansible_config_file | dirname }}/templates/storage/mergerfs-balance.conf.j2"
        dest: /etc/mergerfs-balance.conf
        owner: root
        group: root
        mode: "0644"
      when: mergerfs_balance_exclude_paths is defined

    - name: Ensure mergerfs-balance state directory exists
      ansible.builtin.file:
        path: /var/lib/mergerfs-balance
        state: directory
        owner: root
        group: root
        mode: "0755"
      when: mergerfs_balance_schedules | default([]) | length > 0

    - name: Generate mergerfs-balance media stack SSH key
      ansible.builtin.command:
        cmd: >-
          ssh-keygen -t ed25519 -N '' -f
          {{ mergerfs_balance_media_stack_ssh_key_path | default('/root/.ssh/mergerfs_balance_media_stack_ed25519') }}
          -C mergerfs-balance-media-stack
        creates: "{{ mergerfs_balance_media_stack_ssh_key_path | default('/root/.ssh/mergerfs_balance_media_stack_ed25519') }}"
      when: mergerfs_balance_media_stack_control_enabled | default(false)

    - name: Check mergerfs-balance media stack public key
      ansible.builtin.stat:
        path: "{{ mergerfs_balance_media_stack_ssh_key_path | default('/root/.ssh/mergerfs_balance_media_stack_ed25519') }}.pub"
      register: mergerfs_balance_media_stack_public_key_stat
      when: mergerfs_balance_media_stack_control_enabled | default(false)

    - name: Read mergerfs-balance media stack public key
      ansible.builtin.slurp:
        src: "{{ mergerfs_balance_media_stack_ssh_key_path | default('/root/.ssh/mergerfs_balance_media_stack_ed25519') }}.pub"
      register: mergerfs_balance_media_stack_public_key_file
      when:
        - mergerfs_balance_media_stack_control_enabled | default(false)
        - mergerfs_balance_media_stack_public_key_stat.stat.exists | default(false)

    - name: Store mergerfs-balance media stack public key
      ansible.builtin.set_fact:
        mergerfs_balance_media_stack_public_key: >-
          {{ mergerfs_balance_media_stack_public_key_file.content | b64decode | trim }}
      when:
        - mergerfs_balance_media_stack_control_enabled | default(false)
        - mergerfs_balance_media_stack_public_key_file.content is defined

    - name: Deploy mergerfs-balance media stack SSH client
      ansible.builtin.template:
        src: "{{ ansible_config_file | dirname }}/templates/storage/mergerfs-balance-media-stack-client.sh.j2"
        dest: /usr/local/sbin/mergerfs-balance-media-stack
        owner: root
        group: root
        mode: "0755"
      when: mergerfs_balance_media_stack_control_enabled | default(false)

    - name: Deploy scheduled mergerfs-balance services
      ansible.builtin.template:
        src: "{{ ansible_config_file | dirname }}/templates/storage/mergerfs-balance-scheduled.service.j2"
        dest: "/etc/systemd/system/mergerfs-balance-{{ item.name }}.service"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ mergerfs_balance_schedules | default([]) }}"
      loop_control:
        label: "{{ item.name }}"
      when: item.enabled | default(true)
      notify: Reload systemd

    - name: Deploy scheduled mergerfs-balance timers
      ansible.builtin.template:
        src: "{{ ansible_config_file | dirname }}/templates/storage/mergerfs-balance-scheduled.timer.j2"
        dest: "/etc/systemd/system/mergerfs-balance-{{ item.name }}.timer"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ mergerfs_balance_schedules | default([]) }}"
      loop_control:
        label: "{{ item.name }}"
      when: item.enabled | default(true)
      notify: Reload systemd

    - name: Deploy mergerfs-balance media stack restore services
      ansible.builtin.template:
        src: "{{ ansible_config_file | dirname }}/templates/storage/mergerfs-balance-media-stack-restore.service.j2"
        dest: "/etc/systemd/system/mergerfs-balance-{{ item.name }}-media-stack-restore.service"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ mergerfs_balance_schedules | default([]) }}"
      loop_control:
        label: "{{ item.name }}"
      when:
        - item.enabled | default(true)
        - item.pause_media_stack | default(false)
      notify: Reload systemd

    - name: Deploy mergerfs-balance media stack restore timers
      ansible.builtin.template:
        src: "{{ ansible_config_file | dirname }}/templates/storage/mergerfs-balance-media-stack-restore.timer.j2"
        dest: "/etc/systemd/system/mergerfs-balance-{{ item.name }}-media-stack-restore.timer"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ mergerfs_balance_schedules | default([]) }}"
      loop_control:
        label: "{{ item.name }}"
      when:
        - item.enabled | default(true)
        - item.pause_media_stack | default(false)
      notify: Reload systemd

    - name: Flush handlers after scheduled unit deployment
      ansible.builtin.meta: flush_handlers

    - name: Enable scheduled mergerfs-balance timers
      ansible.builtin.systemd:
        name: "mergerfs-balance-{{ item.name }}.timer"
        enabled: true
        state: started
      loop: "{{ mergerfs_balance_schedules | default([]) }}"
      loop_control:
        label: "{{ item.name }}"
      when:
        - item.enabled | default(true)
        - not ansible_check_mode

    - name: Enable mergerfs-balance media stack restore timers
      ansible.builtin.systemd:
        name: "mergerfs-balance-{{ item.name }}-media-stack-restore.timer"
        enabled: true
        state: started
      loop: "{{ mergerfs_balance_schedules | default([]) }}"
      loop_control:
        label: "{{ item.name }}"
      when:
        - item.enabled | default(true)
        - item.pause_media_stack | default(false)
        - not ansible_check_mode

- name: Configure mergerfs-balance media stack control endpoint
  hosts: gluetun_hosts:media-vm
  become: true
  gather_facts: false

  tasks:
    - name: Skip when nas_server did not publish a media stack control key
      ansible.builtin.meta: end_host
      when: >-
        hostvars[groups['nas_server'][0]].mergerfs_balance_media_stack_public_key
        is not defined

    - name: Deploy mergerfs-balance media stack control wrapper
      ansible.builtin.template:
        src: "{{ ansible_config_file | dirname }}/templates/storage/mergerfs-balance-media-stack-control.sh.j2"
        dest: /usr/local/sbin/mergerfs-balance-media-stack-control
        owner: root
        group: root
        mode: "0755"
      when: mergerfs_balance_media_stack_control_enabled | default(false)

    - name: Grant media stack control user read access to compose files
      ansible.posix.acl:
        path: "{{ item.path }}/docker-compose.yml"
        etype: user
        entity: "{{ mergerfs_balance_media_stack_ssh_user | default('johnny') }}"
        permissions: r
        recalculate_mask: mask
        state: present
      loop: "{{ mergerfs_balance_media_stack_compose_targets | default([]) }}"
      loop_control:
        label: "{{ item.path }}/docker-compose.yml"
      when: mergerfs_balance_media_stack_control_enabled | default(false)

    - name: Ensure media stack control ACL mask permits compose read access
      ansible.posix.acl:
        path: "{{ item.path }}/docker-compose.yml"
        etype: mask
        permissions: r
        state: present
      loop: "{{ mergerfs_balance_media_stack_compose_targets | default([]) }}"
      loop_control:
        label: "{{ item.path }}/docker-compose.yml"
      when: mergerfs_balance_media_stack_control_enabled | default(false)

    - name: Authorize mergerfs-balance media stack control key
      ansible.posix.authorized_key:
        user: "{{ mergerfs_balance_media_stack_ssh_user | default('johnny') }}"
        key: "{{ hostvars[groups['nas_server'][0]].mergerfs_balance_media_stack_public_key }}"
        key_options: 'command="/usr/local/sbin/mergerfs-balance-media-stack-control",no-agent-forwarding,no-X11-forwarding,no-port-forwarding,no-pty'
        state: present
      when: mergerfs_balance_media_stack_control_enabled | default(false)

    - name: Remove disabled mergerfs-balance media stack control key
      ansible.posix.authorized_key:
        user: "{{ mergerfs_balance_media_stack_ssh_user | default('johnny') }}"
        key: "{{ hostvars[groups['nas_server'][0]].mergerfs_balance_media_stack_public_key }}"
        state: absent
      when: not (mergerfs_balance_media_stack_control_enabled | default(false))

    - name: Remove disabled mergerfs-balance media stack control wrapper
      ansible.builtin.file:
        path: /usr/local/sbin/mergerfs-balance-media-stack-control
        state: absent
      when: not (mergerfs_balance_media_stack_control_enabled | default(false))
