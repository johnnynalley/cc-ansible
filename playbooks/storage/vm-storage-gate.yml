---
# Purpose: Deploy per-VM storage gate hookscript.
# Hosts: proxmox_nodes.
# Key vars: smb_shares, nfs_*, filesystem_mounts, mergerfs_*, zfs_*, virtiofs_*, vm_storage_gate_*.
# Templates: templates/storage, templates/samba, templates/proxmox.
# Scripts: scripts/storage.
# Validation: ansible-playbook playbooks/storage/vm-storage-gate.yml --syntax-check.

# =============================================================================
# Per-VM Storage Gate
# =============================================================================
# Deploys a Proxmox hookscript that refuses to start a VM/CT until that VM's
# declared host mountpoints are present. Per-VM declarations live in each VM's
# own host_vars (storage.yml) with `vmid` and `required_host_mounts`. The
# playbook aggregates them into a cluster-wide JSON file at
# /etc/pve/wait-for-mounts.json so the gate config travels with the VM during
# a migration.
#
# Usage:
#   ansible-playbook playbooks/storage/vm-storage-gate.yml --check --diff
#   ansible-playbook playbooks/storage/vm-storage-gate.yml
#
# To exempt a VM later: remove `required_host_mounts` from its host_vars and
# manually clear its hookscript with `qm set <vmid> --delete hookscript`.
# =============================================================================

- name: Deploy hookscript binary to every Proxmox node
  hosts: proxmox_nodes
  become: true
  gather_facts: false
  tasks:
    - name: Ensure snippets dir exists
      ansible.builtin.file:
        path: /var/lib/vz/snippets
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Deploy wait-for-mounts.sh hookscript
      ansible.builtin.template:
        src: "{{ ansible_config_file | dirname }}/templates/proxmox/wait-for-mounts.sh.j2"
        dest: /var/lib/vz/snippets/wait-for-mounts.sh
        owner: root
        group: root
        mode: "0755"

# -----------------------------------------------------------------------------
# Cluster-wide gates JSON + per-VM hookscript wiring (run once on any node)
# -----------------------------------------------------------------------------
- name: Reconcile cluster-wide gates JSON and VM hookscripts
  hosts: proxmox_nodes
  become: true
  gather_facts: false
  run_once: true
  vars:
    gated_vms: "{{ groups.get('vms', []) + groups.get('lxcs', []) }}"
  tasks:
    - name: Build gates dict from inventory
      ansible.builtin.set_fact:
        gates_dict: >-
          {{
            dict(
              gated_vms
              | map('extract', hostvars)
              | selectattr('required_host_mounts', 'defined')
              | rejectattr('required_host_mounts', 'equalto', [])
              | map(attribute='vmid')
              | map('string')
              | zip(
                  gated_vms
                  | map('extract', hostvars)
                  | selectattr('required_host_mounts', 'defined')
                  | rejectattr('required_host_mounts', 'equalto', [])
                  | map(attribute='required_host_mounts')
                )
            )
          }}

    - name: Show what we're about to write
      ansible.builtin.debug:
        msg: "Cluster-wide gates: {{ gates_dict }}"

    # pmxcfs (FUSE) does not support atomic rename, so we template to /tmp and
    # then `cp` (not `mv`) to /etc/pve. Same pattern as proxmox-firewall.yml.
    - name: Template gates JSON to temp file
      ansible.builtin.copy:
        content: "{{ gates_dict | to_nice_json }}\n"
        dest: /tmp/wait-for-mounts.json
        owner: root
        group: root
        mode: "0644"

    - name: Copy gates JSON onto pmxcfs
      ansible.builtin.shell: cp /tmp/wait-for-mounts.json /etc/pve/wait-for-mounts.json
      changed_when: true

    - name: Wire hookscript on each gated VM (config in /etc/pve, cluster-wide)
      ansible.builtin.command: >
        qm set {{ item.key }}
        --hookscript local:snippets/wait-for-mounts.sh
      register: qm_set_result
      changed_when: "'update VM' in qm_set_result.stderr"
      loop: "{{ gates_dict | dict2items }}"
      loop_control:
        label: "vmid={{ item.key }} mounts={{ item.value }}"
