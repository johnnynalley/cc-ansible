# Purpose: Configure power management.
# Hosts: linux_hosts.
# Key vars: packages_*, bootstrap_*, auto_updates_*, unattended_upgrades_*, swap_*, sysctl_*, logging_*, smartd_*, apcupsd_*.
# Templates: templates/auto-updates, templates/logging, templates/motd, templates/smartmontools, templates/ups.
# Scripts: scripts/repo/repo-audit for repo checks; otherwise none by default.
# Validation: ansible-playbook playbooks/core/power-management.yml --syntax-check.

# =============================================================================
# Power Management Playbook - Laptop battery optimization
# =============================================================================
# Deploys:
#   - powertop auto-tune at boot (opt-in via powertop_autotune_enabled)
#   - Mask ModemManager for laptops without cellular (opt-in via disable_modem_manager)
#   - Controller AC always-on policy (opt-in via controller_ac_always_on_enabled)
#
# Usage: ansible-playbook playbooks/core/power-management.yml
# =============================================================================

- name: Configure power management
  hosts: linux_hosts
  become: true
  gather_facts: false

  tasks:
    # =========================================================================
    # powertop auto-tune at boot
    # Enables power-saving tunables: USB autosuspend, SATA link PM, audio
    # codec power save, PCIe runtime PM, etc. No performance impact — devices
    # wake instantly when used.
    # =========================================================================
    - name: Create powertop auto-tune systemd service
      ansible.builtin.copy:
        content: |
          # Managed by Ansible - playbooks/core/power-management.yml
          [Unit]
          Description=PowerTOP Auto-Tune
          After=multi-user.target

          [Service]
          Type=oneshot
          ExecStart=/usr/sbin/powertop --auto-tune
          RemainAfterExit=true

          [Install]
          WantedBy=multi-user.target
        dest: /etc/systemd/system/powertop-auto-tune.service
        owner: root
        group: root
        mode: "0644"
      when: powertop_autotune_enabled | default(false)
      notify:
        - Reload systemd
        - Enable powertop auto-tune

    - name: Ensure powertop auto-tune is enabled and started
      ansible.builtin.systemd:
        name: powertop-auto-tune.service
        enabled: true
        state: started
        daemon_reload: true
      when: powertop_autotune_enabled | default(false)

    # =========================================================================
    # Mask ModemManager (for laptops without cellular modems)
    # =========================================================================
    - name: Mask ModemManager
      ansible.builtin.systemd:
        name: ModemManager.service
        masked: true
        state: stopped
      when: disable_modem_manager | default(false)

    # =========================================================================
    # Controller AC always-on policy
    # =========================================================================
    - name: Create logind override directory
      ansible.builtin.file:
        path: /etc/systemd/logind.conf.d
        state: directory
        mode: "0755"
      when: controller_ac_always_on_enabled | default(false)

    - name: Configure logind controller AC policy
      ansible.builtin.copy:
        dest: /etc/systemd/logind.conf.d/99-ansible-controller.conf
        content: |
          # Managed by Ansible - playbooks/core/power-management.yml
          [Login]
          HandleLidSwitchExternalPower=ignore
          HandleLidSwitchDocked=ignore
          IdleAction=ignore
        owner: root
        group: root
        mode: "0644"
      when: controller_ac_always_on_enabled | default(false)
      notify: Restart systemd-logind

    - name: Ensure controller user KDE config directory exists
      ansible.builtin.file:
        path: "/home/{{ controller_ac_always_on_user | default(admin_user | default(ansible_user)) }}/.config"
        state: directory
        owner: "{{ controller_ac_always_on_user | default(admin_user | default(ansible_user)) }}"
        group: "{{ controller_ac_always_on_user | default(admin_user | default(ansible_user)) }}"
        mode: "0755"
      when: controller_ac_always_on_enabled | default(false)

    - name: Disable KDE AC idle suspend for controller user
      community.general.ini_file:
        path: "/home/{{ controller_ac_always_on_user | default(admin_user | default(ansible_user)) }}/.config/powermanagementprofilesrc"
        section: "AC][SuspendSession"
        option: "{{ item.option }}"
        value: "{{ item.value }}"
        owner: "{{ controller_ac_always_on_user | default(admin_user | default(ansible_user)) }}"
        group: "{{ controller_ac_always_on_user | default(admin_user | default(ansible_user)) }}"
        mode: "0644"
        no_extra_spaces: true
      loop:
        - option: idleTime
          value: "0"
        - option: suspendType
          value: "0"
        - option: suspendThenHibernate
          value: "false"
      when: controller_ac_always_on_enabled | default(false)

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Enable powertop auto-tune
      ansible.builtin.systemd:
        name: powertop-auto-tune.service
        enabled: true
        state: started

    - name: Restart systemd-logind
      ansible.builtin.systemd:
        name: systemd-logind.service
        state: restarted
