# Purpose: Configure SMART disk monitoring.
# Hosts: linux_hosts.
# Key vars: packages_*, bootstrap_*, auto_updates_*, unattended_upgrades_*, swap_*, sysctl_*, logging_*, smartd_*, apcupsd_*.
# Templates: templates/auto-updates, templates/logging, templates/motd, templates/smartmontools, templates/ups.
# Scripts: scripts/repo/repo-audit for repo checks; otherwise none by default.
# Validation: ansible-playbook playbooks/core/smartmontools.yml --syntax-check.

# =============================================================================
# Smartmontools Playbook - SMART Disk Monitoring and Alerting
# =============================================================================
# Configures smartd for disk health monitoring with Apprise alerts.
# Targets all physical Linux hosts (VMs/LXCs excluded - virtual disks
# don't expose SMART data; the Proxmox host monitors real drives).
#
# Usage: ansible-playbook playbooks/core/smartmontools.yml
# =============================================================================

- name: Configure SMART disk monitoring
  hosts: linux_hosts
  become: true
  gather_facts: true
  serial: 1

  tasks:
    - name: Skip hosts without smartd enabled
      ansible.builtin.meta: end_host
      when: not (smartd_enabled | default(false))

    - name: Install smartmontools (Debian)
      ansible.builtin.apt:
        name: smartmontools
        state: present
        update_cache: true
        cache_valid_time: 3600
      when: ansible_facts.os_family == "Debian"

    - name: Install smartmontools (Arch)
      community.general.pacman:
        name: smartmontools
        state: present
      when: ansible_facts.os_family == "Archlinux"

    - name: Deploy smartd notification script
      ansible.builtin.template:
        src: ../templates/smartmontools/smartd-notify.sh.j2
        dest: /usr/local/bin/smartd-notify
        owner: root
        group: root
        mode: "0755"
      notify: Restart smartd

    - name: Configure smartd
      ansible.builtin.template:
        src: ../templates/smartmontools/smartd.conf.j2
        dest: /etc/smartd.conf
        owner: root
        group: root
        mode: "0644"
        backup: true
      notify: Restart smartd

    - name: Ensure smartd is enabled and running
      ansible.builtin.systemd:
        name: smartd
        enabled: true
        state: started

  handlers:
    - name: Restart smartd
      ansible.builtin.systemd:
        name: smartd
        state: restarted
