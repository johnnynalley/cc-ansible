# Purpose: Configure centralized logging (Loki + Alloy).
# Hosts: linux_hosts, macos_hosts.
# Key vars: packages_*, bootstrap_*, auto_updates_*, unattended_upgrades_*, swap_*, sysctl_*, logging_*, smartd_*, apcupsd_*.
# Templates: templates/auto-updates, templates/logging, templates/motd, templates/smartmontools, templates/ups.
# Scripts: scripts/repo/repo-audit for repo checks; otherwise none by default.
# Validation: ansible-playbook playbooks/core/logging.yml --syntax-check.

# =============================================================================
# Logging Playbook - Deploy Grafana Alloy log shipping agent
# =============================================================================
# Installs and configures Alloy on all managed hosts to ship logs to Loki.
# Linux: systemd journal + Docker container logs (on docker_hosts)
# macOS: system log files via launchd LaunchAgent
#
# Usage: ansible-playbook playbooks/core/logging.yml
# =============================================================================

# =============================================================================
# Optional desktop coredump recursion guard
# =============================================================================
- name: Guard desktop coredump notification handling
  hosts: linux_hosts
  become: true
  gather_facts: false

  tasks:
    - name: Read installed DrKonqi package version
      ansible.builtin.command:
        argv:
          - /usr/bin/dpkg-query
          - -W
          - "-f=${Version}"
          - drkonqi
      register: drkonqi_installed_version
      changed_when: false
      failed_when: false
      check_mode: false
      when: drkonqi_coredump_recursion_guard | default(false) | bool
      tags: [drkonqi-coredump-guard]

    - name: Require review when the guarded DrKonqi package changes
      ansible.builtin.assert:
        that:
          - drkonqi_installed_version.rc == 0
          - drkonqi_installed_version.stdout == drkonqi_coredump_guard_review_version
        fail_msg: >-
          DrKonqi changed from the reviewed version
          {{ drkonqi_coredump_guard_review_version }} to
          {{ drkonqi_installed_version.stdout | default('unknown', true) }}.
          Check the package changelog and the upstream notification-launcher
          crash before continuing convergence. Remove the recursion guard if
          fixed; otherwise retest it and advance the reviewed version explicitly.
        success_msg: >-
          DrKonqi remains at the reviewed guarded version
          {{ drkonqi_coredump_guard_review_version }}.
      when:
        - drkonqi_coredump_recursion_guard | default(false) | bool
        - drkonqi_coredump_guard_review_version is defined
      tags: [drkonqi-coredump-guard]

    - name: Create DrKonqi user socket override directory
      ansible.builtin.file:
        path: /home/{{ admin_user }}/.config/systemd/user/drkonqi-coredump-launcher.socket.d
        state: directory
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
        mode: "0755"
      when: drkonqi_coredump_recursion_guard | default(false) | bool
      tags: [drkonqi-coredump-guard]

    - name: Limit recursive DrKonqi coredump activations
      ansible.builtin.copy:
        dest: /home/{{ admin_user }}/.config/systemd/user/drkonqi-coredump-launcher.socket.d/recursion-guard.conf
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
        mode: "0644"
        content: |
          [Unit]
          Upholds=

          [Socket]
          TriggerLimitIntervalSec=60s
          TriggerLimitBurst=5
      when: drkonqi_coredump_recursion_guard | default(false) | bool
      tags: [drkonqi-coredump-guard]
      notify: Reload guarded DrKonqi user socket

    - name: Remove DrKonqi coredump recursion guard when disabled
      ansible.builtin.file:
        path: /home/{{ admin_user }}/.config/systemd/user/drkonqi-coredump-launcher.socket.d/recursion-guard.conf
        state: absent
      when:
        - drkonqi_coredump_recursion_guard is defined
        - not (drkonqi_coredump_recursion_guard | bool)
      tags: [drkonqi-coredump-guard]
      notify: Reload guarded DrKonqi user socket

  handlers:
    - name: Reload guarded DrKonqi user socket
      ansible.builtin.shell:
        cmd: |
          uid=$(id -u {{ admin_user }})
          export XDG_RUNTIME_DIR=/run/user/$uid
          export DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$uid/bus
          /usr/bin/timeout 30 /usr/sbin/runuser -u {{ admin_user }} -- systemctl --user daemon-reload
          /usr/bin/timeout 30 /usr/sbin/runuser -u {{ admin_user }} -- systemctl --user restart drkonqi-coredump-launcher.socket
        executable: /bin/bash

# =============================================================================
# Linux hosts (systemd)
# =============================================================================
- name: Deploy Alloy agent (Linux)
  hosts: linux_hosts
  become: true
  gather_facts: true
  serial: 1

  tasks:
    # =========================================================================
    # Disable path
    # =========================================================================
    - name: Stop and disable alloy service (disabled hosts)
      ansible.builtin.systemd:
        name: alloy
        enabled: false
        state: stopped
        daemon_reload: true
      when: not (alloy_enabled | default(true))
      failed_when: false

    - name: Skip hosts with alloy_enabled false
      ansible.builtin.meta: end_host
      when: not (alloy_enabled | default(true))

    # =========================================================================
    # Logrotate guardrails
    # =========================================================================
    - name: Check for cloud-init logrotate snippet
      ansible.builtin.stat:
        path: /etc/logrotate.d/cloud-init
      register: cloud_init_logrotate_snippet
      when: ansible_facts.os_family == "Debian"

    - name: Remove duplicate cloud-init-base logrotate snippet
      ansible.builtin.file:
        path: /etc/logrotate.d/cloud-init-base
        state: absent
      when:
        - ansible_facts.os_family == "Debian"
        - cloud_init_logrotate_snippet.stat.exists | default(false)

    # =========================================================================
    # Debian: Grafana APT repository
    # =========================================================================
    - name: Ensure prereqs for Grafana repo (Debian)
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: true
      when: ansible_facts.os_family == "Debian"

    - name: Ensure keyrings dir exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"
      when: ansible_facts.os_family == "Debian"

    - name: Download Grafana GPG key (Debian)
      ansible.builtin.shell: |
        set -euo pipefail
        url="https://apt.grafana.com/gpg.key"
        dest="/etc/apt/keyrings/grafana.gpg"
        tmp="$(mktemp)"
        curl -fsSL "$url" -o "$tmp"
        cat "$tmp" | gpg --dearmor -o "${tmp}.gpg" 2>/dev/null
        if [ ! -f "$dest" ] || ! cmp -s "${tmp}.gpg" "$dest"; then
          install -m 0644 "${tmp}.gpg" "$dest"
          echo CHANGED
        fi
        rm -f "$tmp" "${tmp}.gpg"
      args:
        executable: /bin/bash
      register: grafana_key_dl
      changed_when: "'CHANGED' in grafana_key_dl.stdout"
      when: ansible_facts.os_family == "Debian"

    - name: Remove legacy Grafana one-line APT repository (Debian)
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/grafana.list
        state: absent
      when: ansible_facts.os_family == "Debian"

    - name: Add Grafana APT repository (Debian)
      ansible.builtin.copy:
        content: |
          Types: deb
          URIs: https://apt.grafana.com
          Suites: stable
          Components: main
          Signed-By: /etc/apt/keyrings/grafana.gpg
        dest: /etc/apt/sources.list.d/grafana.sources
        owner: root
        group: root
        mode: "0644"
      when: ansible_facts.os_family == "Debian"

    - name: Update apt cache after adding repo
      ansible.builtin.apt:
        update_cache: true
      when: ansible_facts.os_family == "Debian"

    - name: Check Alloy package availability (Debian)
      ansible.builtin.command:
        cmd: apt-cache policy alloy
      register: alloy_package_policy
      changed_when: false
      failed_when: false
      check_mode: false
      when: ansible_facts.os_family == "Debian"

    - name: Skip new Debian hosts before Grafana repo exists in check mode
      ansible.builtin.meta: end_host
      when:
        - ansible_check_mode
        - ansible_facts.os_family == "Debian"
        - >-
          "Candidate:" not in alloy_package_policy.stdout
          or "Candidate: (none)" in alloy_package_policy.stdout

    - name: Install alloy package (Debian)
      ansible.builtin.apt:
        name: alloy
        state: present
      when: ansible_facts.os_family == "Debian"

    # =========================================================================
    # Arch: AUR package
    # =========================================================================
    - name: Install alloy from AUR (Arch)
      kewlfft.aur.aur:
        name: alloy-bin
        state: present
      become: true
      become_user: "{{ admin_user }}"
      when: ansible_facts.os_family == "Archlinux"

    # =========================================================================
    # Common: configuration and service
    # =========================================================================
    - name: Add alloy user to systemd-journal group
      ansible.builtin.user:
        name: alloy
        groups: systemd-journal
        append: true
      notify: Restart alloy

    - name: Add alloy user to docker group (Docker hosts)
      ansible.builtin.user:
        name: alloy
        groups: docker
        append: true
      when: inventory_hostname in groups.get('docker_hosts', [])
      notify: Restart alloy

    - name: Ensure Alloy config directory exists
      ansible.builtin.file:
        path: /etc/alloy
        state: directory
        owner: root
        group: alloy
        mode: "0770"

    - name: Deploy Alloy configuration
      ansible.builtin.template:
        src: "{{ ansible_config_file | dirname }}/templates/logging/alloy-config.alloy.j2"
        dest: /etc/alloy/config.alloy
        owner: alloy
        group: alloy
        mode: "0644"
      notify: Restart alloy

    - name: Enable and start alloy service
      ansible.builtin.systemd:
        name: alloy
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    - name: Restart alloy
      ansible.builtin.systemd:
        name: alloy
        state: restarted
        daemon_reload: true


# =============================================================================
# macOS hosts (launchd)
# =============================================================================
- name: Deploy Alloy agent (macOS)
  hosts: macos_hosts
  become: false
  gather_facts: true
  serial: 1

  vars:
    alloy_home: "{{ ansible_facts.env.HOME }}"
    alloy_config_dir: "{{ alloy_home }}/.config/alloy"
    alloy_data_dir: "{{ alloy_home }}/.local/share/alloy"
    alloy_plist: "{{ alloy_home }}/Library/LaunchAgents/com.grafana.alloy.plist"
    alloy_log_dir: "{{ alloy_home }}/Library/Logs"
    alloy_bin: /opt/homebrew/bin/alloy

  tasks:
    # =========================================================================
    # Disable path
    # =========================================================================
    - name: Unload Alloy LaunchAgent (disabled hosts)
      ansible.builtin.command:
        cmd: launchctl unload {{ alloy_plist }}
      when: not (alloy_enabled | default(true))
      failed_when: false
      changed_when: false

    - name: Skip macOS hosts with alloy_enabled false
      ansible.builtin.meta: end_host
      when: not (alloy_enabled | default(true))

    # =========================================================================
    # Install via Homebrew
    # =========================================================================
    - name: Add Grafana Homebrew tap
      community.general.homebrew_tap:
        name: grafana/grafana
        state: present

    - name: Install alloy via Homebrew
      community.general.homebrew:
        name: grafana-alloy
        state: present

    # =========================================================================
    # Configuration
    # =========================================================================
    - name: Create Alloy directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ alloy_config_dir }}"
        - "{{ alloy_data_dir }}"

    - name: Ensure LaunchAgents directory exists
      ansible.builtin.file:
        path: "{{ alloy_home }}/Library/LaunchAgents"
        state: directory
        mode: "0755"

    - name: Deploy Alloy configuration (macOS)
      ansible.builtin.template:
        src: "{{ ansible_config_file | dirname }}/templates/logging/alloy-config.alloy.j2"
        dest: "{{ alloy_config_dir }}/config.alloy"
        mode: "0644"
      register: alloy_config_result

    - name: Create Alloy LaunchAgent plist
      ansible.builtin.copy:
        content: |
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>Label</key>
              <string>com.grafana.alloy</string>
              <key>ProgramArguments</key>
              <array>
                  <string>{{ alloy_bin }}</string>
                  <string>run</string>
                  <string>--storage.path={{ alloy_data_dir }}</string>
                  <string>{{ alloy_config_dir }}/config.alloy</string>
              </array>
              <key>RunAtLoad</key>
              <true/>
              <key>KeepAlive</key>
              <true/>
              <key>StandardOutPath</key>
              <string>{{ alloy_log_dir }}/alloy-stdout.log</string>
              <key>StandardErrorPath</key>
              <string>{{ alloy_log_dir }}/alloy-stderr.log</string>
              <key>EnvironmentVariables</key>
              <dict>
                  <key>PATH</key>
                  <string>/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin</string>
              </dict>
          </dict>
          </plist>
        dest: "{{ alloy_plist }}"
        mode: "0644"
      register: plist_result

    # =========================================================================
    # Load LaunchAgent
    # =========================================================================
    - name: Unload Alloy LaunchAgent (if config or plist changed)
      ansible.builtin.command:
        cmd: launchctl unload {{ alloy_plist }}
      when: alloy_config_result.changed or plist_result.changed
      failed_when: false
      changed_when: false

    - name: Load Alloy LaunchAgent
      ansible.builtin.command:
        cmd: launchctl load {{ alloy_plist }}
      when: alloy_config_result.changed or plist_result.changed
      changed_when: true
