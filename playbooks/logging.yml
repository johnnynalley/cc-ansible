# =============================================================================
# Logging Playbook - Deploy Grafana Alloy log shipping agent
# =============================================================================
# Installs and configures Alloy on all managed hosts to ship logs to Loki.
# Linux: systemd journal + Docker container logs (on docker_hosts)
# macOS: system log files via launchd LaunchAgent
#
# Usage: ansible-playbook playbooks/logging.yml
# =============================================================================

# =============================================================================
# Linux hosts (systemd)
# =============================================================================
- name: Deploy Alloy agent (Linux)
  hosts: linux_hosts
  become: true
  gather_facts: true

  tasks:
    # =========================================================================
    # Disable path
    # =========================================================================
    - name: Stop and disable alloy service (disabled hosts)
      ansible.builtin.systemd:
        name: alloy
        enabled: false
        state: stopped
        daemon_reload: true
      when: not (alloy_enabled | default(true))
      failed_when: false

    - name: Skip hosts with alloy_enabled false
      ansible.builtin.meta: end_host
      when: not (alloy_enabled | default(true))

    # =========================================================================
    # Debian: Grafana APT repository
    # =========================================================================
    - name: Ensure prereqs for Grafana repo (Debian)
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: true
      when: ansible_facts.os_family == "Debian"

    - name: Ensure keyrings dir exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"
      when: ansible_facts.os_family == "Debian"

    - name: Download Grafana GPG key (Debian)
      ansible.builtin.shell: |
        set -euo pipefail
        url="https://apt.grafana.com/gpg.key"
        dest="/etc/apt/keyrings/grafana.gpg"
        tmp="$(mktemp)"
        curl -fsSL "$url" -o "$tmp"
        cat "$tmp" | gpg --dearmor -o "${tmp}.gpg" 2>/dev/null
        if [ ! -f "$dest" ] || ! cmp -s "${tmp}.gpg" "$dest"; then
          install -m 0644 "${tmp}.gpg" "$dest"
          echo CHANGED
        fi
        rm -f "$tmp" "${tmp}.gpg"
      args:
        executable: /bin/bash
      register: grafana_key_dl
      changed_when: "'CHANGED' in grafana_key_dl.stdout"
      when: ansible_facts.os_family == "Debian"

    - name: Add Grafana APT repository (Debian)
      ansible.builtin.apt_repository:
        repo: >-
          deb [signed-by=/etc/apt/keyrings/grafana.gpg]
          https://apt.grafana.com stable main
        filename: grafana
        state: present
      when: ansible_facts.os_family == "Debian"

    - name: Update apt cache after adding repo
      ansible.builtin.apt:
        update_cache: true
      when: ansible_facts.os_family == "Debian"

    - name: Install alloy package (Debian)
      ansible.builtin.apt:
        name: alloy
        state: present
      when: ansible_facts.os_family == "Debian"

    # =========================================================================
    # Arch: AUR package
    # =========================================================================
    - name: Install alloy from AUR (Arch)
      kewlfft.aur.aur:
        name: alloy-bin
        state: present
      become: true
      become_user: "{{ admin_user }}"
      when: ansible_facts.os_family == "Archlinux"

    # =========================================================================
    # Common: configuration and service
    # =========================================================================
    - name: Add alloy user to systemd-journal group
      ansible.builtin.user:
        name: alloy
        groups: systemd-journal
        append: true
      notify: Restart alloy

    - name: Add alloy user to docker group (Docker hosts)
      ansible.builtin.user:
        name: alloy
        groups: docker
        append: true
      when: inventory_hostname in groups.get('docker_hosts', [])
      notify: Restart alloy

    - name: Ensure Alloy config directory exists
      ansible.builtin.file:
        path: /etc/alloy
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Deploy Alloy configuration
      ansible.builtin.template:
        src: ../templates/alloy-config.alloy.j2
        dest: /etc/alloy/config.alloy
        owner: alloy
        group: alloy
        mode: "0644"
      notify: Restart alloy

    - name: Enable and start alloy service
      ansible.builtin.systemd:
        name: alloy
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    - name: Restart alloy
      ansible.builtin.systemd:
        name: alloy
        state: restarted
        daemon_reload: true


# =============================================================================
# macOS hosts (launchd)
# =============================================================================
- name: Deploy Alloy agent (macOS)
  hosts: macos_hosts
  become: false
  gather_facts: true

  vars:
    alloy_config_dir: "{{ ansible_env.HOME }}/.config/alloy"
    alloy_data_dir: "{{ ansible_env.HOME }}/.local/share/alloy"
    alloy_plist: "{{ ansible_env.HOME }}/Library/LaunchAgents/com.grafana.alloy.plist"
    alloy_log_dir: "{{ ansible_env.HOME }}/Library/Logs"
    alloy_bin: /opt/homebrew/bin/alloy

  tasks:
    # =========================================================================
    # Disable path
    # =========================================================================
    - name: Unload Alloy LaunchAgent (disabled hosts)
      ansible.builtin.command:
        cmd: launchctl unload {{ alloy_plist }}
      when: not (alloy_enabled | default(true))
      failed_when: false
      changed_when: false

    - name: Skip macOS hosts with alloy_enabled false
      ansible.builtin.meta: end_host
      when: not (alloy_enabled | default(true))

    # =========================================================================
    # Install via Homebrew
    # =========================================================================
    - name: Add Grafana Homebrew tap
      community.general.homebrew_tap:
        name: grafana/grafana
        state: present

    - name: Install alloy via Homebrew
      community.general.homebrew:
        name: grafana-alloy
        state: present

    # =========================================================================
    # Configuration
    # =========================================================================
    - name: Create Alloy directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ alloy_config_dir }}"
        - "{{ alloy_data_dir }}"

    - name: Ensure LaunchAgents directory exists
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/Library/LaunchAgents"
        state: directory
        mode: "0755"

    - name: Deploy Alloy configuration (macOS)
      ansible.builtin.template:
        src: ../templates/alloy-config.alloy.j2
        dest: "{{ alloy_config_dir }}/config.alloy"
        mode: "0644"
      register: alloy_config_result

    - name: Create Alloy LaunchAgent plist
      ansible.builtin.copy:
        content: |
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>Label</key>
              <string>com.grafana.alloy</string>
              <key>ProgramArguments</key>
              <array>
                  <string>{{ alloy_bin }}</string>
                  <string>run</string>
                  <string>--storage.path={{ alloy_data_dir }}</string>
                  <string>{{ alloy_config_dir }}/config.alloy</string>
              </array>
              <key>RunAtLoad</key>
              <true/>
              <key>KeepAlive</key>
              <true/>
              <key>StandardOutPath</key>
              <string>{{ alloy_log_dir }}/alloy-stdout.log</string>
              <key>StandardErrorPath</key>
              <string>{{ alloy_log_dir }}/alloy-stderr.log</string>
              <key>EnvironmentVariables</key>
              <dict>
                  <key>PATH</key>
                  <string>/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin</string>
              </dict>
          </dict>
          </plist>
        dest: "{{ alloy_plist }}"
        mode: "0644"
      register: plist_result

    # =========================================================================
    # Load LaunchAgent
    # =========================================================================
    - name: Unload Alloy LaunchAgent (if config or plist changed)
      ansible.builtin.command:
        cmd: launchctl unload {{ alloy_plist }}
      when: alloy_config_result.changed or plist_result.changed
      failed_when: false
      changed_when: false

    - name: Load Alloy LaunchAgent
      ansible.builtin.command:
        cmd: launchctl load {{ alloy_plist }}
      when: alloy_config_result.changed or plist_result.changed
      changed_when: true
