---
# Purpose: Retire legacy SignalRGB session-state automation and keep normal
#   startup.
# Hosts: localhost, windows_signalrgb_targets.
# Key vars: signalrgb_*.
# Templates: none.
# Scripts: none.
# Validation:
#   ansible-playbook playbooks/windows/windows-signalrgb.yml --syntax-check.

- name: Select reachable Windows hosts for SignalRGB cleanup
  hosts: localhost
  gather_facts: false

  vars:
    windows_reachable_target_group: windows_signalrgb_targets

  tasks:
    - name: Build reachable Windows SignalRGB host group
      ansible.builtin.import_tasks: ../../tasks/windows-reachable-hosts.yml

- name: Retire legacy SignalRGB lock and unlock lighting automation
  hosts: windows_signalrgb_targets
  gather_facts: false

  tasks:
    - name: Inspect the installed SignalRGB launcher
      ansible.windows.win_stat:
        path: "{{ signalrgb_launcher_path }}"
      register: signalrgb_launcher

    - name: Require the normal SignalRGB launcher before retiring automation
      ansible.builtin.assert:
        that:
          - signalrgb_launcher.stat.exists | default(false)
          - signalrgb_launcher.stat.isreg | default(false)
        fail_msg: >-
          Refusing to remove the legacy SignalRGB startup task because the
          normal launcher is missing or is not a regular file at
          {{ signalrgb_launcher_path }}.

    - name: Remove legacy SignalRGB logon, lock, and unlock tasks
      community.windows.win_scheduled_task:
        name: "{{ item }}"
        state: absent
      loop: "{{ signalrgb_legacy_task_names }}"

    - name: Remove legacy SignalRGB lock automation scripts
      ansible.windows.win_file:
        path: "{{ signalrgb_script_dir }}"
        state: absent

    - name: Restore ordinary SignalRGB user startup
      ansible.windows.win_regedit:
        path: HKCU:\Software\Microsoft\Windows\CurrentVersion\Run
        name: SignalRgb
        data: "{{ signalrgb_startup_command }}"
        type: string
        state: present

    - name: Read back ordinary SignalRGB user startup
      ansible.windows.win_reg_stat:
        path: HKCU:\Software\Microsoft\Windows\CurrentVersion\Run
        name: SignalRgb
      register: signalrgb_startup
      when: not ansible_check_mode

    - name: Verify ordinary SignalRGB user startup
      ansible.builtin.assert:
        that:
          - signalrgb_startup.exists | default(false)
          - signalrgb_startup.value == signalrgb_startup_command
        fail_msg: SignalRGB ordinary user startup was not restored exactly.
      when: not ansible_check_mode
