---
# =============================================================================
# Cloudflare DDNS
# =============================================================================
# Purpose: Configure DNS-only Cloudflare DDNS records.
# Hosts: cloudflare_ddns_hosts
# Key vars: cloudflare_ddns_*
# Templates: templates/network/cloudflare-ddns-update.sh.j2
# Validation:
#   ansible-playbook playbooks/network/cloudflare-ddns.yml --syntax-check
# =============================================================================

- name: Configure Cloudflare DDNS updaters
  hosts: cloudflare_ddns_hosts
  become: true
  gather_facts: true

  tasks:
    - name: Skip hosts without Cloudflare DDNS opt-in
      ansible.builtin.debug:
        msg: "Cloudflare DDNS is not enabled for this host."
      when: not (cloudflare_ddns_enabled | default(false) | bool)

    - name: Configure opted-in Cloudflare DDNS updater
      when: cloudflare_ddns_enabled | default(false) | bool
      block:
        - name: Validate Cloudflare DDNS settings
          ansible.builtin.assert:
            that:
              - ansible_facts.os_family == "Debian"
              - cloudflare_ddns_name is defined
              - >-
                cloudflare_ddns_name is
                match('^[a-z0-9][a-z0-9-]*[a-z0-9]$')
              - cloudflare_ddns_zone is defined
              - cloudflare_ddns_zone | length > 0
              - cloudflare_ddns_record is defined
              - cloudflare_ddns_record | length > 0
              - cloudflare_ddns_env_file is defined
              - cloudflare_ddns_env_file is match('^/etc/')
            fail_msg: >-
              Cloudflare DDNS requires a Debian-family host, a safe
              cloudflare_ddns_name, cloudflare_ddns_zone,
              cloudflare_ddns_record, and an /etc/
              cloudflare_ddns_env_file.

        - name: Define Cloudflare DDNS derived paths
          ansible.builtin.set_fact:
            cloudflare_ddns_unit_name: >-
              cloudflare-ddns-{{ cloudflare_ddns_name }}
            cloudflare_ddns_script_path: >-
              /usr/local/sbin/cloudflare-ddns-{{ cloudflare_ddns_name }}
            cloudflare_ddns_state_dir: >-
              {{ cloudflare_ddns_state_dir
                 | default('/var/lib/cloudflare-ddns') }}
            cloudflare_ddns_service_unit_path: >-
              /etc/systemd/system/cloudflare-ddns-{{ cloudflare_ddns_name
              }}.service
            cloudflare_ddns_timer_unit_path: >-
              /etc/systemd/system/cloudflare-ddns-{{ cloudflare_ddns_name
              }}.timer
            cloudflare_ddns_token_variable_effective: >-
              {{ cloudflare_ddns_token_variable
                 | default('CLOUDFLARE_DDNS_API_TOKEN') }}
            cloudflare_ddns_on_boot_sec_effective: >-
              {{ cloudflare_ddns_on_boot_sec | default('2min') }}
            cloudflare_ddns_on_unit_active_sec_effective: >-
              {{ cloudflare_ddns_on_unit_active_sec | default('10min') }}
            cloudflare_ddns_jitter_sec_effective: >-
              {{ cloudflare_ddns_randomized_delay_sec | default('60s') }}

        - name: Select Cloudflare DDNS token from inventory or vault
          ansible.builtin.set_fact:
            cloudflare_ddns_effective_api_token: >-
              {{
                cloudflare_ddns_api_token
                | default(vault_cloudflare_ddns_api_token | default(''))
              }}
          no_log: true

        - name: Ensure Cloudflare DDNS packages are installed
          ansible.builtin.apt:
            name:
              - ca-certificates
              - curl
              - jq
            state: present
            update_cache: true

        - name: Ensure Cloudflare DDNS state directory exists
          ansible.builtin.file:
            path: "{{ cloudflare_ddns_state_dir }}"
            state: directory
            owner: root
            group: root
            mode: "0755"

        - name: Manage Cloudflare DDNS token env file from vault
          ansible.builtin.copy:
            dest: "{{ cloudflare_ddns_env_file }}"
            owner: root
            group: root
            mode: "0600"
            content: |
              {{ cloudflare_ddns_token_variable_effective }}={{
                cloudflare_ddns_effective_api_token | quote
              }}
          no_log: true
          when:
            - (cloudflare_ddns_effective_api_token | default('') | length) > 0

        - name: Check Cloudflare DDNS token env file
          ansible.builtin.stat:
            path: "{{ cloudflare_ddns_env_file }}"
          register: cloudflare_ddns_token_env

        - name: Deploy Cloudflare DDNS updater script
          ansible.builtin.template:
            src: >-
              {{ ansible_config_file | dirname
              }}/templates/network/cloudflare-ddns-update.sh.j2
            dest: "{{ cloudflare_ddns_script_path }}"
            owner: root
            group: root
            mode: "0755"

        - name: Deploy Cloudflare DDNS service unit
          ansible.builtin.copy:
            dest: "{{ cloudflare_ddns_service_unit_path }}"
            owner: root
            group: root
            mode: "0644"
            content: |
              [Unit]
              Description=Cloudflare DDNS {{ cloudflare_ddns_record }}
              Wants=network-online.target
              After=network-online.target

              [Service]
              Type=oneshot
              EnvironmentFile=-{{ cloudflare_ddns_env_file }}
              ExecStart={{ cloudflare_ddns_script_path }}
              NoNewPrivileges=true
              PrivateDevices=true
              PrivateTmp=true
              ProtectClock=true
              ProtectControlGroups=true
              ProtectHome=true
              ProtectHostname=true
              ProtectKernelLogs=true
              ProtectKernelModules=true
              ProtectKernelTunables=true
              ProtectSystem=strict
              ReadWritePaths={{ cloudflare_ddns_state_dir }}
              RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
              StateDirectory=cloudflare-ddns
              SystemCallArchitectures=native
          register: cloudflare_ddns_service_unit

        - name: Deploy Cloudflare DDNS timer unit
          ansible.builtin.copy:
            dest: "{{ cloudflare_ddns_timer_unit_path }}"
            owner: root
            group: root
            mode: "0644"
            content: |
              [Unit]
              Description=Cloudflare DDNS timer for {{ cloudflare_ddns_record }}

              [Timer]
              OnBootSec={{ cloudflare_ddns_on_boot_sec_effective }}
              OnUnitActiveSec={{ cloudflare_ddns_on_unit_active_sec_effective }}
              RandomizedDelaySec={{ cloudflare_ddns_jitter_sec_effective }}
              Persistent=true
              Unit={{ cloudflare_ddns_unit_name }}.service

              [Install]
              WantedBy=timers.target
          register: cloudflare_ddns_timer_unit

        - name: Reload systemd for Cloudflare DDNS units
          ansible.builtin.systemd:
            daemon_reload: true
          when:
            - not ansible_check_mode
            - >-
              cloudflare_ddns_service_unit.changed
              or cloudflare_ddns_timer_unit.changed

        - name: Decide whether Cloudflare DDNS timer can run
          ansible.builtin.set_fact:
            cloudflare_ddns_timer_should_run: >-
              {{
                (cloudflare_ddns_timer_enabled | default(true) | bool)
                and (cloudflare_ddns_token_env.stat.exists | default(false))
              }}

        - name: Report missing Cloudflare DDNS token env file
          ansible.builtin.debug:
            msg: >-
              {{ cloudflare_ddns_unit_name }} is deployed, but its timer is
              skipped until {{ cloudflare_ddns_env_file }} exists with
              {{ cloudflare_ddns_token_variable_effective }}.
          when: not (cloudflare_ddns_token_env.stat.exists | default(false))

        - name: Configure Cloudflare DDNS timer state
          ansible.builtin.systemd:
            name: "{{ cloudflare_ddns_unit_name }}.timer"
            enabled: "{{ cloudflare_ddns_timer_should_run }}"
            state: >-
              {{
                cloudflare_ddns_timer_should_run
                | ternary('started', 'stopped')
              }}
          when: not ansible_check_mode

        - name: Run Cloudflare DDNS update once after deploy
          ansible.builtin.systemd:
            name: "{{ cloudflare_ddns_unit_name }}.service"
            state: started
          when:
            - cloudflare_ddns_timer_should_run | bool
            - cloudflare_ddns_run_on_deploy | default(true) | bool
            - not ansible_check_mode
