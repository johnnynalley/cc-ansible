---
# =============================================================================
# Sysctl Playbook - Kernel runtime tuning
# =============================================================================
# Usage: ansible-playbook playbooks/sysctl.yml
# =============================================================================

- name: Configure Proxmox sysctl settings
  hosts: proxmox_nodes
  become: true
  gather_facts: false

  tasks:
    - name: Apply Proxmox sysctl settings
      ansible.posix.sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value | string }}"
        sysctl_file: /etc/sysctl.d/99-ansible.conf
        sysctl_set: true
        reload: true
        state: present
      loop: "{{ proxmox_sysctl_settings | default({}) | dict2items }}"
      loop_control:
        label: "{{ item.key }}={{ item.value }}"
      when: proxmox_sysctl_settings is defined
