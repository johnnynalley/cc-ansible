# Purpose: Configure local restic backups (ts440 ZFS).
# Hosts: backup_clients:!macos_hosts, ts440.
# Key vars: restic_*, local_restic_*, rclone_sync_*, git_sync_*, nextcloud_scan_*.
# Templates: templates/storage, templates/docker when sync jobs consume generated configs.
# Scripts: none by default.
# Validation: ansible-playbook playbooks/backup-sync/local-restic.yml --syntax-check.

# =============================================================================
# Local Restic Backup Playbook - Backups to ts440 ZFS
# =============================================================================
# Usage: ansible-playbook playbooks/backup-sync/local-restic.yml
# =============================================================================

- name: Configure local restic backups to ts440 ZFS
  hosts: backup_clients:!macos_hosts
  become: true
  gather_facts: false
  serial: 1

  vars:
    local_restic_env_file: /etc/restic/local-backup.env
    local_restic_script: /usr/local/sbin/restic-local-backup
    local_restic_ssh_key: /etc/restic/backup_key
    local_restic_cache_dir: /var/cache/restic-local
    local_restic_retry_interval_effective: >-
      {{ local_restic_retry_start_limit_interval | default('30min') }}
    local_restic_retry_burst_effective: >-
      {{ local_restic_retry_start_limit_burst | default(3) }}
    hermes_disaster_recovery_script: /usr/local/libexec/hermes-disaster-recovery-stage

  tasks:
    # =========================================================================
    # Skip hosts without local_restic_enabled
    # =========================================================================
    - name: Stop and disable restic-local-backup timer (disabled hosts)
      ansible.builtin.systemd:
        name: restic-local-backup.timer
        enabled: false
        state: stopped
        daemon_reload: true
      when: not (local_restic_enabled | default(false))
      failed_when: false
      ignore_unreachable: true

    - name: Check if local restic is enabled
      ansible.builtin.meta: end_host
      when: not (local_restic_enabled | default(false))

    - name: Gather facts for local restic clients
      ansible.builtin.setup:

    # =========================================================================
    # Install restic (if not already installed by B2 playbook)
    # =========================================================================
    - name: Install restic (Debian)
      ansible.builtin.apt:
        name: restic
        state: present
        update_cache: true
      when: ansible_facts.os_family == "Debian"
      tags: [install]

    - name: Install restic (Arch)
      community.general.pacman:
        name: restic
        state: present
      when: ansible_facts.os_family == "Archlinux"
      tags: [install]

    # =========================================================================
    # Create directories
    # =========================================================================
    - name: Create /etc/restic directory
      ansible.builtin.file:
        path: /etc/restic
        state: directory
        owner: root
        group: root
        mode: "0700"
      tags: [config]

    - name: Create local restic cache directory
      ansible.builtin.file:
        path: "{{ local_restic_cache_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
      tags: [config]

    - name: Install Hermes disaster-recovery staging helper
      ansible.builtin.copy:
        src: ../../scripts/agents/hermes-disaster-recovery-stage.py
        dest: "{{ hermes_disaster_recovery_script }}"
        owner: root
        group: root
        mode: "0700"
      when: hermes_disaster_recovery_enabled | default(false)
      tags: [config, script]

    - name: Create private Hermes disaster-recovery staging root
      ansible.builtin.file:
        path: /var/backups/hermes-disaster-recovery
        state: directory
        owner: root
        group: root
        mode: "0700"
      when: hermes_disaster_recovery_enabled | default(false)
      tags: [config]

    # =========================================================================
    # SSH key for SFTP access to ts440
    # =========================================================================
    - name: Install SSH private key for backup
      ansible.builtin.copy:
        content: "{{ local_restic_ssh_private_key }}"
        dest: "{{ local_restic_ssh_key }}"
        owner: root
        group: root
        mode: "0600"
      no_log: true
      tags: [ssh]

    - name: Create SSH config for backup host
      ansible.builtin.blockinfile:
        path: /root/.ssh/config
        create: true
        owner: root
        group: root
        mode: "0600"
        marker: "# {mark} ANSIBLE MANAGED - restic backup to ts440"
        block: |
          Host {{ local_restic_target_host }}
            IdentityFile {{ local_restic_ssh_key }}
            StrictHostKeyChecking accept-new
            UserKnownHostsFile /root/.ssh/known_hosts
      tags: [ssh]

    # =========================================================================
    # Environment file
    # =========================================================================
    - name: Create local restic environment file
      ansible.builtin.copy:
        content: |
          # Local restic backup configuration
          # Managed by Ansible - do not edit manually

          # Repository location (SFTP to ts440)
          RESTIC_REPOSITORY={{ local_restic_repository }}

          # Repository password (same as B2 for consistency)
          RESTIC_PASSWORD={{ restic_password }}

          # Cache directory
          RESTIC_CACHE_DIR={{ local_restic_cache_dir }}
        dest: "{{ local_restic_env_file }}"
        owner: root
        group: root
        mode: "0600"
      no_log: true
      tags: [config]

    # =========================================================================
    # Initialize repository (idempotent)
    # =========================================================================
    - name: Check if local restic repo exists
      ansible.builtin.shell: |
        set -a; . {{ local_restic_env_file }}; set +a
        restic --no-lock cat config > /dev/null 2>&1
      args:
        executable: /bin/bash
      register: local_restic_repo_check
      changed_when: false
      failed_when: false
      tags: [init]

    - name: Initialize local restic repository
      ansible.builtin.shell: |
        set -a; . {{ local_restic_env_file }}; set +a
        restic init
      args:
        executable: /bin/bash
      register: local_restic_init
      changed_when: local_restic_init.rc == 0
      failed_when:
        - local_restic_init.rc != 0
        - "'config file already exists' not in local_restic_init.stderr"
      when: local_restic_repo_check.rc != 0
      tags: [init]

    # =========================================================================
    # Backup script
    # =========================================================================
    - name: Build local backup paths list
      ansible.builtin.set_fact:
        local_restic_all_paths: "{{ local_restic_backup_paths | default(['/opt']) }}"
      tags: [script]

    - name: Build local backup excludes list
      ansible.builtin.set_fact:
        local_restic_all_excludes: >-
          {{
            (restic_excludes | default([]))
            + (restic_excludes_extra | default([]))
            + (local_restic_excludes | default([]))
            + (local_restic_excludes_extra | default([]))
          }}
      tags: [script]

    - name: Create local restic backup script
      ansible.builtin.copy:
        content: |
          #!/bin/bash
          set -euo pipefail

          LOG_TAG="restic-local-backup"
          log() { logger -t "$LOG_TAG" "$*"; echo "$*"; }

          # Load environment
          set -a
          source {{ local_restic_env_file }}
          set +a

          # Ensure HOME is set for restic
          export HOME=/root

          log "Starting local backup for {{ inventory_hostname }}..."

          {% if hermes_disaster_recovery_enabled | default(false) %}
          record_hermes_backup_failure() {
            rc=$?
            if (( rc != 0 )); then
              {{ hermes_disaster_recovery_script }} status \
                --result failed --phase restic --exit-code "$rc" || true
            fi
          }
          trap record_hermes_backup_failure EXIT

          log "Staging application-consistent Hermes recovery artifacts..."
          {{ hermes_disaster_recovery_script }} stage
          {{ hermes_disaster_recovery_script }} verify

          {% endif -%}

          {% if local_restic_run_retention | default(true) %}
          # Clear locks whose owning process/host is no longer active. Restic
          # preserves live locks, so this prevents an interrupted backup from
          # blocking every later hourly run indefinitely.
          log "Removing stale repository locks..."
          restic unlock

          {% endif %}
          # Run backup
          restic --cleanup-cache --retry-lock 15m backup \
            --verbose \
            --tag "{{ inventory_hostname }}" \
            --tag "local" \
          {% for exclude in local_restic_all_excludes %}
            --exclude "{{ exclude }}" \
          {% endfor %}
          {% for path in local_restic_all_paths %}
            "{{ path }}" \
          {% endfor %}

          {% if local_restic_run_retention | default(true) %}
          log "Backup complete. Running retention policy..."

          # Apply retention policy
          restic forget \
            --verbose \
            --prune \
            --keep-hourly {{ local_restic_retention.keep_hourly }} \
            --keep-daily {{ local_restic_retention.keep_daily }} \
            --keep-weekly {{ local_restic_retention.keep_weekly }} \
            --keep-monthly {{ local_restic_retention.keep_monthly }}

          log "Local backup and maintenance complete"
          {% else %}
          log "Backup complete. Skipping client-side retention for append-only repository."
          {% endif %}
          {% if hermes_disaster_recovery_enabled | default(false) %}

          {{ hermes_disaster_recovery_script }} status \
            --result ok --phase complete --exit-code 0
          trap - EXIT
          {% endif %}
        dest: "{{ local_restic_script }}"
        owner: root
        group: root
        mode: "0700"
      tags: [script]

    # =========================================================================
    # Systemd service and timer (hourly)
    # =========================================================================
    - name: Create restic-local-backup systemd service
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=Restic Local Backup to ts440 ZFS
          After=network-online.target
          Wants=network-online.target
          {% if local_restic_retry_on_failure | default(false) %}
          StartLimitIntervalSec={{ local_restic_retry_interval_effective }}
          StartLimitBurst={{ local_restic_retry_burst_effective }}
          {% endif %}
          {% if restic_require_ac_power | default(false) %}
          ConditionACPower=true
          {% endif %}

          [Service]
          Type=oneshot
          ExecStart={{ local_restic_script }}
          StandardOutput=journal
          StandardError=journal

          # Run as root
          User=root

          # Environment for restic
          Environment=HOME=/root
          Environment=RESTIC_CACHE_DIR={{ local_restic_cache_dir }}
          {% if local_restic_retry_on_failure | default(false) %}

          # Retry bounded transient target outages instead of waiting an hour.
          Restart=on-failure
          RestartSec={{ local_restic_retry_seconds | default('5min') }}
          {% endif %}

          # Resource limits
          Nice=19
          IOSchedulingClass=idle

          # Timeout (1 hour should be plenty for local backups)
          TimeoutStartSec=3600
        dest: /etc/systemd/system/restic-local-backup.service
        owner: root
        group: root
        mode: "0644"
      notify: Reload systemd
      tags: [systemd]

    - name: Create restic-local-backup systemd timer (hourly)
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=Hourly local restic backup timer

          [Timer]
          OnCalendar=hourly
          RandomizedDelaySec=5m
          Persistent=true

          [Install]
          WantedBy=timers.target
        dest: /etc/systemd/system/restic-local-backup.timer
        owner: root
        group: root
        mode: "0644"
      notify:
        - Reload systemd
        - Enable local restic timer
      tags: [systemd]

    - name: Ensure restic-local-backup timer is enabled and started
      ansible.builtin.systemd:
        name: restic-local-backup.timer
        enabled: true
        state: started
        daemon_reload: true
      when: not ansible_check_mode
      tags: [systemd]

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Enable local restic timer
      ansible.builtin.systemd:
        name: restic-local-backup.timer
        enabled: true
        state: started
      when: not ansible_check_mode


# =============================================================================
# Install public key on ts440 (backup target)
# =============================================================================
- name: Configure ts440 to accept backup connections
  hosts: ts440
  become: true
  gather_facts: false

  vars:
    local_restic_freshness_checker: /usr/local/libexec/restic-snapshot-freshness
    local_restic_freshness_config_dir: /etc/restic-snapshot-freshness
    local_restic_freshness_cache_root: /var/cache/restic-snapshot-freshness
    local_restic_freshness_state_root: /var/lib/restic-snapshot-freshness
    local_restic_freshness_runner: /usr/local/sbin/restic-snapshot-freshness-monitor
    local_restic_freshness_state_markers:
      - unhealthy
      - last-alert

  tasks:
    - name: Ensure backup public key is authorized
      ansible.posix.authorized_key:
        user: johnny
        key: "{{ local_restic_ssh_public_key }}"
        state: present
        comment: "restic-backup from homelab clients"
      tags: [ssh]

    - name: Ensure backup directory exists
      ansible.builtin.file:
        path: /srv/nas-zfs/backups
        state: directory
        owner: johnny
        group: johnny
        mode: "0755"
      tags: [config]

    - name: Validate server-side Restic freshness monitor declarations
      ansible.builtin.assert:
        that:
          - item.name is match('^[a-z0-9][a-z0-9-]+$')
          - item.source_host is string
          - item.source_host | length > 0
          - item.repository is match('^/srv/nas-zfs/backups/[A-Za-z0-9._-]+$')
          - item.max_age_seconds | int >= 3600
          - item.alert_dedup_seconds | int >= 3600
          - item.required_paths is sequence
          - item.required_paths | length > 0
        fail_msg: "Invalid server-side Restic freshness monitor declaration"
        quiet: true
      loop: "{{ local_restic_freshness_monitors | default([]) }}"
      loop_control:
        label: "{{ item.name | default('invalid') }}"
      tags: [monitoring]

    - name: Install Restic snapshot freshness checker
      ansible.builtin.copy:
        src: ../../scripts/storage/restic-snapshot-freshness.py
        dest: "{{ local_restic_freshness_checker }}"
        owner: root
        group: root
        mode: "0755"
      when: local_restic_freshness_monitors | default([]) | length > 0
      tags: [monitoring, script]

    - name: Create private Restic freshness monitor roots
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: root
        group: johnny
        mode: "0750"
      loop:
        - { path: "{{ local_restic_freshness_config_dir }}" }
        - { path: "{{ local_restic_freshness_cache_root }}" }
        - { path: "{{ local_restic_freshness_state_root }}" }
      when: local_restic_freshness_monitors | default([]) | length > 0
      tags: [monitoring]

    - name: Create per-repository Restic freshness cache and state directories
      ansible.builtin.file:
        path: "{{ item.0 }}/{{ item.1.name }}"
        state: directory
        owner: johnny
        group: johnny
        mode: "0700"
      loop: >-
        {{
          [local_restic_freshness_cache_root, local_restic_freshness_state_root]
          | product(local_restic_freshness_monitors | default([]))
          | list
        }}
      loop_control:
        label: "{{ item.1.name }}:{{ item.0 }}"
      tags: [monitoring]

    - name: Inspect dedicated Restic freshness cache trees
      ansible.builtin.find:
        paths: "{{ local_restic_freshness_cache_root }}/{{ item.name }}"
        file_type: any
        recurse: true
        hidden: true
        follow: false
      loop: "{{ local_restic_freshness_monitors | default([]) }}"
      loop_control:
        label: "{{ item.name }}"
      register: local_restic_freshness_cache_trees
      tags: [monitoring]

    - name: Reject unsafe Restic freshness cache tree entries
      ansible.builtin.assert:
        that:
          - item.1.isreg | default(false) or item.1.isdir | default(false)
          - not (item.1.islnk | default(false))
        fail_msg: >-
          Refusing to normalize an unsafe Restic freshness cache entry:
          {{ item.1.path | default('unknown') }}
        quiet: true
      loop: >-
        {{
          query(
            'subelements',
            local_restic_freshness_cache_trees.results,
            'files',
            {'skip_missing': true}
          )
        }}
      loop_control:
        label: "{{ item.1.path | default('unknown') }}"
      tags: [monitoring]

    - name: Normalize dedicated Restic freshness cache ownership
      ansible.builtin.file:
        path: "{{ local_restic_freshness_cache_root }}/{{ item.name }}"
        state: directory
        owner: johnny
        group: johnny
        recurse: true
      loop: "{{ local_restic_freshness_monitors | default([]) }}"
      loop_control:
        label: "{{ item.name }}"
      tags: [monitoring]

    - name: Inspect known Restic freshness monitor state markers
      ansible.builtin.stat:
        path: >-
          {{ local_restic_freshness_state_root }}/{{ item.0.name }}/{{ item.1 }}
        follow: false
      loop: >-
        {{
          local_restic_freshness_monitors | default([])
          | product(local_restic_freshness_state_markers)
          | list
        }}
      loop_control:
        label: "{{ item.0.name }}:{{ item.1 }}"
      register: local_restic_freshness_state_marker_stats
      tags: [monitoring]

    - name: Reject unsafe Restic freshness monitor state markers
      ansible.builtin.assert:
        that:
          - not item.stat.exists or item.stat.isreg | default(false)
          - not item.stat.exists or not (item.stat.islnk | default(false))
        fail_msg: >-
          Refusing to normalize a non-regular Restic freshness state marker:
          {{ item.item.0.name }}:{{ item.item.1 }}
      loop: "{{ local_restic_freshness_state_marker_stats.results }}"
      loop_control:
        label: "{{ item.item.0.name }}:{{ item.item.1 }}"
      tags: [monitoring]

    - name: Normalize existing Restic freshness monitor state marker ownership
      ansible.builtin.file:
        path: >-
          {{ local_restic_freshness_state_root }}/{{ item.item.0.name }}/{{ item.item.1 }}
        state: file
        owner: johnny
        group: johnny
        mode: "0600"
      loop: "{{ local_restic_freshness_state_marker_stats.results }}"
      loop_control:
        label: "{{ item.item.0.name }}:{{ item.item.1 }}"
      when: item.stat.exists
      tags: [monitoring]

    - name: Create private Restic freshness monitor environments
      ansible.builtin.copy:
        dest: "{{ local_restic_freshness_config_dir }}/{{ item.name }}.env"
        owner: root
        group: johnny
        mode: "0640"
        content: |
          SOURCE_HOST={{ item.source_host | quote }}
          MAX_AGE_SECONDS={{ item.max_age_seconds | int }}
          ALERT_DEDUP_SECONDS={{ item.alert_dedup_seconds | int }}
          RESTIC_REPOSITORY={{ item.repository | quote }}
          RESTIC_PASSWORD={{ restic_password | quote }}
          RESTIC_CACHE_DIR={{ (local_restic_freshness_cache_root ~ '/' ~ item.name) | quote }}
          APPRISE_ENDPOINT={{ apprise_endpoint | quote }}
          APPRISE_TOKEN={{ apprise_token | quote }}
          APPRISE_TAGS={{ apprise_alert_tags | quote }}
      loop: "{{ local_restic_freshness_monitors | default([]) }}"
      loop_control:
        label: "{{ item.name }}"
      no_log: true
      tags: [monitoring]

    - name: Create required-path declarations for Restic freshness monitors
      ansible.builtin.copy:
        dest: "{{ local_restic_freshness_config_dir }}/{{ item.name }}.paths"
        owner: root
        group: johnny
        mode: "0640"
        content: |
          {% for path in item.required_paths %}
          {{ path }}
          {% endfor %}
      loop: "{{ local_restic_freshness_monitors | default([]) }}"
      loop_control:
        label: "{{ item.name }}"
      tags: [monitoring]

    - name: Remove obsolete nested Restic freshness config root
      ansible.builtin.file:
        path: /etc/restic/freshness
        state: absent
      when: local_restic_freshness_monitors | default([]) | length > 0
      tags: [monitoring]

    - name: Install Restic freshness monitor runner
      ansible.builtin.copy:
        dest: "{{ local_restic_freshness_runner }}"
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/bin/bash
          set -uo pipefail

          name="${1:-}"
          [[ "$name" =~ ^[a-z0-9][a-z0-9-]+$ ]] || exit 2

          config_root={{ local_restic_freshness_config_dir | quote }}
          state_root={{ local_restic_freshness_state_root | quote }}
          checker={{ local_restic_freshness_checker | quote }}
          env_file="${config_root}/${name}.env"
          paths_file="${config_root}/${name}.paths"
          state_dir="${state_root}/${name}"

          [[ -r "$env_file" && -r "$paths_file" && -d "$state_dir" ]] || exit 2
          set -a
          source "$env_file"
          set +a
          export HOME="$state_dir"

          log() { logger -t "restic-snapshot-freshness/${name}" "$*"; }
          send_alert() {
            local title="$1" body="$2" type="$3" tags="$4"
            curl -fsS -o /dev/null \
              -X POST "${APPRISE_ENDPOINT}/notify/${APPRISE_TOKEN}" \
              --form-string "title=${title}" \
              --form-string "body=${body}" \
              --form-string "tag=${tags}" \
              --form-string "type=${type}" \
              --max-time 10 \
              --retry 2 \
              --retry-delay 3
          }

          args=(
            --host "$SOURCE_HOST"
            --max-age-seconds "$MAX_AGE_SECONDS"
          )
          while IFS= read -r required_path; do
            [[ -n "$required_path" ]] || continue
            args+=(--require-path "$required_path")
          done < "$paths_file"

          if result="$($checker "${args[@]}" 2>&1)"; then
            log "healthy ${result}"
            if [[ -f "$state_dir/unhealthy" ]]; then
              send_alert \
                "Hermes backup freshness recovered" \
                "TS440 again verifies a fresh, complete ${SOURCE_HOST} Hermes disaster-recovery snapshot." \
                success push-quiet || true
            fi
            rm -f "$state_dir/unhealthy" "$state_dir/last-alert"
            exit 0
          fi

          log "unhealthy ${result}"
          touch "$state_dir/unhealthy"
          now=$(date +%s)
          last_alert=0
          [[ -r "$state_dir/last-alert" ]] && read -r last_alert < "$state_dir/last-alert"
          if (( now - last_alert >= ALERT_DEDUP_SECONDS )); then
            if send_alert \
              "Hermes disaster-recovery backup is stale" \
              "TS440 cannot verify a fresh, complete ${SOURCE_HOST} Hermes snapshot in the encrypted local Restic repository. Inspect the source backup service and NAS repository before relying on node-loss recovery." \
              warning "$APPRISE_TAGS"; then
              printf '%s\n' "$now" > "$state_dir/last-alert"
            fi
          fi
          exit 1
      when: local_restic_freshness_monitors | default([]) | length > 0
      tags: [monitoring, script]

    - name: Install Restic snapshot freshness service
      ansible.builtin.copy:
        dest: /etc/systemd/system/restic-snapshot-freshness@.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Validate Restic snapshot freshness for %i
          After=network-online.target zfs.target
          Wants=network-online.target

          [Service]
          Type=oneshot
          User=johnny
          Group=johnny
          ExecStart={{ local_restic_freshness_runner }} %i
          NoNewPrivileges=true
          PrivateTmp=true
          ProtectHome=true
          ProtectSystem=strict
          ReadWritePaths={{ local_restic_freshness_cache_root }} {{ local_restic_freshness_state_root }}
          CapabilityBoundingSet=
          LockPersonality=true
          MemoryDenyWriteExecute=true
          RestrictSUIDSGID=true
          StandardOutput=journal
          StandardError=journal
          TimeoutStartSec=180
      when: local_restic_freshness_monitors | default([]) | length > 0
      tags: [monitoring, systemd]

    - name: Install Restic snapshot freshness timer
      ansible.builtin.copy:
        dest: /etc/systemd/system/restic-snapshot-freshness@.timer
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Hourly Restic snapshot freshness check for %i

          [Timer]
          OnCalendar=hourly
          RandomizedDelaySec=5m
          Persistent=true

          [Install]
          WantedBy=timers.target
      when: local_restic_freshness_monitors | default([]) | length > 0
      tags: [monitoring, systemd]

    - name: Enable server-side Restic freshness monitor timers
      ansible.builtin.systemd_service:
        name: "restic-snapshot-freshness@{{ item.name }}.timer"
        enabled: true
        state: started
        daemon_reload: true
      loop: "{{ local_restic_freshness_monitors | default([]) }}"
      loop_control:
        label: "{{ item.name }}"
      when: not ansible_check_mode
      tags: [monitoring, systemd]

# =============================================================================
# Restic REST server on ts440 (for hosts without SSH access)
# =============================================================================
# Append-only REST endpoint for openclaw-vm (and future untrusted hosts).
# No SSH, no shell, no filesystem browsing — only restic protocol.
- name: Configure restic REST server on ts440
  hosts: ts440
  become: true
  gather_facts: false

  tasks:
    - name: Install restic-rest-server and apache2-utils
      ansible.builtin.apt:
        name:
          - restic-rest-server
          - apache2-utils
        state: present
      tags: [install]

    - name: Create htpasswd directory
      ansible.builtin.file:
        path: /etc/restic-rest-server
        state: directory
        owner: root
        group: root
        mode: "0755"
      tags: [config]

    - name: Create htpasswd file for REST server
      ansible.builtin.command:
        cmd: >
          htpasswd -cbB /etc/restic-rest-server/.htpasswd
          openclaw-vm {{ restic_rest_password }}
      vars:
        restic_rest_password: "{{ hostvars['openclaw-vm']['vault_restic_rest_password'] }}"
      no_log: true
      changed_when: true
      notify: Restart restic-rest-server
      tags: [config]

    - name: Set htpasswd permissions
      ansible.builtin.file:
        path: /etc/restic-rest-server/.htpasswd
        owner: johnny
        group: johnny
        mode: "0600"
      tags: [config]

    - name: Create restic-rest-server systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/restic-rest-server.service
        mode: "0644"
        content: |
          [Unit]
          Description=Restic REST Server (append-only)
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=johnny
          ExecStart=/usr/bin/restic-rest-server \
            --path /srv/nas-zfs/backups \
            --listen :8500 \
            --htpasswd-file /etc/restic-rest-server/.htpasswd \
            --append-only \
            --private-repos
          Restart=on-failure
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
      notify: Reload systemd
      tags: [config]

    - name: Enable and start restic-rest-server
      ansible.builtin.systemd:
        name: restic-rest-server
        enabled: true
        state: started
        daemon_reload: true
      tags: [config]

    - name: Create restic REST maintenance cache directory
      ansible.builtin.file:
        path: /var/cache/restic-rest-maintenance/openclaw-vm
        state: directory
        owner: root
        group: root
        mode: "0700"
      tags: [maintenance]

    - name: Create restic REST maintenance environment file
      ansible.builtin.copy:
        dest: /etc/restic/openclaw-vm-rest-maintenance.env
        owner: root
        group: root
        mode: "0600"
        content: |
          # Managed by Ansible - do not edit manually
          RESTIC_REPOSITORY=/srv/nas-zfs/backups/openclaw-vm
          RESTIC_PASSWORD={{ restic_password }}
          RESTIC_CACHE_DIR=/var/cache/restic-rest-maintenance/openclaw-vm
      no_log: true
      tags: [maintenance]

    - name: Create restic REST maintenance script for openclaw-vm repo
      ansible.builtin.copy:
        dest: /usr/local/sbin/restic-rest-maintenance-openclaw-vm
        owner: root
        group: root
        mode: "0700"
        content: |
          #!/bin/bash
          set -euo pipefail

          LOG_TAG="restic-rest-maintenance-openclaw-vm"
          log() { logger -t "$LOG_TAG" "$*"; echo "$*"; }

          set -a
          source /etc/restic/openclaw-vm-rest-maintenance.env
          set +a
          export HOME=/root

          log "Starting server-side restic maintenance for openclaw-vm"
          restic unlock
          restic --retry-lock 15m forget \
            --verbose \
            --prune \
            --keep-hourly {{ hostvars['openclaw-vm']['local_restic_retention']['keep_hourly'] | default(local_restic_retention.keep_hourly) }} \
            --keep-daily {{ hostvars['openclaw-vm']['local_restic_retention']['keep_daily'] | default(local_restic_retention.keep_daily) }} \
            --keep-weekly {{ hostvars['openclaw-vm']['local_restic_retention']['keep_weekly'] | default(local_restic_retention.keep_weekly) }} \
            --keep-monthly {{ hostvars['openclaw-vm']['local_restic_retention']['keep_monthly'] | default(local_restic_retention.keep_monthly) }}
          log "Server-side restic maintenance complete for openclaw-vm"
      tags: [maintenance]

    - name: Create restic REST maintenance systemd service for openclaw-vm repo
      ansible.builtin.copy:
        dest: /etc/systemd/system/restic-rest-maintenance-openclaw-vm.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Restic REST maintenance for openclaw-vm append-only repository
          After=restic-rest-server.service
          ConditionPathExists=/srv/nas-zfs/backups/openclaw-vm/config

          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/restic-rest-maintenance-openclaw-vm
          StandardOutput=journal
          StandardError=journal
          User=root
          Environment=HOME=/root
          Environment=RESTIC_CACHE_DIR=/var/cache/restic-rest-maintenance/openclaw-vm
          Nice=19
          IOSchedulingClass=idle
          TimeoutStartSec=7200
      notify: Reload systemd
      tags: [maintenance]

    - name: Create restic REST maintenance systemd timer for openclaw-vm repo
      ansible.builtin.copy:
        dest: /etc/systemd/system/restic-rest-maintenance-openclaw-vm.timer
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Daily restic REST maintenance for openclaw-vm append-only repository

          [Timer]
          OnCalendar={{ hostvars['openclaw-vm']['local_restic_server_retention_oncalendar'] | default('*-*-* 03:20:00') }}
          Persistent=true

          [Install]
          WantedBy=timers.target
      notify:
        - Reload systemd
        - Enable restic REST maintenance timer for openclaw-vm
      tags: [maintenance]

    - name: Ensure restic REST maintenance timer is enabled and started for openclaw-vm repo
      ansible.builtin.systemd:
        name: restic-rest-maintenance-openclaw-vm.timer
        enabled: true
        state: started
        daemon_reload: true
      when: not ansible_check_mode
      tags: [maintenance]

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Restart restic-rest-server
      ansible.builtin.systemd:
        name: restic-rest-server
        state: restarted

    - name: Enable restic REST maintenance timer for openclaw-vm
      ansible.builtin.systemd:
        name: restic-rest-maintenance-openclaw-vm.timer
        enabled: true
        state: started
      when: not ansible_check_mode
