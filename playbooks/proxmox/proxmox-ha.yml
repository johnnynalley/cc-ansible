---
# Purpose: Manage Proxmox HA service state.
# Hosts: proxmox_nodes.
# Key vars: proxmox_*, pve_*, pbs_*, pdm_*.
# Templates: templates/proxmox.
# Scripts: none by default.
# Validation: ansible-playbook playbooks/proxmox/proxmox-ha.yml --syntax-check.

# =============================================================================
# Proxmox HA Service Management
# =============================================================================
# Manages pve-ha-lrm and pve-ha-crm on cluster nodes.
# Driven by pve_ha_enabled (default: false in group_vars/proxmox_nodes/vars.yml).
#
# When pve_ha_enabled=false: stop, disable, mask the services.
# When pve_ha_enabled=true:  unmask, enable, start the services.
#
# We use systemd masking (not just disable) so that a Proxmox package upgrade
# can't silently re-enable HA. Re-enable later by setting pve_ha_enabled=true
# and re-running this playbook.
# =============================================================================

- name: Manage Proxmox HA services
  hosts: proxmox_nodes
  become: true
  gather_facts: false
  tasks:
    - name: Stop, disable, and mask HA services (pve_ha_enabled=false)
      when: not (pve_ha_enabled | default(false))
      block:
        - name: Stop HA services
          ansible.builtin.systemd:
            name: "{{ item }}"
            state: stopped
          loop:
            - pve-ha-lrm
            - pve-ha-crm
          failed_when: false

        - name: Mask HA services (prevents accidental re-enable)
          ansible.builtin.systemd:
            name: "{{ item }}"
            enabled: false
            masked: true
            daemon_reload: true
          loop:
            - pve-ha-lrm
            - pve-ha-crm

    - name: Unmask, enable, and start HA services (pve_ha_enabled=true)
      when: pve_ha_enabled | default(false)
      block:
        - name: Unmask HA services
          ansible.builtin.systemd:
            name: "{{ item }}"
            masked: false
            enabled: true
            daemon_reload: true
          loop:
            - pve-ha-lrm
            - pve-ha-crm

        - name: Start HA services
          ansible.builtin.systemd:
            name: "{{ item }}"
            state: started
          loop:
            - pve-ha-lrm
            - pve-ha-crm
