# Purpose: Configure Proxmox guest hardware settings.
# Hosts: proxmox_nodes, linux_hosts.
# Key vars: proxmox_*, pve_*, pbs_*, pdm_*.
# Templates: templates/proxmox.
# Scripts: none by default.
# Validation: ansible-playbook playbooks/proxmox/proxmox-vm-hardware.yml --syntax-check.

# =============================================================================
# Proxmox Guest Hardware Settings
# =============================================================================
# Applies selected VM/LXC hardware settings that should be durable in IaC.
# Changes such as CPU model updates require a VM stop/start to take effect.
# =============================================================================

- name: Configure Proxmox guest hardware settings
  hosts: proxmox_nodes
  become: true
  gather_facts: false

  tasks:
    - name: Configure Proxmox storage definitions
      ansible.builtin.shell: |
        set -eu
        name="{{ item.name }}"
        existing_header="$(awk -v name="$name" '$1 ~ /:$/ && $2 == name { print $0; exit }' /etc/pve/storage.cfg)"
        if [ -z "$existing_header" ]; then
          add_args=(add "{{ item.type }}" "$name" --pool "{{ item.pool }}" --content "{{ item.content }}")
          {% if item.nodes is defined %}
          add_args+=(--nodes "{{ item.nodes }}")
          {% endif %}
          {% if item.sparse is defined %}
          add_args+=(--sparse "{{ 1 if item.sparse | bool else 0 }}")
          {% endif %}
          pvesm "${add_args[@]}"
          echo "updated=1 storage=$name added"
          exit 0
        fi

        if [ "$existing_header" != "{{ item.type }}: {{ item.name }}" ]; then
          echo "ERROR: storage $name exists but is not type {{ item.type }}: $existing_header" >&2
          exit 2
        fi

        current="$(awk '
          $0 == "{{ item.type }}: {{ item.name }}" { found=1; print; next }
          found && $0 ~ /^[^[:space:]]/ { exit }
          found { print }
        ' /etc/pve/storage.cfg)"

        args=""
        changes=""
        if ! printf '%s\n' "$current" | grep -q '^[[:space:]]*pool {{ item.pool }}$'; then
          args="$args --pool {{ item.pool }}"
          changes="$changes pool"
        fi
        if ! printf '%s\n' "$current" | grep -q '^[[:space:]]*content {{ item.content }}$'; then
          args="$args --content {{ item.content }}"
          changes="$changes content"
        fi
        {% if item.nodes is defined %}
        if ! printf '%s\n' "$current" | grep -q '^[[:space:]]*nodes {{ item.nodes }}$'; then
          args="$args --nodes {{ item.nodes }}"
          changes="$changes nodes"
        fi
        {% endif %}
        {% if item.sparse is defined %}
        desired_sparse="{{ 1 if item.sparse | bool else 0 }}"
        if ! printf '%s\n' "$current" | grep -q "^[[:space:]]*sparse ${desired_sparse}$"; then
          args="$args --sparse $desired_sparse"
          changes="$changes sparse"
        fi
        {% endif %}

        if [ -z "$args" ]; then
          echo "unchanged storage=$name"
          exit 0
        fi

        # shellcheck disable=SC2086
        pvesm set "$name" $args
        echo "updated=1 storage=$name changes=$changes"
      args:
        executable: /bin/bash
      loop: "{{ proxmox_storage_definitions | default([]) }}"
      loop_control:
        label: "{{ item.name }}"
      register: proxmox_storage_result
      changed_when: "'updated=1' in proxmox_storage_result.stdout"

    - name: Configure VM data disks
      ansible.builtin.shell: |
        set -eu
        slot="{{ item.slot }}"
        existing="$(qm config {{ item.vmid }} | awk -F': ' -v slot="$slot" '$1 == slot { print $2; exit }')"
        if [ -n "$existing" ]; then
          if printf '%s\n' "$existing" | grep -q 'serial={{ item.serial }}'; then
            echo "unchanged vmid={{ item.vmid }} slot=$slot existing=$existing"
            exit 0
          fi
          echo "ERROR: vmid={{ item.vmid }} slot=$slot already contains a different disk: $existing" >&2
          exit 2
        fi

        volume="{{ item.storage }}:{{ item.size }}{% for key, value in (item.options | default({})).items() %},{{ key }}={{ value }}{% endfor %},serial={{ item.serial }}"
        qm set {{ item.vmid }} --{{ item.slot }} "$volume"
        echo "updated=1 vmid={{ item.vmid }} slot=$slot volume=$volume"
      args:
        executable: /bin/bash
      loop: "{{ proxmox_vm_disks | default([]) }}"
      loop_control:
        label: "vmid={{ item.vmid }} {{ item.slot }} {{ item.name | default('') }}"
      register: proxmox_vm_disk_result
      changed_when: "'updated=1' in proxmox_vm_disk_result.stdout"

    - name: Report VM data disk changes
      ansible.builtin.debug:
        msg:
          - "{{ item.stdout_lines }}"
          - "VM may need a reboot before the guest can see the new disk."
      loop: "{{ proxmox_vm_disk_result.results | default([]) }}"
      loop_control:
        label: "{{ item.item.name | default(item.item.vmid) }}"
      when:
        - item is not skipped
        - item.changed | default(false)

    - name: Resize VM disks
      ansible.builtin.shell:
        cmd: |
          set -eu
          slot="{{ item.slot }}"
          desired_size="{{ item.size }}"
          existing="$(qm config {{ item.vmid }} | awk -F': ' -v slot="$slot" '$1 == slot { print $2; exit }')"
          if [ -z "$existing" ]; then
            echo "ERROR: vmid={{ item.vmid }} slot=$slot does not exist" >&2
            exit 2
          fi

          current_size="$(printf '%s\n' "$existing" | sed -n 's/.*size=\([^,]*\).*/\1/p')"
          if [ -z "$current_size" ]; then
            echo "ERROR: vmid={{ item.vmid }} slot=$slot has no parseable size: $existing" >&2
            exit 2
          fi

          if [ "$current_size" = "$desired_size" ]; then
            echo "unchanged vmid={{ item.vmid }} slot=$slot size=$current_size"
            exit 0
          fi

          case "$current_size:$desired_size" in
            *G:*G)
              current_gib="${current_size%G}"
              desired_gib="${desired_size%G}"
              if [ "$current_gib" -gt "$desired_gib" ]; then
                echo "ERROR: refusing to shrink vmid={{ item.vmid }} slot=$slot from $current_size to $desired_size" >&2
                exit 2
              fi
              ;;
            *)
              echo "ERROR: refusing unhandled resize unit for vmid={{ item.vmid }} slot=$slot current=$current_size desired=$desired_size" >&2
              exit 2
              ;;
          esac

          if [ "{{ ansible_check_mode | bool | lower }}" = "true" ]; then
            echo "updated=1 check_mode=1 vmid={{ item.vmid }} slot=$slot size=$current_size->$desired_size"
            exit 0
          fi

          qm resize {{ item.vmid }} "$slot" "$desired_size"
          echo "updated=1 vmid={{ item.vmid }} slot=$slot size=$current_size->$desired_size"
      args:
        executable: /bin/bash
      loop: "{{ proxmox_vm_disk_resizes | default([]) }}"
      loop_control:
        label: "vmid={{ item.vmid }} {{ item.slot }} {{ item.name | default('') }}"
      register: proxmox_vm_disk_resize_result
      check_mode: false
      changed_when: "'updated=1' in proxmox_vm_disk_resize_result.stdout"

    - name: Report VM disk resizes
      ansible.builtin.debug:
        msg:
          - "{{ item.stdout_lines }}"
          - "Guest partition and filesystem may need to be expanded after the virtual disk grows."
      loop: "{{ proxmox_vm_disk_resize_result.results | default([]) }}"
      loop_control:
        label: "{{ item.item.name | default(item.item.vmid) }}"
      when:
        - item is not skipped
        - item.changed | default(false)

    - name: Configure VM CPU model
      ansible.builtin.shell: |
        set -eu
        current="$(qm config {{ item.vmid }} | awk -F': ' '/^cpu:/ { print $2; exit }')"
        desired="{{ item.cpu }}"
        if [ "$current" = "$desired" ]; then
          echo "unchanged cpu=$current"
          exit 0
        fi
        qm set {{ item.vmid }} --cpu "$desired"
        echo "updated=1 cpu=$current->$desired"
      loop: "{{ proxmox_vm_hardware | default([]) }}"
      loop_control:
        label: "vmid={{ item.vmid }} {{ item.name | default('') }} cpu={{ item.cpu | default('') }}"
      when: item.cpu is defined
      register: proxmox_vm_cpu_result
      changed_when: "'updated=1' in proxmox_vm_cpu_result.stdout"

    - name: Report VM hardware changes requiring restart
      ansible.builtin.debug:
        msg: "{{ item.stdout_lines }}"
      loop: "{{ proxmox_vm_cpu_result.results | default([]) }}"
      loop_control:
        label: "{{ item.item.name | default(item.item.vmid) }}"
      when:
        - item is not skipped
        - item.changed | default(false)

    - name: Configure VM resource limits
      ansible.builtin.shell:
        cmd: |
          set -eu
          config="$(qm config {{ item.vmid }})"
          args=()
          changes=""

          {% if item.cores is defined %}
          current_cores="$(printf '%s\n' "$config" | awk -F': ' '/^cores:/ { print $2; exit }')"
          desired_cores="{{ item.cores }}"
          if [ "$current_cores" != "$desired_cores" ]; then
            args+=(--cores "$desired_cores")
            changes="$changes cores=$current_cores->$desired_cores"
          fi
          {% endif %}

          {% if item.memory is defined %}
          current_memory="$(printf '%s\n' "$config" | awk -F': ' '/^memory:/ { print $2; exit }')"
          desired_memory="{{ item.memory }}"
          if [ "$current_memory" != "$desired_memory" ]; then
            args+=(--memory "$desired_memory")
            changes="$changes memory=$current_memory->$desired_memory"
          fi
          {% endif %}

          {% if item.balloon is defined %}
          current_balloon="$(printf '%s\n' "$config" | awk -F': ' '/^balloon:/ { print $2; exit }')"
          current_balloon="${current_balloon:-0}"
          desired_balloon="{{ item.balloon }}"
          if [ "$current_balloon" != "$desired_balloon" ]; then
            args+=(--balloon "$desired_balloon")
            changes="$changes balloon=$current_balloon->$desired_balloon"
          fi
          {% endif %}

          {% if item.agent is defined %}
          current_agent="$(printf '%s\n' "$config" | awk -F': ' '/^agent:/ { print $2; exit }')"
          current_agent="${current_agent:-0}"
          desired_agent="{{ '1' if item.agent | bool else '0' }}"
          case "$current_agent" in
            1|enabled=1*) current_agent_enabled=1 ;;
            0|enabled=0*) current_agent_enabled=0 ;;
            *) current_agent_enabled="$current_agent" ;;
          esac
          if [ "$current_agent_enabled" != "$desired_agent" ]; then
            args+=(--agent "enabled=$desired_agent")
            changes="$changes agent=$current_agent->enabled=$desired_agent"
          fi
          {% endif %}

          {% if item.onboot is defined %}
          current_onboot="$(printf '%s\n' "$config" | awk -F': ' '/^onboot:/ { print $2; exit }')"
          current_onboot="${current_onboot:-0}"
          desired_onboot="{{ '1' if item.onboot | bool else '0' }}"
          if [ "$current_onboot" != "$desired_onboot" ]; then
            args+=(--onboot "$desired_onboot")
            changes="$changes onboot=$current_onboot->$desired_onboot"
          fi
          {% endif %}

          if [ -z "$changes" ]; then
            echo "unchanged"
            exit 0
          fi

          if [ "{{ ansible_check_mode | bool | lower }}" = "true" ]; then
            echo "updated=1 check_mode=1$changes"
            exit 0
          fi

          qm set {{ item.vmid }} "${args[@]}"
          echo "updated=1$changes"
      args:
        executable: /bin/bash
      loop: "{{ proxmox_vm_hardware | default([]) }}"
      loop_control:
        label: "vmid={{ item.vmid }} {{ item.name | default('') }}"
      register: proxmox_vm_resource_result
      check_mode: false
      changed_when: "'updated=1' in proxmox_vm_resource_result.stdout"

    - name: Report VM resource changes requiring restart
      ansible.builtin.debug:
        msg:
          - "{{ item.stdout_lines }}"
          - "VM may need a stop/start before all resource changes are visible to the guest."
      loop: "{{ proxmox_vm_resource_result.results | default([]) }}"
      loop_control:
        label: "{{ item.item.name | default(item.item.vmid) }}"
      when:
        - item is not skipped
        - item.changed | default(false)

    - name: Configure LXC resource limits
      ansible.builtin.shell: |
        set -eu
        config="$(pct config {{ item.vmid }})"
        args=""
        changes=""

        {% if item.cores is defined %}
        current_cores="$(printf '%s\n' "$config" | awk -F': ' '/^cores:/ { print $2; exit }')"
        desired_cores="{{ item.cores }}"
        if [ "$current_cores" != "$desired_cores" ]; then
          args="$args --cores $desired_cores"
          changes="$changes cores=$current_cores->$desired_cores"
        fi
        {% endif %}

        {% if item.memory is defined %}
        current_memory="$(printf '%s\n' "$config" | awk -F': ' '/^memory:/ { print $2; exit }')"
        desired_memory="{{ item.memory }}"
        if [ "$current_memory" != "$desired_memory" ]; then
          args="$args --memory $desired_memory"
          changes="$changes memory=$current_memory->$desired_memory"
        fi
        {% endif %}

        {% if item.swap is defined %}
        current_swap="$(printf '%s\n' "$config" | awk -F': ' '/^swap:/ { print $2; exit }')"
        desired_swap="{{ item.swap }}"
        if [ "$current_swap" != "$desired_swap" ]; then
          args="$args --swap $desired_swap"
          changes="$changes swap=$current_swap->$desired_swap"
        fi
        {% endif %}

        {% if item.onboot is defined %}
        current_onboot="$(printf '%s\n' "$config" | awk -F': ' '/^onboot:/ { print $2; exit }')"
        current_onboot="${current_onboot:-0}"
        desired_onboot="{{ '1' if item.onboot | bool else '0' }}"
        if [ "$current_onboot" != "$desired_onboot" ]; then
          args="$args --onboot $desired_onboot"
          changes="$changes onboot=$current_onboot->$desired_onboot"
        fi
        {% endif %}

        if [ -z "$args" ]; then
          echo "unchanged"
          exit 0
        fi

        pct set {{ item.vmid }} $args
        echo "updated=1$changes"
      loop: "{{ proxmox_lxc_hardware | default([]) }}"
      loop_control:
        label: "vmid={{ item.vmid }} {{ item.name | default('') }}"
      register: proxmox_lxc_resource_result
      changed_when: "'updated=1' in proxmox_lxc_resource_result.stdout"

    - name: Report LXC hardware changes
      ansible.builtin.debug:
        msg: "{{ item.stdout_lines }}"
      loop: "{{ proxmox_lxc_resource_result.results | default([]) }}"
      loop_control:
        label: "{{ item.item.name | default(item.item.vmid) }}"
      when:
        - item is not skipped
        - item.changed | default(false)

- name: Expand guest LVM roots after virtual disk growth
  hosts: linux_hosts
  become: true
  gather_facts: false

  tasks:
    - name: Skip hosts without guest LVM root expansion configured
      ansible.builtin.meta: end_host
      when: guest_lvm_root_expansion is not defined

    - name: Ensure guest root expansion tools are installed
      ansible.builtin.apt:
        name:
          - cloud-guest-utils
          - lvm2
        state: present

    - name: Check guest LVM root expansion status
      ansible.builtin.shell:
        cmd: |
          set -eu
          disk="{{ guest_lvm_root_expansion.disk }}"
          pv="{{ guest_lvm_root_expansion.pv }}"
          vg="{{ guest_lvm_root_expansion.vg }}"
          disk_name="$(basename "$disk")"
          pv_name="$(basename "$pv")"

          disk_sectors="$(cat "/sys/class/block/${disk_name}/size")"
          part_start="$(cat "/sys/class/block/${pv_name}/start")"
          part_sectors="$(cat "/sys/class/block/${pv_name}/size")"
          part_end="$((part_start + part_sectors))"
          sector_gap="$((disk_sectors - part_end))"
          free_extents="$(vgs --noheadings -o vg_free_count "$vg" | tr -d '[:space:]')"

          partition_needs_growth=0
          lv_needs_growth=0
          if [ "$sector_gap" -gt 2048 ]; then
            partition_needs_growth=1
          fi
          if [ "${free_extents:-0}" -gt 0 ]; then
            lv_needs_growth=1
          fi

          if [ "$partition_needs_growth" -eq 1 ] || [ "$lv_needs_growth" -eq 1 ]; then
            echo "updated=1 partition_needs_growth=$partition_needs_growth lv_needs_growth=$lv_needs_growth disk_sectors=$disk_sectors part_end=$part_end sector_gap=$sector_gap free_extents=$free_extents"
          else
            echo "unchanged partition_needs_growth=0 lv_needs_growth=0 disk_sectors=$disk_sectors part_end=$part_end sector_gap=$sector_gap free_extents=$free_extents"
          fi
      args:
        executable: /bin/bash
      register: guest_lvm_root_expansion_status
      changed_when: ansible_check_mode | bool and ('updated=1' in guest_lvm_root_expansion_status.stdout)
      check_mode: false

    - name: Grow root partition to fill virtual disk
      ansible.builtin.command:
        cmd: "growpart {{ guest_lvm_root_expansion.disk }} {{ guest_lvm_root_expansion.partition_number }}"
      register: guest_root_growpart
      changed_when: "'CHANGED' in (guest_root_growpart.stdout | default(''))"
      failed_when: >-
        guest_root_growpart.rc != 0
        and 'NOCHANGE' not in (guest_root_growpart.stdout | default(''))
        and 'NOCHANGE' not in (guest_root_growpart.stderr | default(''))
      when:
        - not ansible_check_mode
        - "'partition_needs_growth=1' in guest_lvm_root_expansion_status.stdout"

    - name: Resize LVM physical volume after partition growth
      ansible.builtin.command:
        cmd: "pvresize {{ guest_lvm_root_expansion.pv }}"
      register: guest_root_pvresize
      changed_when: >-
        'changed' in (guest_root_pvresize.stdout | default('') | lower)
        or 'resized' in (guest_root_pvresize.stdout | default('') | lower)
      when:
        - not ansible_check_mode
        - >-
          'partition_needs_growth=1' in guest_lvm_root_expansion_status.stdout
          or 'lv_needs_growth=1' in guest_lvm_root_expansion_status.stdout

    - name: Check free extents after PV resize
      ansible.builtin.command:
        cmd: "vgs --noheadings -o vg_free_count {{ guest_lvm_root_expansion.vg }}"
      register: guest_root_vg_free
      changed_when: false
      check_mode: false

    - name: Grow root LV and filesystem into free extents
      ansible.builtin.command:
        cmd: "lvextend -r -l +100%FREE {{ guest_lvm_root_expansion.lv }}"
      when:
        - not ansible_check_mode
        - guest_root_vg_free.stdout | trim | int > 0
