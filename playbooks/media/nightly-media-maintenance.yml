# Purpose: Configure nightly media maintenance.
# Hosts: nas_server, media-vm:docker-vm.
# Key vars: nightly_media_*, media_release_stamper_*, media_stack_health_*, stream_relay_*, plex_appliance_*.
# Templates: templates/media-maintenance, templates/streaming, templates/plex-appliance, templates/docker.
# Scripts: scripts/media-maintenance, scripts/media-release, scripts/streaming.
# Validation: ansible-playbook playbooks/media/nightly-media-maintenance.yml --syntax-check.

# =============================================================================
# Nightly Media Maintenance - Profilarr / MergerFS coordination
# =============================================================================
# Usage: ansible-playbook playbooks/media/nightly-media-maintenance.yml
#        ansible-playbook playbooks/media/nightly-media-maintenance.yml --check --diff
# =============================================================================

- name: Configure nightly media maintenance coordinator
  hosts: nas_server
  become: true
  gather_facts: false

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

  tasks:
    - name: End play when nightly media maintenance is disabled
      ansible.builtin.meta: end_host
      when: not (nightly_media_maintenance_enabled | default(false))

    - name: Ensure nightly media maintenance state directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - "{{ nightly_media_maintenance_state_dir }}"
        - /var/lib/mergerfs-balance

    - name: Deploy nightly media maintenance coordinator
      ansible.builtin.copy:
        src: ../../scripts/media-maintenance/nightly-media-maintenance
        dest: /usr/local/bin/nightly-media-maintenance
        owner: root
        group: root
        mode: "0755"

    - name: Generate nightly media maintenance SSH key
      ansible.builtin.command:
        cmd: >-
          ssh-keygen -t ed25519 -N '' -f
          {{ nightly_media_maintenance_ssh_key_path }}
          -C nightly-media-maintenance
        creates: "{{ nightly_media_maintenance_ssh_key_path }}"

    - name: Check nightly media maintenance public key
      ansible.builtin.stat:
        path: "{{ nightly_media_maintenance_ssh_key_path }}.pub"
      register: nightly_media_maintenance_public_key_stat

    - name: Read nightly media maintenance public key
      ansible.builtin.slurp:
        src: "{{ nightly_media_maintenance_ssh_key_path }}.pub"
      register: nightly_media_maintenance_public_key_file
      when: nightly_media_maintenance_public_key_stat.stat.exists | default(false)

    - name: Store nightly media maintenance public key
      ansible.builtin.set_fact:
        nightly_media_maintenance_public_key: >-
          {{ nightly_media_maintenance_public_key_file.content | b64decode | trim }}
      when: nightly_media_maintenance_public_key_file.content is defined

    - name: Deploy nightly Profilarr SSH client
      ansible.builtin.template:
        src: ../../templates/media-maintenance/nightly-media-profilarr-client.sh.j2
        dest: /usr/local/sbin/nightly-media-profilarr
        owner: root
        group: root
        mode: "0755"

    - name: Deploy nightly media maintenance services
      ansible.builtin.template:
        src: "../../templates/media-maintenance/{{ item }}.j2"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - nightly-media-maintenance.service
        - nightly-media-maintenance.timer
        - nightly-media-maintenance-restore.service
        - nightly-media-maintenance-restore.timer
      notify: Reload systemd

    - name: Disable legacy mergerfs balance timers
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: false
        state: stopped
      loop: "{{ nightly_media_maintenance_legacy_units | default([]) }}"
      failed_when: false
      when: nightly_media_maintenance_disable_legacy_units | default(true)

    - name: Remove legacy mergerfs balance units
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ item }}"
        state: absent
      loop: "{{ nightly_media_maintenance_legacy_units | default([]) }}"
      when: nightly_media_maintenance_disable_legacy_units | default(true)
      notify: Reload systemd

    - name: Flush handlers after unit deployment
      ansible.builtin.meta: flush_handlers

    - name: Enable nightly media maintenance timers
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - nightly-media-maintenance.timer
        - nightly-media-maintenance-restore.timer
      when: not ansible_check_mode

- name: Configure Profilarr nightly upgrade endpoint
  hosts: media-vm:docker-vm
  become: true
  gather_facts: false

  tasks:
    - name: Read Plex preferences
      ansible.builtin.slurp:
        src: "{{ nightly_media_maintenance_plex_preferences_path }}"
      register: nightly_media_maintenance_plex_preferences_file
      no_log: true
      check_mode: false
      when: nightly_media_maintenance_plex_preferences_enabled | default(false)

    - name: Extract Plex preference state
      ansible.builtin.set_fact:
        nightly_media_maintenance_plex_preferences_text: >-
          {{ nightly_media_maintenance_plex_preferences_file.content | b64decode }}
        nightly_media_maintenance_plex_token: >-
          {{
            (
              nightly_media_maintenance_plex_preferences_file.content
              | b64decode
              | regex_search('PlexOnlineToken="([^"]+)"', '\1')
            )[0]
          }}
      no_log: true
      when: nightly_media_maintenance_plex_preferences_enabled | default(false)

    - name: Calculate Plex preference changes
      ansible.builtin.set_fact:
        nightly_media_maintenance_plex_preference_changes: >-
          {{
            (nightly_media_maintenance_plex_preference_changes | default([]))
            + [item]
          }}
      vars:
        plex_pref_current_value: >-
          {{
            (
              nightly_media_maintenance_plex_preferences_text
              | regex_search('id="' ~ item.key ~ '"[^>]*value="([^"]*)"', '\1')
              | default([], true)
            )[0] | default('')
          }}
      loop: "{{ nightly_media_maintenance_plex_preferences | default({}) | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      when:
        - nightly_media_maintenance_plex_preferences_enabled | default(false)
        - plex_pref_current_value != (item.value | string)

    - name: Create Plex preferences backup directory
      ansible.builtin.file:
        path: >-
          {{ nightly_media_maintenance_plex_backup_root }}/{{ lookup('ansible.builtin.pipe', 'date -u +%Y%m%dT%H%M%SZ') }}
        state: directory
        owner: root
        group: root
        mode: "0700"
      register: nightly_media_maintenance_plex_backup_dir
      when:
        - nightly_media_maintenance_plex_preferences_enabled | default(false)
        - (nightly_media_maintenance_plex_preference_changes | default([])) | length > 0
        - not ansible_check_mode

    - name: Back up Plex preferences before API updates
      ansible.builtin.copy:
        src: "{{ nightly_media_maintenance_plex_preferences_path }}"
        dest: "{{ nightly_media_maintenance_plex_backup_dir.path }}/Preferences.xml"
        remote_src: true
        owner: root
        group: root
        mode: "0600"
      when:
        - nightly_media_maintenance_plex_preferences_enabled | default(false)
        - (nightly_media_maintenance_plex_preference_changes | default([])) | length > 0
        - not ansible_check_mode

    - name: Update Plex maintenance preferences
      ansible.builtin.uri:
        url: >-
          {{ nightly_media_maintenance_plex_url }}/:/prefs?{{ item.key }}={{ item.value | urlencode }}&X-Plex-Token={{ nightly_media_maintenance_plex_token | urlencode }}
        method: PUT
        status_code: [200]
        return_content: false
      loop: "{{ nightly_media_maintenance_plex_preference_changes | default([]) }}"
      loop_control:
        label: "{{ item.key }}"
      changed_when: true
      no_log: true
      when:
        - nightly_media_maintenance_plex_preferences_enabled | default(false)
        - not ansible_check_mode

    - name: Report Plex preference updates
      ansible.builtin.debug:
        msg:
          backup: "{{ nightly_media_maintenance_plex_backup_dir.path | default('not-created') }}"
          updated_preferences: "{{ nightly_media_maintenance_plex_preference_changes | default([]) | map(attribute='key') | list }}"
      when:
        - nightly_media_maintenance_plex_preferences_enabled | default(false)
        - (nightly_media_maintenance_plex_preference_changes | default([])) | length > 0
        - not ansible_check_mode

    - name: Verify Plex maintenance preferences
      ansible.builtin.uri:
        url: >-
          {{ nightly_media_maintenance_plex_url }}/:/prefs?X-Plex-Token={{ nightly_media_maintenance_plex_token | urlencode }}
        method: GET
        status_code: [200]
        return_content: true
      register: nightly_media_maintenance_plex_preferences_verify
      changed_when: false
      no_log: true
      check_mode: false
      when:
        - nightly_media_maintenance_plex_preferences_enabled | default(false)
        - not ansible_check_mode

    - name: Assert Plex maintenance preferences are configured
      ansible.builtin.assert:
        that:
          - >-
            nightly_media_maintenance_plex_preferences_verify.content
            is search('id="' ~ item.key ~ '"[^>]*value="' ~ (item.value | string) ~ '"')
        fail_msg: "Plex preference {{ item.key }} did not converge to {{ item.value }}."
      loop: "{{ nightly_media_maintenance_plex_preferences | default({}) | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      when:
        - nightly_media_maintenance_plex_preferences_enabled | default(false)
        - not ansible_check_mode

    - name: End play when nightly media maintenance key is not available
      ansible.builtin.meta: end_host
      when: >-
        hostvars[groups['nas_server'][0]].nightly_media_maintenance_public_key
        is not defined

    - name: Deploy Profilarr nightly upgrade helper
      ansible.builtin.copy:
        src: ../../scripts/media-release/profilarr_nightly_upgrade.py
        dest: /usr/local/sbin/profilarr-nightly-upgrade
        owner: root
        group: root
        mode: "0755"
      when: nightly_media_maintenance_profilarr_endpoint_enabled | default(false)

    - name: Authorize nightly media maintenance key for Profilarr helper
      ansible.posix.authorized_key:
        user: "{{ nightly_media_maintenance_profilarr_ssh_user | default('johnny') }}"
        key: "{{ hostvars[groups['nas_server'][0]].nightly_media_maintenance_public_key }}"
        key_options: 'command="/usr/local/sbin/profilarr-nightly-upgrade",no-agent-forwarding,no-X11-forwarding,no-port-forwarding,no-pty'
        state: present
      when: nightly_media_maintenance_profilarr_endpoint_enabled | default(false)

    - name: Remove disabled Profilarr nightly upgrade helper
      ansible.builtin.file:
        path: /usr/local/sbin/profilarr-nightly-upgrade
        state: absent
      when: not (nightly_media_maintenance_profilarr_endpoint_enabled | default(false))

    - name: Remove disabled nightly media maintenance key
      ansible.posix.authorized_key:
        user: "{{ nightly_media_maintenance_profilarr_ssh_user | default('johnny') }}"
        key: "{{ hostvars[groups['nas_server'][0]].nightly_media_maintenance_public_key }}"
        state: absent
      when: not (nightly_media_maintenance_profilarr_endpoint_enabled | default(false))
