# Purpose: Configure media release metadata stamping.
# Hosts: gluetun_hosts.
# Key vars: nightly_media_*, media_release_stamper_*, media_stack_health_*, stream_relay_*, plex_appliance_*.
# Templates: templates/media-maintenance, templates/streaming, templates/plex-appliance, templates/docker.
# Scripts: scripts/media-maintenance, scripts/media-release, scripts/streaming.
# Validation: ansible-playbook playbooks/media/media-release-stamper.yml --syntax-check.

# =============================================================================
# Media Release Stamper
# =============================================================================
# Preserves grab-time metadata such as Dual-Audio and x265/HEVC in completed
# download payload file names before Sonarr/Radarr import re-evaluates custom
# formats on individual files.
# =============================================================================

- name: Configure media release metadata stamping
  hosts: gluetun_hosts
  become: true
  gather_facts: false

  tasks:
    - name: Read Sonarr config for media release stamping
      ansible.builtin.slurp:
        src: "{{ media_release_stamper_sonarr_config_path | default('/opt/media-stack/sonarr/config.xml') }}"
      register: media_release_stamper_sonarr_config
      no_log: true
      check_mode: false
      when: media_release_stamper_enabled | default(false)

    - name: Read Radarr config for media release stamping
      ansible.builtin.slurp:
        src: "{{ media_release_stamper_radarr_config_path | default('/opt/media-stack/radarr/config.xml') }}"
      register: media_release_stamper_radarr_config
      no_log: true
      check_mode: false
      when: media_release_stamper_enabled | default(false)

    - name: Extract Arr API keys for media release stamping
      ansible.builtin.set_fact:
        media_release_stamper_sonarr_api_key: >-
          {{
            (
              media_release_stamper_sonarr_config.content
              | b64decode
              | regex_search('<ApiKey>([^<]+)</ApiKey>', '\1')
            )[0]
          }}
        media_release_stamper_radarr_api_key: >-
          {{
            (
              media_release_stamper_radarr_config.content
              | b64decode
              | regex_search('<ApiKey>([^<]+)</ApiKey>', '\1')
            )[0]
          }}
      no_log: true
      when: media_release_stamper_enabled | default(false)

    - name: Configure exact Arr grab-context ledger
      when:
        - media_release_stamper_enabled | default(false)
        - media_release_stamper_context_enabled | default(false)
      block:
        - name: Ensure Arr grab-context directories exist
          ansible.builtin.file:
            path: "{{ item.path }}"
            state: directory
            owner: "{{ item.owner }}"
            group: "{{ item.group }}"
            mode: "{{ item.mode }}"
          loop:
            - path: "{{ media_release_stamper_context_dir }}"
              owner: root
              group: root
              mode: "0755"
            - path: "{{ media_release_stamper_context_dir }}/data"
              owner: "{{ media_release_stamper_container_uid | default('1000') }}"
              group: "{{ media_release_stamper_container_gid | default('1000') }}"
              mode: "0750"

        - name: Deploy Arr grab-context service
          ansible.builtin.copy:
            src: ../../scripts/media-release/arr_grab_context.py
            dest: "{{ media_release_stamper_context_dir }}/arr_grab_context.py"
            owner: root
            group: root
            mode: "0755"
          register: media_release_stamper_context_script

        - name: Deploy Arr grab-context webhook configurator
          ansible.builtin.copy:
            src: ../../scripts/media-release/arr_grab_context_configure.py
            dest: "{{ media_release_stamper_context_dir }}/arr_grab_context_configure.py"
            owner: root
            group: root
            mode: "0755"

        - name: Deploy exact-target Arr import reconciler
          ansible.builtin.copy:
            src: ../../scripts/media-release/arr_import_reconciler.py
            dest: "{{ media_release_stamper_context_dir }}/arr_import_reconciler.py"
            owner: root
            group: root
            mode: "0755"
          register: media_release_stamper_reconciler_script

        - name: Deploy Arr import reconciler log rotation
          ansible.builtin.copy:
            dest: /etc/logrotate.d/arr-import-reconciler
            owner: root
            group: root
            mode: "0644"
            content: |
              {{ media_release_stamper_context_dir }}/data/arr-import-reconciler-events.jsonl {
                  daily
                  rotate 14
                  compress
                  delaycompress
                  missingok
                  notifempty
                  create 0640 {{ media_release_stamper_container_uid | default('1000') }} {{ media_release_stamper_container_gid | default('1000') }}
              }

        - name: Render Arr grab-context Compose project
          ansible.builtin.template:
            src: ../../templates/docker/arr-grab-context.yml.j2
            dest: "{{ media_release_stamper_context_dir }}/compose.yml"
            owner: root
            group: root
            mode: "0600"
          no_log: true

        - name: Validate Arr grab-context Compose project
          ansible.builtin.command:
            cmd: docker compose -f compose.yml config --quiet
            chdir: "{{ media_release_stamper_context_dir }}"
          changed_when: false
          when: not ansible_check_mode

        - name: Reload changed Arr grab-context service code
          ansible.builtin.command:
            cmd: docker compose -f compose.yml up -d --wait --force-recreate arr-grab-context
            chdir: "{{ media_release_stamper_context_dir }}"
          changed_when: true
          when:
            - not ansible_check_mode
            - media_release_stamper_context_script.changed

        - name: Reload changed exact-target Arr import reconciler code
          ansible.builtin.command:
            cmd: docker compose -f compose.yml up -d --wait --force-recreate arr-import-reconciler
            chdir: "{{ media_release_stamper_context_dir }}"
          changed_when: true
          when:
            - not ansible_check_mode
            - >-
              media_release_stamper_reconciler_script.changed
              or media_release_stamper_force_reconciler_reload | default(false) | bool

        - name: Start Arr grab-context service
          ansible.builtin.command:
            cmd: docker compose -f compose.yml up -d --wait
            chdir: "{{ media_release_stamper_context_dir }}"
          register: media_release_stamper_context_compose
          changed_when: >-
            'Created' in media_release_stamper_context_compose.stderr
            or 'Recreated' in media_release_stamper_context_compose.stderr
            or 'Started' in media_release_stamper_context_compose.stderr
          when: not ansible_check_mode

        - name: Verify Arr grab-context service health
          ansible.builtin.command:
            cmd: docker exec arr-grab-context wget -q -O - http://127.0.0.1:9899/health
          register: media_release_stamper_context_health
          changed_when: false
          retries: 10
          delay: 2
          until: media_release_stamper_context_health is succeeded
          when: not ansible_check_mode

        - name: Audit Arr grab-context webhooks
          ansible.builtin.command:
            cmd: >-
              {{ media_release_stamper_context_dir }}/arr_grab_context_configure.py
              --webhook-url {{ media_release_stamper_context_webhook_url | quote }}
              --backup-root {{ media_release_stamper_backup_root | quote }}
          register: media_release_stamper_context_webhook_audit
          changed_when: false
          no_log: true
          when: not ansible_check_mode

        - name: Configure Arr grab-context webhooks
          ansible.builtin.command:
            cmd: >-
              {{ media_release_stamper_context_dir }}/arr_grab_context_configure.py
              --apply
              --webhook-url {{ media_release_stamper_context_webhook_url | quote }}
              --backup-root {{ media_release_stamper_backup_root | quote }}
          register: media_release_stamper_context_webhook_apply
          changed_when: >-
            (media_release_stamper_context_webhook_apply.stdout | from_json).changed | default(false)
          no_log: true
          when:
            - not ansible_check_mode
            - (media_release_stamper_context_webhook_audit.stdout | from_json).needs_change | default(false)

    - name: Configure qBittorrent release stamper
      when:
        - media_release_stamper_enabled | default(false)
        - media_release_stamper_qbit_enabled | default(false)
      block:
        - name: Ensure qBittorrent release stamper directory exists
          ansible.builtin.file:
            path: "{{ media_release_stamper_qbit_script_dir }}"
            state: directory
            owner: "{{ media_release_stamper_container_uid | default('1000') }}"
            group: "{{ media_release_stamper_container_gid | default('1000') }}"
            mode: "0755"

        - name: Ensure qBittorrent release stamper event log exists
          ansible.builtin.file:
            path: "{{ media_release_stamper_qbit_script_dir }}/release-stamper-events.jsonl"
            state: touch
            owner: "{{ media_release_stamper_container_uid | default('1000') }}"
            group: "{{ media_release_stamper_container_gid | default('1000') }}"
            mode: "0640"
            access_time: preserve
            modification_time: preserve

        - name: Deploy qBittorrent release stamper
          ansible.builtin.copy:
            src: ../../files/qbit-release-stamper.py
            dest: "{{ media_release_stamper_qbit_script_dir }}/qbit-release-stamper.py"
            owner: "{{ media_release_stamper_container_uid | default('1000') }}"
            group: "{{ media_release_stamper_container_gid | default('1000') }}"
            mode: "0755"

        - name: Deploy qBittorrent release stamper environment
          ansible.builtin.copy:
            dest: "{{ media_release_stamper_qbit_env_path }}"
            owner: "{{ media_release_stamper_container_uid | default('1000') }}"
            group: "{{ media_release_stamper_container_gid | default('1000') }}"
            mode: "0600"
            content: |
              QBIT_API={{ media_release_stamper_qbit_container_api }}
              QBIT_USER={{ media_release_stamper_qbit_user }}
              QBIT_PASS={{ media_release_stamper_qbit_password }}
              QBIT_STAMP_CATEGORIES={{ media_release_stamper_qbit_categories | join(',') }}
              QBIT_API_RETRIES={{ media_release_stamper_qbit_script_api_retries | default(3) }}
              QBIT_API_RETRY_DELAY={{ media_release_stamper_qbit_script_api_retry_delay | default(2) }}
              QBIT_API_TIMEOUT={{ media_release_stamper_qbit_script_api_timeout | default(30) }}
              QBIT_FILES_API_RETRIES={{ media_release_stamper_qbit_files_api_retries | default(1) }}
              QBIT_FILES_API_RETRY_DELAY={{ media_release_stamper_qbit_files_api_retry_delay | default(1) }}
              QBIT_FILES_API_TIMEOUT={{ media_release_stamper_qbit_files_api_timeout | default(8) }}
              STAMPER_EVENT_LOG=/config/scripts/release-stamper-events.jsonl
              DA_ORIGINAL_LANGUAGES={{ media_release_stamper_da_original_languages | join(',') }}
              SONARR_API={{ media_release_stamper_sonarr_api }}
              SONARR_API_KEY={{ media_release_stamper_sonarr_api_key }}
              RADARR_API={{ media_release_stamper_radarr_api }}
              RADARR_API_KEY={{ media_release_stamper_radarr_api_key }}
              ARR_GRAB_CONTEXT_API={{ media_release_stamper_context_api | default('') }}
          no_log: true

        - name: Log in to qBittorrent API
          ansible.builtin.uri:
            url: "{{ media_release_stamper_qbit_host_api }}/auth/login"
            method: POST
            body_format: form-urlencoded
            body:
              username: "{{ media_release_stamper_qbit_user }}"
              password: "{{ media_release_stamper_qbit_password }}"
            status_code: [200, 204]
            return_content: true
          register: media_release_stamper_qbit_login
          changed_when: false
          no_log: true
          check_mode: false
          retries: "{{ media_release_stamper_qbit_api_retries | default(5) }}"
          delay: "{{ media_release_stamper_qbit_api_retry_delay | default(3) }}"
          until: media_release_stamper_qbit_login is succeeded

        - name: Read qBittorrent preferences
          ansible.builtin.uri:
            url: "{{ media_release_stamper_qbit_host_api }}/app/preferences"
            method: GET
            headers:
              Cookie: "{{ media_release_stamper_qbit_login.cookies_string }}"
            return_content: true
          register: media_release_stamper_qbit_preferences
          changed_when: false
          no_log: true
          check_mode: false
          retries: "{{ media_release_stamper_qbit_api_retries | default(5) }}"
          delay: "{{ media_release_stamper_qbit_api_retry_delay | default(3) }}"
          until: media_release_stamper_qbit_preferences is succeeded

        - name: Enable qBittorrent completion hook
          ansible.builtin.uri:
            url: "{{ media_release_stamper_qbit_host_api }}/app/setPreferences"
            method: POST
            headers:
              Cookie: "{{ media_release_stamper_qbit_login.cookies_string }}"
            body_format: form-urlencoded
            body:
              json: >-
                {{
                  {
                    'autorun_enabled': true,
                    'autorun_program': media_release_stamper_qbit_autorun_program
                  } | to_json
                }}
            status_code: [200, 204]
          changed_when: true
          no_log: true
          retries: "{{ media_release_stamper_qbit_api_retries | default(5) }}"
          delay: "{{ media_release_stamper_qbit_api_retry_delay | default(3) }}"
          until: media_release_stamper_qbit_hook_update is succeeded
          register: media_release_stamper_qbit_hook_update
          when:
            - not ansible_check_mode
            - >-
              media_release_stamper_qbit_preferences.json.autorun_enabled | default(false) != true
              or media_release_stamper_qbit_preferences.json.autorun_program | default('') != media_release_stamper_qbit_autorun_program

    - name: Configure SABnzbd release stamper
      when:
        - media_release_stamper_enabled | default(false)
        - media_release_stamper_sab_enabled | default(false)
      block:
        - name: Ensure SABnzbd release stamper directory exists
          ansible.builtin.file:
            path: "{{ media_release_stamper_sab_script_dir }}"
            state: directory
            owner: "{{ media_release_stamper_container_uid | default('1000') }}"
            group: "{{ media_release_stamper_container_gid | default('1000') }}"
            mode: "0755"

        - name: Ensure SABnzbd release stamper event log exists
          ansible.builtin.file:
            path: "{{ media_release_stamper_sab_script_dir }}/release-stamper-events.jsonl"
            state: touch
            owner: "{{ media_release_stamper_container_uid | default('1000') }}"
            group: "{{ media_release_stamper_container_gid | default('1000') }}"
            mode: "0640"
            access_time: preserve
            modification_time: preserve

        - name: Deploy SABnzbd release stamper
          ansible.builtin.copy:
            src: ../../files/sab-release-stamper.py
            dest: "{{ media_release_stamper_sab_script_dir }}/{{ media_release_stamper_sab_script_name }}"
            owner: "{{ media_release_stamper_container_uid | default('1000') }}"
            group: "{{ media_release_stamper_container_gid | default('1000') }}"
            mode: "0755"

        - name: Deploy SABnzbd release stamper environment
          ansible.builtin.copy:
            dest: "{{ media_release_stamper_sab_env_path }}"
            owner: "{{ media_release_stamper_container_uid | default('1000') }}"
            group: "{{ media_release_stamper_container_gid | default('1000') }}"
            mode: "0600"
            content: |
              SAB_STAMP_CATEGORIES={{ media_release_stamper_sab_categories | join(',') }}
              STAMPER_EVENT_LOG=/config/scripts/release-stamper-events.jsonl
              DA_ORIGINAL_LANGUAGES={{ media_release_stamper_da_original_languages | join(',') }}
              SONARR_API={{ media_release_stamper_sonarr_api }}
              SONARR_API_KEY={{ media_release_stamper_sonarr_api_key }}
              RADARR_API={{ media_release_stamper_radarr_api }}
              RADARR_API_KEY={{ media_release_stamper_radarr_api_key }}
              ARR_GRAB_CONTEXT_API={{ media_release_stamper_context_api | default('') }}
          no_log: true

        - name: Read SABnzbd config
          ansible.builtin.slurp:
            src: "{{ media_release_stamper_sab_config_dir }}/sabnzbd.ini"
          register: media_release_stamper_sab_config
          no_log: true
          check_mode: false

        - name: Extract SABnzbd API key
          ansible.builtin.set_fact:
            media_release_stamper_sab_api_key: >-
              {{
                (
                  media_release_stamper_sab_config.content
                  | b64decode
                  | regex_search('(?m)^api_key = ([A-Za-z0-9]+)$', '\1')
                )[0]
              }}
          no_log: true

        - name: Extract current SABnzbd script directory
          ansible.builtin.set_fact:
            media_release_stamper_sab_current_script_dir: >-
              {{
                (
                  media_release_stamper_sab_config.content
                  | b64decode
                  | regex_search('(?m)^script_dir = (.*)$', '\1')
                )[0] | default('')
              }}
          no_log: true

        - name: Set SABnzbd script directory
          ansible.builtin.uri:
            url: "{{ media_release_stamper_sab_api_url | default('http://127.0.0.1:8080/api') }}"
            method: POST
            body_format: form-urlencoded
            body:
              mode: set_config
              section: misc
              keyword: script_dir
              value: scripts
              apikey: "{{ media_release_stamper_sab_api_key }}"
              output: json
          changed_when: true
          no_log: true
          when:
            - not ansible_check_mode
            - media_release_stamper_sab_current_script_dir != 'scripts'

        - name: Read SABnzbd categories
          ansible.builtin.uri:
            url: "{{ media_release_stamper_sab_api_url | default('http://127.0.0.1:8080/api') }}"
            method: POST
            body_format: form-urlencoded
            body:
              mode: get_config
              section: categories
              apikey: "{{ media_release_stamper_sab_api_key }}"
              output: json
            return_content: true
          register: media_release_stamper_sab_categories_config
          changed_when: false
          no_log: true
          check_mode: false

        - name: Enable SABnzbd release stamper for media categories
          ansible.builtin.uri:
            url: "{{ media_release_stamper_sab_api_url | default('http://127.0.0.1:8080/api') }}"
            method: POST
            body_format: form-urlencoded
            body:
              mode: set_config
              section: categories
              name: "{{ item }}"
              script: "{{ media_release_stamper_sab_script_name }}"
              apikey: "{{ media_release_stamper_sab_api_key }}"
              output: json
          loop: "{{ media_release_stamper_sab_categories }}"
          changed_when: true
          no_log: true
          when:
            - not ansible_check_mode
            - >-
              (
                media_release_stamper_sab_categories_config.json.config.categories
                | selectattr('name', 'equalto', item)
                | map(attribute='script')
                | first
                | default('')
              ) != media_release_stamper_sab_script_name
