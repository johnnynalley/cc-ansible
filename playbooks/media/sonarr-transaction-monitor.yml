# Purpose: Configure Sonarr transaction monitor.
# Hosts: gluetun_hosts:media-vm.
# Key vars: nightly_media_*, media_release_stamper_*, media_stack_health_*, stream_relay_*, plex_appliance_*.
# Templates: templates/media-maintenance, templates/streaming, templates/plex-appliance, templates/docker.
# Scripts: scripts/media-maintenance, scripts/media-release, scripts/streaming.
# Validation: ansible-playbook playbooks/media/sonarr-transaction-monitor.yml --syntax-check.

# =============================================================================
# Sonarr Transaction Monitor
# =============================================================================
# Persists Sonarr history and queue snapshots for release-policy audits.
# =============================================================================

- name: Configure Sonarr transaction monitor
  hosts: gluetun_hosts:media-vm
  become: true
  gather_facts: false

  tasks:
    - name: Ensure Sonarr transaction monitor state directory exists
      ansible.builtin.file:
        path: "{{ sonarr_transaction_monitor_state_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0750"
      when: sonarr_transaction_monitor_enabled | default(false)

    - name: Ensure Sonarr transaction monitor log directory exists
      ansible.builtin.file:
        path: "{{ sonarr_transaction_monitor_log_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0750"
      when: sonarr_transaction_monitor_enabled | default(false)

    - name: Deploy Sonarr transaction monitor
      ansible.builtin.copy:
        src: ../../files/sonarr-transaction-monitor.py
        dest: /usr/local/bin/sonarr-transaction-monitor
        owner: root
        group: root
        mode: "0755"
      when: sonarr_transaction_monitor_enabled | default(false)

    - name: Deploy Sonarr transaction monitor logrotate config
      ansible.builtin.copy:
        dest: /etc/logrotate.d/sonarr-transaction-monitor
        owner: root
        group: root
        mode: "0644"
        content: |
          {{ sonarr_transaction_monitor_log_dir }}/events.jsonl {
              daily
              rotate {{ sonarr_transaction_monitor_log_rotate_count }}
              compress
              delaycompress
              missingok
              notifempty
              create 0640 root root
          }
      when: sonarr_transaction_monitor_enabled | default(false)

    - name: Deploy Sonarr transaction monitor service
      ansible.builtin.copy:
        dest: /etc/systemd/system/sonarr-transaction-monitor.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Record Sonarr history and queue snapshots
          Wants=docker.service
          After=docker.service

          [Service]
          Type=oneshot
          ExecStart=/usr/local/bin/sonarr-transaction-monitor --base-url {{ sonarr_transaction_monitor_base_url | default('http://127.0.0.1:8989') }} --config {{ sonarr_transaction_monitor_config_path | default('/opt/media-stack/sonarr/config.xml') }} --radarr-base-url {{ sonarr_transaction_monitor_radarr_base_url | default('http://127.0.0.1:7878') }} --radarr-config {{ sonarr_transaction_monitor_radarr_config_path | default('/opt/media-stack/radarr/config.xml') }} --bootstrap-records {{ sonarr_transaction_monitor_bootstrap_records }} --max-history-pages {{ sonarr_transaction_monitor_max_history_pages }} --storage-snapshot-interval-sec {{ sonarr_transaction_monitor_storage_snapshot_interval_sec | default(900) }}
      when: sonarr_transaction_monitor_enabled | default(false)
      notify: Reload systemd

    - name: Deploy Sonarr transaction monitor timer
      ansible.builtin.copy:
        dest: /etc/systemd/system/sonarr-transaction-monitor.timer
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Run Sonarr transaction monitor periodically

          [Timer]
          OnBootSec={{ sonarr_transaction_monitor_on_boot_sec }}
          OnUnitActiveSec={{ sonarr_transaction_monitor_interval_sec }}
          AccuracySec=30s
          Persistent=true

          [Install]
          WantedBy=timers.target
      when: sonarr_transaction_monitor_enabled | default(false)
      notify: Reload systemd

    - name: Enable and start Sonarr transaction monitor timer
      ansible.builtin.systemd:
        name: sonarr-transaction-monitor.timer
        enabled: true
        state: started
        daemon_reload: true
      when:
        - sonarr_transaction_monitor_enabled | default(false)
        - not ansible_check_mode

    - name: Run Sonarr transaction monitor once after deployment
      ansible.builtin.systemd:
        name: sonarr-transaction-monitor.service
        state: started
      when:
        - sonarr_transaction_monitor_enabled | default(false)
        - not ansible_check_mode

    - name: Disable Sonarr transaction monitor timer
      ansible.builtin.systemd:
        name: sonarr-transaction-monitor.timer
        enabled: false
        state: stopped
        daemon_reload: true
      when:
        - not (sonarr_transaction_monitor_enabled | default(false))
        - not ansible_check_mode

    - name: Remove Sonarr transaction monitor logrotate config when disabled
      ansible.builtin.file:
        path: /etc/logrotate.d/sonarr-transaction-monitor
        state: absent
      when: not (sonarr_transaction_monitor_enabled | default(false))

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true
