---
# Purpose: Deploy the private Immich screenshot movie/TV review queue.
# Hosts: docker_hosts (explicit opt-in with immich_media_inbox_enabled).
# Key vars: immich_media_inbox_*.
# Templates: templates/media-inbox.
# Scripts: scripts/media-inbox.
# Validation: ansible-playbook playbooks/media/immich-media-inbox.yml
#             --syntax-check.

- name: Configure Immich Media Inbox
  hosts: docker_hosts
  become: true
  gather_facts: false
  serial: 1

  vars:
    immich_media_inbox_bootstrap_api_key: false
    immich_media_inbox_bootstrap_work_dir: /run/immich-media-inbox-bootstrap
    immich_media_inbox_repo_root: "{{ ansible_config_file | dirname }}"
    immich_media_inbox_bootstrap_helper: >-
      {{ immich_media_inbox_bootstrap_work_dir }}/bootstrap-immich-api-key
    immich_media_inbox_reconcile_helper: >-
      {{ immich_media_inbox_bootstrap_work_dir }}/reconcile-immich-api-key
    immich_media_inbox_bootstrap_secret_path: >-
      {{ immich_media_inbox_bootstrap_work_dir }}/immich_api_key
    immich_media_inbox_bootstrap_metadata_path: >-
      {{ immich_media_inbox_bootstrap_work_dir }}/immich_api_key.json
    immich_media_inbox_app_source_dir: >-
      {{ immich_media_inbox_repo_root
         }}/scripts/media-inbox/immich_media_inbox
    immich_media_inbox_app_modules: >-
      {{ query('ansible.builtin.fileglob',
               immich_media_inbox_app_source_dir + '/*.py') | sort }}
    immich_media_inbox_app_module_names: >-
      {{ immich_media_inbox_app_modules | map('basename') | list }}
    immich_media_inbox_expected_permissions:
      - asset.read
      - asset.view

  tasks:
    - name: Skip hosts without Immich Media Inbox enabled
      ansible.builtin.meta: end_host
      when: not (immich_media_inbox_enabled | default(false) | bool)

    - name: Validate Immich Media Inbox safety settings
      ansible.builtin.assert:
        that:
          - immich_media_inbox_allowed_visibilities | length > 0
          - "'locked' not in immich_media_inbox_allowed_visibilities"
          - "'hidden' not in immich_media_inbox_allowed_visibilities"
          - not (immich_media_inbox_requests_enabled | bool)
          - immich_media_inbox_runtime_uid | int > 0
          - immich_media_inbox_runtime_gid | int > 0
        fail_msg: >-
          Initial deployment must remain review-only and exclude hidden/locked
          Immich assets. Change that policy only as a separately reviewed
          rollout.

    - name: Ensure Immich Media Inbox runtime group exists
      ansible.builtin.group:
        name: "{{ immich_media_inbox_runtime_group }}"
        gid: "{{ immich_media_inbox_runtime_gid }}"
        system: true
        state: present

    - name: Ensure Immich Media Inbox runtime user exists
      ansible.builtin.user:
        name: "{{ immich_media_inbox_runtime_user }}"
        uid: "{{ immich_media_inbox_runtime_uid }}"
        group: "{{ immich_media_inbox_runtime_group }}"
        system: true
        create_home: false
        home: /nonexistent
        shell: /usr/sbin/nologin
        password_lock: true
        state: present

    - name: Ensure Immich Media Inbox directories exist
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - path: "{{ immich_media_inbox_root }}"
          owner: root
          group: root
          mode: "0755"
        - path: "{{ immich_media_inbox_root }}/app"
          owner: root
          group: root
          mode: "0755"
        - path: "{{ immich_media_inbox_root }}/app/immich_media_inbox"
          owner: root
          group: root
          mode: "0755"
        - path: "{{ immich_media_inbox_root }}/data"
          owner: "{{ immich_media_inbox_runtime_user }}"
          group: "{{ immich_media_inbox_runtime_group }}"
          mode: "0750"
        - path: "{{ immich_media_inbox_root }}/ollama"
          owner: "{{ immich_media_inbox_runtime_user }}"
          group: "{{ immich_media_inbox_runtime_group }}"
          mode: "0750"
        - path: "{{ immich_media_inbox_root }}/secrets"
          owner: root
          group: "{{ immich_media_inbox_runtime_group }}"
          mode: "0750"
        - path: "{{ immich_media_inbox_root }}/tools"
          owner: root
          group: root
          mode: "0700"
      loop_control:
        label: "{{ item.path }}"

    - name: Check for the scoped Immich API key
      ansible.builtin.stat:
        path: "{{ immich_media_inbox_root }}/secrets/immich_api_key"
      register: immich_media_inbox_immich_secret

    - name: Explain skipped API key bootstrap in check mode
      ansible.builtin.debug:
        msg: >-
          The scoped Immich API key is absent. Check mode will not create or
          transfer credentials; an applied bootstrap requires the explicit
          bootstrap flag and creates a fresh app-native database backup first.
      when:
        - ansible_check_mode
        - not immich_media_inbox_immich_secret.stat.exists

    - name: Bootstrap a scoped Immich API key
      when:
        - not ansible_check_mode
        - not immich_media_inbox_immich_secret.stat.exists
      block:
        - name: Require explicit authorization for Immich key creation
          ansible.builtin.assert:
            that:
              - immich_media_inbox_bootstrap_api_key | bool
            fail_msg: >-
              The Immich key is absent. Rerun with the explicit
              immich_media_inbox_bootstrap_api_key=true extra var. The scoped
              helper will create and verify an app-native database backup
              before it creates the key.

        - name: Create temporary Immich key bootstrap directory
          ansible.builtin.file:
            path: "{{ immich_media_inbox_bootstrap_work_dir }}"
            state: directory
            owner: root
            group: root
            mode: "0700"
          delegate_to: "{{ immich_media_inbox_bootstrap_host }}"

        - name: Copy temporary Immich key bootstrap helper
          ansible.builtin.copy:
            src: >-
              {{ immich_media_inbox_repo_root
                 }}/scripts/media-inbox/bootstrap-immich-api-key
            dest: "{{ immich_media_inbox_bootstrap_helper }}"
            owner: root
            group: root
            mode: "0700"
          delegate_to: "{{ immich_media_inbox_bootstrap_host }}"

        - name: Create least-privilege Immich Media Inbox API key
          ansible.builtin.command:
            argv:
              - /usr/bin/python3
              - "{{ immich_media_inbox_bootstrap_helper }}"
              - --api-url
              - "{{ immich_media_inbox_bootstrap_api_url }}"
              - --source-container
              - "{{ immich_media_inbox_bootstrap_container }}"
              - --name
              - "{{ immich_media_inbox_bootstrap_key_name }}"
              - --output
              - "{{ immich_media_inbox_bootstrap_secret_path }}"
              - --metadata-output
              - "{{ immich_media_inbox_bootstrap_metadata_path }}"
              - --require-new-backup
              - --backup-timeout
              - "600"
          delegate_to: "{{ immich_media_inbox_bootstrap_host }}"
          no_log: true

        - name: Read newly created Immich API key for protected transfer
          ansible.builtin.slurp:
            src: "{{ immich_media_inbox_bootstrap_secret_path }}"
          delegate_to: "{{ immich_media_inbox_bootstrap_host }}"
          register: immich_media_inbox_bootstrap_secret
          no_log: true

        - name: Read Immich API key metadata for rollback
          ansible.builtin.slurp:
            src: "{{ immich_media_inbox_bootstrap_metadata_path }}"
          delegate_to: "{{ immich_media_inbox_bootstrap_host }}"
          register: immich_media_inbox_bootstrap_metadata
          no_log: true

        - name: Install scoped Immich API key
          ansible.builtin.copy:
            # yamllint disable-line rule:line-length
            content: "{{ immich_media_inbox_bootstrap_secret.content | b64decode }}"
            dest: "{{ immich_media_inbox_root }}/secrets/immich_api_key"
            owner: root
            group: "{{ immich_media_inbox_runtime_group }}"
            mode: "0440"
          no_log: true

        - name: Install Immich API key rollback metadata
          ansible.builtin.copy:
            # yamllint disable-line rule:line-length
            content: "{{ immich_media_inbox_bootstrap_metadata.content | b64decode }}"
            dest: "{{ immich_media_inbox_root }}/secrets/immich_api_key.json"
            owner: root
            group: root
            mode: "0600"
          no_log: true
      always:
        - name: Remove temporary Immich key bootstrap material
          ansible.builtin.file:
            path: "{{ immich_media_inbox_bootstrap_work_dir }}"
            state: absent
          delegate_to: "{{ immich_media_inbox_bootstrap_host }}"
          when: not ansible_check_mode

    - name: Recheck the scoped Immich API key
      ansible.builtin.stat:
        path: "{{ immich_media_inbox_root }}/secrets/immich_api_key"
      register: immich_media_inbox_immich_secret_after
      when: not ansible_check_mode

    - name: Require the scoped Immich API key before deployment
      ansible.builtin.assert:
        that:
          - immich_media_inbox_immich_secret_after.stat.exists
          - immich_media_inbox_immich_secret_after.stat.isreg
        fail_msg: "The scoped Immich API key was not installed."
      when: not ansible_check_mode

    - name: Check for Immich API key metadata
      ansible.builtin.stat:
        path: "{{ immich_media_inbox_root }}/secrets/immich_api_key.json"
      register: immich_media_inbox_key_metadata_stat

    - name: Require Immich API key metadata before permission reconciliation
      ansible.builtin.assert:
        that:
          - immich_media_inbox_key_metadata_stat.stat.exists
          - immich_media_inbox_key_metadata_stat.stat.isreg
        fail_msg: >-
          The protected Immich key metadata is required to reconcile the
          existing key in place without creating a duplicate.
      when: not ansible_check_mode

    - name: Reconcile candidate-preview permission on the existing Immich key
      when: not ansible_check_mode
      block:
        - name: Read protected Immich API key metadata
          ansible.builtin.slurp:
            src: "{{ immich_media_inbox_root }}/secrets/immich_api_key.json"
          register: immich_media_inbox_key_metadata_raw
          no_log: true

        - name: Parse protected Immich API key metadata
          ansible.builtin.set_fact:
            immich_media_inbox_key_metadata: >-
              {{ immich_media_inbox_key_metadata_raw.content
                 | b64decode | from_json }}
          no_log: true

        - name: Validate protected Immich API key identity
          ansible.builtin.assert:
            that:
              - >-
                immich_media_inbox_key_metadata.id
                is match('^[0-9A-Fa-f-]{36}$')
              - >-
                immich_media_inbox_key_metadata.name
                == immich_media_inbox_bootstrap_key_name
            fail_msg: >-
              Protected Immich key metadata has an unexpected identity.
          no_log: true

        - name: Create temporary Immich key reconciliation directory
          ansible.builtin.file:
            path: "{{ immich_media_inbox_bootstrap_work_dir }}"
            state: directory
            owner: root
            group: root
            mode: "0700"
          delegate_to: "{{ immich_media_inbox_bootstrap_host }}"

        - name: Copy temporary Immich key reconciliation helper
          ansible.builtin.copy:
            src: >-
              {{ immich_media_inbox_repo_root
                 }}/scripts/media-inbox/reconcile-immich-api-key
            dest: "{{ immich_media_inbox_reconcile_helper }}"
            owner: root
            group: root
            mode: "0700"
          delegate_to: "{{ immich_media_inbox_bootstrap_host }}"

        - name: Reconcile exact Immich candidate-analysis permissions
          ansible.builtin.command:
            argv:
              - /usr/bin/python3
              - "{{ immich_media_inbox_reconcile_helper }}"
              - --api-url
              - "{{ immich_media_inbox_bootstrap_api_url }}"
              - --source-container
              - "{{ immich_media_inbox_bootstrap_container }}"
              - --key-id
              - "{{ immich_media_inbox_key_metadata.id }}"
              - --name
              - "{{ immich_media_inbox_bootstrap_key_name }}"
              - --require-new-backup
              - --backup-timeout
              - "600"
          delegate_to: "{{ immich_media_inbox_bootstrap_host }}"
          register: immich_media_inbox_key_reconcile
          changed_when: >-
            (immich_media_inbox_key_reconcile.stdout | from_json).changed
          no_log: true

        - name: Verify live rollback storage before metadata update
          ansible.builtin.command: mountpoint -q /srv/live-rollbacks
          changed_when: false
          when: >-
            immich_media_inbox_key_metadata.permissions | default([]) | sort
            != immich_media_inbox_expected_permissions | sort

        - name: Back up prior Immich API key metadata
          ansible.builtin.command:
            argv:
              - /usr/local/sbin/live-rollback-backup
              - --domain
              - media-inbox
              - --name
              - immich-api-key-metadata-permissions
              - --path
              - "{{ immich_media_inbox_root }}/secrets/immich_api_key.json"
          register: immich_media_inbox_key_metadata_backup
          changed_when: true
          when: >-
            immich_media_inbox_key_metadata.permissions | default([]) | sort
            != immich_media_inbox_expected_permissions | sort

        - name: Record reconciled Immich key permissions and rollback backup
          ansible.builtin.copy:
            content: >-
              {{ immich_media_inbox_key_metadata
                 | combine(immich_media_inbox_metadata_updates, recursive=true)
                 | to_nice_json }}
            dest: "{{ immich_media_inbox_root }}/secrets/immich_api_key.json"
            owner: root
            group: root
            mode: "0600"
          vars:
            immich_media_inbox_reconcile_result: >-
              {{ immich_media_inbox_key_reconcile.stdout | from_json }}
            immich_media_inbox_metadata_updates: >-
              {{
                {'permissions': immich_media_inbox_expected_permissions}
                | combine(
                    {
                      'permissionReconciliation': {
                        'changedAt': now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ'),
                        'previousPermissions':
                          immich_media_inbox_reconcile_result.previous_permissions,
                        'rollbackBackup':
                          immich_media_inbox_reconcile_result.rollback_backup
                      }
                    }
                    if immich_media_inbox_reconcile_result.changed
                    else {}
                  )
              }}
          no_log: true
      always:
        - name: Remove temporary Immich key reconciliation material
          ansible.builtin.file:
            path: "{{ immich_media_inbox_bootstrap_work_dir }}"
            state: absent
          delegate_to: "{{ immich_media_inbox_bootstrap_host }}"

    - name: Deploy Seerr API key export helper
      ansible.builtin.copy:
        src: >-
          {{ immich_media_inbox_repo_root
             }}/scripts/media-inbox/export-seerr-api-key
        dest: "{{ immich_media_inbox_root }}/tools/export-seerr-api-key"
        owner: root
        group: root
        mode: "0700"

    - name: Check whether the protected Seerr key export changed
      ansible.builtin.command:
        argv:
          - "{{ immich_media_inbox_root }}/tools/export-seerr-api-key"
          - --settings
          - /opt/seerr/config/settings.json
          - --output
          - "{{ immich_media_inbox_root }}/secrets/seerr_api_key"
          - --uid
          - "0"
          - --gid
          - "{{ immich_media_inbox_runtime_gid | string }}"
          - --mode
          - "0440"
          - --check
      register: immich_media_inbox_seerr_export_check
      changed_when: false
      no_log: true
      when: not ansible_check_mode

    - name: Check for an existing protected Seerr key export
      ansible.builtin.stat:
        path: "{{ immich_media_inbox_root }}/secrets/seerr_api_key"
      register: immich_media_inbox_seerr_secret

    - name: Verify live rollback storage before Seerr key rotation
      ansible.builtin.command: mountpoint -q /srv/live-rollbacks
      changed_when: false
      when:
        - not ansible_check_mode
        - immich_media_inbox_seerr_secret.stat.exists
        - "'changed=true' in immich_media_inbox_seerr_export_check.stdout"

    - name: Back up prior Seerr key export before rotation
      ansible.builtin.command:
        argv:
          - /usr/local/sbin/live-rollback-backup
          - --domain
          - media-inbox
          - --name
          - seerr-api-key-rotation
          - --path
          - "{{ immich_media_inbox_root }}/secrets/seerr_api_key"
      register: immich_media_inbox_seerr_backup
      changed_when: true
      when:
        - not ansible_check_mode
        - immich_media_inbox_seerr_secret.stat.exists
        - "'changed=true' in immich_media_inbox_seerr_export_check.stdout"

    - name: Export Seerr API key to protected mount file
      ansible.builtin.command:
        argv:
          - "{{ immich_media_inbox_root }}/tools/export-seerr-api-key"
          - --settings
          - /opt/seerr/config/settings.json
          - --output
          - "{{ immich_media_inbox_root }}/secrets/seerr_api_key"
          - --uid
          - "0"
          - --gid
          - "{{ immich_media_inbox_runtime_gid | string }}"
          - --mode
          - "0440"
          - --allow-replace
      register: immich_media_inbox_seerr_export
      changed_when: >-
        'changed=true' in immich_media_inbox_seerr_export.stdout
      no_log: true
      when: not ansible_check_mode

    - name: Deploy Immich Media Inbox application
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: >-
          {{ immich_media_inbox_root
             }}/app/immich_media_inbox/{{ item | basename }}
        owner: root
        group: root
        mode: "0644"
      loop: "{{ immich_media_inbox_app_modules }}"
      loop_control:
        label: "{{ item | basename }}"
      register: immich_media_inbox_app_deploy

    - name: Find deployed Immich Media Inbox application modules
      ansible.builtin.find:
        paths: "{{ immich_media_inbox_root }}/app/immich_media_inbox"
        patterns: "*.py"
        file_type: file
        recurse: false
      register: immich_media_inbox_deployed_modules

    - name: Remove retired Immich Media Inbox application modules
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ immich_media_inbox_deployed_modules.files }}"
      loop_control:
        label: "{{ item.path | basename }}"
      when: >-
        item.path | basename not in immich_media_inbox_app_module_names
      register: immich_media_inbox_retired_module_cleanup

    - name: Remove generated Python bytecode from deployed application
      ansible.builtin.file:
        path: >-
          {{ immich_media_inbox_root
             }}/app/immich_media_inbox/__pycache__
        state: absent
      register: immich_media_inbox_bytecode_cleanup

    - name: Deploy Astra candidate-scoped command wrapper
      ansible.builtin.template:
        src: >-
          {{ immich_media_inbox_repo_root
             }}/templates/media-inbox/immich-media-inbox-cli.sh.j2
        dest: /usr/local/sbin/immich-media-inbox
        owner: root
        group: root
        mode: "0755"

    # Sudoers command specifications cannot be folded across physical lines.
    # yamllint disable rule:line-length
    - name: Allow dbc to run only the Immich Media Inbox wrapper
      ansible.builtin.copy:
        dest: /etc/sudoers.d/immich-media-inbox-dbc
        owner: root
        group: root
        mode: "0440"
        validate: "visudo -cf %s"
        content: |
          # Astra candidate-scoped media inbox access. The root-owned wrapper
          # validates every dynamic argument; image export requires a live
          # cloud-analysis claim in application state.
          dbc ALL=(root) NOPASSWD: /usr/local/sbin/immich-media-inbox status
          dbc ALL=(root) NOPASSWD: /usr/local/sbin/immich-media-inbox list
          dbc ALL=(root) NOPASSWD: /usr/local/sbin/immich-media-inbox list *
          dbc ALL=(root) NOPASSWD: /usr/local/sbin/immich-media-inbox show *
          dbc ALL=(root) NOPASSWD: /usr/local/sbin/immich-media-inbox search *
          dbc ALL=(root) NOPASSWD: /usr/local/sbin/immich-media-inbox set-status *
          dbc ALL=(root) NOPASSWD: /usr/local/sbin/immich-media-inbox request *
          dbc ALL=(root) NOPASSWD: /usr/local/sbin/immich-media-inbox claim-cloud
          dbc ALL=(root) NOPASSWD: /usr/local/sbin/immich-media-inbox export-image *
          dbc ALL=(root) NOPASSWD: /usr/local/sbin/immich-media-inbox submit-analysis *
          dbc ALL=(root) NOPASSWD: /usr/local/sbin/immich-media-inbox fail-cloud *
    # yamllint enable rule:line-length

    - name: Deploy Immich Media Inbox Compose file
      ansible.builtin.template:
        src: >-
          {{ immich_media_inbox_repo_root
             }}/templates/media-inbox/docker-compose.yml.j2
        dest: "{{ immich_media_inbox_root }}/docker-compose.yml"
        owner: root
        group: root
        mode: "0600"
        validate: "/usr/bin/docker compose -f %s config --quiet"
      register: immich_media_inbox_compose_deploy

    - name: Ensure caddy-proxy Docker network exists
      ansible.builtin.command: docker network inspect caddy-proxy
      changed_when: false
      when: not ansible_check_mode

    - name: Start isolated CPU-only Ollama runtime
      community.docker.docker_compose_v2:
        project_src: "{{ immich_media_inbox_root }}"
        services:
          - ollama
        state: present
      when: not ansible_check_mode

    - name: Verify Ollama has no GPU or host device access
      ansible.builtin.command:
        argv:
          - docker
          - inspect
          - --format
          - >-
            {{ '{{json .HostConfig.DeviceRequests}}|'
               ~ '{{json .HostConfig.Devices}}|'
               ~ '{{.HostConfig.Memory}}|{{.HostConfig.NanoCpus}}' }}
          - immich-media-inbox-ollama
      register: immich_media_inbox_ollama_isolation
      changed_when: false
      when: not ansible_check_mode

    - name: Assert CPU-only Ollama resource boundary
      ansible.builtin.assert:
        that:
          - >-
            immich_media_inbox_ollama_isolation.stdout.split('|')[0]
            in ['null', '[]']
          - >-
            immich_media_inbox_ollama_isolation.stdout.split('|')[1]
            in ['null', '[]']
          - >-
            immich_media_inbox_ollama_isolation.stdout.split('|')[2] | int
            == 3221225472
          - >-
            immich_media_inbox_ollama_isolation.stdout.split('|')[3] | int
            == 4000000000
        fail_msg: >-
          Ollama must have zero GPU/device requests, a 3 GiB memory cap, and a
          four-CPU quota before candidate analysis starts.
      when: not ansible_check_mode

    - name: Pull selected CPU vision model through temporary egress
      when: not ansible_check_mode
      block:
        - name: Attach Ollama to an empty temporary egress network
          community.docker.docker_network:
            name: immich-media-inbox-model-pull
            driver: bridge
            internal: false
            connected:
              - immich-media-inbox-ollama
            appends: true
            state: present

        - name: Pull selected CPU vision model
          ansible.builtin.command:
            argv:
              - docker
              - compose
              - exec
              - -T
              - ollama
              - ollama
              - pull
              - "{{ immich_media_inbox_ollama_model }}"
          args:
            chdir: "{{ immich_media_inbox_root }}"
          register: immich_media_inbox_ollama_pull
          changed_when: >-
            'pulling manifest' in immich_media_inbox_ollama_pull.stdout
      always:
        - name: Remove temporary Ollama model-pull network
          community.docker.docker_network:
            name: immich-media-inbox-model-pull
            state: absent
            force: true
          when: not ansible_check_mode

    - name: Verify Ollama returned to its internal-only network
      ansible.builtin.command:
        argv:
          - docker
          - inspect
          - --format
          - "{{ '{{json .NetworkSettings.Networks}}' }}"
          - immich-media-inbox-ollama
      register: immich_media_inbox_ollama_networks
      changed_when: false
      when: not ansible_check_mode

    - name: Assert Ollama steady-state network isolation
      ansible.builtin.assert:
        that:
          - >-
            (immich_media_inbox_ollama_networks.stdout | from_json).keys()
            | list == ['immich-media-inbox-model-runtime']
        fail_msg: >-
          Ollama must return to only its private internal network before any
          candidate image can be analyzed.
      when: not ansible_check_mode

    - name: Start Immich Media Inbox
      community.docker.docker_compose_v2:
        project_src: "{{ immich_media_inbox_root }}"
        state: present
        recreate: >-
          {{ 'always'
             if (immich_media_inbox_app_deploy.changed
                 or immich_media_inbox_retired_module_cleanup.changed
                 or immich_media_inbox_bytecode_cleanup.changed
                 or immich_media_inbox_compose_deploy.changed
                 or (immich_media_inbox_seerr_export.changed | default(false)))
             else 'auto' }}
      when: not ansible_check_mode

    - name: Wait for a successful review-only scan cycle
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - exec
          - -T
          - media-inbox
          - python
          - -m
          - immich_media_inbox.cli
          - status
          - --healthcheck
      args:
        chdir: "{{ immich_media_inbox_root }}"
      register: immich_media_inbox_ready
      changed_when: false
      retries: 120
      delay: 5
      until:
        - immich_media_inbox_ready.rc == 0
        - >-
          (immich_media_inbox_ready.stdout | from_json).scan_state == 'idle'
        - >-
          (immich_media_inbox_ready.stdout | from_json).pipeline_version
          ==
          (
            immich_media_inbox_ready.stdout
            | from_json
          ).expected_pipeline_version
      when: not ansible_check_mode

    - name: Validate review-only health policy
      ansible.builtin.assert:
        that:
          - (immich_media_inbox_ready.stdout | from_json).ok
          - >-
            (immich_media_inbox_ready.stdout | from_json).scan_state == 'idle'
          - >-
            (immich_media_inbox_ready.stdout | from_json).pipeline_version
            ==
            (
              immich_media_inbox_ready.stdout
              | from_json
            ).expected_pipeline_version
          - not ((immich_media_inbox_ready.stdout | from_json).requests_enabled)
          - >-
            (immich_media_inbox_ready.stdout | from_json).allowed_visibilities
            | sort == ['archive', 'timeline']
      when: not ansible_check_mode

    - name: Exercise Astra result-only SSH path
      ansible.builtin.command:
        argv:
          - ssh
          - -o
          - BatchMode=yes
          - -o
          - ConnectTimeout=8
          - "{{ immich_media_inbox_astra_ssh_target }}"
          - >-
            sudo -n /usr/local/sbin/immich-media-inbox list --limit 1
      delegate_to: "{{ immich_media_inbox_astra_controller }}"
      become: false
      register: immich_media_inbox_astra_result
      changed_when: false
      when: not ansible_check_mode

    - name: Verify Astra output contains results but no source content
      ansible.builtin.assert:
        that:
          - (immich_media_inbox_astra_result.stdout | from_json).ok
          - "'ocr_text' not in immich_media_inbox_astra_result.stdout"
          - "'filename' not in immich_media_inbox_astra_result.stdout"
          - "'thumbnail' not in immich_media_inbox_astra_result.stdout"
          - "'api_key' not in immich_media_inbox_astra_result.stdout"
      when: not ansible_check_mode

    - name: Deploy candidate-scoped GPT-5.6 worker
      ansible.builtin.copy:
        src: >-
          {{ immich_media_inbox_repo_root
             }}/scripts/media-inbox/run-cloud-analysis
        dest: "{{ immich_media_inbox_cloud_worker_path }}"
        owner: root
        group: root
        mode: "0755"
      delegate_to: "{{ immich_media_inbox_astra_controller }}"
      register: immich_media_inbox_cloud_worker_deploy

    - name: Deploy candidate-scoped GPT-5.6 service
      ansible.builtin.template:
        src: >-
          {{ immich_media_inbox_repo_root
             }}/templates/media-inbox/immich-media-inbox-cloud.service.j2
        dest: /etc/systemd/system/immich-media-inbox-cloud.service
        owner: root
        group: root
        mode: "0644"
      delegate_to: "{{ immich_media_inbox_astra_controller }}"
      register: immich_media_inbox_cloud_service_deploy

    - name: Deploy candidate-scoped GPT-5.6 timer
      ansible.builtin.template:
        src: >-
          {{ immich_media_inbox_repo_root
             }}/templates/media-inbox/immich-media-inbox-cloud.timer.j2
        dest: /etc/systemd/system/immich-media-inbox-cloud.timer
        owner: root
        group: root
        mode: "0644"
      delegate_to: "{{ immich_media_inbox_astra_controller }}"
      register: immich_media_inbox_cloud_timer_deploy

    - name: Validate candidate-scoped GPT-5.6 systemd units
      ansible.builtin.command:
        argv:
          - systemd-analyze
          - verify
          - /etc/systemd/system/immich-media-inbox-cloud.service
          - /etc/systemd/system/immich-media-inbox-cloud.timer
      delegate_to: "{{ immich_media_inbox_astra_controller }}"
      changed_when: false
      when: not ansible_check_mode

    - name: Enable automatic GPT-5.6 candidate escalation timer
      ansible.builtin.systemd_service:
        name: immich-media-inbox-cloud.timer
        enabled: true
        state: started
        daemon_reload: >-
          {{ immich_media_inbox_cloud_service_deploy.changed
             or immich_media_inbox_cloud_timer_deploy.changed }}
      delegate_to: "{{ immich_media_inbox_astra_controller }}"
      when: not ansible_check_mode
