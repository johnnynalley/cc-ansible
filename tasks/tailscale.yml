# =============================================================================
# Tailscale Installation Tasks (Linux)
# =============================================================================
# Uses curl to avoid Python HTTPS stack issues on some systems

- name: Decide Tailscale repo OS family
  ansible.builtin.set_fact:
    tailscale_repo_os: >-
      {{
        'ubuntu' if ansible_facts.distribution == 'Ubuntu'
        else 'raspbian' if (ansible_facts.distribution | lower) in ['raspbian', 'raspberry pi os']
        else 'debian'
      }}
  when: ansible_facts.os_family == "Debian"

- name: Ensure prereqs for repo install (Debian)
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true
  when: ansible_facts.os_family == "Debian"

- name: Ensure keyrings dir exists
  ansible.builtin.file:
    path: /usr/share/keyrings
    state: directory
    mode: "0755"
  when: ansible_facts.os_family == "Debian"

- name: Download Tailscale keyring (Debian)
  ansible.builtin.shell: |
    set -euo pipefail
    url="https://pkgs.tailscale.com/stable/{{ tailscale_repo_os }}/{{ ansible_facts.distribution_release }}.noarmor.gpg"
    dest="/usr/share/keyrings/tailscale-archive-keyring.gpg"
    tmp="$(mktemp)"
    curl -fsSL "$url" -o "$tmp"
    if [ ! -f "$dest" ] || ! cmp -s "$tmp" "$dest"; then
      install -m 0644 "$tmp" "$dest"
      echo CHANGED
    fi
    rm -f "$tmp"
  args:
    executable: /bin/bash
  register: tailscale_key_dl
  changed_when: "'CHANGED' in tailscale_key_dl.stdout"
  when: ansible_facts.os_family == "Debian"

- name: Download Tailscale apt source list (Debian)
  ansible.builtin.shell: |
    set -euo pipefail
    url="https://pkgs.tailscale.com/stable/{{ tailscale_repo_os }}/{{ ansible_facts.distribution_release }}.tailscale-keyring.list"
    dest="/etc/apt/sources.list.d/tailscale.list"
    tmp="$(mktemp)"
    curl -fsSL "$url" -o "$tmp"
    if [ ! -f "$dest" ] || ! cmp -s "$tmp" "$dest"; then
      install -m 0644 "$tmp" "$dest"
      echo CHANGED
    fi
    rm -f "$tmp"
  args:
    executable: /bin/bash
  register: tailscale_list_dl
  changed_when: "'CHANGED' in tailscale_list_dl.stdout"
  when: ansible_facts.os_family == "Debian"

- name: Update apt cache if repo files changed (Debian)
  ansible.builtin.apt:
    update_cache: true
  when:
    - ansible_facts.os_family == "Debian"
    - tailscale_key_dl.changed or tailscale_list_dl.changed

- name: Check Tailscale apt source availability (Debian)
  ansible.builtin.stat:
    path: /etc/apt/sources.list.d/tailscale.list
  register: tailscale_apt_source
  when: ansible_facts.os_family == "Debian"

- name: Install/Update tailscale package (Debian)
  ansible.builtin.apt:
    name: tailscale
    state: "{{ tailscale_pkg_state | default('present') }}"
  when:
    - ansible_facts.os_family == "Debian"
    - not ansible_check_mode or tailscale_apt_source.stat.exists

- name: Report skipped Tailscale package check (Debian check mode)
  ansible.builtin.debug:
    msg: "Skipping tailscale package validation in check mode because the Tailscale apt source is not installed yet."
  when:
    - ansible_facts.os_family == "Debian"
    - ansible_check_mode
    - not tailscale_apt_source.stat.exists

- name: Install tailscale (Arch)
  community.general.pacman:
    name: tailscale
    state: "{{ tailscale_pkg_state | default('present') }}"
  when: ansible_facts.os_family == "Archlinux"

- name: Enable + start tailscaled (Linux)
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started
  when: ansible_facts.os_family != "Darwin"

- name: Check Tailscale backend state
  ansible.builtin.shell: |
    set -o pipefail
    tailscale status --json 2>/dev/null | python3 -c 'import json,sys; print(json.load(sys.stdin).get("BackendState", ""))'
  args:
    executable: /bin/bash
  register: tailscale_backend_state
  changed_when: false
  failed_when: false
  check_mode: false
  when: ansible_facts.os_family != "Darwin"

- name: Collect Tailscale auth inputs
  ansible.builtin.set_fact:
    tailscale_direct_auth_key: "{{ tailscale_auth_key | default(vault_tailscale_auth_key | default('')) }}"
    tailscale_oauth_secret: "{{ tailscale_oauth_client_secret | default(vault_tailscale_oauth_client_secret | default('')) }}"
    tailscale_auth_tags_value: "{{ tailscale_advertise_tags | default(tailscale_auth_key_tags | default([])) }}"
  no_log: true
  when: ansible_facts.os_family != "Darwin"

- name: Normalize Tailscale auth mode
  ansible.builtin.set_fact:
    tailscale_auth_mode: >-
      {{
        'direct' if (tailscale_direct_auth_key | default('') | length > 0)
        else ('oauth' if (tailscale_oauth_secret | default('') | length > 0) else 'none')
      }}
    tailscale_auth_tags_csv: >-
      {{
        tailscale_auth_tags_value | join(',')
        if (tailscale_auth_tags_value is sequence and tailscale_auth_tags_value is not string)
        else tailscale_auth_tags_value
      }}
  no_log: true
  when: ansible_facts.os_family != "Darwin"
- name: Normalize Tailscale advertised tag order
  ansible.builtin.set_fact:
    tailscale_auth_tags_sorted_csv: >-
      {{
        (tailscale_auth_tags_csv | string).split(',')
        | map('trim')
        | reject('equalto', '')
        | sort
        | join(',')
      }}
  no_log: true
  when: ansible_facts.os_family != "Darwin"

- name: Normalize Tailscale advertised route preferences
  ansible.builtin.set_fact:
    tailscale_advertise_routes_normalized: >-
      {{
        (
          tailscale_advertise_routes
          if tailscale_advertise_routes is sequence
          and tailscale_advertise_routes is not string
          else (tailscale_advertise_routes | string).split(',')
        )
        | map('trim')
        | reject('equalto', '')
        | sort
        | list
      }}
    tailscale_accept_routes_desired: >-
      {{
        (tailscale_accept_routes | default(false) | bool)
        | ternary('true', 'false')
      }}
    tailscale_snat_subnet_routes_desired: >-
      {{
        (tailscale_snat_subnet_routes | default(true) | bool)
        | ternary('true', 'false')
      }}
  when:
    - ansible_facts.os_family != "Darwin"
    - tailscale_advertise_routes is defined

- name: Format Tailscale advertised routes
  ansible.builtin.set_fact:
    tailscale_advertise_routes_csv: >-
      {{ tailscale_advertise_routes_normalized | join(',') }}
  when:
    - ansible_facts.os_family != "Darwin"
    - tailscale_advertise_routes is defined

- name: Normalize Tailscale peer relay preferences
  ansible.builtin.set_fact:
    tailscale_peer_relay_port_desired: >-
      {{
        (tailscale_peer_relay_port | string)
        if (tailscale_peer_relay_enabled | default(false) | bool)
        else ''
      }}
    tailscale_peer_relay_static_endpoints_normalized: >-
      {{
        (
          tailscale_peer_relay_static_endpoints | default([])
          if (
            tailscale_peer_relay_static_endpoints | default([])
          ) is sequence
          and (
            tailscale_peer_relay_static_endpoints | default([])
          ) is not string
          else (
            tailscale_peer_relay_static_endpoints | default('') | string
          ).split(',')
        )
        | map('trim')
        | reject('equalto', '')
        | sort
        | list
      }}
  when:
    - ansible_facts.os_family != "Darwin"
    - tailscale_manage_peer_relay | default(false) | bool

- name: Format Tailscale peer relay static endpoints
  ansible.builtin.set_fact:
    tailscale_peer_relay_static_endpoints_desired: >-
      {{
        (
          tailscale_peer_relay_static_endpoints_normalized
          if (tailscale_peer_relay_enabled | default(false) | bool)
          else []
        )
        | join(',')
      }}
  when:
    - ansible_facts.os_family != "Darwin"
    - tailscale_manage_peer_relay | default(false) | bool

- name: Use configured Tailscale auth key
  ansible.builtin.set_fact:
    tailscale_effective_auth_key: "{{ tailscale_direct_auth_key }}"
  no_log: true
  when:
    - ansible_facts.os_family != "Darwin"
    - tailscale_auth_mode == "direct"

- name: Use Tailscale OAuth client secret for unattended auth
  ansible.builtin.set_fact:
    tailscale_effective_auth_key: >-
      {{ tailscale_oauth_secret }}?ephemeral={{ tailscale_auth_key_ephemeral | default(false) | bool | string | lower }}&preauthorized={{ tailscale_auth_key_preauthorized | default(true) | bool | string | lower }}
  no_log: true
  when:
    - ansible_facts.os_family != "Darwin"
    - tailscale_auth_mode == "oauth"

- name: Require tags for OAuth-based Tailscale auth
  ansible.builtin.fail:
    msg: "Set tailscale_advertise_tags or tailscale_auth_key_tags when using a Tailscale OAuth client secret."
  when:
    - ansible_facts.os_family != "Darwin"
    - (tailscale_backend_state.stdout | default('')) != 'Running'
    - tailscale_auto_enroll | default(false) | bool
    - tailscale_auth_mode == "oauth"
    - (tailscale_auth_tags_csv | default('') | string | length) == 0

- name: Authenticate Tailscale without browser login
  ansible.builtin.shell: >-
    tailscale up
    --auth-key={{ tailscale_effective_auth_key | quote }}
    --hostname={{ (tailscale_hostname | default(inventory_hostname)) | quote }}
    {% if tailscale_ssh_enabled | default(true) %}--ssh{% endif %}
    {% if (tailscale_auth_tags_csv | default('') | string | length) > 0 %}--advertise-tags={{ tailscale_auth_tags_csv | quote }}{% endif %}
  args:
    executable: /bin/bash
  no_log: true
  when:
    - ansible_facts.os_family != "Darwin"
    - (tailscale_backend_state.stdout | default('')) != 'Running'
    - tailscale_auto_enroll | default(false) | bool
    - tailscale_auth_mode in ["direct", "oauth"]

- name: Report missing Tailscale unattended auth
  ansible.builtin.debug:
    msg: "Tailscale is not authenticated and no unattended auth variable is configured. Add vault_tailscale_oauth_client_secret plus tailscale_advertise_tags, or add vault_tailscale_auth_key."
  when:
    - ansible_facts.os_family != "Darwin"
    - (tailscale_backend_state.stdout | default('')) != 'Running'
    - tailscale_auto_enroll | default(false) | bool
    - tailscale_auth_mode == "none"

- name: Report skipped Tailscale auto-enrollment
  ansible.builtin.debug:
    msg: "Tailscale is not authenticated/running; leaving this host's Tailscale identity alone because tailscale_auto_enroll is false."
  when:
    - ansible_facts.os_family != "Darwin"
    - (tailscale_backend_state.stdout | default('')) != 'Running'
    - not (tailscale_auto_enroll | default(false) | bool)

- name: Refresh Tailscale backend state after auth
  ansible.builtin.shell: |
    set -o pipefail
    tailscale status --json 2>/dev/null | python3 -c 'import json,sys; print(json.load(sys.stdin).get("BackendState", ""))'
  args:
    executable: /bin/bash
  register: tailscale_backend_state_after_auth
  changed_when: false
  failed_when: false
  check_mode: false
  when: ansible_facts.os_family != "Darwin"

- name: Check Tailscale advertised tags
  ansible.builtin.shell: |
    set -o pipefail
    tailscale debug prefs | python3 -c 'import json,sys; print(",".join(sorted(json.load(sys.stdin).get("AdvertiseTags", []))))'
  args:
    executable: /bin/bash
  register: tailscale_advertise_tags_current
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - ansible_facts.os_family != "Darwin"
    - tailscale_manage_preferences | default(false) | bool
    - (tailscale_backend_state_after_auth.stdout | default(tailscale_backend_state.stdout | default(''))) == "Running"

- name: Check Tailscale advertised routes
  ansible.builtin.shell: |
    set -o pipefail
    tailscale debug prefs | python3 -c '
    import json, sys
    prefs = json.load(sys.stdin)
    print(",".join(sorted(prefs.get("AdvertiseRoutes") or [])))
    '
  args:
    executable: /bin/bash
  register: tailscale_advertise_routes_current
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - ansible_facts.os_family != "Darwin"
    - tailscale_manage_preferences | default(false) | bool
    - tailscale_advertise_routes is defined
    - >-
      (
        tailscale_backend_state_after_auth.stdout
        | default(tailscale_backend_state.stdout | default(''))
      ) == "Running"

- name: Check Tailscale accept-routes preference
  ansible.builtin.shell: |
    set -o pipefail
    tailscale debug prefs | python3 -c '
    import json, sys
    prefs = json.load(sys.stdin)
    print(str(prefs.get("RouteAll", False)).lower())
    '
  args:
    executable: /bin/bash
  register: tailscale_accept_routes_current
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - ansible_facts.os_family != "Darwin"
    - tailscale_manage_preferences | default(false) | bool
    - tailscale_advertise_routes is defined
    - >-
      (
        tailscale_backend_state_after_auth.stdout
        | default(tailscale_backend_state.stdout | default(''))
      ) == "Running"

- name: Check Tailscale subnet-route SNAT preference
  ansible.builtin.shell: |
    set -o pipefail
    tailscale debug prefs | python3 -c '
    import json, sys
    prefs = json.load(sys.stdin)
    print(str(not bool(prefs.get("NoSNAT", False))).lower())
    '
  args:
    executable: /bin/bash
  register: tailscale_snat_subnet_routes_current
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - ansible_facts.os_family != "Darwin"
    - tailscale_manage_preferences | default(false) | bool
    - tailscale_advertise_routes is defined
    - >-
      (
        tailscale_backend_state_after_auth.stdout
        | default(tailscale_backend_state.stdout | default(''))
      ) == "Running"

- name: Configure Tailscale advertised routes
  ansible.builtin.command: >-
    tailscale set
    --advertise-routes={{ tailscale_advertise_routes_csv | quote }}
    --accept-routes={{ tailscale_accept_routes_desired }}
    --snat-subnet-routes={{ tailscale_snat_subnet_routes_desired }}
  register: tailscale_advertise_routes_set
  changed_when: true
  when:
    - ansible_facts.os_family != "Darwin"
    - tailscale_manage_preferences | default(false) | bool
    - tailscale_advertise_routes is defined
    - >-
      (
        tailscale_backend_state_after_auth.stdout
        | default(tailscale_backend_state.stdout | default(''))
      ) == "Running"
    - >-
      (
        tailscale_advertise_routes_current.stdout | default('')
      ) != tailscale_advertise_routes_csv
      or (
        tailscale_accept_routes_current.stdout | default('')
      ) != tailscale_accept_routes_desired
      or (
        tailscale_snat_subnet_routes_current.stdout | default('')
      ) != tailscale_snat_subnet_routes_desired

- name: Check Tailscale peer relay server port
  ansible.builtin.shell: |
    set -o pipefail
    tailscale debug prefs | python3 -c '
    import json, sys
    prefs = json.load(sys.stdin)
    print(prefs.get("RelayServerPort") or "")
    '
  args:
    executable: /bin/bash
  register: tailscale_peer_relay_port_current
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - ansible_facts.os_family != "Darwin"
    - tailscale_manage_preferences | default(false) | bool
    - tailscale_manage_peer_relay | default(false) | bool
    - >-
      (
        tailscale_backend_state_after_auth.stdout
        | default(tailscale_backend_state.stdout | default(''))
      ) == "Running"

- name: Check Tailscale peer relay static endpoints
  ansible.builtin.shell: |
    set -o pipefail
    tailscale debug prefs | python3 -c '
    import json, sys
    prefs = json.load(sys.stdin)
    endpoints = prefs.get("RelayServerStaticEndpoints") or []
    if isinstance(endpoints, str):
        endpoints = [item.strip() for item in endpoints.split(",")]
    print(",".join(sorted(item for item in endpoints if item)))
    '
  args:
    executable: /bin/bash
  register: tailscale_peer_relay_static_endpoints_current
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - ansible_facts.os_family != "Darwin"
    - tailscale_manage_preferences | default(false) | bool
    - tailscale_manage_peer_relay | default(false) | bool
    - >-
      (
        tailscale_backend_state_after_auth.stdout
        | default(tailscale_backend_state.stdout | default(''))
      ) == "Running"

- name: Configure Tailscale peer relay
  ansible.builtin.command: >-
    tailscale set
    --relay-server-port={{ tailscale_peer_relay_port_desired | quote }}
    --relay-server-static-endpoints={{
      tailscale_peer_relay_static_endpoints_desired | quote
    }}
  register: tailscale_peer_relay_set
  changed_when: true
  when:
    - ansible_facts.os_family != "Darwin"
    - tailscale_manage_preferences | default(false) | bool
    - tailscale_manage_peer_relay | default(false) | bool
    - >-
      (
        tailscale_backend_state_after_auth.stdout
        | default(tailscale_backend_state.stdout | default(''))
      ) == "Running"
    - >-
      (
        tailscale_peer_relay_port_current.stdout | default('')
      ) != tailscale_peer_relay_port_desired
      or (
        tailscale_peer_relay_static_endpoints_current.stdout | default('')
      ) != tailscale_peer_relay_static_endpoints_desired

- name: Check Tailscale hostname preference
  ansible.builtin.shell: |
    set -o pipefail
    tailscale debug prefs | python3 -c 'import json,sys; print(json.load(sys.stdin).get("Hostname", ""))'
  args:
    executable: /bin/bash
  register: tailscale_hostname_current
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - ansible_facts.os_family != "Darwin"
    - tailscale_manage_preferences | default(false) | bool
    - tailscale_hostname is defined
    - (tailscale_backend_state_after_auth.stdout | default(tailscale_backend_state.stdout | default(''))) == "Running"

- name: Configure Tailscale hostname preference
  ansible.builtin.command: >-
    tailscale set --hostname={{ (tailscale_hostname | default(inventory_hostname)) | quote }}
  register: tailscale_hostname_set
  changed_when: true
  when:
    - ansible_facts.os_family != "Darwin"
    - tailscale_manage_preferences | default(false) | bool
    - tailscale_hostname is defined
    - (tailscale_backend_state_after_auth.stdout | default(tailscale_backend_state.stdout | default(''))) == "Running"
    - (tailscale_hostname_current.stdout | default('')) != tailscale_hostname

- name: Report skipped live Tailscale tag update
  ansible.builtin.debug:
    msg: "Configured Tailscale advertised tags differ, but live tag mutation is disabled. Set tailscale_manage_advertise_tags=true only for hosts that should be retagged in-place."
  when:
    - ansible_facts.os_family != "Darwin"
    - tailscale_manage_preferences | default(false) | bool
    - not (tailscale_manage_advertise_tags | default(false) | bool)
    - (tailscale_backend_state_after_auth.stdout | default(tailscale_backend_state.stdout | default(''))) == "Running"
    - (tailscale_auth_tags_csv | default('') | string | length) > 0
    - (tailscale_advertise_tags_current.stdout | default('')) != (tailscale_auth_tags_sorted_csv | default(''))

- name: Configure Tailscale advertised tags
  ansible.builtin.command: >-
    tailscale up
    --hostname={{ (tailscale_hostname | default(inventory_hostname)) | quote }}
    --accept-dns={{ (tailscale_accept_dns | default(true) | bool) | ternary('true', 'false') }}
    --accept-routes={{ (tailscale_accept_routes | default(false) | bool) | ternary('true', 'false') }}
    --advertise-tags={{ tailscale_auth_tags_csv | quote }}
    --ssh={{ (tailscale_ssh_enabled | default(true) | bool) | ternary('true', 'false') }}
    {% if tailscale_ssh_enabled | default(true) | bool %}--accept-risk=lose-ssh{% endif %}
  register: tailscale_advertise_tags_set
  changed_when: true
  when:
    - ansible_facts.os_family != "Darwin"
    - tailscale_manage_preferences | default(false) | bool
    - tailscale_manage_advertise_tags | default(false) | bool
    - (tailscale_backend_state_after_auth.stdout | default(tailscale_backend_state.stdout | default(''))) == "Running"
    - (tailscale_auth_tags_csv | default('') | string | length) > 0
    - (tailscale_advertise_tags_current.stdout | default('')) != (tailscale_auth_tags_sorted_csv | default(''))

- name: Check Tailscale SSH preference
  ansible.builtin.shell: |
    set -o pipefail
    tailscale debug prefs | python3 -c 'import json,sys; print(str(json.load(sys.stdin).get("RunSSH", False)).lower())'
  args:
    executable: /bin/bash
  register: tailscale_ssh_preference
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - ansible_facts.os_family != "Darwin"
    - tailscale_manage_preferences | default(false) | bool
    - (tailscale_backend_state_after_auth.stdout | default(tailscale_backend_state.stdout | default(''))) == "Running"

- name: Configure Tailscale SSH preference
  ansible.builtin.command: >-
    tailscale set --ssh={{ (tailscale_ssh_enabled | default(true) | bool) | ternary('true', 'false') }} {% if tailscale_ssh_enabled | default(true) | bool %}--accept-risk=lose-ssh{% endif %}
  register: tailscale_ssh_set
  changed_when: true
  when:
    - ansible_facts.os_family != "Darwin"
    - tailscale_manage_preferences | default(false) | bool
    - (tailscale_backend_state_after_auth.stdout | default(tailscale_backend_state.stdout | default(''))) == "Running"
    - (tailscale_ssh_preference.stdout | default('')) != ((tailscale_ssh_enabled | default(true) | bool) | ternary('true', 'false'))

- name: Create tailscaled systemd override directory
  ansible.builtin.file:
    path: /etc/systemd/system/tailscaled.service.d
    state: directory
    mode: "0755"
  when:
    - ansible_facts.os_family != "Darwin"
    - tailscale_manage_service_policy | default(false) | bool

- name: Configure tailscaled restart policy
  ansible.builtin.copy:
    dest: /etc/systemd/system/tailscaled.service.d/restart-policy.conf
    content: |
      [Service]
      Restart=always
      RestartSec=5
      TimeoutStartSec=90
    mode: "0644"
  when:
    - ansible_facts.os_family != "Darwin"
    - tailscale_manage_service_policy | default(false) | bool
  register: tailscale_restart_policy

- name: Reload systemd if restart policy changed
  ansible.builtin.systemd:
    daemon_reload: true
  when:
    - ansible_facts.os_family != "Darwin"
    - tailscale_restart_policy.changed

- name: Report tailscale version
  ansible.builtin.command: tailscale version
  register: tailscale_version
  changed_when: false
  failed_when: false
  check_mode: false

- name: Print tailscale status
  ansible.builtin.debug:
    msg:
      - "repo_os={{ tailscale_repo_os | default('N/A') }}"
      - "release={{ ansible_facts.distribution_release | default('N/A') }}"
      - "pkg_state={{ tailscale_pkg_state | default('present') }}"
      - "version={{ tailscale_version.stdout | default('unknown') }}"
