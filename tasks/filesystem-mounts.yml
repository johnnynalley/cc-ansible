# =============================================================================
# Filesystem Mounts (NTFS, exFAT, etc.)
# =============================================================================
# For local drives that aren't NFS
# Expects variable: filesystem_mounts (list of mount definitions)

- name: Install NTFS support (Debian)
  ansible.builtin.apt:
    name: ntfs-3g
    state: present
  when:
    - ansible_facts.os_family == "Debian"
    - filesystem_mounts | selectattr('fstype', 'match', 'ntfs.*') | list | length > 0

- name: Install NTFS support (Arch)
  community.general.pacman:
    name: ntfs-3g
    state: present
  when:
    - ansible_facts.os_family == "Archlinux"
    - filesystem_mounts | selectattr('fstype', 'match', 'ntfs.*') | list | length > 0

- name: Check which mount points are already mounted
  ansible.builtin.command:
    cmd: findmnt -n {{ item.path }}
  register: fsmount_check
  loop: "{{ filesystem_mounts }}"
  loop_control:
    label: "{{ item.path }}"
  changed_when: false
  failed_when: false

- name: Create mount point directories (skip already-mounted)
  ansible.builtin.file:
    path: "{{ item.item.path }}"
    state: directory
    owner: "{{ item.item.owner | default('root') }}"
    group: "{{ item.item.group | default('root') }}"
    mode: "{{ item.item.mode | default('0755') }}"
  loop: "{{ fsmount_check.results }}"
  loop_control:
    label: "{{ item.item.path }}"
  when: item.rc != 0

- name: Mount filesystems
  ansible.posix.mount:
    path: "{{ item.path }}"
    src: "{{ item.src }}"
    fstype: "{{ item.fstype }}"
    opts: "{{ item.opts | default('defaults,nofail') }}"
    state: mounted
  loop: "{{ filesystem_mounts }}"

- name: Remove retired filesystem mounts
  ansible.posix.mount:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ filesystem_mounts_absent | default([]) }}"
  loop_control:
    label: "{{ item.path }}"

- name: Check ext filesystem reserved block settings
  ansible.builtin.command:
    cmd: "tune2fs -l {{ item.src }}"
  register: ext_reserved_block_info
  loop: "{{ filesystem_mounts | selectattr('reserved_blocks_percentage', 'defined') | list }}"
  loop_control:
    label: "{{ item.path }}"
  changed_when: false
  failed_when: false
  check_mode: false
  when: item.fstype is match('ext.*')

- name: Set ext filesystem reserved block percentage
  ansible.builtin.command:
    cmd: "tune2fs -m {{ item.item.reserved_blocks_percentage }} {{ item.item.src }}"
  loop: "{{ ext_reserved_block_info.results | default([]) }}"
  loop_control:
    label: "{{ item.item.path }}"
  when:
    - item.rc == 0
    - item.item.fstype is match('ext.*')
    - >-
      (item.stdout | regex_search('Reserved block count:\\s+(\\d+)', '\\1') | default(['0'], true) | first | int)
      !=
      (((item.stdout | regex_search('Block count:\\s+(\\d+)', '\\1') | default(['0'], true) | first | int)
      * (item.item.reserved_blocks_percentage | float) / 100)
      | round(0, 'floor') | int)
