# =============================================================================
# NFS Server Tasks
# =============================================================================
# Sets up NFSv4 exports with pseudo-root filesystem
# Expects variables:
#   nfs_exports: list of export definitions
#   nfs_pseudo_root: path to NFSv4 pseudo-root (default: /srv)

- name: Install NFS server packages
  ansible.builtin.apt:
    name:
      - nfs-kernel-server
      - nfs-common
    state: present
    update_cache: true

- name: Ensure NFSv4 pseudo-root directory exists
  ansible.builtin.file:
    path: "{{ nfs_pseudo_root | default('/srv') }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create export subdirectories under pseudo-root
  ansible.builtin.file:
    path: "{{ nfs_pseudo_root | default('/srv') }}/{{ item.name }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode | default('0755') }}"
  loop: "{{ nfs_exports | default([]) }}"
  when:
    - item.bind_source is defined
    - (nfs_pseudo_root | default('/srv') ~ '/' ~ item.name) != item.bind_source

- name: Inspect NFS export bind sources
  ansible.builtin.command:
    argv:
      - /usr/bin/findmnt
      - --target
      - "{{ item.bind_source }}"
      - --output
      - SOURCE,FSTYPE
      - --noheadings
  loop: "{{ nfs_exports | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.bind_source is defined
  register: nfs_export_bind_sources
  changed_when: false
  check_mode: false

- name: Require intended NFS export source filesystems
  ansible.builtin.assert:
    that:
      - item.rc == 0
      - item.stdout.split() | length == 2
      - >-
        item.item.bind_source_name is not defined
        or item.stdout.split()[0] == item.item.bind_source_name
      - >-
        item.item.bind_source_fstype is not defined
        or item.stdout.split()[-1] == item.item.bind_source_fstype
    fail_msg: >-
      Refusing to bind or export {{ item.item.name }} because
      {{ item.item.bind_source }} is not the intended mounted filesystem.
  loop: "{{ nfs_export_bind_sources.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Write NFS export source identity markers
  ansible.builtin.copy:
    dest: "{{ item.bind_source }}/{{ item.bind_source_marker }}"
    content: "{{ item.bind_source_marker_content }}"
    owner: root
    group: root
    mode: "0444"
  loop: "{{ nfs_exports | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.bind_source_marker is defined

- name: Create bind mounts for exports
  ansible.posix.mount:
    path: "{{ nfs_pseudo_root | default('/srv') }}/{{ item.name }}"
    src: "{{ item.bind_source }}"
    fstype: none
    opts: >-
      {{ item.bind_opts | default('bind,nofail,x-systemd.requires-mounts-for=' ~ item.bind_source) }}
    state: mounted
  loop: "{{ nfs_exports | default([]) }}"
  when:
    - item.bind_source is defined
    - (nfs_pseudo_root | default('/srv') ~ '/' ~ item.name) != item.bind_source

- name: Reject stale NFS export bind mounts
  ansible.builtin.command:
    argv:
      - /usr/bin/test
      - "{{ nfs_pseudo_root | default('/srv') }}/{{ item.name }}"
      - -ef
      - "{{ item.bind_source }}"
  loop: "{{ nfs_exports | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - item.bind_source is defined
    - (nfs_pseudo_root | default('/srv') ~ '/' ~ item.name) != item.bind_source
  changed_when: false
  check_mode: false

- name: Remove obsolete same-path export bind mounts from fstab
  ansible.posix.mount:
    path: "{{ nfs_pseudo_root | default('/srv') }}/{{ item.name }}"
    state: absent_from_fstab
  loop: "{{ nfs_exports | default([]) }}"
  when:
    - item.bind_source is defined
    - (nfs_pseudo_root | default('/srv') ~ '/' ~ item.name) == item.bind_source

- name: Create managed subdirectories inside bind-source exports
  ansible.builtin.file:
    path: "{{ item.0.bind_source }}/{{ item.1.path }}"
    state: directory
    owner: "{{ item.1.owner | default(item.0.owner | default('root')) }}"
    group: "{{ item.1.group | default(item.0.group | default('root')) }}"
    mode: "{{ item.1.mode | default(item.0.mode | default('0755')) }}"
  loop: "{{ nfs_exports | default([]) | subelements('subdirs', skip_missing=True) }}"
  when: item.0.bind_source is defined

- name: Configure /etc/exports
  ansible.builtin.template:
    src: "{{ ansible_config_file | dirname }}/templates/storage/exports.j2"
    dest: /etc/exports
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Reload NFS exports

- name: Create NFS server drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/nfs-kernel-server.service.d
    state: directory
    mode: "0755"
  when: nfs_exports | selectattr('bind_source', 'defined') | list | length > 0

- name: Configure NFS server to wait for export source paths
  ansible.builtin.copy:
    dest: /etc/systemd/system/nfs-kernel-server.service.d/wait-for-mounts.conf
    content: |
      [Unit]
      {% for export in nfs_exports | selectattr('bind_source', 'defined') | list %}
      RequiresMountsFor={{ export.bind_source }}
      {% if export.bind_requires_unit is defined %}
      After={{ export.bind_requires_unit }}
      Requires={{ export.bind_requires_unit }}
      {% endif %}
      {% endfor %}
      [Service]
      {% for export in nfs_exports | selectattr('bind_source', 'defined') | list %}
      ExecStartPre=/usr/bin/test {{ nfs_pseudo_root | default('/srv') }}/{{ export.name }} -ef {{ export.bind_source }}
      {% endfor %}
    mode: "0644"
  notify: Reload systemd
  when: nfs_exports | selectattr('bind_source', 'defined') | list | length > 0

- name: Ensure NFS server is enabled and running
  ansible.builtin.systemd:
    name: nfs-kernel-server
    enabled: true
    state: started
    daemon_reload: true

- name: Reconcile active NFS exports
  ansible.builtin.command:
    argv:
      - /usr/sbin/exportfs
      - -ra
  changed_when: false
  check_mode: false
  when: not ansible_check_mode

- name: Read active NFS exports
  ansible.builtin.command:
    argv:
      - /usr/sbin/exportfs
      - -v
  register: nfs_active_exports
  changed_when: false
  check_mode: false

- name: Require every configured NFS export to be active
  ansible.builtin.assert:
    that:
      - >-
        (nfs_pseudo_root | default('/srv') ~ '/' ~ item.name)
        in nfs_active_exports.stdout
    fail_msg: >-
      NFS export {{ item.name }} is configured but absent from the active
      kernel export table.
  loop: "{{ nfs_exports | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
