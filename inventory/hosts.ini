jn-t14s-lin

# -----------------------------------------------------------------------------
# Bootstrap targets (new Linux hosts being onboarded)
# -----------------------------------------------------------------------------
[bootstrap_hosts]
# Add new Linux hosts here only while bootstrapping, then remove them.

