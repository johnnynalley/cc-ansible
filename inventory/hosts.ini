# -----------------------------------------------------------------------------
[workstations]
jn-t14s-lin  ansible_host=100.73.46.86    ansible_user=johnny
macbook-pro

# -----------------------------------------------------------------------------
# Development Hosts (dev tooling: gh, shellcheck, yq, etc.)
# Cross-platform group: hosts here should also be in their OS group
# -----------------------------------------------------------------------------
[development]
# Add active development hosts here.

# -----------------------------------------------------------------------------
# Arch Linux Hosts (for package manager selection)
# -----------------------------------------------------------------------------
[arch_hosts]
# Add active Arch Linux hosts here.

# -----------------------------------------------------------------------------
# Retired Hosts (kept for reference, excluded from normal convergence)
# -----------------------------------------------------------------------------
[retired_hosts]
dev-vm       ansible_host=100.120.217.82   ansible_user=ansible
jn-desktop   ansible_host=100.123.248.34   ansible_user=ansible

# =============================================================================
# Group Hierarchy
# =============================================================================

# Combined VMs + LXCs group (for shared configs)
[vms_lxcs:children]
vms
lxcs

# Debian-based hosts (includes Proxmox, VMs/LXCs, Raspberry Pis, orchestrator, and Debian workstations)
[debian_hosts:children]
proxmox_nodes
vms_lxcs
raspberry_pis
orchestrator

# All Linux hosts
[linux_hosts:children]
debian_hosts
arch_hosts

# All managed hosts (for playbooks that target everything)
[managed_hosts:children]
linux_hosts
macos_hosts

# NAS server (storage services: NFS, Samba, ZFS, mergerfs)
# Portable group - migrate NAS role to new hardware by changing membership
[nas_server]
ts440

# Samba hosts (SMB shares / Time Machine)
[samba_hosts]
ts440
pve-herc

# Docker hosts (VMs running Docker Compose stacks)
[docker_hosts]
docker-vm
media-vm
nextcloud-vm
openclaw-vm

# Gluetun/qBittorrent VPN automation hosts
[gluetun_hosts]
media-vm

# OpenClaw hosts
[openclaw_hosts]
openclaw-vm

# Proxmox Datacenter Manager
[pdm_servers]
pdm-vm

# Backup clients (hosts that get restic backups)
[backup_clients:children]
proxmox_nodes
vms_lxcs
raspberry_pis
orchestrator
workstations
arch_hosts
