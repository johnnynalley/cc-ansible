ansible-lxc ansible_host=100.81.11.49 ansible_user=ansible

# -----------------------------------------------------------------------------
# macOS Hosts
# -----------------------------------------------------------------------------
[macos_hosts]
macbook-pro  ansible_host=100.119.197.17  ansible_user=johnny

# -----------------------------------------------------------------------------
# Windows Hosts
# -----------------------------------------------------------------------------
[windows_hosts]
lj-gaming-pc  ansible_host=100.78.248.44  ansible_user=jn

# Dynamic Windows target groups populated by tasks/windows-reachable-hosts.yml.
[windows_gaming_tuning_targets]

[windows_performance_mode_targets]

[windows_signalrgb_targets]

[windows_gaming_monitoring_targets]

[windows_gaming_benchmark_targets]

# -----------------------------------------------------------------------------
# Workstations (desktops/gaming PCs/laptops - no auto-recovery/reboots)
