---
# =============================================================================
# mercury - Tailscale Subnet Router
# =============================================================================

tailscale_manage_preferences: true
tailscale_advertise_routes:
  - 192.168.1.0/24
tailscale_accept_routes: false
tailscale_snat_subnet_routes: true

# Peer relay listens on UDP 40000 and is only usable by tailnet devices granted
# tailscale.com/cap/relay in files/tailscale-policy.hujson.
tailscale_manage_peer_relay: true
tailscale_peer_relay_enabled: true
tailscale_peer_relay_port: "40000"
tailscale_peer_relay_static_endpoints_dynamic: true
tailscale_peer_relay_static_endpoints: []

# Tailscale requires peer-relay static endpoints as literal IP:port values, not
# hostnames. This timer keeps Mercury set to the current WAN IP on UDP 40000.
tailscale_peer_relay_endpoint_sync_enabled: true
tailscale_peer_relay_endpoint_timer_enabled: true
tailscale_peer_relay_endpoint_ip_url: https://api.ipify.org
tailscale_peer_relay_endpoint_on_boot_sec: 3min
tailscale_peer_relay_endpoint_on_unit_active_sec: 10min
tailscale_peer_relay_endpoint_randomized_delay_sec: 60s
tailscale_peer_relay_endpoint_run_on_deploy: true
