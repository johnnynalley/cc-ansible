# =============================================================================
# pve-m70q - Proxmox Node + VM Firewall Configuration
# =============================================================================

pve_node_firewall:
  enable: true
  rules:
    - { type: group, name: "corosync-lan", comment: "Cluster heartbeat" }
    - { action: ACCEPT, iface: vmbr0, proto: tcp, dport: 8006, comment: "Proxmox API (LAN)" }
    - { action: ACCEPT, iface: vmbr0, proto: tcp, dport: 22, comment: "SSH (LAN)" }
    - { action: ACCEPT, iface: tailscale0, proto: tcp, dport: 8006, comment: "Proxmox API (Tailscale)" }
    - { action: ACCEPT, iface: tailscale0, proto: tcp, dport: 22, comment: "SSH (Tailscale)" }
    - { action: ACCEPT, iface: tailscale0, proto: icmp, comment: "Ping (Tailscale)" }
    - { action: DROP, comment: "Default deny" }

pve_vm_firewalls:
  # docker-vm (VM 110)
  110:
    enable: true
    policy_in: DROP
    rules:
      - { action: ACCEPT, proto: tcp, dport: 22, comment: "SSH" }
      - { action: ACCEPT, proto: tcp, dport: 443, comment: "HTTPS (Caddy)" }
      - { action: ACCEPT, proto: tcp, dport: 80, comment: "HTTP (Caddy redirect)" }
      - { action: ACCEPT, proto: tcp, dport: 3100, comment: "Loki (log ingestion)" }
      - { action: ACCEPT, proto: tcp, dport: 8090, source: "100.97.139.95", comment: "AudioSocket from freepbx-vm (AVA)" }
      - { action: ACCEPT, proto: udp, dport: "18080:18099", source: "100.97.139.95", comment: "ExternalMedia RTP from freepbx-vm (AVA)" }
      - { action: ACCEPT, proto: tcp, dport: 3003, source: "+dc/tailscale", comment: "AVA Admin UI (Tailscale)" }

  # openclaw-vm (VM 140) - OpenClaw AI Agent
  140:
    enable: true
    policy_in: DROP
    rules:
      - { action: ACCEPT, proto: tcp, dport: 22, source: "+dc/tailscale", comment: "SSH from Tailscale" }
      - { action: ACCEPT, proto: tcp, dport: 18789, source: "100.108.254.100", comment: "OpenClaw gateway from Caddy (docker-vm)" }
      - { action: ACCEPT, proto: tcp, dport: 18789, source: "100.119.197.17", comment: "BlueBubbles webhook from macbook-pro" }
      - { action: ACCEPT, proto: udp, dport: 41641, comment: "Tailscale WireGuard" }
