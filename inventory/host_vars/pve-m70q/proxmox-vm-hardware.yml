# =============================================================================
# pve-m70q - Proxmox Guest Hardware Settings
# =============================================================================

proxmox_lxc_hardware:
  - name: ansible-lxc
    vmid: 104
    cores: 4
    memory: 8192
    swap: 512
    onboot: false

proxmox_vm_hardware:
  - name: docker-vm
    vmid: 110
    memory: 12288
    balloon: 10240
    agent: true
    onboot: true

proxmox_vm_disk_resizes:
  - name: docker-vm root disk
    vmid: 110
    slot: scsi0
    size: 80G
