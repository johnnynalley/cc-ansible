# lj-gaming-pc - Windows Performance Mode automation

windows_performance_script_dir: 'C:\ProgramData\Johnny\WindowsPerformanceMode'
windows_performance_state_dir: 'C:\Users\jn\AppData\Local\WindowsPerformanceMode'
windows_performance_legacy_script_dirs:
  - 'C:\Users\jn\Nextcloud\Scripts\WindowsPerformanceMode'
  - 'C:\Users\jn\Nextcloud\Scripts\FortniteCompMode'
windows_performance_task_user: 'LJ-GAMING-PC\jn'
windows_performance_watcher_task_name: Windows Performance Mode Watcher
windows_performance_watcher_enabled: false
windows_performance_poll_seconds: 5
windows_performance_exit_grace_seconds: 45
windows_performance_exit_prompt_enabled: true
windows_performance_exit_prompt_title: Performance Mode
windows_performance_exit_prompt_message: 'Fortnite exited. Disable Performance Mode and restore closed apps/services now?'
windows_performance_obs_enable_script: false
windows_performance_obs_scripts_dir: 'C:\Users\jn\AppData\Roaming\obs-studio\scripts'
windows_performance_obs_scene_collection: 'C:\Users\jn\AppData\Roaming\obs-studio\basic\scenes\Untitled.json'
windows_performance_obs_lua_script: performance-mode-trigger.lua
windows_performance_desktop_shortcuts_enabled: true
windows_performance_desktop_shortcut_dir: 'C:\Users\jn\OneDrive\Desktop'
windows_performance_desktop_shortcut_legacy_dirs:
  - 'C:\Users\jn\Desktop'
windows_performance_obs_process_names:
  - obs64

windows_performance_game_profiles:
  - id: fortnite
    display_name: Fortnite
    process_names:
      - FortniteClient-Win64-Shipping
    auto_performance_mode: false
    exit_grace_seconds: 10

# Keep manual Performance Mode shortcuts available for future experiments, but
# do not close normal daytime apps after the 5800X3D/XMP baseline solved the
# old FPS ceiling. Background offenders should be added back one at a time only
# after a benchmark identifies them.
windows_performance_process_rules: []

windows_performance_service_rules: []
