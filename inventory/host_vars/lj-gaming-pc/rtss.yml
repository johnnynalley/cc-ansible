---
# lj-gaming-pc - RivaTuner Statistics Server compatibility tuning

windows_gaming_rtss_restart_on_change: true
windows_gaming_rtss_profiles:
  - path: 'C:\Program Files (x86)\RivaTuner Statistics Server\Profiles\Global'
    settings:
      - section: Hooking
        key: UseDetours
        value: 1
  - path: 'C:\Program Files (x86)\RivaTuner Statistics Server\Profiles\FortniteClient-Win64-Shipping.exe.cfg'
    settings:
      - section: Hooking
        key: UseDetours
        value: 1
  # SignalRGB warns that RTSSHooks64.dll is likely to cause issues. Keep RTSS
  # away from SignalRGB so the local lighting API can initialize reliably.
  - path: 'C:\Program Files (x86)\RivaTuner Statistics Server\Profiles\SignalRgb.exe.cfg'
    create_from: 'C:\Program Files (x86)\RivaTuner Statistics Server\Profiles\Global'
    settings:
      - section: OSD
        key: EnableOSD
        value: 0
      - section: Hooking
        key: EnableHooking
        value: 0
  - path: 'C:\Program Files (x86)\RivaTuner Statistics Server\Profiles\SignalRgbLauncher.exe.cfg'
    create_from: 'C:\Program Files (x86)\RivaTuner Statistics Server\Profiles\Global'
    settings:
      - section: OSD
        key: EnableOSD
        value: 0
      - section: Hooking
        key: EnableHooking
        value: 0
