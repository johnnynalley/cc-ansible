# =============================================================================
# ts440 - Storage Transport Configuration
# =============================================================================

# Disable UAS for legacy standalone USB-SATA bridges with known instability in
# this environment. The four-bay DAS uses separate 174c:55aa slot bridges and
# currently remains on UAS; do not infer that this 174c:1153 quirk covers it.
usb_storage_quirks:
  - "1058:2621:u"
  - "174c:1153:u"
