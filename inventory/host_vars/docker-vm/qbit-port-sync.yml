# =============================================================================
# docker-vm - qBittorrent Port Sync
# =============================================================================

qbit_port_sync_enabled: true
qbit_port_sync_env_file: /etc/qbit-port-sync.env
qbit_port_sync_port_file: /opt/media-stack/gluetun/forwarded_port
qbit_port_sync_api: http://localhost:8085/api/v2
qbit_port_sync_user: johnny
qbit_port_sync_password: "{{ vault_qbit_port_sync_password }}"
qbit_port_sync_compose_dir: /opt/media-stack
qbit_port_sync_service_name: qbittorrent
qbit_port_sync_lock_file: /opt/media-stack/qbittorrent/qBittorrent/lockfile
qbit_port_sync_max_retries: 30
qbit_port_sync_retry_delay: 5
