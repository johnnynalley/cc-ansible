# =============================================================================
# docker-vm - Media Stack Health
# =============================================================================

media_stack_health_enabled: true
media_stack_health_state_dir: /var/lib/media-stack-health
media_stack_health_interval: 5min
media_stack_health_accuracy: 30s
media_stack_health_alert_cooldown_seconds: 1800
media_stack_health_alert_tags: "push"
media_stack_health_qbit_env_file: /etc/qbit-port-sync.env
media_stack_health_consecutive_failure_threshold: 2
media_stack_health_library_probe_path: /srv/media/plex/Movies
media_stack_health_data_host_root: /srv/media/plex
media_stack_health_path_probe_timeout: 10
media_stack_health_hardlink_container: sonarr
media_stack_health_hardlink_source_dir: /data/downloads/complete
media_stack_health_hardlink_target_dir: /data/Anime
media_stack_health_qbit_import_audit_enabled: true
media_stack_health_qbit_import_audit_hours: 24
media_stack_health_qbit_import_audit_max_records: 200
media_stack_health_qbit_import_audit_fail_on_copy: false

# Alert-only storage/import guardrails. These checks never pause searches,
# stop containers, or mutate Arr/qBittorrent state.
media_stack_health_nfs_fileid_check_enabled: true
media_stack_health_nfs_fileid_window_seconds: 1800
media_stack_health_nfs_fileid_threshold: 10
media_stack_health_nfs_fileid_fail_on_threshold: false
media_stack_health_dstate_check_enabled: true
media_stack_health_dstate_min_age_seconds: 600
media_stack_health_arr_command_check_enabled: true
media_stack_health_arr_command_started_stale_seconds: 3600
media_stack_health_arr_command_queued_stale_seconds: 7200
media_stack_health_arr_command_no_progress_seconds: 1800
media_stack_health_bazarr_functional_check_enabled: true
media_stack_health_bazarr_db_path: /opt/media-stack/bazarr/db/bazarr.db
media_stack_health_bazarr_config_path: /opt/media-stack/bazarr/config/config.yaml
media_stack_health_bazarr_throttled_providers_path: /opt/media-stack/bazarr/config/throttled_providers.dat
media_stack_health_bazarr_container: bazarr
media_stack_health_bazarr_missing_english_warning_threshold: 1
media_stack_health_bazarr_stale_success_warning_seconds: 604800
media_stack_health_bazarr_stale_success_fail: false
media_stack_health_bazarr_write_probe_enabled: true
media_stack_health_bazarr_write_probe_dir: /data/Shows
# Keep collecting Bazarr provider state for manual diagnostics, but a known
# provider authentication/throttle condition must not fail the media stack or
# page Johnny. Container, endpoint, storage, and write-path checks remain live.
media_stack_health_bazarr_fail_on_provider_auth_throttle: false

# Root-cause recovery for classified stale docker-vm NFS client state. This is
# intentionally separate from alert-only media-stack-health logic: fileid noise
# alone does not trigger recovery, but stale/unreadable required NFS paths do.
media_stack_storage_recovery_enabled: true
media_stack_storage_recovery_state_dir: /var/lib/media-stack-storage-recover
media_stack_storage_recovery_compose_dir: /opt/media-stack
media_stack_storage_recovery_compose_lock_file: /run/media-stack-compose.lock
media_stack_storage_recovery_compose_lock_wait: 900
media_stack_storage_recovery_compose_stop_timeout: 45
media_stack_storage_recovery_path_probe_timeout: 10
media_stack_storage_recovery_cooldown_seconds: 1800
media_stack_storage_recovery_validation_attempts: 6
media_stack_storage_recovery_validation_retry_seconds: 10
media_stack_storage_recovery_mounts:
  - path: /srv/media
    fstype: nfs
    require_path: /srv/media/plex/Movies
  - path: /srv/incomplete_downloads
    fstype: nfs
    require_path: /srv/incomplete_downloads/incomplete/torrents/tv-sonarr
  - path: /srv/archive
    fstype: nfs
media_stack_storage_recovery_required_paths:
  - /srv/archive
  - /srv/media/plex/downloads/complete
  - /srv/media/plex/Anime
  - /srv/incomplete_downloads/incomplete/torrents
media_stack_storage_recovery_container_path_probes:
  - container: sonarr
    path: /data/downloads/complete
  - container: sonarr
    path: /data/Anime
  - container: bazarr
    path: /data/Shows
