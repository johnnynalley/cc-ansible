# =============================================================================
# docker-vm - Host Variables
# =============================================================================

# Legacy host uses johnny user
admin_user: johnny

# Gluetun VPN watchdog - auto-restart on crash loops
gluetun_watchdog_enabled: true
gluetun_watchdog_compose_dir: /opt/media-stack
gluetun_watchdog_notify_tag: "push-quiet"
gluetun_watchdog_required_paths:
  - /srv/archive
  - /srv/media/plex/downloads/complete
  - /srv/media/plex/Anime
  - /srv/incomplete_downloads/incomplete/torrents
