# Preserve grab-time release metadata in download-client payload file names so
# Sonarr/Radarr custom formats can still match DA/x265 at import time.
media_release_stamper_enabled: true
media_release_stamper_container_uid: "1000"
media_release_stamper_container_gid: "1000"

media_release_stamper_qbit_enabled: true
media_release_stamper_qbit_script_dir: /opt/media-stack/qbittorrent/scripts
media_release_stamper_qbit_env_path: /opt/media-stack/qbittorrent/scripts/qbit-release-stamper.env
media_release_stamper_qbit_host_api: "{{ qbit_port_sync_api | default('http://127.0.0.1:8085/api/v2') }}"
media_release_stamper_qbit_container_api: http://127.0.0.1:8085/api/v2
media_release_stamper_qbit_user: "{{ qbit_port_sync_user }}"
media_release_stamper_qbit_password: "{{ qbit_port_sync_password }}"
media_release_stamper_da_original_languages:
  - jpn
media_release_stamper_sonarr_config_path: /opt/media-stack/sonarr/config.xml
media_release_stamper_radarr_config_path: /opt/media-stack/radarr/config.xml
media_release_stamper_sonarr_api: http://sonarr:8989/api/v3
media_release_stamper_radarr_api: http://radarr:7878/api/v3
media_release_stamper_backup_root: /srv/live-rollbacks/docker-vm/media-release

# Refresh only existing Dictionarry/TRaSH CF definitions shortly before the
# midnight Profilarr upgrade-search window. Profile structure and scores remain
# locally owned.
media_release_definition_sync_enabled: true
media_release_definition_sync_calendar: "*-*-* 23:45:00 America/Chicago"
media_release_definition_sync_max_source_age_hours: 26
media_release_definition_sync_snapshot_root: /srv/live-rollbacks/docker-vm/arr-policy

media_release_stamper_context_enabled: true
media_release_stamper_context_dir: /opt/arr-grab-context
media_release_stamper_context_network: media-stack_default
media_release_stamper_context_api: http://arr-grab-context:9899
media_release_stamper_context_webhook_url: http://arr-grab-context:9899/v1/events
media_release_stamper_context_retention_days: 120
media_release_stamper_reconciler_apply: true
media_release_stamper_reconciler_interval: 60
media_release_stamper_handoff_mode: apply
media_release_stamper_usenet_handoff_mode: apply
media_release_stamper_xem_handoff_mode: apply
media_release_stamper_handoff_min_payload_age: 120
media_release_stamper_handoff_ffprobe_timeout: 30
media_release_stamper_handoff_max_per_cycle: 5
media_release_stamper_allow_english_original_und_audio: true
media_release_stamper_reconciler_qbit_api: http://gluetun:8085/api/v2
media_release_stamper_qbit_categories:
  - tv-sonarr
  - sonarr
  - radarr
media_release_stamper_qbit_autorun_program: >-
  /usr/bin/python3 /config/scripts/qbit-release-stamper.py --hash "%I" --name "%N" --category "%L"

media_release_stamper_sab_enabled: true
media_release_stamper_sab_config_dir: /opt/media-stack/sabnzbd
media_release_stamper_sab_script_dir: /opt/media-stack/sabnzbd/scripts
media_release_stamper_sab_env_path: /opt/media-stack/sabnzbd/scripts/sab-release-stamper.env
media_release_stamper_sab_script_name: sab-release-stamper.py
media_release_stamper_sab_categories:
  - shows
  - movies
