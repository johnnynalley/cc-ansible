# Sonarr transaction audit trail for release-policy/Profilarr upgrade reviews.
sonarr_transaction_monitor_enabled: true
sonarr_transaction_monitor_state_dir: /var/lib/sonarr-transaction-monitor
sonarr_transaction_monitor_log_dir: /var/log/sonarr-transaction-monitor
sonarr_transaction_monitor_config_path: /opt/media-stack/sonarr/config.xml
sonarr_transaction_monitor_base_url: http://127.0.0.1:8989
sonarr_transaction_monitor_bootstrap_records: 1000
sonarr_transaction_monitor_max_history_pages: 10
sonarr_transaction_monitor_on_boot_sec: 2min
sonarr_transaction_monitor_interval_sec: 2min
sonarr_transaction_monitor_storage_snapshot_interval_sec: 900
sonarr_transaction_monitor_log_rotate_count: 90
sonarr_transaction_monitor_subtitle_audit_enabled: true
sonarr_transaction_monitor_subtitle_audit_script: /usr/local/bin/subtitle-language-mismatch-audit
sonarr_transaction_monitor_subtitle_audit_path_maps:
  - /data=/srv/media/plex
sonarr_transaction_monitor_subtitle_audit_timeout_sec: 120
sonarr_transaction_monitor_subtitle_audit_probe_timeout_sec: 30
sonarr_transaction_monitor_subtitle_audit_stream_timeout_sec: 20
sonarr_transaction_monitor_subtitle_audit_sample_chars: 20000
sonarr_transaction_monitor_qbit_audit_enabled: true
sonarr_transaction_monitor_qbit_audit_script: /usr/local/bin/qbit-arr-stall-audit
sonarr_transaction_monitor_qbit_audit_interval_sec: 900
sonarr_transaction_monitor_qbit_audit_timeout_sec: 120
sonarr_transaction_monitor_qbit_audit_sample_limit: 20
