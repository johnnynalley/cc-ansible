  /home/johnny/.openclaw/workspace/data/health.db
hermes_health_receiver_legacy_unit: >-
  /home/johnny/.config/systemd/user/health-receiver.service
hermes_health_receiver_legacy_env: >-
  /home/johnny/.config/openclaw/receivers/health-receiver.env
hermes_health_receiver_token_source: >-
  /home/johnny/.config/openclaw/receivers/health-receiver.token
hermes_health_receiver_canary_bind: 127.0.0.1
hermes_health_receiver_canary_port: 19791
hermes_health_receiver_canary_sources:
  - 127.0.0.1
hermes_health_receiver_production_bind: 100.73.46.86
hermes_health_receiver_production_port: 18791
hermes_health_receiver_production_sources:
  - 100.73.46.86
  - 100.108.254.100
hermes_health_receiver_max_body_bytes: 16777216
hermes_health_receiver_rate_limit: 30
