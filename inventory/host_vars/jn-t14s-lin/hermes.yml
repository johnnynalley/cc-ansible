# legacy inputs are consulted only for an explicit canary or one-time cutover.
hermes_health_receiver_mode: production
hermes_health_receiver_cutover_requested: false
hermes_health_receiver_cutover_approved: false
hermes_health_receiver_user: hermes-health
hermes_health_receiver_group: hermes-health
hermes_health_receiver_data_dir: /var/lib/hermes/health
hermes_health_receiver_backup_dir: /srv/live-rollbacks/jn-t14s-lin/hermes-health
hermes_health_receiver_legacy_user: johnny
