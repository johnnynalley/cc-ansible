# Health ingestion runs independently from model-visible agent profiles.
hermes_health_receiver_mode: production
hermes_health_receiver_user: hermes-health
hermes_health_receiver_group: hermes-health
hermes_health_receiver_data_dir: /var/lib/hermes/health
hermes_health_receiver_production_bind: 100.73.46.86
hermes_health_receiver_production_port: 18791
hermes_health_receiver_production_sources:
  - 100.73.46.86
  - 100.108.254.100
hermes_health_receiver_max_body_bytes: 16777216
hermes_health_receiver_rate_limit: 30
hermes_health_receiver_rate_window_seconds: 60
hermes_health_receiver_max_json_depth: 16
hermes_health_receiver_max_json_nodes: 1000000
hermes_health_receiver_max_collection_items: 200000
hermes_health_receiver_max_string_bytes: 1048576
