# =============================================================================
# jn-t14s-lin - Plex HDMI Appliance
# =============================================================================

plex_appliance_enabled: true
plex_appliance_mode: hdmi
plex_appliance_user: "{{ admin_user }}"
plex_appliance_server_url: "http://100.66.6.113:32400"
plex_appliance_library: "Shows"
plex_appliance_collection: "Adult Swim Collection"

# T14s uses the Plasma/KScreen backend so mpv runs inside the logged-in Wayland
# session. Direct DRM VT playback can leave KWin unable to modeset after unplug.
plex_appliance_audio_languages:
  - eng
plex_appliance_subtitle_languages:
  - eng
plex_appliance_subtitles: auto

# Store the real token in inventory/host_vars/jn-t14s-lin/vault.yml.
plex_appliance_token: "{{ vault_plex_appliance_token | default('') }}"

plex_appliance_packages:
  - mpv
  - python3
  - python3-requests
  - kscreen
  - libxcb-cursor0

plex_appliance_disable_desktop: false
plex_appliance_hdmi_output_patterns:
  - HDMI
plex_appliance_hdmi_ignore_patterns:
  - eDP
  - LVDS
  - DSI
plex_appliance_hdmi_backend: kscreen
plex_appliance_hdmi_poll_seconds: 5
plex_appliance_hdmi_configure_display: true
plex_appliance_hdmi_make_primary: true
plex_appliance_hdmi_tv_only: false
plex_appliance_hdmi_autostart_enabled: true
plex_appliance_audio_device: "alsa/hdmi:CARD=Generic,DEV=1"
plex_appliance_page_size: 100
plex_appliance_server_retry_seconds: 30
plex_appliance_item_failure_delay_seconds: 10
plex_appliance_collection_refresh_seconds: 3600
plex_appliance_mpv_args:
  - --fs
  - --no-terminal
  - --no-osc
  - --no-input-default-bindings
  - --really-quiet
  - --profile=fast
  - --vo=gpu
  - --hwdec=auto-safe
  - --volume-max=200
  - --volume=100
  - --keep-open=no
