# =============================================================================
# jn-t14s-lin - Plex HDMI Appliance
# =============================================================================

plex_appliance_enabled: true
plex_appliance_mode: hdmi
plex_appliance_user: "{{ admin_user }}"
plex_appliance_server_url: "http://100.66.6.113:32400"
plex_appliance_library: "Shows"
plex_appliance_collection: "Adult Swim Collection"

# T14s uses the existing appliance player in two display contexts. A logged-in
# Plasma session launches it fullscreen on HDMI while leaving eDP usable. With
# no local session, the root watcher retains the no-login direct-DRM VT8 path.
plex_appliance_audio_languages:
  - eng
plex_appliance_subtitle_languages:
  - eng
plex_appliance_subtitles: auto

# Store the real token in inventory/host_vars/jn-t14s-lin/vault.yml.
plex_appliance_token: "{{ vault_plex_appliance_token | default('') }}"

plex_appliance_packages:
  - ffmpeg
  - mpv
  - python3
  - python3-requests
  - kscreen
  - libxcb-cursor0

plex_appliance_disable_desktop: false
plex_appliance_hdmi_output_patterns:
  - HDMI
plex_appliance_hdmi_ignore_patterns:
  - eDP
  - LVDS
  - DSI
plex_appliance_hdmi_backend: hybrid
plex_appliance_hdmi_tty: /dev/tty8
plex_appliance_hdmi_return_tty: /dev/tty1
plex_appliance_hdmi_drm_connector: HDMI-A-1
plex_appliance_hdmi_sysfs_connector: card1-HDMI-A-1
plex_appliance_hdmi_eld_path: "/proc/asound/card0/eld#0.1"
plex_appliance_hdmi_edid_path: /sys/class/drm/card1-HDMI-A-1/edid
plex_appliance_hdmi_restore_getty: true
plex_appliance_hdmi_restart_display_manager: true
plex_appliance_hdmi_display_manager_service: sddm.service
plex_appliance_hdmi_stop_display_manager_during_playback: true
plex_appliance_hdmi_reset_plasma_user_services: true
plex_appliance_hdmi_skip_when_local_user_active: true
plex_appliance_hdmi_poll_seconds: 5
plex_appliance_hdmi_configure_display: true
plex_appliance_hdmi_make_primary: false
plex_appliance_hdmi_tv_only: false
plex_appliance_hdmi_autostart_enabled: true
plex_appliance_audio_device: "alsa/hdmi:CARD=Generic,DEV=1"
plex_appliance_page_size: 100
plex_appliance_server_retry_seconds: 3
plex_appliance_item_failure_delay_seconds: 10
plex_appliance_collection_refresh_seconds: 21600
plex_appliance_collection_refresh_jitter_seconds: 1800
plex_appliance_tailscale_keepalive_enabled: true
plex_appliance_tailscale_keepalive_on_boot_sec: 90s
plex_appliance_tailscale_keepalive_on_unit_active_sec: 60s
plex_appliance_tailscale_keepalive_randomized_delay_sec: 5s
plex_appliance_tailscale_keepalive_ping_count: 5
plex_appliance_tailscale_keepalive_ping_timeout: 5s
plex_appliance_tailscale_keepalive_http_timeout_seconds: 5
plex_appliance_resume_rewind_seconds: 15
plex_appliance_stream_prestart_timeout_seconds: 12
plex_appliance_mpv_start_timeout_seconds: 45
plex_appliance_mpv_args:
  - --fs
  - --no-terminal
  - --no-osc
  - --no-input-default-bindings
  - --really-quiet
  - --profile=fast
  - --vo=gpu
  - --gpu-context=drm
  - --drm-connector=HDMI-A-1
  - --drm-mode=1920x1080@60
  - --ao=alsa
  - --hwdec=auto-safe
  - --af=lavfi=[dynaudnorm=f=250:g=15:p=0.95:m=8]
  - --volume-max=200
  - --volume=100
  - --keep-open=no
plex_appliance_mpv_session_args:
  - --fs
  - --no-terminal
  - --no-osc
  - --no-input-default-bindings
  - --really-quiet
  - --profile=fast
  - --vo=gpu
  - --hwdec=auto-safe
  - --ao=alsa
  - --af=lavfi=[dynaudnorm=f=250:g=15:p=0.95:m=8]
  - --volume-max=200
  - --volume=100
  - --keep-open=no
