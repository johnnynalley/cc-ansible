---
# =============================================================================
# jn-t14s-lin - OpenClaw AI Agent Platform
# =============================================================================

openclaw_enabled: true
openclaw_port: 18789
openclaw_workspace: /opt/cc-ansible
openclaw_npm_prefix: /home/johnny/.npm-global
openclaw_nodesource_major: 24
openclaw_wait_for_tailnet: true
openclaw_cleanup_npm_prefixes:
  - /home/johnny/.local

# Parallel least-privilege Gateway canary. Disabled mode leaves the existing
# johnny-owned production Gateway untouched. Bootstrap and full canary modes
# are attended, owner-approved listeners on loopback and never enabled at boot.
openclaw_isolated_gateway_mode: disabled
openclaw_isolated_gateway_canary_approved: false
openclaw_isolated_gateway_user: openclaw
openclaw_isolated_gateway_group: openclaw
openclaw_isolated_codex_user: openclaw-codex
openclaw_isolated_codex_group: openclaw-codex
openclaw_isolated_workspace_group: openclaw-workspace
openclaw_isolated_gateway_supplementary_groups:
  - openclaw-workspace
openclaw_isolated_codex_supplementary_groups:
  - openclaw-workspace
openclaw_isolated_gateway_legacy_user: johnny
openclaw_isolated_gateway_port: 19789
openclaw_isolated_codex_port: 19790
openclaw_isolated_gateway_pairing_proxy_bind: 127.0.1.1
openclaw_isolated_gateway_pairing_proxy_host: jn-t14s-lin
openclaw_isolated_gateway_pairing_proxy_port: 19788
openclaw_isolated_gateway_model: openai/gpt-5.6-sol
# The temporary canary must never schedule copied production jobs. Final
# production activation uses a separate attended cutover gate.
openclaw_isolated_gateway_skip_cron: true
openclaw_isolated_gateway_runtime_root: /opt/openclaw-isolated
openclaw_isolated_gateway_releases_dir: /opt/openclaw-isolated/releases
openclaw_isolated_gateway_runtime_dir: /opt/openclaw-isolated/current
openclaw_isolated_gateway_plugin_state_root: >-
  /var/lib/openclaw-isolated/state/npm
openclaw_isolated_gateway_managed_plugins:
  - id: codex
    package: "@openclaw/codex"
    install_spec: "@openclaw/codex@latest"
    require_core_match: true
    trusted_official: true
    convergence_status: loaded
  - id: discord
    package: "@openclaw/discord"
    install_spec: "@openclaw/discord@latest"
    require_core_match: true
    trusted_official: true
    convergence_status: loaded
  - id: lossless-claw
    package: "@martian-engineering/lossless-claw"
    install_spec: "@martian-engineering/lossless-claw@latest"
    require_core_match: false
    trusted_official: false
    convergence_status: loaded
  - id: openclaw-mem0
    package: "@mem0/openclaw-mem0"
    install_spec: "@mem0/openclaw-mem0@latest"
    require_core_match: false
    trusted_official: false
    convergence_status: disabled
openclaw_isolated_gateway_retired_global_plugins:
  - brave
  - nextcloud-talk
  - perplexity
  - self-evolution-gate
openclaw_isolated_gateway_build_user: openclaw-build
openclaw_isolated_gateway_build_group: openclaw-build
openclaw_isolated_gateway_build_dir: /var/cache/openclaw-isolated-build
openclaw_isolated_gateway_config_dir: /etc/openclaw-isolated
openclaw_isolated_gateway_config_file: /etc/openclaw-isolated/openclaw.json
openclaw_isolated_gateway_secret_file: /etc/openclaw-isolated/secrets.json
openclaw_isolated_codex_config_dir: /etc/openclaw-codex
openclaw_isolated_codex_token_file: /etc/openclaw-codex/app-server.token
openclaw_isolated_codex_state_dir: /var/lib/openclaw-codex
openclaw_isolated_codex_runtime_dir: /opt/openclaw-codex/runtime
openclaw_isolated_gateway_state_dir: /var/lib/openclaw-isolated
openclaw_isolated_gateway_workspace_dir: >-
  /usr/local/share/openclaw-isolated/workspace
# Transactional rollback stays local so migration safety does not depend on a
# hard-mounted network filesystem. Durable production backups remain separate.
openclaw_isolated_gateway_backup_dir: /var/backups/openclaw-isolated
openclaw_isolated_gateway_backup_headroom_bytes: 2147483648
openclaw_isolated_gateway_min_build_free_bytes: 8589934592

# Copy-only migration rehearsal. Disabled mode is inert. Sessions mode copies
# the active file-backed session trees, retains only spawned workspace directory
# structure, and rebuilds generated prompt/runtime state from the modern target.
# It never copies config, credentials, channels, plugins, or legacy behavior.
openclaw_state_rehearsal_mode: disabled
openclaw_state_rehearsal_approved: false
openclaw_state_rehearsal_user: openclaw-migrate
openclaw_state_rehearsal_group: openclaw-migrate
openclaw_state_rehearsal_source_state_dir: /home/johnny/.openclaw
openclaw_state_rehearsal_source_workspace_dir: /home/johnny/.openclaw/workspace
openclaw_state_rehearsal_state_root: /var/lib/openclaw-migration-rehearsal
openclaw_state_rehearsal_workspace_root: >-
  /usr/local/share/openclaw-migration-rehearsal
openclaw_state_rehearsal_backup_dir: >-
  /var/backups/openclaw-migration-rehearsal
openclaw_state_rehearsal_agents:
  - main
  - dubble
  - rigel
  - vega
  - antares

# Credential-free Doctor modernization rehearsal. This consumes the already
# verified session relocation generation, takes online backups of only the
# authoritative live SQLite stores, removes legacy plugin install records from
# the copy through OpenClaw's supported CLI, and runs safe migrations twice in
# a networkless transient unit. Disabled mode is inert.
openclaw_doctor_rehearsal_mode: disabled
openclaw_doctor_rehearsal_approved: false
openclaw_doctor_rehearsal_user: openclaw-migrate
openclaw_doctor_rehearsal_group: openclaw-migrate
openclaw_doctor_rehearsal_source_state_dir: /home/johnny/.openclaw
openclaw_doctor_rehearsal_source_config: /home/johnny/.openclaw/openclaw.json
openclaw_doctor_rehearsal_session_state: >-
  /var/lib/openclaw-migration-rehearsal/current
openclaw_doctor_rehearsal_session_workspace: >-
  /usr/local/share/openclaw-migration-rehearsal/current
openclaw_doctor_rehearsal_state_root: /var/lib/openclaw-doctor-rehearsal
openclaw_doctor_rehearsal_workspace_root: >-
  /usr/local/share/openclaw-doctor-rehearsal
openclaw_doctor_rehearsal_config_root: /etc/openclaw-doctor-rehearsal
openclaw_doctor_rehearsal_backup_dir: >-
  /var/backups/openclaw-doctor-rehearsal
openclaw_doctor_rehearsal_runtime: /opt/openclaw-isolated/current
openclaw_doctor_rehearsal_agents:
  - main
  - dubble
  - rigel
  - vega
  - antares
openclaw_doctor_rehearsal_install_records:
  - brave
  - codex
  - discord
  - lossless-claw
  - nextcloud-talk
  - openclaw-mem0
  - perplexity
  - self-evolution-gate
openclaw_doctor_rehearsal_disabled_runtime_plugins:
  # Preserved and provenance-checked, but it cannot initialize its external
  # Qdrant dependency inside the intentionally networkless Doctor rehearsal.
  - openclaw-mem0
openclaw_doctor_rehearsal_stable_shared_db_exclusions:
  # OpenClaw defines this as a 30-minute, regenerable model-catalog cache.
  - agent_model_catalogs
  - audit_events
  - config_health_entries
  - gateway_boot_lifecycle
  - gateway_restart_handoff
  - gateway_restart_intent
  - gateway_restart_sentinel
  - installed_plugin_index
  - state_leases
  - update_check_state

# Attended handoff of the verified modern workspace and file-backed sessions
# into the loopback-only isolated canary. Plan mode performs the same protected
# staging but uses read-only native session classification; apply mode archives
# only classified synthetic/completed rows through sessions.patch. Neither mode
# enables channels, cron, heartbeats, boot startup, or production cutover.
openclaw_canary_data_mode: disabled
openclaw_canary_data_approved: false
openclaw_canary_data_source_state: >-
  /var/lib/openclaw-migration-rehearsal/current
openclaw_canary_data_source_workspace: >-
  /usr/local/share/openclaw-migration-rehearsal/current
openclaw_canary_data_legacy_workspace: /home/johnny/.openclaw/workspace
openclaw_canary_data_backup_dir: /var/backups/openclaw-isolated/data-handoff
openclaw_canary_data_agents:
  - main
  - dubble
  - rigel
  - vega
  - antares

# Attended behavior proof against the applied, loopback-only canary. Plan mode
# renders and audits both configurations without starting a Gateway. Apply mode
# is separately approved, keeps channels and cron suppressed, runs isolated
# Dubble/Star/Rigel probes, restores the heartbeat-disabled baseline, archives
# only its synthetic sessions through native RPC, and verifies no delivery or
# production-listener state changed.
openclaw_behavior_rehearsal_mode: disabled
openclaw_behavior_rehearsal_approved: false

# Adversarial proof for the separate Codex executor boundary. Disabled is
# inert. Apply mode remains an attended, channel-less loopback canary and uses
# synthetic sentinels only; it never reads production credentials.
openclaw_security_rehearsal_mode: disabled
openclaw_security_rehearsal_approved: false
openclaw_security_rehearsal_root: /var/lib/openclaw-security-rehearsal
openclaw_security_rehearsal_backup_dir: /var/backups/openclaw-security-rehearsal

# Dedicated Health receiver migration. Disabled leaves the current user service
# untouched. Canary and production are attended rollout modes; first production
# activation additionally requires both request and approval booleans.
openclaw_health_receiver_mode: disabled
openclaw_health_receiver_cutover_requested: false
openclaw_health_receiver_cutover_approved: false
openclaw_health_receiver_user: openclaw-health
openclaw_health_receiver_group: openclaw-health
openclaw_health_report_group: openclaw-health-report
openclaw_health_receiver_data_dir: /var/lib/openclaw-health
openclaw_health_receiver_db: /var/lib/openclaw-health/health.db
openclaw_health_receiver_report_dir: /var/lib/openclaw-health/reports
openclaw_health_receiver_config_dir: /etc/openclaw-health
openclaw_health_receiver_backup_dir: /var/backups/openclaw-health
openclaw_health_receiver_legacy_user: johnny
openclaw_health_receiver_legacy_db: >-
  /home/johnny/.openclaw/workspace/data/health.db
openclaw_health_receiver_legacy_unit: >-
  /home/johnny/.config/systemd/user/health-receiver.service
openclaw_health_receiver_legacy_env: >-
  /home/johnny/.config/openclaw/receivers/health-receiver.env
openclaw_health_receiver_token_source: >-
  /home/johnny/.config/openclaw/receivers/health-receiver.token
openclaw_health_receiver_canary_bind: 127.0.0.1
openclaw_health_receiver_canary_port: 19791
openclaw_health_receiver_canary_sources:
  - 127.0.0.1
openclaw_health_receiver_production_bind: 100.73.46.86
openclaw_health_receiver_production_port: 18791
openclaw_health_receiver_production_sources:
  - 100.73.46.86
  - 100.108.254.100
openclaw_health_receiver_max_body_bytes: 16777216
openclaw_health_receiver_rate_limit: 30
openclaw_health_receiver_rate_window_seconds: 60
openclaw_health_receiver_max_json_depth: 16
openclaw_health_receiver_max_json_nodes: 1000000
openclaw_health_receiver_max_collection_items: 200000
openclaw_health_receiver_max_string_bytes: 1048576
