# =============================================================================
# openclaw-vm - Backup Configuration
# =============================================================================

# Local backup to ts440 ZFS (hourly) via restic REST server
# REST server is append-only — openclaw-vm cannot delete or modify existing backups
local_restic_enabled: true
local_restic_backup_paths:
  - /home/johnny/.openclaw
  - /opt/cc-ansible

# Override repository to use REST server instead of SFTP
# (openclaw-vm has no SSH access to ts440 by design — security boundary)
local_restic_repository: "rest:http://openclaw-vm:{{ vault_restic_rest_password }}@100.71.188.16:8500/openclaw-vm/"
