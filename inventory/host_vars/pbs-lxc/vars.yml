# =============================================================================
# pbs-lxc - Host Variables
# =============================================================================

admin_user: johnny

# PBS datastore configuration
pbs_datastore_name: main
pbs_datastore_path: /srv/pbs-data

# PBS retention policy (lean: shares 1TB drive with Time Machine)
pbs_retention:
  keep_hourly: 6
  keep_daily: 3
  keep_weekly: 2
  keep_monthly: 1

# PBS garbage collection schedule (frees space from pruned snapshots)
pbs_gc_schedule: "daily"

# PBS API user for PVE node authentication
pbs_api_user: backup@pbs
pbs_api_token_name: ansible
