---
# =============================================================================
# media-vm - Nightly Media Maintenance Endpoint / Plex Maintenance Window
# =============================================================================

nightly_media_maintenance_profilarr_endpoint_enabled: false
nightly_media_maintenance_profilarr_ssh_user: johnny

nightly_media_maintenance_plex_preferences_enabled: true
nightly_media_maintenance_plex_url: http://127.0.0.1:32400
nightly_media_maintenance_plex_preferences_path: >-
  /opt/media-stack/plex/Library/Application
  Support/Plex Media Server/Preferences.xml
nightly_media_maintenance_plex_backup_root: >-
  /opt/media-stack/plex-preference-backups

# Keep Plex library updates and analysis out of normal viewing hours. Live
# filesystem-triggered scans caused Plex metadata endpoints to time out during
# appliance playback on 2026-06-02. The managed timer below refreshes libraries
# during the late overnight maintenance window instead.
nightly_media_maintenance_plex_library_scan_enabled: true
nightly_media_maintenance_plex_library_scan_calendar: "*-*-* 05:15:00"
nightly_media_maintenance_plex_library_scan_randomized_delay: 15min
nightly_media_maintenance_plex_preferences:
  # Plex runs in Docker bridge mode and otherwise publishes its unreachable
  # container address as the only local connection. Publish the VM's LAN URL
  # so LAN clients do not fall back to Plex Relay when the router does not
  # support NAT loopback. Remote clients use Plex's automatic secure public
  # direct URL; advertising the Tailscale URL as well made iOS/Infuse race
  # cellular, Wi-Fi, and Tailnet paths during a single playback session.
  customConnections: "https://192-168-1-136.\
    2f625c2a233b42319b8df2536e2441e6.plex.direct:32400"
  ButlerStartHour: "5"
  ButlerEndHour: "7"
  FSEventLibraryUpdatesEnabled: "0"
  FSEventLibraryPartialScanEnabled: "0"
  ScheduledLibraryUpdatesEnabled: "0"
  GenerateBIFBehavior: scheduled
  GenerateIntroMarkerBehavior: scheduled
  GenerateCreditsMarkerBehavior: scheduled
  GenerateAdMarkerBehavior: scheduled
  GenerateVADBehavior: scheduled
  GenerateChapterThumbBehavior: scheduled
  LoudnessAnalysisBehavior: scheduled
  MusicAnalysisBehavior: scheduled
  ScannerLowPriority: "1"
  TranscoderTempDirectory: /transcode
