# =============================================================================
# media-vm - Docker Compose Stacks
# =============================================================================

# Configs stored locally at /opt (migrated from VirtioFS)
# VirtioFS still used for media access:
#   /srv/media -> /srv/media (mergerfs pool)
#   /srv/incomplete_downloads -> /srv/media-downloads (Lacie SSD)
#   /srv/plex -> /srv/media/plex via ts440 /srv/plex-library (Plex library)
# Media containers should bind /srv/plex:/data, not /srv/media/plex:/data.
# Hardlinks across /data/downloads/complete and /data/Anime were verified on
# 2026-05-24 after /srv/media was found hanging while /srv/plex stayed healthy.
docker_stacks:
  - name: media-stack
    path: /opt/media-stack
    build: false
    remove_orphans: true
    auto_update_services:
      - lazylibrarian
  - name: portainer-agent
    path: /opt/portainer-agent
    build: false
  - name: immich
    path: /opt/immich
    build: false
  - name: diun
    path: /opt/diun
    build: false
    auto_update: true
  - name: docker-socket-proxy
    path: /opt/docker-socket-proxy
    build: false
    auto_update: true
