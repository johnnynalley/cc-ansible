---
# =============================================================================
# media-vm - Docker Compose Stacks
# =============================================================================

# Compose projects live under /opt. Plex data at /opt/media-stack/plex is a
# dedicated ZFS-backed VM disk mounted by filesystem_mounts, while Plex
# transcode scratch stays on local root at /var/lib/plex-transcode.
# Plex-side media services stay on media-vm. Sonarr/Radarr/Prowlarr/Bazarr,
# SABnzbd, qBittorrent, Gluetun, and Byparr are managed on docker-vm
# in that host's /opt/media-stack compose project.
# VirtioFS still provides media-vm storage access for Plex-side services:
#   /srv/media -> /srv/media (mergerfs pool)
#   /srv/plex -> /srv/media/plex via ts440 /srv/plex-library (Plex library)
docker_daemon_config:
  log-driver: json-file
  log-opts:
    max-size: "10m"
    max-file: "5"
  runtimes:
    nvidia:
      path: nvidia-container-runtime
      args: []

docker_stacks:
  - name: media-stack
    path: /opt/media-stack
    build: false
    remove_orphans: true
    auto_update_services:
      - lazylibrarian
  - name: portainer-agent
    path: /opt/portainer-agent
    build: false
  - name: immich
    path: /opt/immich
    build: false
  - name: diun
    path: /opt/diun
    build: false
    auto_update: true
  - name: docker-socket-proxy
    path: /opt/docker-socket-proxy
    build: false
    # This image can reach the Docker daemon socket. Keep upgrades attended
    # through normal Ansible convergence instead of blind registry pulls.
    auto_update: false
