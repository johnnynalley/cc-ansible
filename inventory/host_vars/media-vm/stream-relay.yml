# =============================================================================
# media-vm - Stream Relay Configuration
# =============================================================================

# OBS stream offload:
#   gaming PC OBS -> SRT over LAN -> media-vm FFmpeg/NVENC producer
#   producer -> reliable localhost fanout -> per-platform RTMP output workers
#
# The service is managed as enabled after the OBS/Twitch relay POC succeeded.
# Real platform stream keys stay live-only in /etc/stream-relay/stream-relay.env.
stream_relay_enabled: true

stream_relay_name: stream
stream_relay_env_file: /etc/stream-relay/stream-relay.env

stream_relay_mediamtx_version: "1.18.2"
stream_relay_mediamtx_arch: linux_amd64

stream_relay_broker_enabled: false
stream_relay_broker_rtmp_bind: "127.0.0.1"
stream_relay_broker_rtmp_port: 1935
stream_relay_broker_app: live
stream_relay_broker_stream: landscape
stream_relay_broker_input_url: "rtmp://127.0.0.1:1935/live/landscape"

stream_relay_output_enabled: true
stream_relay_outputs:
  - twitch
  - youtube
stream_relay_output_ports:
  twitch: 10000
  youtube: 10001
stream_relay_output_fanout_transport: tcp
stream_relay_output_audio_codecs:
  twitch: copy
  youtube: copy
stream_relay_output_fifo_size: 50000000
stream_relay_output_retry_seconds: 10

stream_relay_sysctl:
  net.core.rmem_default: 33554432
  net.core.rmem_max: 134217728
  net.core.wmem_default: 33554432
  net.core.wmem_max: 134217728
  net.core.netdev_max_backlog: 5000

# Park the separate Aitum-to-YouTube vertical relay for now. YouTube's automatic
# dual-stream mode is the active vertical path while SleepyChat only tracks one
# YouTube live chat cleanly.
stream_relay_vertical_enabled: false
stream_relay_vertical_ingest_bind: "100.66.6.113"
stream_relay_vertical_ingest_port: 1936
stream_relay_vertical_ingest_app: live
stream_relay_vertical_ingest_stream: vertical

# Broker the parked Aitum vertical feed for TikTok LIVE Studio on the MacBook:
#   gaming PC Aitum -> RTMP media-vm:1936/live/vertical
#   Mac OBS         -> RTMP media-vm:1936/live/vertical
# Mac OBS then exposes the feed to TikTok LIVE Studio as a virtual camera.
stream_relay_vertical_broker_enabled: true
stream_relay_vertical_broker_version: "{{ stream_relay_mediamtx_version }}"
stream_relay_vertical_broker_arch: "{{ stream_relay_mediamtx_arch }}"

# Bind to media-vm's LAN address so the high-bitrate OBS SRT feed stays on the
# same switch instead of traversing Tailscale.
stream_relay_ingest_bind: "192.168.1.136"
stream_relay_ingest_port: 9000
stream_relay_ingest_latency_us: 5000000
stream_relay_ingest_rcvbuf: 67108864
stream_relay_ingest_ffs: 67108864

stream_relay_twitch_rtmp_base: "rtmp://live.twitch.tv/app"
stream_relay_twitch_bandwidth_test: false
stream_relay_youtube_rtmp_base: "rtmp://a.rtmp.youtube.com/live2"
stream_relay_youtube_backup_rtmp_base: "rtmp://b.rtmp.youtube.com/live2"

stream_relay_video_encoder: h264_nvenc
stream_relay_video_preset: p6
stream_relay_video_tune: ll
stream_relay_video_profile: high
stream_relay_video_fps: 60
stream_relay_keyframe_interval_seconds: 2
stream_relay_video_bframes: 2
stream_relay_video_bitrate: 6000k
stream_relay_video_maxrate: 6000k
stream_relay_video_bufsize: 12000k

stream_relay_audio_bitrate: 160k
stream_relay_audio_sample_rate: 48000

stream_relay_recording_enabled: true
stream_relay_recording_spool_mount: /srv/stream-vod-spool
stream_relay_recording_spool_label: stream-vod-spool
stream_relay_recording_spool_device_glob: "/dev/disk/by-id/*streamvodspool*"
stream_relay_recording_final_dir: /srv/nextcloud-media/Stream VODs
stream_relay_recording_transfer_tmp_dir: /srv/nextcloud-media/.stream-vod-tmp
stream_relay_recording_nextcloud_scan_path: "/Johnny/files/Media/Stream VODs"
stream_relay_recording_file_prefix: stream
stream_relay_recording_uid: 33
stream_relay_recording_gid: 33
stream_relay_recording_min_valid_bytes: 1048576
stream_relay_recording_stale_incoming_minutes: 10

stream_relay_health_enabled: true
stream_relay_health_oncalendar: "*-*-* *:0/5"
stream_relay_health_state_dir: /var/lib/stream-relay-health
stream_relay_health_alert_cooldown_seconds: 1800
stream_relay_health_min_spool_free_gb: 20
stream_relay_health_max_backlog_age_minutes: 30

stream_relay_vertical_video_width: 1080
stream_relay_vertical_video_height: 1920
stream_relay_vertical_video_bitrate: 6000k
stream_relay_vertical_video_maxrate: 6000k
stream_relay_vertical_video_bufsize: 12000k
