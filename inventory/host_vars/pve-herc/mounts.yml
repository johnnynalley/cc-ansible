# =============================================================================
# pve-herc - Filesystem Mounts
# =============================================================================

filesystem_mounts:
  # 1TB drive - PBS datastore + Time Machine (bind-mounted into pbs-lxc CT 105)
  # FILL IN: replace UUID after formatting with mkfs.ext4 -L pbs-data /dev/sdX && blkid /dev/sdX
  - path: /srv/pbs-data
    src: /dev/disk/by-uuid/4b8f1479-bebe-4cc0-a9bd-778023087595
    fstype: ext4
    opts: "defaults,nofail,prjquota"
    reserved_blocks_percentage: 0
    project_quotas:
      # Keep PBS and Time Machine bounded on the shared 1TB backup disk.
      # setquota uses 1 KiB blocks: 520 GiB = 520 * 1024 * 1024.
      - path: /srv/pbs-data/.chunks
        project_id: 2001
        block_hard_limit: 545259520
