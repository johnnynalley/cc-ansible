# =============================================================================
# pve-herc - Proxmox Node Firewall Configuration
# =============================================================================

pve_node_firewall:
  enable: true
  rules:
    - { type: group, name: "corosync-lan", comment: "Cluster heartbeat" }
    - { action: ACCEPT, iface: vmbr0, proto: tcp, dport: 8006, comment: "Proxmox API (LAN)" }
    - { action: ACCEPT, iface: vmbr0, proto: tcp, dport: 22, comment: "SSH (LAN)" }
    - { action: ACCEPT, iface: vmbr0, proto: udp, dport: 5353, comment: "mDNS/Bonjour Time Machine discovery (LAN)" }
    - { action: ACCEPT, iface: vmbr0, proto: tcp, dport: 445, source: "192.168.1.0/24", comment: "SMB/Time Machine (LAN/mDNS)" }
    - { action: ACCEPT, iface: vmbr0, proto: tcp, dport: 445, source: "fe80::/10", comment: "SMB/Time Machine (IPv6 link-local mDNS)" }
    - { action: ACCEPT, iface: tailscale0, proto: tcp, dport: 8006, comment: "Proxmox API (Tailscale)" }
    - { action: ACCEPT, iface: tailscale0, proto: tcp, dport: 22, comment: "SSH (Tailscale)" }
    - { action: ACCEPT, iface: tailscale0, proto: icmp, comment: "Ping (Tailscale)" }
    - { action: ACCEPT, iface: tailscale0, proto: tcp, dport: 445, comment: "SMB/Time Machine (Tailscale)" }
    - { action: DROP, comment: "Default deny" }

# VM/CT firewall rules
pve_vm_firewalls:
  # freepbx-vm (VM 130) - FreePBX PBX Server
  130:
    enable: true
    policy_in: DROP
    rules:
      - { action: ACCEPT, proto: tcp, dport: 22, comment: "SSH" }
      - { action: ACCEPT, proto: udp, dport: 5060, source: "192.168.1.0/24", comment: "SIP from LAN (desk phone)" }
      - { action: ACCEPT, proto: udp, dport: 5060, comment: "SIP from VoIP.ms" }
      - { action: ACCEPT, proto: udp, dport: "10000:20000", comment: "RTP media" }
      - { action: ACCEPT, proto: tcp, dport: "80,443", source: "+dc/tailscale", comment: "FreePBX GUI (Tailscale only)" }
      - { action: ACCEPT, proto: tcp, dport: 8088, source: "+dc/docker-vm", comment: "ARI from docker-vm (AVA)" }

  # pbs-lxc (CT 105) - Proxmox Backup Server
  105:
    enable: true
    policy_in: DROP
    rules:
      - { action: ACCEPT, proto: tcp, dport: 22, comment: "SSH" }
      - { action: ACCEPT, proto: tcp, dport: 8007, comment: "PBS API/Web UI" }
