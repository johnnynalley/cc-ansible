# =============================================================================
# nextcloud-vm - Docker Compose Stacks
# =============================================================================

# VirtioFS mount: /srv/nextcloud -> /srv/nas-zfs/nextcloud on ts440
# Create docker-compose.yml at /opt/nextcloud before running docker-stacks
docker_stacks:
  - name: nextcloud-aio
    path: /opt/nextcloud
    build: false
  - name: portainer-agent
    path: /opt/portainer-agent
    build: false
  - name: diun
    path: /opt/diun
    build: false
    auto_update: true
  - name: docker-socket-proxy
    path: /opt/docker-socket-proxy
    build: false
    auto_update: true
