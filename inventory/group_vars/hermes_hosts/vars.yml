---
# =============================================================================
# Hermes shadow runtime defaults
# =============================================================================

hermes_shadow_mode: disabled
hermes_shadow_change_approved: false
hermes_shadow_install_approved: false
hermes_shadow_start_approved: false

# Operator-only official importer inventory. The default is inert. Dry-run
# mode builds a temporary shape-only view and never exposes the live source to
# a Hermes service identity.
hermes_openclaw_dry_run_mode: disabled
hermes_openclaw_dry_run_approved: false
hermes_openclaw_dry_run_contract_source: >-
  files/hermes/openclaw-dry-run-contract.json
hermes_openclaw_dry_run_contract_live: >-
  /usr/local/share/hermes-shadow/openclaw-dry-run-contract.json
hermes_openclaw_dry_run_script_source: >-
  scripts/agents/hermes-openclaw-dry-run.py
hermes_openclaw_dry_run_script_live: >-
  /usr/local/libexec/hermes-openclaw-dry-run

# Curated profile-memory seed transaction. Vault-encrypted source files are
# validated with Hermes's native scanner before any target memory changes.
hermes_profile_memory_mode: disabled
hermes_profile_memory_approved: false
hermes_profile_memory_contract_source: >-
  files/hermes/profile-memory-contract.json
hermes_profile_memory_validator_source: >-
  scripts/agents/hermes-memory-seed-validate.py
hermes_profile_memory_validator_live: >-
  /usr/local/libexec/hermes-memory-seed-validate
hermes_profile_memory_rollback_root: >-
  /srv/live-rollbacks/jn-t14s-lin/hermes-migration

# Reviewed, declarative Hermes-native profile skills. The managed external
# skill roots are immutable to the service identities and are staged without
# starting a Gateway, scheduler, messaging route, or model.
hermes_profile_skills_mode: disabled
hermes_profile_skills_approved: false
hermes_profile_skills_contract_source: >-
  files/hermes/profile-skills-contract.json
hermes_profile_skills_validator_source: >-
  scripts/agents/hermes-profile-skills-validate.py
hermes_profile_skills_validator_live: >-
  /usr/local/libexec/hermes-profile-skills-validate
hermes_profile_skills_contract_live: >-
  /etc/hermes/profile-skills-contract.json
hermes_profile_skills_rollback_root: >-
  /srv/live-rollbacks/jn-t14s-lin/hermes-migration

# Reviewed project data and operator references copied into a new isolated
# Hermes generation. This remains disabled and does not import memory,
# credentials, structured runtime state, schedules, routes, or model context.
hermes_profile_data_mode: disabled
hermes_profile_data_approved: false
hermes_profile_data_contract_source: >-
  files/hermes/profile-data-stage-contract.json
hermes_profile_data_contract_live: /etc/hermes/profile-data-stage-contract.json
hermes_profile_data_stager_source: >-
  scripts/agents/hermes-profile-data-stage.py
hermes_profile_data_stager_live: /usr/local/libexec/hermes-profile-data-stage
hermes_profile_data_root: /var/lib/hermes/profile-data
hermes_profile_data_manifest_live: /etc/hermes/profile-data-manifest.json
hermes_profile_data_rollback_root: >-
  /srv/live-rollbacks/jn-t14s-lin/hermes-migration

# Strictly normalized legacy runtime state. Raw OpenClaw files are parsed only
# by the root-owned transformer and are never mounted into a Hermes profile.
hermes_profile_transforms_mode: disabled
hermes_profile_transforms_approved: false
hermes_profile_transforms_contract_source: >-
  files/hermes/profile-transform-contract.json
hermes_profile_transforms_contract_live: >-
  /etc/hermes/profile-transform-contract.json
hermes_profile_transformer_source: >-
  scripts/agents/hermes-profile-transform.py
hermes_profile_transformer_live: /usr/local/libexec/hermes-profile-transform
hermes_profile_transforms_root: /var/lib/hermes/profile-transforms
hermes_profile_transforms_manifest_live: >-
  /etc/hermes/profile-transforms-manifest.json
hermes_profile_transforms_rollback_root: >-
  /srv/live-rollbacks/jn-t14s-lin/hermes-migration

# Root-reviewed, hook-only Astra privacy boundary for asynchronous native Star
# delegation. It adds no model tool and is validated before Gateway startup.
hermes_star_privacy_plugin_source: >-
  files/hermes/plugins/star-dispatch-privacy
hermes_star_privacy_plugin_managed_root: >-
  /etc/hermes/astra/plugins/star-dispatch-privacy
hermes_star_privacy_plugin_runtime_root: >-
  /var/lib/hermes/astra/plugins/star-dispatch-privacy
hermes_star_privacy_validator_source: >-
  scripts/agents/hermes-star-dispatch-privacy-validate.py
hermes_star_privacy_validator_live: >-
  /usr/local/libexec/hermes-star-dispatch-privacy-validate

# Root-managed Tirith transaction provenance. The release track remains the
# official latest channel; these values record the currently reviewed artifact
# and are advanced only through an attended root-owned update transaction.
hermes_tirith_release_track: official-latest
hermes_tirith_version: 0.3.3
hermes_tirith_release_base_url: >-
  https://github.com/sheeki03/tirith/releases/download/v0.3.3
hermes_tirith_archive_name: tirith-x86_64-unknown-linux-gnu.tar.gz
hermes_tirith_archive_sha256: >-
  6cdbe35e8f9ccf42e70ad95b501c93cd218ac18201c3df958d54f6ba0d995ce2
hermes_tirith_checksums_sha256: >-
  acb5544bb8f98e8d6760e5bdd6b5f3a878e17af485c11e3b736cfd30f9641371
hermes_tirith_signature_sha256: >-
  d794010c10ca6b9898efbfb856685f10bd12ebc2a619f9cf0f218f9989ba5c75
hermes_tirith_certificate_encoded_sha256: >-
  aefa92fe00b89f92dee402bb67f9d0d4dd03bdd69fe70f4217a30e5cbe18e99c
hermes_tirith_certificate_sha256: >-
  bf04bd991bbb70ee8022a3341b7288aff619872a4837c4d07e6cd89f724e29ca
hermes_tirith_cache_root: /var/cache/hermes/tirith-0.3.3
hermes_tirith_archive_cache: >-
  /var/cache/hermes/tirith-0.3.3/tirith-x86_64-unknown-linux-gnu.tar.gz
hermes_tirith_checksums_cache: >-
  /var/cache/hermes/tirith-0.3.3/checksums.txt
hermes_tirith_signature_cache: >-
  /var/cache/hermes/tirith-0.3.3/checksums.txt.sig
hermes_tirith_certificate_encoded_cache: >-
  /var/cache/hermes/tirith-0.3.3/checksums.txt.pem.b64
hermes_tirith_certificate_cache: >-
  /var/cache/hermes/tirith-0.3.3/checksums.txt.pem
hermes_tirith_extract_root: /var/cache/hermes/tirith-0.3.3/extracted
hermes_tirith_binary: /usr/local/libexec/hermes-tirith
hermes_tirith_cosign_identity_regexp: >-
  ^https://github.com/sheeki03/tirith/\.github/workflows/release\.yml@refs/tags/v
hermes_tirith_cosign_issuer: https://token.actions.githubusercontent.com

hermes_shadow_source_repo: https://github.com/NousResearch/hermes-agent.git
hermes_shadow_install_ref: v2026.8.3
hermes_shadow_expected_tag_object: 7de39e700d2c329e15d32eb0b96e2f7cdd9fbdb2
hermes_shadow_expected_commit: 3c27eb6234bf91b8ceee9e9071591b31e9b148cb
hermes_shadow_uv_version: 0.12.4
hermes_shadow_uv_archive_url: >-
  https://github.com/astral-sh/uv/releases/download/0.12.4/uv-x86_64-unknown-linux-gnu.tar.gz
hermes_shadow_uv_archive_sha256: >-
  c8c60f47e6f88d18dbf6f33d7279fb1fbf7ae76631768152cf5578c3d65729b4
hermes_shadow_uv_archive_cache: /var/cache/hermes/uv-0.12.4.tar.gz
hermes_shadow_uv_extract_dir: /var/cache/hermes/uv-0.12.4
hermes_shadow_uv_cache_dir: /var/cache/hermes/uv-cache
hermes_shadow_uv_binary: /var/lib/hermes/bootstrap/bin/uv
hermes_shadow_uv_config_home: /var/lib/hermes/bootstrap/config
hermes_shadow_uv_config_dirs: /var/lib/hermes/bootstrap/config-dirs
hermes_shadow_runtime_binary: /usr/local/bin/hermes
hermes_shadow_runtime_root: /usr/local/lib/hermes-agent
hermes_shadow_runtime_venv: /usr/local/lib/hermes-agent/venv
hermes_shadow_config_version: 34
hermes_shadow_contract_source: files/hermes/shadow-target.json
hermes_shadow_contract_live: /usr/local/share/hermes-shadow/shadow-target.json
hermes_shadow_audit_live: /usr/local/libexec/hermes-shadow-target-audit
hermes_discord_contract_source: files/hermes/discord-cutover-contract.json
hermes_discord_contract_live: >-
  /usr/local/share/hermes-shadow/discord-cutover-contract.json
hermes_discord_audit_source: >-
  scripts/agents/hermes-discord-cutover-audit.py
hermes_discord_audit_live: /usr/local/libexec/hermes-discord-cutover-audit
hermes_automation_contract_source: files/hermes/automation-contract.json
hermes_automation_contract_live: >-
  /usr/local/share/hermes-shadow/automation-contract.json
hermes_automation_audit_source: >-
  scripts/agents/hermes-automation-contract-audit.py
hermes_automation_audit_live: >-
  /usr/local/libexec/hermes-automation-contract-audit
hermes_rigel_schedule_source: scripts/agents/hermes-rigel-schedule.py
hermes_rigel_schedule_manifest_source: >-
  files/hermes/jobs/rigel-academic-alerts.json

hermes_shadow_profiles:
