  - 19789
  - 19790
hermes_production_cutover_health_port: 18791
hermes_production_cutover_rigel_job_name: rigel-academic-alerts
hermes_production_cutover_completion_message: >-
  Hermes cutover complete. Astra and Dubble are live; Rigel is available in
  its channel and its idle academic checks remain silent.
# Keep Astra's current Rigel route intact until a separately enrolled Discord
# identity has passed the attended cutover. This flag is supplied only for the
# exact automation transaction that installs the private token, moves the
# channel and schedule, and starts Rigel's existing isolated Gateway.
hermes_rigel_dedicated_discord_enabled: true
hermes_rigel_discord_bot_token: >-
  {{ vault_hermes_rigel_discord_bot_token | default('') }}
hermes_production_consumer_profiles: >-
  {{
    hermes_shadow_profiles
    if hermes_rigel_dedicated_discord_enabled | bool
    else hermes_shadow_profiles[:2]
  }}
hermes_rigel_discord_guild_id: "1209365945882251294"
hermes_rigel_discord_channel_id: "1488752822466904256"
hermes_astra_discord_channel_id: "1482585492330381343"
hermes_astra_logs_channel_id: "1482589440663617638"
hermes_dubble_logs_channel_id: "1483229869079920741"
hermes_production_runtime_mode: disabled
hermes_production_runtime_approved: false
hermes_production_runtime_confirmation: ""
hermes_production_runtime_required_confirmation: >-
  converge-live-hermes-runtime-on-jn-t14s-lin
# Native Gateway units are created by the dedicated migration/cutover path.
# Routine runtime convergence validates and hardens existing units without
# rewriting them. Set this only for an explicitly reviewed native-unit repair.
hermes_production_runtime_reinstall_native_units: false
# Empty during routine convergence. A separate transaction that atomically
# replaces a bind-mounted skill or profile-data root must name the affected
# profiles explicitly so they enter one planned restart after every staged
# dependency is ready.
hermes_production_runtime_force_restart_profiles: []
