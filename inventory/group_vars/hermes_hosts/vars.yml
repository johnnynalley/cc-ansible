---
# =============================================================================
# Hermes shadow runtime defaults
# =============================================================================

hermes_shadow_mode: disabled
hermes_shadow_change_approved: false
hermes_shadow_install_approved: false
hermes_shadow_start_approved: false

# Production replacement transaction. This remains inert unless the operator
# supplies all three controls to the dedicated cutover playbook. The exact
# confirmation string prevents a generic `-e approved=true` from stopping the
# active OpenClaw delivery path.
hermes_production_cutover_mode: disabled
hermes_production_cutover_approved: false
hermes_production_cutover_confirmation: ""
hermes_production_cutover_required_confirmation: >-
  replace-openclaw-with-hermes-on-jn-t14s-lin
hermes_production_cutover_rollback_root: >-
  /srv/live-rollbacks/jn-t14s-lin/hermes-migration
hermes_production_cutover_evidence_root: /var/lib/hermes/cutover-evidence
hermes_production_cutover_enrollment: >-
  /etc/hermes/private-discord-enrollment.json
hermes_production_cutover_source_env: /home/johnny/.openclaw/.env
hermes_production_cutover_source_config: /home/johnny/.openclaw/openclaw.json
hermes_production_cutover_source_database: >-
  /home/johnny/.openclaw/state/openclaw.sqlite
hermes_production_cutover_source_session_indexes:
  - name: main
    path: /home/johnny/.openclaw/agents/main/sessions/sessions.json
  - name: dubble
    path: /home/johnny/.openclaw/agents/dubble/sessions/sessions.json
  - name: rigel
    path: /home/johnny/.openclaw/agents/rigel/sessions/sessions.json
  - name: vega
    path: /home/johnny/.openclaw/agents/vega/sessions/sessions.json
  - name: antares
    path: /home/johnny/.openclaw/agents/antares/sessions/sessions.json
hermes_production_cutover_recovery_session_index: >-
  /home/johnny/.openclaw/agents/main/sessions/sessions.json
# Exact content-derived fingerprints are supplied only for an attended cutover.
# An empty set preserves the strict read-only delivery gate.
hermes_production_cutover_recovery_fingerprints: []
hermes_production_cutover_user: johnny
hermes_production_cutover_user_uid: 1000
hermes_production_cutover_user_gateway: openclaw-gateway.service
hermes_production_cutover_health_service: health-receiver.service
hermes_production_cutover_source_system_units:
  - name: openclaw-isolated-gateway.service
    restore: started-disabled
  - name: openclaw-isolated-codex.service
    restore: started-disabled
  - name: openclaw-repo-sync.timer
    restore: started-enabled
  - name: openclaw-update-check.timer
    restore: started-enabled
hermes_production_cutover_source_ports:
  - 18789
  - 19789
  - 19790
hermes_production_cutover_health_port: 18791
hermes_production_cutover_rigel_source: >-
  /var/lib/hermes/profile-transforms/rigel/managed/imports/courses/academic-state.json
hermes_production_cutover_rigel_root: /var/lib/hermes/rigel-channel-state
hermes_production_cutover_rigel_job_name: rigel-academic-alerts
hermes_production_cutover_completion_message: >-
  Hermes cutover complete. Astra and Dubble are live; Rigel is available in
  its channel and its idle academic checks remain silent.
hermes_production_runtime_mode: disabled
hermes_production_runtime_approved: false
hermes_production_runtime_confirmation: ""
hermes_production_runtime_required_confirmation: >-
  converge-live-hermes-runtime-on-jn-t14s-lin
hermes_gateway_readiness_marker: .gateway-ready
hermes_gateway_legacy_readiness_marker: .shadow-ready

# Operator-only official importer inventory. The default is inert. Dry-run
# mode builds a temporary shape-only view and never exposes the live source to
# a Hermes service identity.
hermes_openclaw_dry_run_mode: disabled
hermes_openclaw_dry_run_approved: false
hermes_openclaw_dry_run_contract_source: >-
  files/hermes/openclaw-dry-run-contract.json
hermes_openclaw_dry_run_contract_live: >-
  /usr/local/share/hermes-shadow/openclaw-dry-run-contract.json
hermes_openclaw_dry_run_script_source: >-
  scripts/agents/hermes-openclaw-dry-run.py
hermes_openclaw_dry_run_script_live: >-
  /usr/local/libexec/hermes-openclaw-dry-run

# Curated profile-memory seed transaction. Vault-encrypted source files are
# validated with Hermes's native scanner before any target memory changes.
hermes_profile_memory_mode: disabled
hermes_profile_memory_approved: false
hermes_profile_memory_contract_source: >-
  files/hermes/profile-memory-contract.json
hermes_profile_memory_validator_source: >-
  scripts/agents/hermes-memory-seed-validate.py
hermes_profile_memory_validator_live: >-
  /usr/local/libexec/hermes-memory-seed-validate
hermes_profile_memory_rollback_root: >-
  /srv/live-rollbacks/jn-t14s-lin/hermes-migration

# Reviewed, declarative Hermes-native profile skills. The managed external
# skill roots are immutable to the service identities and are staged without
# starting a Gateway, scheduler, messaging route, or model.
hermes_profile_skills_mode: disabled
hermes_profile_skills_approved: false
hermes_profile_skills_contract_source: >-
  files/hermes/profile-skills-contract.json
hermes_profile_skills_validator_source: >-
  scripts/agents/hermes-profile-skills-validate.py
hermes_profile_skills_validator_live: >-
  /usr/local/libexec/hermes-profile-skills-validate
hermes_profile_skills_contract_live: >-
  /etc/hermes/profile-skills-contract.json
hermes_profile_skills_rollback_root: >-
  /srv/live-rollbacks/jn-t14s-lin/hermes-migration

# Reviewed project data and operator references copied into a new isolated
# Hermes generation. This remains disabled and does not import memory,
# credentials, structured runtime state, schedules, routes, or model context.
hermes_profile_data_mode: disabled
hermes_profile_data_approved: false
hermes_profile_data_contract_source: >-
  files/hermes/profile-data-stage-contract.json
hermes_profile_data_contract_live: /etc/hermes/profile-data-stage-contract.json
hermes_profile_data_stager_source: >-
  scripts/agents/hermes-profile-data-stage.py
hermes_profile_data_stager_live: /usr/local/libexec/hermes-profile-data-stage
hermes_profile_data_root: /var/lib/hermes/profile-data
hermes_profile_data_manifest_live: /etc/hermes/profile-data-manifest.json
hermes_profile_data_rollback_root: >-
  /srv/live-rollbacks/jn-t14s-lin/hermes-migration

# Strictly normalized legacy runtime state. Raw OpenClaw files are parsed only
# by the root-owned transformer and are never mounted into a Hermes profile.
hermes_profile_transforms_mode: disabled
hermes_profile_transforms_approved: false
hermes_profile_transforms_contract_source: >-
  files/hermes/profile-transform-contract.json
hermes_profile_transforms_contract_live: >-
  /etc/hermes/profile-transform-contract.json
hermes_profile_transformer_source: >-
  scripts/agents/hermes-profile-transform.py
hermes_profile_transformer_live: /usr/local/libexec/hermes-profile-transform
hermes_profile_transforms_root: /var/lib/hermes/profile-transforms
hermes_profile_transforms_manifest_live: >-
  /etc/hermes/profile-transforms-manifest.json
hermes_profile_transforms_rollback_root: >-
  /srv/live-rollbacks/jn-t14s-lin/hermes-migration

# Root-reviewed, hook-only Astra privacy boundary for asynchronous native Star
# delegation. It adds no model tool and is validated before Gateway startup.
hermes_star_privacy_plugin_source: >-
  files/hermes/plugins/star-dispatch-privacy
hermes_star_privacy_plugin_managed_root: >-
  /etc/hermes/astra/plugins/star-dispatch-privacy
hermes_star_privacy_plugin_runtime_root: >-
  /var/lib/hermes/astra/plugins/star-dispatch-privacy
hermes_star_privacy_validator_source: >-
  scripts/agents/hermes-star-dispatch-privacy-validate.py
hermes_star_privacy_validator_live: >-
  /usr/local/libexec/hermes-star-dispatch-privacy-validate

# Root-owned native Astra tools for redacted estate-wide Docker inventory and
# the fixed Ansible-managed updater trigger. Separate systemd credentials reach
# only forced-command SSH boundaries; neither path grants a terminal, file
# tool, Docker socket, Compose selection, or arbitrary command.
hermes_docker_inventory_plugin_source: >-
  files/hermes/plugins/agent-docker-inventory
hermes_docker_inventory_plugin_managed_root: >-
  /etc/hermes/astra/plugins/agent-docker-inventory
hermes_docker_inventory_plugin_runtime_root: >-
  /var/lib/hermes/astra/plugins/agent-docker-inventory
hermes_docker_inventory_validator_source: >-
  scripts/agents/hermes-agent-docker-inventory-validate.py
hermes_docker_inventory_validator_live: >-
  /usr/local/libexec/hermes-agent-docker-inventory-validate
hermes_docker_inventory_private_root: /etc/hermes/private/docker-access
hermes_docker_inventory_private_key: >-
  /etc/hermes/private/docker-access/report_ed25519
hermes_docker_update_private_key: >-
  /etc/hermes/private/docker-access/update_ed25519
hermes_docker_inventory_known_hosts: /etc/hermes/astra/docker-known-hosts
hermes_docker_inventory_mode: disabled
hermes_docker_inventory_approved: false
hermes_docker_inventory_confirmation: ""
hermes_docker_inventory_required_confirmation: >-
  enable-hermes-docker-access-on-jn-t14s-lin
hermes_docker_inventory_host_keys:
  192.168.1.153: >-
    ssh-ed25519
    AAAAC3NzaC1lZDI1NTE5AAAAIJWZ8sNcINmltoWhEoe+kagWrltvsXB3h0FEZ9rQ36db
  192.168.1.136: >-
    ssh-ed25519
    AAAAC3NzaC1lZDI1NTE5AAAAIIy1pZcC3KfU/2skADHJlSUo0cG8lGHdbbZvyEkw6ryg
  192.168.1.78: >-
    ssh-ed25519
    AAAAC3NzaC1lZDI1NTE5AAAAIG6Be/AJgN/J+4z0srzlbRulBxvQKSWb6tCEVPPxZ8Z6
  192.168.1.31: >-
    ssh-ed25519
    AAAAC3NzaC1lZDI1NTE5AAAAINjxi55jYExGWzjkMhtUQMxUQohrS90bEODPpg/XWfTQ
hermes_docker_inventory_smoke_source: >-
  scripts/agents/hermes-agent-docker-inventory-smoke.py
hermes_docker_inventory_smoke_live: >-
  /usr/local/libexec/hermes-agent-docker-inventory-smoke

# Tirith bootstrap transaction provenance. These exact values authenticate the
