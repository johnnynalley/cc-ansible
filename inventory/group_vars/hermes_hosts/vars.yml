hermes_native_update_user: hermes-astra
hermes_native_update_group: hermes-astra
hermes_native_update_home: /var/lib/hermes/astra
hermes_native_update_service: hermes-native-update.service
hermes_native_update_timer: hermes-native-update.timer
hermes_tirith_update_service: hermes-tirith-native-update.service
hermes_tirith_update_timer: hermes-tirith-native-update.timer
# Timers remain staged while Hermes has no production route. The attended
# cutover must set this true so both native updaters run automatically.
hermes_native_updates_automatic: false
hermes_native_update_calendar: daily
hermes_native_update_randomized_delay: 6h
# Hermes ships DDGS as a supported native post-setup backend instead of a
# locked core extra. Keep the selection explicit and re-run the idempotent
# native hook after bootstrap/update so web research cannot disappear when the
# shared environment is rebuilt.
hermes_native_post_setup_keys:
  - ddgs
hermes_shadow_version_only_migration_from: 36
hermes_shadow_config_version: 37
hermes_shadow_contract_source: files/hermes/shadow-target.json
hermes_shadow_contract_live: /usr/local/share/hermes-shadow/shadow-target.json
hermes_shadow_audit_live: /usr/local/libexec/hermes-shadow-target-audit
hermes_discord_contract_source: files/hermes/discord-cutover-contract.json
hermes_discord_contract_live: >-
  /usr/local/share/hermes-shadow/discord-cutover-contract.json
hermes_discord_audit_source: >-
  scripts/agents/hermes-discord-cutover-audit.py
hermes_discord_audit_live: /usr/local/libexec/hermes-discord-cutover-audit
hermes_discord_runtime_audit_source: >-
  scripts/agents/hermes-discord-runtime-audit.py
hermes_discord_runtime_audit_live: >-
  /usr/local/libexec/hermes-discord-runtime-audit
hermes_discord_enroll_source: scripts/agents/hermes-discord-enroll.py
hermes_discord_enroll_live: /usr/local/libexec/hermes-discord-enroll
hermes_delivery_reconcile_source: >-
