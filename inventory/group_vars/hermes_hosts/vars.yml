hermes_arr_api_services:
  - name: sonarr
    source_host: docker-vm
    config: /opt/media-stack/sonarr/config.xml
    format: xml
    port: 8989
    api_header: X-Api-Key
    path_prefixes: [/api/v3/]
    status_path: /api/v3/system/status
  - name: radarr
    source_host: docker-vm
    config: /opt/media-stack/radarr/config.xml
    format: xml
    port: 7878
    api_header: X-Api-Key
    path_prefixes: [/api/v3/]
    status_path: /api/v3/system/status
  - name: prowlarr
    source_host: docker-vm
    config: /opt/media-stack/prowlarr/config.xml
    format: xml
    port: 9696
    api_header: X-Api-Key
    path_prefixes: [/api/v1/]
    status_path: /api/v1/system/status
  - name: bazarr
    source_host: docker-vm
    config: /opt/media-stack/bazarr/config/config.yaml
    format: yaml
    port: 6767
    api_header: X-API-KEY
    path_prefixes: [/api/]
    status_path: /api/system/status

