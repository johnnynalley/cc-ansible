---
# =============================================================================
# Hermes shadow runtime defaults
# =============================================================================

hermes_shadow_mode: disabled
hermes_shadow_change_approved: false
hermes_shadow_maintenance_confirmation: ""
hermes_shadow_maintenance_required_confirmation: >-
  maintain-native-hermes-runtime-on-jn-t14s-lin
