hermes_tirith_release_track: official-latest
hermes_tirith_version: 0.3.3
hermes_tirith_release_base_url: >-
  https://github.com/sheeki03/tirith/releases/download/v0.3.3
hermes_tirith_archive_name: tirith-x86_64-unknown-linux-gnu.tar.gz
hermes_tirith_archive_sha256: >-
  6cdbe35e8f9ccf42e70ad95b501c93cd218ac18201c3df958d54f6ba0d995ce2
hermes_tirith_checksums_sha256: >-
  acb5544bb8f98e8d6760e5bdd6b5f3a878e17af485c11e3b736cfd30f9641371
