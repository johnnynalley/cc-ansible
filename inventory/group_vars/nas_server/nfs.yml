# =============================================================================
# NAS Server - NFS Server Configuration
# =============================================================================
# Portable: applies to whichever host is in the [nas_server] group

nfs_pseudo_root: /srv
nfs_pseudo_root_clients: "100.108.254.100(ro,fsid=0,no_subtree_check) 192.168.1.153(ro,fsid=0,no_subtree_check) 100.73.46.86(ro,fsid=0,no_subtree_check) 100.81.29.94(ro,fsid=0,no_subtree_check)"

nfs_exports:
  # docker-vm gets access to media via mergerfs (includes podcasts from all pools)
  # Both Tailscale and LAN IPs for docker-vm (LAN is more stable for Docker NFS volumes)
  - name: media
    bind_source: /srv/media
    requires_mount: srv-media.mount
    owner: johnny
    group: smbusers
    mode: "2775"
    clients:
      - host: 100.108.254.100
        options: "rw,sync,no_subtree_check,no_root_squash,fsid=10"
      - host: 192.168.1.153
        options: "rw,sync,no_subtree_check,no_root_squash,fsid=10"

  # Incomplete downloads on Lacie SSD for SABnzbd/qBittorrent temp storage
  # Dedicated fast SSD separate from mergerfs for download performance
  - name: incomplete-downloads
    bind_source: /srv/media-downloads
    owner: johnny
    group: johnny
    mode: "0775"
    subdirs:
      - path: incomplete
        owner: johnny
        group: johnny
        mode: "2775"
      - path: incomplete/torrents
        owner: johnny
        group: johnny
        mode: "2775"
      - path: incomplete/torrents/tv-sonarr
        owner: johnny
        group: johnny
        mode: "2775"
      - path: incomplete/torrents/sonarr
        owner: johnny
        group: johnny
        mode: "2775"
      - path: incomplete/torrents/radarr
        owner: johnny
        group: johnny
        mode: "2775"
      - path: incomplete/usenet
        owner: johnny
        group: johnny
        mode: "2775"
    clients:
      - host: 100.108.254.100
        options: "rw,sync,no_subtree_check,no_root_squash,fsid=11"
      - host: 192.168.1.153
        options: "rw,sync,no_subtree_check,no_root_squash,fsid=11"

  # Archive/ISO storage used by downloader categories. This is deliberately
  # separate from the media hardlink path; completed Arr imports stay under
  # /srv/media/plex via the single media export above.
  - name: archive
    bind_source: /srv/nas-zfs/archive
    requires_mount: srv-nas\x2dzfs-archive.mount
    owner: johnny
    group: johnny
    mode: "0775"
    clients:
      - host: 100.108.254.100
        options: "rw,sync,no_subtree_check,no_root_squash,fsid=12"
      - host: 192.168.1.153
        options: "rw,sync,no_subtree_check,no_root_squash,fsid=12"

  # Sanoid-backed live rollback cache for one-off config/data backups.
  - name: live-rollbacks
    bind_source: /srv/nas-zfs/backups/live-rollbacks
    requires_mount: srv-nas\x2dzfs-backups-live\x2drollbacks.mount
    owner: johnny
    group: johnny
    mode: "2775"
    clients:
      - host: 100.108.254.100
        options: "rw,sync,no_subtree_check,no_root_squash,fsid=13"
      - host: 192.168.1.153
        options: "rw,sync,no_subtree_check,no_root_squash,fsid=13"
      - host: 100.73.46.86
        options: "rw,sync,no_subtree_check,no_root_squash,fsid=13"
      - host: 100.81.29.94
        options: "rw,sync,no_subtree_check,no_root_squash,fsid=13"
