# =============================================================================
# NAS Server - MergerFS Configuration
# =============================================================================
# Portable: applies to whichever host is in the [nas_server] group
# Hardware-specific drive paths may need adjustment on different hardware

# MergerFS media pool mount
mergerfs_mount_path: /srv/media
mergerfs_mount_type: fuse.mergerfs

# Branches (source paths combined into the pool)
mergerfs_branches:
  - /srv/nas-01/media
  - /srv/nas-zfs/media
  - /srv/media-01/media
  - /srv/media-02/media
  - /srv/media-03/media
  - /srv/media-04/media
  - /srv/media-05/media
  - /srv/media-06/media

mergerfs_branch_subdirectories:
  - path: plex/.sonarr-recycle-bin
    owner: johnny
    group: johnny
    mode: "0775"
  - path: plex/.radarr-recycle-bin
    owner: johnny
    group: johnny
    mode: "0775"

# Mount options
# - inodecalc=path-hash: Stable inode numbers for NFS compatibility (prevents ESTALE)
# - noforget,use_ino: Keep stable FUSE inode identity for NFS clients of the mergerfs export
# - func.getattr=newest: Consistent file attributes across drives for NFS
# - cache.files=off: Disable file caching (VirtioFS handles caching)
# - category.create=epmfs: Existing path most free space — keeps related files on the same branch for hardlinks
# - moveonenospc=true: Move writes to another branch if one is full
# - minfreespace=50G: Minimum free space per branch before skipping
# - statfs=full: Report combined space from all branches
mergerfs_options: "allow_other,noforget,use_ino,inodecalc=path-hash,func.getattr=newest,cache.files=off,dropcacheonclose=true,category.create=epmfs,moveonenospc=true,minfreespace=50G,statfs=full,fsname=mergerfs"

# Systemd dependencies (After= only, NOT Requires= - mixed ZFS/fstab breaks Requires=)
mergerfs_after_units:
  - zfs-mount.service
  - srv-nas\x2d01.mount
  - srv-nas\x2dzfs-media.mount
  - srv-media\x2d01-media.mount
  - srv-media\x2d02-media.mount
  - srv-media\x2d03-media.mount
  - srv-media\x2d04.mount
  - srv-media\x2d05.mount
  - srv-media\x2d06.mount

# Default path excludes for mergerfs-balance
# These paths should stay on nas_zfs (mirrored) and not be moved to single-drive pools
# Deployed to /etc/mergerfs-balance.conf, loaded automatically by the script
mergerfs_balance_exclude_paths:
  - "/srv/nas-zfs/media/photos/*"
  - "/srv/nas-zfs/media/archive/*"
  - "/srv/nas-zfs/media/books/*"

mergerfs_balance_media_stack_control_enabled: true
mergerfs_balance_media_stack_ssh_host: "192.168.1.153"
mergerfs_balance_media_stack_ssh_user: johnny
mergerfs_balance_media_stack_ssh_key_path: /root/.ssh/mergerfs_balance_media_stack_ed25519
