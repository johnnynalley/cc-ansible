# =============================================================================
# NAS Server - Filesystem Mounts (Physical Drives + Bind Mounts)
# =============================================================================
# Portable: drives and bind mounts travel with the NAS role.
# If migrating to new hardware with the same drives, UUIDs stay the same.
# ZFS drives (nas_zfs, media-01, media-02) are managed by ZFS, NOT listed here.
# DAS-backed ext4 branches are managed here. Keep them out of ZFS because a
# shared USB transport interruption would fault each affected single-disk pool.

filesystem_mounts:
  # --- Physical Drives ---

  # 2TB Lacie SSD (ext4) - mergerfs media branch
  # Timeout matches other USB drives (60s). 5s was the original value and
  # caused emergency-mode boot when the new UPS slowed cold enumeration past 5s.
  - path: /srv/nas-01
    src: "UUID=f356a268-d53b-41fa-95a7-3df47c1c22bc"
    fstype: ext4
    opts: "noatime,nofail,x-systemd.device-timeout=60s"
    owner: johnny
    group: smbusers
    mode: "2775"

  # 3TB HGST HDD in four-bay USB DAS (ext4) - media overflow
  - path: /srv/media-03
    src: "UUID=f1f082d7-25db-4e7b-9a19-163af9a25e26"
    fstype: ext4
    opts: "noatime,nofail,x-systemd.device-timeout=60s"

  # 2TB Hitachi HDD in four-bay USB DAS (ext4) - mergerfs media branch
  - path: /srv/media-04
    src: "UUID=42a062bb-af07-4cfb-8c80-3250c1c76bfb"
    fstype: ext4
    opts: "noatime,nofail,x-systemd.device-timeout=60s"
    owner: johnny
    group: smbusers
    mode: "2775"

  # 2TB WD My Passport via USB-SATA (ext4) - mergerfs media branch
  # WD20NMVW-11EDZS6, ex-Xbox One game drive
  - path: /srv/media-05
    src: "UUID=0678c124-151a-4db6-aa91-fde4d6400833"
    fstype: ext4
    opts: "noatime,nofail,x-systemd.device-timeout=60s"
    owner: johnny
    group: smbusers
    mode: "2775"

  # 2TB WD Elements via USB (ext4) - mergerfs media branch
  # WDC WD20JDRW-11C7VS0, formerly encrypted nas-02
  - path: /srv/media-06
    src: "UUID=8b70c770-3335-4dcb-b618-f9336ca39b59"
    fstype: ext4
    opts: "noatime,nofail,x-systemd.device-timeout=60s"
    owner: johnny
    group: smbusers
    mode: "2775"

  # 1TB Toshiba HDD via USB DAS (ext4) - mergerfs media branch
  # TOSHIBA HDWD110, formerly pve-herc PBS/Time Machine disk
  - path: /srv/media-07
    src: "UUID=9bbf6f89-f244-411d-9373-081157d708ca"
    fstype: ext4
    opts: "noatime,nofail,x-systemd.device-timeout=60s"
    owner: johnny
    group: smbusers
    mode: "2775"

  # 1TB Samsung 860 EVO via USB-SATA (ext4) - SABnzbd/qBittorrent incomplete downloads
  # Dedicated scratch filesystem outside the mergerfs branch tree. The previous
  # Lacie-backed source is retained temporarily at /srv/nas-01/downloads/media-downloads
  # as a rollback copy after the 2026-06-18 cutover.
  - path: /srv/media-downloads
    src: "UUID=ff4505f4-604a-4d7a-aeea-5183197649ab"
    fstype: ext4
    opts: "noatime,nofail,x-systemd.device-timeout=60s"
    owner: johnny
    group: johnny
    mode: "0775"
    reserved_blocks_percentage: 0

  # --- Bind Mounts ---

  # Plex library (bind from mergerfs pool)
  - path: /srv/plex-library
    src: /srv/media/plex
    fstype: none
    opts: "bind,nofail,x-systemd.requires-mounts-for=/srv/media"

  # NAS-ZFS accessible at /mnt/nas-zfs (for Samba shares that reference /mnt paths)
  - path: /mnt/nas-zfs
    src: /srv/nas-zfs
    fstype: none
    opts: "rbind,nofail"
    owner: johnny
    group: johnny
# Retired bind mounts from the old Pi NFS configs workflow.
filesystem_mounts_absent:
  - path: /srv/nas-02
  - path: /srv/exports/configs
  - path: /srv/exports/ansible

filesystem_crypttab_absent:
  - nas02_crypt
