# =============================================================================
# NAS Server - ZFS Configuration (Sanoid + Scrub + Tuning)
# =============================================================================
# Portable: applies to whichever host is in the [nas_server] group

# Sanoid templates define retention policies
sanoid_templates:
  # Production template - frequent snapshots for critical data
  production:
    frequently: 0
    hourly: 24
    daily: 7
    weekly: 4
    monthly: 6
    yearly: 0
    autosnap: "yes"
    autoprune: "yes"

  # Media template - less frequent snapshots for backups with own versioning
  media:
    frequently: 0
    hourly: 0
    daily: 7
    weekly: 4
    monthly: 3
    yearly: 0
    autosnap: "yes"
    autoprune: "yes"

  # Ignore template - no snapshots for replaceable content
  ignore:
    autosnap: "no"
    autoprune: "yes"

# Dataset configurations
# Key = ZFS dataset name, value = configuration
sanoid_datasets:
  # Root dataset - production policy, process children only
  nas_zfs:
    use_template: production
    recursive: "yes"
    process_children_only: "yes"

  # Critical datasets - inherit production from parent
  nas_zfs/configs:
    use_template: production
    recursive: "no"

  nas_zfs/appdata:
    use_template: production
    recursive: "no"

  nas_zfs/files:
    use_template: production
    recursive: "no"

  nas_zfs/nextcloud:
    use_template: production
    recursive: "no"

  # VM-local transient disks - no snapshots; contents are generated/retryable.
  nas_zfs/vmdata:
    use_template: ignore
    recursive: "yes"

  # Backups dataset - less frequent (contains Time Machine with own versioning)
  nas_zfs/backups:
    use_template: media
    recursive: "yes"
    process_children_only: "no"

  # Media parent - production policy for future photos dataset
  nas_zfs/media:
    use_template: production
    recursive: "yes"
    process_children_only: "yes"

  # Plex - ignore (replaceable)
  nas_zfs/media/plex:
    use_template: ignore
    recursive: "yes"

  # Podcasts - ignore (replaceable)
  nas_zfs/media/podcasts:
    use_template: ignore
    recursive: "yes"

  # Photos - production snapshots (irreplaceable personal data)
  nas_zfs/media/photos:
    use_template: production
    recursive: "no"

  # Media drive 01 - 3TB single drive (replaceable content)
  media-01:
    use_template: media
    recursive: "yes"
    process_children_only: "no"

  # Plex on media-01 - ignore (replaceable)
  media-01/media/plex:
    use_template: ignore
    recursive: "yes"

  # Media drive 02 - 3TB single drive (replaceable content)
  media-02:
    use_template: media
    recursive: "yes"
    process_children_only: "no"

  # Plex on media-02 - ignore (replaceable)
  media-02/media/plex:
    use_template: ignore
    recursive: "yes"

# =============================================================================
# ZFS Scrub Schedule
# =============================================================================

# Pools to scrub (all pools on the NAS)
zfs_pools:
  - nas_zfs
  - media-01
  - media-02

# Scrub schedule (systemd OnCalendar format)
zfs_scrub_schedule: "Sun *-*-* 02:00:00"

# =============================================================================
# ZFS ARC Tuning
# =============================================================================

# ARC max size in bytes (4GB - leaves room for VMs on ts440 after openclaw moved over)
# Bumped after ts440 RAM upgrade from 16GB -> 32GB, then trimmed as VM footprint grew.
# Monitor with: cat /proc/spl/kstat/zfs/arcstats | grep -E '^size|^c_max'
zfs_arc_max_bytes: 4294967296

# =============================================================================
# ZFS Dataset Properties (documentation + validation)
# =============================================================================
# These properties define how each dataset should be configured.
# Enforced by playbooks/storage/zfs.yml - automatically fixes drift via zfs set.
# On a new NAS, use these values when creating datasets:
#   zfs create -o compression=lz4 -o acltype=posixacl nas_zfs

zfs_dataset_properties:
  nas_zfs:
    compression: lz4
    acltype: posixacl
  nas_zfs/appdata:
    recordsize: 16K
    atime: "off"
  nas_zfs/backups:
    recordsize: 1M
    compression: zstd
    acltype: posixacl
  nas_zfs/backups/timemachine:
    quota: 1T
    recordsize: 1M
    compression: zstd
  nas_zfs/configs:
    recordsize: 128K
    compression: zstd
    acltype: posixacl
  nas_zfs/files:
    recordsize: 128K
    compression: zstd
  nas_zfs/media/plex:
    recordsize: 1M
    atime: "off"
  media-01:
    compression: lz4
    atime: "off"
    recordsize: 1M
    acltype: posixacl
  media-02:
    compression: lz4
    atime: "off"
    recordsize: 1M
    acltype: posixacl
  nas_zfs/nextcloud:
    recordsize: 128K
    compression: zstd
    acltype: posixacl
  nas_zfs/vmdata:
    mountpoint: none
    compression: lz4
    atime: "off"

zfs_datasets_present:
  - name: nas_zfs/vmdata
    properties:
      mountpoint: none
      compression: lz4
      atime: "off"

# =============================================================================
# ZFS ACLs (POSIX ACLs for shared access)
# =============================================================================
# Required for Nextcloud External Storage (www-data UID 33) and Samba (smbusers)
# Without these, Nextcloud and Samba break on a new NAS.
# Normal playbook runs apply ACLs to dataset roots and default ACLs for new files.
# Set zfs_acl_recursive_repair: true for a one-time repair of existing file trees.

zfs_acls:
  - path: /srv/nas-zfs/configs
    entries:
      - entity: 33
        etype: user
        permissions: rwx
        state: present
      - entity: smbusers
        etype: group
        permissions: rwx
        state: present
    default_entries:
      - entity: 33
        etype: user
        permissions: rwx
        default: true
        state: present
      - entity: smbusers
        etype: group
        permissions: rwx
        default: true
        state: present

  # Immich photos - read-only access for Nextcloud External Storage
  - path: /srv/nas-zfs/media/photos
    entries:
      - entity: 33
        etype: user
        permissions: rx
        state: present
    default_entries:
      - entity: 33
        etype: user
        permissions: rx
        default: true
        state: present
