# =============================================================================
# Proxmox Nodes - Shared Variables
# =============================================================================

# Proxmox migrations use root SSH between cluster nodes. Keep root SSH disabled
# by default, then allow key-only root login from cluster LAN peers via
# ssh-hardening.yml's Match Address block.
ssh_permit_root_login: "no"
ssh_root_login_match_policy: prohibit-password
ssh_root_login_match_addresses: "{{ pve_cluster_nodes | map(attribute='address') | list }}"

pve_cluster_nodes:
  - address: 192.168.1.146
    names:
      - johnnys-ts440
      - Johnnys-TS440
  - address: 192.168.1.134
    names:
      - pve-m70q
  - address: 192.168.1.220
    names:
      - pve-alto
  - address: 192.168.1.120
    names:
      - pve-herc

# Enable SMART disk monitoring
smartd_enabled: true

# Blacklist Proxmox packages from unattended-upgrades
# These should only be upgraded manually/coordinated to avoid cluster breakage
unattended_upgrades_blacklist:
  - "pve-*"
  - "proxmox-*"
  - "ceph-*"
  - "corosync*"
  - "pve-kernel-*"
  - "pve-firmware"
  - "qemu-server"
  - "libpve-*"

# Disable random delay for auto-updates — stagger is per-host in host_vars
auto_updates_randomized_delay_sec: "0"

# Reboot after weekly updates only when the live Proxmox vote count proves that
# removing this node cannot drop the cluster below quorum. Per-host schedules
# provide one-hour slots so normal upgrades and reboots finish sequentially.
# The shared /etc/pve lock prevents simultaneous reboots if timers drift or the
# script is triggered manually on more than one node.
auto_updates_reboot_if_required: true
auto_updates_proxmox_quorum_guard: true
auto_updates_proxmox_reboot_lock_dir: /etc/pve/priv/auto-updates-reboot.lock.d
auto_updates_proxmox_reboot_lock_max_age_sec: 1800

# Proxmox hosts should prefer reclaiming page cache over swapping QEMU guest RAM.
proxmox_sysctl_settings:
  vm.swappiness: 10

# PBS backup job (every 6 hours to pbs-main).
# Exclude PBS itself plus stopped/retired guests that should not consume the
# small shared PBS/Time Machine datastore.
pbs_backup_schedule: "*/6:00"
pbs_backup_exclude: "100,103,104,105,142"

# HA disabled cluster-wide. Provides no value (no HA resources configured) and
# adds risk (watchdog fencing). Re-enable: set true and re-run playbooks/proxmox/proxmox-ha.yml.
pve_ha_enabled: false
