---
# Redacted Docker inventory for isolated agent runtimes, including Hermes.
# Keep disabled until each consumer has a dedicated key and the live rollout is
# explicitly approved. Docker socket access remains confined to the root-owned
# reporter; the SSH account can only read the generated report.

agent_docker_report_enabled: false
agent_docker_report_rollout_approved: false
agent_docker_report_user: agent-report
agent_docker_report_group: agent-report
agent_docker_report_socket: /var/run/docker.sock
agent_docker_report_on_boot_sec: 2m
agent_docker_report_interval: 5m
agent_docker_report_randomized_delay: 30s

# Populate only with dedicated per-runtime report-reader keys and the exact
# source CIDRs of approved runtimes. Do not reuse a human or Ansible key.
agent_docker_report_authorized_keys: []
agent_docker_report_source_cidrs: []
