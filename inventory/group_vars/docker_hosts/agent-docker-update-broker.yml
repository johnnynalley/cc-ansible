---
# Approval-gated Docker updates for isolated agent runtimes, including Hermes.
# This remains disabled until the read-only reporter is live, a separate update
# key exists, and the owner approves a host canary and at least one target.

agent_docker_update_broker_enabled: false
agent_docker_update_broker_rollout_approved: false
agent_docker_update_broker_plan_ttl_seconds: 1800
agent_docker_update_broker_approval_ttl_seconds: 900
agent_docker_update_broker_proposal_cooldown_seconds: 300
agent_docker_update_broker_command_timeout_seconds: 900
agent_docker_update_broker_health_poll_seconds: 5

# Populate only with a dedicated update-request key and the exact Tailscale
# source CIDR of the isolated Gateway. Never reuse the report-reader, human,
# controller, or Ansible key.
agent_docker_update_broker_authorized_keys: []
agent_docker_update_broker_source_cidrs: []

# Targets are explicit single-service stateless transactions. The broker
# requires numeric non-root execution, a read-only root filesystem, all
# capabilities dropped, no-new-privileges, and a health check. It rejects all
# mounts, devices, build contexts, secrets, configs, shared namespaces, and
# image-declared volumes. Stateful services require a separate
# application-native backup/restore design before they can be added.
# Paths, Compose files, dependent recreates, and health checks are selected
# here by the operator, never by Astra. Example shape (do not enable without a
# reviewed host-specific entry):
# agent_docker_update_broker_targets:
#   example.stateless-service:
#     projectDir: /opt/example-stack
#     composeFiles: [docker-compose.yml]
#     backupFiles: [docker-compose.yml, .env]
#     service: app
#     recreateServices: [app]
#     verifyServices: [app]
#     requiredPaths: []
#     healthTimeoutSeconds: 180
#     updateClass: stateless-image
agent_docker_update_broker_targets: {}
