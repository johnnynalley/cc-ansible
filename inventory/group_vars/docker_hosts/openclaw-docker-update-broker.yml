---
# Approval-gated Docker updates for the future dedicated OpenClaw runtime.
# This remains disabled until the isolated Gateway and report-reader key are
# live, a separate update key exists, and the owner approves a host canary.

openclaw_docker_update_broker_enabled: false
openclaw_docker_update_broker_rollout_approved: false
openclaw_docker_update_broker_user: openclaw-update
openclaw_docker_update_broker_group: openclaw-update
openclaw_docker_update_broker_home: /var/lib/openclaw-docker-update-request
openclaw_docker_update_broker_state_dir: /var/lib/openclaw-docker-update
openclaw_docker_update_broker_config_dir: /etc/openclaw-docker-update
openclaw_docker_update_broker_plan_ttl_seconds: 1800
openclaw_docker_update_broker_approval_ttl_seconds: 900
openclaw_docker_update_broker_proposal_cooldown_seconds: 300
openclaw_docker_update_broker_command_timeout_seconds: 900
openclaw_docker_update_broker_health_poll_seconds: 5

# Populate only with a dedicated update-request key and the exact Tailscale
# source CIDR of the isolated Gateway. Never reuse the report-reader, human,
# controller, or Ansible key.
openclaw_docker_update_broker_authorized_keys: []
openclaw_docker_update_broker_source_cidrs: []

# Targets are explicit service transactions. Paths, Compose files, dependent
# recreates, and health checks are selected here by the operator, never by
# Astra. Example shape (do not enable without a reviewed host-specific entry):
# openclaw_docker_update_broker_targets:
#   media-stack.gluetun:
#     projectDir: /opt/media-stack
#     composeFiles: [docker-compose.yml]
#     backupFiles: [docker-compose.yml, .env]
#     service: gluetun
#     recreateServices: [gluetun, qbittorrent]
#     verifyServices: [gluetun, qbittorrent]
#     requiredPaths: [/srv/archive]
#     healthTimeoutSeconds: 180
openclaw_docker_update_broker_targets: {}
